<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Craving SOS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: #FFF8EE; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <div style="height: 52px; margin-top: 50px; padding: 0 26px 0 16px; display: flex; align-items: center; gap: 12px; flex: none">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 0; padding: 0; background: {{t.card2}}; color: #FFF8EE; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg>
    </button>
    <div role="progressbar" aria-label="Setup progress" aria-valuenow="43" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; position: relative; height: 8px; border-radius: 99px; background: rgba(255,255,255,0.22)">
      <div style="height: 8px; border-radius: 99px; background: #FFF8EE; {{bar}}"></div>
      <div style="position: absolute; top: -3px; width: 14px; height: 14px; box-sizing: border-box; border-radius: 99px; background: #FFC93C; box-shadow: inset 0 0 0 2px #F29A2E, 0 0 0 2px {{t.ring}}, 0 0 10px 3px rgba(255,201,60,0.5); {{knob}}"></div>
    </div>
  </div>

  <div style="padding: 16px 22px 0 22px; display: flex; flex-direction: column; flex-grow: 1">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.06; letter-spacing: -1px; text-wrap: balance; text-align: center; {{a0}}"><span style="display: block">When a craving hits,</span><span style="position: relative; display: inline-block">Jelli has you.<svg width="100%" height="12" viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: -9px; overflow: visible"><path d="M3 10 C40 4 90 5 122 7 C152 9 178 11 197 4" fill="none" stroke="#FFD966" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="{{markOff}}" style="transition: stroke-dashoffset 520ms cubic-bezier(.2,.7,.2,1) 350ms"></path></svg></span></h1>

    <div style="margin-top: 26px; height: 256px; display: flex; align-items: center; justify-content: center; flex: none; {{a1}}">
      <div style="position: relative; width: 248px; height: 248px; {{breath}}">
        <svg width="248" height="248" viewBox="0 0 248 248" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible">
          <circle cx="124" cy="124" r="{{swellR}}" fill="{{t.swellC}}" fill-opacity="{{t.swell}}"><animate attributeName="r" values="{{swellV}}" keyTimes="0;0.4;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="10s" repeatCount="indefinite"></animate></circle>
          <circle cx="124" cy="124" r="120" fill="none" stroke="#FFF8EE" stroke-opacity="0.36" stroke-width="3.5"></circle>
          <circle cx="124" cy="124" r="120" fill="none" stroke="#FFF8EE" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="{{arcOff}}" transform="rotate(-90 124 124)" style="filter: drop-shadow(0 0 8px rgba(255,248,238,0.5))"><animate attributeName="stroke-dashoffset" values="{{arcV}}" keyTimes="0;0.4;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="10s" repeatCount="indefinite"></animate></circle>
        </svg>
        <div style="position: absolute; left: 52px; top: 20px; width: 144px; height: 144px"><dc-import name="Jelli" mood="breathe" stage="1" animate="{{motionStr}}" size="144" hint-size="144px,144px"></dc-import></div>
        <div aria-live="polite" style="position: absolute; left: 0; right: 0; top: 184px; height: 30px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; line-height: 30px; letter-spacing: -0.5px; text-align: center">
          <div style="position: absolute; left: 0; right: 0; top: 0; {{inStyle}}">Breathe in</div>
          <div style="position: absolute; left: 0; right: 0; top: 0; {{outStyle}}">and out</div>
        </div>
      </div>
    </div>

    <p style="margin: 22px auto 0 auto; font-size: 17px; font-weight: 500; line-height: 1.5; text-align: center; color: #FFF8EE; {{a3}}"><span style="display: block">In for 4, out for 6.</span><span style="display: block">Most cravings pass in a few minutes.</span></p>

    <div style="margin-top: auto; margin-bottom: auto; padding-bottom: 6px; display: flex; flex-direction: column; align-items: center; gap: 12px; {{a4}}">
      <div role="img" aria-label="Craving SOS is the raised button in the middle of your tab bar" style="position: relative; width: 300px; height: 62px; border-radius: 20px; background: {{t.bar}}; box-shadow: inset 0 0 0 1px rgba(255,248,238,0.18); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; color: {{t.barIcon}}">
        <div style="display: flex; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16a4 4 0 100-8 4 4 0 000 8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg></div>
        <div style="display: flex; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4.5L3.5 6.8v12.7L9 17.2l6 2.3 5.5-2.3V4.5L15 6.8zM9 4.5v12.7M15 6.8v12.7"></path></svg></div>
        <div style="position: relative; height: 62px">
          <div style="position: absolute; left: 50%; top: -28px; width: 66px; height: 66px; margin-left: -33px; border-radius: 99px; border: 2px solid rgba(255,248,238,0.5); box-sizing: border-box; {{pulse}}"></div>
          <div style="position: absolute; left: 50%; top: -20px; width: 50px; height: 50px; margin-left: -25px; border-radius: 99px; background: #FFF8EE; color: #1F3C8C; box-shadow: 0 6px 16px rgba(8,18,52,0.4); display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14c2.5-3 5-3 7.5 0s5 3 7.5 0 2.5-1.5 3-1.5M3 9c2.5-3 5-3 7.5 0s5 3 7.5 0"></path></svg>
          </div>
          <span style="position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 13px; font-weight: 700; letter-spacing: 0.2px; color: #FFF8EE">SOS</span>
        </div>
        <div style="display: flex; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14zM5 19l7-7"></path></svg></div>
        <div style="display: flex; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></div>
      </div>
      <p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.42; text-align: center; color: rgba(255,248,238,0.88)"><span style="display: block">Craving SOS is one tap away in your tab bar.</span><span style="display: block">In prep, you'll plan for coffee and stress.</span></p>
    </div>
  </div>

  <div style="padding: 0 22px 34px 22px; flex: none">
    <button style="width: 100%; height: 58px; border-radius: 999px; border: 0; background: #FFF8EE; color: {{t.btnFg}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.1px; box-shadow: 0 6px 18px rgba(255,248,238,0.22); {{a5}}">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timers = [];
    this.setState({ prog: false });
    this.timers.push(setTimeout(() => this.setState({ on: true, prog: true }), 250));
    this.breathe(true);
  }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); clearTimeout(this.breath); }
  breathe(inhale) {
    this.setState({ inhale });
    this.breath = setTimeout(() => this.breathe(!inhale), inhale ? 4000 : 6000);
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const inhale = motion ? (s.inhale ?? true) : true;
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const settle = 'cubic-bezier(.2,.8,.2,1)';
    const breathEase = 'cubic-bezier(.45,0,.55,1)';
    const a = (i) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 18}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 600ms ${ease} ${i * 90}ms`;
    const p = !motion || s.prog ? 43 : 36;
    const t = dark
      ? { bg: 'radial-gradient(120% 55% at 50% -8%, rgba(160,190,255,0.10), rgba(160,190,255,0) 62%), linear-gradient(180deg, #13295F 0%, #0E1F4C 50%, #0A1638 100%)', ring: '#13295F', muted: '#C9D6FF', card: '#152A6A', card2: '#1B3378', btnFg: '#0B1A4A', bar: 'rgba(255,248,238,0.08)', barIcon: 'rgba(255,248,238,0.7)', swell: 0.07, swellC: '#FFF8EE' }
      : { bg: 'radial-gradient(120% 55% at 50% -8%, rgba(255,255,255,0.12), rgba(255,255,255,0) 62%), linear-gradient(180deg, #2F5CBA 0%, #2649A2 45%, #1F3C8C 100%)', ring: '#3A68C8', muted: '#EEF2FC', card: '#2A4A9E', card2: '#2F52AA', btnFg: '#1F3C8C', bar: 'rgba(255,255,255,0.14)', barIcon: 'rgba(255,248,238,0.78)', swell: 0.2, swellC: '#0A1A55' };
    return {
      t, motionStr: String(motion),
      markOff: on ? 0 : 1,
      bar: `width: ${p}%; transition: width 900ms ${settle}`,
      knob: `left: calc(${p}% - 7px); transition: left 900ms ${settle}`,
      breath: motion ? `transform: scale(${inhale ? 1.04 : 0.88}); transition: transform ${inhale ? 4000 : 6000}ms ${breathEase}` : 'transform: scale(0.96)',
      swellR: 100,
      swellV: motion ? '64;116;64' : '104;104;104',
      arcOff: motion ? 754 : 226,
      arcV: motion ? '754;0;754' : '226;226;226',
      pulse: motion ? `opacity: ${inhale ? 0.9 : 0}; transform: scale(${inhale ? 1 : 1.25}); transition: opacity ${inhale ? 4000 : 6000}ms ${breathEase}, transform ${inhale ? 4000 : 6000}ms ${breathEase}` : 'opacity: 0.6',
      inStyle: `opacity: ${inhale ? 1 : 0}; transition: opacity 600ms ${ease}`,
      outStyle: `opacity: ${inhale ? 0 : 1}; transition: opacity 600ms ${ease}`,
      a0: a(0), a1: a(1), a2: a(2), a3: a(3), a4: a(4), a5: a(5)
    };
  }
}
</script>
</body>
</html>
