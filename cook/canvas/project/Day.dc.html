<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.g}}; color: {{t.fg}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <div style="height: 52px; margin-top: 50px; padding: 0 26px 0 16px; display: flex; align-items: center; gap: 12px; flex: none">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 0; padding: 0; background: {{t.card2}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg>
    </button>
    <div role="progressbar" aria-label="Setup progress" aria-valuenow="71" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; position: relative; height: 8px; border-radius: 99px; background: {{t.track}}">
      <div style="height: 8px; border-radius: 99px; background: {{t.fg}}; {{bar}}"></div>
      <div style="position: absolute; top: -3px; width: 14px; height: 14px; box-sizing: border-box; border-radius: 99px; background: #FFC93C; box-shadow: inset 0 0 0 2px #F29A2E, 0 0 0 2px {{t.g}}, 0 0 10px 3px rgba(255,201,60,0.5); {{knob}}"></div>
    </div>
  </div>

  <div style="padding: 16px 22px 0 22px; display: flex; flex-direction: column; flex-grow: 1">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.06; letter-spacing: -1px; text-wrap: balance; {{a0}}">Each day opens and closes the <span style="position: relative; display: inline-block">same way<svg width="100%" height="12" viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: -9px; overflow: visible"><path d="M3 10 C40 4 90 5 122 7 C152 9 178 11 197 4" fill="none" stroke="{{t.mark}}" stroke-width="4" stroke-linecap="round"></path></svg></span></h1>

    <section aria-label="Morning, with Xero" style="margin-top: 22px; border-radius: 24px; overflow: hidden; background: {{t.mBody}}; box-shadow: {{t.mEdge}}; display: flex; flex-direction: column; {{a1}}">
      <div style="position: relative; height: 80px; flex: none">
        <dc-import name="Horizon2" scene="dawn" clouds="false" sun-x="292" sun-r="32" sun-dy="-4" w="346" h="80" fit="xMidYMid slice" animate="{{motionStr}}" hint-size="346px,80px"></dc-import>
        <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: {{t.dawnDim}}"></div>
        <div style="position: absolute; width: 70px; height: 70px; {{xeroPos}}"><dc-import name="Xero" mood="hello" stage="1" animate="{{motionStr}}" size="70" hint-size="70px,70px"></dc-import></div>
      </div>
      <div style="padding: 14px 18px 16px 18px; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: {{t.mMuted}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.sunIc}}" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 16a4 4 0 100-8 4 4 0 000 8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg><b style="font-weight: 700; color: {{t.fg}}">Morning</b> with Xero</span>
          <span style="height: 30px; padding: 0 12px; border-radius: 99px; background: {{t.holdBg}}; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: {{t.holdFg}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 013 0V11M12 10V4.5a1.5 1.5 0 013 0V11M15 10.5V6.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-1a6 6 0 01-5-2.7l-2.6-4a1.6 1.6 0 012.6-1.8L9 14"></path></svg>10-second hold</span>
        </div>
        <span style="margin-top: 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.22; letter-spacing: -0.2px">“Today, I won't use nicotine.”</span>
        <span style="font-size: 15px; font-weight: 500; line-height: 1.42; color: {{t.mMuted}}">Because: to keep up with Maya at the park</span>
      </div>
    </section>

    <section aria-label="Night, with Glim" style="margin-top: 18px; border-radius: 24px; overflow: hidden; background: {{n.body}}; color: #F6EFE2; box-shadow: {{n.edge}}; display: flex; flex-direction: column; {{a2}}">
      <div style="position: relative; height: 80px; flex: none">
        <dc-import name="NightSky" theme="{{themeStr}}" dawn="false" hills="true" flies="0" moon-x="290" moon-y="28" moon-r="12" fade="false" w="346" h="80" animate="{{motionStr}}" hint-size="346px,80px"></dc-import>
        <div style="position: absolute; left: 70px; top: 2px; width: 70px; height: 70px"><dc-import name="Glim2" mood="hello" stage="1" animate="{{motionStr}}" size="70" hint-size="70px,70px"></dc-import></div>
      </div>
      <div style="padding: 14px 18px 16px 18px; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: {{n.muted}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="#FFD37A" aria-hidden="true"><path d="M19 14.5A7.5 7.5 0 019.5 5a7.5 7.5 0 109.5 9.5z"></path></svg><b style="font-weight: 700; color: #F6EFE2">Night</b> with Glim</span>
          <span style="height: 30px; padding: 0 12px; border-radius: 99px; background: rgba(255,255,255,0.1); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #F6EFE2"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>One minute</span>
        </div>
        <span style="margin-top: 4px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.22; letter-spacing: -0.2px">How was today, really?</span>
        <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <button style="border: 0; padding: 0; background: none; color: #F6EFE2; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="{{n.face}}"></circle><circle cx="15" cy="16.5" r="2" fill="#F6EFE2"></circle><circle cx="25" cy="16.5" r="2" fill="#F6EFE2"></circle><path d="M14 27 Q20 22 26 27" fill="none" stroke="#F6EFE2" stroke-width="2.8" stroke-linecap="round"></path></svg>
            <span style="font-size: 13px; font-weight: 600; opacity: 0.85">Rough</span>
          </button>
          <button style="border: 0; padding: 0; background: none; color: #F6EFE2; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="{{n.face}}"></circle><circle cx="15" cy="16.5" r="2" fill="#F6EFE2"></circle><circle cx="25" cy="16.5" r="2" fill="#F6EFE2"></circle><path d="M14 25 L26 25" fill="none" stroke="#F6EFE2" stroke-width="2.8" stroke-linecap="round"></path></svg>
            <span style="font-size: 13px; font-weight: 600; opacity: 0.85">Okay</span>
          </button>
          <button style="border: 0; padding: 0; background: none; color: #F6EFE2; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="20" fill="{{n.face}}"></circle><circle cx="15" cy="16.5" r="2" fill="#F6EFE2"></circle><circle cx="25" cy="16.5" r="2" fill="#F6EFE2"></circle><path d="M14 23.5 Q20 28 26 23.5" fill="none" stroke="#F6EFE2" stroke-width="2.8" stroke-linecap="round"></path></svg>
            <span style="font-size: 13px; font-weight: 600; opacity: 0.85">Good</span>
          </button>
          <button aria-pressed="true" style="border: 0; padding: 0; background: none; color: #F6EFE2; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px">
            <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="#3A3A3A" fill-opacity="0" stroke="#FFD37A" stroke-width="3"></circle><circle cx="20" cy="20" r="17" fill="#FFD37A" fill-opacity="0.2"></circle><circle cx="15" cy="16.5" r="2" fill="#FFD37A"></circle><circle cx="25" cy="16.5" r="2" fill="#FFD37A"></circle><path d="M13 22.5 Q20 31 27 22.5" fill="none" stroke="#FFD37A" stroke-width="2.8" stroke-linecap="round"></path></svg>
            <span style="font-size: 13px; font-weight: 700; color: #FFD37A">Proud</span>
          </button>
        </div>
      </div>
    </section>

    <p style="margin: auto 0; padding: 12px 0; font-size: 15px; font-weight: 500; line-height: 1.42; text-align: center; color: {{t.muted}}; {{a3}}">Miss one and nothing breaks. No guilt, ever.</p>
  </div>

  <div style="padding: 0 22px 34px 22px; flex: none">
    <button style="width: 100%; height: 58px; border-radius: 999px; border: 0; background: {{t.btn}}; color: {{t.btnFg}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.1px; box-shadow: {{t.btnShadow}}; {{a4}}">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  play() {
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
    this.setState({ on: false, prog: false });
    this.timers.push(setTimeout(() => this.setState({ on: true, prog: true }), 250));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 12000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const settle = 'cubic-bezier(.2,.8,.2,1)';
    const a = (i) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : (i === 2 ? 48 : 18)}px); transition: opacity ${i === 2 ? 900 : 600}ms ${i === 2 ? settle : ease} ${i === 2 ? 500 : i * 90}ms, transform ${i === 2 ? 900 : 600}ms ${i === 2 ? settle : ease} ${i === 2 ? 500 : i * 90}ms`;
    const p = !motion || s.prog ? 71 : 64;
    const t = dark
      ? { g: '#0E1322', fg: '#FFF8EE', muted: '#B3BACC', card2: '#212A41', track: 'rgba(255,255,255,0.14)', mBody: '#262029', mEdge: 'inset 0 0 0 1px rgba(255,195,138,0.38)', mMuted: '#CFC8C2', mark: '#FF8A65', sunIc: '#FFC93C', holdBg: 'rgba(255,178,122,0.18)', holdFg: '#FFD2B0', dawnDim: 'rgba(14,19,34,0)', btn: '#FFF8EE', btnFg: '#0E1322', btnShadow: '0 6px 18px rgba(255,248,238,0.14)' }
      : { g: '#FFC38A', fg: '#1E1A3A', muted: '#4A2810', card2: '#FFE8D3', track: 'rgba(30,26,58,0.14)', mBody: 'rgba(255,255,255,0.94)', mEdge: '0 8px 22px rgba(120,60,20,0.12)', mMuted: '#3E2E24', mark: '#FF7A55', sunIc: '#E2742F', holdBg: '#FFE2CF', holdFg: '#5A200A', dawnDim: 'rgba(0,0,0,0)', btn: '#1E1A3A', btnFg: '#FFF8EE', btnShadow: '0 6px 18px rgba(30,26,58,0.22)' };
    const n = dark
      ? { body: '#121D35', muted: '#C8CFE0', face: '#2F4270', edge: 'inset 0 0 0 1px rgba(255,255,255,0.1)' }
      : { body: '#17243F', muted: '#CBD2E4', face: '#33496F', edge: '0 8px 22px rgba(120,60,20,0.16)' };
    return {
      t, n, light: !dark, dark, themeStr: dark ? 'dark' : 'light', motionStr: String(motion),
      xeroPos: 'left: 56px; top: 4px',
      bar: `width: ${p}%; transition: width 900ms ${settle}`,
      knob: `left: calc(${p}% - 7px); transition: left 900ms ${settle}`,
      a0: a(0), a1: a(1), a2: a(2), a3: a(3), a4: a(4)
    };
  }
}
</script>
</body>
</html>
