<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Obstacles with evidence</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.g}}; color: {{t.fg}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <div style="height: 52px; margin-top: 50px; padding: 0 26px 0 16px; display: flex; align-items: center; gap: 12px; flex: none">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 0; padding: 0; background: {{t.navBtn}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></button>
    <div role="progressbar" aria-label="Setup progress" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; position: relative; height: 8px; border-radius: 99px; background: {{t.navTrack}}">
      <div style="height: 8px; width: 60%; border-radius: 99px; background: {{t.fg}}"></div>
      <div style="position: absolute; top: -3px; left: calc(60% - 7px); width: 14px; height: 14px; box-sizing: border-box; border-radius: 99px; background: #FFC93C; box-shadow: inset 0 0 0 2px #F29A2E, 0 0 10px 3px rgba(255,201,60,0.5)"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; flex-grow: 1; padding: 16px 22px 0 22px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.06; letter-spacing: -1px; text-wrap: balance">What usually gets in the way?</h1>
    <p style="margin: 10px 0 0 0; font-size: 16px; font-weight: 500; line-height: 1.5; color: {{t.muted}}">Pick any that might trip you up after Quit Day.</p>

    <div style="margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="8">
        <button aria-pressed="{{c.on}}" style="height: 44px; padding: 0 12px 0 9px; border: 0; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: {{c.fg}}; background: {{c.bg}}; box-shadow: {{c.ring}}"><span style="width: 24px; height: 24px; border-radius: 99px; flex: none; display: flex; align-items: center; justify-content: center; background: {{c.dot}}; color: {{c.ink}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.ic}}"></path></svg></span>{{c.t}}</button>
      </sc-for>
    </div>

    <div style="margin-top: auto; margin-bottom: 20px; position: relative">
      <div style="position: relative; background: {{t.solid}}; box-shadow: {{t.ring}}; border-radius: 20px; overflow: hidden">
        <p style="margin: 0; padding: 14px 16px 4px 16px; font-size: 15px; font-weight: 500; line-height: 1.4; color: {{t.muted}}"><b style="font-weight: 700; color: {{t.fg}}">2 picked.</b> Here’s what each one adds.</p>
        <sc-for list="{{adds}}" as="r" hint-placeholder-count="2">
          <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 2px 16px">
            <span style="width: 32px; height: 32px; border-radius: 99px; flex: none; display: flex; align-items: center; justify-content: center; background: {{t.badge}}; color: {{t.badgeFg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.ic}}"></path></svg></span>
            <span style="font-size: 15px; font-weight: 500; color: {{t.muted}}">{{r.a}}</span>
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="{{t.arrow}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M1 6h15M11.5 1.5L16 6l-4.5 4.5"></path></svg>
            <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.2px">{{r.b}}</span>
          </div>
        </sc-for>
        <div style="margin-top: 8px; background: {{t.tint}}; padding: 12px 16px 8px 16px; display: flex; flex-direction: column; gap: 8px">
          <p style="margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; text-wrap: pretty">Both are withdrawal, and it passes. Usually worst in week one, easing over two to four.</p>
          <div role="img" aria-label="Withdrawal is strongest in week 1 and eases by weeks 2 to 4" style="display: flex; flex-direction: column; gap: 4px">
            <svg width="100%" height="34" viewBox="0 0 314 34" preserveAspectRatio="none" aria-hidden="true" style="display: block"><path d="M0 34 L0 5 C46 4 70 5 96 11 C150 24 226 29 314 31 L314 34 Z" fill="{{t.area}}"></path><path d="M0 5 C46 4 70 5 96 11 C150 24 226 29 314 31" fill="none" stroke="{{t.barA}}" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></svg>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); font-size: 13px; font-weight: 600; color: {{t.muted}}"><span>Week 1</span><span>Week 2</span><span>Week 3</span><span>Week 4</span></div>
          </div>
          <a href="#" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 28px; font-size: 13px; font-weight: 600; color: {{t.muted}}; text-decoration: underline; text-underline-offset: 2px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 a9 9 0 1 0 0.01 0 M12 11 v6 M12 7.5 v0.5"></path></svg>Hughes, 2007 · people who stopped smoking</a>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 0 22px 22px 22px; flex: none; display: flex; flex-direction: column; gap: 2px">
    <button style="width: 100%; height: 58px; border-radius: 999px; border: 0; background: {{t.btn}}; color: {{t.btnFg}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; box-shadow: {{t.btnShadow}}">Continue</button>
    <button style="width: 100%; height: 44px; border: 0; background: transparent; color: {{t.fg}}; font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; font-size: 15px">Skip for now</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { g: '#0E1322', fg: '#FFF8EE', muted: '#B3BACC', card: '#1B2439', card2: '#212A41', tint: '#212A41', line: 'rgba(255,255,255,0.12)', ring: 'inset 0 0 0 1px rgba(255,255,255,0.22)', navBtn: 'rgba(255,255,255,0.14)', navTrack: 'rgba(255,255,255,0.2)', sel: '#FFF8EE', selFg: '#0E1322', badge: '#F26A45', badgeFg: '#FFF8EE', solid: '#182034', arrow: 'rgba(255,255,255,0.45)', barA: '#FF8A65', area: 'rgba(255,138,101,0.22)', btn: '#FFF8EE', btnFg: '#0E1322', btnShadow: '0 6px 18px rgba(255,248,238,0.14)' }
      : { g: '#FFC38A', fg: '#1E1A3A', muted: '#4A2810', card: '#FFFAF5', card2: '#FFE7D0', tint: '#FFEBDD', line: 'rgba(30,26,58,0.12)', ring: 'none', navBtn: 'rgba(255,255,255,0.72)', navTrack: 'rgba(30,26,58,0.24)', sel: '#1E1A3A', selFg: '#FFF8EE', badge: '#F26A45', badgeFg: '#FFF8EE', solid: '#FFFAF5', arrow: 'rgba(30,26,58,0.45)', barA: '#F2603C', area: 'rgba(242,96,60,0.2)', btn: '#1E1A3A', btnFg: '#FFF8EE', btnShadow: '0 6px 18px rgba(30,26,58,0.22)' };
    const I = {
      bolt: 'M13 3L5 13.5h6L10 21l8-10.5h-6z',
      people: 'M9 11a3 3 0 100-6 3 3 0 000 6zM3.5 19a5.5 5.5 0 0111 0M16 11a2.6 2.6 0 100-5.2M17 14.2a4.8 4.8 0 013.5 4.8',
      apple: 'M12 8c-2-1.6-6-1-6 3.5 0 4 2.6 7.5 4.5 7.5.8 0 1-.5 1.5-.5s.7.5 1.5.5c1.9 0 4.5-3.5 4.5-7.5 0-4.5-4-5.1-6-3.5zM12 8c0-2 1-3.5 2.5-4',
      scale: 'M5 5h14v14H5zM9 9.5a3.5 3.5 0 016 0M12 9.5l1.2-1.6',
      moon: 'M20 14A8 8 0 1110 4a6 6 0 0010 10z',
      wave: 'M3 9c3-3.5 6-3.5 9 0s6 3.5 9 0M3 15c3-3.5 6-3.5 9 0s6 3.5 9 0',
      target: 'M12 4a8 8 0 100 16 8 8 0 000-16zM12 9a3 3 0 100 6 3 3 0 000-6z',
      flag: 'M6 21V4M6 5h11l-2.5 4 2.5 4H6'
    };
    const check = 'M5.5 12.5l4.2 4L18.5 7.5';
    const chip = (label, ic, on) => ({ t: label, ic: on ? check : I[ic], on: String(on), fg: on ? t.selFg : t.fg, bg: on ? t.sel : t.card, ring: on ? 'none' : t.ring, dot: on ? t.badge : 'transparent', ink: on ? t.badgeFg : t.muted });
    return { t,
      adds: [{ a: 'Irritability', b: '1-minute reset', ic: I.bolt }, { a: 'Sleep', b: 'Night wind-down', ic: I.moon }],
      chips: [chip('Irritability', 'bolt', true), chip('Sleep', 'moon', true), chip('Hunger', 'apple', false), chip('Social pressure', 'people', false), chip('Restlessness', 'wave', false), chip('Weight', 'scale', false), chip('Focus', 'target', false), chip('Motivation', 'flag', false)] };
  }
}
</script>
</body>
</html>
