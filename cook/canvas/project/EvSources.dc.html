<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The research sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.scrim}}; color: {{t.fg}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; justify-content: flex-end">
  <div aria-hidden="true" style="position: absolute; left: -12px; top: -12px; width: 390px; height: 1120px; transform: scale(1.07); transform-origin: 50% 0; filter: blur(7px) saturate(0.7)"><dc-import name="EvPlan" theme="{{theme}}" hint-size="390px,1120px"></dc-import></div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: {{t.dim}}"></div>
  <div style="position: relative; background: {{t.sheet}}; box-shadow: {{t.sheetEdge}}; border-radius: 28px 28px 0 0; padding: 10px 22px 30px 22px; display: flex; flex-direction: column">
    <div style="width: 40px; height: 5px; border-radius: 99px; background: {{t.grab}}; align-self: center"></div>
    <div style="margin-top: 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.7px">The research</h1>
      <button aria-label="Close" style="width: 44px; height: 44px; border-radius: 99px; border: 0; padding: 0; background: {{t.card2}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 5 L19 19 M19 5 L5 19"></path></svg></button>
    </div>
    <p style="margin: 8px 0 0 0; font-size: 15px; font-weight: 500; line-height: 1.45; color: {{t.muted}}; text-wrap: pretty">Every number in DayXero comes from published research on ways of quitting, not from using DayXero, which hasn’t been tested in a clinical trial.</p>

    <div style="margin-top: 14px; display: flex; flex-direction: column">
      <sc-for list="{{items}}" as="s" hint-placeholder-count="6">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 66px; box-sizing: border-box; padding: 9px 0; border-top: 1px solid {{t.line}}; color: {{t.fg}}; text-decoration: none">
          <span style="width: 60px; height: 26px; border-radius: 99px; background: {{t.well}}; flex: none; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{t.fg}}">{{s.k}}</span>
          <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: -0.2px">{{s.t}}</span><span style="font-size: 14px; font-weight: 500; line-height: 1.35; color: {{t.muted}}; text-wrap: pretty">{{s.d}}</span></span>
          <span style="width: 32px; height: 32px; border-radius: 99px; background: {{t.well}}; flex: none; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5 h11 v11 M19 5 L6 18"></path></svg></span>
        </a>
      </sc-for>
    </div>
    <p style="margin: 12px 0 0 0; font-size: 13px; font-weight: 500; line-height: 1.45; color: {{t.muted}}">DayXero isn’t a medical device and doesn’t replace advice from a doctor or pharmacist.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { scrim: '#05070F', dim: 'rgba(3,5,12,0.62)', sheet: '#151C30', sheetEdge: 'inset 0 1px 0 rgba(255,255,255,0.16)', well: '#232C45', fg: '#FFF8EE', muted: '#B3BACC', card2: '#212A41', line: 'rgba(255,255,255,0.14)', grab: 'rgba(255,255,255,0.3)' }
      : { scrim: '#8A6648', dim: 'rgba(24,20,44,0.5)', sheet: '#FFFAF5', sheetEdge: 'none', well: '#FFEBDD', fg: '#1E1A3A', muted: '#4A2810', card2: '#FFE7D0', line: 'rgba(30,26,58,0.14)', grab: 'rgba(30,26,58,0.25)' };
    const items = [
      { t: 'Medicine plus support', k: 'Review', d: 'Cochrane, 52 trials, 2016. Support came from trained advisers.' },
      { t: 'Nicotine replacement', k: 'Review', d: 'Cochrane, 133 trials, 2018. People quitting cigarettes.' },
      { t: 'A patch plus a faster form', k: 'Review', d: 'Cochrane, 16 trials, 2023.' },
      { t: 'Reaching 28 days', k: 'NHS', d: 'NHS Better Health. The NHS does not cite a study for it.' },
      { t: 'Stopping all at once', k: 'Trial', d: 'One trial of 697 smokers, 2016, and a Cochrane review of 22 trials, 2019.' },
      { t: 'Withdrawal over time', k: 'Paper', d: 'Hughes, Nicotine and Tobacco Research, 2007.' }
    ];
    return { t, items, theme: dark ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
