<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Good company</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.g}}; color: {{t.fg}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <div style="height: 52px; margin-top: 50px; padding: 0 26px 0 16px; display: flex; align-items: center; gap: 12px; flex: none">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 0; padding: 0; background: {{t.navBtn}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></button>
    <div role="progressbar" aria-label="Setup progress" aria-valuenow="18" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; position: relative; height: 8px; border-radius: 99px; background: {{t.navTrack}}">
      <div style="height: 8px; width: 18%; border-radius: 99px; background: {{t.fg}}"></div>
      <div style="position: absolute; top: -3px; left: calc(18% - 7px); width: 14px; height: 14px; box-sizing: border-box; border-radius: 99px; background: #FFC93C; box-shadow: inset 0 0 0 2px #F29A2E, 0 0 10px 3px rgba(255,201,60,0.5)"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; padding: 0 26px 12px 26px">
    <div style="position: relative; width: 248px; height: 248px; flex: none">
      <div style="position: absolute; left: 0; top: 0; width: 248px; height: 248px; border-radius: 50%; overflow: hidden; background: {{discBg}}">
        <sc-if value="{{light}}" hint-placeholder-val="{{true}}"><dc-import name="Horizon2" scene="dawn" clarity="100" clouds="false" sun-x="250" sun-r="44" sun-dy="-10" w="248" h="248" fit="xMidYMax slice" animate="true" hint-size="248px,248px"></dc-import></sc-if>
        <sc-if value="{{dark}}" hint-placeholder-val="{{false}}"><dc-import name="NightSky" theme="dark" dawn="true" warm="true" stars="false" hills="true" sun-scale="1.7" sun-lift="10" sun-at="0.7" fade="false" w="248" h="248" animate="true" hint-size="248px,248px"></dc-import></sc-if>
      </div>
      <div style="position: absolute; width: 96px; height: 15px; border-radius: 50%; background: radial-gradient(closest-side, {{shadow}}, rgba(20,10,30,0)); left: 70px; top: 204px"></div>
      <div style="position: absolute; width: 120px; height: 120px; left: 58px; top: 96px; {{xeroFx}}"><dc-import name="Xero" mood="hello" stage="1" animate="true" size="120" hint-size="120px,120px"></dc-import></div>
    </div>

    <sc-if value="{{hasStat}}" hint-placeholder-val="{{true}}">
      <div style="margin-top: 22px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 76px; line-height: 0.95; letter-spacing: -3px; text-align: center">{{big}}</div>
      <div role="img" aria-label="{{big}}" style="margin-top: 14px; display: flex; gap: {{dotGap}}; justify-content: center"><sc-for list="{{dots}}" as="d" hint-placeholder-count="3"><span style="width: {{dotSz}}; height: {{dotSz}}; border-radius: 50%; box-sizing: border-box; {{d.s}}"></span></sc-for></div>
      <h1 style="margin: 16px 0 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.12; letter-spacing: -0.7px; text-align: center; text-wrap: balance">{{line}}</h1>
    </sc-if>
    <sc-if value="{{noStat}}" hint-placeholder-val="{{false}}">
      <h1 style="margin: 26px 0 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1; letter-spacing: -0.9px; text-align: center; text-wrap: balance">{{line}}</h1>
    </sc-if>
    <p style="margin: 14px 0 0 0; font-size: 16px; font-weight: 500; line-height: 1.5; text-align: center; color: {{t.muted}}; text-wrap: balance">{{sub}}</p>
    <sc-if value="{{hasStat}}" hint-placeholder-val="{{true}}">
      <a href="#" style="margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 13px; font-weight: 600; color: {{t.muted}}; text-decoration: underline; text-underline-offset: 2px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 a9 9 0 1 0 0.01 0 M12 11 v6 M12 7.5 v0.5"></path></svg>{{source}}</a>
    </sc-if>
  </div>

  <div style="padding: 0 22px 34px 22px; flex: none">
    <button style="width: 100%; height: 58px; border-radius: 999px; border: 0; background: {{t.btn}}; color: {{t.btnFg}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; box-shadow: {{t.btnShadow}}">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"product":{"editor":"enum","options":["cigarettes","vape","pouches"],"default":"cigarettes"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { g: '#0E1322', fg: '#FFF8EE', muted: '#B3BACC', navBtn: 'rgba(255,255,255,0.14)', navTrack: 'rgba(255,255,255,0.2)', mark: '#FF8A65', dotOff: 'rgba(255,255,255,0.4)', btn: '#FFF8EE', btnFg: '#0E1322', btnShadow: '0 6px 18px rgba(255,248,238,0.14)' }
      : { g: '#FFC38A', fg: '#1E1A3A', muted: '#4A2810', navBtn: 'rgba(255,255,255,0.72)', navTrack: 'rgba(30,26,58,0.24)', mark: '#F2603C', dotOff: 'rgba(30,26,58,0.38)', btn: '#1E1A3A', btnFg: '#FFF8EE', btnShadow: '0 6px 18px rgba(30,26,58,0.22)' };
    const product = this.props.product ?? 'cigarettes';
    const copy = {
      cigarettes: { big: '2 in 3', line: 'people who smoke want to quit', sub: 'Wanting to stop is the normal thing. Staying stopped is the hard part, so that is what we will plan for.', source: 'CDC, 2022 survey of US adults' },
      vape: { big: '6 in 10', line: 'adults who vape intend to quit', sub: 'You are in good company. Research on quitting vapes is still early, so when a fact comes from smoking research, I will say so.', source: 'US PATH Study, 2017 to 2018' },
      pouches: { big: '', line: 'Good to have you here', sub: 'Research on quitting pouches is still thin. When a fact comes from smoking research, I will say so, and the rest of your plan is built from your own answers.', source: '' }
    }[product];
    const hasStat = copy.big.length > 0;
    const nm = (copy.big.match(/\d+/g) || [0, 0]).map(Number);
    const dots = Array.from({ length: nm[1] }, (_, i) => ({ s: i < nm[0] ? `background: ${t.mark}` : `box-shadow: inset 0 0 0 2.5px ${t.dotOff}` }));
    return { t, dots, dotSz: nm[1] > 5 ? '16px' : '22px', dotGap: nm[1] > 5 ? '7px' : '10px', light: !dark, dark, hasStat, noStat: !hasStat, big: copy.big, line: copy.line, sub: copy.sub, source: copy.source,
      discBg: dark ? '#1F2950' : '#FFD3A6', shadow: dark ? 'rgba(0,0,0,0.55)' : 'rgba(80,20,10,0.35)',
      xeroFx: dark ? 'filter: brightness(0.96) drop-shadow(4px -2px 8px rgba(255,170,90,0.45))' : 'filter: drop-shadow(0 0 2.5px rgba(255,248,238,0.95)) drop-shadow(0 6px 10px rgba(120,30,10,0.22))' };
  }
}
</script>
</body>
</html>
