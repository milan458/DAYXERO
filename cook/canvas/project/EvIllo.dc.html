<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evidence objects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<svg width="{{size}}" height="{{size}}" viewBox="0 0 64 64" aria-hidden="true" style="display: block; overflow: visible; filter: drop-shadow(0 2px 2px {{shade}})">
  <sc-if value="{{is.patch}}" hint-placeholder-val="{{true}}">
    <g transform="rotate(-8 32 32)">
      <rect x="8" y="8" width="48" height="48" rx="14" fill="{{coral}}"></rect>
      <path d="M8 34 V22 a14 14 0 0 1 14 -14 h12" fill="none" stroke="#FFB09C" stroke-width="3" stroke-linecap="round" opacity="0.75" transform="translate(4 4)"></path>
      <rect x="19" y="19" width="26" height="26" rx="7" fill="none" stroke="#FFF8EE" stroke-width="2.5" stroke-dasharray="4 4" stroke-linecap="round"></rect>
      <path d="M32 27 v10 M27 32 h10" fill="none" stroke="#FFF8EE" stroke-width="3" stroke-linecap="round"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.bubble}}" hint-placeholder-val="{{false}}">
    <g transform="rotate(6 32 32)">
      <path d="M13 9 h38 a9 9 0 0 1 9 9 v21 a9 9 0 0 1 -9 9 H31 l-13 10 v-10 h-5 a9 9 0 0 1 -9 -9 V18 a9 9 0 0 1 9 -9 Z" fill="{{ink}}"></path>
      <path d="M22 29 l7 7 l14 -15" fill="none" stroke="{{paper}}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.gum}}" hint-placeholder-val="{{false}}">
    <g transform="rotate(-6 32 32)">
      <rect x="5" y="15" width="54" height="34" rx="9" fill="#C9D8F2"></rect>
      <rect x="11" y="22" width="12" height="20" rx="5" fill="#FFFFFF"></rect>
      <rect x="26" y="22" width="12" height="20" rx="5" fill="#FFFFFF"></rect>
      <rect x="41" y="22" width="12" height="20" rx="5" fill="#FFFFFF"></rect>
      <path d="M14 38 h6 M29 38 h6 M44 38 h6" fill="none" stroke="#A9BDE0" stroke-width="2" stroke-linecap="round"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.lozenge}}" hint-placeholder-val="{{false}}">
    <g transform="rotate(-14 32 32)">
      <ellipse cx="32" cy="32" rx="24" ry="16" fill="#FFC93C"></ellipse>
      <ellipse cx="32" cy="32" rx="15" ry="8.5" fill="none" stroke="#F29A2E" stroke-width="2.5"></ellipse>
      <path d="M13 27 C17 21 23 18 30 18" fill="none" stroke="#FFF1C4" stroke-width="3" stroke-linecap="round"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.plan}}" hint-placeholder-val="{{false}}">
    <g transform="rotate(4 32 32)">
      <rect x="12" y="10" width="40" height="48" rx="8" fill="{{board}}"></rect>
      <rect x="23" y="5" width="18" height="11" rx="5" fill="{{ink}}"></rect>
      <path d="M21 31 l4 4 l7 -8" fill="none" stroke="{{coral}}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M37 31 h7 M21 44 h23" fill="none" stroke="{{ink}}" stroke-width="3" stroke-linecap="round" opacity="0.55"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.leaf}}" hint-placeholder-val="{{false}}">
    <g transform="rotate(-4 32 32)">
      <path d="M11 53 C11 27 27 12 54 10 C54 37 38 53 13 53 Z" fill="#3FB37F"></path>
      <path d="M54 10 C54 37 38 53 13 53 L40 25 Z" fill="#2F9A6A"></path>
      <path d="M13 53 L40 25" fill="none" stroke="#FFF8EE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4"></path>
      <path d="M17 34 C20 25 27 19 36 16" fill="none" stroke="#8FE0B6" stroke-width="3" stroke-linecap="round" opacity="0.8"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.cup}}" hint-placeholder-val="{{false}}">
    <g transform="rotate(-6 32 32)">
      <path d="M25 13 c-3 -4 3 -6 0 -10 M35 13 c-3 -4 3 -6 0 -10" fill="none" stroke="#FFF8EE" stroke-width="2.5" stroke-linecap="round" opacity="0.85"></path>
      <ellipse cx="30" cy="54" rx="20" ry="4.5" fill="#FFDCC6"></ellipse>
      <path d="M46 26 h3 a7.5 7.5 0 0 1 0 15 h-4" fill="none" stroke="#FFF8EE" stroke-width="5" stroke-linecap="round"></path>
      <path d="M13 20 h34 v17 a14 14 0 0 1 -14 14 h-6 a14 14 0 0 1 -14 -14 Z" fill="#FFF8EE"></path>
      <path d="M40 20 h7 v17 a14 14 0 0 1 -14 14 h-3 c6 -3 10 -9 10 -17 Z" fill="#F3DCC8"></path>
      <ellipse cx="30" cy="20" rx="17" ry="4.5" fill="#7A4A2A"></ellipse>
    </g>
  </sc-if>
  <sc-if value="{{is.bolt}}" hint-placeholder-val="{{false}}">
    <g transform="rotate(8 32 32)">
      <path d="M37 5 L13 36 h15 l-5 23 l27 -34 H34 Z" fill="#FFC93C" stroke="#F29A2E" stroke-width="2.5" stroke-linejoin="round"></path>
      <path d="M33 13 L21 30" fill="none" stroke="#FFF1C4" stroke-width="3" stroke-linecap="round"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.stack}}" hint-placeholder-val="{{false}}">
    <rect x="16" y="9" width="36" height="46" rx="7" fill="{{coral}}" transform="rotate(10 34 32)"></rect>
    <rect x="14" y="9" width="36" height="46" rx="7" fill="#FFC93C" transform="rotate(3 32 32)"></rect>
    <g transform="rotate(-5 32 32)">
      <rect x="12" y="9" width="36" height="46" rx="7" fill="#FFFFFF"></rect>
      <path d="M19 21 h22 M19 30 h22 M19 39 h13" fill="none" stroke="#1E1A3A" stroke-width="3" stroke-linecap="round" opacity="0.55"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.page}}" hint-placeholder-val="{{false}}">
    <g transform="rotate(5 32 32)">
      <path d="M17 7 h20 l13 13 v33 a5 5 0 0 1 -5 5 H17 a5 5 0 0 1 -5 -5 V12 a5 5 0 0 1 5 -5 Z" fill="#FFFFFF"></path>
      <path d="M37 7 v8 a5 5 0 0 0 5 5 h8 Z" fill="#C9D8F2"></path>
      <path d="M19 28 h24 M19 37 h24 M19 46 h14" fill="none" stroke="#1E1A3A" stroke-width="3" stroke-linecap="round" opacity="0.55"></path>
    </g>
  </sc-if>
  <sc-if value="{{is.shield}}" hint-placeholder-val="{{false}}">
    <path d="M32 5 L55 13 v17 c0 14 -9 23 -23 29 C18 53 9 44 9 30 V13 Z" fill="#2F5CBA"></path>
    <path d="M32 5 L55 13 v17 c0 14 -9 23 -23 29 Z" fill="#244A9E"></path>
    <path d="M32 21 v20 M22 31 h20" fill="none" stroke="#FFF8EE" stroke-width="5" stroke-linecap="round"></path>
  </sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["patch","bubble","gum","lozenge","plan","leaf","cup","bolt","stack","page","shield"],"default":"patch"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"size":{"editor":"int","min":24,"max":240,"default":64},"$preview":{"width":64,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'patch';
    const dark = (this.props.theme ?? 'light') === 'dark';
    const is = {};
    ['patch', 'bubble', 'gum', 'lozenge', 'plan', 'leaf', 'cup', 'bolt', 'stack', 'page', 'shield'].forEach((k) => { is[k] = k === kind; });
    return { is, size: Number(this.props.size ?? 64),
      coral: dark ? '#FF8A65' : '#F2603C', ink: dark ? '#FFF8EE' : '#1E1A3A', paper: dark ? '#0E1322' : '#FFF8EE',
      board: dark ? '#3A4670' : '#FFDCC6', shade: dark ? 'rgba(0,0,0,0.4)' : 'rgba(90,30,10,0.22)' };
  }
}
</script>
</body>
</html>
