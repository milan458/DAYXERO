<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Triggers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.g}}; color: {{t.fg}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <div style="height: 52px; margin-top: 50px; padding: 0 26px 0 16px; display: flex; align-items: center; gap: 12px; flex: none">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 0; padding: 0; background: {{t.navBtn}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></button>
    <div role="progressbar" aria-label="Setup progress" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; position: relative; height: 8px; border-radius: 99px; background: {{t.navTrack}}">
      <div style="height: 8px; width: 42%; border-radius: 99px; background: {{t.fg}}"></div>
      <div style="position: absolute; top: -3px; left: calc(42% - 7px); width: 14px; height: 14px; box-sizing: border-box; border-radius: 99px; background: #FFC93C; box-shadow: inset 0 0 0 2px #F29A2E, 0 0 10px 3px rgba(255,201,60,0.5)"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; flex-grow: 1; padding: 16px 22px 0 22px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.06; letter-spacing: -1px; text-wrap: balance">When do cravings hit hardest?</h1>
    <p style="margin: 10px 0 0 0; font-size: 16px; font-weight: 500; line-height: 1.5; color: {{t.muted}}">Pick as many as you like.</p>

    <div style="margin-top: 20px; font-size: 14px; font-weight: 600; color: {{t.muted}}">Moments in your day</div>
    <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 8px">
      <sc-for list="{{moments}}" as="c" hint-placeholder-count="7">
        <button aria-pressed="{{c.on}}" style="height: 44px; padding: 0 12px 0 9px; border: 0; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: {{c.fg}}; background: {{c.bg}}; box-shadow: {{c.ring}}"><span style="width: 24px; height: 24px; border-radius: 99px; flex: none; display: flex; align-items: center; justify-content: center; background: {{c.dot}}; color: {{c.ink}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.ic}}"></path></svg></span>{{c.t}}</button>
      </sc-for>
    </div>
    <div style="margin-top: 18px; font-size: 14px; font-weight: 600; color: {{t.muted}}">Feelings and people</div>
    <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 8px">
      <sc-for list="{{feelings}}" as="c" hint-placeholder-count="6">
        <button aria-pressed="{{c.on}}" style="height: 44px; padding: 0 12px 0 9px; border: 0; border-radius: 99px; display: inline-flex; align-items: center; gap: 6px; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: {{c.fg}}; background: {{c.bg}}; box-shadow: {{c.ring}}"><span style="width: 24px; height: 24px; border-radius: 99px; flex: none; display: flex; align-items: center; justify-content: center; background: {{c.dot}}; color: {{c.ink}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.ic}}"></path></svg></span>{{c.t}}</button>
      </sc-for>
    </div>

    <div style="margin-top: auto; margin-bottom: 18px; position: relative; padding-top: 46px">
      <div style="position: absolute; right: 20px; top: 0; width: 76px; height: 76px"><dc-import name="Xero" mood="hello" stage="1" animate="true" size="76" hint-size="76px,76px"></dc-import></div>
      <div style="position: relative; background: {{t.solid}}; box-shadow: {{t.ring}}; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <p style="margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; color: {{t.muted}}"><b style="font-weight: 700; color: {{t.fg}}">2 picked.</b> Each gets a when-then plan.</p>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{picked}}" as="p" hint-placeholder-count="2">
            <div style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px 0 9px; border-radius: 14px; background: {{t.well}}"><span style="width: 26px; height: 26px; border-radius: 99px; flex: none; display: flex; align-items: center; justify-content: center; background: {{t.badge}}; color: {{t.badgeFg}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.ic}}"></path></svg></span><span style="font-size: 13px; font-weight: 500; color: {{t.muted}}">When</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: -0.2px">{{p.t}}</span></div>
          </sc-for>
        </div>
      </div>
    </div>

  </div>

  <div style="padding: 0 22px 34px 22px; flex: none">
    <button style="width: 100%; height: 58px; border-radius: 999px; border: 0; background: {{t.btn}}; color: {{t.btnFg}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; box-shadow: {{t.btnShadow}}">Continue</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const t = dark
      ? { g: '#0E1322', fg: '#FFF8EE', muted: '#B3BACC', card: '#182034', ring: 'inset 0 0 0 1px rgba(255,255,255,0.15)', navBtn: 'rgba(255,255,255,0.14)', navTrack: 'rgba(255,255,255,0.2)', sel: '#FFF8EE', selFg: '#0E1322', badge: '#F26A45', badgeFg: '#FFF8EE', well: '#212A41', solid: '#182034', btn: '#FFF8EE', btnFg: '#0E1322', btnShadow: '0 6px 18px rgba(255,248,238,0.14)' }
      : { g: '#FFC38A', fg: '#1E1A3A', muted: '#4A2810', card: 'rgba(255,255,255,0.92)', ring: 'none', navBtn: 'rgba(255,255,255,0.72)', navTrack: 'rgba(30,26,58,0.24)', sel: '#1E1A3A', selFg: '#FFF8EE', badge: '#F26A45', badgeFg: '#FFF8EE', well: '#FFEBDD', solid: '#FFFAF5', btn: '#1E1A3A', btnFg: '#FFF8EE', btnShadow: '0 6px 18px rgba(30,26,58,0.22)' };
    const I = {
      sunrise: 'M4 18h16M7 18a5 5 0 0110 0M12 6v3M5.5 9.5l1.8 1.8M18.5 9.5l-1.8 1.8',
      meal: 'M6 3v6a2.5 2.5 0 005 0V3M8.5 3v18M17 21V3c-2.2 1.6-3 4.2-3 7.5V13h3',
      work: 'M4 8h16v11H4zM9 8V5.5h6V8M4 13h16',
      coffee: 'M5 9h11v6a4 4 0 01-4 4H9a4 4 0 01-4-4zM16 10.5h1.5a2.5 2.5 0 010 5H16M8 3v2.5M12 3v2.5',
      car: 'M5 11l1.6-4.2A2 2 0 018.5 5.5h7a2 2 0 011.9 1.3L19 11M4 11h16v6H4zM6.5 17v2M17.5 17v2M7.5 14h1M15.5 14h1',
      glass: 'M6 4h12l-1 6a5 5 0 01-10 0zM12 15v5M8.5 20h7',
      moon: 'M20 14A8 8 0 1110 4a6 6 0 0010 10z',
      bolt: 'M13 3L5 13.5h6L10 21l8-10.5h-6z',
      clock: 'M12 4a8 8 0 100 16 8 8 0 000-16zM12 8v4.5l3 1.5',
      cloud: 'M7.5 15.5a4 4 0 01.6-7.9 5 5 0 019.5 1.4 3.3 3.3 0 01-.6 6.5zM9 18.5v1.5M13 18.5v1.5',
      pulse: 'M3 12h4l2-5 4 10 2.5-5H21',
      people: 'M9 11a3 3 0 100-6 3 3 0 000 6zM3.5 19a5.5 5.5 0 0111 0M16 11a2.6 2.6 0 100-5.2M17 14.2a4.8 4.8 0 013.5 4.8',
      dots: 'M6 12h.01M12 12h.01M18 12h.01'
    };
    const check = 'M5.5 12.5l4.2 4L18.5 7.5';
    const chip = (label, ic, on) => ({ t: label, ic: on ? check : I[ic], on: String(on), fg: on ? t.selFg : t.fg, bg: on ? t.sel : t.card, ring: on ? 'none' : t.ring, dot: on ? t.badge : 'transparent', ink: on ? t.badgeFg : t.muted });
    return { t, theme,
      picked: [{ t: 'Coffee', ic: I.coffee }, { t: 'Stress', ic: I.bolt }],
      moments: [chip('Morning', 'sunrise', false), chip('After meals', 'meal', false), chip('At work', 'work', false), chip('Coffee', 'coffee', true), chip('Driving', 'car', false), chip('Alcohol', 'glass', false), chip('Evening', 'moon', false)],
      feelings: [chip('Stress', 'bolt', true), chip('Anxiety', 'pulse', false), chip('Low mood', 'cloud', false), chip('Boredom', 'clock', false), chip('Social', 'people', false), chip('Other', 'dots', false)] };
  }
}
</script>
</body>
</html>
