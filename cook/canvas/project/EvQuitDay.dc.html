<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quit Day with evidence</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 990px; box-sizing: border-box; background: {{t.g}}; color: {{t.fg}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column">

  <div style="height: 52px; margin-top: 50px; padding: 0 26px 0 16px; display: flex; align-items: center; gap: 12px; flex: none">
    <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 999px; border: 0; padding: 0; background: {{t.navBtn}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"></path></svg></button>
    <div role="progressbar" aria-label="Setup progress" aria-valuenow="84" aria-valuemin="0" aria-valuemax="100" style="flex-grow: 1; position: relative; height: 8px; border-radius: 99px; background: {{t.navTrack}}">
      <div style="height: 8px; width: 84%; border-radius: 99px; background: {{t.fg}}"></div>
      <div style="position: absolute; top: -3px; left: calc(84% - 7px); width: 14px; height: 14px; box-sizing: border-box; border-radius: 99px; background: #FFC93C; box-shadow: inset 0 0 0 2px #F29A2E, 0 0 10px 3px rgba(255,201,60,0.5)"></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; flex-grow: 1; padding: 16px 22px 0 22px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.06; letter-spacing: -1px; ">Pick your<br>Quit Day, Sam</h1>
    <p style="margin: 10px 0 0 0; font-size: 16px; font-weight: 500; line-height: 1.5; color: {{t.muted}}">I recommend a full week of prep first. Keep using as normal until then.</p>

    <div style="margin-top: 18px; background: {{t.card}}; box-shadow: {{t.ring}}; border-radius: 20px; padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 44px; height: 44px; border-radius: 99px; background: #FFC93C; box-shadow: inset 0 0 0 2.5px #F29A2E, 0 0 12px 3px rgba(255,201,60,0.45); color: #1E1A3A; display: flex; align-items: center; justify-content: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8 a4 4 0 1 0 0.01 0 M12 2 v2 M12 20 v2 M2 12 h2 M20 12 h2 M4.9 4.9 l1.4 1.4 M17.7 17.7 l1.4 1.4 M4.9 19.1 l1.4 -1.4 M17.7 6.3 l1.4 -1.4"></path></svg></div>
        <div style="flex-grow: 1"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.5px">Wed, Nov 25</div><div style="font-size: 14px; font-weight: 500; color: {{t.muted}}">Recommended</div></div>
        <button style="height: 44px; padding: 0 14px; border: 0; border-radius: 99px; background: {{t.card2}}; color: {{t.fg}}; font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; font-size: 15px">Change</button>
      </div>
      <div style="height: 1px; background: {{t.line}}"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700">Your prep week</span><span style="font-size: 14px; font-weight: 500; color: {{t.muted}}">7 short sessions</span></div>
      <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px"><div style="width: 32px; height: 32px; border-radius: 99px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 14px; {{d.s}}">{{d.n}}</div><span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">{{d.w}}</span></div>
        </sc-for>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 5px"><div style="width: 32px; height: 32px; border-radius: 99px; background: #FFC93C; box-shadow: inset 0 0 0 2.5px #F29A2E; color: #1E1A3A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8 a4 4 0 1 0 0.01 0 M12 2 v2 M12 20 v2 M2 12 h2 M20 12 h2 M4.9 4.9 l1.4 1.4 M17.7 17.7 l1.4 1.4 M4.9 19.1 l1.4 -1.4 M17.7 6.3 l1.4 -1.4"></path></svg></div><span style="font-size: 13px; font-weight: 700; color: {{t.fg}}">Wed</span></div>
      </div>
    </div>

    <div style="margin-top: 12px"><dc-import name="EvCard" theme="{{theme}}" kicker="Still quit at six months, in one trial" a-label="Stopped all at once" a-n="22" b-label="Cut down first" b-n="16" note="That is one trial. Across 22 trials neither way came out ahead, so a clean stop on a set day works at least as well as cutting down." source="Lindson-Hawley et al., 2016" hint-size="346px,280px"></dc-import></div>
  </div>

  <div style="padding: 0 22px 26px 22px; flex: none; display: flex; flex-direction: column; gap: 10px">
    <button style="width: 100%; height: 58px; border-radius: 999px; border: 0; background: {{t.btn}}; color: {{t.btnFg}}; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px; box-shadow: {{t.btnShadow}}">Hold to set your Quit Day</button>
    <p style="margin: 0; text-align: center; font-size: 13px; font-weight: 500; line-height: 1.45; color: {{t.muted}}">Quit Day comes on this date, even if prep runs short. You can change it later.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":990}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    const t = dark
      ? { g: '#0E1322', fg: '#FFF8EE', muted: '#B3BACC', card: '#182034', card2: '#212A41', line: 'rgba(255,255,255,0.12)', ring: 'inset 0 0 0 1px rgba(255,255,255,0.15)', navBtn: 'rgba(255,255,255,0.14)', navTrack: 'rgba(255,255,255,0.2)', coral: '#FF8A65', off: 'rgba(255,255,255,0.3)', btn: '#FFF8EE', btnFg: '#0E1322', btnShadow: '0 6px 18px rgba(255,248,238,0.14)' }
      : { g: '#FFC38A', fg: '#1E1A3A', muted: '#4A2810', card: '#FFFAF5', card2: '#FFE7D0', line: 'rgba(30,26,58,0.12)', ring: 'none', navBtn: 'rgba(255,255,255,0.72)', navTrack: 'rgba(30,26,58,0.24)', coral: '#F2603C', off: 'rgba(30,26,58,0.28)', btn: '#1E1A3A', btnFg: '#FFF8EE', btnShadow: '0 6px 18px rgba(30,26,58,0.22)' };
    const names = ['Today', 'Thu', 'Fri', 'Sat', 'Sun', 'Mon', 'Tue'];
    const days = names.map((w, i) => ({ w, n: String(i + 1), s: i === 0 ? `background: ${t.card2}; box-shadow: inset 0 0 0 2.5px ${t.coral}; color: ${t.fg}` : `box-shadow: inset 0 0 0 1.5px ${t.off}; color: ${t.muted}` }));
    return { t, theme, days };
  }
}
</script>
</body>
</html>
