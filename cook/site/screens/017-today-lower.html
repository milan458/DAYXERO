<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>017 Today, through the day</title>
<meta name="motion" content="Scrolled Today. The compact header arrives, then the spine draws top to bottom (900ms) while each row arrives on its node (90ms stagger); the Happening now node breathes (2.4s loop). At 1.2s the +1 glass button presses: a '+1' floats up from the counter, the count bumps from 3 to 4 (spring bump, 520ms) and the water in the tile rises from 3/8 to 4/8 (600ms settle). Light haptic on the tap, soft success tick on the bump.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .top { position: absolute; z-index: 5; left: 0; right: 0; top: 54px; padding: 6px var(--gutter) 0; }
  .mini { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; }
  .mini .av { position: relative; width: 48px; height: 48px; flex: none; }
  .mini .av .r { position: absolute; inset: 0; }
  .mini .av .x { position: absolute; inset: 4px; border-radius: 99px; background: var(--card-2); display: grid; place-items: center; overflow: hidden; }
  .mini .grow { flex: 1; min-width: 0; }
  .mini .t-foot { color: var(--muted); }
  .mini .money { text-align: right; display: grid; gap: 2px; }
  .mini .money .num { font: 800 20px/1 var(--display); }
  .mini .money .t-cap { color: var(--muted); }

  .body { position: absolute; left: 0; right: 0; top: 150px; padding: 0 var(--gutter); }
  .tl { position: relative; margin-top: 16px; padding-left: 30px; display: grid; gap: 12px; }
  .spine { position: absolute; left: 9px; top: 42px; bottom: 42px; width: 3px; border-radius: 3px;
    background: repeating-linear-gradient(to bottom, color-mix(in srgb, var(--fg) 34%, transparent) 0 4px, transparent 4px 10px); }
  .spine i { position: absolute; left: 0; top: 0; width: 3px; height: var(--done, 54%); border-radius: 3px; background: var(--fg); transform-origin: top; }
  .play .spine i { animation: spine 900ms var(--ease) 200ms backwards; }
  @keyframes spine { from { transform: scaleY(0); } }
  .item { position: relative; }
  .node { position: absolute; left: -30px; top: 50%; margin-top: -10px; width: 21px; height: 21px; border-radius: 99px; background: var(--g); box-shadow: inset 0 0 0 3px var(--fg); }
  .node.now { background: var(--fg); box-shadow: 0 0 0 5px color-mix(in srgb, var(--fg) 16%, transparent); }
  .play .node.now { animation: nodeb 2.4s ease-in-out infinite; }
  @keyframes nodeb { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--fg) 6%, transparent); } }
  .node.later { box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--fg) 34%, transparent); }
  .rowc { display: flex; align-items: center; gap: 14px; min-height: 84px; padding: 14px 16px 14px 14px; }
  .rowc .grow { flex: 1; min-width: 0; }
  .rowc .lbl { color: var(--muted); }
  .rowc .t-head { font-size: 17px; line-height: 1.25; }
  .rowc .t-head b { font-weight: 800; }
  .item.now .rowc { box-shadow: inset 0 0 0 2px var(--fg); }
  .btn.small { width: auto; padding: 0 16px; flex: none; }
  .btn.small svg { width: 16px; height: 16px; }
  .tile { width: 48px; height: 48px; border-radius: 14px; background: var(--card-2); flex: none; position: relative; overflow: hidden; display: grid; place-items: center; color: var(--fg); }
  .tile svg { position: relative; width: 24px; height: 24px; }
  .tile .water { position: absolute; left: 0; right: 0; bottom: 0; height: var(--lvl, 37.5%); background: color-mix(in srgb, #5A9DFF 45%, transparent); transition: height 600ms var(--settle); }
  .tile.badge-t { background: none; overflow: visible; }
  .tile.badge-t svg { width: 48px; height: 48px; position: absolute; inset: 0; }
  .tile.badge-t .n { position: relative; font: 800 16px/1 var(--display); color: var(--fg); }
  .val { position: relative; display: inline-block; }
  .plus { position: absolute; right: -22px; top: -8px; font: 800 16px/1 var(--display); color: var(--tick); opacity: 0; }
  .trail { flex: none; width: 24px; height: 24px; display: grid; place-items: center; color: var(--muted); }
  .trail svg { width: 22px; height: 22px; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="top" data-a style="--i:0">
    <div class="card mini">
      <div class="av"><div class="r" id="mring"></div><div class="x" id="xero"></div></div>
      <div class="grow">
        <p class="t-head" style="font-size:17px">7 days free</p>
        <p class="t-foot">Day 7 &middot; Fri, Nov 13</p>
      </div>
      <div class="money"><span class="num">$49</span><span class="t-cap">kept</span></div>
    </div>
  </div>

  <div class="body">
    <h2 class="t-title" data-a style="--i:1">Through the day</h2>
    <div class="tl">
      <div class="spine" aria-hidden="true"><i></i></div>

      <div class="item now" data-a style="--i:2">
        <span class="node now"></span>
        <div class="card rowc">
          <span class="tile" id="ic-now"></span>
          <div class="grow">
            <p class="t-foot lbl">Happening now</p>
            <p class="t-head">Most nicotine has left your body</p>
          </div>
          <span class="trail" id="chev1"></span>
        </div>
      </div>

      <div class="item" data-a style="--i:3">
        <span class="node"></span>
        <div class="card rowc">
          <span class="tile" id="ic-wave"></span>
          <div class="grow">
            <p class="t-foot lbl">Waves</p>
            <p class="t-head"><b data-count="3">3</b> ridden today</p>
          </div>
          <button class="btn small ghost">Log</button>
        </div>
      </div>

      <div class="item" data-a style="--i:4">
        <span class="node"></span>
        <div class="card rowc">
          <span class="tile" id="tile"><span class="water"></span></span>
          <div class="grow">
            <p class="t-foot lbl">Water</p>
            <p class="t-head"><span class="val"><b id="gl">3</b><span class="plus" id="plus">+1</span></span> of 8 glasses</p>
          </div>
          <button class="btn small" id="addw"></button>
        </div>
      </div>

      <div class="item" data-a style="--i:5">
        <span class="node later"></span>
        <div class="card rowc">
          <span class="tile" id="glim"></span>
          <div class="grow">
            <p class="t-foot lbl">Evening &middot; opens 6 PM</p>
            <p class="t-head">Check in with Glim</p>
          </div>
          <span class="trail" id="ic-clock"></span>
        </div>
      </div>

      <div class="item" data-a style="--i:6">
        <span class="node later"></span>
        <div class="card rowc">
          <span class="tile badge-t" id="b14"></span>
          <div class="grow">
            <p class="t-foot lbl">Next badge &middot; Fri, Nov 20</p>
            <p class="t-head">14 days free, <b>7 to go</b></p>
          </div>
          <span class="trail" id="chev2"></span>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#mring').innerHTML = DX.ring({ size: 48, stroke: 4, p: .5, color: 'var(--fg)', track: 'var(--track)' });
  $('#xero').innerHTML = DX.char('xero', { mood: 'hello', size: 38, stage: 2, animate: false });
  $('#ic-now').innerHTML = DX.icon('lungs');
  $('#chev1').innerHTML = DX.icon('chev');
  $('#chev2').innerHTML = DX.icon('chev');
  $('#ic-wave').innerHTML = DX.icon('wave');
  $('#tile').insertAdjacentHTML('beforeend', DX.icon('drop'));
  $('#addw').innerHTML = DX.icon('plus', { w: 2.8 }) + '1 glass';
  $('#glim').innerHTML = DX.char('glim', { mood: 'sleepy', size: 44, animate: false });
  $('#ic-clock').innerHTML = DX.icon('clock', { size: 20 });
  $('#b14').innerHTML = DX.badge({ kind: 'day', n: '', state: 'next', p: .5, size: 48, bare: true }) + '<span class="n">14</span>';
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));
  // spine: solid through the rows already done today (now, waves, water), dashed after
  DX.after(0, () => { const tl = $('.tl'), sp = $('.spine'), its = tl.querySelectorAll('.item'); const top = its[0].offsetTop + its[0].offsetHeight / 2, mid = its[2].offsetTop + its[2].offsetHeight / 2, end = its[4].offsetTop + its[4].offsetHeight / 2;
    sp.style.top = top + 'px'; sp.style.bottom = 'auto'; sp.style.height = (end - top) + 'px'; sp.style.setProperty('--done', (mid - top) + 'px'); });

  function addGlass(anim) {
    $('#gl').textContent = '4';
    $('#tile').style.setProperty('--lvl', '50%');
    if (!anim) return;
    const gl = $('#gl'); gl.classList.remove('bump'); void gl.offsetWidth; gl.classList.add('bump');
    const pl = $('#plus'); pl.classList.remove('float-up'); void pl.offsetWidth; pl.classList.add('float-up');
  }
  function reset() { $('#gl').textContent = '3'; $('#tile').style.setProperty('--lvl', '37.5%'); $('#plus').classList.remove('float-up'); $('#gl').classList.remove('bump'); }
  DX.after(0, reset);
  DX.after(1200, () => { const b = $('#addw'); b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 160); addGlass(true); });
  DX.onStill(() => addGlass(false));
  const fillBadge = (sel, from, to, delay) => DX.after(0, () => { const c = document.querySelector(sel + ' circle[transform]'); if (!c) return; const C = 2 * Math.PI * 48;
    c.animate([{ strokeDashoffset: C * (1 - from) }, { strokeDashoffset: C * (1 - to) }], { duration: 1000, delay, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }); });
  fillBadge('#b14', 0, .5, 900);
</script>
</body></html>
