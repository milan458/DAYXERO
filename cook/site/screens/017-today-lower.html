<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>017 Today, through the day</title>
<meta name="motion" content="Scrolled Today. The compact header arrives, then the timeline spine draws top to bottom (900ms) while each card arrives on its node (90ms stagger). At 1.2s the +1 glass button presses: a '+1' floats up from the counter, the count bumps from 3 to 4 of 8 (spring bump, 520ms), the fourth glass cell fills and the water in the tile rises (600ms settle). Light haptic on the tap, soft success tick on the bump.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .top { position: absolute; z-index: 5; left: 0; right: 0; top: 50px; padding: 6px var(--gutter) 0; }
  .mini { display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; }
  .mini .av { position: relative; width: 48px; height: 48px; flex: none; }
  .mini .av .r { position: absolute; inset: 0; }
  .mini .av .x { position: absolute; inset: 4px; border-radius: 99px; background: var(--card-2); display: grid; place-items: center; overflow: hidden; }
  .mini .grow { flex: 1; min-width: 0; }
  .mini .t-foot { color: var(--muted); }
  .mini .money { text-align: right; }
  .mini .money .num { font-size: 20px; display: block; }

  .body { position: absolute; left: 0; right: 0; top: 142px; padding: 0 var(--gutter); }
  .tl { position: relative; margin-top: 14px; padding-left: 30px; display: grid; gap: 12px; }
  .spine { position: absolute; left: 0; top: 0; width: 20px; height: 100%; overflow: visible; }
  .item { position: relative; }
  .item .node { position: absolute; left: -30px; top: 20px; width: 20px; height: 20px; border-radius: 99px; background: var(--g); box-shadow: inset 0 0 0 3px var(--fg); }
  .item .node.now { background: var(--fg); box-shadow: 0 0 0 4px color-mix(in srgb, var(--fg) 18%, transparent); }
  .item .node.later { box-shadow: inset 0 0 0 2.5px var(--track); }
  .item .card { padding: 14px 16px; }
  .lbl { color: var(--muted); }
  .rowc { display: flex; align-items: center; gap: 12px; }
  .rowc .grow { flex: 1; min-width: 0; }
  .val { display: flex; align-items: baseline; gap: 6px; position: relative; }
  .val .num { font-size: 26px; line-height: 1; display: inline-block; }
  .btn.small { width: auto; padding: 0 16px; flex: none; }
  .btn.small svg { width: 16px; height: 16px; }
  .tile { width: 44px; height: 44px; border-radius: 14px; background: var(--card-2); flex: none; position: relative; overflow: hidden; display: grid; place-items: center; color: var(--fg); }
  .tile svg { position: relative; width: 22px; height: 22px; }
  .tile .water { position: absolute; left: 0; right: 0; bottom: 0; height: var(--lvl, 37.5%); background: color-mix(in srgb, #5A9DFF 45%, transparent); transition: height 600ms var(--settle); }
  .cells { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; margin-top: 12px; }
  .cells i { height: 8px; border-radius: 99px; background: var(--track); position: relative; overflow: hidden; }
  .cells i::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--fg); transform: scaleX(0); transform-origin: left; transition: transform 600ms var(--settle); }
  .cells i.on::after { transform: none; }
  .plus { position: absolute; left: 14px; top: -20px; font: 800 16px/1 var(--display); color: var(--tick); opacity: 0; }
  .glim { width: 44px; height: 44px; border-radius: 14px; background: var(--card-2); flex: none; display: grid; place-items: center; overflow: hidden; }
  .soon { opacity: .9; }
  .goalrow { display: flex; align-items: center; gap: 12px; padding: 4px 0 0; }
  .goalrow .t-foot { color: var(--muted); }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="top" data-a style="--i:0">
    <div class="card mini">
      <div class="av"><div class="r" id="mring"></div><div class="x" id="xero"></div></div>
      <div class="grow">
        <p class="t-head" style="font-size:17px">7 days free</p>
        <p class="t-foot">Day 7 &middot; Fri, Nov 13</p>
      </div>
      <div class="money"><span class="num">$49</span><span class="t-cap muted">kept</span></div>
    </div>
  </div>

  <div class="body">
    <h2 class="t-title" data-a style="--i:1">Through the day</h2>
    <div class="tl">
      <svg class="spine" viewBox="0 0 20 520" preserveAspectRatio="none" aria-hidden="true">
        <path d="M10 30 V500" fill="none" stroke="var(--track)" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
        <path class="draw" d="M10 30 V360" fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round" style="--len:330;--dur:900ms;--d:200ms"/>
      </svg>

      <div class="item" data-a style="--i:2">
        <span class="node now"></span>
        <div class="card rowc">
          <div class="grow">
            <p class="t-foot lbl">Happening now</p>
            <p class="t-head">Most nicotine has left your body</p>
          </div>
          <span class="chev" id="chev1"></span>
        </div>
      </div>

      <div class="item" data-a style="--i:3">
        <span class="node"></span>
        <div class="card rowc">
          <span class="tile" id="ic-wave"></span>
          <div class="grow">
            <p class="t-foot lbl">Waves</p>
            <p class="val"><span class="num" data-count="3">3</span><span class="t-foot">ridden today</span></p>
          </div>
          <button class="btn small ghost">Log</button>
        </div>
      </div>

      <div class="item" data-a style="--i:4">
        <span class="node"></span>
        <div class="card">
          <div class="rowc">
            <span class="tile" id="tile"><span class="water"></span></span>
            <div class="grow">
              <p class="t-foot lbl">Water</p>
              <p class="val"><span class="plus" id="plus">+1</span><span class="num" id="gl">3</span><span class="t-foot">of 8 glasses</span></p>
            </div>
            <button class="btn small" id="addw"></button>
          </div>
          <div class="cells" id="cells"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>
      </div>

      <div class="item soon" data-a style="--i:5">
        <span class="node later"></span>
        <div class="card flat rowc">
          <span class="glim" id="glim"></span>
          <div class="grow">
            <p class="t-foot lbl">Evening &middot; opens 6 PM</p>
            <p class="t-head">Check in with Glim</p>
          </div>
          <span class="chev" id="ic-lock" style="width:20px;height:20px"></span>
        </div>
      </div>

      <div class="item" data-a style="--i:6">
        <span class="node later" style="top:16px"></span>
        <div class="goalrow">
          <span id="b14"></span>
          <div>
            <p class="t-head" style="font-size:17px">14 days free</p>
            <p class="t-foot">Next badge &middot; Fri, Nov 20, 7 to go</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#mring').innerHTML = DX.ring({ size: 48, stroke: 4, p: .5, color: 'var(--fg)', track: 'var(--track)' });
  $('#xero').innerHTML = DX.char('xero', { mood: 'hello', size: 38, stage: 2, animate: false });
  $('#chev1').innerHTML = DX.icon('chev');
  $('#ic-wave').innerHTML = DX.icon('wave');
  $('#tile').insertAdjacentHTML('beforeend', DX.icon('drop'));
  $('#addw').innerHTML = DX.icon('plus', { w: 2.8 }) + '1 glass';
  $('#glim').innerHTML = DX.char('glim', { mood: 'sleepy', size: 40, animate: false });
  $('#ic-lock').innerHTML = DX.icon('clock', { size: 20 });
  $('#b14').innerHTML = DX.badge({ kind: 'day', n: 14, state: 'next', p: .5, size: 48, bare: true });
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));

  function addGlass(anim) {
    $('#gl').textContent = '4';
    $('#cells').children[3].classList.add('on');
    $('#tile').style.setProperty('--lvl', '50%');
    if (!anim) return;
    const gl = $('#gl'); gl.classList.remove('bump'); void gl.offsetWidth; gl.classList.add('bump');
    const pl = $('#plus'); pl.classList.remove('float-up'); void pl.offsetWidth; pl.classList.add('float-up');
  }
  function reset() { $('#gl').textContent = '3'; $('#cells').children[3].classList.remove('on'); $('#tile').style.setProperty('--lvl', '37.5%'); $('#plus').classList.remove('float-up'); $('#gl').classList.remove('bump'); }
  DX.after(0, reset);
  DX.after(1200, () => { const b = $('#addw'); b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 160); addGlass(true); });
  DX.onStill(() => addGlass(false));
</script>
</body></html>
