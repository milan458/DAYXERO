<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>043 Slip: thanks for telling me</title>
<meta name="motion" content="Calm, no springs. The full-bleed sea fades in (700ms) with its layers drifting at different speeds (far cloud 30s, near cloud 22s, the back swell 9s, the front swell 7s, the paper edge still); Jelli (calm, 156px, tentacle tips under the third swell) settles into the water between the second and third swell (900ms) and then bobs. Title, the one line 'Nothing resets.' and the two matching tiles arrive with a 90ms stagger; the 7 and the 40% count up from 0 over 850ms while the Day 7 medallion and the little sky disc fade in with their tiles (the disc's cloud bank slides right to show 40% clear sky, 900ms). The button and 'Not now' arrive last. Soft haptic on appear only.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>

  .disc .s0 { stop-color: #A9D2F3; } .disc .s1 { stop-color: #FCEBD2; }
  .disc .sun { fill: #FFD25E; } .disc .cl { fill: #FFFFFF; } .disc .cl2 { fill: #E4ECF7; }
