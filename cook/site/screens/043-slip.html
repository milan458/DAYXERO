<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>043 Slip: thanks for telling me</title>
<meta name="motion" content="Calm, no springs. Jelli (calm) settles in from below (900ms), then title, body and the two 'still intact' tiles arrive with a 90ms stagger; the 7 and the 40% count up from 0 over 850ms; the next-step card and the button arrive last. Soft haptic on appear only.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 74px var(--gutter) 0; display: grid; gap: 0; }
  .jelli { width: 104px; height: 104px; border-radius: 999px; background: var(--card-2); display: grid; place-items: center; }
  .wrap h1 { margin-top: 20px; }
  .wrap .lead { margin-top: 10px; color: var(--muted); }
  .kept { margin-top: 22px; }
  .kept .stat { display: grid; gap: 4px; }
  .kept .stat .num { font-size: 34px; }
  .kept .ic { color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .kept .ic svg { width: 16px; height: 16px; }
  .week { display: flex; gap: 5px; margin-top: 8px; }
  .week i { width: 14px; height: 14px; border-radius: 99px; background: var(--fg); }
  .kept .progress { margin-top: 12px; height: 6px; }
  .next { margin-top: 12px; display: flex; gap: 14px; align-items: center; }
  .next .t-foot { color: var(--muted); }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close"></button>
    <div class="grow"><div class="steps" aria-label="Step 1 of 3"><i class="on"></i><i></i><i></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <div class="jelli" id="jelli" data-settle></div>
      <h1 class="t-large" data-a style="--i:1">Thanks for telling me.</h1>
      <p class="t-body lead" data-a style="--i:2">Nothing resets: your 7 days and Xero's sky stay as they are.</p>
      <div class="grid2 kept">
        <div class="stat" data-a style="--i:3">
          <span class="t-cap ic" data-ic2="calendar">Since Quit Day</span>
          <span class="num"><span data-count="7">7</span> days</span>
          <span class="week" aria-label="7 of 7 days kept"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="stat" data-a style="--i:4">
          <span class="t-cap ic" data-ic2="sun">Xero's sky</span>
          <span class="num"><span data-count="40" data-suffix="%">40%</span></span>
          <span class="progress" style="--p:40%"><i></i></span>
        </div>
      </div>
      <div class="card flat next" data-a style="--i:5">
        <span class="ico-tile" data-ic="clock" style="background:var(--card)"></span>
        <div class="grow">
          <p class="t-head" style="font-size:17px">One small plan, about a minute</p>
          <p class="t-foot">For the moment that set this off, so the next one is easier.</p>
        </div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:6" data-go="044-slip-talk">Let's make a plan</button>
    <button class="link" data-a style="--i:7">Not now</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  document.querySelectorAll('[data-ic2]').forEach(e => e.insertAdjacentHTML('afterbegin', DX.icon(e.dataset.ic2, { w: 2.4 })));
  document.getElementById('jelli').innerHTML = DX.char('jelli', { mood: 'calm', size: 88 });
</script>
</body></html>
