<meta name="motion" content="Calm, no springs. The sea scene card fades up, its cloud drifting slowly; Jelli (calm, about 120px tall) settles onto the water from below (900ms) and then bobs. Title, the one line 'Nothing resets.' and the two tiles arrive with a 90ms stagger; the 7 and the 40% count up from 0 over 850ms; the day ticks fade in left to right (60ms apart from 500ms: the Day Xero sun, six ticks, today's ringed tick) while the sky picture on the tile's right half (clouds and open sky only; the scene above holds the one sun) slides its cloud bank right to show 40% clear sky (900ms). One centred line, 'Slips don't cloud it.', arrives under both tiles, then the button and 'Not now'. Soft haptic on appear only.">

<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  document.querySelectorAll('[data-ic2]').forEach(e => e.insertAdjacentHTML('afterbegin', DX.icon(e.dataset.ic2, { w: 2.4 })));
  document.getElementById('jelli').innerHTML = DX.char('jelli', { mood: 'calm', size: 176 });
  /* Fri, Nov 6 (Day Xero, the sun), six light ticks, today's ringed tick */
  document.getElementById('days').innerHTML = Array.from({ length: 8 }, (_, i) =>
    `<i class="${i === 0 ? 'xd' : i === 7 ? 'today' : ''}" data-fade style="--d:${500 + i * 60}ms">${i === 0 ? DX.icon('sun', { w: 2.6 }) : DX.icon('check', { w: i === 7 ? 3.4 : 2.8 })}</i>`).join('');
</script>
