<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>003 What you are leaving behind</title>
<meta name="motion" content="Progress eases from 0 to 1/11 (900ms settle). Question and helper arrive (600ms, 90ms stagger), then the three checkbox rows and the note in order. At 900ms Vape gets picked: the checkbox fills and ticks, the row takes the warm selection tint and dips to .97 and springs back (520ms), and the note's count switches from 1 to 2 while Xero (88px) bobs beside it. Selection haptic on each pick.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  .q .t-body { text-wrap: pretty; }
  .land { animation: dx-land 520ms cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes dx-land { 0% { transform: scale(1); } 40% { transform: scale(.97); } 100% { transform: scale(1); } }
  .chip.land { animation-name: dx-chipland; }
  @keyframes dx-chipland { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }

  .opt { min-height: 84px; gap: 16px; }
  /* Bespoke 28px product drawings in a soft tile (no generic glyphs). */
  .opt .ico-tile { width: 52px; height: 52px; border-radius: 16px; }
  .opt .ico-tile svg { width: 36px; height: 36px; }
  .opt .t-head { display: block; }
  .opt .t-foot { display: block; margin-top: 2px; }
  .opt .ico-tile { transition: background .25s var(--ease), color .25s var(--ease); }
  /* Paper-cut product objects: flat cut pieces, each with a short paper shadow. */
  .opt .ico-tile svg { overflow: visible; width: 42px; height: 42px; }
  .answers { gap: 12px !important; }
  /* The note is a cream card with a hairline edge (distinct from the white answer rows). */
  .note { display: flex; gap: 12px; align-items: center; margin-top: 16px; padding: 18px 20px 18px 14px; background: #FFF8EE; border-radius: var(--r-card); box-shadow: inset 0 0 0 1px var(--line); }
  [data-theme="dark"] .note { background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }
  .note .xc { width: 88px; height: 88px; flex: none; display: grid; place-items: center; }
  .note p { color: var(--fg); flex: 1; max-width: none; text-wrap: wrap; }
  .note b { font-weight: 700; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:9.1%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>What are you leaving behind?</h1>
    <p class="t-body muted" data-a style="--i:1">Pick everything you use now. I&rsquo;ll set up a counter for each one.</p>
  </div>
  <div class="answers">
    <button class="opt multi on" data-a style="--i:2"><span class="ico-tile" data-art="cig"></span><span class="grow"><span class="t-head">Cigarettes</span><span class="t-foot">Manufactured or roll-ups</span></span><span class="radio"></span></button>
    <button class="opt multi on" id="vape" data-a style="--i:3"><span class="ico-tile" data-art="vape"></span><span class="grow"><span class="t-head">Vape</span><span class="t-foot">Disposables, pods or tanks</span></span><span class="radio"></span></button>
    <button class="opt multi" data-a style="--i:4"><span class="ico-tile" data-art="pouch"></span><span class="grow"><span class="t-head">Nicotine pouches</span><span class="t-foot">Zyn, Velo, snus</span></span><span class="radio"></span></button>
    <div class="note" data-a style="--i:5"><div class="xc"><div id="xn" class="bob"></div></div>
      <p class="t-body"><b id="cnt">2 picked.</b> Lots of people use both. I&rsquo;ll plan for each.</p></div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:6">Continue</button></div>
</div>
<script>
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  /* Paper-cut product objects: flat pieces in the icon palette, each casting a short paper shadow onto the piece below. */
  const sh = DX.theme === 'dark' ? 'rgba(0,0,0,.5)' : 'rgba(110,50,20,.26)';
  const pf = id => `<defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.3" stdDeviation=".45" flood-color="${sh}" flood-opacity="1"/></filter></defs>`;
  const ART = {
    /* Cigarette: white paper, a speckled tan filter, a grey ash band and a lit coral tip, with a curl of smoke. */
    cig: `<svg viewBox="0 0 44 44" aria-hidden="true">${pf('pcA')}
      <path d="M38.5 14.5 C35.5 12 40.5 9.5 37.6 6 C35.6 3.6 37.4 1.6 39 1" fill="none" stroke="${DX.theme === 'dark' ? '#8E97B5' : '#C9B8AE'}" stroke-width="2.2" stroke-linecap="round"/>
      <g transform="rotate(-26 22 25)" filter="url(#pcA)"><rect x="2" y="21" width="39" height="8" rx="1.8" fill="#FFFDF8"/>
      <rect x="2" y="21" width="11.5" height="8" rx="1.8" fill="#F2A65A"/><rect x="11.5" y="21" width="2" height="8" fill="#F2A65A"/>
      <g fill="#C9762E" opacity=".6"><circle cx="5" cy="23.6" r=".8"/><circle cx="8" cy="26.6" r=".8"/><circle cx="10.6" cy="23.4" r=".8"/><circle cx="5.6" cy="27.2" r=".7"/></g>
      <rect x="13.5" y="21" width="1.2" height="8" fill="#E8D9C4"/>
      <rect x="34.2" y="21" width="3.4" height="8" fill="#B7AFC0"/><path d="M37.6 21 h1.6 a1.8 1.8 0 0 1 1.8 1.8 v4.4 a1.8 1.8 0 0 1 -1.8 1.8 h-1.6 z" fill="#FF7155"/><rect x="37.6" y="23.2" width="1.6" height="3.6" rx=".8" fill="#FFC93C"/></g></svg>`,
    /* Disposable vape: an ink mouthpiece on a blue body with a window of liquid and a small sun LED. */
    vape: `<svg viewBox="0 0 44 44" aria-hidden="true">${pf('pcB')}
      <g transform="rotate(14 22 22)" filter="url(#pcB)"><path d="M17.5 3 h9 a1.5 1.5 0 0 1 1.5 1.6 l-.8 6.4 h-10.4 l-.8 -6.4 a1.5 1.5 0 0 1 1.5 -1.6 z" fill="#1E1A3A"/>
      <rect x="13" y="10" width="18" height="31" rx="6" fill="#5C7FF0"/><path d="M25 10 h0 a6 6 0 0 1 6 6 v19 a6 6 0 0 1 -6 6 h-1.5 c2.8 -1.4 4 -4 4 -7 v-17 c0 -3.2 -1 -5.6 -2.5 -7 z" fill="#2A52DB"/>
      <rect x="17" y="14.5" width="8" height="13" rx="3" fill="#BFD7FF"/><path d="M17 21 c2 -1 4.5 1 8 0 v3.5 a3 3 0 0 1 -3 3 h-2 a3 3 0 0 1 -3 -3 z" fill="#9CCBFF"/>
      <circle cx="21" cy="34" r="2.3" fill="#FFD966"/></g></svg>`,
    /* Pouch tin: a round green tin in three-quarter view, lid ring on top, one white pouch leaning on its side. */
    pouch: `<svg viewBox="0 0 44 44" aria-hidden="true">${pf('pcD')}
      <g filter="url(#pcD)"><path d="M4 17 v9 c0 4 6.7 7 15 7 s15 -3 15 -7 v-9 z" fill="#2E9A69"/><ellipse cx="19" cy="17" rx="15" ry="7" fill="#3FB37F"/>
      <ellipse cx="19" cy="17" rx="10.5" ry="4.6" fill="none" stroke="#9FE3BC" stroke-width="2"/><ellipse cx="19" cy="16.6" rx="4" ry="1.7" fill="#E6F5EC"/>
      <path d="M4.4 24.5 c2.6 3.4 8 5 14.6 5 s12 -1.6 14.6 -5" fill="none" stroke="#25835A" stroke-width="1.4"/></g>
      <g transform="rotate(-18 32 33)" filter="url(#pcD)"><rect x="24.5" y="28" width="15" height="10" rx="4.6" fill="#FFFDF8"/><path d="M27.5 33 h9" stroke="#E8DFD2" stroke-width="1.4" stroke-linecap="round"/></g></svg>`
  };
  document.querySelectorAll('[data-art]').forEach(e => e.innerHTML = ART[e.dataset.art]);
  document.getElementById('xn').innerHTML = DX.char('xero', { mood: 'hello', size: 88 });
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '0%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '9.1%'));
  const v = document.getElementById('vape'), cnt = document.getElementById('cnt');
  DX.after(0, () => { v.classList.remove('on', 'land'); cnt.textContent = '1 picked.'; });
  DX.after(900, () => { v.classList.add('on', 'land'); cnt.textContent = '2 picked.'; });
</script>
</body></html>
