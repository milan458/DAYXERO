<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>003 What you are leaving behind</title>
<meta name="motion" content="Progress eases from 0 to 1/11 (900ms settle). Question and helper arrive (600ms, 90ms stagger), then the three checkbox rows and the one-line note (full width) in order. Product tiles are flat paper-cut pieces with soft paper shadows (the cigarette is unlit). The horizon strip above the dock settles up in three paper layers (0, 120, 240ms; 40px, 900ms settle) and Xero (100px, on the left thirds line, one empty hand held out palm up) settles onto its crest last (from 420ms, 900ms). At 900ms Vape gets picked: the checkbox fills and ticks, the row takes the warm selection tint and dips to .97 and springs back (520ms), and the note's count switches from 1 to 2. Selection haptic on each pick.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  .q .t-body { text-wrap: pretty; }
  .land { animation: dx-land 520ms cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes dx-land { 0% { transform: scale(1); } 40% { transform: scale(.97); } 100% { transform: scale(1); } }
  .chip.land { animation-name: dx-chipland; }
  @keyframes dx-chipland { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }

  .opt { min-height: 84px; gap: 16px; }
  /* Bespoke 28px product drawings in a soft tile (no generic glyphs). */
  .opt .ico-tile { width: 52px; height: 52px; border-radius: 16px; }
  .opt .ico-tile svg { width: 36px; height: 36px; }
  .opt .t-head { display: block; }
  .opt .t-foot { display: block; margin-top: 2px; }
  .opt .ico-tile { transition: background .25s var(--ease), color .25s var(--ease); }
  /* Paper-cut product objects: flat cut pieces, each with a short paper shadow. */
  .opt .ico-tile svg { overflow: visible; width: 42px; height: 42px; }
  .answers { gap: 12px !important; }
  /* Round 10: the note is one quiet line (Xero now stands on the horizon strip below). */
  .note { margin-top: 6px; padding: 0 4px; color: var(--muted); text-wrap: pretty; }
  .note b { font-weight: 700; color: var(--fg); }
  /* Round 10: the onboarding horizon strip (003 to 011, one element). Three flat paper hills in the launch style, soft paper
     shadows and no crest lines, sitting just above the dock and running full-bleed behind it; the screen's character stands on the
     crest. Light: cream and peach paper. Dark: the kit's night-meadow hills, kept quiet. */
  .screen { --hz-1: #FFD3A6; --hz-2: #FFE6CA; --hz-3: #F9B386; --hz-lift: rgba(120,44,20,.16); }
  [data-theme="dark"] .screen { --hz-1: #16233F; --hz-2: #0F1A31; --hz-3: #0A1326; --hz-lift: rgba(0,0,0,.55); }
  .hz { position: absolute; z-index: 1; left: 0; top: calc(var(--hz-b, 752px) - 134px); width: 390px; height: 300px; pointer-events: none; }
  .hz .l { position: absolute; left: 0; top: 0; display: block; }
  .hz .l1 { filter: drop-shadow(0 -3px 8px var(--hz-lift)); }
  .hz .l2 { filter: drop-shadow(0 -4px 10px var(--hz-lift)); }
  .hz .l3 { filter: drop-shadow(0 -5px 12px var(--hz-lift)); }
  .hz .who { position: absolute; }
  .play .hz .l { animation: hz-up 900ms var(--settle) both; }
  .play .hz .l2 { animation-delay: 120ms; }
  .play .hz .l3 { animation-delay: 240ms; }
  @keyframes hz-up { from { transform: translateY(40px); } to { transform: none; } }
  .dock { background: none; }
  .screen { --hz-b: 736px; }  /* round 11: the strip rises 16px so no empty band opens above it */
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:9.1%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>What are you leaving behind?</h1>
    <p class="t-body muted" data-a style="--i:1">Pick everything you use now. I&rsquo;ll set up a counter for each one.</p>
  </div>
  <div class="answers">
    <button class="opt multi on" data-a style="--i:2"><span class="ico-tile" data-art="cig"></span><span class="grow"><span class="t-head">Cigarettes</span><span class="t-foot">Manufactured or roll-ups</span></span><span class="radio"></span></button>
    <button class="opt multi on" id="vape" data-a style="--i:3"><span class="ico-tile" data-art="vape"></span><span class="grow"><span class="t-head">Vape</span><span class="t-foot">Disposables, pods or tanks</span></span><span class="radio"></span></button>
    <button class="opt multi" data-a style="--i:4"><span class="ico-tile" data-art="pouch"></span><span class="grow"><span class="t-head">Nicotine pouches</span><span class="t-foot">Zyn, Velo, snus</span></span><span class="radio"></span></button>
    <p class="t-foot note" data-a style="--i:5"><b id="cnt">2 picked.</b> Lots of people use both.</p>
  </div>
  <div class="hz" id="hz" aria-hidden="true"></div>

  <div class="dock"><button class="btn" data-a style="--i:6">Continue</button></div>
</div>
<script>
  /* Round 11: the horizon strip. Strip y 134 is the top of the button. The character stands on the middle hill's crest at its own
     x (a thirds line, 130 or 260), measured from the hill path, at 90-110px. */
  const HZ = { back: 'M0 82 C50 74 100 72 150 77 C198 82 234 78 268 66 C306 53 350 47 390 53 L390 300 L0 300 Z',
    mid: 'M0 108 C46 100 96 106 140 114 C180 121 214 114 250 104 C282 95 312 91 342 94 C362 96 378 100 390 104 L390 300 L0 300 Z',
    front: 'M0 128 C58 120 118 124 178 134 C236 143 300 136 350 124 C368 120 380 119 390 120 L390 300 L0 300 Z' };
  function crestY(x, d = HZ.mid) {
    const NS = 'http://www.w3.org/2000/svg', sv = document.createElementNS(NS, 'svg'), p = document.createElementNS(NS, 'path');
    sv.setAttribute('style', 'position:absolute;width:0;height:0'); p.setAttribute('d', d.split(' L390 300')[0]); sv.appendChild(p); document.body.appendChild(sv);
    let lo = 0, hi = p.getTotalLength(); for (let i = 0; i < 28; i++) { const m = (lo + hi) / 2; if (p.getPointAtLength(m).x < x) lo = m; else hi = m; }
    const y = p.getPointAtLength(lo).y; sv.remove(); return y;
  }
  function horizon(o) {
    const l = (i, d, extra = '') => `<svg class="l l${i}" width="390" height="300" viewBox="0 0 390 300"><path d="${d}" fill="var(--hz-${i})"/>${extra}</svg>`;
    const s = o.size || 100, x = o.x ?? 260, y = o.y ?? crestY(x) + (o.sink || 0);
    return l(1, HZ.back) + l(2, HZ.mid, o.pond || '') + `<div class="who" data-settle style="--d:420ms;left:${x - s / 2}px;top:${(o.top ?? (y - .965 * s)).toFixed(1)}px;width:${s}px;height:${s}px${o.clip ? `;overflow:hidden;height:${o.clip}px` : ''}"><div id="${o.id || 'hzc'}">${o.art}</div></div>` + (o.over || '') + l(3, HZ.front);
  }
  /* Round 11: in dark scenes Xero's belly window shows dusk (a navy sky, a warm glow on the line, a low sun on the hill, two stars).
     A screen-local recolour of the kit art. */
  function dusk(svg) {
    if (DX.theme !== 'dark') return svg;
    return svg.replace('fill="#BFD7FF"></ellipse>', 'fill="#2D3E78"></ellipse>')
      .replace(/<circle cx="100" cy="[\d.]+" r="11" fill="#FFC93C">[\s\S]*?<\/circle>/, '<rect x="76" y="128" width="48" height="34" fill="#F0A070" opacity=".14"></rect><rect x="76" y="140" width="48" height="22" fill="#F0A070" opacity=".2"></rect><circle cx="91" cy="122" r="1.6" fill="#FFF3DC"></circle><circle cx="108" cy="115" r="1.2" fill="#FFF3DC" opacity=".8"></circle><circle cx="101" cy="154" r="9.5" fill="#FFB65E"></circle>')
      .replace('fill="#3FB37F"></path>', 'fill="#18234A"></path>');
  }
  /* Round 11: Xero's poses on the strip. armL/armR replace the kit arms (drawn behind the body); hold is drawn in front of him. */
  function xero(mood, size, o = {}) {
    let s = DX.char('xero', { mood, size }).replace('style="display: block"', 'style="display: block; overflow: visible"');
    if (o.armL != null) s = s.replace(/<path d="M36 124 C26 132 22 142 24 152"[^>]*><\/path>/, o.armL);
    if (o.armR != null) s = s.replace(/<path d="M164 124 C174 132 178 142 176 152"[^>]*><\/path>/, o.armR);
    if (o.feet != null) s = s.replace(/<ellipse cx="84" cy="188"[^>]*><\/ellipse>\s*<ellipse cx="116" cy="188"[^>]*><\/ellipse>/, o.feet);
    if (o.hold) s = s.replace(/<\/svg>\s*$/, o.hold + '</svg>');
    return dusk(s);
  }
  const arm = (d, extra = '') => `<path d="${d}" fill="none" stroke="#FF7155" stroke-width="12" stroke-linecap="round">${extra}</path>`;
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  /* Paper-cut product objects (round 10: flat, no highlight strokes): Xero's own materials. Flat cut pieces, a crescent side shade,
     and a soft paper shadow under each piece. No speckles, no 3D, no emoji tilt. */
  const dk = DX.theme === 'dark';
  const sh = dk ? 'rgba(0,0,0,.55)' : 'rgba(120,52,24,.24)';
  const pf = id => `<defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.6" stdDeviation="1" flood-color="${sh}" flood-opacity="1"/></filter></defs>`;
  const ART = {
    /* Cigarette (round 10): unlit. A chunky cut-paper stick: cream paper with a shaded lower edge, an apricot filter and a plain
       paper end. No ember, no smoke. */
    cig: `<svg viewBox="0 0 44 44" aria-hidden="true">${pf('pcA')}
      <g transform="rotate(-34 22 25)" filter="url(#pcA)">
        <clipPath id="pcAc"><rect x="3" y="20" width="38" height="10" rx="3"/></clipPath>
        <g clip-path="url(#pcAc)"><rect x="3" y="20" width="38" height="10" fill="#FFFDF8"/><rect x="3" y="26.4" width="38" height="4" fill="#EFE1CF"/>
          <rect x="3" y="20" width="12" height="10" fill="#FFAE73"/><rect x="3" y="26.4" width="12" height="4" fill="#F29055"/>
          <rect x="39.4" y="20" width="1.6" height="10" fill="#EFE1CF"/></g></g></svg>`,
    /* Disposable vape: a coral body with Xero's side shade and highlight, an ink mouthpiece, a sky window of liquid and a sun LED. */
    vape: `<svg viewBox="0 0 44 44" aria-hidden="true">${pf('pcB')}
      <g transform="rotate(10 22 22)"><path d="M17.5 3.5 h9 a1.6 1.6 0 0 1 1.6 1.8 l-.9 6.2 h-10.4 l-.9 -6.2 a1.6 1.6 0 0 1 1.6 -1.8 z" fill="#1E1A3A" filter="url(#pcB)"/>
      <g filter="url(#pcB)"><rect x="12.5" y="10" width="19" height="31" rx="7" fill="#FF7155"/>
        <path d="M25.5 10.4 a7 7 0 0 1 6 6.9 v16.6 a7 7 0 0 1 -7 7 h-2 c3.6 -1.4 5 -4.4 5 -7.6 v-16.2 c0 -3 -.7 -5.2 -2 -6.7 z" fill="#E85A3E"/>
        <rect x="16.5" y="16" width="8" height="13.5" rx="4" fill="#FFF8EE"/><path d="M16.5 23 c2.2 -1.1 5 .9 8 -.2 v2.7 a4 4 0 0 1 -4 4 a4 4 0 0 1 -4 -4 z" fill="#BFD7FF"/>
        <circle cx="20.5" cy="35" r="2.2" fill="#FFC93C"/></g></g></svg>`,
    /* Pouch tin, seen from above: a green lid cut over a darker rim (the crescent shade), one ring, and a cream pouch laid on top. */
    pouch: `<svg viewBox="0 0 44 44" aria-hidden="true">${pf('pcD')}
      <g filter="url(#pcD)"><circle cx="19.5" cy="20" r="15" fill="#2E9A69"/><circle cx="18.2" cy="18.8" r="13.6" fill="#3FB37F"/>
        <circle cx="18.2" cy="18.8" r="8.6" fill="none" stroke="#9FE3BC" stroke-width="2.2"/></g>
      <g transform="rotate(-16 31 33)" filter="url(#pcD)"><clipPath id="pcDc"><rect x="22.5" y="27" width="17" height="11" rx="5.5"/></clipPath>
        <g clip-path="url(#pcDc)"><rect x="22.5" y="27" width="17" height="11" fill="#FFFDF8"/><rect x="22.5" y="34.2" width="17" height="4" fill="#EFE1CF"/></g></g></svg>`
  };
  document.querySelectorAll('[data-art]').forEach(e => e.innerHTML = ART[e.dataset.art]);
  /* Round 11: Xero (100px) on the left thirds line holds one empty hand out, palm up: the thing he is leaving behind is gone. */
  document.getElementById('hz').innerHTML = horizon({ x: 130, size: 100, art: xero('hello', 100, {
    armR: arm('M163 122 C178 122 190 116 198 106'),
    hold: '<path d="M190 104 C194 112 206 112 211 102" fill="#FF7155" stroke="#FF7155" stroke-width="5" stroke-linejoin="round"></path><path d="M193 105 C197 110 204 110 208 104" fill="none" stroke="#FFB09C" stroke-width="2.4" stroke-linecap="round"></path>' }) });
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '0%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '9.1%'));
  const v = document.getElementById('vape'), cnt = document.getElementById('cnt');
  DX.after(0, () => { v.classList.remove('on', 'land'); cnt.textContent = '1 picked.'; });
  DX.after(900, () => { v.classList.add('on', 'land'); cnt.textContent = '2 picked.'; });
</script>
</body></html>
