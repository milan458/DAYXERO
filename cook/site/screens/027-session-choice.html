<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>027 Session choice</title>
<meta name="motion" content="The bar moves to two thirds of card 5 and its label turns to Card 5 · Step 2 of 3 (500ms settle); tag, question and helper arrive (600ms, 90ms stagger) and the four option rows settle in (900ms, 120ms apart), each with its small paper-cut spot lifting in with the row. At 1.5s the first row lands as the choice: it presses down 2pt, the kit tint and 1.5px outline fill in (300ms), the radio fills and the tick draws, and the row bumps (520ms spring) with a selection haptic; the spot's two breaths drift right 3pt and back (900ms). The button arrives last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.k-try{--face:#9FE3BC}
[data-theme="dark"] .k-try{--face:#8FD3AD}
.steps > i.now::after{width:var(--sub,45%)}
.nav .side{flex:none;color:var(--muted)}
.wrap{position:absolute;top:112px;left:0;right:0;display:grid;align-content:start;gap:10px}
.tag{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body)}
.tag svg{width:16px;height:16px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt .t-body{font-weight:600}
.opts .opt{min-height:80px;padding:12px 16px 12px 12px;gap:14px}
/* selection: the kit tint with a 1.5px outline */
.screen .opts .opt.on{box-shadow:inset 0 0 0 1.5px var(--sel)}
/* small paper-cut spots, one per option */
.spot{width:52px;height:52px;border-radius:15px;overflow:hidden;flex:none;display:block}
.spot svg{display:block;width:52px;height:52px}
.sub-l{display:flex;align-items:center;gap:8px;font:500 13px/1.3 var(--body);color:var(--muted);margin-top:4px}
/* recommended: a small mint pill */
.rec{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 12px/1 var(--body)}
.opt.land{animation:land 560ms var(--spring) both}
@keyframes land{0%{opacity:1;transform:translateY(2px) scale(.98)}45%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="Card 5 of 5, step 2 of 3" style="--sub:66%"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i></div></div>
    <span class="side t-cap">Card 5 · Step 2 of 3</span>
  </div>
  <div class="wrap pad">
    <span class="tag k-try" data-a style="--i:0"><span id="t-ic"></span>Your stress plan · 6 min</span>
    <h1 class="t-title" data-a style="--i:1">When work piles up, what will you do first?</h1>
    <p class="t-foot muted" data-a style="--i:2">Pick one to do before anything else.</p>
    <div class="opts">
      <button class="opt on" id="pick" data-settle style="--i:2"><span class="spot" data-spot="sigh"></span><span class="grow"><span class="t-body">Two sighs</span><span class="sub-l">30 seconds<span class="rec k-try">Recommended</span></span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:3"><span class="spot" data-spot="outside"></span><span class="grow"><span class="t-body">Step outside</span><span class="sub-l">2 minutes</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:4"><span class="spot" data-spot="text"></span><span class="grow"><span class="t-body">Text someone</span><span class="sub-l">1 minute</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:5"><span class="spot" data-spot="water"></span><span class="grow"><span class="t-body">Get a glass of water</span><span class="sub-l">1 minute</span></span><span class="radio"></span></button>
    </div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:8">Make it my first move</button></div>
</div>
<script>
const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8c.7 4.9 2.3 6.6 7.4 7.4-5.1.8-6.7 2.5-7.4 7.4-.7-4.9-2.3-6.6-7.4-7.4 5.1-.8 6.7-2.5 7.4-7.4z"/><circle cx="18.6" cy="18.4" r="1.8"/></svg>';
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('t-ic').innerHTML = SPARK;
/* Small paper-cut spots (same family as the lesson rows on 033): a tinted sky, a cut-paper hill, one motif.
   Dark mode is the kit's pre-dawn: navy sky, deep hills, cream paper. */
const dark = DX.theme === 'dark';
const S = dark
  ? { mint:'#1E2C52', sky:'#1E2C52', rose:'#1E2C52', blue:'#1E2C52', g1:'#2C4A55', g2:'#22394A', sun:'#FFD27A', p:'#E6DCCB', p2:'#C9BFAE', coral:'#E9886C', water:'#8FB1E8', ink:'#0F1B33' }
  : { mint:'#D3F0DF', sky:'#DCE8FF', rose:'#FFE3D6', blue:'#CFE2FA', g1:'#9FE3BC', g2:'#7FD3A6', sun:'#FFD25E', p:'#FFFFFF', p2:'#F1DFC8', coral:'#FF8A6B', water:'#8EC1FF', ink:'#1E1A3A' };
const lift = `filter="url(#pc)"`;
const hills = `<path ${lift} d="M0 35 C12 30 30 34 48 30 V48 H0z" fill="${S.g1}"/><path ${lift} d="M0 42 C16 38 32 43 48 39 V48 H0z" fill="${S.g2}"/>`;
const SPOTS = {
  sigh: [S.mint, hills + `<g class="breaths" fill="none" stroke="${S.p}" stroke-width="2.8" stroke-linecap="round"><path d="M7 13h18c4.5 0 6-6 1.5-6.4-3-.3-3.6 3.4-1.2 4"/><path d="M12 22h22c4.5 0 6 6 1.5 6.4-3 .3-3.6-3.4-1.2-4"/></g>`],
  outside: [S.sky, `<circle cx="34" cy="14" r="6.5" fill="${S.sun}"/><path ${lift} d="M0 31 C9 25 20 25 28 29 S42 29 48 26 V48 H0z" fill="${S.g1}"/><path ${lift} d="M0 39 C14 35 30 41 48 36 V48 H0z" fill="${S.g2}"/>
    <path d="M17 48 C19 43 27 41.5 25.5 37.5 C24.6 35.4 22 34.6 23.4 32 L25.6 32 C25 34 27.6 35.2 28.4 37.4 C30 42.4 23.5 44 24.5 48Z" fill="${S.p}"/>`],
  text: [S.rose, `<g ${lift}><rect x="7" y="9" width="23" height="15" rx="6" fill="${S.coral}"/><path d="M11 23 L10 28 L16 23.5Z" fill="${S.coral}"/></g>
    <g ${lift}><rect x="17" y="20" width="24" height="16" rx="6" fill="${S.p}"/><path d="M35 35 L37 40 L30 35.5Z" fill="${S.p}"/></g>
    <g fill="${S.ink}" fill-opacity=".55"><circle cx="23.5" cy="28" r="1.7"/><circle cx="29" cy="28" r="1.7"/><circle cx="34.5" cy="28" r="1.7"/></g>`],
  water: [S.blue, `<path ${lift} d="M0 40 C16 37 32 41 48 38 V48 H0z" fill="${S.g2}"/>
    <g ${lift}><path d="M15 10 H33 L30.4 38 Q30.2 40 28.2 40 H19.8 Q17.8 40 17.6 38 Z" fill="${S.p}"/></g>
    <path d="M16.6 21 Q20 19.5 24 21 T31.4 21 L30.4 38 Q30.2 40 28.2 40 H19.8 Q17.8 40 17.6 38 Z" fill="${S.water}"/>
    <path d="M19.5 14 L20.6 34" stroke="${S.p}" stroke-width="2" stroke-linecap="round" opacity=".9"/>
    <path d="M38 8 C40 11 41 12.6 41 14 A3 3 0 0 1 35 14 C35 12.6 36 11 38 8Z" fill="${S.water}"/>`]
};
document.body.insertAdjacentHTML('beforeend', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="pc" x="-10%" y="-20%" width="120%" height="140%"><feDropShadow dx="0" dy="-1" stdDeviation="1" flood-color="#1A0B2E" flood-opacity="${dark ? .45 : .18}"/></filter></svg>`);
document.querySelectorAll('[data-spot]').forEach(e => { const [bg, art] = SPOTS[e.dataset.spot]; e.innerHTML = `<svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" fill="${bg}"/>${art}</svg>`; });
if (!DX.still) {
  const pick = document.getElementById('pick');
  pick.classList.remove('on');
  DX.after(1500, () => { pick.classList.add('on', 'land'); });
}
</script>
</body></html>
