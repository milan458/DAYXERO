<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>027 Session choice</title>
<meta name="motion" content="Tag, question and helper arrive (600ms, 90ms stagger); the four option rows settle in (900ms, 120ms apart). At 1.5s the first row lands as the choice: it presses down 2pt, the ring and radio fill, the tick draws, and the row bumps (520ms spring) with a selection haptic. The note under the list fades in after the landing.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.f-apricot{--face:#FFC38A}.f-sky{--face:#9CCBFF}.f-mint{--face:#9FE3BC}.f-sun{--face:#FFD966}
.pips{display:flex;gap:6px;justify-content:center;align-items:center}
.pips i{width:13px;height:18px;border-radius:4px;background:var(--track)}
.pips i.done{background:#FFD966}
.pips i.now{background:transparent;box-shadow:inset 0 0 0 2px var(--fg)}
.nav .side{width:44px;text-align:right;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body);justify-self:start}
.tag svg{width:16px;height:16px}
.wrap{position:absolute;top:110px;left:0;right:0;bottom:150px;display:grid;align-content:start;gap:10px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt .t-body{font-weight:600}
.opt.land{animation:land 560ms var(--spring) both}
@keyframes land{0%{opacity:1;transform:translateY(2px) scale(.98)}45%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}
.note{display:flex;gap:12px;align-items:center;margin-top:8px;opacity:0;transition:opacity .6s var(--ease)}
.note.show{opacity:1}
.note .ico-tile{background:var(--card)}
.note .ico-tile svg{width:20px;height:20px}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="pips"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i></div></div>
    <span class="side t-foot muted">5 of 5</span>
  </div>
  <div class="wrap pad">
    <span class="tag f-mint" data-a style="--i:0"><span id="t-ic"></span>Try · 6 min</span>
    <h1 class="t-title" data-a style="--i:1">When work piles up, what will you do <span class="mark">first</span>?</h1>
    <p class="t-foot muted" data-a style="--i:2">Before anything else. Two sighs is the one we recommend.</p>
    <div class="opts">
      <button class="opt on" id="pick" data-settle style="--i:2"><span class="grow"><span class="t-body">Two sighs</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:3"><span class="grow"><span class="t-body">Step outside for two minutes</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:4"><span class="grow"><span class="t-body">Text someone</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:5"><span class="grow"><span class="t-body">Get a glass of water</span></span><span class="radio"></span></button>
    </div>
    <div class="note show" id="note"><span class="ico-tile" id="n-ic"></span><p class="t-foot muted">It goes on your stress plan for Day Xero, Fri, Nov 6.</p></div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:8">This one</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('t-ic').innerHTML = DX.icon('hand', {size:16});
document.getElementById('n-ic').innerHTML = DX.icon('heart', {size:20});
if (!DX.still) {
  const pick = document.getElementById('pick'), note = document.getElementById('note');
  pick.classList.remove('on'); note.classList.remove('show');
  DX.after(1500, () => { pick.classList.add('on', 'land'); });
  DX.after(1900, () => note.classList.add('show'));
}
</script>
</body></html>
