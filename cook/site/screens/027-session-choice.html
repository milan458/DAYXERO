<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>027 Session choice</title>
<meta name="motion" content="The step bar moves to two thirds of card 5 and the tag's step dots fill to 2 of 3 (500ms settle); question and helper arrive (600ms, 90ms stagger) and the four option rows settle in (900ms, 120ms apart), all with the same neutral tile. At 1.5s the first row lands as the choice: it presses down 2pt, the selection tint and outline fill in (300ms), the radio fills and the tick draws, and the row bumps (520ms spring) with a selection haptic. Then Xero settles in cheering (900ms) and his line arrives beside him (600ms).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.k-try{--face:#9FE3BC}
[data-theme="dark"] .k-try{--face:#8FD3AD}
.nav .side{width:44px;text-align:right;flex:none}
.steps > i.now::after{width:var(--sub,45%)}
.wrap{position:absolute;top:110px;left:0;right:0;display:grid;align-content:start;gap:10px}
.tagrow{display:flex;align-items:center;justify-content:space-between}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body)}
.tag svg{width:16px;height:16px}
.sub{display:flex;gap:6px;align-items:center}
.sub i{width:8px;height:8px;border-radius:99px;background:var(--track)}
.sub i.on{background:var(--fg)}
.opts{display:grid;gap:10px;margin-top:12px}
.opt .t-body{font-weight:600}
.opts .opt{min-height:74px;padding:12px 16px 12px 12px;gap:14px}
/* one neutral tile for every option; the selection (kit tint + outline) carries the only colour */
.opt .lead{width:48px;height:48px;border-radius:14px;background:var(--card-2);color:var(--fg);display:grid;place-items:center;flex:none}
.opt .lead svg{width:24px;height:24px}
.opt .sub-l{display:block;font:500 13px/1.3 var(--body);color:var(--muted);margin-top:3px}
.opt.land{animation:land 560ms var(--spring) both}
@keyframes land{0%{opacity:1;transform:translateY(2px) scale(.98)}45%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}
/* Xero says: Xero at 64 and a bubble that hugs its text, tail to Xero (one component on 026, 027, 028, 031) */
.xsay{display:flex;align-items:flex-end;gap:10px}
.xsay .xs-x{width:64px;flex:none}
.xsay .xs-b{position:relative;width:max-content;max-width:calc(100% - 74px);background:var(--card);border-radius:18px 18px 18px 6px;padding:11px 15px;margin:0 0 12px;font:500 15px/1.4 var(--body);color:var(--fg);box-shadow:0 2px 10px rgba(30,26,58,.07)}
[data-theme="dark"] .xsay .xs-b{box-shadow:none}
.xsay .xs-b::before{content:"";position:absolute;left:-7px;bottom:0;width:12px;height:14px;background:var(--card);clip-path:polygon(100% 0,100% 100%,0 100%)}
.say-at{position:absolute;left:var(--gutter);right:var(--gutter);top:632px;transition:opacity .6s var(--ease)}
.say-at.wait{opacity:0}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="Card 5 of 5, step 2 of 3" style="--sub:66%"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i></div></div>
    <span class="side t-foot muted">5 of 5</span>
  </div>
  <div class="wrap pad">
    <div class="tagrow" data-a style="--i:0"><span class="tag k-try"><span id="t-ic"></span>Your stress plan · 6 min</span><span class="sub" aria-label="Step 2 of 3"><i class="on"></i><i class="on"></i><i></i></span></div>
    <h1 class="t-title" data-a style="--i:1">When work piles up, what will you do first?</h1>
    <p class="t-foot muted" data-a style="--i:2">Pick one to do before anything else.</p>
    <div class="opts">
      <button class="opt on" id="pick" data-settle style="--i:2"><span class="lead" data-ic="wave"></span><span class="grow"><span class="t-body">Two sighs</span><span class="sub-l">30 seconds · recommended</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:3"><span class="lead" data-ic="sun"></span><span class="grow"><span class="t-body">Step outside</span><span class="sub-l">2 minutes</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:4"><span class="lead" data-ic="chat"></span><span class="grow"><span class="t-body">Text someone</span><span class="sub-l">1 minute</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:5"><span class="lead" data-ic="drop"></span><span class="grow"><span class="t-body">Get a glass of water</span><span class="sub-l">1 minute</span></span><span class="radio"></span></button>
    </div>
  </div>
  <div class="xsay say-at" id="say">
    <div class="xs-x"><div id="xr"></div></div>
    <p class="xs-b">Good pick. It goes on your<br>stress plan for Day Xero.</p>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:8">Make it my first move</button></div>
</div>
<script>
const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8c.7 4.9 2.3 6.6 7.4 7.4-5.1.8-6.7 2.5-7.4 7.4-.7-4.9-2.3-6.6-7.4-7.4 5.1-.8 6.7-2.5 7.4-7.4z"/><circle cx="18.6" cy="18.4" r="1.8"/></svg>';
const CHAT = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 7A2.5 2.5 0 017 4.5h10A2.5 2.5 0 0119.5 7v7a2.5 2.5 0 01-2.5 2.5h-6.2L7 19.8v-3.3A2.5 2.5 0 014.5 14z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01" stroke-width="2.8"/></svg>';
document.getElementById('close').innerHTML = DX.icon('close');
document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = e.dataset.ic === 'chat' ? CHAT : DX.icon(e.dataset.ic, {size:24}));
document.getElementById('t-ic').innerHTML = SPARK;
document.getElementById('xr').innerHTML = DX.char('xero', {mood:'cheer', size:64});
if (!DX.still) {
  const pick = document.getElementById('pick'), say = document.getElementById('say');
  pick.classList.remove('on'); say.classList.add('wait');
  DX.after(1500, () => { pick.classList.add('on', 'land'); });
  DX.after(1900, () => say.classList.remove('wait'));
}
</script>
</body></html>
