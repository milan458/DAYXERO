<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>027 Session choice</title>
<meta name="motion" content="Tag, question and helper arrive (600ms, 90ms stagger); the four option rows settle in (900ms, 120ms apart). At 1.5s the first row lands as the choice: it presses down 2pt, the ring and radio fill, the tick draws, and the row bumps (520ms spring) with a selection haptic. The note under the list fades in after the landing.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.f-apricot{--face:#FFC38A}.f-sky{--face:#9CCBFF}.f-mint{--face:#9FE3BC}.f-sun{--face:#FFD966}
.pips{display:flex;gap:8px;justify-content:center;align-items:center}
.pips i{width:20px;height:26px;border-radius:6px;background:var(--track);box-shadow:inset 0 0 0 1.5px var(--line)}
.pips i.done{background:#FFD966 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 26%27%3E%3Cpath d=%27M6 13.5l3 3 5.5-6%27 fill=%27none%27 stroke=%27%231E1A3A%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/100% 100% no-repeat;box-shadow:none}
.pips i.now{background:var(--card);box-shadow:inset 0 0 0 2.5px var(--fg)}
.nav .side{width:44px;text-align:right;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body);justify-self:start}
.tag svg{width:16px;height:16px}
.wrap{position:absolute;top:110px;left:0;right:0;bottom:150px;display:grid;align-content:start;gap:10px}
.opts{display:grid;gap:10px;margin-top:10px}
.opt .t-body{font-weight:600}
.opts .opt{min-height:74px;padding:12px 16px 12px 12px;gap:14px}
.opt .lead{width:48px;height:48px;border-radius:14px;background:var(--face);color:#1E1A3A;display:grid;place-items:center;flex:none}
.opt .lead svg{width:24px;height:24px}
.opt .sub{display:block;font:500 13px/1.3 var(--body);color:var(--muted);margin-top:2px}
.opt.land{animation:land 560ms var(--spring) both}
@keyframes land{0%{opacity:1;transform:translateY(2px) scale(.98)}45%{opacity:1;transform:scale(1.03)}100%{opacity:1;transform:none}}
.note{display:flex;gap:12px;align-items:center;margin-top:8px;opacity:0;transition:opacity .6s var(--ease)}
.note.show{opacity:1}
.note{background:var(--card);border-radius:18px;padding:12px 16px 12px 10px;box-shadow:inset 0 0 0 1px var(--line);margin-top:22px}
.note .t-foot{color:var(--fg);font-size:15px;line-height:1.4}
.note #n-ic{flex:none;width:72px;height:72px;display:grid;place-items:center}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="pips"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i></div></div>
    <span class="side t-foot muted">5 of 5</span>
  </div>
  <div class="wrap pad">
    <span class="tag f-mint" data-a style="--i:0"><span id="t-ic"></span>Your stress plan · 6 min</span>
    <h1 class="t-title" data-a style="--i:1">When work piles up, what will you do first?</h1>
    <p class="t-foot muted" data-a style="--i:2">Pick one to do before anything else.</p>
    <div class="opts">
      <button class="opt on" id="pick" data-settle style="--i:2"><span class="lead f-sky" data-ic="wave"></span><span class="grow"><span class="t-body">Two sighs</span><span class="sub">Recommended · 30 seconds</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:3"><span class="lead f-mint" data-ic="leaf"></span><span class="grow"><span class="t-body">Step outside for two minutes</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:4"><span class="lead f-apricot" data-ic="text"></span><span class="grow"><span class="t-body">Text someone</span></span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:5"><span class="lead f-sky" data-ic="drop"></span><span class="grow"><span class="t-body">Get a glass of water</span></span><span class="radio"></span></button>
    </div>
    <div class="note show" id="note"><span id="n-ic"></span><p class="t-foot">Your pick goes on your stress plan for Day Xero. You can change it any time.</p></div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:8">This one</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic, {size:24}));
document.getElementById('t-ic').innerHTML = DX.icon('hand', {size:16});
document.getElementById('n-ic').innerHTML = DX.char('xero', {mood:'hello', size:72});
if (!DX.still) {
  const pick = document.getElementById('pick'), note = document.getElementById('note');
  pick.classList.remove('on'); note.classList.remove('show');
  DX.after(1500, () => { pick.classList.add('on', 'land'); });
  DX.after(1900, () => note.classList.add('show'));
}
</script>
</body></html>
