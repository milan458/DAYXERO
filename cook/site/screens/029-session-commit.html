<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>029 Session commit</title>
<meta name="motion" content="The bar shows card 5 at its last step with Card 5 · Step 3 of 3 beside it; tag, title, your plan chip (When work piles up: two sighs first), helper, the Day Xero medal (the kit medal, resting faded inside its empty hold ring) and the date arrive (600ms, 90ms stagger). Holding the button (3s, auto at 1.2s) fills the button and sweeps the ring around the medal in lockstep (linear, a soft haptic tick every 0.5s); letting go drains both (300ms). On held: the ring turns sun gold, the medal stamps to full colour (620ms spring), its rays start their slow turn (26s loop) and a soft shine crosses it, the date bumps (520ms spring), the title cross-fades to You're committed and the helper to its second line (400ms), card 5's segment fills, and the button shows Committed (success haptic). 1200ms later the done button cross-fades (350ms) into Continue.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.k-try{--face:#9FE3BC}
[data-theme="dark"] .k-try{--face:#8FD3AD}
.steps > i.now::after{width:var(--sub,45%);transition:width .5s var(--settle)}
.nav .side{flex:none;color:var(--muted)}
.wrap{position:absolute;top:112px;left:0;right:0;display:grid;align-content:start;gap:10px}
.tag{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body)}
.tag svg{width:16px;height:16px}
/* the plan you are committing to, in one line */
.plan{justify-self:start;display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 15px 0 6px;border-radius:99px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font:600 14px/1 var(--body);white-space:nowrap}
.plan .d{width:26px;height:26px;border-radius:99px;background:var(--face);color:#1E1A3A;display:grid;place-items:center;flex:none}
.plan .d svg{width:15px;height:15px}
/* title and helper swap in place after the hold */
.swap{display:grid}
.swap > *{grid-area:1/1;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.swap .b{opacity:0;transform:translateY(6px)}
.done .swap .a{opacity:0;transform:translateY(-6px)}
.done .swap .b{opacity:1;transform:none}
/* the hold ring around the kit Day Xero medal (rays, gold rim, the brand mark), with a soft shine on the face */
.ringbox{position:absolute;top:290px;left:50%;width:256px;height:256px;margin-left:-128px}
.ringbox svg.r{position:absolute;inset:0;display:block;transform:rotate(-90deg)}
.arc{transition:stroke .4s var(--ease)}
.done .arc{stroke:#F5B83D}
[data-theme="dark"] .done .arc{stroke:#FFD966}
.coin{position:absolute;left:28px;top:28px;width:200px;height:200px}
.coin .m{position:relative;width:200px;height:200px;border-radius:50%;opacity:.38;filter:saturate(.25);transition:opacity .4s var(--ease),filter .4s var(--ease)}
.done .coin .m{opacity:1;filter:none}
.coin .gloss{position:absolute;inset:0;pointer-events:none}
.when{position:absolute;top:566px;left:0;right:0;text-align:center;display:grid;gap:6px;justify-items:center}
.when .t-large{font-size:36px}
/* after the hold the button hands over to Continue (same as Quit Day in onboarding) */
.btns{position:relative;height:58px}
.btns .btn{position:absolute;inset:0;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.btns #go{opacity:0;pointer-events:none;transform:translateY(6px)}
.btns.next #hold{opacity:0;pointer-events:none}
.btns.next #go{opacity:1;pointer-events:auto;transform:none}
</style>
</head><body>
<div class="screen" data-ground="table" id="scr">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" id="steps" aria-label="Card 5 of 5, step 3 of 3" style="--sub:83%"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i></div></div>
    <span class="side t-cap">Card 5 · Step 3 of 3</span>
  </div>
  <div class="wrap pad">
    <span class="tag k-try" data-a style="--i:0"><span class="sp"></span>Your stress plan · 6 min</span>
    <h1 class="t-title swap" data-a style="--i:1"><span class="a">Commit to Day Xero</span><span class="b">You're committed</span></h1>
    <span class="plan k-try" data-a style="--i:2"><span class="d sp"></span>When work piles up: two sighs first</span>
    <p class="t-foot muted swap" data-a style="--i:3"><span class="a">Hold for three seconds to make it official.</span><span class="b">A promise to yourself, with a plan behind it.</span></p>
  </div>
  <div class="ringbox" data-a style="--i:4">
    <div class="coin"><div id="stampwrap"><div class="m" id="medal"></div></div></div>
    <svg class="r" width="256" height="256" viewBox="0 0 256 256" aria-hidden="true">
      <circle cx="128" cy="128" r="122" fill="none" stroke="var(--track)" stroke-width="10"/>
      <circle class="arc" id="arc" cx="128" cy="128" r="122" fill="none" stroke="var(--fg)" stroke-width="10" stroke-linecap="round" stroke-dasharray="766.5" stroke-dashoffset="766.5"/>
    </svg>
  </div>
  <div class="when" data-a style="--i:5">
    <div id="date"><p class="t-large">Fri, Nov 6</p></div>
    <p class="t-foot muted">Day Xero · 4 days to go</p>
  </div>
  <div class="dock">
    <div class="btns" id="btns" data-a style="--i:6">
      <button class="btn" id="hold" data-hold="3000" data-autohold="1200" data-done="Committed">Hold to commit</button>
      <button class="btn" id="go">Continue</button>
    </div>
  </div>
</div>
<script>
const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8c.7 4.9 2.3 6.6 7.4 7.4-5.1.8-6.7 2.5-7.4 7.4-.7-4.9-2.3-6.6-7.4-7.4 5.1-.8 6.7-2.5 7.4-7.4z"/><circle cx="18.6" cy="18.4" r="1.8"/></svg>';
document.getElementById('close').innerHTML = DX.icon('close');
document.querySelectorAll('.sp').forEach(e => e.insertAdjacentHTML('afterbegin', SPARK));
const $ = id => document.getElementById(id);
const arc = $('arc'), scr = $('scr'), btn = $('hold'), sw = $('stampwrap'), medal = $('medal'), date = $('date');
/* the kit medal as it is (rays, gold rim, face, the brand mark), plus a soft top-left shine clipped to the face */
medal.innerHTML = DX.badge({kind:'xero', size:200, bare:true, label:'Day Xero'}) +
  `<svg class="gloss" width="200" height="200" viewBox="0 0 100 100" aria-hidden="true"><defs>
    <radialGradient id="gl" cx="34%" cy="26%" r="62%"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="glc"><circle cx="50" cy="50" r="46.5"/></clipPath></defs>
    <circle cx="50" cy="50" r="46.5" fill="url(#gl)" clip-path="url(#glc)"/></svg>`;
const C = 766.5;
const reset = () => { scr.classList.remove('done'); $('btns').classList.remove('next'); sw.removeAttribute('data-stamp'); medal.classList.remove('shine'); date.className = '';
  $('steps').style.setProperty('--sub', '83%'); arc.style.transition = 'none'; arc.style.strokeDashoffset = C; };
const fillRing = () => { if (scr.classList.contains('done')) return; arc.style.transition = 'stroke-dashoffset 3000ms linear, stroke .4s'; arc.style.strokeDashoffset = 0; };
const drain = () => { if (scr.classList.contains('done')) return; arc.style.transition = 'stroke-dashoffset 300ms ease-out'; arc.style.strokeDashoffset = C; };
btn.addEventListener('pointerdown', fillRing); btn.addEventListener('pointerup', drain); btn.addEventListener('pointerleave', drain);
const complete = () => {
  arc.style.transition = 'stroke .4s'; arc.style.strokeDashoffset = 0; scr.classList.add('done');
  sw.setAttribute('data-stamp', ''); sw.style.setProperty('--d', '120ms'); medal.classList.add('shine'); medal.style.setProperty('--d', '600ms');
  date.className = 'bump'; date.style.setProperty('--d', '300ms'); $('steps').style.setProperty('--sub', '100%');
};
reset();
document.addEventListener('held', complete);
DX.after(0, reset);
DX.after(1200, fillRing);
/* 1200ms after the hold lands, the button hands over to Continue */
DX.after(1200 + 3000 + 1200, () => $('btns').classList.add('next'));
DX.onStill(() => $('btns').classList.add('next'));
</script>
</body></html>
