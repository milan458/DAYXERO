<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>029 Session commit</title>
<meta name="motion" content="Tag, title, ring and Xero arrive (600ms, 90ms stagger). Holding the button (3s, auto at 1.2s) fills the button and sweeps the cream ring around in lockstep (linear, a soft haptic tick every 0.5s). On held: the ring snaps to sun yellow and a check pops and draws where the ring closes (success haptic); the date steps aside as the Day Xero badge in its waiting form stamps onto it (620ms spring, no rays: it is earned on the day itself) and the date fades back in under it; Xero swaps to cheer and bumps; the line below becomes Committed to Fri, Nov 6. The button turns into Committed.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.f-apricot{--face:#FFC38A}.f-sky{--face:#9CCBFF}.f-mint{--face:#9FE3BC}.f-sun{--face:#FFD966}
.pips{display:flex;gap:8px;justify-content:center;align-items:center}
.pips i{width:20px;height:26px;border-radius:6px;background:var(--track);box-shadow:inset 0 0 0 1.5px var(--line)}
.pips i.done{background:#FFD966 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 26%27%3E%3Cpath d=%27M6 13.5l3 3 5.5-6%27 fill=%27none%27 stroke=%27%231E1A3A%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/100% 100% no-repeat;box-shadow:none}
.pips i.now{background:var(--card);box-shadow:inset 0 0 0 2.5px var(--fg)}
.nav .side{width:44px;text-align:right;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body);justify-self:start}
.tag svg{width:16px;height:16px}
.wrap{position:absolute;top:110px;left:0;right:0;display:grid;align-content:start;gap:10px}
.ringbox{position:absolute;top:262px;left:50%;width:256px;height:256px;margin-left:-128px}
.ringbox svg.r{display:block;transform:rotate(-90deg)}
.arc{transition:stroke .4s var(--ease)}
.ringbox.done .arc{stroke:#FF9A5C}
[data-theme="dark"] .ringbox.done .arc{stroke:#FFD966}
.centre{position:absolute;inset:0;display:grid;place-items:center;align-content:center;text-align:center;gap:2px;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.ringbox.done .centre{opacity:0;transform:scale(.9)}
.centre .t-large{font-size:40px}
.medal{position:absolute;inset:0;display:grid;place-items:center}
.medal .stack{display:grid;justify-items:center;gap:6px;text-align:center}
.medal .rays{display:none}
.clasp{position:absolute;left:106px;top:-12px;width:44px;height:44px;border-radius:99px;box-shadow:0 0 0 5px var(--g)}
.xrow{position:absolute;top:572px;left:var(--gutter);right:var(--gutter);display:flex;gap:14px;align-items:center}
.xrow .say{display:grid;gap:2px}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="pips"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i></div></div>
    <span class="side t-foot muted">5 of 5</span>
  </div>
  <div class="wrap pad">
    <span class="tag f-mint" data-a style="--i:0"><span id="t-ic"></span>Your stress plan · 6 min</span>
    <h1 class="t-title" data-a style="--i:1">Commit to your Quit Day</h1>
    <p class="t-foot muted" data-a style="--i:2">Hold for three seconds to make it official. This one is a promise to yourself.</p>
  </div>
  <div class="ringbox" id="rb" data-a style="--i:3">
    <svg class="r" width="256" height="256" viewBox="0 0 256 256">
      <circle cx="128" cy="128" r="118" fill="none" stroke="var(--track)" stroke-width="16"/>
      <circle class="arc" id="arc" cx="128" cy="128" r="118" fill="none" stroke="var(--fg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="741.4" stroke-dashoffset="741.4"/>
    </svg>
    <div class="centre"><span class="t-foot muted">Friday</span><span class="t-large">Nov 6</span><span class="t-foot muted">Day Xero</span></div>
    <div class="medal" id="medal"></div>
    <div class="clasp" id="clasp"></div>
  </div>
  <div class="xrow" data-a style="--i:4">
    <div id="xero" style="flex:none"></div>
    <div class="say"><p class="t-head" id="say1">4 days to go</p><p class="t-foot muted" id="say2">Prep 5 to 7 get you ready. Keep using as normal until then.</p></div>
  </div>
  <div class="dock"><button class="btn" id="hold" data-hold="3000" data-autohold="1200" data-done="Committed" data-a style="--i:5">Hold to commit</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('t-ic').innerHTML = DX.icon('hand', {size:16});
const X = document.getElementById('xero'), arc = document.getElementById('arc'), rb = document.getElementById('rb'), btn = document.getElementById('hold');
const C = 741.4;
const reset = () => { X.innerHTML = DX.char('xero', {mood:'calm', size:88}); X.className = ''; rb.classList.remove('done'); document.getElementById('medal').innerHTML = ''; document.getElementById('clasp').innerHTML = ''; document.getElementById('clasp').style.visibility = 'hidden';
  arc.style.transition = 'none'; arc.style.strokeDashoffset = C; document.getElementById('say1').textContent = '4 days to go';
  document.getElementById('say2').textContent = 'Prep 5 to 7 get you ready. Keep using as normal until then.'; };
const fillRing = () => { if (rb.classList.contains('done')) return; arc.style.transition = 'stroke-dashoffset 3000ms linear, stroke .4s'; arc.style.strokeDashoffset = 0; };
const drain = () => { if (rb.classList.contains('done')) return; arc.style.transition = 'stroke-dashoffset 300ms ease-out'; arc.style.strokeDashoffset = C; };
btn.addEventListener('pointerdown', fillRing); btn.addEventListener('pointerup', drain); btn.addEventListener('pointerleave', drain);
const complete = () => {
  arc.style.transition = 'stroke .4s'; arc.style.strokeDashoffset = 0; rb.classList.add('done');
  document.getElementById('medal').innerHTML = `<div class="stack"><div data-stamp style="--d:350ms">${DX.badge({kind:'xero', n:'0', state:'next', size:104, bare:true})}</div>
    <div data-fade style="--d:700ms"><p class="t-head">Fri, Nov 6</p><p class="t-cap muted" style="margin-top:2px">Day Xero</p></div></div>`;
  const cl = document.getElementById('clasp'); cl.style.visibility = 'visible'; cl.innerHTML = DX.check({size:44, fg:'#0B2A1C', d:100});
  X.innerHTML = DX.char('xero', {mood:'cheer', size:88}); X.className = 'bump';
  document.getElementById('say1').textContent = 'Committed to Fri, Nov 6.';
  document.getElementById('say2').textContent = 'You earn this badge on the day.';
};
reset();
document.addEventListener('held', complete);
DX.after(0, reset);
DX.after(1200, fillRing);
</script>
</body></html>
