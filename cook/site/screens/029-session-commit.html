<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>029 Session commit</title>
<meta name="motion" content="The bar shows card 5 at its last step with Card 5 · Step 3 of 3 beside it; tag (Your stress plan), title, helper, your plan card (full width: When work piles up, Two sighs first), the Day Xero medal (the kit medal: gold rim with a soft highlight along its top-left edge, the brand mark, a soft shine; resting faded inside its empty hold ring) and the date, set a step under the title, arrive (600ms, 90ms stagger). Holding the button (3s, auto at 1.2s) fills the button and fills the thin muted track around the medal with gold in lockstep (linear, a soft haptic tick every 0.5s); letting go drains both (300ms). On held: the ring stays closed in the medal rim's gold, the medal stamps to full colour (620ms spring), and a soft shine crosses its face, the date bumps (520ms spring), the title cross-fades to You're committed and the helper to its second line (400ms), card 5's segment fills, and the button shows Committed (success haptic). 1200ms later the done button cross-fades (350ms) into Continue.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.k-try{--face:#9FE3BC}
[data-theme="dark"] .k-try{--face:#8FD3AD}
.steps > i.now::after{width:var(--sub,45%);transition:width .5s var(--settle)}
.nav .side{flex:none;color:var(--muted)}
/* the medal is centred, so the header block is centred over it */
.wrap{position:absolute;top:112px;left:0;right:0;display:grid;align-content:start;justify-items:center;text-align:center;gap:10px}
.tag{justify-self:center;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body)}
.tag svg{width:16px;height:16px}
/* dark: a deep mint pill with a mint label, never pale mint glaring on navy */
[data-theme="dark"] .tag.k-try{background:#1A4434;color:#9FE3BC;box-shadow:inset 0 0 0 1px rgba(159,227,188,.22)}
/* the plan you are committing to: a full-width card, left-aligned like the plan card on 026 */
.plan{justify-self:stretch;margin-top:6px;display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left}
.plan .d{width:40px;height:40px;border-radius:12px;background:var(--face);color:#1E1A3A;display:grid;place-items:center;flex:none}
.plan .d svg{width:20px;height:20px}
.plan .t-cap{display:block;color:var(--muted)}
.plan b{display:block;margin-top:3px;font:700 17px/1.25 var(--display);letter-spacing:-.2px}
/* title and helper swap in place after the hold */
.swap{display:grid}
.swap > *{grid-area:1/1;transition:opacity .4s var(--ease),transform .4s var(--ease)}
.swap .b{opacity:0;transform:translateY(6px)}
.done .swap .a{opacity:0;transform:translateY(-6px)}
.done .swap .b{opacity:1;transform:none}
/* the hold ring around the kit Day Xero medal (gold rim, the brand mark), with a soft shine on the face */
.ringbox{position:absolute;top:336px;left:50%;width:252px;height:252px;margin-left:-126px}
.ringbox svg.r{position:absolute;inset:0;display:block;transform:rotate(-90deg)}
.arc{transition:stroke .4s var(--ease)}
.coin{position:absolute;left:24px;top:24px;width:204px;height:204px}
/* the hold ring is the medal's glory here, so the kit rays (teeth at this size) stay off */
.coin .rays{display:none}
.coin .m{position:relative;width:204px;height:204px;border-radius:50%;opacity:.38;filter:saturate(.25);transition:opacity .4s var(--ease),filter .4s var(--ease)}
.done .coin .m{opacity:1;filter:none}
.coin .gloss{position:absolute;inset:0;pointer-events:none}
.when{position:absolute;top:608px;left:0;right:0;text-align:center;display:grid;gap:4px;justify-items:center}
/* the date is a step under the title (22px), so You're committed leads */
.when .dt{font:800 22px/1.15 var(--display);letter-spacing:-.4px;margin:0}
/* after the hold the button hands over to Continue (same as Quit Day in onboarding) */
.btns{position:relative;height:58px}
.btns .btn{position:absolute;inset:0;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.btns #go{opacity:0;pointer-events:none;transform:translateY(6px)}
.btns.next #hold{opacity:0;pointer-events:none}
.btns.next #go{opacity:1;pointer-events:auto;transform:none}
</style>
</head><body>
<div class="screen" data-ground="table" id="scr">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" id="steps" aria-label="Card 5, step 3 of 3" style="--sub:83%"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i></div></div>
    <span class="side t-cap">Card 5 · Step 3 of 3</span>
  </div>
  <div class="wrap pad">
    <span class="tag k-try" data-a style="--i:0"><span class="sp"></span>Your stress plan</span>
    <h1 class="t-large swap" data-a style="--i:1"><span class="a">Commit to Day Xero</span><span class="b">You're committed</span></h1>
    <p class="t-foot muted swap" data-a style="--i:2"><span class="a">Hold for three seconds to make it official.</span><span class="b">A promise to yourself, with a plan behind it.</span></p>
    <div class="plan card k-try" data-a style="--i:3"><span class="d sp"></span><span><span class="t-cap">When work piles up</span><b>Two sighs first</b></span></div>
  </div>
  <div class="ringbox" data-a style="--i:4">
    <div class="coin"><div id="stampwrap"><div class="m" id="medal"></div></div></div>
    <svg class="r" width="252" height="252" viewBox="0 0 252 252" aria-hidden="true">
      <circle cx="126" cy="126" r="122.5" fill="none" stroke="var(--track)" stroke-width="3.5"/>
      <circle class="arc" id="arc" cx="126" cy="126" r="122.5" fill="none" stroke="#F5B83D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="769.7" stroke-dashoffset="769.7"/>
    </svg>
  </div>
  <div class="when" data-a style="--i:5">
    <div id="date"><p class="dt">Fri, Nov 6</p></div>
    <p class="t-foot muted">4 days to Day Xero</p>
  </div>
  <div class="dock">
    <div class="btns" id="btns" data-a style="--i:6">
      <button class="btn" id="hold" data-hold="3000" data-autohold="1200" data-done="Committed">Hold to commit</button>
      <button class="btn" id="go">Continue</button>
    </div>
  </div>
</div>
<script>
const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8c.7 4.9 2.3 6.6 7.4 7.4-5.1.8-6.7 2.5-7.4 7.4-.7-4.9-2.3-6.6-7.4-7.4 5.1-.8 6.7-2.5 7.4-7.4z"/><circle cx="18.6" cy="18.4" r="1.8"/></svg>';
document.getElementById('close').innerHTML = DX.icon('close');
document.querySelectorAll('.sp').forEach(e => e.insertAdjacentHTML('afterbegin', SPARK));
const $ = id => document.getElementById(id);
const arc = $('arc'), scr = $('scr'), btn = $('hold'), sw = $('stampwrap'), medal = $('medal'), date = $('date');
/* the kit medal (gold rim, face, the brand mark), plus a soft top-left shine clipped to the medal */
medal.innerHTML = DX.badge({kind:'xero', size:204, bare:true, label:'Day Xero'}) +
  `<svg class="gloss" width="204" height="204" viewBox="0 0 100 100" aria-hidden="true"><defs>
    <radialGradient id="gl" cx="34%" cy="26%" r="62%"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".45" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".45" stop-color="#fff" stop-opacity=".15"/><stop offset=".7" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="glc"><circle cx="50" cy="50" r="46.5"/></clipPath></defs>
    <circle cx="50" cy="50" r="46.5" fill="url(#gl)" clip-path="url(#glc)"/>
    <circle cx="50" cy="50" r="45.6" fill="none" stroke="url(#rim)" stroke-width="1.6"/></svg>`;
const C = 769.7;
const reset = () => { scr.classList.remove('done'); $('btns').classList.remove('next'); sw.removeAttribute('data-stamp'); medal.classList.remove('shine'); date.className = '';
  $('steps').style.setProperty('--sub', '83%'); arc.style.transition = 'none'; arc.style.strokeDashoffset = C; };
const fillRing = () => { if (scr.classList.contains('done')) return; arc.style.transition = 'stroke-dashoffset 3000ms linear, stroke .4s'; arc.style.strokeDashoffset = 0; };
const drain = () => { if (scr.classList.contains('done')) return; arc.style.transition = 'stroke-dashoffset 300ms ease-out'; arc.style.strokeDashoffset = C; };
btn.addEventListener('pointerdown', fillRing); btn.addEventListener('pointerup', drain); btn.addEventListener('pointerleave', drain);
const complete = () => {
  arc.style.transition = 'stroke .4s'; arc.style.strokeDashoffset = 0; scr.classList.add('done');
  sw.setAttribute('data-stamp', ''); sw.style.setProperty('--d', '120ms'); medal.classList.add('shine'); medal.style.setProperty('--d', '600ms');
  date.className = 'bump'; date.style.setProperty('--d', '300ms'); $('steps').style.setProperty('--sub', '100%');
};
reset();
document.addEventListener('held', complete);
DX.after(0, reset);
DX.after(1200, fillRing);
/* 1200ms after the hold lands, the button hands over to Continue */
DX.after(1200 + 3000 + 1200, () => $('btns').classList.add('next'));
DX.onStill(() => $('btns').classList.add('next'));
</script>
</body></html>
