<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>015 Today, prep week</title>
<meta name="motion" content="The dawn sun rises behind the hills (2.6s) while Xero settles onto the cream disc (900ms); the prep ring sweeps from 0 to 3 of 7 (1.4s, 250ms delay) and its dot fades in at the end. Greeting, countdown (the 4 counts down from 7), reason, the session card with its single Start button and the stamps strip arrive with a 90ms stagger; Prep 1 to 3 rise in one by one (90ms apart, no spring: they were earned earlier) and today's open Prep 4 slot breathes its outline (2.4s loop) and Prep 5 to 7 and the Day Xero slot wait as dashed medallions (Day Xero with its faint sun). Light haptic when the ring lands.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .hero { position: absolute; left: 0; right: 0; top: 0; height: 346px; border-radius: 0 0 36px 36px; overflow: hidden; }
  .hero .scene { position: absolute; inset: 0; }
  /* dark: pre-dawn, not brown. Navy night at the top lifting to a warm horizon glow. */
  [data-theme="dark"] .hero .scene svg { filter: brightness(.82) saturate(.95); }
  [data-theme="dark"] .ringwrap .disc { background: rgba(255,195,138,.2); }
  [data-theme="dark"] .hero .scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,19,34,.9) 0%, rgba(14,19,34,.62) 38%, rgba(14,19,34,.38) 70%, rgba(14,19,34,.55) 100%); }
  .ringwrap { position: absolute; left: 50%; top: 72px; width: 210px; height: 210px; margin-left: -105px; }
  .ringwrap .disc { position: absolute; inset: 21px; border-radius: 50%; background: rgba(255,248,238,.74); }
  .ringwrap .ring { position: absolute; inset: 0; --ringc: #1E1A3A; --ringt: rgba(255,248,238,.72); }
  [data-theme="dark"] .ringwrap .ring { --ringc: #FFC38A; --ringt: rgba(255,248,238,.3); }
  .ringwrap .ring circle[fill="#fff"] { filter: drop-shadow(0 1px 3px rgba(30,26,58,.35)); }
  [data-theme="dark"] .ringwrap .ring circle[fill="#fff"] { fill: #FFF6E8; stroke: #0E1322; filter: drop-shadow(0 0 0 #FFC38A) drop-shadow(0 0 6px rgba(255,195,138,.55)); }
  .ringwrap .ch { position: absolute; left: 0; right: 0; top: 36px; display: grid; place-items: center; }
  .pill { position: absolute; left: 0; right: 0; top: 292px; display: flex; justify-content: center; }
  .pill span { background: var(--card); color: var(--fg); border-radius: 99px; padding: 10px 16px; font: 600 14px/1 var(--body); display: inline-flex; gap: 8px; align-items: center; box-shadow: 0 6px 16px rgba(30,26,58,.12); }
  .pill i { width: 6px; height: 6px; border-radius: 99px; background: var(--fg); opacity: .4; }

  .content { position: absolute; left: 0; right: 0; top: 366px; padding: 0 var(--gutter); }
  .content .count { margin-top: 8px; }
  .content .count b { font-weight: 700; }
  .reason { margin-top: 10px; color: var(--muted); }
  .sess { margin-top: 24px; display: flex; align-items: center; gap: 14px; }
  .sess .grow { flex: 1; min-width: 0; }
  .sess .t-foot { color: var(--muted); }
  .sess .btn.small { width: auto; padding: 0 18px 0 14px; flex: none; }
  .sess .btn svg { width: 16px; height: 16px; }
  .stamps { margin-top: 12px; padding: 14px 14px 12px; }
  .stamps .head { display: flex; justify-content: space-between; align-items: baseline; }
  .stamps .head .t-foot { color: var(--muted); }
  .stamps .row8 { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 12px; }
  .slot { position: relative; width: 36px; display: grid; justify-items: center; gap: 6px; }
  .slot .face { position: relative; width: 36px; height: 36px; display: grid; place-items: center; }
  .slot .face svg { position: absolute; inset: 0; }
  .slot .num { position: relative; font: 800 15px/1 var(--display); color: #1E1A3A; letter-spacing: -.3px; }
  .slot .t-cap { font-size: 13px; white-space: nowrap; color: var(--fg); }
  .slot.later .num, .slot.goal .num { color: var(--fg); }
  .slot.goal .num { top: -3px; font-size: 14px; }
  .slot.now .face { border-radius: 99px; background: var(--card-2); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--fg) 30%, transparent); }
  .slot.now .num { color: var(--fg); }
  .slot.now .face::after { content: ""; position: absolute; inset: -4px; border-radius: 99px; box-shadow: inset 0 0 0 2px var(--fg); opacity: .55; }
  .play .slot.now .face::after { animation: nowpulse 2.4s ease-in-out infinite; }
  @keyframes nowpulse { 50% { opacity: .18; transform: scale(1.08); } }
  .slot.goal .num { color: var(--fg); }
</style>
</head><body>
<div class="screen" data-ground="apricot" data-status="on-art">
  <div class="hero">
    <div class="scene" id="scene"></div>
    <div class="ringwrap">
      <div class="disc"></div>
      <div class="ring" id="ring"></div>
      <div class="ch" id="xero" data-settle></div>
    </div>
    <div class="pill" data-a style="--i:1;--d:500ms"><span>Prep 4 of 7<i></i>Mon, Nov 2</span></div>
  </div>

  <div class="content">
    <h1 class="t-large" data-a style="--i:2">Good morning, Sam</h1>
    <p class="t-body count" data-a style="--i:3"><b><span data-count="4" data-from="7" data-delay="500">4</span> days</b> to Quit Day. This one is about stress.</p>
    <p class="t-foot reason" data-a style="--i:4">&ldquo;Run with Aria without stopping to catch my breath&rdquo;</p>

    <div class="card sess" data-a style="--i:5">
      <span class="ico-tile" id="ic-sess"></span>
      <div class="grow">
        <p class="t-foot">Prep 4 &middot; 28 min</p>
        <p class="t-head">The stress loop</p>
      </div>
      <button class="btn small" id="start"></button>
    </div>

    <div class="card stamps" data-a style="--i:6">
      <div class="head"><span class="t-head" style="font-size:17px">Prep stamps</span><span class="t-foot"><span data-count="3">3</span> of 7 &middot; Quit Day Fri, Nov 6</span></div>
      <div class="row8" id="row8"></div>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#scene').innerHTML = DX.char('horizon', { scene: 'dawn', w: 390, h: 346, clarity: 85, noDusk: true });
  $('#ring').innerHTML = DX.ring({ size: 210, stroke: 11, p: 3 / 7, color: 'var(--ringc)', track: 'var(--ringt)', dot: true });
  $('#xero').innerHTML = DX.char('xero', { mood: 'hello', size: 138, stage: 1 });
  $('#ic-sess').innerHTML = DX.icon('headphones');
  $('#start').innerHTML = DX.icon('play', { fill: 'currentColor', w: 1.5 }) + 'Start';
  let h = '';
  const face = (svg, n) => `<div class="face">${svg}<span class="num">${n}</span></div>`;
  for (let n = 1; n <= 3; n++) h += `<div class="slot" data-a style="--i:${n};--d:640ms">${face(DX.badge({ kind: 'prep', n: '', size: 36, bare: true }), n)}</div>`;
  h += `<div class="slot now">${face('', 4)}<span class="t-cap">Today</span></div>`;
  for (let n = 5; n <= 7; n++) h += `<div class="slot later">${face(DX.badge({ kind: 'prep', n: '', state: 'next', size: 36, bare: true }), n)}</div>`;
  h += `<div class="slot goal">${face(DX.badge({ kind: 'xero', n: '', state: 'next', size: 36, bare: true }), '0')}<span class="t-cap">Nov 6</span></div>`;
  $('#row8').innerHTML = h;
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));
</script>
</body></html>
