<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>015 Today, prep week</title>
<meta name="motion" content="The dawn sun rises behind the hills (2.6s) while the cream disc fades up (700ms) and Xero settles onto it (900ms), then bobs gently. The date pill, greeting, today line and the session card with its single Start button arrive with a 90ms stagger. The countdown card is the one meter: its 4 counts down from 7 (850ms), Prep 1 to 3 stamps rise in one by one (90ms apart, no spring: earned earlier), today's open Prep 4 slot breathes its coral outline (2.4s loop), and Prep 5 to 7 and the Day Xero coin wait in dashed rings. 'Later today' and the top of its quiet list rise in last under the tab bar (600ms), so the page reads as the top of one scroll. Light haptic when the countdown lands.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .hero { position: absolute; left: 0; right: 0; top: 0; height: 306px; border-radius: 0 0 36px 36px; overflow: hidden; }
  .hero .scene { position: absolute; inset: 0; }
  /* one soft cream disc behind Xero: no outer ring, so it never reads as a target */
  .ringwrap { position: absolute; left: 50%; top: 58px; width: 190px; height: 190px; margin-left: -95px; }
  .ringwrap .disc { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,248,238,.72); box-shadow: 0 0 34px rgba(255,248,238,.4); }
  [data-theme="dark"] .ringwrap .disc { background: rgba(255,248,238,.1); box-shadow: 0 0 40px rgba(255,195,138,.10); }
  .ringwrap .ch { position: absolute; left: 0; right: 0; top: 22px; display: grid; place-items: center; }
  .pill { position: absolute; left: 0; right: 0; top: 256px; display: flex; justify-content: center; }
  .pill span { background: var(--card); color: var(--fg); border-radius: 99px; padding: 10px 16px; font: 600 14px/1 var(--body); box-shadow: 0 6px 16px rgba(30,26,58,.12); }

  .content { position: absolute; left: 0; right: 0; top: 328px; padding: 0 var(--gutter); }
  .content .sub { margin-top: 6px; color: var(--muted); }
  .sess { margin-top: 18px; display: flex; align-items: center; gap: 14px; padding: 16px 16px 16px 20px; }
  .sess .grow { flex: 1; min-width: 0; }
  .sess .t-foot { color: var(--muted); }
  .sess .btn.small { width: auto; padding: 0 18px 0 14px; flex: none; }
  .sess .btn svg { width: 16px; height: 16px; }

  /* the one meter: the prep week as stamps, one colour code (apricot and coral) in both modes */
  .stamps { margin-top: 10px; padding: 16px 14px 14px; }
  .stamps .head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; }
  .stamps .head .t-foot { color: var(--muted); }
  .stamps .row8 { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 14px; }
  .slot { position: relative; width: 34px; display: grid; justify-items: center; gap: 7px; }
  .slot .face { position: relative; width: 34px; height: 34px; display: grid; place-items: center; margin: 7px 0; }
  .slot .face svg { position: absolute; inset: 0; }
  .slot .num { position: relative; font: 800 15px/1 var(--display); color: #1E1A3A; letter-spacing: -.3px; }
  .slot .t-cap { font-size: 12px; white-space: nowrap; color: var(--fg); }
  .slot.later .num { color: var(--fg); opacity: .8; }
  .slot.now .face { border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 2.5px #FF7A55; }
  .slot.now .num { color: var(--fg); }
  .slot.now .face::after { content: ""; position: absolute; inset: -5px; border-radius: 99px; box-shadow: inset 0 0 0 2px #FF7A55; opacity: .4; }
  .play .slot.now .face::after { animation: nowpulse 2.4s ease-in-out infinite; }
  @keyframes nowpulse { 50% { opacity: .1; transform: scale(1.08); } }
  .slot.now .t-cap { color: #C2402A; font-weight: 700; }
  [data-theme="dark"] .slot.now .face { background: var(--card-2); }
  [data-theme="dark"] .slot.now .t-cap { color: #FF9A7A; }
  .slot.goal { width: 50px; margin-left: 2px; }
  .slot.goal .face { width: 50px; height: 50px; margin: -1px 0; }
  .slot.goal .t-cap { font-weight: 700; }

  /* the next section peeks above the tab bar: one quiet list, like Today after Quit Day */
  .grp { font: 700 19px/1.2 var(--display); letter-spacing: -.2px; margin: 22px 0 10px 2px; }
  .later-list { border-radius: 22px; background: color-mix(in srgb, var(--card) 60%, transparent); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .lrow { display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 10px 14px 10px 16px; }
  .lrow .grow { flex: 1; min-width: 0; }
  .lrow .t-head { font-size: 16px; font-weight: 700; }
  .lrow .t-cap { color: var(--muted); margin-top: 3px; font-weight: 500; }
  .lrow .ic { width: 22px; height: 22px; flex: none; color: var(--muted); }
  .lrow .chev { width: 18px; height: 18px; }
</style>
</head><body>
<div class="screen" data-ground="apricot" data-status="on-art">
  <div class="hero">
    <div class="scene" id="scene"></div>
    <div class="ringwrap" data-fade style="--d:150ms">
      <div class="disc"></div>
      <div class="ch" data-settle><div class="bob" id="xero"></div></div>
    </div>
    <div class="pill" data-a style="--i:1;--d:500ms"><span>Mon, Nov 2 &middot; Prep 4</span></div>
  </div>

  <div class="content">
    <h1 class="t-large" data-a style="--i:2">Good morning, Sam</h1>
    <p class="t-body sub" data-a style="--i:3">Today is about stress, and a breath that works.</p>

    <div class="card sess" data-a style="--i:4">
      <div class="grow">
        <p class="t-foot">Prep 4 &middot; 5 cards &middot; 28 min</p>
        <p class="t-head">The stress loop</p>
      </div>
      <button class="btn small" id="start"></button>
    </div>

    <div class="card stamps" data-a style="--i:5" aria-label="Prep 1 to 3 done, Prep 4 today, Prep 5 to 7 and Day Xero ahead">
      <div class="head"><span class="t-head" style="font-size:17px"><span data-count="4" data-from="7" data-delay="600">4</span> days to Quit Day</span><span class="t-foot">Fri, Nov 6</span></div>
      <div class="row8" id="row8"></div>
    </div>

    <h2 class="grp" data-a style="--i:6">Later today</h2>
    <div class="later-list" data-a style="--i:7">
      <div class="lrow"><span class="ic" data-ic="note"></span><div class="grow"><p class="t-head">Log today's cigarettes</p><p class="t-cap">Tonight &middot; 1 min</p></div><span class="chev" data-ic="chev"></span></div>
      <div class="lrow"><span class="ic" data-ic="leaf"></span><div class="grow"><p class="t-head">Wind-down breath</p><p class="t-cap">10 PM &middot; 3 min</p></div><span class="chev" data-ic="chev"></span></div>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#scene').innerHTML = DX.char('horizon', { scene: 'dawn', w: 390, h: 330, clarity: 85 });
  $('#xero').innerHTML = DX.char('xero', { mood: 'hello', size: 140, stage: 1 });
  $('#start').innerHTML = DX.icon('play', { fill: 'currentColor', w: 1.5 }) + 'Start';
  let h = '';
  const face = (svg, n) => `<div class="face">${svg}<span class="num">${n}</span></div>`;
  for (let n = 1; n <= 3; n++) h += `<div class="slot" data-a style="--i:${n};--d:640ms">${face(DX.badge({ kind: 'prep', n: '', size: 34, bare: true }), n)}</div>`;
  h += `<div class="slot now">${face('', 4)}<span class="t-cap">Today</span></div>`;
  for (let n = 5; n <= 7; n++) h += `<div class="slot later">${face(DX.badge({ kind: 'prep', n: '', state: 'next', size: 34, bare: true }), n)}</div>`;
  h += `<div class="slot goal"><div class="face">${DX.badge({ kind: 'xero', state: 'next', size: 50, bare: true, label: 'Day Xero' })}</div><span class="t-cap">Day Xero</span></div>`;
  $('#row8').innerHTML = h;
  document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = DX.icon(el.dataset.ic, { size: el.classList.contains('chev') ? 18 : 22 }); });
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));
</script>
</body></html>
