<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>061 Settings</title>
<meta name="motion" content="The profile card arrives first: its dawn sky (a brighter pre-dawn in dark) lifts its sun as Xero settles onto the near hill at 450ms, then the Day 7 medal stamps into its place beside the chevron at 700ms; each group arrives top to bottom on the 90ms stagger. Rows highlight on press with a light tap haptic and push their page from the right; the profile card opens Subscription.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* settings family: section labels, small tinted icon tiles (one tint per group), values */
.sec { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 4px 6px; color: var(--muted); font-size: 14px; }
.rt { font-weight: 600; }
.ico-tile.s { width: 32px; height: 32px; border-radius: 10px; }
.ico-tile.s svg { width: 18px; height: 18px; }
.ico-tile.apr { background: #FFE6D0; color: #A8481F; } .ico-tile.sky { background: #E1E7F8; color: #2C468E; } .ico-tile.mint { background: #DDF1E4; color: #22704A; }
[data-theme="dark"] .ico-tile.apr { background: rgba(255,195,138,.16); color: #FFC38A; } [data-theme="dark"] .ico-tile.sky { background: rgba(160,186,255,.15); color: #B4C6FF; } [data-theme="dark"] .ico-tile.mint { background: rgba(159,227,188,.13); color: #9FE3BC; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row { min-height: 46px; padding-top: 3px; padding-bottom: 3px; gap: 12px; }

.prof { padding: 0; overflow: hidden; margin-top: 4px; position: relative; display: block; color: var(--fg); text-decoration: none; }
.prof .sky { position: relative; height: 86px; overflow: hidden; }
.prof .sky .art, .prof .sky .hill { position: absolute; inset: 0; }
.prof .sky .art svg, .prof .sky .hill svg { display: block; }
.prof .sky .xs { position: absolute; left: 34px; top: 2px; }
.prof .top { display: flex; align-items: center; gap: 10px; padding: 8px 14px 10px 16px; }
.prof .grow { flex: 1; min-width: 0; }
.prof .medal { flex: none; }
.sup { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sup .row { min-height: 46px; padding: 4px 12px; gap: 10px; background: var(--card); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); }
.ver { font: 500 13px/1 var(--body); color: var(--muted); }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Close" data-ic="close"></button><div class="grow title" data-a style="--i:0">Settings</div><span style="width:44px;flex:none"></span></div>
<div class="scroll" style="padding-top:96px"><div class="pad">
  <a class="card prof" data-go="068-settings-subscription" data-a style="--i:1" aria-label="Sam, DayXero Yearly, open subscription">
    <div class="sky"><div class="art" id="sky"></div><div class="hill" id="hill"></div><div class="xs" id="av" data-settle style="--d:450ms"></div></div>
    <div class="top">
      <div class="grow"><div class="t-title">Sam</div><div class="t-foot muted">DayXero Yearly, renews Nov 6</div></div>
      <div class="medal" id="bdg" data-stamp style="--d:700ms"></div>
      <span class="chev" data-ic="chev" data-s="18"></span>
    </div>
  </a>
  <p class="t-foot sec" data-a style="--i:2">Your plan</p>
  <div class="list" data-a style="--i:3">
    <div class="row"><span class="ico-tile s apr" data-ic="calendar"></span><div class="grow"><div class="t-body rt">Quit Day</div></div><span class="val">Fri, Nov 6</span><span class="chev" data-ic="chev" data-s="18"></span></div>
    <div class="row"><span class="ico-tile s apr" data-ic="cig"></span><div class="grow"><div class="t-body rt">What you use</div></div><span class="val">Cigarettes, vape</span><span class="chev" data-ic="chev" data-s="18"></span></div>
    <div class="row"><span class="ico-tile s apr" data-ic="patch"></span><div class="grow"><div class="t-body rt">NRT plan</div></div><span class="val">Patch, 21 mg</span><span class="chev" data-ic="chev" data-s="18"></span></div>
    <div class="row"><span class="ico-tile s apr" data-ic="globe"></span><div class="grow"><div class="t-body rt">Currency</div></div><span class="val">USD</span><span class="chev" data-ic="chev" data-s="18"></span></div>
  </div>
  <p class="t-foot sec" data-a style="--i:4">Your day</p>
  <div class="list" data-a style="--i:5">
    <div class="row"><span class="ico-tile s sky" data-ic="bell"></span><div class="grow"><div class="t-body rt">Reminders</div></div><span class="val">3 on</span><span class="chev" data-ic="chev" data-s="18"></span></div>
    <div class="row"><span class="ico-tile s sky" data-ic="moon"></span><div class="grow"><div class="t-body rt">Day ends at</div></div><span class="val">4 AM</span><span class="chev" data-ic="chev" data-s="18"></span></div>
  </div>
  <p class="t-foot sec" data-a style="--i:6">Your data</p>
  <div class="list" data-a style="--i:7">
    <div class="row"><span class="ico-tile s mint" data-ic="heart"></span><div class="grow"><div class="t-body rt">Apple Health</div></div><span class="val">On</span><span class="chev" data-ic="chev" data-s="18"></span></div>
    <div class="row"><span class="ico-tile s mint" data-ic="shield"></span><div class="grow"><div class="t-body rt">Privacy</div></div><span class="chev" data-ic="chev" data-s="18"></span></div>
  </div>
  <p class="t-foot sec" data-a style="--i:8"><span>Support</span><span class="ver">DayXero 1.0</span></p>
  <div class="sup" data-a style="--i:9">
    <div class="row"><span class="ico-tile s" id="help"></span><div class="grow"><div class="t-body rt">Help</div></div><span class="chev" data-ic="chev" data-s="18"></span></div>
    <div class="row"><span class="ico-tile s" id="mail"></span><div class="grow"><div class="t-body rt">Contact</div></div><span class="chev" data-ic="chev" data-s="18"></span></div>
  </div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
const line = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
document.getElementById('help').innerHTML = line('M12 21a9 9 0 100-18 9 9 0 000 18zM9.5 9.5a2.5 2.5 0 114 2c-1 .6-1.5 1.2-1.5 2.2M12 17h.01');
document.getElementById('mail').innerHTML = line('M4 6.5h16v11H4zM4.5 7l7.5 6 7.5-6');

const dark = DX.theme === 'dark';
/* Light: the kit's dawn. Dark: a brighter pre-dawn band painted here (warm horizon, a rising sun, the last stars). Xero stands on the near hill. */
const W = 346, H = 86;
document.getElementById('sky').innerHTML = dark
  ? `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs>
      <linearGradient id="pd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D2C5E"/><stop offset=".55" stop-color="#4A5488"/><stop offset="1" stop-color="#E7A27A"/></linearGradient>
      <radialGradient id="pg"><stop offset="0" stop-color="#FFD08A" stop-opacity=".75"/><stop offset="1" stop-color="#FFD08A" stop-opacity="0"/></radialGradient></defs>
      <rect width="${W}" height="${H}" fill="url(#pd)"/>
      ${[[150, 14], [204, 24], [262, 10], [318, 30], [120, 34]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 2 ? 1.1 : 1.5}" fill="#fff" opacity="${i % 2 ? .55 : .9}"/>`).join('')}
      <circle cx="236" cy="72" r="58" fill="url(#pg)"/><circle cx="236" cy="72" r="22" fill="#FFD27A"/></svg>`
  : DX.char('horizon', { scene: 'dawn', w: W, h: H, clarity: 88, fit: 'xMidYMid slice' });
document.getElementById('hill').innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="ph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${dark ? '#2A3866' : '#FFA27A'}"/><stop offset="1" stop-color="${dark ? '#1B2650' : '#F0794F'}"/></linearGradient></defs>
  <path d="M0 ${H} V76 C30 72 70 72 110 76 C170 82 250 78 ${W} 70 V${H}Z" fill="url(#ph)"/></svg>`;
document.getElementById('av').innerHTML = DX.char('xero', { mood: 'hello', size: 84 });
document.getElementById('bdg').innerHTML = DX.badge({ kind: 'day', n: 7, state: 'earned', size: 46, bare: true, label: 'Day 7' });
</script>
</body></html>
