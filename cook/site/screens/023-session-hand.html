<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>023 Session hand</title>
<meta name="motion" content="Title, line and the prep stamps arrive (600ms, 90ms stagger). The four back cards deal in from below one by one and stand level behind, outer two a step lower (760ms settle each, 120ms apart, from 300ms), each showing only its icon: Try mint, Reveal sky, Myth or fact rose, Try mint. Then card 1, the apricot Listen card, rises level in front of them (900ms settle at 820ms) and Xero, in his headphones, settles in front of its sun (700ms at 1200ms) and sways gently to the music (5s bob loop). The button arrives last. Light haptic on each card landing, a medium one when card 1 lands.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* one colour per card type, shared by every session screen: Listen apricot, Try mint, Reveal sky, Myth or fact rose.
   Dark mode deepens the pastels a step so they sit on navy without glaring. */
.k-listen{--face:#FFC38A;--face-2:#FFD6AC;--sunc:#FFE6BC}.k-try{--face:#9FE3BC}.k-reveal{--face:#9CCBFF}.k-myth{--face:#FFB9A6}
[data-theme="dark"] .k-listen{--face:#F3B47E;--face-2:#F7C595;--sunc:#FDDDAE}[data-theme="dark"] .k-try{--face:#8FD3AD}[data-theme="dark"] .k-reveal{--face:#8EBBEC}[data-theme="dark"] .k-myth{--face:#EFA894}
.head{position:absolute;top:112px;left:0;right:0;display:grid;gap:6px}
.stamps{position:absolute;top:184px;left:var(--gutter);right:var(--gutter);display:flex;align-items:center;gap:8px}
.stamps .t-foot{margin-left:8px}
/* the hand: four cards standing level behind (icons only), card 1 drawn out in front. The hand is 310px wide, centred. */
.fan{position:absolute;top:318px;left:50%;width:310px;margin-left:-155px;height:360px}
.bc{position:absolute;top:0;left:calc(50% + var(--x));width:84px;height:170px;margin-left:-42px;border-radius:16px;background:var(--face);color:#1E1A3A;
  display:grid;justify-items:center;align-content:start;padding-top:14px;transform:translateY(var(--y));box-shadow:0 8px 18px rgba(60,40,20,.12)}
[data-theme="dark"] .bc{box-shadow:0 10px 22px rgba(0,0,0,.42)}
.bc .ic{width:36px;height:36px;border-radius:99px;background:rgba(30,26,58,.1);display:grid;place-items:center}
.bc .ic svg{width:19px;height:19px}
.play .bc{animation:deal 760ms var(--settle) both;animation-delay:calc(300ms + var(--k) * 120ms)}
@keyframes deal{from{opacity:0;transform:translateY(420px)}35%{opacity:1}to{opacity:1;transform:translateY(var(--y))}}
/* card 1: a small Listen player, the same art as the card it opens (024) */
.front{position:absolute;left:50%;top:82px;width:252px;margin-left:-126px;border-radius:24px;background:var(--face);color:#1E1A3A;overflow:hidden;
  box-shadow:0 0 0 1.5px var(--fg),0 16px 28px rgba(60,40,20,.18)}
[data-theme="dark"] .front{box-shadow:0 0 0 1.5px var(--fg),0 18px 32px rgba(0,0,0,.5)}
.play .front{animation:lift 900ms var(--settle) both 820ms}
@keyframes lift{from{opacity:0;transform:translateY(300px)}40%{opacity:1}to{opacity:1;transform:none}}
.front .art{position:relative;height:138px;background:linear-gradient(to bottom,var(--face-2),var(--face))}
.front .sun{position:absolute;left:50%;top:16px;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:var(--sunc)}
.front .xw{position:absolute;left:50%;bottom:-6px;width:124px;margin-left:-62px}
.play .front .xw{animation:dx-settle 700ms var(--settle) both 1200ms}
.front .in{padding:14px 18px 20px}
.front .kind{display:flex;align-items:center;gap:7px;font:600 14px/1 var(--body);color:#3A2410}
.front .kind svg{width:17px;height:17px}
.front h2{font:800 24px/1.1 var(--display);letter-spacing:-.5px;margin:10px 0 0;text-wrap:balance}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav"><button class="icon-btn" aria-label="Close" id="close"></button></div>
  <div class="head pad">
    <h1 class="t-large" data-a style="--i:0">The stress loop</h1>
    <p class="t-foot muted" data-a style="--i:1">Prep 4 · 5 cards · about 28 min</p>
  </div>
  <div class="stamps" id="stamps" data-a style="--i:2"></div>
  <div class="fan" id="fan"></div>
  <div class="dock"><button class="btn" data-a style="--i:10;--d:700ms">Play card 1</button></div>
</div>
<script>
/* one glyph per card type: Try hand, Reveal eye, Myth or fact question mark, Your stress plan spark */
const G = {
  question: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 8.6a3.5 3.5 0 116.2 2.2c-.9 1-2.8 1.7-2.8 3.6v.4"/><path d="M12 18.6h.01" stroke-width="3"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8c.7 4.9 2.3 6.6 7.4 7.4-5.1.8-6.7 2.5-7.4 7.4-.7-4.9-2.3-6.6-7.4-7.4 5.1-.8 6.7-2.5 7.4-7.4z"/><circle cx="18.6" cy="18.4" r="1.8"/></svg>'
};
const ic = n => G[n] || DX.icon(n);
document.getElementById('close').innerHTML = DX.icon('close');
/* the kit stamp family, as on the Program path: Prep 1 to 3 earned, Prep 4 waiting */
document.getElementById('stamps').innerHTML = [1,2,3].map(n => DX.badge({kind:'prep', n, size:46, bare:true})).join('') +
  DX.badge({kind:'prep', n:4, state:'next', size:46, bare:true}) + '<span class="t-foot muted">Today</span>';
/* cards 2 to 5: Try (breath), Reveal, Myth or fact, Try (your stress plan); level, icons only, outer two a step lower */
const back = [['try','hand','Try'], ['reveal','eye','Reveal'], ['myth','question','Myth or fact'], ['try','spark','Try']];
const X = [-113, -38, 38, 113], Y = [16, 0, 0, 16];
/* Xero in headphones (same drawing as 024): band and cups go into his body group so they sway with him */
const PHONES = `<g aria-hidden="true">
  <path d="M38 108 C30 -4 170 -4 162 108" fill="none" stroke="#1E1A3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M52 62 C66 30 100 22 122 26" fill="none" stroke="#FFF8EE" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <rect x="18" y="88" width="30" height="48" rx="14" fill="#1E1A3A"/><rect x="24" y="96" width="9" height="32" rx="4.5" fill="#FF9A6B"/>
  <rect x="152" y="88" width="30" height="48" rx="14" fill="#1E1A3A"/><rect x="167" y="96" width="9" height="32" rx="4.5" fill="#FF9A6B"/></g>`;
let xs = DX.char('xero', {mood:'calm', size:124});
const mi = xs.indexOf('stroke-width="3.5"'); const end = xs.indexOf('</path>', mi) + 7;
xs = xs.slice(0, end) + PHONES + xs.slice(end);
document.getElementById('fan').innerHTML = back.map((c, k) => `<div class="bc k-${c[0]}" style="--x:${X[k]}px;--y:${Y[k]}px;--k:${k}" aria-label="${c[2]}"><span class="ic">${ic(c[1])}</span></div>`).join('') +
  `<div class="front k-listen"><div class="art"><div class="sun"></div><div class="xw"><div class="bob">${xs}</div></div></div>
   <div class="in"><div class="kind">${DX.icon('headphones', {size:17, w:2.4})}Listen · 6 min</div><h2>Why it feels like it calms you</h2></div></div>`;
</script>
</body></html>
