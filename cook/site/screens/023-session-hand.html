<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>023 Session hand</title>
<meta name="motion" content="Title, line and the prep stamps arrive (600ms, 90ms stagger). The four back cards deal in from below one by one and stand level behind, outer two a step lower (760ms settle each, 120ms apart, from 300ms), each showing only its small paper-cut spot (the same craft as the option tiles on 027): Try mint (two breaths), Reveal sky (a sun behind a cloud), Myth or fact rose (two speech bubbles), Try mint (a path to a flag). Then card 1, the Listen card (apricot with a flat paper sun in light; the same deep dusk player as 024 in dark, so the hand-off keeps its colour), rises level in front of them (900ms settle at 820ms) and Xero, in his headphones, settles in front of its sun (700ms at 1200ms) and sways gently to the music (5s bob loop). The button arrives last. Light haptic on each card landing, a medium one when card 1 lands.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* one colour per card type, shared by every session screen: Listen apricot, Try mint, Reveal sky, Myth or fact rose.
   Dark mode deepens the pastels a step so they sit on navy without glaring. */
.k-listen{--face:#FFC38A;--face-2:#FFD6AC;--sunc:#FFD966}.k-try{--face:#9FE3BC}.k-reveal{--face:#9CCBFF}.k-myth{--face:#FFB9A6}
[data-theme="dark"] .k-listen{--face:#F3B47E;--face-2:#F7C595}[data-theme="dark"] .k-try{--face:#8FD3AD}[data-theme="dark"] .bc.k-try{--face:color-mix(in srgb,#8FD3AD 85%,#0E1322)}[data-theme="dark"] .k-reveal{--face:#8EBBEC}[data-theme="dark"] .k-myth{--face:#EFA894}
.head{position:absolute;top:112px;left:0;right:0;display:grid;gap:6px}
.stamps{position:absolute;top:184px;left:var(--gutter);right:var(--gutter);display:flex;align-items:center;gap:8px}
.stamps .t-foot{margin-left:8px}
/* the hand: four cards standing level behind (icons only), card 1 drawn out in front. The hand is 310px wide, centred. */
.fan{position:absolute;top:270px;left:50%;width:310px;margin-left:-155px;height:420px}
.bc{position:absolute;top:0;left:calc(50% + var(--x));width:84px;height:196px;margin-left:-42px;border-radius:16px;background:var(--face);color:#1E1A3A;
  display:grid;justify-items:center;align-content:start;padding-top:14px;transform:translateY(var(--y));box-shadow:0 8px 18px rgba(60,40,20,.12)}
[data-theme="dark"] .bc{box-shadow:0 10px 22px rgba(0,0,0,.42)}
/* each back card shows one small paper-cut spot (027's tile craft), never a system glyph */
.bc .spot{width:48px;height:48px;border-radius:13px;overflow:hidden;display:block;box-shadow:0 1px 2px rgba(30,26,58,.10)}
.bc .spot svg{display:block;width:48px;height:48px}
[data-theme="dark"] .bc .spot{box-shadow:0 0 0 1px rgba(15,27,51,.35),0 2px 6px rgba(0,0,0,.25)}
.play .bc{animation:deal 760ms var(--settle) both;animation-delay:calc(300ms + var(--k) * 120ms)}
@keyframes deal{from{opacity:0;transform:translateY(420px)}35%{opacity:1}to{opacity:1;transform:translateY(var(--y))}}
/* card 1: a small Listen player, the same art as the card it opens (024) */
.front{position:absolute;left:50%;top:100px;width:284px;margin-left:-142px;border-radius:26px;background:var(--face);color:#1E1A3A;overflow:hidden;
  box-shadow:0 2px 4px rgba(60,40,20,.10),0 14px 24px rgba(60,40,20,.16),0 30px 50px rgba(60,40,20,.20)}
[data-theme="dark"] .front{box-shadow:inset 0 1px 0 rgba(255,248,238,.35),0 14px 26px rgba(0,0,0,.45),0 32px 56px rgba(0,0,0,.55)}
.play .front{animation:lift 900ms var(--settle) both 820ms}
@keyframes lift{from{opacity:0;transform:translateY(300px)}40%{opacity:1}to{opacity:1;transform:none}}
.front .art{position:relative;height:180px;background:linear-gradient(to bottom,var(--face-2),var(--face))}
.front .sun{position:absolute;left:50%;top:20px;width:152px;height:152px;margin-left:-76px;border-radius:50%;background:var(--sunc)}
.front .xw{position:absolute;left:50%;bottom:-7px;width:158px;margin-left:-79px}
.play .front .xw{animation:dx-settle 700ms var(--settle) both 1200ms}
/* dark: the same deep dusk player as 024 (warm glow, the dusk sun, cream ink), so card 1 keeps its colour into the player */
[data-theme="dark"] .front{color:#FFF8EE;background:radial-gradient(90% 48% at 50% 30%,rgba(247,170,108,.30),rgba(247,170,108,0) 100%),linear-gradient(180deg,#27325C 0%,#1C2547 58%,#19223F 100%);
  box-shadow:inset 0 1px 0 rgba(255,248,238,.08),0 14px 26px rgba(0,0,0,.45),0 32px 56px rgba(0,0,0,.55)}
[data-theme="dark"] .front .art{background:none}
[data-theme="dark"] .front .sun{background:radial-gradient(circle,#F9C083 0,#F2A766 70%,#EC9A5E 100%);box-shadow:0 0 60px 16px rgba(247,168,106,.30)}
[data-theme="dark"] .front .kind{color:#E9DCCB}
.front .in{padding:16px 20px 22px}
.front .kind{display:flex;align-items:center;gap:7px;font:600 14px/1 var(--body);color:#3A2410}
.front .kind svg{width:17px;height:17px}
.front h2{font:800 26px/1.1 var(--display);letter-spacing:-.5px;margin:10px 0 0;text-wrap:balance}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav"><button class="icon-btn" aria-label="Close" id="close"></button></div>
  <div class="head pad">
    <h1 class="t-large" data-a style="--i:0">The stress loop</h1>
    <p class="t-foot muted" data-a style="--i:1">Prep 4 · 5 cards · about 28 min</p>
  </div>
  <div class="stamps" id="stamps" data-a style="--i:2"></div>
  <div class="fan" id="fan"></div>
  <div class="dock"><button class="btn" data-a style="--i:10;--d:700ms">Play card 1</button></div>
</div>
<script>
/* one small paper-cut spot per back card (the same craft as 027's option tiles): a tinted sky, a cut-paper hill, one motif.
   Light: each tile is a pale step of its card's own colour. Dark: 027's pre-dawn tile (navy sky, deep hills, cream paper), which stands clear on every card. */
const dark = DX.theme === 'dark';
const T = dark
  ? { try:['#1E2C52','#2C4A55','#22394A'], reveal:['#1E2C52','#2A4372','#21365F'], myth:['#1E2C52','#553A52','#452F45'], p:'#E6DCCB', sun:'#FFD27A', ink:'#0F1B33' }
  : { try:['#E4F7EC','#8FDBB2','#6FCB98'], reveal:['#E3EEFF','#8EC0F5','#74ABEB'], myth:['#FFEAE3','#FFAE98','#F69A82'], p:'#FFFFFF', sun:'#FFD25E', ink:'#1E1A3A' };
const hills = k => `<path d="M0 35 C12 30 30 34 48 30 V48 H0z" fill="${T[k][1]}"/><path d="M0 42 C16 38 32 43 48 39 V48 H0z" fill="${T[k][2]}"/>`;
const SPOT = {
  sigh: k => hills(k) + `<g fill="none" stroke="${T.p}" stroke-width="2.8" stroke-linecap="round"><path d="M7 13h18c4.5 0 6-6 1.5-6.4-3-.3-3.6 3.4-1.2 4"/><path d="M12 22h22c4.5 0 6 6 1.5 6.4-3 .3-3.6-3.4-1.2-4"/></g>`,
  cloud: k => `<circle cx="33" cy="14" r="6.5" fill="${T.sun}"/>` + hills(k) + `<path d="M9 30h26a6.5 6.5 0 000-13 9 9 0 00-16.5-1.5A6.5 6.5 0 009 21a4.5 4.5 0 000 9z" fill="${T.p}"/>`,
  talk: k => hills(k) + `<rect x="6" y="8" width="23" height="15" rx="6" fill="${T.sun}"/><path d="M10 22 L9 27 L15 22.5Z" fill="${T.sun}"/>
    <rect x="17" y="18" width="24" height="16" rx="6" fill="${T.p}"/><path d="M35 33 L37 38 L30 33.5Z" fill="${T.p}"/>
    <g fill="${T.ink}" fill-opacity=".5"><circle cx="23.5" cy="26" r="1.7"/><circle cx="29" cy="26" r="1.7"/><circle cx="34.5" cy="26" r="1.7"/></g>`,
  flag: k => hills(k) + `<path d="M8 48 C12 41 22 41 22 36 C22 32 30 31 31 26" fill="none" stroke="${T.p}" stroke-width="3" stroke-linecap="round"/>
    <path d="M31 27 V9" stroke="${dark ? T.p : T.ink}" stroke-opacity="${dark ? 1 : .7}" stroke-width="2" stroke-linecap="round"/><path d="M31 9 H41 L38 13 L41 17 H31Z" fill="${T.sun}"/>`
};
const spot = (kind, m) => `<span class="spot"><svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" fill="${T[kind][0]}"/>${SPOT[m](kind)}</svg></span>`;
document.getElementById('close').innerHTML = DX.icon('close');
/* the kit stamp family, as on the Program path: Prep 1 to 3 earned, Prep 4 waiting */
document.getElementById('stamps').innerHTML = [1,2,3].map(n => DX.badge({kind:'prep', n, size:46, bare:true})).join('') +
  DX.badge({kind:'prep', n:4, state:'next', size:46, bare:true}) + '<span class="t-foot muted">Today</span>';
/* cards 2 to 5: Try (breath), Reveal, Myth or fact, Try (your stress plan); level, icons only, outer two a step lower */
const back = [['try','sigh','Try'], ['reveal','cloud','Reveal'], ['myth','talk','Myth or fact'], ['try','flag','Try']];
const X = [-113, -38, 38, 113], Y = [16, 0, 0, 16];
/* Xero in headphones (same drawing as 024): band and cups go into his body group so they sway with him */
const PHONES = `<g aria-hidden="true">
  <path d="M38 108 C30 -4 170 -4 162 108" fill="none" stroke="#1E1A3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M52 62 C66 30 100 22 122 26" fill="none" stroke="#FFF8EE" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <rect x="18" y="88" width="30" height="48" rx="14" fill="#1E1A3A"/><rect x="24" y="96" width="9" height="32" rx="4.5" fill="#FF9A6B"/>
  <rect x="152" y="88" width="30" height="48" rx="14" fill="#1E1A3A"/><rect x="167" y="96" width="9" height="32" rx="4.5" fill="#FF9A6B"/></g>`;
let xs = DX.char('xero', {mood:'calm', size:158});
const mi = xs.indexOf('stroke-width="3.5"'); const end = xs.indexOf('</path>', mi) + 7;
xs = xs.slice(0, end) + PHONES + xs.slice(end);
document.getElementById('fan').innerHTML = back.map((c, k) => `<div class="bc k-${c[0]}" style="--x:${X[k]}px;--y:${Y[k]}px;--k:${k}" aria-label="${c[2]}">${spot(c[0], c[1])}</div>`).join('') +
  `<div class="front k-listen"><div class="art"><div class="sun"></div><div class="xw"><div class="bob">${xs}</div></div></div>
   <div class="in"><div class="kind">${DX.icon('headphones', {size:17, w:2.4})}Listen · 6 min</div><h2>Why it feels like it calms you</h2></div></div>`;
</script>
</body></html>
