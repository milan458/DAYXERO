<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>016 Today, after Quit Day</title>
<meta name="motion" content="The dawn sun rises (2.6s) while the cream disc fades up (700ms). At 600ms the 7-day badge stamps onto the disc (spring, 620ms) and a shine crosses it (1.4s, from 1.2s); Xero settles in beside it (900ms) and does one cheer hop at 1.3s, then bobs. The pill, greeting and the line under it arrive with a 90ms stagger while 7 days, $49 and 84 count up (1.1s). The quiet '7 to go to 14 days' chip arrives next and its tiny coral ring sweeps to half (1.4s); the reading row arrives last. Success haptic on the stamp.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .hero { position: absolute; left: 0; right: 0; top: 0; height: 330px; border-radius: 0 0 36px 36px; overflow: hidden; }
  .hero .scene { position: absolute; inset: 0; }
  /* one idea: the badge just earned, large, on the same cream disc as prep week */
  .stage { position: absolute; left: 50%; top: 66px; width: 206px; height: 206px; margin-left: -103px; }
  .stage .disc { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,248,238,.74); box-shadow: 0 0 34px rgba(255,248,238,.45); }
  [data-theme="dark"] .stage .disc { background: rgba(255,248,238,.1); box-shadow: 0 0 40px rgba(255,195,138,.12); }
  .stage .medal { position: absolute; left: 25px; top: 25px; width: 156px; height: 156px; }
  .stage .medal .shine { border-radius: 99px; filter: drop-shadow(0 8px 14px rgba(150,50,20,.28)); }
  [data-theme="dark"] .stage .medal .shine { filter: drop-shadow(0 8px 16px rgba(0,0,0,.45)); }
  .xero { position: absolute; left: 266px; top: 176px; }
  .pill { position: absolute; left: 0; right: 0; top: 280px; display: flex; justify-content: center; }
  .pill span { background: var(--card); color: var(--fg); border-radius: 99px; padding: 10px 16px; font: 700 14px/1 var(--body); box-shadow: 0 6px 16px rgba(30,26,58,.12); }

  .content { position: absolute; left: 0; right: 0; top: 354px; padding: 0 var(--gutter); }
  .content .sub { margin-top: 6px; color: var(--muted); text-wrap: balance; }
  .content .sub b { color: var(--fg); font-weight: 700; }
  .togo { margin-top: 18px; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 10px; border-radius: 99px; background: color-mix(in srgb, var(--card) 55%, transparent); box-shadow: inset 0 0 0 1px var(--line); }
  .togo .t-cap { color: var(--fg); font-weight: 600; }
  .togo .mini { width: 18px; height: 18px; flex: none; }
  .read { margin-top: 28px; }
  .read .row { padding: 12px 16px 12px 14px; }
  .read .t-foot { color: var(--muted); }
  .read .t-head { font-size: 17px; }
</style>
</head><body>
<div class="screen" data-ground="apricot" data-status="on-art">
  <div class="hero">
    <div class="scene" id="scene"></div>
    <div class="stage">
      <div class="disc" data-fade style="--d:100ms"></div>
      <div class="medal" data-stamp style="--d:600ms"><div class="shine" id="b7" style="--d:1200ms"></div></div>
    </div>
    <div class="xero" data-settle style="--d:400ms"><div class="bob" id="xero"></div></div>
    <div class="pill" data-a style="--i:1;--d:500ms"><span>7-day badge earned</span></div>
  </div>

  <div class="content">
    <h1 class="t-large" data-a style="--i:2">Good morning, Sam</h1>
    <p class="t-body sub" data-a style="--i:3"><b><span data-count="7" data-dur="1100">7</span> days free</b>, <span data-count="49" data-prefix="$" data-dur="1100">$49</span> kept, <span data-count="84" data-dur="1100">84</span> cigarettes not smoked.</p>
    <div class="togo" data-a style="--i:4"><span class="mini" id="b14"></span><span class="t-cap">7 to go to 14 days</span></div>

    <div class="list read" data-a style="--i:5">
      <div class="row">
        <span class="ico-tile" id="ic-read"></span>
        <div class="grow">
          <p class="t-head">The noisy passengers</p>
          <p class="t-foot">Today's read &middot; 3 min</p>
        </div>
        <span class="chev" id="chev"></span>
      </div>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#scene').innerHTML = DX.char('horizon', { scene: 'dawn', w: 390, h: 330, clarity: 90 });
  const xero = mood => DX.char('xero', { mood, size: 104, stage: 2 });
  $('#xero').innerHTML = xero('hello');
  $('#b7').innerHTML = DX.badge({ kind: 'day', n: 7, size: 156, bare: true, label: '7 days' });
  $('#b14').innerHTML = DX.ring({ size: 18, stroke: 3.5, p: .5, color: '#FF7A55', track: 'var(--track)' });
  $('#ic-read').innerHTML = DX.icon('note');
  $('#chev').innerHTML = DX.icon('chev', { size: 18 });
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));
  DX.after(1300, () => { $('#xero').innerHTML = xero('cheer'); });
  DX.after(2800, () => { $('#xero').innerHTML = xero('hello'); });
</script>
</body></html>
