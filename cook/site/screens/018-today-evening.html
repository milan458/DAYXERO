<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>018 Today, evening</title>
<meta name="motion" content="Evening Today. The night art fades in under a slow moon; Glim settles onto the disc (900ms) and the week ring sweeps to full (1.4s). Greeting, day line and the check-in card arrive with a 90ms stagger; the 6 of the night count counts up and the 7-nights badge ring fills to 6 of 7. Glim stays sleepy and bobs; no springs. Soft haptic on appear only.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .hero { position: absolute; left: 0; right: 0; top: 0; height: 322px; border-radius: 0 0 36px 36px; overflow: hidden; background: var(--card); }
  .hero .scene { position: absolute; inset: 0; filter: saturate(.35) hue-rotate(-38deg) brightness(.62); }
  [data-theme="dark"] .hero .scene { filter: saturate(.3) hue-rotate(-38deg) brightness(.5); }
  .hero .shade { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 55%, color-mix(in srgb, var(--g) 70%, transparent)); }
  .ringwrap { position: absolute; left: 50%; top: 60px; width: 200px; height: 200px; margin-left: -100px; }
  .ringwrap .disc { position: absolute; inset: 20px; border-radius: 50%; background: rgba(243,237,224,.1); box-shadow: inset 0 0 0 1px rgba(243,237,224,.12); }
  .ringwrap .ring { position: absolute; inset: 0; }
  .ringwrap .ch { position: absolute; left: 0; right: 0; top: 30px; display: grid; place-items: center; }
  .pill { position: absolute; left: 0; right: 0; top: 272px; display: flex; justify-content: center; }
  .pill span { background: var(--card-2); color: var(--fg); border-radius: 99px; padding: 8px 14px; font: 600 14px/1 var(--body); display: inline-flex; gap: 8px; align-items: center; }
  .pill i { width: 6px; height: 6px; border-radius: 99px; background: var(--fg); opacity: .4; }

  .content { position: absolute; left: 0; right: 0; top: 342px; padding: 0 var(--gutter); }
  .sub { margin-top: 6px; color: var(--muted); }
  .sub b { color: var(--fg); font-weight: 700; }
  .ci { margin-top: 20px; padding: 18px; display: grid; gap: 14px; }
  .ci .t-foot { color: var(--muted); }
  .ci .nights { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card-2); }
  .ci .nights .grow { flex: 1; min-width: 0; }
  .ci .btn svg { width: 18px; height: 18px; }
</style>
</head><body>
<div class="screen" data-ground="night" data-status="on-art">
  <div class="hero">
    <div class="scene" id="scene" data-fade></div>
    <div class="shade"></div>
    <div class="ringwrap">
      <div class="disc"></div>
      <div class="ring" id="ring"></div>
      <div class="ch bob" id="glim" data-settle></div>
    </div>
    <div class="pill" data-a style="--i:1;--d:500ms"><span>Day 7<i></i>Fri, Nov 13</span></div>
  </div>

  <div class="content">
    <h1 class="t-large" data-a style="--i:2">Good evening, Sam</h1>
    <p class="t-body sub" data-a style="--i:3"><b>7 days free</b> and 3 waves ridden today.</p>

    <div class="card ci" data-a style="--i:4">
      <div>
        <p class="t-foot">With Glim &middot; 1 min</p>
        <p class="t-title" style="margin-top:4px">A minute on how today went</p>
      </div>
      <div class="nights">
        <span id="b7"></span>
        <div class="grow">
          <p class="t-head" style="font-size:16px"><span data-count="6">6</span> evening check-ins</p>
          <p class="t-foot">One more tonight earns 7 nights</p>
        </div>
      </div>
      <button class="btn" id="go"></button>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#scene').innerHTML = DX.char('horizon', { scene: 'night', w: 390, h: 322, clarity: 100 });
  $('#ring').innerHTML = DX.ring({ size: 200, stroke: 12, p: 1, color: '#F3EDE0', track: 'rgba(243,237,224,.16)' });
  $('#glim').innerHTML = DX.char('glim', { mood: 'sleepy', size: 136 });
  $('#b7').innerHTML = DX.badge({ kind: 'night', n: 7, state: 'next', p: 6 / 7, size: 46, bare: true });
  $('#go').innerHTML = DX.icon('moon', { w: 2.4 }) + 'Check in';
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));
</script>
</body></html>
