<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>018 Today, evening</title>
<meta name="motion" content="Evening Today, all slow. The night sky fades in (700ms) with stars twinkling and fireflies drifting; Glim settles onto the hill (900ms) and keeps a sleepy bob. Greeting, day line and the check-in card arrive with a 90ms stagger; the 6 check-ins count up and the 7-nights badge ring shows 6 of 7. No springs. Soft haptic on appear only.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 430px; }
  .greet { position: absolute; left: 0; right: 0; top: 78px; padding: 0 var(--gutter); }
  .greet .sub { margin-top: 8px; color: var(--muted); }
  .greet .sub b { color: var(--fg); font-weight: 700; }
  .glim { position: absolute; left: 70px; top: 168px; }
  .content { position: absolute; left: 0; right: 0; top: 408px; padding: 0 var(--gutter); }
  .ci { padding: 18px; display: grid; gap: 14px; }
  .ci .t-foot { color: var(--muted); }
  .ci .nights { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--card-2); }
  .ci .nights .grow { flex: 1; min-width: 0; }
  .ci .btn svg { width: 18px; height: 18px; }
</style>
</head><body>
<div class="screen" data-ground="night" data-status="on-art">
  <div class="sky" id="sky" data-fade></div>
  <div class="glim" data-settle style="--d:200ms"><div class="bob" id="glim"></div></div>

  <div class="greet">
    <h1 class="t-large" data-a style="--i:1">Good evening, Sam</h1>
    <p class="t-body sub" data-a style="--i:2"><b>Day 7</b> &middot; 7 days free, 3 waves ridden today</p>
  </div>

  <div class="content">
    <div class="card ci" data-a style="--i:4">
      <div>
        <p class="t-foot">With Glim &middot; 1 min</p>
        <p class="t-title" style="margin-top:4px">A minute on how today went</p>
      </div>
      <div class="nights">
        <span id="b7"></span>
        <div class="grow">
          <p class="t-head" style="font-size:16px"><span data-count="6">6</span> evening check-ins</p>
          <p class="t-foot">One more tonight earns 7 nights</p>
        </div>
      </div>
      <button class="btn" id="go"></button>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#sky').innerHTML = DX.nightSky({ w: 390, h: 430, moonX: 322, moonY: 212 });
  $('#glim').innerHTML = DX.char('glim', { mood: 'sleepy', size: 150 });
  $('#b7').innerHTML = DX.badge({ kind: 'night', n: 7, state: 'next', p: 6 / 7, size: 46, bare: true });
  $('#go').innerHTML = DX.icon('moon', { w: 2.4 }) + 'Check in';
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));
</script>
</body></html>
