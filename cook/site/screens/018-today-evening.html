<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>018 Today, evening</title>
<meta name="motion" content="Evening Today, all slow. The sky fades in (700ms): a dim lavender-peach dusk in light mode, the midnight meadow in dark, with stars twinkling and fireflies drifting; the paper-cut knoll rises 24px into place (900ms) and Glim, awake and waving hello, settles onto it (900ms) then keeps a slow bob; the warm pool his belly casts on the knoll fades up with him and breathes with his glow (2.6s loop). Greeting, waves line and the check-in card arrive with a 90ms stagger; inside it the six done nights fade in left to right (90ms apart, no springs) and Friday's waiting 7-night badge (44px) sits in a solid gold ring that breathes (4s in, 6s out). Soft haptic on appear only.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 430px; }
  .knoll { position: absolute; left: 0; top: 280px; width: 390px; height: 110px; --k1: #22345C; --k2: #2A3E6B; --rim: rgba(246,231,193,.28); }
  [data-theme="dark"] .knoll { --k1: #18264A; --k2: #1F2F57; --rim: rgba(246,231,193,.2); }
  .knoll svg { display: block; filter: drop-shadow(0 -3px 6px rgba(4,8,20,.35)); }
  .play .knoll { animation: knoll 900ms var(--settle) 100ms both; }
  @keyframes knoll { from { transform: translateY(24px); opacity: 0; } }
  .tabbar a { color: color-mix(in srgb, var(--fg) 72%, transparent); }
  /* Glim's belly light pools warm on the knoll under him */
  .knoll .pool { transform-box: fill-box; transform-origin: center; }
  .play .knoll .pool { animation: pool 2.6s ease-in-out infinite; }
  @keyframes pool { 50% { opacity: .72; transform: scale(.94); } }
  .greet { position: absolute; z-index: 2; left: 0; right: 0; top: 74px; padding: 0 var(--gutter); }
  .greet .sub { margin-top: 8px; color: #E4E6F0; }
  [data-theme="dark"] .greet .sub { color: var(--muted); }
  .greet .sub b { color: var(--fg); font-weight: 700; }
  .glim { position: absolute; left: 58px; top: 150px; }
  .content { position: absolute; left: 0; right: 0; top: 358px; padding: 0 var(--gutter); }
  .ci { padding: 18px 18px 20px; display: grid; gap: 14px; }
  .ci .t-foot { color: var(--muted); }
  .ci .who { color: #D3D9EA; font-weight: 600; }
  .ci .divider { margin: 0; }
  /* the one progress encoding: seven nights, tonight is the waiting 7-night badge */
  .pips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; align-items: end; }
  .pip { display: grid; justify-items: center; gap: 7px; }
  .pip b { width: 30px; height: 30px; margin: 5px 0; border-radius: 99px; background: var(--fg); color: var(--g); display: grid; place-items: center; }
  .pip b svg { width: 16px; height: 16px; }
  .pip .t-cap { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .pip.tonight .face { position: relative; width: 44px; height: 44px; border-radius: 99px; margin-bottom: -2px; }
  .pip.tonight .face::before { content: ""; position: absolute; inset: 2px; border-radius: 99px; background: rgba(255,211,122,.12); }
  .pip.tonight .face svg { position: relative; }
  .pip.tonight .face::after { content: ""; position: absolute; inset: -4px; border-radius: 99px; box-shadow: inset 0 0 0 2.5px #FFD37A, 0 0 12px rgba(255,211,122,.35); }
  .play .pip.tonight .face::after { animation: breathe2 10s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes breathe2 { 0% { transform: scale(.96); opacity: .7; } 40% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(.96); opacity: .7; } }
  .pip.tonight .t-cap { color: #FFD37A; font-weight: 800; }
  .ci .note b { color: var(--fg); font-weight: 700; }
  .ci .btn { margin-top: 2px; }
  .ci .btn svg { width: 18px; height: 18px; }
  /* dark: a softer, dimmer cream so the one button does not glare at night */
  [data-theme="dark"] .ci .btn { background: #D8CCB2; box-shadow: 0 4px 14px rgba(0,0,0,.35); }
</style>
</head><body>
<div class="screen" data-ground="night" data-status="on-art">
  <div class="sky" id="sky" data-fade></div>
  <div class="knoll" aria-hidden="true"><svg width="390" height="110" viewBox="0 0 390 110">
    <path d="M-10 64 C40 40 90 30 140 30 C196 30 250 44 300 70 C330 86 360 96 400 98 V110 H-10Z" fill="var(--k1)"/>
    <path d="M-10 64 C40 40 90 30 140 30 C196 30 250 44 300 70 C330 86 360 96 400 98" fill="none" stroke="var(--rim)" stroke-width="1.5"/>
    <defs><radialGradient id="pool18"><stop offset="0" stop-color="#FFD37A" stop-opacity=".55"/><stop offset=".55" stop-color="#FFC36B" stop-opacity=".18"/><stop offset="1" stop-color="#FFC36B" stop-opacity="0"/></radialGradient></defs>
    <ellipse class="pool" cx="148" cy="40" rx="96" ry="26" fill="url(#pool18)"/>
    <path d="M-10 92 C60 78 130 76 200 84 C260 90 330 88 400 76 V110 H-10Z" fill="var(--k2)" opacity=".55"/>
  </svg></div>
  <div class="glim" data-settle style="--d:200ms"><div class="bob" id="glim"></div></div>

  <div class="greet">
    <h1 class="t-large" data-a style="--i:1">Good evening, Sam</h1>
    <p class="t-body sub" data-a style="--i:2"><b><span data-count="3">3</span> waves</b> ridden today</p>
  </div>

  <div class="content">
    <div class="card ci" data-a style="--i:4">
      <div>
        <p class="t-foot who">With Glim &middot; 1 min</p>
        <p class="t-title" style="margin-top:4px">How did today go?</p>
      </div>
      <div class="divider"></div>
      <div class="pips" id="pips" aria-label="6 of 7 nights checked in; tonight earns the 7-night badge"></div>
      <p class="t-foot note"><b><span data-count="6">6</span> of 7 nights.</b><br>Tonight earns your 7&#8209;night badge.</p>
      <button class="btn" id="go"></button>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  /* Light mode: a dim dusk (soft lavender to peach) over the same midnight hills; dark mode keeps the kit's midnight meadow. */
  function duskSky(w = 390, h = 430) {
    const st = [[.15, .09], [.38, .07], [.64, .15], [.82, .05], [.51, .2], [.9, .24]];
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block" aria-hidden="true"><defs>
      <linearGradient id="dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D4772"/><stop offset=".34" stop-color="#6A6F95"/><stop offset=".56" stop-color="#AE95A8"/><stop offset=".68" stop-color="#E4B39C"/><stop offset="1" stop-color="#EDBE9F"/></linearGradient>
      <radialGradient id="dm"><stop offset="0" stop-color="#FFF1D8" stop-opacity=".45"/><stop offset="1" stop-color="#FFF1D8" stop-opacity="0"/></radialGradient>
      <radialGradient id="dh" cx=".5" cy="1" r=".7"><stop offset="0" stop-color="#F6C7A4" stop-opacity=".55"/><stop offset="1" stop-color="#F6C7A4" stop-opacity="0"/></radialGradient>
      <radialGradient id="df"><stop offset="0" stop-color="#FFD37A" stop-opacity=".9"/><stop offset="1" stop-color="#FFD37A" stop-opacity="0"/></radialGradient>
      <linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0F1B33" stop-opacity="0"/><stop offset="1" stop-color="#0F1B33"/></linearGradient></defs>
      <rect width="${w}" height="${h}" fill="url(#dk)"/>
      <ellipse cx="${w * .42}" cy="300" rx="260" ry="90" fill="url(#dh)"/>
      ${st.map(([x, y], i) => `<circle cx="${(x * w).toFixed(1)}" cy="${(y * h).toFixed(1)}" r="${i % 3 ? 1.1 : 1.5}" fill="#fff" opacity="${i % 2 ? .35 : .6}">${DX.still ? '' : `<animate attributeName="opacity" values="${i % 2 ? '.35;.1;.35' : '.6;.25;.6'}" dur="${(1.8 + (i % 4) * .4).toFixed(2)}s" repeatCount="indefinite"/>`}</circle>`).join('')}
      <circle cx="316" cy="186" r="58" fill="url(#dm)"/><circle cx="316" cy="186" r="17" fill="#FBF0DA"/>
      <path d="M0 300 C70 270 140 282 210 296 S330 300 ${w} 270 V${h} H0z" fill="#1C2C4E"/>
      <path d="M0 340 C90 316 170 340 250 332 S350 318 ${w} 326 V${h} H0z" fill="#132240"/>
      <path d="M0 380 C80 368 160 386 240 378 S350 366 ${w} 372 V${h} H0z" fill="#0F1B33"/>
      ${[[.18, 320], [.3, 352], [.77, 346], [.88, 312]].map(([x, y], i) => `<g>${DX.still ? '' : `<animateTransform attributeName="transform" type="translate" values="0 0;${i % 2 ? 6 : -6} -8;0 0" dur="${5 + i}s" repeatCount="indefinite"/>`}<circle cx="${(x * w).toFixed(1)}" cy="${y}" r="9" fill="url(#df)"/><circle cx="${(x * w).toFixed(1)}" cy="${y}" r="1.8" fill="#FFD37A"/></g>`).join('')}
      <rect y="${h - 70}" width="${w}" height="70" fill="url(#dg)"/></svg>`;
  }
  $('#sky').innerHTML = DX.theme === 'dark' ? DX.nightSky({ w: 390, h: 430, moonX: 316, moonY: 186 }) : duskSky();
  $('#glim').innerHTML = DX.char('glim', { mood: 'hello', size: 180 });
  const dn = ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
  $('#pips').innerHTML = dn.map((d, i) => `<div class="pip" data-fade style="--d:${500 + i * 90}ms"><b>${DX.icon('check', { size: 16, w: 3 })}</b><span class="t-cap">${d}</span></div>`).join('')
    + `<div class="pip tonight" data-fade style="--d:1100ms"><div class="face">${DX.badge({ kind: 'night', n: 7, state: 'next', size: 44, bare: true, label: '7 nights' })}</div><span class="t-cap">Fri</span></div>`;
  $('#go').innerHTML = DX.icon('moon', { w: 2.4 }) + 'Check in';
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));
</script>
</body></html>
