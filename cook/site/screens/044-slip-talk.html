<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>044 Slip: talk it through</title>
<meta name="motion" content="Jelli settles into her small sea disc at the right of the title (900ms, then a slow bob; the same placement as 045), then the title, trigger chips (the chosen Coffee chip is outline only), the if-then heading, the three rows (peach duotone glyph tiles, as on the NRT products list) and the 'Craving right now? Open Craving SOS' link arrive top to bottom (600ms, 90ms stagger). At 1.3s the 'Have it somewhere new' row lands: its 2px outline, the kit's warm selection tint and filled tick settle in over 520ms, the screen's one filled selection; the other rows stay fully readable. Light selection haptic on the land.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .sec { margin-top: 26px; display: grid; gap: 12px; }
  .sec .chips.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sec .chips.two .chip { justify-content: center; }
  .opts { display: grid; gap: 8px; }
  .opts .opt { min-height: 60px; padding: 8px 16px 8px 12px; gap: 12px; font: 600 16px/1.3 var(--body); transition: box-shadow .35s var(--ease); }
  .opts .opt > * { transition: opacity .45s var(--ease); }
  /* the trigger chip is a light outline only, so the chosen plan row is the one filled selection */
  .sec .chips .chip.on { background: var(--card); }
  .play .opt.land { animation: land 520ms var(--settle) both; }
  @keyframes land { 0% { opacity: 1; transform: scale(.97); } 100% { opacity: 1; transform: none; } }
  .play .opt.land .radio { animation: tick 520ms var(--settle) both; }
  @keyframes tick { 0% { transform: scale(.5); } 100% { transform: none; } }
  .ico-tile.s { width: 40px; height: 40px; border-radius: 12px; flex: none; }
  .ico-tile.s svg { width: 26px; height: 26px; }
  .gl { --acc: #FFB27F; --acc2: #FFD9BF; }
  [data-theme="dark"] .gl { --acc: #F39A62; --acc2: #FFD3B4; }
  /* the slip flow's one Jelli placement: small, at the right of the screen title (044, 045) */
  .ttl { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ttl { align-items: center; }
  /* Jelli sits in her own small sea disc next to the title (anchored, not a floating sticker) */
  .ttl .jl { position: relative; width: 84px; height: 84px; flex: none; border-radius: 99px; overflow: hidden; background: linear-gradient(#CFE5F7, #EAF2F8); }
  .ttl .jl .j { position: absolute; left: 0; top: -6px; width: 84px; height: 84px; }
  .ttl .jl svg.sea { position: absolute; left: 0; bottom: 0; width: 84px; height: 24px; display: block; }
  .jl .w1 { fill: #8FC0EC; } .jl .w2 { fill: #4A8FDB; }
  [data-theme="dark"] .ttl .jl { background: linear-gradient(#1C2A55, #33477A); }
  [data-theme="dark"] .jl .w1 { fill: #2F4F8F; } [data-theme="dark"] .jl .w2 { fill: #1B356A; }
  .sos-link { margin-top: 14px; display: flex; align-items: center; gap: 6px; height: 36px; font: 500 15px/1 var(--body); color: var(--muted); }
  .sos-link a { color: var(--fg); font-weight: 700; text-decoration: underline; text-decoration-color: var(--mark); text-decoration-thickness: 2px; text-underline-offset: 4px; cursor: pointer; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close"></button>
    <div class="grow"><div class="steps" aria-label="Step 2 of 3"><i class="on"></i><i class="on"></i><i></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <div class="ttl"><h1 class="t-title" data-a style="--i:0">Pick the moment, then what you'll do instead.</h1><div class="jl" data-settle style="--d:200ms"><div class="j bob" id="jelli"></div><svg class="sea" viewBox="0 0 84 34" aria-hidden="true"><path class="w1" d="M0 12 C14 6 26 6 42 11 S70 16 84 9 V34 H0Z"/><path class="w2" d="M0 22 C16 17 30 18 44 22 S70 26 84 20 V34 H0Z"/></svg></div></div>

      <div class="sec">
        <p class="t-head" data-a style="--i:2">What set it off?</p>
        <div class="chips two" data-a style="--i:3">
          <button class="chip on">Coffee</button>
          <button class="chip">Stress</button>
          <button class="chip">After a meal</button>
          <button class="chip">Something else</button>
        </div>
      </div>

      <div class="sec">
        <p class="t-head" data-a style="--i:4">If it's after coffee, then I'll...</p>
        <div class="opts picked" id="opts">
          <button class="opt" data-a style="--i:5"><span class="ico-tile s gl" data-g="shoe"></span><span class="grow">Take a short walk</span><span class="radio"></span></button>
          <button class="opt" data-a style="--i:6"><span class="ico-tile s gl" data-g="mug"></span><span class="grow">Switch to tea for a week</span><span class="radio"></span></button>
          <button class="opt on" id="pick" data-a style="--i:7"><span class="ico-tile s gl" data-g="pin"></span><span class="grow">Have it somewhere new</span><span class="radio"></span></button>
        </div>
        <p class="sos-link" data-a style="--i:8">Craving right now? <a data-go="019-sos">Open Craving SOS</a></p>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:10" data-go="046-slip-done">Save my plan</button>
    <button class="link" data-a style="--i:11">Not now</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  /* bespoke duotone glyphs: a soft accent fill under an ink line */
  const G = {
    shoe: '<path d="M2.8 17.2v-4.6c0-.8.7-1.3 1.4-1.1l3.3.9 1.9-3.6c.3-.6 1.1-.8 1.6-.4l1.3.9c.8 2 2.5 3.2 4.9 3.7l2.2.5c1.6.4 2.6 1.7 2.6 3.3v.4z" fill="var(--acc)"/><path d="M2.8 17.2h18.4v1.3c0 .5-.4.9-.9.9H3.7a.9.9 0 01-.9-.9z" fill="var(--acc2)"/><path d="M2.8 17.2v-4.6c0-.8.7-1.3 1.4-1.1l3.3.9 1.9-3.6c.3-.6 1.1-.8 1.6-.4l1.3.9c.8 2 2.5 3.2 4.9 3.7l2.2.5c1.6.4 2.6 1.7 2.6 3.3v1.9c0 .5-.4.9-.9.9H3.7a.9.9 0 01-.9-.9zM2.8 17.2h18.4M9.6 10.6l1.7 1M8.7 12.3l1.7 1"/>',
    mug: '<path d="M5 9.5h11v6a4 4 0 01-4 4H9a4 4 0 01-4-4z" fill="var(--acc)"/><path d="M5 9.5h11v6a4 4 0 01-4 4H9a4 4 0 01-4-4zM16 11h1.4a2.6 2.6 0 010 5.2H16"/><path d="M8.6 3.6c-.9 1 .9 1.8 0 2.8M12.2 3.6c-.9 1 .9 1.8 0 2.8" stroke-opacity=".55"/>',
    pin: '<ellipse cx="12" cy="20.6" rx="5" ry="1.4" fill="var(--acc2)" fill-opacity=".7" stroke="none"/><path d="M12 20s-6.2-5.4-6.2-10.3a6.2 6.2 0 0112.4 0C18.2 14.6 12 20 12 20z" fill="var(--acc)"/><circle cx="12" cy="9.8" r="2.4" fill="var(--card)"/>',
    wave: '<path d="M2.5 13.2c2.4-2.6 4.8-2.6 7.2 0s4.8 2.6 7.2 0c1.6-1.7 3.2-2.2 4.6-1.6v5.2a2.2 2.2 0 01-2.2 2.2H4.7a2.2 2.2 0 01-2.2-2.2z" fill="var(--acc)" stroke="none"/><path d="M2.5 13.2c2.4-2.6 4.8-2.6 7.2 0s4.8 2.6 7.2 0c1.6-1.7 3.2-2.2 4.6-1.6M2.5 7.4c2.4-2.6 4.8-2.6 7.2 0s4.8 2.6 7.2 0c1.6-1.7 3.2-2.2 4.6-1.6" fill="none"/>'
  };
  document.querySelectorAll('[data-g]').forEach(e => e.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${G[e.dataset.g]}</svg>`);
  document.getElementById('jelli').innerHTML = DX.char('jelli', { mood: 'calm', size: 84 });
  const opts = document.getElementById('opts'), pick = document.getElementById('pick');
  DX.after(0, () => { opts.classList.remove('picked'); pick.classList.remove('on', 'land'); });
  DX.after(1300, () => { pick.classList.add('on', 'land'); opts.classList.add('picked'); });
</script>
</body></html>
