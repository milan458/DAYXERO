<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>044 Slip: talk it through</title>
<meta name="motion" content="Title, trigger chips and the if-then rows arrive top to bottom (600ms, 90ms stagger). At 1.3s the 'Have it somewhere new' row lands: its 2px outline and filled tick settle in over 520ms; the other rows stay fully readable. Light selection haptic on the land.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .sec { margin-top: 24px; display: grid; gap: 12px; }
  .opts { display: grid; gap: 8px; }
  .opts .opt { min-height: 58px; padding: 10px 16px; font: 600 16px/1.3 var(--body); transition: box-shadow .35s var(--ease); }
  .opts .opt > * { transition: opacity .45s var(--ease); }
  .opts .opt.on { box-shadow: inset 0 0 0 2px var(--sel); }
  .play .opt.land { animation: land 520ms var(--settle) both; }
  @keyframes land { 0% { opacity: 1; transform: scale(.97); } 100% { opacity: 1; transform: none; } }
  .play .opt.land .radio { animation: tick 520ms var(--settle) both; }
  @keyframes tick { 0% { transform: scale(.5); } 100% { transform: none; } }
  .own { justify-self: start; height: 36px; padding: 0 2px; color: var(--muted); }
  .own svg { width: 18px; height: 18px; margin-right: 6px; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close"></button>
    <div class="grow"><div class="steps" aria-label="Step 2 of 3"><i class="on"></i><i class="on"></i><i></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <h1 class="t-title" data-a style="--i:0">Let's plan for next time.</h1>
      <p class="t-foot lead" data-a style="--i:1">Pick the moment, then one thing you'll do instead.</p>

      <div class="sec">
        <p class="t-head" data-a style="--i:2">What set it off?</p>
        <div class="chips" data-a style="--i:3">
          <button class="chip on">Coffee</button>
          <button class="chip">Stress</button>
          <button class="chip">After a meal</button>
          <button class="chip">Something else</button>
        </div>
      </div>

      <div class="sec">
        <p class="t-head" data-a style="--i:4">If it's after coffee, then I'll...</p>
        <div class="opts picked" id="opts">
          <button class="opt" data-a style="--i:5"><span class="grow">Take a short walk</span><span class="radio"></span></button>
          <button class="opt" data-a style="--i:6"><span class="grow">Switch to tea for a week</span><span class="radio"></span></button>
          <button class="opt on" id="pick" data-a style="--i:7"><span class="grow">Have it somewhere new</span><span class="radio"></span></button>
          <button class="opt" data-a style="--i:8"><span class="grow">Open Craving SOS</span><span class="radio"></span></button>
          <button class="link own" data-a style="--i:9"><span data-ic="plus"></span>Write my own</button>
        </div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:10" data-go="046-slip-done">Save my plan</button>
    <button class="link" data-a style="--i:11">Not now</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  const opts = document.getElementById('opts'), pick = document.getElementById('pick');
  DX.after(0, () => { opts.classList.remove('picked'); pick.classList.remove('on', 'land'); });
  DX.after(1300, () => { pick.classList.add('on', 'land'); opts.classList.add('picked'); });
</script>
</body></html>
