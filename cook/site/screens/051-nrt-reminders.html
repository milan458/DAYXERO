<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>051 NRT reminders</title>
<meta name="motion" content="Title, the two reminder cards (each with a peach duotone glyph tile, as on the products list, and its time row) and the preview (a white banner, a card in dark mode, with a hairline and a soft shadow, like an iOS notification) arrive (600ms, 90ms stagger); both coral toggles slide on as they land. The flow's one dosing note sits under the preview. At 1.4s Done is pressed: the button keeps its ink colour and gains a green check (done state, no colour switch, no toast: the button is the confirmation), the bell in the preview bumps once. Success haptic on the check.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .rem { margin-top: 24px; }
  .rem .card { padding: 6px 16px; }
  .rem .row { min-height: 74px; }
  .rem .row .t-head { font-size: 17px; }
  .rem .row .t-foot { color: var(--muted); }
  .rem .sub { border-top: 1px solid var(--line); min-height: 60px; }
  .time { height: 36px; padding: 0 14px; border-radius: 12px; background: var(--card-2); display: inline-flex; align-items: center; font: 700 16px/1 var(--display); font-variant-numeric: tabular-nums; }
  .pv { margin-top: 34px; }
  .pv > .t-foot { color: var(--muted); margin-bottom: 8px; }
  /* like an iOS banner: white (a card in dark mode), a hairline and a soft shadow */
  .noti { display: flex; gap: 12px; align-items: center; padding: 15px 14px; border-radius: 20px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 0 8px 24px rgba(30,26,58,.10), 0 1px 3px rgba(30,26,58,.06); }
  [data-theme="dark"] .noti { box-shadow: inset 0 0 0 1px var(--line), 0 10px 28px rgba(0,0,0,.35); }
  .noti .app { width: 40px; height: 40px; border-radius: 11px; background: #FFC38A; display: grid; place-items: center; overflow: hidden; flex: none; }
  .noti .top { display: flex; justify-content: space-between; }
  .noti .top .t-cap { color: var(--muted); }
  .caution { margin-top: 20px; font-size: 13px; display: flex; gap: 8px; align-items: center; color: var(--muted); white-space: nowrap; }
  .caution svg { width: 16px; height: 16px; flex: none; }
  .rem { margin-top: 28px !important; gap: 16px; }
  /* peach duotone glyph tiles, as on the NRT products list (048) */
  .rem .ico-tile svg { width: 28px; height: 28px; }
  .gl { --acc: #FFB27F; --acc2: #FFDCC4; }
  [data-theme="dark"] .gl { --acc: #F39A62; --acc2: #FFD3B4; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-ic="back"></button>
    <div class="grow"><div class="steps" aria-label="Step 4 of 4"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <h1 class="t-title" data-a style="--i:0">Reminders that help</h1>
      <p class="t-foot lead" data-a style="--i:1">For your 10-week patch plan, Nov 6 to Jan 14.</p>
      <div class="stack rem">
        <div class="card" data-a style="--i:3">
          <div class="row"><span class="ico-tile gl" data-p="patch"></span><div class="grow"><p class="t-head">Fresh patch</p><p class="t-foot">Every day</p></div><span class="toggle on"></span></div>
          <div class="row sub"><p class="t-foot grow" style="color:var(--muted)">Time</p><span class="time">7:30 AM</span></div>
        </div>
        <div class="card" data-a style="--i:4">
          <div class="row"><span class="ico-tile gl" data-p="steps"></span><div class="grow"><p class="t-head">Step-down days</p><p class="t-foot">Evening before each step</p></div><span class="toggle on"></span></div>
          <div class="row sub"><p class="t-foot grow" style="color:var(--muted)">Time</p><span class="time">8:00 PM</span></div>
        </div>
      </div>
      <div class="pv" data-a style="--i:5">
        <p class="t-foot">What you'll see</p>
        <div class="noti"><span class="app" id="app"></span><div class="grow"><div class="top"><span class="t-cap" style="color:var(--fg)">DayXero</span><span class="t-cap">7:30 AM</span></div><p class="t-foot">Fresh patch time. New spot, then on with your day.</p></div></div>
      </div>
      <p class="t-cap caution" data-a style="--i:6"><span data-ic="shield"></span><span>Dosing comes from your pack's label, not DayXero.</span></p>
    </div>
  </div>
  <div class="dock">
    <button class="btn" id="done" data-a style="--i:7"><span class="lbl">Done</span></button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  const PP = {
    patch: '<g transform="rotate(-8 12 12)"><path d="M7.2 3.8h9.6a3.4 3.4 0 013.4 3.4v8.4l-4.6 4.6H7.2a3.4 3.4 0 01-3.4-3.4V7.2a3.4 3.4 0 013.4-3.4z" fill="var(--acc2)"/><path d="M20.2 15.6h-3.2a1.4 1.4 0 00-1.4 1.4v3.2z" fill="var(--acc)"/><circle cx="11.4" cy="11.4" r="3.7" fill="var(--acc)"/></g>',
    /* a calendar page with a small step-down inside */
    steps: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.5" fill="var(--acc2)"/><path d="M3.5 9.8V8.5A3.5 3.5 0 017 5h10a3.5 3.5 0 013.5 3.5v1.3z" fill="var(--acc)"/><path d="M8 3v3.6M16 3v3.6"/><path d="M6.6 18v-5.4h3.7V18zM10.3 18v-3.5h3.6V18zM13.9 18v-1.8h3.5V18z" fill="var(--acc)" stroke-width="1.3"/>'
  };
  document.querySelectorAll('[data-p]').forEach(e => e.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${PP[e.dataset.p]}</svg>`);
  document.getElementById('app').innerHTML = DX.char('xero', { mood: 'hello', size: 40 });
  const btn = document.getElementById('done');
  function finish() {
    btn.classList.add('done-state');
    btn.querySelector('.lbl').innerHTML = DX.icon('check', { size: 20, w: 3 }) + 'Done';
  }
  DX.after(1400, () => { btn.classList.add('press'); setTimeout(() => { btn.classList.remove('press'); finish(); }, 160); });
  DX.onStill(finish);
</script>
</body></html>
