<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>051 NRT reminders</title>
<meta name="motion" content="The little clock scene arrives first: the clock settles onto its paper hill (900ms) and its bells give one soft ring (two 6deg wobbles, 500ms), Xero settles beside it then bobs. Title, the two reminder cards (each with its time row) and the preview arrive (600ms, 90ms stagger); both toggles slide on as they land. Nothing is saved on load: the still shows 'Save reminders'. On tap the button presses (160ms), then turns to its done state, a green check and 'Saved' (no colour switch, no toast: the button is the confirmation), the Xero icon in the preview bumps once; success haptic on the check.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .rem { margin-top: 24px; }
  .rem .card { padding: 6px 16px; }
  .rem .row { min-height: 68px; }
  .rem .row .t-head { font-size: 17px; }
  .rem .row .t-foot { color: var(--muted); }
  .rem .sub { border-top: 1px solid var(--line); min-height: 56px; }
  .time { height: 36px; padding: 0 14px; border-radius: 12px; background: var(--card-2); display: inline-flex; align-items: center; font: 700 16px/1 var(--display); font-variant-numeric: tabular-nums; }
  .pv { margin-top: 30px; }
  .pv > .t-foot { color: var(--muted); margin-bottom: 8px; }
  .noti { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 20px; background: var(--card-2); }
  .noti .app { width: 40px; height: 40px; border-radius: 11px; background: #FFC38A; display: grid; place-items: center; overflow: hidden; flex: none; }
  .noti .top { display: flex; justify-content: space-between; }
  .noti .top .t-cap { color: var(--muted); }
  .caution { margin-top: 16px; font-size: 13px; display: flex; gap: 8px; align-items: center; color: var(--muted); white-space: nowrap; }
  .caution svg { width: 16px; height: 16px; flex: none; }
  .rem { margin-top: 20px !important; gap: 14px; }
  .head { display: grid; grid-template-columns: 1fr 132px; align-items: end; gap: 8px; }
  .head .lead { margin-top: 8px; color: var(--muted); }
  .scene { position: relative; width: 132px; height: 112px; margin-right: -6px; }
  .scene svg.clock { position: absolute; right: 0; bottom: 0; }
  .scene .xr { position: absolute; left: -2px; bottom: 2px; width: 64px; height: 64px; }
  .clock .hill { fill: #FFD9B8; } .clock .body { fill: #FFD25E; } .clock .rim { fill: #F5B83D; } .clock .face { fill: #FFF8EE; } .clock .bell { fill: #FF7A55; } .clock .hand { stroke: #1E1A3A; }
  [data-theme="dark"] .clock .hill { fill: #26304C; }
  .play .clock .bells { transform-origin: 78px 30px; animation: ring 500ms ease-in-out 900ms 2; }
  @keyframes ring { 25% { transform: rotate(6deg); } 75% { transform: rotate(-6deg); } }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-ic="back"></button>
    <div class="grow"><div class="steps" aria-label="Step 4 of 4"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <div class="head">
        <div>
          <h1 class="t-title" data-a style="--i:1">Reminders</h1>
          <p class="t-foot lead" data-a style="--i:2">For your 10-week patch plan, Nov 13 to Jan 21.</p>
        </div>
        <div class="scene" aria-hidden="true">
          <svg class="clock" width="132" height="112" viewBox="0 0 132 112" data-settle style="--i:0"><defs><filter id="cs" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#5A2A10" flood-opacity=".25"/></filter></defs>
            <path class="hill" d="M6 112 C20 96 48 92 72 94 S118 98 132 108 V112Z"/>
            <g class="bells" filter="url(#cs)"><path class="bell" d="M55 33a12 12 0 0117-14z"/><path class="bell" d="M101 33a12 12 0 00-17-14z"/><rect class="rim" x="74" y="18" width="8" height="8" rx="3"/></g>
            <g filter="url(#cs)"><path class="rim" d="M60 92l-6 10M96 92l6 10" stroke="#F5B83D" stroke-width="5" stroke-linecap="round"/><circle class="rim" cx="78" cy="62" r="35"/><circle class="body" cx="78" cy="61" r="33"/><circle class="face" cx="78" cy="61" r="25"/></g>
            <g class="hand" stroke-width="4" stroke-linecap="round"><path d="M78 61l-9.5 9.5" stroke-width="4.6"/><path d="M78 61v18" stroke-width="3"/></g><circle cx="78" cy="61" r="3.4" fill="#FF7A55"/>
            <g fill="#1E1A3A" opacity=".35"><circle cx="78" cy="40" r="1.8"/><circle cx="99" cy="61" r="1.8"/><circle cx="78" cy="82" r="1.8"/><circle cx="57" cy="61" r="1.8"/></g>
          </svg>
          <div class="xr" data-settle style="--i:1;--d:200ms"><div class="bob" id="xero"></div></div>
        </div>
      </div>
      <div class="stack rem">
        <div class="card" data-a style="--i:3">
          <div class="row"><span class="ico-tile" data-ic="patch"></span><div class="grow"><p class="t-head">Fresh patch</p><p class="t-foot">Every day</p></div><span class="toggle on"></span></div>
          <div class="row sub"><p class="t-foot grow" style="color:var(--muted)">Time</p><span class="time">7:30 AM</span></div>
        </div>
        <div class="card" data-a style="--i:4">
          <div class="row"><span class="ico-tile" data-ic="calendar"></span><div class="grow"><p class="t-head">Step-down days</p><p class="t-foot">Evening before each step</p></div><span class="toggle on"></span></div>
          <div class="row sub"><p class="t-foot grow" style="color:var(--muted)">Time</p><span class="time">8:00 PM</span></div>
        </div>
      </div>
      <div class="pv" data-a style="--i:5">
        <p class="t-foot">What you'll see</p>
        <div class="noti"><span class="app" id="app"></span><div class="grow"><div class="top"><span class="t-cap" style="color:var(--fg)">DayXero</span><span class="t-cap">7:30 AM</span></div><p class="t-foot">Fresh patch time. New spot, then on with your day.</p></div></div>
      </div>
      <p class="t-cap caution" data-a style="--i:6"><span data-ic="shield"></span><span>Dosing comes from your pack's label, not DayXero.</span></p>
    </div>
  </div>
  <div class="dock">
    <button class="btn" id="done" data-a style="--i:7"><span class="lbl">Save reminders</span></button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  document.getElementById('app').innerHTML = DX.char('xero', { mood: 'hello', size: 40 });
  document.getElementById('xero').innerHTML = DX.char('xero', { mood: 'hello', size: 64 });
  const btn = document.getElementById('done');
  function finish() {
    btn.classList.add('done-state');
    btn.querySelector('.lbl').innerHTML = DX.icon('check', { size: 20, w: 3 }) + 'Saved';
    document.querySelector('.noti .app').classList.add('bump');
  }
  /* saved only after the tap: the still shows the pre-tap state */
  btn.addEventListener('click', () => { if (btn.classList.contains('done-state')) return; btn.classList.add('press'); setTimeout(() => { btn.classList.remove('press'); finish(); }, 160); });
</script>
</body></html>
