<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>004 How much you smoke</title>
<meta name="motion" content="Progress eases from 1/11 to 2/11 (900ms). Question, stepper card, chips and the money card arrive in order (600ms, 90ms stagger). At 900ms the plus button (outlined, the same weight as minus) presses: a quick tint fill and a spring bump (520ms), the count rolls from 11 to 12 (rises 10px, 300ms) and the yearly figure counts up from $1,606 to $1,752 (700ms ease-out); at 1100ms one more flat paper-cut coin drops onto the small coin pile beside the figure (18px drop, 420ms settle). The horizon strip above the dock settles up in three paper layers (0, 120, 240ms; 40px, 900ms settle) and a pleased, open-eyed Xero (72px) settles onto its crest last (from 420ms). Selection haptic on each step.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  .q .t-body { text-wrap: pretty; }
  .land { animation: dx-land 520ms cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes dx-land { 0% { transform: scale(1); } 40% { transform: scale(.97); } 100% { transform: scale(1); } }
  .chip.land { animation-name: dx-chipland; }
  @keyframes dx-chipland { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }

  .stepper { display: flex; align-items: center; gap: 12px; padding: 14px; }
  .stepper .icon-btn { width: 52px; height: 52px; }
  /* Minus and plus are one weight: both outlined, same ring, same glyph stroke. */
  .stepper .icon-btn.minus, .stepper .icon-btn.plus { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--fg) 40%, transparent); }
  .stepper .icon-btn svg { width: 22px; height: 22px; }
  /* A press reads as a quick fill (the press colour fades back out). */
  .stepper .icon-btn.plus.bump { animation: dx-bump 520ms var(--spring) both, press 520ms var(--ease) both; }
  @keyframes press { 0%, 30% { background: color-mix(in srgb, var(--fg) 12%, transparent); } 100% { background: transparent; } }
  .still .stepper .icon-btn.plus.bump { animation: none !important; }
  .stepper { padding: 16px; }
  .answers { padding-top: 18px !important; }
  .stepper .mid { flex: 1; text-align: center; }
  .stepper .t-display { font-size: 44px; display: inline-block; }
  .stepper .t-foot { color: var(--muted); }
  .roll { animation: roll 320ms var(--ease) both; }
  @keyframes roll { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .lbl { font: 700 14px/1.3 var(--body); color: var(--fg); margin: 16px 0 0; }

  .chips.even { display: grid; grid-template-columns: repeat(4, 1fr); }
  .chips.even .chip { justify-content: center; padding: 0 8px; }
  .chips.three { grid-template-columns: repeat(3, 1fr); }
  /* The result is the hero: the yearly cost, big, with the coin pile beside it (Xero stands on the horizon strip below). */
  .money { margin-top: 16px; padding: 18px 18px 16px 20px; display: grid; grid-template-columns: minmax(0,1fr) 64px; align-items: center; column-gap: 10px; }
  .money .t-display { display: block; margin: 4px 0 2px; }
  /* A small paper coin pile (the money) in its own column, nothing touching the edge. */
  .money .xm { width: 56px; height: 64px; justify-self: end; display: grid; place-items: end center; }
  .money .xm .coins { width: 52px; height: 60px; display: block; }
  .coin-top { opacity: 1; }
  .play .coin-top { animation: coin-drop 420ms var(--settle) 1100ms both; }
  @keyframes coin-drop { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
  .money .foot { grid-column: 1 / -1; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); }
  .money .foot b { color: var(--fg); font-weight: 700; }
  /* Round 10: the onboarding horizon strip (003 to 011, one element). Three flat paper hills in the launch style, soft paper
     shadows and no crest lines, sitting just above the dock and running full-bleed behind it; the screen's character stands on the
     crest. Light: cream and peach paper. Dark: the kit's night-meadow hills, kept quiet. */
  .screen { --hz-1: #FFD3A6; --hz-2: #FFE6CA; --hz-3: #F9B386; --hz-lift: rgba(120,44,20,.16); }
  [data-theme="dark"] .screen { --hz-1: #16233F; --hz-2: #0F1A31; --hz-3: #0A1326; --hz-lift: rgba(0,0,0,.55); }
  .hz { position: absolute; z-index: 1; left: 0; top: calc(var(--hz-b, 752px) - 134px); width: 390px; height: 300px; pointer-events: none; }
  .hz .l { position: absolute; left: 0; top: 0; display: block; }
  .hz .l1 { filter: drop-shadow(0 -3px 8px var(--hz-lift)); }
  .hz .l2 { filter: drop-shadow(0 -4px 10px var(--hz-lift)); }
  .hz .l3 { filter: drop-shadow(0 -5px 12px var(--hz-lift)); }
  .hz .who { position: absolute; }
  .play .hz .l { animation: hz-up 900ms var(--settle) both; }
  .play .hz .l2 { animation-delay: 120ms; }
  .play .hz .l3 { animation-delay: 240ms; }
  @keyframes hz-up { from { transform: translateY(40px); } to { transform: none; } }
  .dock { background: none; }
  .screen { --hz-b: 752px; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:18.2%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>How much do you smoke?</h1>
    <p class="t-body muted" data-a style="--i:1">A rough guess is fine. You can change it later.</p>
  </div>
  <div class="answers">
    <div class="card stepper" data-a style="--i:2">
      <button class="icon-btn minus" aria-label="Fewer" data-icon="minus"></button>
      <div class="mid"><span class="t-display num" id="n">12</span><p class="t-foot">cigarettes a day</p></div>
      <button class="icon-btn plus" id="plus" aria-label="More" data-icon="plus"></button>
    </div>
    <p class="t-foot lbl" data-a style="--i:3">Price of a pack of 20</p>
    <div class="chips even" data-a style="--i:3"><button class="chip on">$8</button><button class="chip">$10</button><button class="chip">$12</button><button class="chip">Other</button></div>
    <div class="card money" data-a style="--i:5">
      <div><p class="t-foot muted">At $8 a pack, that&rsquo;s</p>
        <span class="t-display num"><span data-count="1752" data-from="1606" data-prefix="$" data-delay="900" data-dur="700">$1,752</span></span>
        <p class="t-foot">a year on cigarettes alone</p></div>
      <div class="xm"><svg class="coins" id="coins" width="40" height="46" viewBox="0 0 40 46" aria-hidden="true"></svg></div>
      <p class="t-foot foot"><b>$4.80 a day.</b> Yours again from Quit Day.</p>
    </div>
  </div>
  <div class="hz" id="hz" aria-hidden="true"></div>

  <div class="dock"><button class="btn" data-a style="--i:6">Next: your vape</button></div>
</div>
<script>
  /* Round 10: the horizon strip. Strip y 134 is the top of the button; the character's feet sit on the middle hill's crest. */
  function horizon(o) {
    const back = 'M0 82 C50 74 100 72 150 77 C198 82 234 78 268 66 C306 53 350 47 390 53 L390 300 L0 300 Z',
      mid = 'M0 108 C46 100 96 106 140 114 C180 121 214 114 250 104 C282 95 312 91 342 94 C362 96 378 100 390 104 L390 300 L0 300 Z',
      front = 'M0 128 C58 120 118 124 178 134 C236 143 300 136 350 124 C368 120 380 119 390 120 L390 300 L0 300 Z';
    const l = (i, d, extra = '') => `<svg class="l l${i}" width="390" height="300" viewBox="0 0 390 300"><path d="${d}" fill="var(--hz-${i})"/>${extra}</svg>`;
    const s = o.size || 72, x = o.x ?? 312, y = o.y ?? 92;
    return l(1, back) + l(2, mid, o.pond || '') + `<div class="who" data-settle style="--d:420ms;left:${x - s / 2}px;top:${(o.top ?? (y - .965 * s)).toFixed(1)}px;width:${s}px;height:${s}px${o.clip ? `;overflow:hidden;height:${o.clip}px` : ''}"><div id="${o.id || 'hzc'}">${o.art}</div></div>` + (o.over || '') + l(3, front);
  }
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  document.getElementById('hz').innerHTML = horizon({ art: DX.char('xero', { mood: 'hello', size: 72 }) });   /* pleased, eyes open */
  /* Paper-cut coins (round 10: no gloss): three flat cut discs in a small pile, each with an offset shade, one ring and a soft paper shadow;
     the top coin drops in. */
  const sh = DX.theme === 'dark' ? 'rgba(0,0,0,.55)' : 'rgba(120,52,24,.26)';
  const coin = (cx, cy, top) => `<g ${top ? 'class="coin-top"' : ''} filter="url(#cs)"><circle cx="${cx + 1.3}" cy="${cy + 1}" r="10.5" fill="#F5B83D"/><circle cx="${cx}" cy="${cy}" r="10.5" fill="#FFD966"/>
    <circle cx="${cx}" cy="${cy}" r="6.4" fill="none" stroke="#F5B83D" stroke-width="1.6"/></g>`;
  document.getElementById('coins').innerHTML = `<defs><filter id="cs" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.6" stdDeviation="1" flood-color="${sh}"/></filter></defs>`
    + coin(12, 33) + coin(27, 33) + coin(19.5, 17.5, true);
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '9.1%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '18.2%'));
  const n = document.getElementById('n'), plus = document.getElementById('plus');
  DX.after(0, () => { n.textContent = '11'; n.classList.remove('roll'); plus.classList.remove('bump'); });
  DX.after(900, () => { plus.classList.add('bump'); n.textContent = '12'; n.classList.add('roll'); });
</script>
</body></html>
