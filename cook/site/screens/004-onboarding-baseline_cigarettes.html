<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>004 How much you smoke</title>
<meta name="motion" content="Progress eases from 1/11 to 2/11 (900ms). Question, stepper card, chips and the money card arrive in order (600ms, 90ms stagger). At 900ms the solid plus button presses (spring bump 520ms), the count rolls from 11 to 12 (rises 10px, 300ms) and the yearly figure counts up from $1,606 to $1,752 (700ms ease-out); at 1100ms one more coin drops onto the paper coin stack beside Xero (calm, 18px drop, 420ms settle). Selection haptic on each step.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  .q .t-body { text-wrap: pretty; }
  .land { animation: dx-land 520ms cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes dx-land { 0% { transform: scale(1); } 40% { transform: scale(.97); } 100% { transform: scale(1); } }
  .chip.land { animation-name: dx-chipland; }
  @keyframes dx-chipland { 0% { transform: scale(1); } 40% { transform: scale(1.1); } 100% { transform: scale(1); } }

  .stepper { display: flex; align-items: center; gap: 12px; padding: 14px; }
  .stepper .icon-btn { width: 52px; height: 52px; }
  /* Minus is the quiet, outlined control; plus is the solid one. */
  .stepper .icon-btn.minus { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--fg) 34%, transparent); }
  .stepper .icon-btn.plus { background: var(--btn); color: var(--btn-fg); box-shadow: 0 4px 12px color-mix(in srgb, var(--btn) 22%, transparent); }
  .stepper { padding: 24px 16px; }
  .stepper .mid { flex: 1; text-align: center; }
  .stepper .t-display { font-size: 44px; display: inline-block; }
  .stepper .t-foot { color: var(--muted); }
  .roll { animation: roll 320ms var(--ease) both; }
  @keyframes roll { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .lbl { font: 700 14px/1.3 var(--body); color: var(--fg); margin: 20px 0 0; }

  .chips.even { display: grid; grid-template-columns: repeat(4, 1fr); }
  .chips.even .chip { justify-content: center; padding: 0 8px; }
  .chips.three { grid-template-columns: repeat(3, 1fr); }
  /* The result is the hero: the yearly cost, big, with Xero reacting when it changes. */
  .money { margin-top: 24px; padding: 22px 20px 20px; display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 8px; }
  .money .t-display { display: block; margin: 4px 0 2px; }
  /* Xero, calm, beside a small paper coin stack (the money, not a cheer). */
  .money .xm { position: relative; width: 108px; height: 104px; margin: -6px -10px -6px 0; }
  .money .xm .xc { position: absolute; right: 0; top: 4px; }
  .money .xm .coins { position: absolute; left: 0; bottom: 8px; }
  .coin-top { opacity: 1; }
  .play .coin-top { animation: coin-drop 420ms var(--settle) 1100ms both; }
  @keyframes coin-drop { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
  .money .foot { grid-column: 1 / -1; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); }
  .money .foot b { color: var(--fg); font-weight: 700; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:18.2%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>How much do you smoke?</h1>
    <p class="t-body muted" data-a style="--i:1">A rough guess is fine. You can change it later.</p>
  </div>
  <div class="answers">
    <div class="card stepper" data-a style="--i:2">
      <button class="icon-btn minus" aria-label="Fewer" data-icon="minus"></button>
      <div class="mid"><span class="t-display num" id="n">12</span><p class="t-foot">cigarettes a day</p></div>
      <button class="icon-btn plus" id="plus" aria-label="More" data-icon="plus"></button>
    </div>
    <p class="t-foot lbl" data-a style="--i:3">Price of a pack of 20</p>
    <div class="chips even" data-a style="--i:3"><button class="chip on">$8</button><button class="chip">$10</button><button class="chip">$12</button><button class="chip">Other</button></div>
    <div class="card money" data-a style="--i:5">
      <div><p class="t-foot muted">At $8 a pack, that&rsquo;s</p>
        <span class="t-display num"><span data-count="1752" data-from="1606" data-prefix="$" data-delay="900" data-dur="700">$1,752</span></span>
        <p class="t-foot">a year on cigarettes alone</p></div>
      <div class="xm"><div class="xc" id="xm"></div><svg class="coins" id="coins" width="40" height="46" viewBox="0 0 40 46" aria-hidden="true"></svg></div>
      <p class="t-foot foot"><b>$4.80 a day.</b> Yours again from Quit Day.</p>
    </div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:6">Next: your vape</button></div>
</div>
<script>
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  const xm = document.getElementById('xm'); xm.innerHTML = DX.char('xero', { mood: 'calm', size: 90 });
  /* Paper coin stack: four cut coins, each casting a short shadow on the one below; the top coin drops in. */
  const sh = DX.theme === 'dark' ? 'rgba(0,0,0,.5)' : 'rgba(110,50,20,.28)';
  const coin = (y, top) => `<g ${top ? 'class="coin-top"' : ''} filter="url(#cs)"><rect x="4" y="${y}" width="32" height="8" rx="4" fill="#F5B83D"/><ellipse cx="20" cy="${y + 1}" rx="16" ry="4.2" fill="#FFD966"/>${top ? `<ellipse cx="20" cy="${y + 1}" rx="9" ry="2.2" fill="none" stroke="#F5B83D" stroke-width="1.4"/>` : ''}</g>`;
  document.getElementById('coins').innerHTML = `<defs><filter id="cs" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="1.3" stdDeviation=".5" flood-color="${sh}"/></filter></defs>`
    + [36, 29, 22, 15].map((y, k) => coin(y, k === 3)).join('');
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '9.1%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '18.2%'));
  const n = document.getElementById('n'), plus = document.getElementById('plus');
  DX.after(0, () => { n.textContent = '11'; n.classList.remove('roll'); plus.classList.remove('bump'); });
  DX.after(900, () => { plus.classList.add('bump'); n.textContent = '12'; n.classList.add('roll'); });
</script>
</body></html>
