<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>025 Session card played</title>
<meta name="motion" content="The Listen card lifts from below and flips over (rotateY, 1100ms settle) to its sun back, landing with a slight tilt; the ink check pops and draws on it at 1.1s (success haptic). Pip 1 fills and pip 2 takes the half fill at 1.5s while the label turns from 1 of 5 to 2 of 5. Title, line, rating chips and the button arrive after (600ms, 90ms stagger). Tapping a rating chip fills it (selection haptic).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.f-apricot{--face:#FFC38A}.f-sun{--face:#FFD966}
.nav .side{width:44px;text-align:right;flex:none}
.stage{position:absolute;top:164px;left:0;right:0;height:250px;perspective:900px}
.flip{position:absolute;left:50%;top:6px;width:170px;height:236px;margin-left:-85px;transform-style:preserve-3d;transform:rotate(4deg) rotateY(180deg)}
.play .flip{animation:fly 1100ms var(--settle) both 150ms}
@keyframes fly{0%{transform:translateY(320px) scale(1.2) rotate(0deg) rotateY(0deg)}55%{transform:translateY(40px) scale(1.08) rotate(2deg) rotateY(110deg)}100%{transform:rotate(4deg) rotateY(180deg)}}
.side-f{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--face);color:#1E1A3A;padding:16px;box-shadow:0 18px 34px rgba(60,40,20,.18)}
[data-theme="dark"] .side-f{box-shadow:0 20px 38px rgba(0,0,0,.5)}
.side-f.back{transform:rotateY(180deg);display:grid;justify-items:center;align-content:center;gap:16px;padding:0;
  background:radial-gradient(circle at 50% 42%,#FFE79A 0,#FFD966 62%)}
.side-f.back .lb{font:600 13px/1 var(--body);color:#4A3418}
.side-f .ic{width:36px;height:36px;border-radius:99px;background:rgba(30,26,58,.1);display:grid;place-items:center}
.side-f .ic svg{width:20px;height:20px}
.side-f b{display:block;margin-top:10px;font:700 17px/1.1 var(--display)}
.mid{position:absolute;top:454px;left:0;right:0;text-align:center;display:grid;gap:8px}
.rate{position:absolute;top:582px;left:0;right:0;display:grid;gap:12px;justify-items:center}
.rate .chips{gap:8px;justify-content:center}
.rate .chip{min-height:36px;padding:0 14px;border-radius:99px;font:600 14px/1 var(--body);box-shadow:inset 0 0 0 1px var(--line)}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="Card 2 of 5"><i class="on"></i><i class="now" id="p2"></i><i></i><i></i><i></i></div></div>
    <span class="side t-foot muted" id="lbl">2 of 5</span>
  </div>
  <div class="stage">
    <div class="flip">
      <div class="side-f f-apricot"><span class="ic" id="f-ic"></span><b>Listen</b><span class="t-cap" style="opacity:.7">6 min</span></div>
      <div class="side-f back"><div id="chk"></div><span class="lb">Listen · 6 min</span></div>
    </div>
  </div>
  <div class="mid pad">
    <h1 class="t-large" data-a style="--i:0;--d:900ms">First card, done</h1>
    <p class="t-foot muted" data-a style="--i:1;--d:900ms">Why it feels like it calms you</p>
  </div>
  <div class="rate pad" data-a style="--i:2;--d:900ms">
    <p class="t-foot muted">How was it?</p>
    <div class="chips"><button class="chip">Helpful</button><button class="chip">Just okay</button><button class="chip">Not for me</button></div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:4;--d:900ms">Next: A breath that works · 5 min</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('f-ic').innerHTML = DX.icon('headphones');
document.getElementById('chk').innerHTML = DX.check({size:84, color:'#1E1A3A', fg:'#FFD966', d:1100});
if (!DX.still) {
  const p2 = document.getElementById('p2'), lbl = document.getElementById('lbl');
  p2.classList.remove('now'); lbl.textContent = '1 of 5';
  DX.after(1500, () => { p2.classList.add('now'); lbl.textContent = '2 of 5'; });
}
</script>
</body></html>
