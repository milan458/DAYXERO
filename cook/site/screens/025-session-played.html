<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>025 Session card played</title>
<meta name="motion" content="The apricot Listen card lifts from below and flips over (rotateY, 1100ms settle) to its back: a sun with soft rays, a small Xero spark and a cream band reading Listen · 6 min, landing with a slight tilt; the ink check pops and draws in the sun at 1.1s (success haptic) while the spark twinkles once (scale 0 to 1, spring). The first step segment fills from the playhead to full and the counter turns from 1 of 5 to 1 of 5 done at 1.3s. Title, line and the Up next row arrive (600ms, 90ms stagger); the rating and the button arrive last in the dock. Tapping a rating chip selects it (selection haptic).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* one colour per card type (shared across the session); dark deepens the pastels a step */
.k-listen{--face:#FFC38A}.k-try{--face:#9FE3BC}
[data-theme="dark"] .k-listen{--face:#F3B47E}[data-theme="dark"] .k-try{--face:#8FD3AD}
.nav .side{flex:none;text-align:right}
.steps > i.now::after{width:var(--sub,45%);transition:width .5s var(--settle)}
.stage{position:absolute;top:122px;left:0;right:0;height:300px;perspective:900px}
.flip{position:absolute;left:50%;top:10px;width:196px;height:268px;margin-left:-98px;transform-style:preserve-3d;transform:rotate(4deg) rotateY(180deg)}
.play .flip{animation:fly 1100ms var(--settle) both 150ms}
@keyframes fly{0%{transform:translateY(320px) scale(1.2) rotate(0deg) rotateY(0deg)}55%{transform:translateY(40px) scale(1.08) rotate(2deg) rotateY(110deg)}100%{transform:rotate(4deg) rotateY(180deg)}}
.side-f{position:absolute;inset:0;border-radius:24px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--face);color:#1E1A3A;padding:18px;box-shadow:0 18px 34px rgba(60,40,20,.18)}
[data-theme="dark"] .side-f{box-shadow:0 20px 38px rgba(0,0,0,.5)}
.side-f .ic{width:36px;height:36px;border-radius:99px;background:rgba(30,26,58,.1);display:grid;place-items:center}
.side-f .ic svg{width:20px;height:20px}
.side-f b{display:block;margin-top:10px;font:700 17px/1.1 var(--display)}
/* the back: this card's own apricot, a sun with soft rays, a small Xero spark, and a cream band that names the card */
.side-f.back{transform:rotateY(180deg);padding:0}
.side-f.back svg.sunart{position:absolute;left:0;top:0}
.side-f.back .chk{position:absolute;left:50%;top:76px;margin-left:-38px}
.side-f.back .band{position:absolute;left:0;right:0;bottom:0;height:50px;background:#FFF8EE;display:flex;align-items:center;justify-content:center;gap:8px;font:600 14px/1 var(--body);color:#1E1A3A}
.side-f.back .band svg{width:17px;height:17px}
.spark{transform-box:fill-box;transform-origin:50% 50%}
.play .spark{animation:tw 700ms var(--spring) both 1350ms}
@keyframes tw{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.mid{position:absolute;top:436px;left:0;right:0;text-align:center;display:grid;gap:8px}
.next{position:absolute;top:530px;left:var(--gutter);right:var(--gutter)}
.next .row{gap:14px;min-height:72px}
.next .tile{width:44px;height:44px;border-radius:14px;background:var(--face);color:#1E1A3A;display:grid;place-items:center;flex:none}
.next .tile svg{width:22px;height:22px}
.next .t-cap{color:var(--muted);display:block}
.next .t-head{font-size:17px;margin-top:3px}
/* the rating sits just above the button, inside the dock */
.rate{display:grid;gap:10px;justify-items:center;margin-bottom:6px}
.rate .chips{gap:8px;justify-content:center}
.rate .chip{min-height:40px;padding:0 15px;border-radius:99px;font:600 14px/1 var(--body);box-shadow:inset 0 0 0 1px var(--line)}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="1 of 5 cards done"><i class="on" id="p1"></i><i></i><i></i><i></i><i></i></div></div>
    <span class="side t-foot muted" id="lbl">1 of 5 done</span>
  </div>
  <div class="stage">
    <div class="flip">
      <div class="side-f k-listen"><span class="ic" id="f-ic"></span><b>Listen</b><span class="t-cap" style="opacity:.7">6 min</span></div>
      <div class="side-f back k-listen">
        <svg class="sunart" width="196" height="268" viewBox="0 0 196 268" aria-hidden="true" id="sunart"></svg>
        <div class="chk" id="chk"></div>
        <div class="band"><span id="b-ic"></span>Listen · 6 min</div>
      </div>
    </div>
  </div>
  <div class="mid pad">
    <h1 class="t-large" data-a style="--i:0;--d:900ms">First card, done</h1>
    <p class="t-foot muted" data-a style="--i:1;--d:900ms">Why it feels like it calms you</p>
  </div>
  <div class="next list" data-a style="--i:2;--d:900ms">
    <div class="row">
      <span class="tile k-try" id="n-ic"></span>
      <span class="grow"><span class="t-cap">Up next · Try · 5 min</span><span class="t-head" style="display:block">A breath that works in the moment</span></span>
    </div>
  </div>
  <div class="dock">
    <div class="rate" data-a style="--i:3;--d:900ms">
      <p class="t-foot muted">How was it?</p>
      <div class="chips"><button class="chip">Helpful</button><button class="chip">Just okay</button><button class="chip">Not for me</button></div>
    </div>
    <button class="btn" data-a style="--i:4;--d:900ms">Play card 2</button>
  </div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('f-ic').innerHTML = DX.icon('headphones');
document.getElementById('b-ic').innerHTML = DX.icon('headphones', {size:17, w:2.4});
document.getElementById('n-ic').innerHTML = DX.icon('hand', {size:22});
document.getElementById('chk').innerHTML = DX.check({size:76, color:'#1E1A3A', fg:'#FFD966', d:1100});
/* sun with soft, rounded rays (paper, not spikes) and one small Xero spark */
const cx = 98, cy = 114;
const rays = Array.from({length:12}, (_, i) => { const a = i * Math.PI / 6 + Math.PI / 12, r1 = 62, r2 = 80;
  return `<path d="M${(cx + r1 * Math.cos(a)).toFixed(1)} ${(cy + r1 * Math.sin(a)).toFixed(1)} L${(cx + r2 * Math.cos(a)).toFixed(1)} ${(cy + r2 * Math.sin(a)).toFixed(1)}"/>`; }).join('');
const star = (x, y, r) => `<path class="spark" d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r}Z"/>`;
document.getElementById('sunart').innerHTML = `
  <circle cx="${cx}" cy="${cy}" r="96" fill="#FFF8EE" fill-opacity=".16"/>
  <g stroke="#FFF1D6" stroke-width="9" stroke-linecap="round" fill="none">${rays}</g>
  <circle cx="${cx}" cy="${cy}" r="52" fill="#FFE6B8"/>
  <g fill="#FFF8EE">${star(162, 34, 11)}</g><circle cx="146" cy="26" r="2.6" fill="#FFF8EE"/>`;
if (!DX.still) {
  const p1 = document.getElementById('p1'), lbl = document.getElementById('lbl');
  p1.className = 'now'; p1.parentElement.style.setProperty('--sub', '100%'); lbl.textContent = '1 of 5';
  DX.after(1300, () => { p1.className = 'on'; lbl.textContent = '1 of 5 done'; });
}
</script>
</body></html>
