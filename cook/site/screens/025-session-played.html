<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>025 Session card played</title>
<meta name="motion" content="The Listen card lifts from below, flips over (rotateY, 1100ms settle) to its sun back and lands tilted on the played pile; the ink check pops and draws at 1.1s (success haptic). Pip 1 fills with sun from the bottom (500ms) and pip 2 takes the cream ring at 1.5s while the label turns from 1 of 5 to 2 of 5. Title, rating chips and the next card preview arrive after.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.f-apricot{--face:#FFC38A}.f-sky{--face:#9CCBFF}.f-mint{--face:#9FE3BC}.f-sun{--face:#FFD966}
@keyframes pipfill{from{transform:scaleY(1)}to{transform:scaleY(0)}}
.nav .side{width:44px;text-align:right;flex:none}
.stage{position:absolute;top:126px;left:0;right:0;height:228px;perspective:900px}
.slot{position:absolute;left:50%;top:22px;width:128px;height:182px;margin-left:-64px;border-radius:20px;box-shadow:inset 0 0 0 2px var(--line);transform:rotate(-3deg)}
.flip{position:absolute;left:50%;top:22px;width:128px;height:182px;margin-left:-64px;transform-style:preserve-3d;transform:rotate(5deg) rotateY(180deg)}
.play .flip{animation:fly 1100ms var(--settle) both 150ms}
@keyframes fly{0%{transform:translateY(300px) scale(1.25) rotate(0deg) rotateY(0deg)}55%{transform:translateY(40px) scale(1.12) rotate(2deg) rotateY(110deg)}100%{transform:rotate(5deg) rotateY(180deg)}}
.side-f{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--face);color:#1E1A3A;padding:12px;box-shadow:0 12px 26px rgba(60,40,20,.18)}
[data-theme="dark"] .side-f{box-shadow:0 16px 30px rgba(0,0,0,.45)}
.side-f.back{transform:rotateY(180deg);padding:0;overflow:hidden}
.side-f.back .pat{position:absolute;inset:0}
.side-f.back .rim{position:absolute;inset:7px;border-radius:14px;box-shadow:inset 0 0 0 1.5px rgba(30,26,58,.22)}
.side-f.back .chk{position:absolute;left:50%;top:44px;margin-left:-29px}
.side-f.back .lb{position:absolute;left:0;right:0;bottom:22px;text-align:center}
.side-f.back .lb b{margin:0;font:800 17px/1.1 var(--display);letter-spacing:-.2px}
.side-f.back .lb span{display:block;margin-top:4px;font:600 13px/1.2 var(--body);color:#4A3418}
.side-f .ic{width:34px;height:34px;border-radius:99px;background:rgba(30,26,58,.1);display:grid;place-items:center}
.side-f .ic svg{width:18px;height:18px}
.side-f b{display:block;margin-top:8px;font:700 15px/1.1 var(--display)}
.mid{position:absolute;top:376px;left:0;right:0;text-align:center;display:grid;gap:6px}
.rate{position:absolute;top:470px;left:0;right:0;display:grid;gap:10px;justify-items:center}
.next{position:absolute;top:590px;left:var(--gutter);right:var(--gutter);display:flex;gap:14px;align-items:center}
.mini{width:40px;height:54px;border-radius:9px;background:var(--face);color:#1E1A3A;display:grid;place-items:center;flex:none}
.mini svg{width:20px;height:20px}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="Card 2 of 5"><i class="on"></i><i class="now" id="p2"></i><i></i><i></i><i></i></div></div>
    <span class="side t-foot muted" id="lbl">2 of 5</span>
  </div>
  <div class="stage">
    <div class="slot"></div>
    <div class="flip">
      <div class="side-f f-apricot"><span class="ic" id="f-ic"></span><b>Listen</b><span class="t-cap" style="opacity:.7">6 min</span></div>
      <div class="side-f back f-sun"><div class="pat" id="pat"></div><div class="rim"></div><div class="chk" id="chk"></div><div class="lb"><b>Played</b><span>Listen · 6 min</span></div></div>
    </div>
  </div>
  <div class="mid pad">
    <h1 class="t-large" data-a style="--i:0;--d:900ms">Card played</h1>
    <p class="t-foot muted" data-a style="--i:1;--d:900ms">Why it feels like it calms you · 6 min</p>
  </div>
  <div class="rate pad" data-a style="--i:2;--d:900ms">
    <p class="t-foot muted">How was this card?</p>
    <div class="chips" style="justify-content:center"><button class="chip">Helpful</button><button class="chip">Just okay</button><button class="chip">Not for me</button></div>
  </div>
  <div class="next card" data-a style="--i:3;--d:900ms">
    <div class="mini f-sky" id="mini"></div>
    <div style="flex:1;min-width:0">
      <p class="t-foot muted">Up next · Try · 5 min</p>
      <p class="t-head" style="margin-top:2px">A breath that works in the moment</p>
    </div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:4;--d:900ms">Play the next card</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('f-ic').innerHTML = DX.icon('headphones');
document.getElementById('mini').innerHTML = DX.icon('hand');
document.getElementById('chk').innerHTML = DX.check({size:58, color:'#1E1A3A', fg:'#FFD966', d:1100});
/* sun back face: a paper-cut sunburst behind the check, low hills at the foot */
document.getElementById('pat').innerHTML = `<svg width="128" height="182" viewBox="0 0 128 182" aria-hidden="true">
  <g transform="translate(64 73)">${Array.from({length:12}, (_, i) => `<path d="M0 -14 L6 -120 L-6 -120Z" fill="#F5B83D" fill-opacity=".16" transform="rotate(${i * 30})"/>`).join('')}
  <circle r="44" fill="#FFE38A"/><circle r="44" fill="none" stroke="#F5B83D" stroke-opacity=".6" stroke-width="2" stroke-dasharray="3 5"/></g>
  <path d="M0 168 C30 162 56 164 80 168 C100 171 116 168 128 166 L128 182 L0 182Z" fill="#FFC38A"/>
  <path d="M0 176 C34 172 66 174 92 177 C108 179 120 178 128 177 L128 182 L0 182Z" fill="#FFA86E"/></svg>`;
if (!DX.still) {
  const p2 = document.getElementById('p2'), lbl = document.getElementById('lbl');
  p2.classList.remove('now'); lbl.textContent = '1 of 5';
  DX.after(1500, () => { p2.classList.add('now'); lbl.textContent = '2 of 5'; });
}
</script>
</body></html>
