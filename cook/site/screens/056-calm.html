<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>056 Calm tools</title>
<meta name="motion" content="The title arrives, then the four tool tiles on the 90ms stagger (left to right, top to bottom); each cast member settles into its own little scene 120ms after its tile (Jelli in the box window, Jelli on the dawn hill, Jelli seated on the crest of the swell, Glim on the night hill). In dark mode each tile keeps its own tint (ocean blue, warm pre-dawn, night sea, midnight). The quiet This week row fades in last and its 24 counts up from 0 (850ms). Ambient: in the box tile the dot walks the track at the breathing pace (16s a round) and the lit side steps along with it at each corner; the cast keep their own idle loops (Jelli breathes in the window, Jelli floats on the hill and on the swell, Glim dozes with drifting zzz). Light tap haptic on tile press. Craving SOS stays one tap away in the tab bar.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.hd { display: grid; gap: 6px; padding-top: 22px; }
.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; margin-top: 26px; }
.tool { background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); display: grid; }
.tool .art { position: relative; height: 164px; overflow: hidden; border-radius: 22px 22px 0 0; }
.tool .art > svg { position: absolute; inset: 0; display: block; }
.tool .who { position: absolute; }
.tool .txt { padding: 12px 14px 14px; display: grid; gap: 3px; }
.tool .t-head { white-space: nowrap; }
.tool .t-cap { color: var(--muted); white-space: nowrap; }
.win { position: absolute; left: 47.5px; top: 46px; width: 72px; height: 72px; border-radius: 13px; overflow: hidden; }
.win > svg { display: block; }
.win .who { left: 4px; top: 6px; }
.week { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 0 4px; color: var(--muted); }
.week svg { width: 18px; height: 18px; flex: none; }
.week b { color: var(--fg); font-weight: 700; }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="scroll with-tabs"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Calm tools</h1><p class="t-foot muted" data-a style="--i:1">A few minutes instead of reaching for nicotine.</p></div>
  <div class="tools">
    <div class="tool" data-a style="--i:2" data-go="057-calm-box">
      <div class="art" id="a-box"></div>
      <div class="txt"><div class="t-head">Box breathing</div><span class="t-cap">1 min &middot; In, hold, out</span></div>
    </div>
    <div class="tool" data-a style="--i:3" data-go="058-calm-grounding">
      <div class="art" id="a-ground"></div>
      <div class="txt"><div class="t-head">Grounding</div><span class="t-cap">3 min &middot; Five senses</span></div>
    </div>
    <div class="tool" data-a style="--i:4" data-go="059-calm-notice">
      <div class="art" id="a-urge"></div>
      <div class="txt"><div class="t-head">Notice the urge</div><span class="t-cap">1 min &middot; Just watch</span></div>
    </div>
    <div class="tool" data-a style="--i:5">
      <div class="art" id="a-wind"></div>
      <div class="txt"><div class="t-head">Wind down</div><span class="t-cap">5 min &middot; Before sleep</span></div>
    </div>
  </div>
  <p class="week t-foot" data-a style="--i:6"><span data-ic="leaf" data-s="18"></span><span>This week: <b><span data-count="24" data-delay="700">24</span> min</b> of calm</span></p>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
const dark = DX.theme === 'dark', W = 167, H = 164, $ = s => document.querySelector(s);
const grad = (id, a, b, c) => `<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/>${c ? `<stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/>` : `<stop offset="1" stop-color="${b}"/>`}</linearGradient>`;
const stars = (pts, o = .8) => pts.map(([x, y, r], i) => `<circle cx="${x}" cy="${y}" r="${r || 1.2}" fill="#fff" opacity="${i % 2 ? o * .6 : o}"/>`).join('');
/* Each scene is drawn on a 132-high stage; the tile is 164 high, so the stage sits oy down and the sky fills above it. */
const svg = (inner, oy) => `<svg width="${W}" height="${H}" viewBox="0 ${-oy} ${W} ${H}" aria-hidden="true">${inner}</svg>`;
const bg = (oy, fill) => `<rect y="${-oy}" width="${W}" height="${H}" fill="${fill}"/>`;
const who = (html, x, y, d) => `<div class="who" style="left:${x}px;top:${y}px;--d:${d}ms" data-settle>${html}</div>`;

/* Dark mode window: the 057 night sea (sun off to the side, layered water, soft sea floor). */
const nightSea = (w, h, k) => `<svg width="${w}" height="${h}" viewBox="0 0 260 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>
  <linearGradient id="ns${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1838"/><stop offset=".6" stop-color="#1A2C5C"/><stop offset="1" stop-color="#2E4680"/></linearGradient>
  <radialGradient id="ng${k}"><stop offset="0" stop-color="#FFD27A" stop-opacity=".42"/><stop offset=".5" stop-color="#FFB25E" stop-opacity=".12"/><stop offset="1" stop-color="#FFB25E" stop-opacity="0"/></radialGradient>
  <linearGradient id="nw${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2A52A6"/><stop offset="1" stop-color="#173372"/></linearGradient>
  <linearGradient id="nf${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3E5590"/><stop offset="1" stop-color="#2C3F74"/></linearGradient></defs>
  <rect width="260" height="260" fill="url(#ns${k})"/>
  ${[[150, 30, 1.6], [214, 58, 1.2], [112, 70, 1.1], [236, 22, 1.4], [184, 100, 1], [24, 24, 1.2]].map(([x, y, r], i) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${i % 2 ? .5 : .8}"/>`).join('')}
  <circle cx="52" cy="84" r="64" fill="url(#ng${k})"/><circle cx="52" cy="84" r="21" fill="#FFD27A"/>
  <path d="M0 150 C60 144 120 153 180 147 S 240 144 260 148 V260 H0Z" fill="url(#nw${k})"/>
  <ellipse cx="54" cy="163" rx="30" ry="4" fill="#FFD27A" opacity=".22"/><ellipse cx="54" cy="163" rx="14" ry="2.2" fill="#FFE2A6" opacity=".4"/>
  <path d="M0 184 C60 174 130 188 190 178 S 245 174 260 178 V260 H0Z" fill="#1A3A80" opacity=".75"/>
  <path d="M0 184 C60 174 130 188 190 178 S 245 174 260 178" fill="none" stroke="#9DB8FF" stroke-opacity=".18" stroke-width="2"/>
  <path d="M0 228 C50 216 100 224 150 218 S 228 212 260 220 V260 H0Z" fill="url(#nf${k})"/>
  <ellipse cx="206" cy="236" rx="11" ry="4.5" fill="#566CA6"/><ellipse cx="44" cy="240" rx="7" ry="3" fill="#566CA6"/></svg>`;

/* Box breathing: ocean blue, Jelli in the sea window, one track with the lit side and the walking dot (as on 057). */
const T = 'M38 99 V33 Q38 21 50 21 H117 Q129 21 129 33 V99 Q129 111 117 111 H50 Q38 111 38 99Z';
$('#a-box').innerHTML = svg(`<defs>${dark ? grad('ob', '#22409A', '#0F2366') : grad('ob', '#3A63E0', '#1F3C8C')}</defs>${bg(16, 'url(#ob)')}
  ${stars([[18, 22], [148, 18, 1.4], [150, 112], [16, 104, 1.5]], .55)}
  <path d="${T}" fill="none" stroke="#FFF8EE" stroke-opacity=".38" stroke-width="3.5"/>
  <path d="${T}" pathLength="400" fill="none" stroke="#FFF8EE" stroke-width="4" stroke-linecap="round" stroke-dasharray="100 300" stroke-dashoffset="0">${DX.still ? '' : '<animate attributeName="stroke-dashoffset" values="0;-100;-200;-300" keyTimes="0;.25;.5;.75" calcMode="discrete" dur="16s" begin="-2s" repeatCount="indefinite"/>'}</path>
  <circle r="5.5" fill="#FFF8EE"><animateMotion dur="16s" repeatCount="indefinite" begin="-2s" path="${T}"/></circle>`, 16)
  + `<div class="win">${dark ? nightSea(72, 72, 'b') : DX.char('horizon', { scene: 'sea', w: 72, h: 72, clarity: 100 })}${who(DX.char('jelli', { mood: 'breathe', size: 64 }), 4, 6, 420)}</div>`;
if (DX.still) $('#a-box circle[r="5.5"]').outerHTML = '<circle cx="38" cy="66" r="5.5" fill="#FFF8EE"/>';

/* Grounding: apricot dawn in light, a warm pre-dawn in dark; Jelli (as on 058) rests on the near hill. */
$('#a-ground').innerHTML = svg(dark
  ? `<defs>${grad('gd', '#1C1A2A', '#4A2E2A', '#8A4A30')}<radialGradient id="gh"><stop offset="0" stop-color="#FFB86E" stop-opacity=".55"/><stop offset=".45" stop-color="#FF9A5C" stop-opacity=".18"/><stop offset="1" stop-color="#FF9A5C" stop-opacity="0"/></radialGradient></defs>${bg(32, 'url(#gd)')}${stars([[22, 20], [60, 6], [146, 14, 1.4], [104, 26]], .6)}
     <circle cx="124" cy="88" r="46" fill="url(#gh)"/><circle cx="124" cy="88" r="14" fill="#FFC27A"/>
     <path d="M0 98 C40 86 80 90 167 102 V132 H0Z" fill="#4A2C24"/><path d="M0 114 C50 104 110 108 167 116 V132 H0Z" fill="#33201C"/>`
  : `<defs>${grad('ga', '#FFE6BF', '#FFCB95')}</defs>${bg(32, 'url(#ga)')}
     <circle cx="124" cy="44" r="38" fill="#FFF1C9" opacity=".7"/><circle cx="124" cy="44" r="24" fill="#FFD966"/>
     <path d="M0 98 C40 86 80 90 167 102 V132 H0Z" fill="#FFAE73"/><path d="M0 114 C50 104 110 108 167 116 V132 H0Z" fill="#FF9A6B"/>`, 32)
  + who(DX.char('jelli', { mood: 'calm', size: 84 }), 16, 49, 520);

/* Notice the urge: sky blue, Jelli seated on the crest of the swell; dark uses the 059 night sea (same sky, swell and sea blues). */
$('#a-urge').innerHTML = svg(dark
  ? `<defs>${grad('sd', '#0E1E46', '#1E3A72')}${grad('sw', '#3A62A8', '#26457F')}</defs>${bg(32, 'url(#sd)')}${stars([[20, 18], [44, 40], [150, 16, 1.4], [128, 44]], .6)}
     <path d="M0 108 C34 108 46 62 82 62 S 128 108 167 108 V132 H0Z" fill="url(#sw)"/><path d="M0 108 C34 108 46 62 82 62 S 128 108 167 108" fill="none" stroke="#FFF8EE" stroke-width="3" stroke-linecap="round"/>
     <path d="M0 118 C40 112 90 116 167 112 V132 H0Z" fill="#1A3266"/>`
  : `<defs>${grad('sl', '#8EC2FF', '#D9EEFF')}</defs>${bg(32, 'url(#sl)')}
     <g fill="#FFFFFF" opacity=".9"><ellipse cx="140" cy="22" rx="18" ry="6.5"/><ellipse cx="131" cy="18" rx="9" ry="6.5"/></g>
     <path d="M0 108 C34 108 46 62 82 62 S 128 108 167 108 V132 H0Z" fill="#5A9DFF"/><path d="M0 108 C34 108 46 62 82 62 S 128 108 167 108" fill="none" stroke="#1E1A3A" stroke-width="3" stroke-linecap="round"/>
     <path d="M0 118 C40 112 90 116 167 112 V132 H0Z" fill="#2F72F2"/>`, 32)
  + who(DX.char('jelli', { mood: 'calm', size: 76 }), 44, 22, 620);

/* Wind down: night blue with the moon, Glim settling on the hill. */
$('#a-wind').innerHTML = svg(`<defs>${dark ? grad('nd', '#08101F', '#16244A', '#22315A') : grad('nl', '#0B1430', '#1B2B55', '#2C3D6A')}</defs>${bg(32, `url(#${dark ? 'nd' : 'nl'})`)}
  ${stars([[18, 20], [46, 40], [84, 14, 1.5], [104, 44], [150, 70], [20, 70, 1.4]], .85)}
  <radialGradient id="mh"><stop offset="0" stop-color="#F6E7C1" stop-opacity=".3"/><stop offset="1" stop-color="#F6E7C1" stop-opacity="0"/></radialGradient><circle cx="130" cy="34" r="30" fill="url(#mh)"/><path d="M19 14.5A7.5 7.5 0 019.5 5a7.5 7.5 0 109.5 9.5z" transform="translate(113 17) scale(1.6)" fill="#F6E7C1"/>
  <path d="M0 102 C40 92 90 96 167 106 V132 H0Z" fill="#1C2C4E"/><path d="M0 116 C50 108 110 112 167 118 V132 H0Z" fill="#132240"/>`, 32)
  + who(DX.char('glim', { mood: 'sleepy', size: 82 }), 24, 58, 720);

document.querySelector('.screen').insertAdjacentHTML('beforeend', DX.tabbar('calm'));
</script>
</body></html>
