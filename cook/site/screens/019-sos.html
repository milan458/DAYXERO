<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>019 Craving SOS</title>
<meta name="motion" content="Calm, no springs. Jelli and the pacer rings fade up together and breathe as one: 4s in (scale up), 6s out (scale down), looping; the outer pacer ring brightens on the in-breath. The single word under Jelli crossfades in 600ms between 'Breathe in' and 'and out' in time with the breath. The ride timer ticks each second. Reason card, the two buttons and the quiet row arrive with a slow 90ms stagger. Touching and holding Jelli gives a soft rhythmic haptic at the breath pace.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .nav .timer { color: var(--muted); font: 600 14px/1 var(--body); font-variant-numeric: tabular-nums; }
  .hero { position: absolute; left: 0; right: 0; top: 104px; height: 292px; display: grid; place-items: center; }
  .hero .breathe { position: relative; width: 292px; height: 292px; display: grid; place-items: center; }
  .hero .pacer { position: absolute; inset: 0; overflow: visible; }
  .hero .pacer .glow { fill: color-mix(in srgb, var(--fg) 7%, transparent); }
  .word { position: absolute; left: 0; right: 0; top: 414px; height: 32px; text-align: center; }
  .word span { position: absolute; left: 0; right: 0; top: 0; transition: opacity 600ms var(--ease); }
  .word span.off { opacity: 0; }
  .lead { position: absolute; left: 0; right: 0; top: 454px; padding: 0 44px; text-align: center; color: var(--muted); }
  .cards { position: absolute; left: 0; right: 0; top: 528px; padding: 0 var(--gutter); }
  .reason { display: flex; gap: 14px; align-items: center; }
  .reason .grow { flex: 1; min-width: 0; }
  .reason .t-foot { color: var(--muted); }
  .reason .t-head { margin-top: 4px; font-size: 17px; }
  .dock .two { display: grid; grid-template-columns: 1.35fr 1fr; gap: 10px; }
  .dock .links { display: flex; justify-content: center; align-items: center; gap: 4px; }
  .dock .links .link { padding: 0 10px; color: var(--muted); opacity: 1; }
  .dock .links i { width: 4px; height: 4px; border-radius: 99px; background: var(--muted); opacity: .7; }
</style>
</head><body>
<div class="screen" data-ground="ocean">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"></div>
    <span class="timer" data-fade>Riding it &middot; <span id="t">3:12</span></span>
  </div>

  <div class="hero" data-fade style="--d:100ms">
    <div class="breathe">
      <svg class="pacer" viewBox="0 0 292 292" aria-hidden="true">
        <circle class="glow" cx="146" cy="146" r="122"/>
        <circle cx="146" cy="146" r="143" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="3"/>
        <circle cx="146" cy="146" r="122" fill="none" stroke="currentColor" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
      </svg>
      <div id="jelli"></div>
    </div>
  </div>

  <div class="word t-title" data-a style="--i:2;--d:200ms"><span id="w-in">Breathe in</span><span id="w-out" class="off">and out</span></div>
  <p class="t-foot lead" data-a style="--i:3;--d:200ms">Most cravings pass in a few minutes. Hold Jelli to feel the pace.</p>

  <div class="cards">
    <div class="card reason" data-a style="--i:4;--d:200ms">
      <span class="ico-tile" id="heart"></span>
      <div class="grow">
        <p class="t-foot">Your reason</p>
        <p class="t-head">&ldquo;Run with Aria without stopping to catch my breath&rdquo;</p>
      </div>
    </div>
  </div>

  <div class="dock">
    <div class="two" data-a style="--i:6;--d:200ms">
      <button class="btn" data-go="020-sos-passed">It passed</button>
      <button class="btn ghost">Still strong</button>
    </div>
    <div class="links" data-a style="--i:7;--d:200ms">
      <button class="link">Text a friend</button><i></i><button class="link" data-go="021-sos-slipped">I slipped</button>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#close').innerHTML = DX.icon('close');
  $('#jelli').innerHTML = DX.char('jelli', { mood: 'breathe', size: 228 });
  $('#heart').innerHTML = DX.icon('heart');
  const wIn = $('#w-in'), wOut = $('#w-out');
  const say = out => { wIn.classList.toggle('off', out); wOut.classList.toggle('off', !out); };
  let gen = 0, secs = 192;
  DX.after(0, () => {
    const g = ++gen; say(false);
    const loop = () => { if (g !== gen) return; say(false); setTimeout(() => { if (g !== gen) return; say(true); setTimeout(loop, 6000); }, 4000); };
    loop();
    secs = 192; const tick = () => { if (g !== gen) return; secs++; $('#t').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'); setTimeout(tick, 1000); };
    setTimeout(tick, 1000);
  });
</script>
</body></html>
