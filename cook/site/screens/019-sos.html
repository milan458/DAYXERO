<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>019 Craving SOS</title>
<meta name="motion" content="Calm, no springs. Jelli and the single pacer ring (with its soft glow) fade up together and breathe as one: 4s in (scale up), 6s out (scale down), looping; the ring brightens on the in-breath. The breath word under Jelli crossfades in 600ms between 'Breathe in' and 'and out' in time with the breath, and Jelli's mouth follows it: closed on the in-breath, a soft open 'o' on the out-breath. The ride timer ticks each second. Reason card, the button, 'Still riding it' and the one quiet row arrive with a slow 90ms stagger. Touching and holding Jelli gives a soft rhythmic haptic at the breath pace.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .screen { --muted: #F3EEE6; }
  .nav .timer { color: var(--fg); background: var(--card); border-radius: 99px; padding: 9px 14px; font: 600 14px/1 var(--body); font-variant-numeric: tabular-nums; }
  .hero { position: absolute; left: 0; right: 0; top: 130px; height: 280px; display: grid; place-items: center; }
  .hero .breathe { position: relative; width: 280px; height: 280px; display: grid; place-items: center; }
  .hero .pacer { position: absolute; inset: 0; overflow: visible; }
  .hero .pacer .glow { fill: url(#pg); }
  /* one pacer ring with a soft glow; it brightens on the in-breath */
  .hero .pacer .outer { stroke-opacity: .9; filter: drop-shadow(0 0 10px rgba(255,248,238,.45)); }
  .play .hero .pacer .outer { animation: brighten 10s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes brighten { 0% { stroke-opacity: .7; } 40% { stroke-opacity: 1; } 100% { stroke-opacity: .7; } }
  .word { position: absolute; left: 0; right: 0; top: 426px; height: 36px; text-align: center; }
  .word span { position: absolute; left: 0; right: 0; top: 0; transition: opacity 600ms var(--ease); }
  .word span.off { opacity: 0; }
  .lead { position: absolute; left: 0; right: 0; top: 470px; padding: 0 40px; text-align: center; color: var(--muted); }
  .lead span { display: block; }
  .cards { position: absolute; left: 0; right: 0; top: 534px; padding: 0 var(--gutter); }
  .reason { display: flex; gap: 14px; align-items: center; padding: 16px 18px; }
  .reason .grow { flex: 1; min-width: 0; }
  .reason .t-foot { color: var(--muted); }
  .reason .t-head { margin-top: 4px; font-size: 17px; }
  .dock { gap: 4px; padding-top: 32px; }
  .dock .btn { margin-bottom: 6px; }
  .dock .strong { color: var(--fg); opacity: 1; font-size: 16px; font-weight: 700; }
  .dock .quiet { display: flex; justify-content: center; align-items: center; gap: 2px; height: 36px; }
  .dock .quiet .link { height: 36px; padding: 0 8px; font: 500 14px/1 var(--body); color: rgba(255,255,255,.8); opacity: 1; }
  .dock .quiet i { width: 3px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.55); }
</style>
</head><body>
<div class="screen" data-ground="ocean">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"></div>
    <span class="timer" data-fade>Riding it &middot; <span id="t">3:12</span></span>
  </div>

  <div class="hero" data-fade style="--d:100ms">
    <div class="breathe">
      <svg class="pacer" viewBox="0 0 280 280" aria-hidden="true">
        <defs><radialGradient id="pg"><stop offset="0" stop-color="#FFF8EE" stop-opacity=".07"/><stop offset=".78" stop-color="#FFF8EE" stop-opacity=".07"/><stop offset=".97" stop-color="#FFF8EE" stop-opacity=".16"/><stop offset="1" stop-color="#FFF8EE" stop-opacity="0"/></radialGradient></defs>
        <circle class="glow" cx="140" cy="140" r="137"/>
        <circle class="outer" cx="140" cy="140" r="137" fill="none" stroke="currentColor" stroke-width="3.5"/>
      </svg>
      <div id="jelli"></div>
    </div>
  </div>

  <div class="word t-large" data-a style="--i:2;--d:200ms"><span id="w-in">Breathe in</span><span id="w-out" class="off">and out</span></div>
  <p class="t-foot lead" data-a style="--i:3;--d:200ms"><span>Most cravings pass in a few minutes.</span><span>Hold Jelli to feel the pace.</span></p>

  <div class="cards">
    <div class="card reason" data-a style="--i:4;--d:200ms">
      <span class="ico-tile" id="heart"></span>
      <div class="grow">
        <p class="t-foot">Your reason</p>
        <p class="t-head">&ldquo;Run with Aria without stopping to catch my breath&rdquo;</p>
      </div>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:6;--d:200ms" data-go="020-sos-passed">It passed</button>
    <button class="link strong" data-a style="--i:6;--d:200ms">Still riding it</button>
    <div class="quiet" data-a style="--i:7;--d:200ms"><button class="link">Text a friend</button><i></i><button class="link" data-go="021-sos-slipped">I slipped</button></div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#close').innerHTML = DX.icon('close');
  $('#jelli').innerHTML = DX.char('jelli', { mood: 'breathe', size: 220 });
  $('#heart').innerHTML = DX.icon('heart');
  /* Jelli's mouth follows the breath: closed (in through the nose), a soft 'o' on the way out. */
  const mouth = $('#jelli path[fill="#24163A"]'), openD = mouth ? mouth.getAttribute('d') : '';
  const setMouth = out => { if (!mouth) return; if (out) { mouth.setAttribute('d', openD); mouth.setAttribute('fill', '#24163A'); } else { mouth.setAttribute('d', 'M94 107 Q100 111.5 106 107'); mouth.setAttribute('fill', 'none'); } };
  setMouth(false);
  const wIn = $('#w-in'), wOut = $('#w-out');
  const say = out => { wIn.classList.toggle('off', out); wOut.classList.toggle('off', !out); setMouth(out); };
  let gen = 0, secs = 192;
  DX.after(0, () => {
    const g = ++gen; say(false);
    const loop = () => { if (g !== gen) return; say(false); setTimeout(() => { if (g !== gen) return; say(true); setTimeout(loop, 6000); }, 4000); };
    loop();
    secs = 192; const tick = () => { if (g !== gen) return; secs++; $('#t').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'); setTimeout(tick, 1000); };
    setTimeout(tick, 1000);
  });
</script>
</body></html>
