<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>019 Craving SOS</title>
<meta name="motion" content="Calm, no springs. Jelli and the single pacer ring (with its soft glow) fade up together and breathe as one: 4s in (scale up), 6s out (scale down), looping. The ring shows the breath: a 3.5px cream arc sweeps round the ring from the top over the 4s in-breath, led by a small cream dot at its head, while a soft radial glow (no edge) swells behind Jelli, then the arc and its dot unwind and the glow ebbs over the 6s out-breath. The breath word under Jelli crossfades in 600ms between 'Breathe in' and 'and out' in time with the breath, and Jelli's mouth follows it: closed on the in-breath, a soft open 'o' on the out-breath. The ride timer counts up from 0:00 each second. The helper lines under the breath word show for the first breath only, then fade out over 1.2s at 10s; the still is mid-ride at 3:12, so they are gone there and Jelli and the word carry the pace. The quiet reason line, the button and the two quiet text buttons (Text a friend · I slipped, split by a middle dot) arrive with a slow 90ms stagger. Touching and holding Jelli gives a soft rhythmic haptic at the breath pace.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .screen { --muted: #F3EEE6; }
  .nav .timer { color: var(--fg); background: var(--card); border-radius: 99px; padding: 9px 14px; font: 600 14px/1 var(--body); font-variant-numeric: tabular-nums; }
  .hero { position: absolute; left: 0; right: 0; top: 200px; height: 280px; display: grid; place-items: center; }
  .hero .breathe { position: relative; width: 280px; height: 280px; display: grid; place-items: center; }
  .hero .pacer { position: absolute; inset: 0; overflow: visible; }
  .hero .pacer .glow { fill: url(#pg); }
  /* one pacer ring: a quiet track, a cream arc that fills on the in-breath and unwinds on the out-breath, a soft inner swell */
  .hero .pacer .outer { stroke-opacity: .3; }
  .hero .pacer .arc { stroke-dasharray: 860.8; stroke-dashoffset: 258; filter: drop-shadow(0 0 8px rgba(255,248,238,.5)); }
  .play .hero .pacer .arc { animation: arc 10s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes arc { 0% { stroke-dashoffset: 860.8; } 40% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 860.8; } }
  .hero .pacer .swell { transform-box: fill-box; transform-origin: center; transform: scale(.88); }
  /* the arc's leading dot rides the head of the arc (same timing as the arc) */
  .hero .pacer .head { transform-box: view-box; transform-origin: 140px 140px; transform: rotate(252deg); }
  .play .hero .pacer .head { animation: head 10s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes head { 0% { transform: rotate(0deg); } 40% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
  .play .hero .pacer .swell { animation: swell 10s cubic-bezier(.45,0,.55,1) infinite; }
  @keyframes swell { 0% { transform: scale(.55); opacity: .5; } 40% { transform: scale(.97); opacity: 1; } 100% { transform: scale(.55); opacity: .5; } }
  .word { position: absolute; left: 0; right: 0; top: 496px; height: 36px; text-align: center; }
  .word span { position: absolute; left: 0; right: 0; top: 0; transition: opacity 600ms var(--ease); }
  .word span.off { opacity: 0; }
  .lead { position: absolute; left: 0; right: 0; top: 540px; padding: 0 40px; text-align: center; color: var(--muted); }
  .lead span { display: block; }
  .lead.gone { opacity: 0 !important; transition: opacity 1200ms var(--ease); }
  /* the reason, quieter and lower: a faint frosted line, not a card */
  .cards { position: absolute; left: 0; right: 0; top: 574px; padding: 0 var(--gutter); }
  .reason { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 18px; }
  .reason { background: rgba(255,248,238,.1); box-shadow: inset 0 0 0 1px rgba(255,248,238,.16); }
  .reason .ico-tile { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,248,238,.1); }
  .reason .ico-tile svg { width: 18px; height: 18px; }
  [data-theme="dark"] .reason { background: rgba(255,248,238,.04); box-shadow: inset 0 0 0 1px var(--line); }
  .reason .grow { flex: 1; min-width: 0; }
  .reason .t-cap { color: rgba(255,248,238,.88); font-weight: 600; font-size: 13px; }
  .reason .t-foot { margin-top: 2px; color: var(--fg); opacity: .9; }
  .dock { gap: 8px; padding-top: 32px; padding-bottom: 30px; }
  /* two quiet, clearly separate text buttons (44px targets) */
  .dock .quiet { display: grid; grid-template-columns: 1fr auto 1fr; column-gap: 4px; align-items: center; height: 44px; }
  .dock .quiet .link { height: 44px; padding: 0 12px; font: 600 16px/1 var(--body); color: var(--fg); opacity: .92; }
  .dock .quiet .link:first-child { justify-self: end; }
  .dock .quiet .link:last-child { justify-self: start; }
  .dock .quiet i { width: 4px; height: 4px; border-radius: 99px; background: rgba(255,248,238,.6); }
  [data-theme="dark"] .nav .timer { background: rgba(255,255,255,.12); }
</style>
</head><body>
<div class="screen" data-ground="ocean">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"></div>
    <span class="timer" data-fade>Riding it &middot; <span id="t">3:12</span></span>
  </div>

  <div class="hero" data-fade style="--d:100ms">
    <div class="breathe">
      <svg class="pacer" viewBox="0 0 280 280" aria-hidden="true">
        <defs><radialGradient id="pg"><stop offset="0" stop-color="#FFF8EE" stop-opacity=".02"/><stop offset=".7" stop-color="#FFF8EE" stop-opacity=".04"/><stop offset=".96" stop-color="#FFF8EE" stop-opacity=".1"/><stop offset="1" stop-color="#FFF8EE" stop-opacity="0"/></radialGradient>
          <radialGradient id="psw"><stop offset="0" stop-color="#FFF8EE" stop-opacity=".2"/><stop offset=".35" stop-color="#FFF8EE" stop-opacity=".13"/><stop offset=".7" stop-color="#FFF8EE" stop-opacity=".04"/><stop offset="1" stop-color="#FFF8EE" stop-opacity="0"/></radialGradient></defs>
        <circle class="glow" cx="140" cy="140" r="137"/>
        <circle class="swell" cx="140" cy="140" r="130" fill="url(#psw)"/>
        <circle class="outer" cx="140" cy="140" r="137" fill="none" stroke="currentColor" stroke-width="3.5"/>
        <circle class="arc" cx="140" cy="140" r="137" fill="none" stroke="#FFF8EE" stroke-width="3.5" stroke-linecap="round" transform="rotate(-90 140 140)"/>
        <g class="head"><circle cx="140" cy="3" r="9" fill="#FFF8EE" opacity=".22"/><circle cx="140" cy="3" r="5.5" fill="#FFF8EE"/></g>
      </svg>
      <div id="jelli"></div>
    </div>
  </div>

  <div class="word t-large" data-a style="--i:2;--d:200ms"><span id="w-in">Breathe in</span><span id="w-out" class="off">and out</span></div>
  <p class="t-foot lead" id="lead" data-a style="--i:3;--d:200ms"><span>Most cravings pass in a few minutes.</span><span>Hold Jelli to feel the pace.</span></p>

  <div class="cards">
    <div class="reason" data-a style="--i:4;--d:200ms">
      <span class="ico-tile" id="heart"></span>
      <div class="grow">
        <p class="t-cap">Your reason</p>
        <p class="t-foot">&ldquo;Run with Aria without stopping to catch my breath&rdquo;</p>
      </div>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:6;--d:200ms" data-go="020-sos-passed">It passed</button>
    <div class="quiet" data-a style="--i:7;--d:200ms"><button class="link">Text a friend</button><i aria-hidden="true"></i><button class="link" data-go="021-sos-slipped">I slipped</button></div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#close').innerHTML = DX.icon('close');
  /* no loose bubble rings beside the tentacles: the pacer is the only motion around Jelli */
  $('#jelli').innerHTML = DX.char('jelli', { mood: 'breathe', size: 220 }).replace(/<g opacity="1" fill="none" stroke="#FFFFFF" stroke-width="2.5">[\s\S]*?<\/g>/, '');
  $('#heart').innerHTML = DX.icon('heart');
  /* Jelli's mouth follows the breath: closed (in through the nose), a soft 'o' on the way out. */
  const mouth = $('#jelli path[fill="#24163A"]'), openD = mouth ? mouth.getAttribute('d') : '';
  const setMouth = out => { if (!mouth) return; if (out) { mouth.setAttribute('d', openD); mouth.setAttribute('fill', '#24163A'); } else { mouth.setAttribute('d', 'M94 107 Q100 111.5 106 107'); mouth.setAttribute('fill', 'none'); } };
  setMouth(false);
  const wIn = $('#w-in'), wOut = $('#w-out');
  const say = out => { wIn.classList.toggle('off', out); wOut.classList.toggle('off', !out); setMouth(out); };
  let gen = 0, secs = 192;
  DX.after(0, () => {
    const g = ++gen; say(false);
    const loop = () => { if (g !== gen) return; say(false); setTimeout(() => { if (g !== gen) return; say(true); setTimeout(loop, 6000); }, 4000); };
    loop();
    secs = 0; $('#t').textContent = '0:00'; const tick = () => { if (g !== gen) return; secs++; $('#t').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'); setTimeout(tick, 1000); };
    setTimeout(tick, 1000);
    $('#lead').classList.remove('gone');
  });
  /* the helper copy only guides the first breath (4s in, 6s out), then fades; the still is at 3:12, so it is gone there */
  DX.after(10000, () => $('#lead').classList.add('gone'));
  DX.onStill(() => $('#lead').classList.add('gone'));
</script>
</body></html>
