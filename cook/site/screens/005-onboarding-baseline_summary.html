<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>005 Your baseline</title>
<meta name="motion" content="Progress eases from 2/11 to 3/11 (900ms). Question arrives, then the load card: 32 counts up (850ms, from 300ms) while the split bar grows left to right, cigarettes then vape (700ms each, 120ms apart). The two stat cards arrive and count up $2,555 and 365 (850ms). No haptic; one soft tick when the counts land.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .q .t-body { text-wrap: pretty; }
  .load { padding: 18px 18px 16px; }
  .load .big { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 14px; }
  .load .big .t-display { font-size: 52px; }
  .split { display: flex; gap: 4px; height: 8px; }
  .split i { display: block; border-radius: 99px; transform-origin: left; }
  .split .c { flex: 12; background: var(--fg); }
  .split .v { flex: 20; background: var(--coral); }
  .play .split i { animation: grow 700ms var(--settle) both; animation-delay: 400ms; }
  .play .split .v { animation-delay: 520ms; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }
  .legend { display: grid; gap: 8px; margin-top: 14px; }
  .legend .row { min-height: 0; gap: 10px; align-items: flex-start; }
  .legend .dot { width: 10px; height: 10px; border-radius: 99px; margin-top: 5px; flex: none; }
  .legend .dot.c { background: var(--fg); } .legend .dot.v { background: var(--coral); }
  .xcard { display: flex; gap: 14px; align-items: center; margin-top: 2px; }
  .xcard .xc { width: 88px; height: 88px; flex: none; }
  .answers { gap: 12px !important; }
  .legend b { font-weight: 700; }
  .stat .num { font-size: 30px; }
  .stat .t-foot { color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .stat .ico-tile { width: 34px; height: 34px; border-radius: 10px; margin-bottom: 12px; }
  .stat .ico-tile svg { width: 18px; height: 18px; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:27.3%"></i></div></div>
    <div class="avatar" id="av"></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>Your baseline</h1>
    <p class="t-body muted" data-a style="--i:1">A vape never burns out, so most people underestimate it. That's normal. We'll bring both down together.</p>
  </div>
  <div class="answers">
    <div class="card load" data-a style="--i:2">
      <p class="t-foot muted">Daily nicotine load</p>
      <div class="big"><span class="t-display num"><span data-count="32">32</span></span><span class="t-head">cigarettes' worth a day</span></div>
      <div class="split" aria-hidden="true"><i class="c"></i><i class="v"></i></div>
      <div class="legend">
        <div class="row"><span class="dot c"></span><p class="t-foot"><b>12 cigarettes</b></p></div>
        <div class="row"><span class="dot v"></span><p class="t-foot"><b>200 vape puffs</b>, about 20 cigarettes' worth</p></div>
      </div>
    </div>
    <div class="grid2">
      <div class="stat" data-a style="--i:3"><span class="ico-tile" data-icon="card"></span><span class="num" data-count="2555" data-prefix="$">$2,555</span><p class="t-foot">a year, at $7 a day</p></div>
      <div class="stat" data-a style="--i:4"><span class="ico-tile" data-icon="clock"></span><span class="num"><span data-count="365">365</span> hrs</span><p class="t-foot">a year, 1 hr a day</p></div>
    </div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:6">Continue</button></div>
</div>
<script>
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  document.getElementById('av').innerHTML = DX.char('xero', { mood: 'hello', size: 40 });
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '18.2%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '27.3%'));

</script>
</body></html>
