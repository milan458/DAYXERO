<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>001 One breath</title>
<meta name="motion" content="Xero settles up 48px (900ms) inside three soft rings, then the rings and Xero breathe together for one 10 s cycle: 4 s in (scale .82 to 1.06), 6 s out. The rings are the only pacer. The headline arrives (600ms, 90ms stagger) with Breathe in; at 4000ms it swaps for And out (500ms fade and 6px rise; only one phrase is ever on screen, full contrast). No breath puffs (they read as vapour); on the turn at 4000ms the outer ring sends one soft pulse outward (scale 1 to 1.08, fading, 1.2 s). A hairline under the copy fills left to right over the 10 s (linear) to show the screen moves on by itself, above a quiet Skip. Gentle haptic at 0 and 4000ms marking the turn; auto-advances at 10.4 s.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* One calm ring set (~320px), 28px above the headline; round 9 lifts the block to close the dead space above it. */
  .stage { position: absolute; left: 0; right: 0; top: 178px; height: 320px; display: grid; place-items: center; }
  .rings { position: absolute; inset: 0; display: grid; place-items: center; }
  .rings i { position: absolute; border-radius: 999px; background: color-mix(in srgb, var(--card-2) var(--a), transparent); }
  .rings i:nth-child(1) { width: 318px; height: 318px; --a: 38%; }
  .rings i:nth-child(2) { width: 256px; height: 256px; --a: 62%; }
  .rings i:nth-child(3) { width: 196px; height: 196px; --a: 100%; }
  /* Dark: the rings become a soft warm glow (apricot light on the night ground), each with a faint rim, so the pacer reads. */
  /* Round 8: a clean warm amber at low opacity (no peach-on-navy brown); the rims carry the shape. */
  /* Round 9: the fills are a navy tint (no warm grey); only the faint rims stay warm. */
  [data-theme="dark"] .rings i { background: color-mix(in srgb, #2A3A70 var(--g1), transparent); box-shadow: inset 0 0 0 1px rgba(255,200,120,var(--rim)); }
  [data-theme="dark"] .rings i:nth-child(1) { --g1: 22%; --rim: .14; }
  [data-theme="dark"] .rings i:nth-child(2) { --g1: 34%; --rim: .18; }
  [data-theme="dark"] .rings i:nth-child(3) { --g1: 52%; --rim: .26; }
  /* One soft ring pulse on the turn to the out-breath (replaces the breath puffs). */
  .pulse { position: absolute; width: 318px; height: 318px; border-radius: 999px; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--card-2) 80%, transparent); opacity: 0; pointer-events: none; }
  [data-theme="dark"] .pulse { box-shadow: inset 0 0 0 1.5px rgba(255,200,120,.3); }
  .play .pulse { animation: pulse 1200ms var(--ease) 4000ms both; }
  @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.08); } }
  .play .rings i:nth-child(1) { animation-delay: -.25s; }
  .play .rings i:nth-child(2) { animation-delay: -.12s; }
  .hero { position: relative; margin-top: 6px; }
  .copy { position: absolute; left: 0; right: 0; top: 526px; text-align: center; padding: 0 var(--gutter); display: grid; gap: 12px; justify-items: center; }
  .copy h1 { position: relative; height: 34px; width: 100%; }
  .copy h1 span { position: absolute; left: 0; right: 0; top: 0; display: block; transition: opacity 500ms var(--ease), transform 500ms var(--ease); }
  .copy h1 .dim { opacity: 0; transform: translateY(6px); }
  .dock { background: none; gap: 14px; padding-bottom: 30px; }
  /* A hairline that fills over the 10 s breath: the screen moves on by itself. */
  /* The filled part is full ink (well over 3:1 on apricot); the track stays a quiet groove. */
  .timer { height: 3px; border-radius: 99px; background: color-mix(in srgb, var(--fg) 20%, transparent); overflow: hidden; margin: 0 auto; width: 132px; }
  .timer i { display: block; height: 100%; width: 100%; background: var(--fg); transform-origin: left; transform: scaleX(.6); }
  .play .timer i { animation: tick 10000ms linear both; }
  @keyframes tick { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .still .timer i { animation: none !important; transform: scaleX(.6); }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="stage">
    <div class="rings" data-fade><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i></div>
    <div class="pulse" aria-hidden="true"></div>
    <div class="hero" id="hero" data-settle></div>
  </div>

  <div class="copy">
    <h1 class="t-large" data-a style="--i:1"><span id="in">Breathe in</span><span id="out" class="dim">And out</span></h1>
    <p class="t-body muted" data-a style="--i:2">One slow breath before we start.</p>
  </div>


  <div class="dock"><div class="timer" data-a style="--i:3" aria-hidden="true"><i></i></div><a class="link" data-a style="--i:4">Skip</a></div>
</div>
<script>
  /* The kit's breathe marks beside his arm are removed; round 9 also drops the mouth puffs (they read as vapour on a quit-vaping app). */
  document.getElementById('hero').innerHTML = DX.char('xero', { mood: 'breathe', size: 176 })
    .replace(/<g opacity="1" fill="none" stroke="#(?:24163A|F3E9DE)" stroke-width="3" stroke-linecap="round"><animateTransform[^>]*><\/animateTransform><path d="M172 100[^"]*"><\/path><path d="M176 112[^"]*"><\/path><\/g>/, '')
    ;
  const i = document.getElementById('in'), o = document.getElementById('out');
  DX.after(0, () => { i.classList.remove('dim'); o.classList.add('dim'); });
  DX.after(4000, () => { i.classList.add('dim'); o.classList.remove('dim'); });
  DX.onStill(() => { i.classList.add('dim'); o.classList.remove('dim'); });
</script>
</body></html>
