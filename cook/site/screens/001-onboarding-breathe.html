<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>001 One breath</title>
<meta name="motion" content="Xero settles up 48px (900ms) inside three soft rings, then the rings and Xero breathe together for one 10 s cycle: 4 s in (scale .82 to 1.06), 6 s out. The headline arrives (600ms, 90ms stagger) with Breathe in lit; at 4000ms Breathe in swaps for And out (500ms fade and 6px rise; only one word is ever on screen, full contrast). The meter fills with the breath: In fills linearly over 4 s, then rests tinted (400ms) while Out fills over 6 s and its label lights. Gentle haptic at 0 and 4000ms marking the turn; auto-advances at 10.4 s.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* One calm ring set (~300px), 32px above the headline. */
  .stage { position: absolute; left: 0; right: 0; top: 168px; height: 300px; display: grid; place-items: center; }
  .rings { position: absolute; inset: 0; display: grid; place-items: center; }
  .rings i { position: absolute; border-radius: 999px; background: color-mix(in srgb, var(--card-2) var(--a), transparent); }
  .rings i:nth-child(1) { width: 300px; height: 300px; --a: 38%; }
  .rings i:nth-child(2) { width: 244px; height: 244px; --a: 62%; }
  .rings i:nth-child(3) { width: 188px; height: 188px; --a: 100%; }
  .play .rings i:nth-child(1) { animation-delay: -.25s; }
  .play .rings i:nth-child(2) { animation-delay: -.12s; }
  .hero { position: relative; margin-top: 6px; }
  .copy { position: absolute; left: 0; right: 0; top: 500px; text-align: center; padding: 0 var(--gutter); display: grid; gap: 12px; justify-items: center; }
  .copy h1 { position: relative; height: 34px; width: 100%; }
  .copy h1 span { position: absolute; left: 0; right: 0; top: 0; display: block; transition: opacity 500ms var(--ease), transform 500ms var(--ease); }
  .copy h1 .dim { opacity: 0; transform: translateY(6px); }
  /* Breath meter: the In segment rests tinted once done; Out fills with the exhale and its label is the lit one. */
  .meter { position: absolute; left: 48px; right: 48px; top: 618px; display: grid; grid-template-columns: 4fr 6fr; gap: 6px; }
  .meter .seg { display: grid; gap: 8px; }
  .meter .bar { height: 10px; border-radius: 99px; background: color-mix(in srgb, var(--fg) 14%, transparent); overflow: hidden; }
  .meter .bar b { display: block; height: 100%; width: 100%; background: var(--fg); border-radius: inherit; transform-origin: left; transition: background 400ms var(--ease); }
  .meter .t-foot { color: var(--fg); font-size: 15px; font-weight: 700; transition: color 400ms var(--ease), opacity 400ms var(--ease); }
  .meter .seg:last-child .t-foot { text-align: right; }
  .meter.exhale .in b { background: color-mix(in srgb, var(--fg) 34%, transparent); }
  .meter.exhale .in .t-foot { color: var(--muted); font-weight: 600; }
  .meter:not(.exhale) .out .t-foot { color: var(--muted); font-weight: 600; }
  .play .meter .in b { animation: fillx 4000ms linear both; }
  .play .meter .out b { animation: fillx 6000ms linear 4000ms both; }
  @keyframes fillx { from { transform: scaleX(0); } to { transform: none; } }
  /* Still: the frame 6.5 s in, mid-exhale. */
  .still .meter .out b { animation: none !important; transform: scaleX(.42); }
  .dock { background: none; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="stage">
    <div class="rings" data-fade><i class="breathe"></i><i class="breathe"></i><i class="breathe"></i></div>
    <div class="hero" id="hero" data-settle></div>
  </div>

  <div class="copy">
    <h1 class="t-large" data-a style="--i:1"><span id="in">Breathe in</span><span id="out" class="dim">And out</span></h1>
    <p class="t-body muted" data-a style="--i:2">One slow breath before I ask anything.</p>
  </div>

  <div class="meter" id="meter" data-a style="--i:3" aria-label="Breath: in for 4, out for 6">
    <div class="seg in"><div class="bar"><b></b></div><span class="t-foot">In for 4</span></div>
    <div class="seg out"><div class="bar"><b></b></div><span class="t-foot">Out for 6</span></div>
  </div>

  <div class="dock"><a class="link" data-a style="--i:4">Skip for now</a></div>
</div>
<script>
  document.getElementById('hero').innerHTML = DX.char('xero', { mood: 'breathe', size: 176 });
  const i = document.getElementById('in'), o = document.getElementById('out'), m = document.getElementById('meter');
  DX.after(0, () => { i.classList.remove('dim'); o.classList.add('dim'); m.classList.remove('exhale'); });
  DX.after(4000, () => { i.classList.add('dim'); o.classList.remove('dim'); m.classList.add('exhale'); });
  DX.onStill(() => { i.classList.add('dim'); o.classList.remove('dim'); m.classList.add('exhale'); });
</script>
</body></html>
