<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>068 Subscription</title>
<meta name="motion" content="The plan card arrives and the price counts up to $39.99; the What you get card follows: its dawn (pre-dawn in dark) lifts the sun and drifts its clouds while Xero settles onto the near hill (450ms), then the four perks fade in one under another, 90ms apart. Manage in the App Store (secondary) opens the App Store subscription sheet; Restore purchases shows a small spinner, then a check.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* screen-local helpers: icon fill, section labels, small icon tiles, bottom toast */
.hd { display: grid; gap: 6px; padding-top: 58px; }
.sec { padding: 22px 4px 8px; color: var(--muted); }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row.tap { min-height: 56px; }
.toast.b { top: auto; opacity: 0; transform: translateY(18px); transition: opacity .4s var(--ease), transform .55s var(--settle); }
.toast.b.in { opacity: 1; transform: none; }
.toast.b .ck { flex: none; }
.opt.on { box-shadow: inset 0 0 0 2px var(--sel); }
html:not([data-theme="dark"]) .opt.on { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sel) 72%, transparent); }
.pill { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--card-2); display: inline-flex; align-items: center; font: 600 15px/1 var(--body); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }

.plan { margin-top: 16px; padding: 16px 20px 18px; display: grid; gap: 4px; }
.plan .price { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
.plan .price .num { font-size: 36px; line-height: 1; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--tick); }
.status i { width: 8px; height: 8px; border-radius: 99px; background: currentColor; }
.get { margin-top: 12px; padding: 0; overflow: hidden; }
.get .art { position: relative; height: 96px; overflow: hidden; }
.get .art > svg, .get .art .hill { position: absolute; inset: 0; }
.get .art .xs { position: absolute; left: 236px; top: 16px; }
.get .body { padding: 14px 18px 16px; display: grid; gap: 8px; }
.get .it { display: flex; align-items: center; gap: 12px; min-height: 30px; }
.get .it .ico-tile { width: 30px; height: 30px; border-radius: 10px; }
.get .it .ico-tile svg { width: 17px; height: 17px; }
.get .it .t-foot { color: var(--fg); }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Subscription</h1><p class="t-foot muted" data-a style="--i:1">Billed and renewed through your Apple ID.</p></div>
  <div class="card plan" data-a style="--i:2">
    <span class="status t-cap"><i></i>Active</span>
    <div class="t-title" style="margin-top:4px">DayXero Yearly</div>
    <div class="price"><span class="num" data-count="39.99" data-dec="2" data-prefix="$">$39.99</span><span class="t-head">a year</span></div>
    <p class="t-foot muted">About $3.33 a month. Renews Nov 6, 2027.</p>
  </div>
  <div class="card get" data-a style="--i:3">
    <div class="art" id="get"><div class="hill" id="hill"></div><div class="xs" id="xr" data-settle style="--d:450ms"></div></div>
    <div class="body">
      <div class="t-head" style="margin-bottom:2px">What you get</div>
      <div class="it" data-fade style="--d:500ms"><span class="ico-tile" data-ic="sun"></span><span class="t-foot">Your prep week and your plan</span></div>
      <div class="it" data-fade style="--d:590ms"><span class="ico-tile" data-ic="wave"></span><span class="t-foot">Craving SOS, any time</span></div>
      <div class="it" data-fade style="--d:680ms"><span class="ico-tile" data-ic="note"></span><span class="t-foot">Daily lessons and evening check-ins</span></div>
      <div class="it" data-fade style="--d:770ms"><span class="ico-tile" data-ic="medal"></span><span class="t-foot">Badges and money kept</span></div>
    </div>
  </div>
</div></div>
<div class="dock"><button class="btn ghost" data-a style="--i:4">Manage in the App Store</button><button class="link" data-a style="--i:5">Restore purchases</button></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
const dark = DX.theme === 'dark';
/* Same scene in both modes: dawn in light, the kit's pre-dawn in dark; Xero stands on the near hill beside the sun. */
document.getElementById('get').insertAdjacentHTML('afterbegin', DX.char('horizon', { scene: 'dawn', w: 346, h: 96, clarity: 90, fit: 'xMidYMid slice' }));
document.getElementById('hill').innerHTML = `<svg width="346" height="96" viewBox="0 0 346 96" aria-hidden="true"><defs><linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${dark ? '#1A2846' : '#FFA27A'}"/><stop offset="1" stop-color="${dark ? '#0F1A31' : '#F0794F'}"/></linearGradient></defs>
  <path d="M0 96 V88 C80 86 170 82 230 76 C262 73 300 76 346 82 V96Z" fill="url(#sh)"/></svg>`;
document.getElementById('xr').innerHTML = DX.char('xero', { mood: 'hello', size: 62 });
</script>
</body></html>
