<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>068 Subscription</title>
<meta name="motion" content="The plan card arrives and the price counts up to $39.99 while Xero settles into its corner (400ms); the What you get card follows: its path scene drifts its clouds and the four perks settle in 90ms apart. Manage opens the App Store subscription sheet.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* screen-local helpers: icon fill, section labels, small icon tiles, bottom toast */
.hd { display: grid; gap: 6px; padding-top: 58px; }
.sec { padding: 22px 4px 8px; color: var(--muted); }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row.tap { min-height: 56px; }
.toast.b { top: auto; opacity: 0; transform: translateY(18px); transition: opacity .4s var(--ease), transform .55s var(--settle); }
.toast.b.in { opacity: 1; transform: none; }
.toast.b .ck { flex: none; }
.opt.on { box-shadow: inset 0 0 0 2px var(--sel); }
html:not([data-theme="dark"]) .opt.on { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sel) 72%, transparent); }
.pill { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--card-2); display: inline-flex; align-items: center; font: 600 15px/1 var(--body); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }

.plan { margin-top: 18px; padding: 18px 20px; display: grid; gap: 4px; position: relative; overflow: hidden; }
.plan .price { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; }
.plan .price .num { font-size: 36px; line-height: 1; }
.plan .xr { position: absolute; right: 8px; top: 10px; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--tick); }
.status i { width: 8px; height: 8px; border-radius: 99px; background: currentColor; }
.get { margin-top: 12px; padding: 0; overflow: hidden; }
.get .art { position: relative; height: 92px; overflow: hidden; }
.get .art .cap { position: absolute; left: 14px; top: 12px; padding: 6px 11px; border-radius: 99px; background: rgba(255,248,238,.92); color: #1E1A3A; font: 700 15px/1 var(--display); }
.get .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; padding: 16px 16px 18px; }
.get .it { display: flex; align-items: flex-start; gap: 10px; }
.get .it .ico-tile.s { width: 32px; height: 32px; }
.get .it .t-foot { color: var(--fg); line-height: 1.3; padding-top: 1px; }

</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Subscription</h1><p class="t-foot muted" data-a style="--i:1">Payment and renewal are handled by your Apple ID.</p></div>
  <div class="card plan" data-a style="--i:2">
    <span class="status t-cap"><i></i>Active</span>
    <div class="t-title" style="margin-top:6px">DayXero Yearly</div>
    <div class="price"><span class="num" data-count="39.99" data-dec="2" data-prefix="$">$39.99</span><span class="t-head">a year</span></div><p class="t-foot muted">About $3.33 a month</p>
    <div class="divider" style="margin:12px 0 8px"></div>
    <p class="t-foot muted">Renews Nov 6, 2027. Your 7-day free trial ended Fri, Nov 6.</p>
    <div class="xr" id="xr" data-settle style="--d:400ms"></div>
  </div>
  <div class="card get" data-a style="--i:3">
    <div class="art" id="get"><span class="cap">What you get</span></div>
    <div class="grid">
      <div class="it" data-settle style="--d:500ms"><span class="ico-tile s" data-ic="sun" data-s="18"></span><span class="t-foot">Your prep week and plan</span></div>
      <div class="it" data-settle style="--d:590ms"><span class="ico-tile s" data-ic="wave" data-s="18"></span><span class="t-foot">Craving SOS, any time</span></div>
      <div class="it" data-settle style="--d:680ms"><span class="ico-tile s" data-ic="note" data-s="18"></span><span class="t-foot">Daily lessons and check-ins</span></div>
      <div class="it" data-settle style="--d:770ms"><span class="ico-tile s" data-ic="medal" data-s="18"></span><span class="t-foot">Badges and money kept</span></div>
    </div>
  </div>
</div></div>
<div class="dock"><button class="btn" data-a style="--i:4">Manage in the App Store</button><button class="link" data-a style="--i:5">Restore purchases</button></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
document.getElementById('get').insertAdjacentHTML('afterbegin', DX.char('horizon', { scene: 'path', w: 346, h: 92, clarity: 90, fit: 'xMidYMax slice' }));
document.getElementById('xr').innerHTML = DX.char('xero', { mood: 'hello', size: 88 });
</script>
</body></html>
