<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>068 Subscription</title>
<meta name="motion" content="The plan card arrives with its own scene: the sun lifts behind the far hill (light: dawn; dark: a bright pre-dawn sun), the path draws up the near hill (900ms) and Xero settles on the top holding his ticket (450ms, the ticket tips once as he lands); then the price counts up to $39.99 and the Your plan includes rows fade in one under another, 90ms apart. Manage in the App Store (secondary) opens the App Store subscription sheet; Restore purchases shows a small spinner, then a check.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.hd { display: grid; gap: 6px; padding-top: 58px; }
.ico-tile.apr { background: #FFE6D0; color: #A8481F; } .ico-tile.sky { background: #E1E7F8; color: #2C468E; } .ico-tile.mint { background: #DDF1E4; color: #22704A; }
[data-theme="dark"] .ico-tile.apr { background: rgba(255,195,138,.16); color: #FFC38A; } [data-theme="dark"] .ico-tile.sky { background: rgba(160,186,255,.15); color: #B4C6FF; } [data-theme="dark"] .ico-tile.mint { background: rgba(159,227,188,.13); color: #9FE3BC; }
.plan { margin-top: 16px; padding: 0; overflow: hidden; }
.plan .art { position: relative; height: 112px; overflow: hidden; }
.plan .art > svg { position: absolute; inset: 0; display: block; }
.plan .art .who { position: absolute; left: 214px; top: -4px; width: 84px; height: 84px; }
.plan .art .tk { position: absolute; left: 66px; top: 50px; transform: rotate(-14deg); transform-origin: 10% 50%; }
.plan .body { padding: 12px 20px 14px; display: grid; gap: 3px; }
.status { justify-self: start; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 99px; background: var(--card-2); color: var(--fg); }
.status i { width: 8px; height: 8px; border-radius: 99px; background: #2FA36B; }
.plan .price { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
.plan .price .num { font-size: 36px; line-height: 1; }
.get { margin-top: 10px; padding: 12px 18px 14px; display: grid; gap: 5px; }
.get .it { display: flex; align-items: center; gap: 12px; min-height: 30px; }
.get .it .ico-tile { width: 30px; height: 30px; border-radius: 10px; }
.get .it .ico-tile svg { width: 17px; height: 17px; }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Subscription</h1><p class="t-foot muted" data-a style="--i:1">Billed and renewed through your Apple ID.</p></div>
  <div class="card plan" data-a style="--i:2">
    <div class="art" id="art"><div class="who" data-settle style="--d:450ms"><span id="xr"></span><span class="tk" id="tk"></span></div></div>
    <div class="body">
      <span class="status t-cap"><i></i>Active</span>
      <div class="t-title" style="margin-top:4px">DayXero Yearly</div>
      <div class="price"><span class="num" data-count="39.99" data-dec="2" data-prefix="$">$39.99</span><span class="t-head">a year</span></div>
      <p class="t-foot muted">Renews Fri, Nov 6, 2027</p>
    </div>
  </div>
  <div class="card get" data-a style="--i:3">
    <div class="t-head" style="margin-bottom:2px">Your plan includes</div>
    <div class="it" data-fade style="--d:500ms"><span class="ico-tile apr" data-ic="sun"></span><span class="t-foot">Your prep week and your plan</span></div>
    <div class="it" data-fade style="--d:590ms"><span class="ico-tile sky" data-ic="wave"></span><span class="t-foot">Craving SOS, any time</span></div>
    <div class="it" data-fade style="--d:680ms"><span class="ico-tile mint" data-ic="note"></span><span class="t-foot">Daily lessons and evening check-ins</span></div>
    <div class="it" data-fade style="--d:770ms"><span class="ico-tile apr" data-ic="medal"></span><span class="t-foot">Badges and money kept</span></div>
  </div>
</div></div>
<div class="dock"><button class="btn ghost" data-a style="--i:4">Manage in the App Store</button><button class="link" data-a style="--i:5">Restore purchases</button></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
const dark = DX.theme === 'dark', W = 346, H = 112;
/* Its own scene: a path climbing a single near hill to Xero, who stands on the top holding his ticket; the sun rises behind the far hill on the left.
   Light: dawn. Dark: pre-dawn with a bright sun. */
const c = dark
  ? { sky: ['#14214A', '#3B4A80', '#D9967A'], glow: '#FFD08A', sun: '#FFDB8A', far: '#2E3B6E', near: '#1F2A55', path: '#F3D9B4', star: 1 }
  : { sky: ['#FFC9A0', '#FFE0C2', '#FFF0DD'], glow: '#FFF3C4', sun: '#FFD966', far: '#FFBE8F', near: '#FF9C6E', path: '#FFF4E4', star: 0 };
document.getElementById('art').insertAdjacentHTML('afterbegin', `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs>
  <linearGradient id="ssk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.sky[0]}"/><stop offset=".6" stop-color="${c.sky[1]}"/><stop offset="1" stop-color="${c.sky[2]}"/></linearGradient>
  <radialGradient id="ssg"><stop offset="0" stop-color="${c.glow}" stop-opacity="${dark ? .8 : .9}"/><stop offset="1" stop-color="${c.glow}" stop-opacity="0"/></radialGradient></defs>
  <rect width="${W}" height="${H}" fill="url(#ssk)"/>
  ${c.star ? [[30, 16], [120, 10], [178, 26], [316, 18], [150, 40]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 2 ? 1.1 : 1.5}" fill="#fff" opacity="${i % 2 ? .55 : .9}"/>`).join('') : `<g fill="#FFFFFF" opacity=".9"><ellipse cx="300" cy="28" rx="24" ry="7"/><ellipse cx="290" cy="23" rx="12" ry="7"/></g>`}
  <circle cx="86" cy="82" r="60" fill="url(#ssg)"/><circle cx="86" cy="82" r="${dark ? 27 : 25}" fill="${c.sun}"/>
  <path d="M0 92 C40 82 90 80 140 88 C170 93 190 96 210 96 V112 H0Z" fill="${c.far}"/>
  <path d="M110 112 C150 104 196 76 256 76 C300 76 330 88 346 96 V112Z" fill="${c.near}"/>
  <path d="M150 112 C178 106 200 96 220 88 C230 84 240 81 252 79" fill="none" stroke="${c.path}" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 7" class="draw" style="--len:140;--dur:900ms;--d:300ms"/></svg>`);
document.getElementById('xr').innerHTML = DX.char('xero', { mood: 'hello', size: 84 });
/* The ticket in his right hand: cream, notched, one coral star. */
document.getElementById('tk').innerHTML = `<svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><path d="M2 2 H28 V7 A3 3 0 0 0 28 13 V18 H2 V13 A3 3 0 0 0 2 7Z" fill="#FFF8EE" stroke="#E85A3E" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 5.5 l1.3 2.7 3 .4 -2.2 2 .5 2.9 -2.6 -1.4 -2.6 1.4 .5 -2.9 -2.2 -2 3 -.4z" fill="#FF7A55"/><path d="M18 8h6M18 12h4" stroke="#E85A3E" stroke-width="1.6" stroke-linecap="round"/></svg>`;
</script>
</body></html>
