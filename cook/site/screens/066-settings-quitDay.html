<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>066 Quit Day</title>
<meta name="motion" content="The date card arrives and the day count rises 0 to 7; the seven days since Quit Day (Nov 6 to 12) fill in left to right (110ms apart) and end on the Today ring, 13; the change card follows as Xero settles onto his little hill beside its heading (450ms). Choose a new date opens a calm confirm sheet first, never a direct date wheel.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.hd { display: grid; gap: 6px; padding-top: 58px; }
.hero { display: flex; align-items: center; gap: 18px; padding: 16px 18px; margin-top: 16px; }
.cal { width: 84px; border-radius: 18px; overflow: hidden; background: var(--card-2); text-align: center; flex: none; }
.cal .m { background: var(--fg); color: var(--g); padding: 6px 0; }
.cal .d { font: 800 40px/1 var(--display); padding: 8px 0 4px; letter-spacing: -1px; }
.cal .w { padding-bottom: 8px; color: var(--muted); }
.since .num { font-size: 48px; line-height: 1; }
.since .t-head { font-size: 22px; }
.wk { margin-top: 12px; padding: 14px 16px 16px; }
.wk .hdr { display: flex; justify-content: space-between; align-items: baseline; }
.days { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-top: 12px; text-align: center; }
.days b { display: grid; place-items: center; width: 36px; height: 36px; margin: 0 auto; border-radius: 99px; background: var(--sel); color: var(--sel-fg); font: 800 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.days .td b { background: transparent; box-shadow: inset 0 0 0 2.5px var(--fg); color: var(--fg); }
.days .t-cap { color: var(--muted); display: block; margin-top: 5px; }
.days .td .t-cap { color: var(--fg); }
.warn { margin-top: 12px; padding: 16px 18px 18px; display: grid; gap: 12px; }
.warn .top { display: flex; align-items: flex-end; gap: 14px; }
.warn .g { position: relative; width: 84px; height: 80px; flex: none; }
.warn .g .mound { position: absolute; left: 0; bottom: 0; }
.warn .g .who { position: absolute; left: 6px; top: -2px; }
.warn .top .txt { flex: 1; display: grid; gap: 4px; padding-bottom: 6px; }
.btn.ghost.small { box-shadow: inset 0 0 0 2px var(--line); }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Your Quit Day</h1><p class="t-foot muted" data-a style="--i:1">The day you stopped. It all counts from here.</p></div>
  <div class="card hero" data-a style="--i:2">
    <div class="cal"><div class="m t-cap">November</div><div class="d">6</div><div class="w t-cap">Friday</div></div>
    <div class="since" style="flex:1"><div><span class="num" data-count="7">7</span> <span class="t-head">days free</span></div><div class="t-foot muted">and counting</div></div>
  </div>
  <div class="card wk" data-a style="--i:3"><div class="hdr"><span class="t-foot muted">Since Nov 6</span><span class="t-cap muted">Today is Nov 13</span></div><div class="days" id="days"></div></div>
  <div class="card warn" data-a style="--i:4">
    <div class="top"><span class="g"><span class="mound" id="mound"></span><span class="who" id="xr066" data-settle style="--d:450ms"></span></span>
      <div class="txt"><div class="t-head">Need to change it?</div><p class="t-foot muted">A slip does not start you over.</p></div></div>
    <p class="t-foot muted">A new date restarts the day count only. Badges, lessons and logs stay.</p>
    <button class="btn ghost small">Choose a new date</button>
  </div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
const dark = DX.theme === 'dark';
document.getElementById('mound').innerHTML = `<svg width="84" height="22" viewBox="0 0 84 22" aria-hidden="true"><path d="M2 22 C10 7 28 2 42 2 C56 2 74 7 82 22Z" fill="${dark ? '#2A3658' : '#FFD9B6'}"/></svg>`;
document.getElementById('xr066').innerHTML = DX.char('xero', { mood: 'calm', size: 72 });
const wd = ['Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
document.getElementById('days').innerHTML = wd.map((d, i) => `<span data-pop style="--i:${i};--d:600ms"><b>${6 + i}</b><span class="t-cap">${d}</span></span>`).join('')
  + `<span class="td" data-pop style="--i:7;--d:600ms"><b>13</b><span class="t-cap">Today</span></span>`;
</script>
</body></html>
