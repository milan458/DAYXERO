<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>066 Quit Day</title>
<meta name="motion" content="The date card arrives, the day count rises 0 to 7 and the earned 7-day badge stamps in at 700ms; the seven dated days of the first week (6 to 12) fill in left to right (110ms apart) ending on the Today ring, 13; the change card follows with Xero beside its heading. Choose a new date opens a calm confirm sheet first, never a direct date wheel.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* screen-local helpers: icon fill, section labels, small icon tiles, bottom toast */
.hd { display: grid; gap: 6px; padding-top: 58px; }
.sec { padding: 22px 4px 8px; color: var(--muted); }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row.tap { min-height: 56px; }
.toast.b { top: auto; opacity: 0; transform: translateY(18px); transition: opacity .4s var(--ease), transform .55s var(--settle); }
.toast.b.in { opacity: 1; transform: none; }
.toast.b .ck { flex: none; }
.opt.on { box-shadow: inset 0 0 0 2px var(--sel); }
html:not([data-theme="dark"]) .opt.on { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sel) 72%, transparent); }
.pill { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--card-2); display: inline-flex; align-items: center; font: 600 15px/1 var(--body); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }

.hero { display: flex; align-items: center; gap: 16px; padding: 16px 18px; margin-top: 16px; }
.cal { width: 84px; border-radius: 18px; overflow: hidden; background: var(--card-2); text-align: center; flex: none; }
.cal .m { background: var(--fg); color: var(--g); padding: 6px 0; }
.cal .d { font: 800 40px/1 var(--display); padding: 8px 0 4px; letter-spacing: -1px; }
.cal .w { padding-bottom: 8px; color: var(--muted); }
.since .num { font-size: 40px; line-height: 1; }
.kept { margin-top: 12px; display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
.btn.ghost.small { box-shadow: inset 0 0 0 2px var(--line); }
.wk { margin-top: 10px; padding: 14px 16px 14px; }
.wk .hdr { display: flex; justify-content: space-between; align-items: baseline; }
.days { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin-top: 12px; text-align: center; }
.days b { display: grid; place-items: center; width: 36px; height: 36px; margin: 0 auto; border-radius: 99px; background: var(--sel); color: var(--sel-fg); font: 800 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.days .td b { background: transparent; box-shadow: inset 0 0 0 2.5px var(--fg); color: var(--fg); }
.days .t-cap { color: var(--muted); display: block; margin-top: 5px; }
.days .td .t-cap { color: var(--fg); }
.warn { margin-top: 10px; padding: 16px 18px 18px; display: grid; gap: 8px; }
.warn .top { display: flex; align-items: center; gap: 12px; }
.warn .top .t-head { flex: 1; }
.warn .xr { flex: none; width: 56px; height: 56px; margin: -6px -4px -8px 0; }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Your Quit Day</h1><p class="t-foot muted" data-a style="--i:1">The day you stopped. It all counts from here.</p></div>
  <div class="card hero" data-a style="--i:2">
    <div class="cal"><div class="m t-cap">November</div><div class="d">6</div><div class="w t-cap">Friday</div></div>
    <div class="since" style="flex:1"><div><span class="num" data-count="7">7</span> <span class="t-head">days</span></div><div class="t-foot muted">free since Nov 6</div></div>
    <div id="xb" data-stamp style="--d:700ms" aria-label="Day 7 medal"></div>
  </div>

  <div class="card wk" data-a style="--i:3"><div class="hdr"><span class="t-foot muted">Your first week</span><span class="t-cap muted">Nov 6 to 13</span></div><div class="days" id="days"></div></div>
  <div class="card warn" data-a style="--i:4">
    <div class="top"><div class="t-head">Need to change it?</div><div class="xr" id="xr066"></div></div>
    <p class="t-foot muted">A slip does not start you over. A new date restarts the day count only. Badges, lessons and logs stay.</p>
    <button class="btn ghost small" style="margin-top:6px">Choose a new date</button>
  </div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
document.getElementById('xb').innerHTML = DX.badge({ kind: 'day', n: 7, state: 'earned', size: 64, bare: true, label: 'Day 7' });
document.getElementById('xr066').innerHTML = DX.char('xero', { mood: 'calm', size: 60 });
const wd = ['Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
document.getElementById('days').innerHTML = wd.map((d, i) => `<span data-pop style="--i:${i};--d:600ms"><b>${6 + i}</b><span class="t-cap">${d}</span></span>`).join('')
  + `<span class="td" data-pop style="--i:7;--d:600ms"><b>13</b><span class="t-cap">Today</span></span>`;
</script>
</body></html>
