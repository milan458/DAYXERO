<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>050 NRT plan</title>
<meta name="motion" content="Title arrives, then the one plan card: its compact step-down strip grows up from the baseline bar by bar (21, 14, then 7 mg; 900ms settle, 150ms apart; widths in the 6:2:2 ratio of their weeks), the 'Today' marker (a short ink line and label at the start of the first step) fades in at 900ms, and the three step rows below it settle in like a plan being laid out (120ms stagger), each with a chevron (tap to edit). The 'At night' choice is the card's last row. No completion here; the plan is confirmed on the reminders screen.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .plan { margin-top: 18px; padding: 0; overflow: hidden; }
  .plan .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 18px 0; }
  .plan .hd .t-foot { color: var(--muted); white-space: nowrap; flex: none; }
  .plan .hd .t-head { white-space: nowrap; }
  /* one tint per step, used by the strip and the row swatches; the 7 mg step is deep enough to read on white */
  .plan { --s1: #F98443; --s2: #FCA167; --s3: #FFBB8A; }
  [data-theme="dark"] .plan { --s1: #FF9A5C; --s2: #FFB27F; --s3: #FFCBA1; }
  .strip { position: relative; margin: 36px 18px 0; height: 66px; display: flex; align-items: flex-end; gap: 4px; border-bottom: 1.5px solid var(--line); }
  .strip i { height: var(--h); border-radius: 8px 8px 3px 3px; background: var(--c); transform-origin: bottom; }
  .play .strip i { animation: grow 900ms var(--settle) both; animation-delay: calc(var(--i) * 150ms + 250ms); }
  @keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
  .today { position: absolute; left: 0; top: -26px; bottom: -2px; width: 2px; }
  .today::before { content: ""; position: absolute; left: 0; top: 18px; bottom: 0; width: 2.5px; border-radius: 2px; background: var(--fg); }
  .today span { position: absolute; left: -2px; top: 0; white-space: nowrap; color: var(--fg); font: 700 13px/14px var(--body); display: flex; align-items: center; gap: 5px; }
  .today span::before { content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--fg); }
  .rows { margin-top: 10px; }
  .rows .row { min-height: 64px; padding: 8px 14px 8px 18px; gap: 12px; border-top: 1px solid var(--line); }
  .sw { width: 10px; height: 30px; border-radius: 4px; background: var(--c); flex: none; }
  .row .t-head { font-size: 17px; }
  .row .t-foot { color: var(--muted); }
  .row .wk { font: 600 14px/1 var(--body); color: var(--muted); }
  .row .chev { margin-left: -4px; }
  .night { border-top: 1px solid var(--line); padding: 14px 18px 18px; display: grid; gap: 10px; }
  .night .t-foot { color: var(--muted); }
  .night .chips { flex-wrap: nowrap; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-ic="back"></button>
    <div class="grow"><div class="steps" aria-label="Step 3 of 4"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <h1 class="t-title" data-a style="--i:0">Your patch plan</h1>
      <p class="t-foot lead" data-a style="--i:1">From your pack's label. Tap a step to change it.</p>
      <div class="card plan" data-a style="--i:2">
        <div class="hd"><p class="t-head">10 weeks, three steps</p><p class="t-foot">From Nov 13</p></div>
        <div class="strip" aria-hidden="true">
          <i style="flex:6 1 0;--h:100%;--i:0;--c:var(--s1)"></i><i style="flex:2 1 0;--h:66%;--i:1;--c:var(--s2)"></i><i style="flex:2 1 0;--h:36%;--i:2;--c:var(--s3)"></i>
          <div class="today" data-fade style="--d:900ms"><span>Today</span></div>
        </div>
        <div class="rows">
          <div class="row" data-settle style="--i:3"><i class="sw" style="--c:var(--s1)"></i><div class="grow"><p class="t-head">21 mg</p><p class="t-foot">Fri, Nov 13 to Thu, Dec 24</p></div><span class="wk">6 weeks</span><span class="chev" data-ic="chev"></span></div>
          <div class="row" data-settle style="--i:4"><i class="sw" style="--c:var(--s2)"></i><div class="grow"><p class="t-head">14 mg</p><p class="t-foot">Fri, Dec 25 to Thu, Jan 7</p></div><span class="wk">2 weeks</span><span class="chev" data-ic="chev"></span></div>
          <div class="row" data-settle style="--i:5"><i class="sw" style="--c:var(--s3)"></i><div class="grow"><p class="t-head">7 mg</p><p class="t-foot">Fri, Jan 8 to Thu, Jan 21</p></div><span class="wk">2 weeks</span><span class="chev" data-ic="chev"></span></div>
        </div>
        <div class="night" data-a style="--i:6">
          <p class="t-foot">At night</p>
          <div class="chips"><button class="chip on">Keep it on</button><button class="chip">Take it off at bedtime</button></div>
        </div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:7" data-go="051-nrt-reminders">Use this plan</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
</script>
</body></html>
