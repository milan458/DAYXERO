<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>012 Plan reveal</title>
<meta name="motion" content="Progress eases 9/11 to 10/11; title arrives and the underline draws under 'ready'. The Day Xero medallion is the hero: its cream coin, glowing warm, pops in (700ms spring, from 300ms); Xero settles in beside it at a smaller size (900ms, from 450ms) and cheers, bobbing. The caption arrives, then the stamp card: Prep 1 pops in its up-next form and Prep 2 to 7 pop in locked, 90ms apart (from 900ms). The button arrives after. Light haptic when the medallion lands and on the button.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  .q { padding-top: 112px; gap: 8px; }
  /* Hero: the Day Xero medallion (kit xero badge, waiting form) on its cream coin, glowing; Xero cheers beside it, smaller. */
  .hero { position: relative; height: 186px; margin: 18px var(--gutter) 0; }
  .hero .coin { position: absolute; left: 132px; top: 4px; width: 172px; height: 172px; border-radius: 99px; background: #FFF8EE; display: grid; place-items: center;
    box-shadow: 0 0 0 10px rgba(255,217,102,.30), 0 0 46px 14px rgba(255,201,60,.42); }
  [data-theme="dark"] .hero .coin { box-shadow: 0 0 0 9px rgba(255,248,238,.10), 0 0 44px 12px rgba(255,205,130,.26); }
  .hero .coin .med { color: #1E1A3A; }
  .hero .xc { position: absolute; left: 6px; top: 52px; }
  .cap { padding: 22px var(--gutter) 0; text-align: center; display: grid; gap: 4px; }
  .cap .t-foot { color: var(--muted); }
  .wrap { padding: 20px var(--gutter) 0; }
  .sh { display: flex; justify-content: space-between; align-items: baseline; }
  .stamps { display: flex; justify-content: space-between; margin: 14px -2px 0; color: var(--fg); }
  .stamps .pb { flex: none; display: block; }
  /* Locked stamps: the kit's locked medallion with a solid hairline instead of a dashed one (fewer dashes in the row). */
  .stamps .pb.lk circle[stroke-dasharray] { stroke-dasharray: none; stroke-opacity: .22; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:90.9%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>Your plan is <span class="mark">ready</span></h1>
    <p class="t-body muted" data-a style="--i:1">Seven prep days, then your Quit Day.</p>
  </div>

  <div class="hero">
    <div class="coin" data-pop style="--d:300ms"><div class="med" id="med"></div></div>
    <div class="xc" data-settle style="--d:450ms"><div class="bob" id="hx"></div></div>
  </div>

  <div class="cap">
    <p class="t-title" data-a style="--i:3">Day Xero, Fri, Nov 6</p>
    <p class="t-foot" data-a style="--i:4">Your Quit Day. This medallion is yours that day.</p>
  </div>

  <div class="wrap">
    <div class="card" data-a style="--i:5">
      <div class="sh"><p class="t-head">Prep stamps</p><span class="t-foot muted">One a day</span></div>
      <div class="stamps" id="stamps"></div>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:6">Start my prep week</button>
    <a class="link" data-a style="--i:7">See all plans</a>
  </div>
</div>
<script>
  document.querySelector('.icon-btn').innerHTML = DX.icon('back');
  document.getElementById('med').innerHTML = DX.badge({ kind: 'xero', n: '0', state: 'next', size: 140, bare: true, label: 'Day Xero' });
  document.getElementById('hx').innerHTML = DX.char('xero', { mood: 'cheer', size: 112 });
  let h = '';
  for (let i = 1; i <= 7; i++) h += `<span class="pb ${i === 1 ? '' : 'lk'}" data-pop style="--i:0;--d:${900 + i * 90}ms">${DX.badge({ kind: 'prep', n: i, state: i === 1 ? 'next' : 'locked', size: 42, bare: true, label: 'Prep ' + i })}</span>`;
  document.getElementById('stamps').innerHTML = h;
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '81.8%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '90.9%'));
</script>
</body></html>
