<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>012 Plan reveal</title>
<meta name="motion" content="Progress eases 9/11 to 10/11; title arrives and the underline draws under 'ready'. The Day Xero medallion is the hero: its cream coin, centred and glowing warm amber in both modes, pops in (700ms spring, from 300ms); a soft paper ground (cast shadow, no crest line) fades in under it; Xero, smaller, settles onto that ground to its lower left (900ms, from 450ms) and cheers, bobbing. The caption arrives, then the stamp card: Prep 1 pops in its up-next form and Prep 2 to 7 pop in quieter (locked: faint ring, 14px numeral, no padlocks), 90ms apart (from 900ms). The button arrives after. Light haptic when the medallion lands and on the button.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  .q { padding-top: 112px; gap: 8px; }
  /* Hero: the Day Xero medallion (kit xero badge, waiting form) on its cream coin, glowing; Xero cheers beside it, smaller. */
  /* Round 8: Xero stands on a soft paper ground line; the medallion sits on the same horizon (ground behind, coin, then Xero). */
  .hero { position: relative; height: 204px; margin: 26px var(--gutter) 0; }
  /* Round 10: no crest line; the ground lifts off the page with a soft cast shadow only. */
  .hero .ground { position: absolute; left: calc(-1 * var(--gutter)); top: 150px; width: 390px; height: 56px; z-index: 0; overflow: visible; filter: drop-shadow(0 -4px 10px var(--lift)); }
  .screen { --lift: rgba(120,44,20,.16); } [data-theme="dark"] .screen { --lift: rgba(0,0,0,.5); }
  .hero .coin { z-index: 1; }
  .hero .xc { z-index: 2; }
  .hero .coin { position: absolute; left: 87px; top: 4px; width: 172px; height: 172px; border-radius: 99px; background: #FFF8EE; display: grid; place-items: center;
    box-shadow: 0 0 0 10px rgba(255,217,102,.30), 0 0 46px 14px rgba(255,201,60,.42); }
  /* Dark: the halo is warm amber too (never grey). */
  [data-theme="dark"] .hero .coin { box-shadow: 0 0 0 3px rgba(255,214,140,.6), 0 0 26px 8px rgba(255,190,90,.5), 0 0 80px 22px rgba(255,160,60,.24); }
  .hero .coin .med { color: #F5B83D; }
  /* The medallion leads, centred; Xero is smaller, off to its lower left, cheering up at it. */
  .hero .xc { position: absolute; left: -10px; top: 92px; }
  .cap { padding: 22px var(--gutter) 0; text-align: center; display: grid; gap: 4px; }
  .cap .t-foot { color: var(--muted); }
  .wrap { padding: 26px var(--gutter) 0; }
  .wrap .card { padding: 20px 18px 22px; }
  .sh { display: flex; justify-content: space-between; align-items: baseline; }
  .stamps { display: flex; justify-content: space-between; margin: 16px -2px 0; color: var(--fg); }
  .stamps .pb { flex: none; display: block; }
  /* Locked stamps: the kit's locked medallion with a solid hairline instead of a dashed one (fewer dashes in the row). */
  .stamps .pb.lk circle[stroke-dasharray] { stroke-dasharray: none; stroke-opacity: .22; }
  /* Locked = quieter, never illegible: a faint ring, and a 14px numeral at .64 ink (over 3:1 on the card in both modes). */
  .stamps .pb.lk text { fill-opacity: .64; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:90.9%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>Your plan is <span class="mark">ready</span></h1>
    <p class="t-body muted" data-a style="--i:1">Your prep week starts today.</p>
  </div>

  <div class="hero">
    <div class="coin" data-pop style="--d:300ms"><div class="med" id="med"></div></div>
    <svg class="ground" id="ground" viewBox="0 0 390 56" aria-hidden="true"></svg>
    <div class="xc" data-settle style="--d:450ms"><div class="bob" id="hx"></div></div>
  </div>

  <div class="cap">
    <p class="t-title" data-a style="--i:3">Day Xero &middot; Fri, Nov 6</p>
    <p class="t-foot" data-a style="--i:4">Your Quit Day. This medallion is yours that day.</p>
  </div>

  <div class="wrap">
    <div class="card" data-a style="--i:5">
      <div class="sh"><p class="t-head">Prep stamps</p><span class="t-foot muted">One per session</span></div>
      <div class="stamps" id="stamps"></div>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:6">Start my prep week</button>
    <a class="link" data-a style="--i:7">See all plans</a>
  </div>
</div>
<script>
  document.querySelector('.icon-btn').innerHTML = DX.icon('back');
  document.getElementById('med').innerHTML = DX.badge({ kind: 'xero', n: '0', state: 'next', size: 140, bare: true, label: 'Day Xero' });
  document.getElementById('hx').innerHTML = DX.char('xero', { mood: 'cheer', size: 84 });
  let h = '';
  /* Locked stamps drop the kit's padlock (dim = locked) and centre their number. */
  const unlock = svg => svg.replace(/<path d="M43 62v-3a7 7 0 0114 0v3M40 62h20v12H40z"[^>]*\/?>(<\/path>)?/, '').replace(/<text x="50" y="50"/, '<text x="50" y="50" dominant-baseline="central"').replace(/font-size="30"/, 'font-size="34"');
  /* The ground line: a low paper hill that fades into the page (cast shadow, no lit edge). */
  const dk = DX.theme === 'dark', gc = dk ? '#212A41' : '#FFAE7A';
  document.getElementById('ground').innerHTML = `<defs><linearGradient id="gf" x1="0" y1="0" x2="0" y2="1"><stop offset=".1" stop-color="${gc}"/><stop offset=".55" style="stop-color: color-mix(in srgb, ${gc} 45%, var(--g))"/><stop offset="1" style="stop-color: var(--g)"/></linearGradient></defs>
    <path d="M0 22 C110 6 280 6 390 22 V56 H0 Z" fill="url(#gf)"/>`;
  for (let i = 1; i <= 7; i++) h += `<span class="pb ${i === 1 ? '' : 'lk'}" data-pop style="--i:0;--d:${900 + i * 90}ms">${unlock(DX.badge({ kind: 'prep', n: i, state: i === 1 ? 'next' : 'locked', size: 42, bare: true, label: 'Prep ' + i }))}</span>`;
  document.getElementById('stamps').innerHTML = h;
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '81.8%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '90.9%'));
</script>
</body></html>
