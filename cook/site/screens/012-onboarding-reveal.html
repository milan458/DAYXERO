<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>012 Plan reveal</title>
<meta name="motion" content="Progress eases 9/11 to 10/11; title arrives and the underline draws under 'ready'. Xero settles up into his soft disc (900ms) and cheers, bobbing. The stamp card arrives: the Prep 1 to 7 medallions pop left to right 90ms apart, all in their waiting form (dashed outline and numeral; Prep 1 at full strength in its up-next ring, the rest at half), then the Day Xero medallion fades in last in its waiting form (700ms, no spring). The button arrives after. Light haptic on the button.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .q { padding-top: 112px; gap: 8px; }
  .wrap { padding: 22px var(--gutter) 0; display: grid; gap: 12px; }
  .hero { position: relative; height: 210px; margin-top: 18px; display: grid; place-items: center; }
  .hero .disc { position: absolute; width: 196px; height: 196px; border-radius: 99px; background: color-mix(in srgb, #fff 34%, transparent); }
  [data-theme="dark"] .hero .disc { background: var(--card-2); box-shadow: inset 0 0 0 1px rgba(255,195,138,.2); }
  .hero .hx { position: relative; }
  .sh { display: flex; justify-content: space-between; align-items: baseline; }
  .stamps { display: flex; justify-content: space-between; margin-top: 16px; }
  .stamps .pb { flex: none; border-radius: 99px; }
  /* Waiting stamps: the kit's dashed outline + numeral. Prep 1 is up next: full strength with a ring; the rest wait quieter. */
  .stamps .pb { color: var(--fg); }
  .stamps .pb.next { box-shadow: 0 0 0 2.5px var(--card), 0 0 0 4.5px var(--fg); }
  .stamps .pb:not(.next) { opacity: .5; }
  .then .coin { width: 52px; height: 52px; border-radius: 99px; background: #FFF8EE; color: #1E1A3A; flex: none; }
  .stamps { margin-left: -4px; margin-right: -4px; }
  .stamps .badge { gap: 0; }
  .then { display: flex; align-items: center; gap: 14px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .then .t-cap { color: var(--muted); display: block; margin-top: 2px; }
  .lab { display: flex; justify-content: space-between; margin-top: 8px; }
  .lab .t-cap { color: var(--muted); }
  .tiers { display: grid; gap: 10px; }
  .tier { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; }
  .tier svg { width: 18px; height: 18px; margin-top: 1px; }
  .tier .t-foot b { font-weight: 700; }
  .tier .tk { color: var(--tick); }
  .tier .lk { color: var(--muted); }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:90.9%"></i></div></div>
    <div class="avatar" id="av"></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>Your plan is <span class="mark">ready</span></h1>
    <p class="t-body muted" data-a style="--i:1">Seven prep days, then your Quit Day.</p>
  </div>

  <div class="hero" aria-hidden="true">
    <div class="disc" data-fade style="--d:200ms"></div>
    <div class="hx" data-settle style="--d:300ms"><div class="bob" id="hx"></div></div>
  </div>

  <div class="wrap">
    <div class="card" data-a style="--i:3">
      <div class="sh"><p class="t-head">Seven prep stamps</p><span class="t-foot muted">One a day</span></div>
      <div class="stamps" id="stamps"></div>
      <div class="then"><span id="xb" class="coin" data-fade style="--d:1450ms"></span><div><p class="t-foot" style="font-weight:700">Then Day Xero, Fri, Nov 6</p><span class="t-foot muted">Earned on the day you quit</span></div></div>
    </div>

  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:5">Start my prep week</button>
    <a class="link" data-a style="--i:6">See all plans</a>
  </div>
</div>
<script>
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon, { w: 2.6 }));
  document.querySelector('.icon-btn').innerHTML = DX.icon('back');
  document.getElementById('hx').innerHTML = DX.char('xero', { mood: 'cheer', size: 168 });
  document.getElementById('av').innerHTML = DX.char('xero', { mood: 'hello', size: 40 });
  let h = '';
  for (let i = 1; i <= 7; i++) h += `<span class="pb ${i === 1 ? 'next' : ''}" data-pop style="--i:0;--d:${700 + i * 90}ms">${DX.badge({ kind: 'prep', n: i, state: 'next', size: 44, bare: true })}</span>`;
  document.getElementById('stamps').innerHTML = h;
  document.getElementById('xb').innerHTML = DX.badge({ kind: 'xero', n: '0', state: 'next', p: 0, size: 52, bare: true });
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '81.8%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '90.9%'));
</script>
</body></html>
