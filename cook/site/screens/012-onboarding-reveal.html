<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>012 Plan reveal</title>
<meta name="motion" content="Progress eases 9/11 to 10/11; title arrives and the underline draws under 'ready'. The Day Xero medallion is the hero: its cream coin, centred and glowing warm amber in both modes, pops in (700ms spring, from 300ms); a soft paper ground line fades in under it; Xero, smaller, settles onto that ground to its lower left (900ms, from 450ms) and cheers, bobbing. The caption arrives, then the stamp card: Prep 1 pops in its up-next form and Prep 2 to 7 pop in quieter (locked: faint ring, 14px numeral, no padlocks), 90ms apart (from 900ms). The button arrives after. Light haptic when the medallion lands and on the button.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  .q { padding-top: 112px; gap: 8px; }
  /* Paper grounds (like 000 Launch): a far layer behind the coin and a filled near layer the coin is seated in; Xero stands on it. */
  .screen { --far: #FFD3A6; --near: #FFAF7A; --lift: rgba(120,44,20,.15); }
  [data-theme="dark"] .screen { --far: #1F2950; --near: #161F38; --lift: rgba(0,0,0,.5); }
  /* The pair (Xero + medallion) is one centred group: Xero 100 box (about 80pt of character), 14pt off the coin rim. */
  .hero { position: relative; height: 196px; margin: 48px 0 0; }
  .hero .gr { position: absolute; left: 0; width: 390px; height: 640px; pointer-events: none; }
  .hero .gr.far { top: 104px; z-index: 0; filter: drop-shadow(0 -2px 4px var(--lift)); }
  .hero .gr.near { top: 140px; z-index: 2; filter: drop-shadow(0 -3px 6px var(--lift)); }
  .hero .coin { position: absolute; z-index: 1; left: 152px; top: 0; width: 180px; height: 180px; border-radius: 99px; background: #FFF8EE; display: grid; place-items: center;
    box-shadow: 0 0 0 9px rgba(255,248,238,.55), 0 0 0 20px rgba(255,248,238,.2), 0 0 46px 20px rgba(255,206,110,.55); }
  /* Light: the waiting ring is dark gold on the cream coin. */
  .hero .coin svg circle[stroke-dasharray] { stroke: #B9800F; }
  /* Dark: the halo is warm amber too (never grey), and the ring keeps the kit's gold. */
  [data-theme="dark"] .hero .coin { box-shadow: 0 0 0 3px rgba(255,214,140,.6), 0 0 26px 8px rgba(255,190,90,.5), 0 0 80px 22px rgba(255,160,60,.24); }
  [data-theme="dark"] .hero .coin svg circle[stroke-dasharray] { stroke: #F5B83D; }
  .hero .xc { position: absolute; z-index: 3; left: 47px; top: 77px; }
  .cap, .wrap { position: relative; z-index: 3; }
  .cap { padding: 18px var(--gutter) 0; text-align: center; display: grid; gap: 4px; }
  .cap .t-foot { color: var(--muted); }
  .wrap { padding: 24px var(--gutter) 0; }
  .wrap .card { padding: 20px 18px 22px; }
  [data-theme="dark"] .wrap .card { background: var(--card-2); }
  .sh { display: flex; justify-content: space-between; align-items: baseline; }
  .stamps { display: flex; justify-content: space-between; margin: 16px -2px 0; color: var(--fg); }
  .stamps .pb { flex: none; display: block; }
  /* Locked stamps: the kit's locked medallion with a solid hairline instead of a dashed one (fewer dashes in the row). */
  .stamps .pb.lk circle[stroke-dasharray] { stroke-dasharray: none; stroke-opacity: .22; }
  /* Locked = quieter, never illegible: a faint ring, and a 14px numeral at .64 ink (over 3:1 on the card in both modes). */
  .stamps .pb.lk text { fill-opacity: .64; }
  /* Up next (Prep 1): a solid apricot ring on a warm fill, never grey. */
  .stamps .pb.nx circle[r="48"] { display: none; }
  .stamps .pb.nx circle[fill-opacity] { fill: #FFE2C6; fill-opacity: 1; }
  .stamps .pb.nx circle[stroke-dasharray] { stroke-dasharray: none; stroke: #F2884A; }
  [data-theme="dark"] .stamps .pb.nx circle[fill-opacity] { fill: #FF9A5C; fill-opacity: .2; }
  [data-theme="dark"] .stamps .pb.nx circle[stroke-dasharray] { stroke: #FFA46B; }
  .stamps .pb.nx text { fill: var(--fg); }
  /* The CTA dock fades into the near ground, not the sky. */
  .dock { background: linear-gradient(to bottom, color-mix(in srgb, var(--near) 0%, transparent), var(--near) 34%); }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:90.9%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>Your plan is <span class="mark">ready</span></h1>
    <p class="t-body muted" data-a style="--i:1">Seven prep days, then your Quit Day.</p>
  </div>

  <div class="hero">
    <svg class="gr far" data-fade style="--d:150ms" viewBox="0 0 390 640" aria-hidden="true"><path d="M0 44 C60 30 110 34 150 46 C190 58 230 30 290 18 C330 10 365 12 390 18 V640 H0Z" fill="var(--far)"/></svg>
    <div class="coin" data-pop style="--d:300ms"><div class="med" id="med"></div></div>
    <svg class="gr near" data-fade style="--d:250ms" viewBox="0 0 390 640" aria-hidden="true"><path d="M0 40 C90 26 170 22 242 26 C300 29 350 34 390 38 V640 H0Z" fill="var(--near)"/></svg>
    <div class="xc" data-settle style="--d:450ms"><div class="bob" id="hx"></div></div>
  </div>

  <div class="cap">
    <p class="t-title" data-a style="--i:3">Day Xero &middot; Fri, Nov 6</p>
    <p class="t-foot" data-a style="--i:4">Your Quit Day. This medallion is yours that day.</p>
  </div>

  <div class="wrap">
    <div class="card" data-a style="--i:5">
      <div class="sh"><p class="t-head">Prep stamps</p><span class="t-foot muted">One a day</span></div>
      <div class="stamps" id="stamps"></div>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:6">Start my prep week</button>
    <a class="link" data-a style="--i:7">See all plans</a>
  </div>
</div>
<script>
  document.querySelector('.icon-btn').innerHTML = DX.icon('back');
  document.getElementById('med').innerHTML = DX.badge({ kind: 'xero', n: '0', state: 'next', size: 146, bare: true, label: 'Day Xero' });
  document.getElementById('hx').innerHTML = DX.char('xero', { mood: 'cheer', size: 100 });
  let h = '';
  /* Locked stamps drop the kit's padlock (dim = locked) and centre their number. */
  const unlock = svg => svg.replace(/<path d="M43 62v-3a7 7 0 0114 0v3M40 62h20v12H40z"[^>]*\/?>(<\/path>)?/, '').replace(/<text x="50" y="50"/, '<text x="50" y="50" dominant-baseline="central"').replace(/font-size="30"/, 'font-size="34"');
  for (let i = 1; i <= 7; i++) h += `<span class="pb ${i === 1 ? 'nx' : 'lk'}" data-pop style="--i:0;--d:${900 + i * 90}ms">${unlock(DX.badge({ kind: 'prep', n: i, state: i === 1 ? 'next' : 'locked', size: 42, bare: true, label: 'Prep ' + i }))}</span>`;
  document.getElementById('stamps').innerHTML = h;
  const bar = document.getElementById('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '81.8%'); void bar.offsetWidth; bar.style.transition = ''; });
  DX.after(250, () => bar.style.setProperty('--p', '90.9%'));
</script>
</body></html>
