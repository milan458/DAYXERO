<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>048 NRT products</title>
<meta name="motion" content="Title arrives, then the four product rows arrive top to bottom (600ms, 90ms stagger). At 1.2s the Patch row lands selected: outline and tick settle in over 520ms with a light selection haptic, and the '1 of 2 picked' line updates. Tapping a third row gently shakes the counter instead of selecting.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .opts { margin-top: 22px; display: grid; gap: 10px; }
  .opt .ico-tile { transition: background .3s var(--ease), color .3s var(--ease); }
  .opt.on .ico-tile { background: var(--sel); color: var(--sel-fg); }
  .opt .nm { font: 700 17px/1.2 var(--display); display: block; margin-bottom: 2px; }
  .play .opt.land { animation: land 520ms var(--settle) both; }
  @keyframes land { 0% { opacity: 1; transform: scale(.97); } 100% { opacity: 1; transform: none; } }
  .count { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
  .tip { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
  .tip svg { width: 20px; height: 20px; flex: none; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-ic="back"></button>
    <div class="grow"><div class="steps" aria-label="Step 1 of 4"><i class="on"></i><i></i><i></i><i></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <h1 class="t-title" data-a style="--i:0">What are you using?</h1>
      <p class="t-foot lead" data-a style="--i:1">Pick up to two. A patch plus a faster form works best.</p>
      <div class="opts">
        <button class="opt on" id="patch" data-a style="--i:2"><span class="ico-tile" data-p="patch"></span><span class="grow"><span class="nm">Patch</span><span class="t-foot">Worn all day, changed daily</span></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:3"><span class="ico-tile" data-p="gum"></span><span class="grow"><span class="nm">Gum</span><span class="t-foot">Chew, then park it in your cheek</span></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:4"><span class="ico-tile" data-p="lozenge"></span><span class="grow"><span class="nm">Lozenge</span><span class="t-foot">Dissolves slowly in your mouth</span></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:5"><span class="ico-tile" data-p="inhaler"></span><span class="grow"><span class="nm">Inhaler</span><span class="t-foot">Puff on a cartridge</span></span><span class="radio"></span></button>
      </div>
      <p class="t-foot count" data-a style="--i:6"><span id="picked">1 of 2 picked</span></p>
      <div class="card flat tip t-foot" data-a style="--i:7"><span data-ic="sparkle"></span><span>Add gum or a lozenge for sudden cravings. Patch plus one of these is the pairing that works best.</span></div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:8" data-go="049-nrt-schedule">Next</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  const PP = {
    patch: '<rect x="4" y="4" width="16" height="16" rx="4"/><rect x="8.5" y="8.5" width="7" height="7" rx="1.5"/>',
    gum: '<rect x="3.5" y="5" width="17" height="6" rx="3"/><rect x="3.5" y="13" width="17" height="6" rx="3"/>',
    lozenge: '<rect x="4" y="4" width="16" height="16" rx="8" transform="rotate(45 12 12) scale(1 1)"/><path d="M9.5 12h5"/>',
    inhaler: '<rect x="8" y="2.5" width="8" height="5" rx="1.5"/><rect x="6.5" y="7.5" width="11" height="14" rx="3"/><path d="M10 12h4"/>'
  };
  document.querySelectorAll('[data-p]').forEach(e => e.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${PP[e.dataset.p]}</svg>`);
  const patch = document.getElementById('patch'), picked = document.getElementById('picked');
  DX.after(0, () => { patch.classList.remove('on', 'land'); picked.textContent = '0 of 2 picked'; });
  DX.after(1200, () => { patch.classList.add('on', 'land'); picked.textContent = '1 of 2 picked'; });
</script>
</body></html>
