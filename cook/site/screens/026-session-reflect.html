<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>026 Session reflect</title>
<meta name="motion" content="The mint Try tag and title arrive (600ms, 90ms stagger). Your two picks settle in as rows one after another (900ms settle, 120ms apart) while the picked count runs 0 to 2, then the add-your-own field and the other options arrive. Tapping a chip swaps it into the list as a row (selection haptic) and the count bumps.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.f-apricot{--face:#FFC38A}.f-sky{--face:#9CCBFF}.f-mint{--face:#9FE3BC}.f-sun{--face:#FFD966}
.nav .side{width:44px;text-align:right;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body);justify-self:start}
.tag svg{width:16px;height:16px}
.wrap{position:absolute;top:110px;left:0;right:0;display:grid;align-content:start;gap:10px}
.list{flex:none}
.list .row{gap:12px}
.list .row .t-foot{font-size:15px;color:var(--fg)}
.x{width:34px;height:34px;border-radius:99px;background:var(--card-2);color:var(--fg);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1.5px var(--line)}
.x svg{width:16px;height:16px}
.lh{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px}
.field{display:flex;align-items:center;gap:10px}
.field svg{width:18px;height:18px;flex:none}
.list .row .dot{width:24px;height:24px;border-radius:99px;background:var(--done) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M7 12.5l3.2 3.2L17 9%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%272.6%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/100% no-repeat;flex:none}
.xr{display:flex;gap:6px;align-items:flex-end;margin-top:6px}
.xr #xr{flex:none;margin:-6px 0 -4px 2px}
.xr .bubble{max-width:none;flex:1;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:12px;font-size:15px;padding:12px 14px}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="Card 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="now"></i></div></div>
    <span class="side t-foot muted">5 of 5</span>
  </div>
  <div class="wrap pad">
    <span class="tag f-mint" data-a style="--i:0"><span id="t-ic"></span>Your stress plan · 6 min</span>
    <h1 class="t-title" data-a style="--i:1">What gets to you most?</h1>
    <p class="t-foot muted" data-a style="--i:2">Pick the two that come up most.</p>
    <div class="lh" data-a style="--i:3"><span class="t-foot" style="font-weight:600">Your two</span><span class="t-foot muted"><span data-count="2" data-from="0">2</span> of 2 picked</span></div>
    <div class="list">
      <div class="row" data-settle style="--i:2"><span class="dot"></span><span class="grow t-foot">Work piling up</span><button class="x" aria-label="Remove"></button></div>
      <div class="row" data-settle style="--i:3"><span class="dot"></span><span class="grow t-foot">Too much at once</span><button class="x" aria-label="Remove"></button></div>
    </div>
    <div class="field ph" data-a style="--i:7"><span id="plus"></span>Something else? Add your own</div>
    <div class="xr" data-a style="--i:10;margin-top:22px"><div id="xr" data-settle style="--i:10"></div><p class="bubble">Work is the big one for most people. Naming it starts your stress plan.</p></div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:11">Continue</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('t-ic').innerHTML = DX.icon('hand', {size:16});
document.getElementById('xr').innerHTML = DX.char('xero', {mood:'hello', size:76});
document.getElementById('plus').innerHTML = DX.icon('plus', {size:18});
document.querySelectorAll('.x').forEach(b => b.innerHTML = DX.icon('close', {size:14, w:2.6}));
</script>
</body></html>
