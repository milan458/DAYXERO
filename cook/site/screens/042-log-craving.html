<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>042 Log a craving</title>
<meta name="motion" content="Sections arrive with a 90ms stagger; the strength fill slides to 5 (700ms settle) and the knob lands with a light haptic. At 1.6s Save presses, turns into its done state 'Saved' with a tick (success haptic), and a toast slides down from the top (450ms settle) reading 'Craving logged. 4 waves today.' with the 4 bumping and a +1 floating up. The toast leaves after 2.4s and the form closes.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .sec { margin-top: 18px; }
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .sec-h .t-foot { color: var(--muted); }
  .strength { padding: 14px 16px 16px; }
  .strength .big { display: flex; align-items: baseline; gap: 4px; }
  .strength .big .num { font-size: 34px; line-height: 1; }
  .slider { position: relative; height: 32px; margin-top: 8px; }
  .slider .tr { position: absolute; left: 0; right: 0; top: 13px; height: 6px; border-radius: 99px; background: var(--track); }
  .slider .fi { position: absolute; left: 0; top: 13px; height: 6px; border-radius: 99px; background: var(--fg); width: calc(44% + 2px); transition: width 700ms var(--settle); }
  .slider .kn { position: absolute; top: 2px; left: 44%; width: 28px; height: 28px; margin-left: -14px; border-radius: 99px; background: #fff; box-shadow: 0 2px 8px rgba(14,11,43,.25), inset 0 0 0 1px rgba(14,11,43,.08); transition: left 700ms var(--settle); }
  .scale { display: flex; justify-content: space-between; color: var(--muted); }
  .chips .chip { min-height: 40px; padding: 0 14px; font-size: 14.5px; }
  .faces { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 8px; }
  .chip.face { flex-direction: column; justify-content: center; gap: 4px; min-height: 66px; padding: 0; font: 600 12.5px/1 var(--body); }
  .chip.face.on::before { display: none; }
  .chip.face svg { width: 26px; height: 26px; }
  .toast { transform: translateY(-160%); }
  .toast.show { transform: none; transition: transform 450ms var(--settle); }
  .toast .tk { width: 30px; height: 30px; border-radius: 99px; background: var(--done-on-dark); color: #0B2A1C; display: grid; place-items: center; flex: none; }
  .toast .tk svg { width: 18px; height: 18px; }
  .toast .grow { flex: 1; }
  .toast .n { display: inline-block; }
  .toast .plus { opacity: 0; position: absolute; right: 22px; top: 10px; font: 800 15px/1 var(--display); color: var(--done-on-dark); }
  [data-theme="dark"] .toast .tk { background: var(--done); color: #fff; }
  [data-theme="dark"] .toast .plus { color: var(--done); }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close" data-go="041-log-menu"></button>
    <div class="grow title">A craving</div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll" style="padding-top:104px">
    <div class="pad">
      <p class="t-foot muted" data-a style="--i:0">Today at 9:41 AM</p>
      <div class="card strength" data-a style="--i:1;margin-top:8px">
        <div class="sec-h" style="margin-bottom:4px"><h2 class="t-head">How strong is it?</h2><span class="t-foot">Moderate</span></div>
        <div class="big"><span class="num" data-count="5">5</span><span class="t-foot muted">/ 10</span></div>
        <div class="slider" aria-label="Strength 5 of 10"><span class="tr"></span><span class="fi" id="fi"></span><span class="kn" id="kn"></span></div>
        <div class="scale t-cap"><span>Mild</span><span>Intense</span></div>
      </div>

      <div class="sec" data-a style="--i:2">
        <div class="sec-h"><h2 class="t-head">What set it off?</h2></div>
        <div class="chips">
          <button class="chip on">Coffee</button><button class="chip">Stress</button><button class="chip">Waking up</button><button class="chip">After meals</button>
          <button class="chip">Boredom</button><button class="chip">Driving</button><button class="chip">Friends</button><button class="chip">Something else</button>
        </div>
      </div>

      <div class="sec" data-a style="--i:3">
        <div class="sec-h"><h2 class="t-head">Mood</h2><span class="t-foot">Optional</span></div>
        <div class="faces" id="faces"></div>
      </div>

      <div class="sec" data-a style="--i:4">
        <div class="sec-h"><h2 class="t-head">Where?</h2><span class="t-foot">Optional</span></div>
        <div class="chips"><button class="chip on">Home</button><button class="chip">Work</button><button class="chip">Out</button><button class="chip">In the car</button></div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" id="save" data-a style="--i:6"><span class="lbl" id="lbl">Save</span></button>
    <button class="link" data-a style="--i:7" data-go="019-sos">Ride it out with SOS instead</button>
  </div>
  <div class="toast" id="toast" role="status">
    <span class="tk" id="tk"></span>
    <span class="grow">Craving logged. <span class="n" id="n">4</span> waves today.</span>
    <span class="plus" id="plus">+1</span>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.insertAdjacentHTML('afterbegin', DX.icon(e.dataset.ic, { size: 20 })));
  document.getElementById('tk').innerHTML = DX.icon('check', { size: 18, w: 3.2 });
  const mouths = ['M8 17c2-2.5 6-2.5 8 0', 'M8.5 16h7', 'M8 15.5c2 1.2 6 1.2 8 0', 'M7.5 14.5c2 2.6 7 2.6 9 0', 'M7 14c2 3.6 8 3.6 10 0'];
  const names = ['Low', 'Meh', 'Okay', 'Good', 'Great'];
  document.getElementById('faces').innerHTML = names.map((n, i) => `<button class="chip face ${i === 1 ? 'on' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><circle cx="9" cy="10" r="1.1" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r="1.1" fill="currentColor" stroke="none"/><path d="${mouths[i]}"/></svg>${n}</button>`).join('');
  const fi = document.getElementById('fi'), kn = document.getElementById('kn'), save = document.getElementById('save'), lbl = document.getElementById('lbl'), toast = document.getElementById('toast'), nEl = document.getElementById('n'), plus = document.getElementById('plus');
  const done = () => { save.classList.add('done-state'); lbl.innerHTML = DX.icon('check', { size: 20, w: 3 }) + 'Saved'; toast.classList.add('show'); };
  DX.after(0, () => { fi.style.transition = kn.style.transition = 'none'; fi.style.width = '0%'; kn.style.left = '0%'; save.classList.remove('done-state'); lbl.textContent = 'Save'; toast.classList.remove('show'); plus.classList.remove('float-up'); nEl.classList.remove('bump'); });
  DX.after(350, () => { fi.style.transition = kn.style.transition = ''; fi.style.width = ''; kn.style.left = ''; });
  DX.after(1450, () => save.classList.add('press'));
  DX.after(1600, () => { save.classList.remove('press'); done(); });
  DX.after(1900, () => { nEl.classList.add('bump'); plus.classList.add('float-up'); });
  DX.onStill(done);
</script>
</body></html>
