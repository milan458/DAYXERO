<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>042 Log a craving</title>
<meta name="motion" content="Jelli settles in beside the title (900ms) and stays calm. Sections arrive with a 90ms stagger; the strength fill (Jelli's pink) slides to 5 (700ms settle) along its ten step ticks and the apricot-ringed knob lands on the fifth with a light haptic (a selection tick haptic per step when dragged). The mood row uses four little moons with the evening check-in's expressions (craters, a crescent shadow; navy Rough with tired lids, cream Okay, pale apricot Good, apricot Proud); the chosen one tilts up a touch (400ms settle). Save rests until tapped: it presses, turns into its done state with a tick (success haptic) and the label becomes 'Saved · 4 today' with the 4 bumping (no toast); after 1.2s the form closes.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .hdr { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
  .hdr .jl { width: 64px; height: 64px; flex: none; }
  .hdr .tt { display: grid; gap: 2px; }
  .sec { margin-top: 24px; }
  .sec.first { margin-top: 18px; }
  .note { display: flex; align-items: center; gap: 10px; }
  .note svg { width: 18px; height: 18px; flex: none; }
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .sec-h .t-foot { color: var(--muted); }
  .val { font: 600 15px/1 var(--body); color: var(--muted); }
  .val .num { font-size: 26px; color: var(--fg); margin-right: 4px; }
  .slider { position: relative; height: 36px; margin-top: -2px; }
  .slider .ticks { position: absolute; left: 0; right: 0; top: 25px; height: 6px; }
  .slider .ticks i { position: absolute; top: 0; width: 2px; height: 7px; margin-left: -1px; border-radius: 2px; background: var(--muted); opacity: .55; }
  .slider .tr { position: absolute; left: 0; right: 0; top: 13px; height: 6px; border-radius: 99px; background: var(--track); }
  /* the fill takes Jelli's pink; the knob is the branded one: a white face in an apricot ring */
  .slider { --jelli: #E8607E; }
  [data-theme="dark"] .slider { --jelli: #FF8FA3; }
  .slider .fi { position: absolute; left: 0; top: 13px; height: 6px; border-radius: 99px; background: var(--jelli); width: calc(44% + 2px); transition: width 700ms var(--settle); }
  .slider .kn { position: absolute; top: 2px; left: 44%; width: 28px; height: 28px; margin-left: -14px; border-radius: 99px; background: #fff; box-shadow: 0 2px 8px rgba(14,11,43,.25), inset 0 0 0 5px #FFA766; transition: left 700ms var(--settle); }
  .scale { display: flex; justify-content: space-between; color: var(--muted); font: 600 14px/1.3 var(--body); }
  .chips .chip { min-height: 42px; padding: 0 15px; font-size: 15px; }
  .chips.trig { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .chips.trig .chip { justify-content: center; padding: 0 8px; min-height: 46px; }
  .sosl { margin-top: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .sosl a { color: var(--fg); font-weight: 700; text-decoration: underline; text-decoration-color: currentColor; text-decoration-thickness: 1.5px; text-underline-offset: 4px; white-space: nowrap; }
  /* the note field is a card field with a hairline, not a beige well */
  .field.note { background: var(--card); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--fg) 16%, transparent); }
  /* the same little moons as the evening check-in (054) */
  .faces { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
  .chip.face { height: 86px; flex-direction: column; justify-content: center; gap: 6px; padding: 0; font-size: 15px; border-radius: 20px; }
  .chip.face svg { width: 42px; height: 42px; transition: transform .4s var(--settle); }
  .chip.face.on svg { transform: scale(1.08) rotate(-4deg); }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close" data-go="041-log-menu"></button>
  </div>
  <div class="scroll" style="padding-top:104px">
    <div class="pad">
      <div class="hdr">
        <span class="jl" id="jl" data-settle style="--d:120ms"></span>
        <div class="tt"><h1 class="t-title" data-a style="--i:0">A craving</h1><p class="t-foot muted" data-a style="--i:1">Today, 9:41 AM</p></div>
      </div>

      <div class="sec first" data-a style="--i:2">
        <div class="sec-h"><h2 class="t-head">How strong is it?</h2><span class="val"><span class="num" data-count="5">5</span>of 10 · Moderate</span></div>
        <div class="slider" aria-label="Strength 5 of 10, moderate"><span class="tr"></span><span class="fi" id="fi"></span><span class="ticks" id="ticks"></span><span class="kn" id="kn"></span></div>
        <div class="scale"><span>Mild</span><span>Intense</span></div>
        <p class="t-foot sosl">Too strong to sit with? <a data-go="019-sos">Ride it out with SOS</a></p>
      </div>

      <div class="sec" data-a style="--i:3">
        <div class="sec-h"><h2 class="t-head">What set it off?</h2></div>
        <div class="chips trig">
          <button class="chip on">Coffee</button><button class="chip">Stress</button><button class="chip">Waking up</button>
          <button class="chip">After meals</button><button class="chip">Driving</button><button class="chip">Other</button>
        </div>
      </div>

      <div class="sec" data-a style="--i:4">
        <div class="sec-h"><h2 class="t-head">Mood</h2><span class="t-foot">Optional</span></div>
        <div class="faces" id="faces"></div>
      </div>

      <div class="sec" data-a style="--i:5">
        <div class="field ph note"><span id="noteic"></span>Add a note, if it helps</div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" id="save" data-a style="--i:6"><span class="lbl" id="lbl">Save</span></button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.insertAdjacentHTML('afterbegin', DX.icon(e.dataset.ic, { size: 20 })));
  /* Four little moons with the evening check-in's (054) expressions: craters and a crescent shadow on each, in a calm
     non-emoji palette: a navy Rough with cream features and tired lids, a cream Okay, a pale apricot Good, an apricot Proud. */
  const INK = '#0F1B33', CR = '#F6EFE2', CH = '<circle cx="12.5" cy="29" r="3.2" fill="#FF8C6B" opacity=".55"/><circle cx="35.5" cy="29" r="3.2" fill="#FF8C6B" opacity=".55"/>';
  const F = {
    Rough: { c: '#4C5C88', sh: '#26335A', cr: '#33416C', d: `<path d="M15 22.6a3 3 0 0 0 6 .4zM27 23a3 3 0 0 0 6-.4z" fill="${CR}"/><path d="M13.6 23.6l8-1.6M26.4 22l8 1.6" stroke="${CR}" stroke-width="2.4" stroke-linecap="round"/><path d="M15.2 29q2.5 1.3 5 0M27.8 29q2.5 1.3 5 0" fill="none" stroke="${CR}" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="24" cy="34.6" rx="2.4" ry="2" fill="${CR}"/>` },
    Okay: { c: '#EFE5CF', sh: '#BFAE8A', cr: '#D2C3A2', d: `<circle cx="18" cy="22.5" r="2.3" fill="${INK}"/><circle cx="30" cy="22.5" r="2.3" fill="${INK}"/><path d="M18 32h12" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>` },
    Good: { c: '#FFD8B0', sh: '#E9A673', cr: '#F2BF92', d: `${CH}<circle cx="18" cy="22" r="2.4" fill="${INK}"/><circle cx="30" cy="22" r="2.4" fill="${INK}"/><path d="M16.5 29c3 5 12 5 15 0" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>` },
    Proud: { c: '#FFB27A', sh: '#DC7E4E', cr: '#EE9A66', d: `${CH}<path d="M14 23c1.8-3 5.2-3 7 0M27 23c1.8-3 5.2-3 7 0" fill="none" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/><path d="M15.5 28.5h17c0 5.5-3.8 8.5-8.5 8.5s-8.5-3-8.5-8.5z" fill="${INK}"/><path d="M19.5 33.5c2.6 1.6 6.4 1.6 9 0" fill="none" stroke="#FF8C6B" stroke-width="2.2" stroke-linecap="round"/><path d="M41 4l1.2 2.6 2.6 1.2-2.6 1.2L41 11.6l-1.2-2.6-2.6-1.2 2.6-1.2z" fill="#F5B83D"/>` }
  };
  const moon = f => `<svg viewBox="0 0 48 48" aria-hidden="true" style="overflow:visible"><circle cx="24" cy="25" r="21" fill="${f.c}"/>
    <path d="M24 4 A21 21 0 0 1 24 46 A13 21 0 0 0 24 4Z" fill="${f.sh}" opacity=".5"/>
    <g fill="${f.cr}"><circle cx="13" cy="13.5" r="2.6"/><circle cx="34.5" cy="12" r="1.9"/><circle cx="37" cy="37.5" r="2.3"/><circle cx="9.5" cy="34" r="1.4"/></g>
    <path d="M8 18a17 17 0 0 1 10-11" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.4" stroke-linecap="round"/>${f.d}</svg>`;
  document.getElementById('faces').innerHTML = Object.keys(F).map((n, i) => `<button class="chip face ${i === 1 ? 'on' : ''}">${moon(F[n])}${n}</button>`).join('');
  document.getElementById('jl').innerHTML = DX.char('jelli', { mood: 'calm', size: 64 });
  document.getElementById('ticks').innerHTML = Array.from({ length: 10 }, (_, i) => `<i style="left:${(i / 9 * 100).toFixed(2)}%"></i>`).join('');
  document.getElementById('noteic').innerHTML = DX.icon('note', { size: 18 });
  const fi = document.getElementById('fi'), kn = document.getElementById('kn'), save = document.getElementById('save'), lbl = document.getElementById('lbl');
  /* tapping Save: press, done state, the count bumps; the form then closes */
  save.addEventListener('click', () => { save.classList.add('done-state'); lbl.innerHTML = DX.icon('check', { size: 20, w: 3 }) + '<span>Saved · <b class="bump" style="display:inline-block;font-weight:inherit">4</b> today</span>'; });
  DX.after(0, () => { fi.style.transition = kn.style.transition = 'none'; fi.style.width = '0%'; kn.style.left = '0%'; save.classList.remove('done-state'); lbl.textContent = 'Save'; });
  DX.after(350, () => { fi.style.transition = kn.style.transition = ''; fi.style.width = ''; kn.style.left = ''; });
</script>
</body></html>
