<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>032 Session complete</title>
<meta name="motion" content="Sun rays fade in and start a slow turn; the large Prep 4 stamp lands (620ms spring) with a success haptic and a shine pass at 900ms. Xero settles in cheering and bumps. Title and line arrive, then the stamp row lights up in sequence: Prep 1 to 3 pop (110ms apart), Prep 4 stamps last with its own shine and a light haptic while the count ticks 3 to 4 of 7; 5 to 7 stay locked and Day Xero stays in its waiting form (earned on the day). The button arrives last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.hero{position:absolute;top:110px;left:0;right:0;height:260px}
.burst{position:absolute;left:50%;top:0;width:260px;height:260px;margin-left:-130px}
.medal{position:absolute;left:50%;top:46px;width:168px;height:168px;margin-left:-84px;border-radius:50%}
.xero{position:absolute;left:280px;top:150px}
.mid{position:absolute;top:372px;left:0;right:0;text-align:center;display:grid;gap:8px}
.shelf2{position:absolute;top:462px;left:var(--gutter);right:var(--gutter)}
.srow{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;row-gap:12px}
.srow .rays{display:none}
.srow .sep{width:1px;height:30px;background:var(--line)}
.srow .waiting{opacity:.55}
.slab{display:flex;justify-content:space-between;margin-top:12px}
.st5{border-radius:50%}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav"><button class="icon-btn" aria-label="Close" id="close"></button></div>
  <div class="hero">
    <svg class="burst" viewBox="0 0 260 260" data-fade style="--d:200ms"><g class="rays" id="rays"></g></svg>
    <div class="medal" data-stamp style="--d:300ms"><div class="shine" style="--d:1100ms;border-radius:50%" id="medal"></div></div>
    <div class="xero" data-settle style="--i:4"><div class="bump" style="--d:1500ms" id="xero"></div></div>
  </div>
  <div class="mid pad">
    <h1 class="t-large" data-a style="--i:6">Prep 4 <span class="mark">done</span>.</h1>
    <p class="t-body muted" data-a style="--i:7">3 to go before Quit Day.</p>
  </div>
  <div class="shelf2 card" data-a style="--i:8">
    <div class="srow" id="srow"></div>
    <div class="slab t-cap muted" style="justify-content:center"><span><span data-count="4" data-from="3" data-delay="2150" data-dur="400">4</span> of 7 stamped · Day Xero on Fri, Nov 6</span></div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:12">See you tomorrow</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('rays').innerHTML = Array.from({length:24}, (_, i) =>
  `<path d="${i % 2 ? 'M130 22 L132.5 52 L127.5 52Z' : 'M130 6 L134 56 L126 56Z'}" fill="#FFD966" fill-opacity="${i % 2 ? .5 : .85}" transform="rotate(${i * 15} 130 130)"/>`).join('');
document.getElementById('medal').innerHTML = DX.badge({kind:'prep', n:4, size:168, bare:true});
document.getElementById('xero').innerHTML = DX.char('xero', {mood:'cheer', size:96});
let h = '';
for (let n = 1; n <= 7; n++) {
  if (n <= 3) h += `<span data-pop style="--d:1500ms;--i:${n}">${DX.badge({kind:'prep', n, size:50, bare:true})}</span>`;
  else if (n === 4) h += `<span data-stamp style="--d:2150ms;--i:0"><span class="st5 shine" style="--d:2650ms;display:block">${DX.badge({kind:'prep', n, size:50, bare:true})}</span></span>`;
  else h += `<span>${DX.badge({kind:'prep', n, size:50, state:'locked', bare:true})}</span>`;
}
h += `<span>${DX.badge({kind:'xero', n:'0', size:50, state:'next', p:1, bare:true})}</span>`;
document.getElementById('srow').innerHTML = h;
</script>
</body></html>
