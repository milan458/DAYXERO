<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>032 Session complete</title>
<meta name="motion" content="Sun rays fade in behind (200ms), the Prep 4 medal stamps in (spring, 300ms) and shines; Xero settles onto the medal lower-right, sharing one ground shadow, and bumps at 1500ms. Title and line arrive; the shelf arrives, stamps 1 to 3 pop, then stamp 4 lands with a medium haptic and the count ticks 3 to 4.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.hero{position:absolute;top:112px;left:0;right:0;height:250px}
/* medal centred; Xero overlaps its lower-right and both stand on one ground shadow */
.burst{position:absolute;left:75px;top:0;width:240px;height:240px}
.medal{position:absolute;left:115px;top:40px;width:160px;height:160px;border-radius:50%}
.gshadow{position:absolute;left:108px;top:206px;width:232px;height:26px;border-radius:50%;background:radial-gradient(closest-side,rgba(30,26,58,.20),rgba(30,26,58,0))}
[data-theme="dark"] .gshadow{background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,0))}
.lk svg circle{stroke-opacity:.62}.lk svg text{fill-opacity:.78}.lk svg path{stroke-opacity:.72}
.xero{position:absolute;left:236px;top:118px}
.mid{position:absolute;top:378px;left:0;right:0;text-align:center;display:grid;gap:8px}
.shelf2{position:absolute;top:478px;left:var(--gutter);right:var(--gutter);padding:20px 16px 18px}
.srow{display:grid;grid-template-columns:repeat(4,1fr);justify-items:center;row-gap:14px}
.srow .rays{display:none}
.srow .sep{width:1px;height:30px;background:var(--line)}
.srow .waiting{opacity:.55}
.slab{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.st5{border-radius:50%}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav"><button class="icon-btn" aria-label="Close" id="close"></button></div>
  <div class="hero">
    <div class="gshadow" data-fade style="--d:300ms"></div>
    <svg class="burst" viewBox="0 0 260 260" data-fade style="--d:200ms"><g class="rays" id="rays"></g></svg>
    <div class="medal" data-stamp style="--d:300ms"><div class="shine" style="--d:1100ms;border-radius:50%" id="medal"></div></div>
    <div class="xero" data-settle style="--i:4"><div class="bump" style="--d:1500ms" id="xero"></div></div>
  </div>
  <div class="mid pad">
    <h1 class="t-large" data-a style="--i:6">Prep 4 <span class="mark">done</span>.</h1>
    <p class="t-body muted" data-a style="--i:7">3 to go before Quit Day.</p>
  </div>
  <div class="shelf2 card" data-a style="--i:8">
    <div class="srow" id="srow"></div>
    <div class="slab t-cap muted" style="justify-content:center"><span><span data-count="4" data-from="3" data-delay="2150" data-dur="400">4</span> of 7 stamped · Day Xero on Fri, Nov 6</span></div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:12">See you tomorrow</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('rays').innerHTML = Array.from({length:24}, (_, i) =>
  `<path d="${i % 2 ? 'M130 26 L132.5 54 L127.5 54Z' : 'M130 16 L134 58 L126 58Z'}" fill="#F5B83D" fill-opacity="${i % 2 ? .55 : .9}" transform="rotate(${i * 15} 130 130)"/>`).join('');
document.getElementById('medal').innerHTML = DX.badge({kind:'prep', n:4, size:160, bare:true});
document.getElementById('xero').innerHTML = DX.char('xero', {mood:'cheer', size:100});
let h = '';
for (let n = 1; n <= 7; n++) {
  if (n <= 3) h += `<span data-pop style="--d:1500ms;--i:${n}">${DX.badge({kind:'prep', n, size:54, bare:true})}</span>`;
  else if (n === 4) h += `<span data-stamp style="--d:2150ms;--i:0"><span class="st5 shine" style="--d:2650ms;display:block">${DX.badge({kind:'prep', n, size:54, bare:true})}</span></span>`;
  else h += `<span class="lk">${DX.badge({kind:'prep', n, size:54, state:'locked', bare:true})}</span>`;
}
h += `<span>${DX.badge({kind:'xero', n:'0', size:54, state:'next', bare:true})}</span>`;
document.getElementById('srow').innerHTML = h;
</script>
</body></html>
