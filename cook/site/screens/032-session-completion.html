<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>032 Session complete</title>
<meta name="motion" content="The same paper sun as the 025 card back, scaled to the medal: twelve equal rounded rays standing clear of the rim, the two behind Xero left out so the ring stays symmetric, fans out behind (each ray grows from the centre, 500ms settle, 30ms apart, from 300ms) and then holds still, so the gap stays behind Xero; the Prep 4 medal stamps in (spring, 300ms) and shines; Xero settles at its lower right, at least 12px clear of the medal, on his own ground shadow, cheering, and bumps at 1500ms. Title (underline under done) and the line (The stress loop · 5 cards · 28 min) arrive; the shelf arrives, stamps 1 to 3 pop in left to right (110ms apart), then stamp 4 lands with a stamp and a shine (medium haptic) while the count ticks 3 to 4; the waiting stamps 5 to 7 and the Day Xero medal at the end of the shelf fade in last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.hero{position:absolute;top:148px;left:0;right:0;height:320px}
/* one sun system with the 025 card back: a disc and twelve equal rounded rays, inner 1.26r, outer 1.65r, stroke .17r
   (here r is the medal's 86px rim); a warm sun tint in light, one clean gold in dark: solid fills, no fade, no smear */
.burst{position:absolute;left:35px;top:0;width:320px;height:320px;overflow:visible}
.burst .ra{stroke:#FFD771}
[data-theme="dark"] .burst .ra{stroke:#E8B24A}
.ray{transform-box:view-box;transform-origin:160px 160px}
.play .ray{animation:grow 500ms var(--settle) both;animation-delay:calc(300ms + var(--r) * 30ms)}
@keyframes grow{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.medal{position:absolute;left:105px;top:70px;width:180px;height:180px;border-radius:50%}
/* Xero stands at the medal's lower right, in the gap the two missing rays leave, at least 12px clear of the rim */
.xero{position:absolute;left:252px;top:203px}
/* no stray sparkle marks around Xero on this screen */
.xero svg > g[stroke]{display:none}
/* one rhythm: sun, 24, title, 8, line, 40, shelf, 16, caption */
.mid{position:absolute;top:482px;left:0;right:0;text-align:center;display:grid;gap:8px}
/* the shelf: one row of seven prep stamps (the kit family, as on the Program path), then the Day Xero medal waiting at the end */
.shelf{position:absolute;top:588px;left:var(--gutter);right:var(--gutter);display:block;overflow:visible}
.srow{display:flex;align-items:center;gap:5px;padding-bottom:12px;border-bottom:1.5px solid var(--line)}
.srow > span{display:block;flex:none}
.srow .cap{margin-left:auto}
/* the shelf caption: 14px, muted (5.9:1 light, 9:1 dark) */
.slab{margin-top:16px;text-align:center;font-size:14px}
.st4{border-radius:50%}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav"><button class="icon-btn" aria-label="Close" id="close"></button></div>
  <div class="hero">
    <svg class="burst" viewBox="0 0 320 320" aria-hidden="true" id="burst"></svg>
    <div class="medal" data-stamp style="--d:300ms"><div class="shine" style="--d:1100ms;border-radius:50%" id="medal"></div></div>
    <div class="xero" data-settle style="--i:4"><div class="bump" style="--d:1500ms" id="xero"></div></div>
  </div>
  <div class="mid pad">
    <h1 class="t-large" data-a style="--i:6">Prep 4 <span class="mark">done</span>.</h1>
    <p class="t-body muted" data-a style="--i:7">The stress loop · 5 cards · 28 min</p>
  </div>
  <div class="shelf" data-a style="--i:8">
    <div class="srow" id="srow"></div>
    <p class="slab t-cap muted"><span data-count="4" data-from="3" data-delay="2150" data-dur="400">4</span> of 7 stamped · Day Xero on Fri, Nov 6</p>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:12">See you tomorrow</button></div>
</div>
<script>
const dark = DX.theme === 'dark';
document.getElementById('close').innerHTML = DX.icon('close');
/* the 025 sun, scaled to the medal rim (r 86.4): twelve equal rounded rays, 30 degrees apart, from the top;
   only the two behind Xero (4 and 5 o'clock) are left out, so the ring stays symmetric and opens just for him */
const cx = 160, cy = 160, R = 86.4, r0 = R * 58 / 46, r1 = R * 76 / 46, sw = R * 8 / 46;
const ray = (i) => { const a = (i * 30 - 90) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return `<path class="ray ra" style="--r:${i}" d="M${(cx + r0 * c).toFixed(1)} ${(cy + r0 * s).toFixed(1)} L${(cx + r1 * c).toFixed(1)} ${(cy + r1 * s).toFixed(1)}"/>`; };
document.getElementById('burst').innerHTML = `<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="1" stdDeviation=".8" flood-color="#1A0B2E" flood-opacity="${dark ? .3 : .08}"/></filter></defs>
  <g class="sunrays" filter="url(#lift)" fill="none" stroke-width="${sw.toFixed(1)}" stroke-linecap="round">${Array.from({length:12}, (_, i) => i === 4 || i === 5 ? '' : ray(i)).join('')}</g>`;
/* the kit Prep 4 medal, as it is (scalloped rim, the little sunrise behind the numeral) */
document.getElementById('medal').innerHTML = DX.badge({kind:'prep', n:4, size:180, bare:true, label:'Prep 4'});
document.getElementById('xero').innerHTML = DX.char('xero', {mood:'cheer', size:104});
let h = '';
for (let n = 1; n <= 7; n++) {
  if (n <= 3) h += `<span data-pop style="--d:1500ms;--i:${n}">${DX.badge({kind:'prep', n, size:36, bare:true, label:'Prep ' + n})}</span>`;
  else if (n === 4) h += `<span data-stamp style="--d:2150ms;--i:0"><span class="st4 shine" style="--d:2650ms;display:block">${DX.badge({kind:'prep', n, size:36, bare:true, label:'Prep 4'})}</span></span>`;
  else h += `<span data-fade style="--d:2400ms">${DX.badge({kind:'prep', n, state:'next', size:36, bare:true, label:'Prep ' + n})}</span>`;
}
h += `<span class="cap" data-fade style="--d:2500ms">${DX.badge({kind:'xero', size:54, state:'next', bare:true, label:'Day Xero'})}</span>`;
document.getElementById('srow').innerHTML = h;
</script>
</body></html>
