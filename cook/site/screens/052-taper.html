<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>052 Pouch taper</title>
<meta name="motion" content="The conflict is the title: 'Your taper needs 3 weeks' arrives (soft warning haptic), then the lead (Quit Day is in 4 days; today is Mon, Nov 2, Quit Day Fri, Nov 6). The strength chart arrives with its legend (Quit Day, Runs past Quit Day): the 6, 3 and 1.5 mg bars, one apricot with a deeper edge (the heights carry the mg), grow from the baseline in turn (900ms settle, 150ms apart); the 6 mg bar is solid up to Quit Day and striped after it, the 3 and 1.5 mg bars are striped (they run past Quit Day), and at 900ms the coral Quit Day dot pops onto the axis where the 6 mg bar splits, with a coral hairline up through the split and its 'Fri 6' tag above the bar. Axis labels are the week start dates. Step rows (swatch, mg, dates, chevron: tap to edit) settle in (120ms stagger). The coral target ring on the 0 mg column (Mon, Nov 23) fades in at 1s. The X is the only way out at the top (no Skip). The primary (Move Quit Day to Mon, Nov 23) slides the coral dot and its tag along the axis into the 0 mg column's target ring over 700ms (the tag reads 'Mon 23'), the stripes fill in solid and the dates update in place; 'Save my taper as is' is the quiet secondary.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Bricolage's long Q tail sweeps under the 'u' and reads as the brand underline: the body face's Q here */
  .qg { font-family: var(--body); font-weight: 700; }
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .chart { margin-top: 22px; padding: 18px 18px 16px; }
  /* key: the coral dot is Quit Day on the axis; stripes are the part of the taper that runs past it */
  .key { display: flex; gap: 18px; align-items: center; color: var(--muted); font: 500 14px/1.2 var(--body); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key .kq { width: 11px; height: 11px; border-radius: 99px; background: var(--mark); flex: none; }
  .key .kh { width: 18px; height: 12px; border-radius: 3px; flex: none; }
  .bars { position: relative; margin-top: 38px; height: 112px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-items: end; border-bottom: 2px solid var(--line); }
  /* one apricot for every bar (the heights carry the mg); light adds a deeper edge (3.5:1 on the card) so the short 1.5 mg bar reads */
  .chart, .steps-list { --c: #FFB27A; --edge: #D9692A; }
  [data-theme="dark"] .chart, [data-theme="dark"] .steps-list { --edge: #FFB27A; }
  .bar { height: var(--h); border-radius: 10px 10px 3px 3px; background: var(--c); transform-origin: bottom; display: flex; }
  .bar:not(.split), .bar.split .pre { box-shadow: inset 0 0 0 1.5px var(--edge); }
  /* runs past Quit Day: the bar's own colour in stripes, inside a fine outline */
  .hatch, .key .kh { background: repeating-linear-gradient(135deg, #F59A5C 0 3px, transparent 3px 6.5px), #FFF1E6; box-shadow: inset 0 0 0 1.5px var(--edge) !important; }
  /* dark: lighter stripes (pale peach gaps, so no heavy navy bands) */
  [data-theme="dark"] .hatch, [data-theme="dark"] .key .kh { background: repeating-linear-gradient(135deg, var(--c) 0 3px, transparent 3px 6.5px), color-mix(in srgb, var(--c) 30%, #FFF3E6); }
  /* the new Quit Day target on the 0 mg column (Mon, Nov 23): a coral ring the dot slides into */
  .qbar { position: relative; }
  .qtarget { position: absolute; left: 50%; bottom: -1px; width: 0; height: 0; }
  .qtarget i { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 2.5px var(--mark); }
  .qtarget i::after { content: ""; position: absolute; inset: 5px; border-radius: 99px; background: color-mix(in srgb, var(--mark) 45%, transparent); }
  .bar.split { background: none; gap: 0; }
  .bar.split .pre { flex: 4 1 0; background: var(--c); border-radius: 10px 0 0 3px; }
  .bar.split .post { flex: 3 1 0; border-radius: 0 10px 3px 0; }
  /* Quit Day (Fri, Nov 6) falls 4 days into week 1: a coral dot on the axis where the 6 mg bar splits */
  .qmark { position: absolute; left: calc((100% - 24px) / 4 * 4 / 7); bottom: -1px; width: 0; height: 0; }
  .qmark i { position: absolute; left: -6.5px; top: -6.5px; width: 13px; height: 13px; border-radius: 99px; background: var(--mark); box-shadow: 0 0 0 2.5px var(--card); }
  .qmark .ql { position: absolute; left: -1px; bottom: 0; width: 2px; height: 120px; border-radius: 2px; background: var(--mark); }
  .qmark .qt { position: absolute; bottom: 120px; left: 0; transform: translateX(-50%); height: 22px; padding: 0 8px; border-radius: 99px; background: var(--mark); color: var(--ink); font: 700 13px/22px var(--body); white-space: nowrap; }
  .play .bar { animation: grow 900ms var(--settle) both; animation-delay: calc(var(--i) * 150ms + 250ms); }
  @keyframes grow { from { transform: scaleY(0); } to { transform: none; } }
  .qbar { align-self: end; width: 100%; height: 4px; border-radius: 3px 3px 0 0; background: var(--track); }
  .lbls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; text-align: center; color: var(--muted); }
  .lbls b { display: block; color: var(--fg); font: 800 15px/1.1 var(--display); }
  .steps-list { margin-top: 16px; }
  .steps-list .row { min-height: 52px; }
  .list > .row { padding: 8px 16px; }
  .row .t-head { font-size: 16px; }
  .row .t-foot { color: var(--muted); }
  .steps-list .chev { margin-left: -4px; }
  .steps-list .row { gap: 12px; }
  /* swatches: the same apricot and edge as the bars, heights by mg */
  .sw { width: 10px; height: 30px; border-radius: 4px; background: var(--c); box-shadow: inset 0 0 0 1.5px var(--edge); flex: none; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close"></button>
  </div>
  <div class="scroll">
    <div class="wrap">
      <h1 class="t-title" data-a style="--i:0">Your taper needs 3 weeks</h1>
      <p class="t-foot lead" data-a style="--i:1">Quit Day is in 4 days. Stepping your pouches down first makes stopping feel smaller.</p>
      <div class="card chart" data-a style="--i:3">
        <p class="key"><span><i class="kq"></i>Quit Day</span><span><i class="kh"></i>Runs past Quit Day</span></p>
        <div class="bars">
          <div class="bar split" style="--h:100%;--i:0"><i class="pre"></i><i class="post hatch"></i></div>
          <div class="bar hatch" style="--h:50%;--i:1"></div>
          <div class="bar hatch" style="--h:25%;--i:2"></div>
          <i class="qbar"><span class="qtarget" data-fade style="--d:1000ms"><i></i></span></i>
          <div class="qmark" data-pop style="--d:900ms"><b class="ql"></b><i></i><span class="qt">Fri 6</span></div>
        </div>
        <div class="lbls t-cap"><span><b>6 mg</b>Nov 2</span><span><b>3 mg</b>Nov 9</span><span><b>1.5 mg</b>Nov 16</span><span><b>0 mg</b>Nov 23</span></div>
      </div>
      <div class="list steps-list">
        <div class="row" data-settle style="--i:4"><i class="sw"></i><div class="grow"><p class="t-head">6 mg</p><p class="t-foot">Mon, Nov 2 to Sun, Nov 8</p></div><span class="chev" data-ic="chev"></span></div>
        <div class="row" data-settle style="--i:5"><i class="sw" style="height:20px"></i><div class="grow"><p class="t-head">3 mg</p><p class="t-foot">Mon, Nov 9 to Sun, Nov 15</p></div><span class="chev" data-ic="chev"></span></div>
        <div class="row" data-settle style="--i:6"><i class="sw" style="height:12px"></i><div class="grow"><p class="t-head">1.5 mg</p><p class="t-foot">Mon, Nov 16 to Sun, Nov 22</p></div><span class="chev" data-ic="chev"></span></div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:8"><span>Move <span class="qg">Q</span>uit Day to Mon, Nov 23</span></button>
    <button class="link" data-a style="--i:9">Save my taper as is</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic, e.dataset.ic === 'check' ? { w: 3.2 } : {}));
</script>
</body></html>
