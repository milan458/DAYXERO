<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>014 Paywall</title>
<meta name="motion" content="Calm arrive only: headline, Xero (settles in, 900ms), the four ticks draw in 90ms apart, then the three plan rows and the trial line. The Yearly row selects at 800ms (ring and tick, selection haptic) and the trial line draws left to right (900ms) with its three nodes fading in as the line reaches them. No springs, no shine: this screen stays quiet.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .head { padding: 112px var(--gutter) 0; display: grid; grid-template-columns: 1fr 100px; gap: 8px; align-items: center; }
  .head .xs { width: 100px; height: 100px; display: grid; place-items: center; }
  .head .t-large { font-size: 30px; }
  .head .t-foot { margin-top: 6px; }
  .incl { padding: 16px var(--gutter) 0; display: grid; gap: 10px; }
  .incl .it { display: flex; align-items: center; gap: 10px; }
  .incl svg { width: 18px; height: 18px; flex: none; }
  .plans { padding: 18px var(--gutter) 0; display: grid; gap: 10px; }
  .opt { min-height: 60px; padding: 10px 16px; }
  .opt .price { text-align: right; }
  .opt .price .num { font-size: 18px; letter-spacing: -.3px; display: block; }
  .opt .price .t-cap { color: var(--muted); }
  .opt .t-head { font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .opt.hero { min-height: 92px; padding: 16px 18px; background: var(--card); }
  .opt.hero .t-head { font-size: 20px; }
  .opt.hero .price .num { font-size: 24px; }
  .opt.on { box-shadow: inset 0 0 0 2.5px var(--sel), 0 10px 24px rgba(90,40,20,.12); }
  [data-theme="dark"] .opt.on { box-shadow: inset 0 0 0 2px var(--sel); }
  .other { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: transparent; box-shadow: inset 0 0 0 1px var(--line); text-align: left; width: 100%; color: var(--fg); }
  [data-theme="dark"] .other { box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .other .grow { flex: 1; }
  .other .t-foot { font-weight: 600; }
  .other .t-cap { color: var(--muted); }
  .other .chev { transform: rotate(90deg); }
  .pill { font: 700 12px/1 var(--body); padding: 5px 8px; border-radius: 99px; background: var(--sel); color: var(--sel-fg); letter-spacing: .1px; }
  .tlh { margin: 26px var(--gutter) 0; font-weight: 700; }
  .tl { margin: 14px var(--gutter) 0; position: relative; height: 66px; }
  .tl svg.ln { position: absolute; left: 7px; right: 7px; top: 6px; width: calc(100% - 14px); height: 4px; overflow: visible; }
  .tl .n { position: absolute; top: 0; display: grid; gap: 6px; }
  .tl .n i { width: 16px; height: 16px; border-radius: 99px; background: var(--g); box-shadow: inset 0 0 0 3px var(--fg); display: block; }
  .tl .n.now i { background: var(--fg); }
  .tl .n .t-cap { color: var(--muted); white-space: nowrap; font-size: 13px; line-height: 1.35; }
  .tl .n .t-cap b { font-size: 14px; }
  .tl .n .t-cap b { color: var(--fg); font-weight: 700; display: block; }
  .tl .n.mid { left: 50%; transform: translateX(-50%); justify-items: center; text-align: center; }
  .tl .n.end { right: 0; justify-items: end; text-align: right; }
  .dock { gap: 4px; padding-top: 28px; }
  .dock .link { height: 36px; font-size: 14px; }
  .dock .t-cap { text-align: center; color: var(--muted); font-weight: 500; }
  .dock .t-cap a { text-decoration: underline; text-underline-offset: 2px; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
  </div>

  <div class="head">
    <div>
      <h1 class="t-large" data-a>Sam, your plan is ready</h1>
      <p class="t-foot muted" data-a style="--i:1">For your Quit Day, Fri, Nov 6.</p>
    </div>
    <div class="xs" data-settle style="--d:150ms"><div class="bob" id="xero"></div></div>
  </div>

  <div class="incl" id="incl"></div>

  <div class="plans">
    <button class="opt hero" id="yr" data-a style="--i:7"><span class="radio"></span><div class="grow"><p class="t-head">Yearly <span class="pill">7 days free</span></p><p class="t-foot">$3.33 a month, billed after your free week</p></div><div class="price"><span class="num">$39.99</span><span class="t-cap">a year</span></div></button>
    <button class="other" data-a style="--i:8"><div class="grow"><p class="t-foot">Other plans</p><p class="t-cap">Monthly $9.99 or Lifetime $99.99</p></div><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <p class="t-foot tlh" data-a style="--i:10">How your free week works</p>
  <div class="tl" data-a style="--i:10">
    <svg class="ln" viewBox="0 0 300 4" preserveAspectRatio="none"><path d="M0 2 H300" stroke="var(--track)" stroke-width="3"/><path class="draw" d="M0 2 H300" stroke="var(--fg)" stroke-width="3" style="--len:300;--d:1300ms;--dur:900ms"/></svg>
    <div class="n now" style="left:0"><i></i><span class="t-cap"><b>Today</b>Full access</span></div>
    <div class="n mid" data-fade style="--d:1750ms"><i></i><span class="t-cap"><b>Day 5, Nov 3</b>We remind you</span></div>
    <div class="n end" data-fade style="--d:2150ms"><i></i><span class="t-cap"><b>Fri, Nov 6</b>$39.99 a year</span></div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:11">Start my 7-day free trial</button>
    <a class="link" data-a style="--i:12">Restore purchases</a>
    <p class="t-cap" data-a style="--i:12">Cancel anytime in Settings. <a>Terms</a> · <a>Privacy</a></p>
  </div>
</div>
<script>
  document.querySelector('.icon-btn').innerHTML = DX.icon('back');
  document.getElementById('xero').innerHTML = DX.char('xero', { mood: 'hello', size: 88 });
  const items = ['Prep 4 to 7 and your Day Xero kit', 'Weeks 1 to 4 with voice coaching', 'Slip plans and your NRT schedule'];
  document.getElementById('incl').innerHTML = items.map((t, i) => `<div class="it" data-a style="--i:${i + 2}">
    <svg viewBox="0 0 24 24" fill="none" stroke="var(--tick)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M5 12.5l4.5 4.5L19 7.5" style="--len:24;--d:${300 + i * 90}ms"/></svg>
    <p class="t-foot">${t}</p></div>`).join('');
  const yr = document.getElementById('yr');
  DX.after(0, () => yr.classList.remove('on'));
  DX.after(800, () => yr.classList.add('on'));
  DX.onStill(() => yr.classList.add('on'));
</script>
</body></html>
