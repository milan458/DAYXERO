<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>014 Paywall</title>
<meta name="motion" content="Calm arrive only: Xero (settles into his small cream disc at the right of the nav row, 900ms), headline, the three small paper-cut coral stamps arrive and their cream ticks draw in 90ms apart, then the Yearly hero card and the Monthly and Lifetime rows, then the trial line, and under the button the one-line auto-renew note. $39.99 appears in the headline, the Yearly row and the end of the timeline (Nov 6, $39.99 charged). The Yearly row (its 7 days free pill on its top edge) takes the kit selection at 800ms (warm tint, outline, ring and tick; selection haptic) and the trial line draws left to right (900ms) with its three nodes fading in as the line reaches them. No springs, no shine: this screen stays quiet.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Round 11: Xero's disc is lifted into the nav row (right, 60px, like an avatar) so the headline runs the full width at the kit size. */
  .head { padding: 116px var(--gutter) 0; }
  /* Xero sits in a cream disc (reads on apricot). Dark: the disc is the raised card tone. */
  .nav .xs { position: relative; width: 60px; height: 60px; border-radius: 99px; background: #FFF8EE; display: grid; place-items: center; flex: none; margin-top: 8px; }
  [data-theme="dark"] .nav .xs { background: var(--card-2); }
  .nav .xs > * { position: relative; margin-top: 3px; }
  .head .t-large span { display: block; white-space: nowrap; }
  .head .t-foot { margin-top: 6px; }
  .incl { padding: 22px var(--gutter) 0; display: grid; gap: 10px; }
  .incl .it { display: flex; align-items: center; gap: 10px; }
  /* Benefit marks: small paper-cut stamps (a scalloped coral disc, soft paper shadow, cream tick), the prep-stamp family in miniature. */
  .incl svg { width: 22px; height: 22px; flex: none; overflow: visible; }
  .plans { padding: 30px var(--gutter) 0; display: grid; gap: 8px; }
  .opt.lite { min-height: 52px; }
  .opt.lite .price .num { font-size: 17px; }
  .opt { min-height: 60px; padding: 10px 16px; }
  .opt .price { text-align: right; }
  .opt .price .num { font-size: 18px; letter-spacing: -.3px; display: block; }
  .opt .price .t-cap { color: var(--muted); }
  .opt .t-head { font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .opt.hero { position: relative; min-height: 80px; padding: 14px 18px; }
  /* The trial pill sits above the Yearly row, on its top edge. */
  .opt.hero .pill { position: absolute; top: -12px; left: 16px; }
  .opt.hero .t-head { font-size: 20px; }
  .opt.hero .price .num { font-size: 24px; }
  /* Light: the selected Yearly tint is a clear step lighter than the apricot ground (the kit tint sits too close to it here). */
  html:not([data-theme="dark"]) .opt.hero.on { background: color-mix(in srgb, #FF9A5C 16%, #FFFFFF); }
  .other { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: transparent; box-shadow: inset 0 0 0 1px var(--line); text-align: left; width: 100%; color: var(--fg); }
  [data-theme="dark"] .other { box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }
  .other .grow { flex: 1; }
  .other .t-foot { font-weight: 600; }
  .other .t-cap { color: var(--muted); }
  .other .chev { transform: rotate(90deg); }
  .pill { font: 700 13px/1 var(--body); padding: 6px 10px; border-radius: 99px; background: var(--sel); color: var(--sel-fg); letter-spacing: .1px; }
  .tlh { margin: 26px var(--gutter) 0; font-weight: 700; }
  .tl { margin: 28px var(--gutter) 0; position: relative; height: 80px; }  /* round 11: the list sits lower so no gap opens above the CTA */
  .tl svg.ln { position: absolute; left: 7px; right: 7px; top: 6px; width: calc(100% - 14px); height: 4px; overflow: visible; }
  .tl .n { position: absolute; top: 0; display: grid; gap: 6px; }
  .tl .n i { width: 16px; height: 16px; border-radius: 99px; background: var(--g); box-shadow: inset 0 0 0 3px var(--fg); display: block; }
  .tl .n.now i { background: var(--fg); }
  .tl .n .t-cap { color: var(--muted); white-space: nowrap; font-size: 14px; line-height: 1.35; }
  .tl .n .t-cap b { font-size: 15px; }
  .tl .n .t-cap b { color: var(--fg); font-weight: 700; display: block; }
  .tl .n.mid { left: 50%; transform: translateX(-50%); justify-items: center; text-align: center; }
  .tl .n.end { right: 0; justify-items: end; text-align: right; }
  .dock { gap: 2px; padding-top: 26px; padding-bottom: 26px; }
  .dock .link { height: 36px; font-size: 14px; }
  .dock .t-cap { text-align: center; color: var(--muted); font-weight: 500; }
  .dock .t-cap a { text-decoration: underline; text-underline-offset: 2px; }
  .dock .renew { margin-top: 6px; text-wrap: balance; }
  .dock .legal { display: flex; justify-content: center; align-items: center; gap: 6px; }
  .dock .legal .link { height: 32px; }
  .dock .legal span { color: var(--muted); }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"></div>
    <div class="xs" data-settle style="--d:150ms"><div class="bob" id="xero"></div></div>
  </div>

  <div class="head">
    <div>
      <h1 class="t-large" data-a><span>7 days free, then</span><span>$39.99 a year</span></h1>
      <p class="t-foot muted" data-a style="--i:1">Craving SOS stays free, always.</p>
    </div>
  </div>

  <div class="incl" id="incl"></div>

  <div class="plans">
    <button class="opt hero" id="yr" data-a style="--i:7"><span class="radio"></span><div class="grow"><span class="pill">7 days free</span><p class="t-head">Yearly</p><p class="t-foot">$3.33 a month</p></div><div class="price"><span class="num">$39.99</span><span class="t-cap">a year</span></div></button>
    <button class="opt lite" data-a style="--i:8"><span class="radio"></span><div class="grow"><p class="t-head">Monthly</p></div><div class="price"><span class="num">$9.99</span><span class="t-cap">a month</span></div></button>
    <button class="opt lite" data-a style="--i:9"><span class="radio"></span><div class="grow"><p class="t-head">Lifetime</p></div><div class="price"><span class="num">$99.99</span><span class="t-cap">once</span></div></button>
  </div>

  <div class="tl" data-a style="--i:10">
    <svg class="ln" viewBox="0 0 300 4" preserveAspectRatio="none"><path d="M0 2 H300" stroke="var(--track)" stroke-width="3"/><path class="draw" d="M0 2 H300" stroke="var(--fg)" stroke-width="3" style="--len:300;--d:1300ms;--dur:900ms"/></svg>
    <div class="n now" style="left:0"><i></i><span class="t-cap"><b>Today</b>Full access</span></div>
    <div class="n mid" data-fade style="--d:1750ms"><i></i><span class="t-cap"><b>Nov 3</b>We remind you</span></div>
    <div class="n end" data-fade style="--d:2150ms"><i></i><span class="t-cap"><b>Nov 6</b>$39.99 charged</span></div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:11">Start my 7-day free trial</button>
    <p class="t-cap renew" data-a style="--i:12">Renews automatically. Cancel anytime in Settings.</p>
    <div class="legal" data-a style="--i:13"><a class="link">Restore purchases</a><span>·</span><a class="link">Terms</a><span>·</span><a class="link">Privacy</a></div>
  </div>
</div>
<script>
  document.querySelector('.icon-btn').innerHTML = DX.icon('back');
  /* Xero, hello, in his disc (round 8: no ticket). */
  document.getElementById('xero').innerHTML = DX.char('xero', { mood: 'hello', size: 52 });
  /* What the plan buys after Quit Day leads; the prep it unlocks comes last. */
  /* SOS itself is free; the paid perk is Jelli's voice in it. */
  const items = ['Weeks 1 to 4 of coaching after Quit Day', 'Jelli&rsquo;s voice in SOS and Glim&rsquo;s check-ins', 'Prep 4 to 7 and your Day Xero badge'];
  const scal = (cx, cy, r, n, a) => { let d = ''; for (let k = 0; k <= n * 2; k++) { const ang = Math.PI * k / n - Math.PI / 2, rr = k % 2 ? r - a : r; d += (k ? 'L' : 'M') + (cx + rr * Math.cos(ang)).toFixed(2) + ' ' + (cy + rr * Math.sin(ang)).toFixed(2); } return d + 'Z'; };
  const ssh = DX.theme === 'dark' ? 'rgba(0,0,0,.55)' : 'rgba(120,52,24,.26)';
  document.getElementById('incl').innerHTML = `<svg width="0" height="0" style="position:absolute"><defs><filter id="stp" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.2" stdDeviation=".8" flood-color="${ssh}"/></filter></defs></svg>`
    + items.map((t, i) => `<div class="it" data-a style="--i:${i + 2}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><g filter="url(#stp)"><path d="${scal(12, 12, 11.5, 10, 1.4)}" fill="#FF7155"/></g><path d="M16.6 4.6 A9 9 0 0 1 16.6 19.4 A10 10 0 0 0 16.6 4.6 Z" fill="#E85A3E"/>
      <path class="draw" d="M7.4 12.4l3.1 3.1L16.8 9" fill="none" stroke="#FFF8EE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="--len:16;--d:${300 + i * 90}ms"/></svg>
    <p class="t-foot">${t}</p></div>`).join('');
  const yr = document.getElementById('yr');
  DX.after(0, () => yr.classList.remove('on'));
  DX.after(800, () => yr.classList.add('on'));
  DX.onStill(() => yr.classList.add('on'));
</script>
</body></html>
