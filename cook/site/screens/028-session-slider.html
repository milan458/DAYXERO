<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>028 Session slider</title>
<meta name="motion" content="The bar shows card 2 a third done with Card 2 · Step 1 of 3 beside it; the mint tag, question and helper arrive (600ms, 90ms stagger). The reading arrives as one unit: the big number with Xero beside it, the calm-blue to coral track right under it and its 11 short ticks (fade 500ms). The thumb glides from Calm to the middle (1100ms settle, from 400ms) while the number counts 0 to 5 in step, with a soft tick haptic on each stop, and Xero's face follows the thumb as it passes (calm at 0 to 3, plain at 4, a little tense at 5 and 6, tense from 7: a 150ms cross-fade per change). His line arrives under the slider last (600ms), its pointer under the thumb; dragging moves the pointer with the thumb and rewrites the line at each whole number.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* A breath that works in the moment is a Try card: mint + hand */
.k-try{--face:#9FE3BC}
[data-theme="dark"] .k-try{--face:#8FD3AD}
.steps > i.now::after{width:var(--sub,45%)}
.nav .side{flex:none;color:var(--muted)}
.wrap{position:absolute;top:112px;left:0;right:0;display:grid;align-content:start;gap:10px}
.tag{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body)}
.tag svg{width:16px;height:16px}
/* dark: a deep mint pill with a mint label, never pale mint glaring on navy */
[data-theme="dark"] .tag.k-try{background:#1A4434;color:#9FE3BC;box-shadow:inset 0 0 0 1px rgba(159,227,188,.22)}
/* the reading: number and Xero's face side by side, the track straight under them */
.unit{position:absolute;top:290px;left:var(--gutter);right:var(--gutter)}
.read{display:flex;align-items:flex-end;justify-content:center;gap:16px;height:158px}
.read .n{display:flex;align-items:baseline;gap:4px}
.read .num{font-size:160px;line-height:.86;letter-spacing:-3px;display:block}
.read .of{font:700 28px/1 var(--display);color:var(--muted);letter-spacing:-.3px}
.read .xf{width:136px;height:136px;flex:none;margin-bottom:-8px}
.sl{margin-top:38px}
.track{position:relative;height:10px;border-radius:99px;margin:0 6px;background:linear-gradient(90deg,#8EC1FF,#C9A9C8 50%,#FF7A55)}
[data-theme="dark"] .track{background:linear-gradient(90deg,#6FA6EE,#B48FA9 50%,#F0704E)}
.track .thumb{position:absolute;z-index:1;top:50%;left:var(--v);width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:99px;background:#fff;
  box-shadow:0 0 0 4px #C9A9C8 inset,0 4px 12px rgba(30,26,58,.28)}
[data-theme="dark"] .track .thumb{background:#FFF8EE;box-shadow:0 0 0 4px #B48FA9 inset,0 4px 14px rgba(0,0,0,.5)}
.play .track .thumb{animation:glide 1100ms var(--settle) both 400ms}
@keyframes glide{from{left:0}to{left:var(--v)}}
/* 11 short ticks, 0 to 10, under the track */
.ticks{position:relative;height:8px;margin:14px 6px 0}
.ticks i{position:absolute;top:0;width:2px;height:8px;margin-left:-1px;border-radius:2px;background:color-mix(in srgb,var(--fg) 30%,transparent)}
.ticks i.mj{height:8px;background:color-mix(in srgb,var(--fg) 50%,transparent)}
.ends{display:flex;justify-content:space-between;margin-top:12px}
.ends span{font:600 15px/1 var(--body)}
/* both labels hold at least 4.5:1 on the ground */
.ends span:first-child{color:#1F4E9E}
.ends span:last-child{color:#C2441F}
[data-theme="dark"] .ends span:first-child{color:#9CCBFF}
[data-theme="dark"] .ends span:last-child{color:#FF9A7A}
/* Xero's line sits under the slider, its pointer under the thumb */
.say{position:relative;margin:30px auto 0;width:max-content;max-width:320px;background:var(--card);border-radius:20px;padding:14px 20px;text-align:center;font:500 16px/1.42 var(--body);box-shadow:0 2px 10px rgba(30,26,58,.07)}
[data-theme="dark"] .say{box-shadow:inset 0 0 0 1px var(--line)}
.say::before{content:"";position:absolute;left:50%;top:-7px;width:14px;height:14px;margin-left:-7px;background:var(--card);border-radius:3px 0 0 0;transform:rotate(45deg)}
[data-theme="dark"] .say::before{box-shadow:inset 1px 1px 0 var(--line)}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="Card 2, step 1 of 3" style="--sub:33%"><i class="on"></i><i class="now"></i><i></i><i></i><i></i></div></div>
    <span class="side t-cap">Card 2 · Step 1 of 3</span>
  </div>
  <div class="wrap pad">
    <span class="tag k-try" data-a style="--i:0"><span id="t-ic"></span>A breath that works · 5 min</span>
    <h1 class="t-title" data-a style="--i:1">How tense do you feel right now?</h1>
    <p class="t-foot muted" data-a style="--i:2">A quick check before you breathe. You'll check again after.</p>
  </div>
  <div class="unit" data-a style="--i:3">
    <div class="read">
      <div class="n"><span class="num" data-count="5" data-delay="400" data-dur="1100" id="num">5</span><span class="of">/10</span></div>
      <div class="xf" id="xero"></div>
    </div>
    <div class="sl">
      <div class="track" id="track" style="--v:50%"><i class="thumb" role="slider" aria-valuemin="0" aria-valuemax="10" aria-valuenow="5" aria-label="Tension"></i></div>
      <div class="ticks" id="ticks"></div>
      <div class="ends"><span>Calm</span><span>Very tense</span></div>
    </div>
    <p class="say" data-a style="--i:6">An honest 5. Let's see what<br>five minutes of breathing does.</p>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:9">That's about right</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('t-ic').innerHTML = DX.icon('hand', {size:16});
document.getElementById('ticks').innerHTML = Array.from({length:11}, (_, i) => `<i class="${i % 5 ? '' : 'mj'}" style="left:${i * 10}%"></i>`).join('');
/* Xero's face follows the slider: calm 0-3, plain 4, a little tense 5-6 (open eyes, flat wavering mouth, raised inner brows), tense 7+ */
const BROWS = (k) => `<g fill="none" stroke="#24163A" stroke-width="${k ? 3.5 : 3}" stroke-linecap="round">${k ? `<path d="M77 ${66 + k} L90 ${62 - k}"/><path d="M110 ${62 - k} L123 ${66 + k}"/>` : `<path d="M77 64.5 Q83.5 62.4 90 63"/><path d="M110 63 Q116.5 62.4 123 64.5"/>`}</g>`;
function xeroAt(v) {
  if (v <= 3) return DX.char('xero', {mood:'calm', size:136});
  let s = DX.char('xero', {mood:'hello', size:136});
  if (v === 4) return s;
  const mouth = v >= 7 ? 'M90 96 Q93.5 92 97 96 Q100.5 100 104 96 Q107.5 92 111 96' : 'M92 95 Q96 93 100 95 Q104 97 108 95';
  s = s.replace(/<path d="M92 92 Q100 100 108 92"/, `<path d="${mouth}"`);
  const at = s.lastIndexOf('</g></g></g>');
  return s.slice(0, at + 12) + BROWS(v >= 7 ? 2 : 0) + s.slice(at + 12);
}
const xe = document.getElementById('xero');
xe.innerHTML = xeroAt(5);
if (!DX.still) {
  let last = -1; const num = document.getElementById('num');
  new MutationObserver(() => { const v = parseInt(num.textContent); if (!isNaN(v) && v !== last) { last = v; xe.innerHTML = xeroAt(v); } }).observe(num, {childList:true});
}
</script>
</body></html>
