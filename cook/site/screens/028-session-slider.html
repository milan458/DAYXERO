<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>028 Session slider</title>
<meta name="motion" content="Tag, question and helper arrive (600ms, 90ms stagger). The calm-blue to coral track fades in, then the thumb glides from Calm to the middle (1100ms settle, from 400ms) while the big number counts 0 to 5 in step; a soft tick haptic on each whole number. Xero settles in beside the number (900ms) and his bubble grows out of him (scale from the tail, 420ms spring) last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.f-sky{--face:#9CCBFF}
.nav .side{width:44px;text-align:right;flex:none}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px 0 9px;border-radius:99px;background:var(--face);color:#1E1A3A;font:600 13px/1 var(--body);justify-self:start}
.tag svg{width:16px;height:16px}
.wrap{position:absolute;top:110px;left:0;right:0;display:grid;align-content:start;gap:10px}
.stage{position:absolute;top:274px;left:var(--gutter);right:var(--gutter);height:170px;display:flex;align-items:flex-end;justify-content:center;gap:34px}
.big{text-align:center;padding-bottom:6px}
.big .num{font-size:132px;line-height:.9;letter-spacing:-3px;display:block}
.big .t-foot{margin-top:8px}
.stage .who{width:150px;flex:none}
.say{position:absolute;top:470px;text-wrap:balance;left:var(--gutter);right:var(--gutter);margin:0;background:var(--card);border-radius:20px;padding:13px 16px;font:500 15px/1.4 var(--body);
  box-shadow:0 2px 10px rgba(30,26,58,.06);transform-origin:76% 0}
.say::before{content:"";position:absolute;top:-11px;left:calc(50% + 44px);width:18px;height:12px;background:var(--card);clip-path:polygon(0 100%,62% 0,100% 100%)}
[data-theme="dark"] .say{box-shadow:none}
.sl{position:absolute;top:588px;left:var(--gutter);right:var(--gutter)}
.track{position:relative;height:10px;border-radius:99px;margin:0 6px;background:linear-gradient(90deg,#8EC1FF,#C9A9C8 50%,#FF7A55)}
[data-theme="dark"] .track{background:linear-gradient(90deg,#6FA6EE,#B48FA9 50%,#F0704E)}
.track .thumb{position:absolute;top:50%;left:var(--v);width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:99px;background:#fff;
  box-shadow:0 0 0 4px #C9A9C8 inset,0 4px 12px rgba(30,26,58,.28)}
[data-theme="dark"] .track .thumb{background:#FFF8EE;box-shadow:0 0 0 4px #B48FA9 inset,0 4px 14px rgba(0,0,0,.5)}
.play .track .thumb{animation:glide 1100ms var(--settle) both 400ms}
@keyframes glide{from{left:0}to{left:var(--v)}}
.ends{display:flex;justify-content:space-between;margin-top:26px}
.ends span{font:600 15px/1 var(--body)}
.ends span:first-child{color:color-mix(in srgb,#2F6FD0 70%,var(--fg))}
.ends span:last-child{color:color-mix(in srgb,#E2552F 75%,var(--fg))}
[data-theme="dark"] .ends span:first-child{color:#9CCBFF}
[data-theme="dark"] .ends span:last-child{color:#FF9A7A}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="Card 2 of 5"><i class="on"></i><i class="now"></i><i></i><i></i><i></i></div></div>
    <span class="side t-foot muted">2 of 5</span>
  </div>
  <div class="wrap pad">
    <span class="tag f-sky" data-a style="--i:0"><span id="t-ic"></span>A breath that works · 5 min</span>
    <h1 class="t-title" data-a style="--i:1">How tense do you feel right now?</h1>
    <p class="t-foot muted" data-a style="--i:2">A quick check before you breathe. You'll check again after.</p>
  </div>
  <div class="stage">
    <div class="big" data-a style="--i:3">
      <span class="num" data-count="5" data-delay="400" data-dur="1100">5</span>
      <p class="t-foot muted">out of 10</p>
    </div>
    <div class="who" data-settle style="--i:6"><div id="xero"></div></div>
  </div>
  <p class="say" data-pop style="--d:1200ms">An honest 5. Let's see what three minutes of breathing does.</p>
  <div class="sl" data-fade style="--d:300ms">
    <div class="track" style="--v:50%"><i class="thumb" role="slider" aria-valuemin="0" aria-valuemax="10" aria-valuenow="5"></i></div>
    <div class="ends"><span>Calm</span><span>Very tense</span></div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:9">That's about right</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('t-ic').innerHTML = DX.icon('hand', {size:16});
document.getElementById('xero').innerHTML = DX.char('xero', {mood:'calm', size:150});
</script>
</body></html>
