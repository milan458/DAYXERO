<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>009 Onboarding NRT</title>
<meta name="motion" content="Progress eases from 6/11 to 7/11 (900ms) as the question, one short evidence line with a single Sources info link (tap opens the Cochrane 2018 and 2019 citations in a sheet) and three option rows arrive (600ms, 90ms stagger). At 900ms the first row selects (kit selection: warm tint, outline, ring fills and ticks, 250ms, selection haptic) and the card grows and its product chips unfold inside it (height 0 to auto, 420ms settle), then Patch and Gum fill with the warm tint and a small tick (tint only: no second outline inside the card) one after the other 160ms apart. The horizon strip above the dock settles up in three paper layers (0, 120, 240ms; 40px, 900ms settle) and Xero (68px), holding up a small paper patch, settles onto its crest last (from 420ms).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  /* Round 8: the two claims share one short paragraph and one "Sources" info link (opens the citations sheet). */
  .q { gap: 8px; }
  .q .ev { display: grid; gap: 2px; justify-items: start; }
  .q .ev + .ev { margin-top: 2px; }
  .q .source { justify-self: start; display: inline-flex; align-items: center; gap: 6px; }
  .q .source svg { width: 14px; height: 14px; }
  .opt .t-head { font-size: 17px; }
  .what { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 420ms var(--settle), opacity 300ms var(--ease); }
  .what > div { overflow: hidden; }
  .what.open { grid-template-rows: 1fr; opacity: 1; }
  .q .source { font: 600 13px/1.3 var(--body); color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  /* The first option and its product chips share one card; when picked, the whole card takes the kit selection (warm tint + 2px outline). */
  .og { border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); transition: box-shadow .25s var(--ease), background .25s var(--ease); }
  .og .opt { background: transparent; box-shadow: none !important; }
  .og:has(.opt.on) { box-shadow: inset 0 0 0 2px var(--sel-edge, var(--sel)); background: var(--sel-tint); }
  .what .inner { padding: 0 16px 16px; }
  .q .source svg { width: 16px; height: 16px; }
  .what .inner .rule { height: 1px; background: var(--line); margin: 0 0 12px; }
  .what .lbl { font: 700 14px/1.3 var(--body); color: var(--fg); margin: 0 0 10px; }
  /* Round 10: inside the selected card every chip is tint only (no hairlines, no outline inside the card's outline). */
  .screen .og .chip:not(.on), [data-theme="dark"] .screen .og .chip:not(.on) { background: var(--card); box-shadow: none; }
  /* Nested picks inside the selected card: a filled tint with a small tick, never a second outline level. */
  .screen .og .chip.on, [data-theme="dark"] .screen .og .chip.on { background: color-mix(in srgb, #FF9A5C 58%, #FFFFFF); box-shadow: none; color: var(--fg); }
  /* Dark: the nested picks are a deeper step of the kit's clean cream-peach lift (no brown). */
  [data-theme="dark"] .screen .og .chip.on { background: color-mix(in srgb, #FFE6CF 24%, var(--card)); }
  .og .chip .tk { display: none; width: 16px; height: 16px; margin-left: -4px; }
  .og .chip.on .tk { display: grid; }
  .og .chip .tk svg { width: 16px; height: 16px; }
  .answers { gap: 10px !important; }
  .opt { min-height: 68px; }
  .nrt2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .nrt2 .chip { justify-content: center; white-space: nowrap; padding: 0 10px; }
  /* Round 10: the onboarding horizon strip (003 to 011, one element). Three flat paper hills in the launch style, soft paper
     shadows and no crest lines, sitting just above the dock and running full-bleed behind it; the screen's character stands on the
     crest. Light: cream and peach paper. Dark: the kit's night-meadow hills, kept quiet. */
  .screen { --hz-1: #FFD3A6; --hz-2: #FFE6CA; --hz-3: #F9B386; --hz-lift: rgba(120,44,20,.16); }
  [data-theme="dark"] .screen { --hz-1: #16233F; --hz-2: #0F1A31; --hz-3: #0A1326; --hz-lift: rgba(0,0,0,.55); }
  .hz { position: absolute; z-index: 1; left: 0; top: calc(var(--hz-b, 752px) - 134px); width: 390px; height: 300px; pointer-events: none; }
  .hz .l { position: absolute; left: 0; top: 0; display: block; }
  .hz .l1 { filter: drop-shadow(0 -3px 8px var(--hz-lift)); }
  .hz .l2 { filter: drop-shadow(0 -4px 10px var(--hz-lift)); }
  .hz .l3 { filter: drop-shadow(0 -5px 12px var(--hz-lift)); }
  .hz .who { position: absolute; }
  .play .hz .l { animation: hz-up 900ms var(--settle) both; }
  .play .hz .l2 { animation-delay: 120ms; }
  .play .hz .l3 { animation-delay: 240ms; }
  @keyframes hz-up { from { transform: translateY(40px); } to { transform: none; } }
  .dock { background: none; }
  .screen { --hz-b: 752px; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:63.6%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>Want to use nicotine replacement?</h1>
    <div class="ev" data-a style="--i:1">
      <p class="t-body muted">It raises your odds of quitting by 50 to 60%. A patch plus a faster form works best.</p>
      <a class="source" aria-label="Sources: Cochrane reviews, 2018 and 2019"><span data-icon="info"></span>Sources</a>
    </div>
  </div>
  <div class="answers">
    <div class="og" data-a style="--i:3">
    <button class="opt" id="o1"><div class="grow"><p class="t-head">Yes, I&rsquo;m already using it</p><p class="t-foot">Pick all you use</p></div><span class="radio"></span></button>
    <div class="what" id="what"><div><div class="inner">
      <div class="chips nrt2"><button class="chip" id="c1"><span class="tk" data-tick></span>Patch</button><button class="chip" id="c2"><span class="tk" data-tick></span>Gum</button><button class="chip">Lozenge</button><button class="chip">Spray or inhaler</button></div>
    </div></div></div>
    </div>
    <button class="opt" data-a style="--i:4"><div class="grow"><p class="t-head">I&rsquo;d like to try it</p><p class="t-foot">I&rsquo;ll help you plan it with a pharmacist</p></div><span class="radio"></span></button>
    <button class="opt" data-a style="--i:5"><div class="grow"><p class="t-head">Not for me</p><p class="t-foot">Behavioral prep only</p></div><span class="radio"></span></button>
  </div>

  <div class="hz" id="hz" aria-hidden="true"></div>

  <div class="dock">
    <button class="btn" data-a style="--i:6">Continue</button>
  </div>
</div>
<script>
  /* Round 10: the horizon strip. Strip y 134 is the top of the button; the character's feet sit on the middle hill's crest. */
  function horizon(o) {
    const back = 'M0 82 C50 74 100 72 150 77 C198 82 234 78 268 66 C306 53 350 47 390 53 L390 300 L0 300 Z',
      mid = 'M0 108 C46 100 96 106 140 114 C180 121 214 114 250 104 C282 95 312 91 342 94 C362 96 378 100 390 104 L390 300 L0 300 Z',
      front = 'M0 128 C58 120 118 124 178 134 C236 143 300 136 350 124 C368 120 380 119 390 120 L390 300 L0 300 Z';
    const l = (i, d, extra = '') => `<svg class="l l${i}" width="390" height="300" viewBox="0 0 390 300"><path d="${d}" fill="var(--hz-${i})"/>${extra}</svg>`;
    const s = o.size || 72, x = o.x ?? 312, y = o.y ?? 92;
    return l(1, back) + l(2, mid, o.pond || '') + `<div class="who" data-settle style="--d:420ms;left:${x - s / 2}px;top:${(o.top ?? (y - .965 * s)).toFixed(1)}px;width:${s}px;height:${s}px${o.clip ? `;overflow:hidden;height:${o.clip}px` : ''}"><div id="${o.id || 'hzc'}">${o.art}</div></div>` + (o.over || '') + l(3, front);
  }
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = e.dataset.icon === 'info'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle cx="12" cy="7.6" r=".6" fill="currentColor"/></svg>'
    : DX.icon(e.dataset.icon, { size: 16 }));
  document.querySelector('.icon-btn').innerHTML = DX.icon('back');
  document.querySelectorAll('[data-tick]').forEach(e => e.innerHTML = DX.icon('check', { size: 16, w: 3 }));
  /* Xero on the strip, holding up a small paper patch (flat cut pieces, soft paper shadow). */
  const psh = DX.theme === 'dark' ? 'rgba(0,0,0,.5)' : 'rgba(120,52,24,.26)';
  const patch = `<defs><filter id="ps" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="${psh}"/></filter></defs>
    <g transform="rotate(14 194 76)" filter="url(#ps)"><rect x="173" y="55" width="42" height="42" rx="10" fill="#FFF4E6"/>
      <path d="M215 72 V87 a10 10 0 0 1 -10 10 H184 c13 -2 21 -8 24 -19 z" fill="#EBD5BF"/><rect x="183" y="65" width="22" height="22" rx="7" fill="#F4B27E"/></g>
    <path d="M162 116 C172 112 180 104 184 94" fill="none" stroke="#FF7155" stroke-width="12" stroke-linecap="round"></path>`;
  document.getElementById('hz').innerHTML = horizon({ x: 306, size: 68, art: DX.char('xero', { mood: 'hello', size: 68 })
    .replace('style="display: block"', 'style="display: block; overflow: visible"')
    .replace(/<path d="M164 124 C174 132 178 142 176 152"[^>]*><\/path>/, patch) });
  const $ = id => document.getElementById(id), bar = $('bar');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '54.5%'); void bar.offsetWidth; bar.style.transition = '';
    $('o1').classList.remove('on'); $('what').classList.remove('open'); $('c1').classList.remove('on', 'bump'); $('c2').classList.remove('on', 'bump'); });
  DX.after(250, () => bar.style.setProperty('--p', '63.6%'));
  DX.after(900, () => { $('o1').classList.add('on'); $('what').classList.add('open'); });
  DX.after(1500, () => $('c1').classList.add('on', 'bump'));
  DX.after(1660, () => $('c2').classList.add('on', 'bump'));
  DX.onStill(() => { $('o1').classList.add('on'); $('what').classList.add('open'); $('c1').classList.add('on'); $('c2').classList.add('on'); });
</script>
</body></html>
