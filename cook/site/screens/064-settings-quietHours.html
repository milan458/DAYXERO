<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>064 Quiet hours</title>
<meta name="motion" content="The moon start handle pops at 10 PM, then the dial arc sweeps from it round to 8 AM (1.4s settle) where the sun end handle fades in, as the 10 counts up in the centre; the From and Until tiles, the while-it-is-quiet card (Glim settles asleep on his hill, 400ms, zzz drifting) and the NRT toggle row arrive below on the stagger. Changing a time drags either handle with a selection haptic per 15 minutes.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.hd { display: grid; gap: 6px; padding-top: 58px; }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.ico-tile.apr { background: #FFE6D0; color: #A8481F; }
[data-theme="dark"] .ico-tile.apr { background: rgba(255,195,138,.16); color: #FFC38A; }

.dial { position: relative; width: 228px; height: 228px; margin: 40px auto 0; }
.dial .rot { position: absolute; inset: 0; transform: rotate(300deg); }
.dial .ctr { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; justify-items: center; }
.dial .ctr .num { font-size: 48px; line-height: 1; }
.hr { position: absolute; color: var(--fg); opacity: .78; transform: translate(-50%, -50%); white-space: nowrap; font: 700 14px/1 var(--body); }
.hand { position: absolute; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 99px; background: var(--card); box-shadow: 0 0 0 2px var(--fg), 0 3px 8px rgba(20,20,40,.16); display: grid; place-items: center; color: var(--fg); z-index: 2; }
.hand svg { width: 17px; height: 17px; }
.ticks { position: absolute; inset: 0; color: var(--muted); }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 36px; }
.times .card { padding: 13px 16px; display: grid; gap: 4px; }
.times .t-foot { display: flex; align-items: center; gap: 6px; }
.times .t-foot svg { width: 15px; height: 15px; }
.times .num { font-size: 26px; line-height: 1.05; }

.quiet { display: flex; align-items: flex-end; gap: 12px; margin-top: 12px; padding: 12px 16px 14px 10px; }
.quiet .g { position: relative; width: 76px; height: 72px; flex: none; }
.quiet .g .mound { position: absolute; left: 0; bottom: 0; }
.quiet .g .who { position: absolute; left: 4px; top: -10px; }
.quiet ul { list-style: none; margin: 0; padding: 0 0 4px; display: grid; gap: 8px; flex: 1; }
.quiet li { display: flex; gap: 8px; align-items: baseline; }
.quiet li i { width: 6px; height: 6px; border-radius: 99px; background: var(--muted); flex: none; transform: translateY(-2px); }
.ctl { margin-top: 12px; }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Quiet hours</h1><p class="t-foot muted" data-a style="--i:1">Anything due in these hours waits until morning.</p></div>
  <div class="dial" data-a style="--i:2">
    <svg class="ticks" width="228" height="228" viewBox="0 0 228 228" id="ticks"></svg>
    <div class="rot" id="ring"></div>
    <span class="hand" style="left:61px;top:22.2px;--d:150ms" data-pop aria-label="Starts 10 PM"><span data-ic="moon" data-s="17"></span></span>
    <span class="hand" style="left:205.8px;top:167px" data-fade aria-label="Ends 8 AM"><span data-ic="sun" data-s="17"></span></span>
    <div class="ctr"><span class="num" data-count="10">10</span><span class="t-foot muted">quiet hours</span></div>
    <span class="hr" style="left:114px;top:-16px">12 AM</span><span class="hr" style="left:258px;top:114px">6 AM</span><span class="hr" style="left:114px;top:244px">12 PM</span><span class="hr" style="left:-30px;top:114px">6 PM</span>
  </div>
  <div class="times" data-a style="--i:3">
    <div class="card"><span class="t-foot muted"><span data-ic="moon" data-s="15"></span>From</span><span class="num">10:00 PM</span></div>
    <div class="card"><span class="t-foot muted"><span data-ic="sun" data-s="15"></span>Until</span><span class="num">8:00 AM</span></div>
  </div>
  <div class="card flat quiet" data-a style="--i:4">
    <span class="g"><span class="mound" id="mound"></span><span class="who" id="glim" data-settle style="--d:400ms"></span></span>
    <ul><li><i></i><span class="t-foot">Pledge and check-in nudges wait until 8 AM</span></li><li><i></i><span class="t-foot">Craving forecasts pause overnight</span></li></ul>
  </div>
  <div class="list ctl" data-a style="--i:5">
    <div class="row"><span class="ico-tile s apr" data-ic="patch"></span><div class="grow"><div class="t-body rt">NRT reminders</div><div class="t-foot muted">Patch times still arrive</div></div><span class="toggle on"></span></div>
  </div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
const dark = DX.theme === 'dark';
/* 10 PM to 8 AM: the arc starts at 10 PM (300deg round from 12 AM at the top) and runs 10 of 24 hours. */
document.getElementById('ring').innerHTML = DX.ring({ size: 228, stroke: 16, p: 10 / 24, color: 'var(--fg)', track: 'var(--track)', dot: false });
document.getElementById('ticks').innerHTML = Array.from({ length: 24 }, (_, i) => { const a = i * Math.PI / 12, big = i % 6 === 0, r = 80; return `<circle cx="${(114 + r * Math.sin(a)).toFixed(1)}" cy="${(114 - r * Math.cos(a)).toFixed(1)}" r="${big ? 2.4 : 1.4}" fill="currentColor" opacity="${big ? .7 : .45}"/>`; }).join('');
document.getElementById('mound').innerHTML = `<svg width="76" height="20" viewBox="0 0 76 20" aria-hidden="true"><path d="M2 20 C10 6 26 2 38 2 C50 2 66 6 74 20Z" fill="${dark ? '#2C3A5E' : '#E4D9C8'}"/></svg>`;
document.getElementById('glim').innerHTML = DX.char('glim', { mood: 'sleepy', size: 68 });
</script>
</body></html>
