<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>035 Lesson audio</title>
<meta name="motion" content="Art fades up (light: a warm paper-cut dawn with flat paper clouds, the sun low behind Xero, rising between two lifted hill layers) and Xero settles onto his hill in his headphones (900ms), then bobs gently while audio plays; three thin cream sound arcs each side pulse outward (2.4s loop, 220ms apart) for as long as he is reading. The centred title and line arrive, then the scrubber draws from 0:00 to 1:12 over 1.2s with the elapsed time ticking in step, the knob pops on arrival, and the play button bumps into its pause state. The 1x, Transcript and Timer pills arrive together as one row (same icon+label pill): 1x cycles 1x, 1.25x, 1.5x with a selection haptic, Transcript rotates its chevron (250ms) and opens the transcript below (500ms), Timer opens the sleep timer options. The live caption under them shows the line Xero is reading now: three small coral level bars pulse (900ms alternate) and each new spoken line cross-fades in (300ms out, 300ms in). Done listening arrives last (600ms) as an outlined button and stays outlined until 80% has played (2:24 of 3:00), when it cross-fades into the solid primary button (300ms, light haptic), as on the session players.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .art { position: relative; height: 288px; border-radius: 26px; overflow: hidden; margin-top: 4px; }
  .art .scene { position: absolute; inset: 0; }
  .art .fore { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art .hero { position: absolute; left: 50%; top: 116px; margin-left: -60px; }
  .info { margin-top: 18px; display: grid; gap: 4px; justify-items: center; text-align: center; }
  .scrub { margin-top: 14px; }
  .scrub svg { display: block; width: 100%; height: 24px; overflow: visible; }
  .times { display: flex; justify-content: space-between; margin-top: 6px; color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .controls { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 30px; }
  .skip { width: 52px; height: 52px; border-radius: 99px; display: grid; place-items: center; color: var(--fg); position: relative; }
  .skip svg { width: 36px; height: 36px; }
  .skip b { position: absolute; font: 800 13px/1 var(--body); top: 19.5px; left: 0; right: 0; text-align: center; }
  .play-btn { width: 76px; height: 76px; border-radius: 99px; background: var(--btn); color: var(--btn-fg); display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
  .play-btn svg { width: 30px; height: 30px; }
  /* 1x, transcript and the sleep timer share one icon+label pill */
  .pills { margin-top: 16px; display: flex; justify-content: center; gap: 8px; }
  .pill { height: 44px; padding: 0 15px; border-radius: 999px; display: inline-flex; align-items: center; gap: 7px; background: var(--card-2); color: var(--fg); font: 600 15px/1 var(--body); }
  .pill > span { display: inline-flex; }
  .pill svg { width: 18px; height: 18px; }
  .pill .chev { width: auto; height: auto; color: var(--muted); margin-left: -1px; transition: transform 250ms var(--ease); }
  .pill .chev svg { width: 16px; height: 16px; }
  /* live caption: the line Xero is reading now */
  .live { margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .live .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
  .live .eq i { width: 3px; border-radius: 2px; background: var(--mark); height: var(--h); transform-origin: bottom; }
  .play .live .eq i { animation: eq 900ms ease-in-out infinite alternate; animation-delay: var(--ed); }
  @keyframes eq { to { transform: scaleY(.35); } }
  .still .live .eq i { animation: none !important; }
  .live p { white-space: nowrap; color: var(--fg); }
  .dock .btn.ghost { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--fg) 52%, transparent); }
  .fore .arcs path { fill: none; stroke: #FFF8EE; stroke-width: 2; stroke-linecap: round; }
  .play .fore .arcs path { animation: arc 2.4s ease-in-out infinite; animation-delay: var(--ad); }
  @keyframes arc { 0%, 100% { opacity: var(--o); } 30% { opacity: calc(var(--o) * .35); } }
  .still .fore .arcs path { animation: none !important; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close"></button>
    <div class="grow title">Listening</div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll" style="padding-top:104px">
    <div class="pad">
      <div class="art" data-a style="--i:0">
        <div class="scene" id="scene"></div>
        <svg class="fore" viewBox="0 0 346 288" aria-hidden="true" id="fore"></svg>
        <div class="hero" data-settle style="--d:150ms"><div class="bob" id="hero"></div></div>
      </div>
      <div class="info">
        <h1 class="t-title" data-a style="--i:1">The noisy passengers</h1>
        <p class="t-foot muted" data-a style="--i:2">Day 7 lesson · read by Xero</p>
      </div>
      <div class="scrub" data-a style="--i:3">
        <svg viewBox="0 0 346 24" aria-label="1 minute 12 seconds of 3 minutes">
          <line x1="6" y1="12" x2="340" y2="12" stroke="var(--track)" stroke-width="6" stroke-linecap="round"/>
          <path class="draw" d="M6 12H140" stroke="var(--fg)" stroke-width="6" stroke-linecap="round" style="--len:134;--d:300ms;--dur:1200ms"/>
          <circle cx="140" cy="12" r="9" fill="var(--fg)" data-pop style="transform-origin:140px 12px;--d:1400ms"/>
        </svg>
        <div class="times t-cap"><span id="el">1:12</span><span>3:00</span></div>
      </div>
      <div class="controls" data-a style="--i:4">
        <button class="skip" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 107-7H8"/><path d="M10.5 2.5L8 5l2.5 2.5"/></svg><b>15</b></button>
        <button class="play-btn bump" style="--d:1500ms" aria-label="Pause" data-ic="pause"></button>
        <button class="skip" aria-label="Forward 15 seconds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 11-7-7h4"/><path d="M13.5 2.5L16 5l-2.5 2.5"/></svg><b>15</b></button>
      </div>
      <div class="pills" data-a style="--i:5">
        <button class="pill" aria-label="Playback speed 1x"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5a8 8 0 1116 0"/><path d="M12 16.5l4-4.5"/></svg></span>1x</button>
        <button class="pill" aria-expanded="false"><span data-ic="text"></span>Transcript<span class="chev" data-ic="down"></span></button>
        <button class="pill" aria-label="Sleep timer"><span data-ic="moon"></span>Timer</button>
      </div>
      <div class="live" data-a style="--i:6" aria-live="polite">
        <span class="eq" aria-hidden="true"><i style="--h:8px;--ed:0ms"></i><i style="--h:14px;--ed:180ms"></i><i style="--h:10px;--ed:360ms"></i></span>
        <p class="t-foot" id="cap">&ldquo;You decide where the car goes.&rdquo;</p>
      </div>
    </div>
  </div>
  <div class="dock"><button class="btn ghost" data-a style="--i:7">Done listening</button></div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.insertAdjacentHTML('afterbegin', DX.icon(e.dataset.ic, { size: 20, w: e.dataset.ic === 'pause' ? 3.2 : 2.2 })));
  const dark = DX.theme === 'dark';
  /* Light: a warm paper-cut dawn (deep coral to peach sky, soft clouds, the sun low behind Xero rising between two lifted hill
     layers). Dark keeps the kit's pre-dawn night. */
  document.getElementById('scene').innerHTML = dark ? DX.char('horizon', { scene: 'dawn', w: 346, h: 288 }) : `<svg width="346" height="288" viewBox="0 0 346 288" aria-hidden="true">
    <defs><linearGradient id="asky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7E5A"/><stop offset=".6" stop-color="#FFB27A"/><stop offset="1" stop-color="#FFDDB0"/></linearGradient>
      <radialGradient id="ahalo"><stop offset=".35" stop-color="#FFF3C4" stop-opacity=".75"/><stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/></radialGradient>
      <filter id="acsh" x="-20%" y="-30%" width="150%" height="190%"><feDropShadow dx="2" dy="3" stdDeviation="1.4" flood-color="#B4502E" flood-opacity=".2"/></filter>
      <filter id="alift" x="-5%" y="-30%" width="110%" height="160%"><feDropShadow dx="0" dy="-2" stdDeviation="2.6" flood-color="#1A0B2E" flood-opacity=".2"/></filter></defs>
    <rect width="346" height="288" fill="url(#asky)"/>
    <g filter="url(#acsh)" fill="#FFF4E6">${['translate(70 50) scale(1.05)', 'translate(284 40) scale(.72)'].map(t => `<path transform="${t}" d="M-31 9 C-34 1 -26 -5 -18 -2 C-16 -12 -3 -16 4 -8 C8 -15 21 -14 22 -4 C30 -6 35 4 29 9 Z"/>`).join('')}</g>
    <circle cx="173" cy="176" r="130" fill="url(#ahalo)"/>
    <circle cx="173" cy="176" r="72" fill="#FFD86E"/>
    <path filter="url(#alift)" d="M0 190 C50 172 104 176 150 188 C204 202 286 170 346 176 V288 H0z" fill="#FFA06C"/>
    <path filter="url(#alift)" d="M0 220 C64 204 132 212 196 220 C254 227 306 208 346 212 V288 H0z" fill="#FF8558"/>
  </svg>`;
  /* Xero reads the lesson aloud from his own hill: headphones on, thin sound arcs pulsing out from him. */
  const INKP = '#2A2440', phones = `<path d="M33 92 C30 24 170 24 167 92" fill="none" stroke="${INKP}" stroke-width="9" stroke-linecap="round"/>
    <rect x="20" y="74" width="24" height="40" rx="11" fill="${INKP}"/><rect x="156" y="74" width="24" height="40" rx="11" fill="${INKP}"/>
    <rect x="25" y="82" width="7" height="24" rx="3.5" fill="#FFD966"/><rect x="168" y="82" width="7" height="24" rx="3.5" fill="#FFD966"/>`;
  document.getElementById('hero').innerHTML = DX.char('xero', { mood: 'calm', size: 120 }).replace(/(<path d="[^"]*" fill="[^"]*" stroke="#24163A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><\/path>)/, '$1' + phones);
  /* his hill: a paper-cut rise in front of the scene, crest at y 234 where his feet rest */
  const hill = dark ? ['#1A2847', '#111C34'] : ['#E85A3E', '#C2402A'];
  const cx = 173, cy = 172, arc = (r, a, side) => { const t = a * Math.PI / 180, x1 = cx + side * r * Math.cos(t), y1 = cy - r * Math.sin(t), y2 = cy + r * Math.sin(t);
    return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 0 ${side > 0 ? 1 : 0} ${x1.toFixed(1)} ${y2.toFixed(1)}`; };
  document.getElementById('fore').innerHTML = `<defs><filter id="flift" x="-5%" y="-30%" width="110%" height="160%"><feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="#1A0B2E" flood-opacity="${dark ? .5 : .22}"/></filter>
      <radialGradient id="fglow"><stop offset=".15" stop-color="#FFB25E" stop-opacity=".38"/><stop offset="1" stop-color="#FFB25E" stop-opacity="0"/></radialGradient></defs>
    ${dark ? '<circle cx="173" cy="196" r="110" fill="url(#fglow)"/>' : ''}
    <path filter="url(#flift)" d="M0 258 C60 242 120 234 173 234 C228 234 290 244 346 254 V288 H0z" fill="${hill[0]}"/>
    <path filter="url(#flift)" d="M0 276 C80 266 170 272 250 276 C300 278 330 274 346 272 V288 H0z" fill="${hill[1]}"/>
    <g class="arcs">${[[80, 28, .7], [98, 24, .7], [116, 20, .7]].map(([r, a, o], i) =>
    [-1, 1].map(sd => `<path d="${arc(r, a, sd)}" style="--o:${o};opacity:${o};--ad:${i * 220}ms"/>`).join('')).join('')}</g>`;
  const el = document.getElementById('el'), cap = document.getElementById('cap');
  ['&ldquo;Cravings shout and bargain.&rdquo;', '&ldquo;You don\'t have to argue.&rdquo;', '&ldquo;You decide where the car goes.&rdquo;'].forEach((l, i) =>
    DX.after(600 + i * 1400, () => { cap.style.transition = 'opacity 300ms'; cap.style.opacity = 0; setTimeout(() => { cap.innerHTML = l; cap.style.opacity = 1; }, 300); }));
  DX.after(0, () => { el.textContent = '0:00'; });
  DX.after(300, () => { const t0 = performance.now(); const tick = t => { const k = Math.min(1, (t - t0) / 1200), e = 1 - Math.pow(1 - k, 3), s = Math.round(72 * e);
    el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (k < 1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); });
</script>
</body></html>
