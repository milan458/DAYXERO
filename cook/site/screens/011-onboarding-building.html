<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>011 Plan building</title>
<meta name="motion" content="Progress eases 8/11 to 9/11 while the title arrives and Xero settles in beside it. The five plan rows then settle up one by one, 380ms apart (900ms settle each); 450ms after each row lands its tick disc pops and the check draws (420ms) with a light haptic. After the last tick the status line swaps to 'Built from your answers' with a success haptic and the button arrives.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .head { padding: 112px var(--gutter) 0; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 6px; }
  .head .xw { margin: 0 -6px -6px 0; }
  .status { padding: 8px var(--gutter) 0; position: relative; height: 30px; }
  .status p { position: absolute; left: var(--gutter); top: 8px; transition: opacity .4s var(--ease), transform .4s var(--ease); }
  .status .b { opacity: 0; transform: translateY(6px); }
  .status.done .a { opacity: 0; transform: translateY(-6px); }
  .status.done .b { opacity: 1; transform: none; }
  .plan { margin: 14px var(--gutter) 0; display: grid; gap: 8px; }
  .pr { display: flex; align-items: center; gap: 14px; background: var(--card); border-radius: 18px; padding: 12px 14px 12px 14px; min-height: 66px; }
  [data-theme="dark"] .pr { box-shadow: inset 0 0 0 1px var(--line); }
  .pr .grow { flex: 1; min-width: 0; }
  .pr .t-cap { color: var(--muted); display: block; margin-bottom: 3px; font-size: 12.5px; }
  .pr .t-head { font-size: 17px; }
  .pr .ico-tile { width: 38px; height: 38px; }
  .pr .ico-tile svg { width: 20px; height: 20px; }
  .pr .tk { flex: none; width: 28px; height: 28px; }
  .pr.reason .t-head { font: italic 500 16px/1.35 var(--body); letter-spacing: 0; }
</style>
</head><body>
<div class="screen" data-ground="mint">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:81.8%"></i></div></div>
    <div class="avatar" id="av"></div>
  </div>

  <div class="head">
    <h1 class="t-large" data-a>Your plan, built around you</h1>
    <div class="xw" data-settle style="--d:200ms"><div class="bob" id="xero"></div></div>
  </div>
  <div class="status" id="status" data-a style="--i:1">
    <p class="t-foot muted a">Putting the pieces together</p>
    <p class="t-foot b"><b>Built from your answers.</b> Five pieces, all yours.</p>
  </div>

  <div class="plan" id="plan"></div>

  <div class="dock">
    <button class="btn" data-a style="--d:2500ms">See my plan</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  document.getElementById('av').innerHTML = DX.char('xero', { mood: 'hello', size: 40 });
  document.getElementById('xero').innerHTML = DX.char('xero', { mood: 'cheer', size: 88 });
  const rows = [
    ['calendar', 'Prep week', 'Fri, Oct 30 to Thu, Nov 5'],
    ['flag', 'Quit Day', 'Fri, Nov 6'],
    ['wave', 'Waves to watch', 'Coffee and Stress'],
    ['shield', 'Watch out for', 'Cravings and Stress'],
    ['heart', 'Your reason', '"Run with Aria without stopping to catch my breath"']
  ];
  const flag = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"/></svg>';
  document.getElementById('plan').innerHTML = rows.map(([ic, k, v], i) => {
    const t = 450 + i * 380;
    return `<div class="pr ${i === 4 ? 'reason' : ''}" data-settle style="--i:0;--d:${t}ms">
      <span class="ico-tile">${ic === 'flag' ? flag : DX.icon(ic)}</span>
      <div class="grow"><span class="t-cap">${k}</span><p class="t-head">${v}</p></div>
      <span class="tk">${DX.check({ size: 28, d: t + 450 })}</span></div>`;
  }).join('');
  const bar = document.getElementById('bar'), st = document.getElementById('status');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '72.7%'); void bar.offsetWidth; bar.style.transition = ''; st.classList.remove('done'); });
  DX.after(250, () => bar.style.setProperty('--p', '81.8%'));
  DX.after(2500, () => st.classList.add('done')); DX.onStill(() => st.classList.add('done'));
</script>
</body></html>
