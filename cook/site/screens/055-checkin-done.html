<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>055 Check-in done</title>
<meta name="motion" content="Done beat, kept dim. The night sky fades in (700ms); Glim (cheer) settles in beside the empty badge spot (900ms) then bobs. At 1.1s the 7-night badge stamps in large (168px) inside its sun-gold ring (620ms spring, medium haptic) and at 1.75s a shine sweeps across it once. The small check by 'Check-in saved' pops and draws (success haptic), the title arrives with the underline under 'well', the nights count rolls 6 to 7 with a '+1' floating up, and the next-badge bar sweeps to 50%. Good night arrives last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 400px; }
  .hero { position: absolute; left: 0; right: 0; top: 120px; height: 190px; }
  .bdg { position: absolute; left: 76px; top: 0; width: 168px; height: 168px; border-radius: 99px; box-shadow: 0 0 0 4px var(--g), 0 0 0 7px var(--sun); }
  .bdg-in { width: 168px; height: 168px; border-radius: 99px; }
  .glim { position: absolute; left: 248px; top: 66px; width: 124px; height: 124px; }
  .body { position: absolute; left: 0; right: 0; top: 348px; padding: 0 var(--gutter); }
  .saved { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
  .saved .ck { width: 22px; height: 22px; flex: none; }
  .body h1 { margin-top: 8px; text-align: center; }
  .counts { margin-top: 26px; }
  .counts .stat { display: grid; gap: 4px; padding: 16px; }
  .cnt { display: flex; align-items: baseline; gap: 6px; position: relative; }
  .cnt .num { font-size: 36px; line-height: 1; }
  .cnt .u { font: 600 15px/1 var(--body); color: var(--muted); }
  .plus { position: absolute; left: 30px; top: -14px; font: 800 16px/1 var(--display); color: var(--tick); opacity: 0; }
  .counts .t-foot { color: var(--muted); }
  .counts .progress { height: 6px; margin-top: 6px; }
  .calm { margin-top: 14px; }
  .calm .t-foot { color: var(--muted); }
</style>
</head><body>
<div class="screen" data-ground="night" data-status="on-art">
  <div class="sky" id="sky" data-fade></div>
  <div class="hero">
    <div class="bdg" data-stamp style="--d:1100ms"><div class="bdg-in shine" id="badge" style="--d:1750ms"></div></div>
    <div class="glim" data-settle style="--i:1"><div class="bob" id="glim"></div></div>
  </div>
  <div class="nav"><button class="icon-btn" aria-label="Close" data-ic="close"></button></div>
  <div class="body">
    <p class="t-foot saved" data-a style="--i:2"><span class="ck" id="check"></span>Check-in saved. 7 nights badge earned.</p>
    <h1 class="t-large" data-a style="--i:3">Rest <span class="mark">well</span>, Sam. See you tomorrow.</h1>
    <div class="grid2 counts" data-a style="--i:4">
      <div class="stat">
        <div class="cnt"><span class="num" data-count="7" data-from="6" data-delay="1100" data-dur="500">7</span><span class="u">nights</span><span class="plus float-up" style="--d:1150ms">+1</span></div>
        <p class="t-foot">checked in with Glim</p>
      </div>
      <div class="stat">
        <div class="cnt"><span class="num">14</span><span class="u">nights</span></div>
        <p class="t-foot">next badge, 7 to go</p>
        <span class="progress" style="--p:50%"><i></i></span>
      </div>
    </div>
    <div class="list calm" data-a style="--i:5">
      <div class="row"><span class="ico-tile" data-ic="moon"></span><div class="grow"><p class="t-head" style="font-size:16px">If tonight feels restless</p><p class="t-foot">Slow breathing with Glim, 3 min</p></div><span class="chev" data-ic="chev"></span></div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:6" data-go="016-today-quit">Good night</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  document.getElementById('sky').innerHTML = DX.nightSky({ w: 390, h: 400, moonX: 330, moonY: 92 });
  document.getElementById('glim').innerHTML = DX.char('glim', { mood: 'cheer', size: 124 });
  document.getElementById('check').innerHTML = DX.check({ size: 22, d: 900 });
  document.getElementById('badge').innerHTML = DX.badge({ kind: 'night', n: 7, size: 168, bare: true, label: '7 nights' });
</script>
</body></html>
