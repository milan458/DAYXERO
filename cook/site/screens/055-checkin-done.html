<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>055 Check-in done</title>
<meta name="motion" content="Done beat, kept dim. The night sky fades in; Glim (cheer) settles in (900ms) and the green check pops at its side and draws (500ms in, success haptic). Title arrives. The evening count rolls 6 to 7 (from 1.1s) with a small '+1' floating up, then the 7-night badge stamps in (620ms spring, medium haptic) and a shine sweeps across it once. Good night arrives last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 330px; }
  .glim { position: absolute; left: 50%; top: 108px; width: 160px; height: 160px; margin-left: -80px; }
  .ck { position: absolute; left: calc(50% + 40px); top: 214px; width: 52px; height: 52px; border-radius: 99px; box-shadow: 0 0 0 4px var(--g); }
  .body { position: absolute; left: 0; right: 0; top: 304px; padding: 0 var(--gutter); text-align: center; }
  .body .day { color: var(--muted); }
  .body h1 { margin-top: 6px; }
  .earn { margin-top: 24px; text-align: left; display: flex; gap: 16px; align-items: center; padding: 16px 18px; }
  .bdg { width: 84px; height: 84px; border-radius: 99px; flex: none; }
  .earn .lbl { color: var(--muted); }
  .cnt { display: flex; align-items: baseline; gap: 8px; position: relative; }
  .cnt .num { font-size: 40px; line-height: 1.05; }
  .cnt .of { font: 600 15px/1 var(--body); color: var(--muted); }
  .plus { position: absolute; left: 28px; top: -12px; font: 800 16px/1 var(--display); color: var(--tick); opacity: 0; }
  .next { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); }
  .calm { margin-top: 18px; text-align: left; }
  .calm .t-foot { color: var(--muted); }
  .next .progress { flex: 1; margin-right: 12px; height: 6px; }
</style>
</head><body>
<div class="screen" data-ground="night" data-status="on-art">
  <div class="sky" id="sky" data-fade></div>
  <div class="glim" id="glim" data-settle></div>
  <div class="ck" id="check"></div>
  <div class="nav"><button class="icon-btn" aria-label="Close" data-ic="close"></button></div>
  <div class="body">
    <p class="t-foot day" data-a style="--i:2">Check-in saved</p>
    <h1 class="t-large" data-a style="--i:3">Rest well, Sam. See you tomorrow.</h1>
    <div class="card earn" data-a style="--i:4">
      <div class="bdg shine" id="badge" data-stamp style="--d:1500ms"></div>
      <div class="grow">
        <p class="t-foot lbl">Evening check-ins</p>
        <div class="cnt"><span class="num" data-count="7" data-from="6" data-delay="1100" data-dur="500">7</span><span class="of">nights</span><span class="plus float-up" style="--d:1150ms">+1</span></div>
        <p class="t-foot">New badge, earned tonight</p>
      </div>
    </div>
    <div class="t-cap next" data-a style="--i:6"><span class="progress" style="--p:50%"><i></i></span><span>Next badge at 14 nights</span></div>
    <div class="list calm" data-a style="--i:7">
      <div class="row"><span class="ico-tile" data-ic="play"></span><div class="grow"><p class="t-head" style="font-size:16px">If tonight feels restless</p><p class="t-foot">Slow breathing with Glim, 3 min</p></div><span class="chev" data-ic="chev"></span></div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:8">Good night</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  document.getElementById('sky').innerHTML = DX.nightSky({ w: 390, h: 330, moonX: 326, moonY: 104 });
  document.getElementById('glim').innerHTML = DX.char('glim', { mood: 'cheer', size: 160 });
  document.getElementById('check').innerHTML = DX.check({ size: 52, d: 500 });
  document.getElementById('badge').innerHTML = DX.badge({ kind: 'night', n: 7, size: 84, bare: true, label: '7 nights' });
</script>
</body></html>
