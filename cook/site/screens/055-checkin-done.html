<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>055 Check-in done</title>
<meta name="motion" content="Done beat, kept dim. The night sky fades in (700ms); Glim (cheer) settles onto the hill at the badge's lower right (900ms) then bobs, one soft shadow under both. At 1.1s the 7-night badge stamps in (156px) inside its sun-gold ring (620ms spring, medium haptic), a '+1' floats up from it, and at 1.75s a shine sweeps across it once. The small check by 'Check-in saved' pops and draws (success haptic), the title arrives with the underline under 'well', then the next-badge bar sweeps from 0 to 50% across the full card width (900ms) and the calm row arrives. Good night arrives last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 440px; }
  .hero { position: absolute; left: 0; right: 0; top: 150px; height: 210px; }
  .shadow { position: absolute; left: 92px; top: 178px; width: 236px; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(4,8,20,.55), rgba(4,8,20,0)); }
  .bdg { position: absolute; left: 105px; top: 0; width: 156px; height: 156px; border-radius: 99px; box-shadow: 0 0 0 5px #F2C14E, 0 0 0 9px #B98A2A, 0 10px 30px rgba(0,0,0,.35); }
  .bdg-in { width: 156px; height: 156px; border-radius: 99px; overflow: hidden; }
  .plus { position: absolute; left: 230px; top: -8px; font: 800 18px/1 var(--display); color: #FFD37A; opacity: 0; }
  .glim { position: absolute; left: 226px; top: 76px; width: 116px; height: 116px; }
  .body { position: absolute; left: 0; right: 0; top: 400px; padding: 0 var(--gutter); }
  .saved { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
  .saved .ck { width: 22px; height: 22px; flex: none; }
  .body h1 { margin-top: 8px; text-align: center; }
  .next { margin-top: 26px; display: grid; gap: 12px; padding: 18px; }
  .next .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .next .t-head { font-size: 17px; }
  .next .t-foot { color: var(--muted); }
  .next .progress { height: 8px; }
  .play .next .progress > i { animation: sweep 900ms var(--settle) 1300ms both; }
  @keyframes sweep { from { width: 0; } }
  .calm { margin-top: 12px; }
  .calm .t-foot { color: var(--muted); }
</style>
</head><body>
<div class="screen" data-ground="night" data-status="on-art">
  <div class="sky" id="sky" data-fade></div>
  <div class="hero">
    <div class="shadow" data-fade style="--d:400ms"></div>
    <div class="bdg" data-stamp style="--d:1100ms"><div class="bdg-in shine" id="badge" style="--d:1750ms"></div></div>
    <span class="plus float-up" style="--d:1250ms">+1</span>
    <div class="glim" data-settle style="--i:1"><div class="bob" id="glim"></div></div>
  </div>
  <div class="nav"><button class="icon-btn" aria-label="Close" data-ic="close"></button></div>
  <div class="body">
    <p class="t-foot saved" data-a style="--i:2"><span class="ck" id="check"></span>Check-in saved. New badge earned.</p>
    <h1 class="t-large" data-a style="--i:3">Rest <span class="mark">well</span>, Sam. See you tomorrow.</h1>
    <div class="card next" data-a style="--i:4">
      <div class="top"><p class="t-head">Next badge: 14 nights</p><p class="t-foot">Halfway</p></div>
      <span class="progress" style="--p:50%"><i></i></span>
    </div>
    <div class="list calm" data-a style="--i:5">
      <div class="row"><span class="ico-tile" data-ic="moon"></span><div class="grow"><p class="t-head" style="font-size:16px">If tonight feels restless</p><p class="t-foot">Slow breathing with Glim, 3 min</p></div><span class="chev" data-ic="chev"></span></div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:6" data-go="016-today-quit">Good night</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  document.getElementById('sky').innerHTML = DX.nightSky({ w: 390, h: 440, moonX: 336, moonY: 96 });
  document.getElementById('glim').innerHTML = DX.char('glim', { mood: 'cheer', size: 116 });
  document.getElementById('check').innerHTML = DX.check({ size: 22, d: 900 });
  document.getElementById('badge').innerHTML = DX.badge({ kind: 'night', n: 7, size: 156, bare: true, label: '7 nights' });
  /* give the numeral room: the badge's crescent moon moves up and out, a little smaller */
  (function () {
    const b = document.querySelector('#badge svg'); if (!b) return;
    b.querySelectorAll('circle').forEach(c => {
      const r = c.getAttribute('r');
      if (r === '11' && c.getAttribute('cx') === '70') { c.setAttribute('cx', '70'); c.setAttribute('cy', '26'); c.setAttribute('r', '8'); }
      if (r === '10' && c.getAttribute('cx') === '64') { c.setAttribute('cx', '66'); c.setAttribute('cy', '23'); c.setAttribute('r', '7.2'); }
    });
  })();
</script>
</body></html>
