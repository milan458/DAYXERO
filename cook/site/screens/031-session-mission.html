<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>031 Session mission</title>
<meta name="motion" content="The full bar and the heading arrive (600ms). The honey mission card, the one hero, rises in (settle 900ms); Xero climbs up behind it, his head rising over the top edge (settle 900ms at 360ms), then his two hands land on the edge in front of the card (spring 420ms at 1150ms, light haptic) and he blinks. The card's label, line and note arrive inside it (600ms, 90ms stagger), then what you learned arrives row by row (600ms, 90ms apart), and the log link and button arrive last in the dock.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.top{position:absolute;top:114px;left:var(--gutter);right:var(--gutter)}
/* the mission: honey in both modes (today's one celebration of intent), ink type; dark mode is a deeper honey, never a glare */
.mission{position:absolute;z-index:2;top:236px;left:var(--gutter);right:var(--gutter);border-radius:28px;padding:22px 22px 24px;
  --ink:#1E1A3A;--soft:#4F400C;background:linear-gradient(165deg,#FFEDB0 0%,#FFE08A 55%,#FFD966 100%);color:var(--ink);box-shadow:0 16px 32px rgba(120,90,10,.16)}
[data-theme="dark"] .mission{--soft:#3A2A06;background:linear-gradient(165deg,#EDBF63 0%,#E0A847 55%,#D69A38 100%);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.mission .lab{font:600 15px/1 var(--body);color:var(--soft)}
.mission h2{margin-top:12px;font-size:34px}
.mission .t-body{margin-top:8px;color:var(--soft)}
/* Xero climbs up behind the card: head over the edge, hands in front of it (same 136px drawing, two layers; the edge crosses him at y=112 of 200) */
.peek,.hands{position:absolute;left:206px;top:160px;width:136px;height:136px;pointer-events:none}
.peek{z-index:1}
.hands{z-index:3}
.peek svg > g[stroke]{display:none}
.learn{position:absolute;top:426px;left:var(--gutter);right:var(--gutter)}
.learn ul{margin:6px 0 0;padding:0;list-style:none}
.learn li{padding:12px 0;border-top:1px solid var(--line)}
.learn li:first-child{border-top:0}
.learn li .t-foot{color:var(--muted)}
.logl{gap:6px}
.logl svg{width:16px;height:16px}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="All 5 cards played"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div></div>
  </div>
  <div class="top">
    <h1 class="t-title" data-a style="--i:0">Your mission for today</h1>
  </div>
  <div class="peek" data-settle style="--i:3" id="mx"></div>
  <div class="mission" data-settle style="--i:0">
    <p class="lab" data-a style="--i:2">Whenever stress hits</p>
    <h2 class="t-large" data-a style="--i:3">Two sighs first.</h2>
    <p class="t-body" data-a style="--i:4">Then, if you still want one, that's okay.</p>
  </div>
  <div class="hands" data-pop style="--d:1150ms;transform-origin:68px 76px" id="hands"></div>
  <div class="learn">
    <h2 class="t-head" data-a style="--i:6">What you learned today</h2>
    <ul>
      <li data-a style="--i:7"><p class="t-foot">Stress and the gap feel the same in your body.</p></li>
      <li data-a style="--i:8"><p class="t-foot">A cigarette eases the gap it made, not the day.</p></li>
      <li data-a style="--i:9"><p class="t-foot">People who quit tend to feel less stressed, not more.</p></li>
    </ul>
  </div>
  <div class="dock">
    <button class="link logl" data-a style="--i:10">If you do use, log it tonight<span id="l-chev"></span></button>
    <button class="btn" data-a style="--i:11">I'll try it</button>
  </div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('l-chev').innerHTML = DX.icon('chev', {size:16, w:2.6});
/* the card's top edge crosses Xero at y=112 of his 200 drawing: eyes, cheeks and smile stay above it, his arms stay behind it */
document.getElementById('mx').innerHTML = DX.char('xero', {mood:'hello', size:136});
/* his two hands, gripping the edge in front of the card */
const hand = (x, flip) => `<g transform="translate(${x} 112) scale(${flip ? -1 : 1} 1)"><path d="M-17 0 C-17 -10 -9 -14 0 -14 C9 -14 17 -10 17 0 C17 8 11 12 0 12 C-11 12 -17 8 -17 0Z" fill="#FF7155"/>
  <path d="M-17 0 C-17 8 -11 12 0 12 C11 12 17 8 17 0 C14 5 8 7 0 7 C-8 7 -14 5 -17 0Z" fill="#E85A3E"/>
  <path d="M-6 -2 V5 M3 -2 V5" stroke="#C9542F" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M-10 -8 C-7 -11 -3 -12 1 -12" fill="none" stroke="#FFB09C" stroke-width="3" stroke-linecap="round"/></g>`;
document.getElementById('hands').innerHTML = `<svg width="136" height="136" viewBox="0 0 200 200" aria-hidden="true">${hand(52, false)}${hand(148, true)}</svg>`;
</script>
</body></html>
