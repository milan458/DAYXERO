<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>030 Session breathe card</title>
<meta name="motion" content="The sky card settles in (900ms); its breath shape draws in (two in, one long out, 1600ms) and the dot pops at the top; the guided-breath progress line draws from 0 to the playhead (1400ms, 0:43 of 3:00). The three short steps arrive one by one (600ms, 90ms stagger) so reading paces itself. No haptic until the button.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.f-apricot{--face:#FFC38A}.f-sky{--face:#9CCBFF}.f-mint{--face:#9FE3BC}.f-sun{--face:#FFD966}
.pips{display:flex;gap:8px;justify-content:center;align-items:center}
.pips i{width:20px;height:26px;border-radius:6px;background:var(--track);box-shadow:inset 0 0 0 1.5px var(--line)}
.pips i.done{background:#FFD966 url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 26%27%3E%3Cpath d=%27M6 13.5l3 3 5.5-6%27 fill=%27none%27 stroke=%27%231E1A3A%27 stroke-width=%272.2%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E") center/100% 100% no-repeat;box-shadow:none}
.pips i.now{background:var(--card);box-shadow:inset 0 0 0 2.5px var(--fg)}
.nav .side{width:44px;text-align:right;flex:none}
.face{background:var(--face);color:#1E1A3A;border-radius:26px;overflow:hidden;box-shadow:0 14px 28px rgba(60,40,20,.14)}
[data-theme="dark"] .face{box-shadow:0 18px 34px rgba(0,0,0,.4)}
.face .art{height:136px;overflow:hidden}
.face .in{padding:16px 20px 18px}
.kind{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--body);opacity:.78}
.kind svg{width:18px;height:18px}
.player{display:flex;align-items:center;gap:14px;margin-top:16px}
.pbtn{width:52px;height:52px;border-radius:99px;background:#1E1A3A;color:#FFF8EE;display:grid;place-items:center;flex:none;box-shadow:0 4px 0 rgba(30,26,58,.2)}
.pbtn svg{width:22px;height:22px}
.line{flex:1;display:grid;gap:6px}
.line svg{display:block;overflow:visible}
.times{display:flex;justify-content:space-between}
.times .t-cap{opacity:.72}
.beats{display:grid;gap:24px;margin-top:30px}
.beat{display:grid;gap:4px;padding-left:16px;border-left:3px solid #9CCBFF}
.beat h3{font:800 19px/1.25 var(--display);letter-spacing:-.2px;margin:0}
.beat .t-body{font-size:16px;line-height:1.5;color:var(--muted)}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="pips"><i class="done"></i><i class="now"></i><i></i><i></i><i></i></div></div>
    <span class="side t-foot muted">2 of 5</span>
  </div>
  <div class="scroll" style="padding-top:112px">
    <div class="pad">
      <div class="face f-sky" data-settle style="--i:0">
        <div class="art" id="art"></div>
        <div class="in">
          <div class="kind"><span id="k-ic"></span>Try · 5 min</div>
          <h1 class="t-title" style="margin-top:10px">A breath that works in the moment</h1>
          <div class="player">
            <button class="pbtn" id="pbtn" aria-label="Play"></button>
            <div class="line">
              <svg width="100%" height="12" viewBox="0 0 230 12" preserveAspectRatio="none">
                <path d="M2 6H228" stroke="#1E1A3A" stroke-opacity=".2" stroke-width="4" stroke-linecap="round"/>
                <path d="M2 6H60" stroke="#1E1A3A" stroke-width="4" stroke-linecap="round" class="draw" style="--len:60;--d:500ms;--dur:1400ms"/>
              </svg>
              <div class="times"><span class="t-cap">0:43</span><span class="t-cap">3:00</span></div>
            </div>
          </div>
        </div>
      </div>
      <div class="beats">
        <div class="beat" data-a style="--i:3"><h3>Two in, one long out</h3><p class="t-body">Breathe in, sip in a little more, then a long slow out.</p></div>
        <div class="beat" data-a style="--i:4"><h3>In a tense moment</h3><p class="t-body">Two or three sighs take thirty seconds.</p></div>
        <div class="beat" data-a style="--i:5"><h3>Feeling light-headed?</h3><p class="t-body">Breathe normally, then rejoin.</p></div>
      </div>
    </div>
  </div>
  <div class="dock"><button class="btn" data-a style="--i:7">I'll sigh first today</button></div>
</div>
<script>
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('k-ic').innerHTML = DX.icon('hand', {size:18});
document.getElementById('pbtn').innerHTML = DX.icon('pause', {size:22, w:3});
/* one colour field: the breath shape drawn in the card's own sky blue (two in, one long out) */
document.getElementById('art').innerHTML = `<svg width="100%" height="136" viewBox="0 0 346 136" preserveAspectRatio="none" aria-hidden="true">
  <defs><linearGradient id="bsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9E3FF"/><stop offset="1" stop-color="#9CCBFF"/></linearGradient></defs>
  <rect width="346" height="136" fill="url(#bsky)"/>
  <path d="M0 112 C60 104 120 118 190 110 S300 102 346 108 V136 H0z" fill="#86BDF8" opacity=".55"/>
  <path d="M26 104 C54 104 70 56 98 56 C112 56 120 50 128 42 C134 36 140 32 150 32 C206 32 262 104 322 104" fill="none" stroke="#1E1A3A" stroke-opacity=".75" stroke-width="3.5" stroke-linecap="round" class="draw" style="--len:380;--d:400ms;--dur:1600ms"/>
  <circle cx="150" cy="32" r="7" fill="#1E1A3A" data-pop style="transform-origin:150px 32px;--d:1900ms"/>
  <text x="62" y="46" font-family="DM Sans, sans-serif" font-weight="700" font-size="13" fill="#1E1A3A" fill-opacity=".72" text-anchor="middle">In</text>
  <text x="150" y="22" font-family="DM Sans, sans-serif" font-weight="700" font-size="13" fill="#1E1A3A" fill-opacity=".72" text-anchor="middle">A little more</text>
  <text x="282" y="52" font-family="DM Sans, sans-serif" font-weight="700" font-size="13" fill="#1E1A3A" fill-opacity=".72" text-anchor="middle">Long, slow out</text></svg>`;
</script>
</body></html>
