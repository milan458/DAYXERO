<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>054 Evening check-in</title>
<meta name="motion" content="Dim and slow, no springs. The night sky fades in (700ms) with stars twinkling and fireflies drifting; Glim settles in (900ms) then bobs. The date line, title, day choice, SOS row and the four faces arrive in order (600ms, 90ms stagger); the '3' in the SOS row counts up. At 1.6s 'Good' fills in with a soft selection haptic. Save arrives last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 320px; }
  .glim { position: absolute; left: 50%; top: 104px; width: 140px; height: 140px; margin-left: -70px; }
  .body { position: absolute; left: 0; right: 0; top: 296px; padding: 0 var(--gutter); }
  .body .day { color: var(--muted); }
  .body h1 { margin-top: 4px; }
  .body .lead { margin-top: 6px; color: var(--muted); }
  .daypick { margin-top: 16px; }
  .daypick .chip { justify-content: center; }
  .sos { margin-top: 10px; }
  .sos .row { padding: 8px 16px; min-height: 60px; }
  .sos .t-foot { color: var(--muted); }
  .sos .edit { font: 600 15px/1 var(--body); color: var(--fg); opacity: .85; padding: 8px 0 8px 8px; }
  .feel { margin-top: 18px; }
  .feel > .t-head { font-size: 17px; margin-bottom: 10px; }
  .faces { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .faces .chip { height: 74px; flex-direction: column; justify-content: center; gap: 6px; padding: 0; font-size: 14px; }
  .faces .chip.on::before { display: none; }
  .faces .chip svg { width: 28px; height: 28px; }
</style>
</head><body>
<div class="screen" data-ground="night" data-status="on-art">
  <div class="sky" id="sky" data-fade></div>
  <div class="glim" data-settle style="--i:1"><div class="bob" id="glim"></div></div>
  <div class="nav"><button class="icon-btn" aria-label="Close" data-ic="close"></button></div>
  <div class="body">
    <p class="t-foot day" data-a style="--i:2">Friday check-in, Day 7</p>
    <h1 class="t-title" data-a style="--i:3">3 of 3 waves. All yours.</h1>
    <p class="t-foot lead" data-a style="--i:4">Each one you ride out makes the next a little quieter.</p>
    <div class="grid2 daypick" data-a style="--i:5"><button class="chip on">Clear day</button><button class="chip">Had a slip</button></div>
    <div class="list sos" data-a style="--i:6">
      <div class="row"><span class="ico-tile" data-ic="wave"></span><div class="grow"><p class="t-head" style="font-size:16px">Today's SOS</p><p class="t-foot"><span data-count="3">3</span> waves ridden out</p></div><button class="edit">Edit</button></div>
    </div>
    <div class="feel" data-a style="--i:7">
      <p class="t-head">How are you feeling tonight?</p>
      <div class="faces" id="faces">
        <button class="chip" data-f="rough">Rough</button>
        <button class="chip" data-f="okay">Okay</button>
        <button class="chip on" id="good" data-f="good">Good</button>
        <button class="chip" data-f="proud">Proud</button>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:8" data-go="055-checkin-done">Save and rest</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  document.getElementById('sky').innerHTML = DX.nightSky({ w: 390, h: 320, moonX: 318, moonY: 104 });
  document.getElementById('glim').innerHTML = DX.char('glim', { mood: 'calm', size: 140 });
  const M = { rough: 'M8.5 16.5c1.9-1.8 5.1-1.8 7 0', okay: 'M9 15.5h6', good: 'M8.5 14.5c1.9 1.9 5.1 1.9 7 0', proud: 'M8 13.5h8c0 2.4-1.8 4-4 4s-4-1.6-4-4z' };
  document.querySelectorAll('[data-f]').forEach(b => b.insertAdjacentHTML('afterbegin',
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9 9.8v.4M15 9.8v.4" stroke-width="2.6"/><path d="${M[b.dataset.f]}"/></svg>`));
  const good = document.getElementById('good');
  DX.after(0, () => good.classList.remove('on'));
  DX.after(1600, () => good.classList.add('on'));
</script>
</body></html>
