<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>020 Craving passed</title>
<meta name="motion" content="The completion beat, gentle. The pacer ring from SOS closes: a cream arc draws all the way round (900ms), and where it meets, a small sun disc fades in on the ring and its check draws (420ms). Jelli settles in cheering (900ms, one soft hop). Title and line fade up; at 900ms the wave count rolls from 22 to 23 while a '+1' floats up beside it (spring, the only one on the screen). At 1.3s the 25-wave medallion fades in (700ms, no spring) and the 23rd of its 25 rim segments lights (400ms), leaving a short gap of two while '2 more to your 25-wave badge' settles under it. The button and the quiet 'What set it off?' text button arrive last (it opens the optional trigger sheet). Success haptic with the +1.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .screen { --muted: #F3EEE6; }
  .hero { position: absolute; left: 0; right: 0; top: 72px; display: grid; place-items: center; }
  .hero .disc { position: relative; width: 232px; height: 232px; display: grid; place-items: center; }
  .hero .disc svg.pacer { position: absolute; inset: 0; overflow: visible; }
  .hero .closed { filter: drop-shadow(0 0 8px rgba(255,248,238,.35)); }
  /* the check is drawn on the ring itself: a sun disc where the arc closes, an ink tick */
  .hero .ck { position: absolute; left: 116px; top: 3px; width: 44px; height: 44px; margin-left: -22px; }
  .play .hero .ck circle { animation: dx-fade 500ms var(--ease) 900ms both; }
  .txt { position: absolute; left: 0; right: 0; top: 322px; padding: 0 20px; text-align: center; }
  .txt .t-body { margin-top: 8px; color: var(--muted); }
  .txt .t-body span { display: block; white-space: nowrap; }
  .stack2 { position: absolute; left: 0; right: 0; top: 446px; padding: 0 var(--gutter); }
  .waves { display: flex; flex-wrap: wrap; align-items: center; gap: 0 18px; padding: 16px 20px 0 16px; }
  .waves .grow { flex: 1; min-width: 0; }
  .waves .big { display: flex; align-items: flex-start; gap: 6px; }
  .waves .big .num { font-size: 40px; line-height: 1; letter-spacing: -1.2px; }
  .waves .plus { font: 800 16px/1 var(--display); color: var(--sun); margin-top: 2px; }
  .waves .t-foot { color: var(--muted); margin-top: 4px; }
  .waves .medal { position: relative; width: 124px; height: 124px; flex: none; }
  .waves .medal .ticks { position: absolute; inset: 0; overflow: visible; }
  .waves .medal .mm { position: absolute; inset: 15px; filter: drop-shadow(0 3px 6px rgba(6,16,50,.35)); }
  .play .waves .medal .t23 { animation: lit 400ms var(--ease) 1700ms both; }
  @keyframes lit { from { stroke-opacity: .22; } }
  .togo { flex: 0 0 calc(100% + 36px); margin: 14px -20px 0 -16px; padding: 13px 0 14px; border-top: 1px solid var(--line); text-align: center; color: var(--fg); font: 600 15px/1.3 var(--body); white-space: nowrap; }
  .dock .why { display: flex; justify-content: center; margin-top: 2px; }
  .dock .why .link { color: rgba(255,255,255,.8); opacity: 1; font-size: 15px; font-weight: 600; text-decoration: none; }
</style>
</head><body>
<div class="screen" data-ground="ocean">
  <div class="hero">
    <div class="disc">
      <svg class="pacer" viewBox="0 0 232 232" aria-hidden="true">
        <circle cx="116" cy="116" r="98" fill="currentColor" fill-opacity=".06"/>
        <circle cx="116" cy="116" r="113" fill="none" stroke="currentColor" stroke-opacity=".18" stroke-width="3"/>
        <g class="closed"><circle class="draw" cx="116" cy="116" r="113" fill="none" stroke="#FFF8EE" stroke-width="3" stroke-linecap="round" transform="rotate(-90 116 116)" style="--len:710;--dur:900ms"/></g>
      </svg>
      <div id="jelli" data-settle style="--d:250ms"></div>
      <svg class="ck" viewBox="0 0 44 44" aria-label="Done">
        <circle cx="22" cy="22" r="19" fill="#FFD966" stroke="#1F3C8C" stroke-width="3"/>
        <path d="M13.5 22.5l5.5 5.5 11.5-12" fill="none" stroke="#1E1A3A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" class="draw" style="--len:28;--d:1150ms;--dur:420ms"/>
      </svg>
    </div>
  </div>

  <div class="txt">
    <h1 class="t-large" data-a style="--i:2">You rode it <span class="mark">out</span></h1>
    <p class="t-body" data-a style="--i:3"><span>3 minutes 12 seconds, start to finish.</span> <span>Each one you ride makes the next quieter.</span></p>
  </div>

  <div class="stack2">
    <div class="card waves" data-a style="--i:4">
      <div class="medal" data-fade style="--d:1300ms" aria-label="23 of 25 waves toward the 25-wave badge"><svg class="ticks" id="ticks" viewBox="0 0 124 124"></svg><div class="mm" id="bd"></div></div>
      <div class="grow">
        <div class="big"><span class="num" data-count="23" data-from="22" data-delay="900" data-dur="500">23</span><span class="plus float-up" style="--d:900ms">+1</span></div>
        <p class="t-foot">waves ridden out</p>
        <p class="t-foot" style="margin-top:0">3 today</p>
      </div>
      <p class="togo" data-a style="--i:5">2 more to your 25&#8209;wave badge</p>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:6" data-go="016-today-quit">Back to my day</button>
    <div class="why" data-a style="--i:7"><button class="link" id="why">What set it off?</button></div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#jelli').innerHTML = DX.char('jelli', { mood: 'cheer', size: 190 });
  $('#bd').innerHTML = DX.badge({ kind: 'wave', n: 25, size: 94, bare: true, label: '25 waves' });
  /* the 23-of-25 arc: 25 short rim segments round the medallion, 23 lit cream, 2 still to ride */
  let t = '';
  const c = 62, r = 58, step = 2 * Math.PI / 25, gap = .055;
  for (let i = 0; i < 25; i++) {
    const a0 = -Math.PI / 2 + i * step + gap, a1 = -Math.PI / 2 + (i + 1) * step - gap;
    const p = a => `${(c + r * Math.cos(a)).toFixed(2)} ${(c + r * Math.sin(a)).toFixed(2)}`;
    t += `<path ${i === 22 ? 'class="t23"' : ''} d="M${p(a0)} A${r} ${r} 0 0 1 ${p(a1)}" fill="none" stroke="#FFF8EE" stroke-opacity="${i < 23 ? 1 : .22}" stroke-width="6" stroke-linecap="round"/>`;
  }
  $('#ticks').innerHTML = t;
  DX.after(2700, () => { $('#jelli').innerHTML = DX.char('jelli', { mood: 'cheer', size: 190, animate: false }); });
</script>
</body></html>
