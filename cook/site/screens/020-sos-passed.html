<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>020 Craving passed</title>
<meta name="motion" content="The completion beat, gentle. A check draws on the pacer ring (420ms), then Jelli settles in cheering (900ms, one soft hop). Title and line fade up; at 900ms the wave count rolls from 22 to 23 while a '+1' floats up beside it (spring, the only one on the screen). At 1.3s the 25-wave medallion fades in with its full rim (700ms, no spring) and the progress ring around it creeps from 22 to 23 of 25 while '2 more for your 25-wave badge' settles under the count. The button and the quiet 'What set it off?' link arrive last (the link opens the optional trigger sheet). Success haptic with the +1.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .screen { --muted: #F3EEE6; }
  .hero { position: absolute; left: 0; right: 0; top: 76px; display: grid; place-items: center; }
  .hero .disc { position: relative; width: 232px; height: 232px; display: grid; place-items: center; }
  .hero .disc svg.pacer { position: absolute; inset: 0; }
  .hero .ck { position: absolute; right: 12px; top: 16px; }
  .txt { position: absolute; left: 0; right: 0; top: 326px; padding: 0 36px; text-align: center; }
  .txt .t-body { margin-top: 8px; color: var(--muted); }
  .stack2 { position: absolute; left: 0; right: 0; top: 462px; padding: 0 var(--gutter); }
  .waves { display: flex; align-items: center; gap: 20px; padding: 20px 20px; }
  .waves .grow { flex: 1; min-width: 0; }
  .waves .big { display: flex; align-items: flex-start; gap: 6px; }
  .waves .big .num { font-size: 32px; line-height: 1; letter-spacing: -1px; }
  .waves .plus { font: 800 16px/1 var(--display); color: var(--tick); margin-top: 0; }
  .waves .t-foot { color: var(--muted); margin-top: 4px; }
  .waves .go { margin-top: 10px; font: 500 15px/1.35 var(--body); color: var(--fg); text-wrap: balance; }
  .waves .medal { position: relative; width: 100px; height: 100px; flex: none; }
  .waves .medal .mr { position: absolute; inset: 0; }
  .waves .medal .mm { position: absolute; inset: 10px; filter: drop-shadow(0 3px 6px rgba(6,16,50,.35)); }
  #ck [data-pop] { transform: none; }
  .play #ck [data-pop] { animation: dx-fade 500ms var(--ease) both; animation-delay: 0ms; }
  .dock .why { display: flex; justify-content: center; margin-top: 6px; }
  .dock .why .link { color: var(--fg); opacity: 1; font-size: 16px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
</style>
</head><body>
<div class="screen" data-ground="ocean">
  <div class="hero">
    <div class="disc">
      <svg class="pacer" viewBox="0 0 232 232" aria-hidden="true">
        <circle cx="116" cy="116" r="98" fill="currentColor" fill-opacity=".06"/>
        <circle cx="116" cy="116" r="113" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="2.5"/>
      </svg>
      <div id="jelli" data-settle style="--d:250ms"></div>
      <div class="ck" id="ck"></div>
    </div>
  </div>

  <div class="txt">
    <h1 class="t-large" data-a style="--i:2">You rode it <span class="mark">out</span></h1>
    <p class="t-body" data-a style="--i:3">Four minutes, start to finish. Each one you ride makes the next a little quieter.</p>
  </div>

  <div class="stack2">
    <div class="card waves" data-a style="--i:4">
      <div class="medal" data-fade style="--d:1300ms"><div class="mr" id="mr"></div><div class="mm" id="bd"></div></div>
      <div class="grow">
        <div class="big"><span class="num" data-count="23" data-from="22" data-delay="900" data-dur="500">23</span><span class="plus float-up" style="--d:900ms">+1</span></div>
        <p class="t-foot">waves ridden out, 3 today</p>
        <p class="go">2 more for your 25&#8209;wave&nbsp;badge</p>
      </div>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:6" data-go="016-today-quit">Back to my day</button>
    <div class="why" data-a style="--i:7"><button class="link" id="why">What set it off?</button></div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#jelli').innerHTML = DX.char('jelli', { mood: 'cheer', size: 190 });
  $('#ck').innerHTML = DX.check({ size: 48, color: 'var(--tick)', fg: '#0B2A1C' });
  $('#bd').innerHTML = DX.badge({ kind: 'wave', n: 25, size: 80, bare: true, label: '25 waves' });
  $('#mr').innerHTML = DX.ring({ size: 100, stroke: 4, p: 23 / 25, color: '#FFF8EE', track: 'rgba(255,248,238,.22)' });
  DX.after(2700, () => { $('#jelli').innerHTML = DX.char('jelli', { mood: 'cheer', size: 190, animate: false }); });
</script>
</body></html>
