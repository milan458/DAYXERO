<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>020 Craving passed</title>
<meta name="motion" content="The completion beat, gentle. A check draws on the pacer ring (420ms), then Jelli settles in cheering (900ms, one soft hop). Title and line fade up; at 900ms the wave count rolls from 22 to 23 while a '+1' floats up beside it (spring, the only one on the screen). At 1.3s the 25-wave badge fades in (700ms, no spring) and its ring creeps from 22 to 23 of 25 while "2 to go" settles under it. The button and the quiet 'What set it off?' link arrive last (the link opens the optional trigger sheet). Success haptic with the +1.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .screen { --muted: #F3EEE6; }
  .hero { position: absolute; left: 0; right: 0; top: 76px; display: grid; place-items: center; }
  .hero .disc { position: relative; width: 232px; height: 232px; display: grid; place-items: center; }
  .hero .disc svg.pacer { position: absolute; inset: 0; }
  .hero .ck { position: absolute; right: 12px; top: 16px; }
  .txt { position: absolute; left: 0; right: 0; top: 326px; padding: 0 36px; text-align: center; }
  .txt .t-body { margin-top: 8px; color: var(--muted); }
  .stack2 { position: absolute; left: 0; right: 0; top: 448px; padding: 0 var(--gutter); display: grid; gap: 10px; }
  .waves { display: flex; align-items: center; gap: 16px; padding: 22px 22px 22px 22px; }
  .waves .grow { flex: 1; min-width: 0; }
  .waves .big { display: flex; align-items: flex-start; gap: 6px; position: relative; }
  .waves .big .num { font-size: 48px; line-height: 1; }
  .waves .plus { font: 800 18px/1 var(--display); color: var(--tick); margin-top: 2px; }
  .waves .t-foot { color: var(--muted); margin-top: 4px; }
  .waves .bd { flex: none; width: 128px; padding: 4px 0 2px 18px; border-left: 1px solid var(--line); display: grid; justify-items: center; gap: 10px; }
  .waves .bd .face { position: relative; width: 84px; height: 84px; display: grid; place-items: center; }
  .waves .bd .face svg { position: absolute; inset: 0; }
  .waves .bd .n { position: relative; font: 800 26px/1 var(--display); color: var(--fg); letter-spacing: -.6px; }
  .waves .bd .go { font: 800 18px/1.2 var(--display); color: var(--fg); text-align: center; }
  .waves .bd .face circle[transform] { stroke: #FFF8EE; stroke-width: 6; }
  .waves .bd .go span { margin-top: 2px; }
  .waves .bd .go span { display: block; font: 600 13px/1.3 var(--body); color: var(--muted); white-space: nowrap; }
  #ck [data-pop] { transform: none; }
  .play #ck [data-pop] { animation: dx-fade 500ms var(--ease) both; animation-delay: 0ms; }
  .dock .why { display: flex; justify-content: center; margin-top: 6px; }
  .dock .why .link { color: var(--fg); opacity: 1; gap: 6px; display: inline-flex; align-items: center; font-size: 16px; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
  .dock .why .link svg { width: 16px; height: 16px; }
</style>
</head><body>
<div class="screen" data-ground="ocean">
  <div class="hero">
    <div class="disc">
      <svg class="pacer" viewBox="0 0 232 232" aria-hidden="true">
        <circle cx="116" cy="116" r="98" fill="currentColor" fill-opacity=".06"/>
        <circle cx="116" cy="116" r="113" fill="none" stroke="currentColor" stroke-opacity=".4" stroke-width="2.5"/>
      </svg>
      <div id="jelli" data-settle style="--d:250ms"></div>
      <div class="ck" id="ck"></div>
    </div>
  </div>

  <div class="txt">
    <h1 class="t-large" data-a style="--i:2">You rode it <span class="mark">out</span></h1>
    <p class="t-body" data-a style="--i:3">Four minutes, start to finish. Each one you ride makes the next a little quieter.</p>
  </div>

  <div class="stack2">
    <div class="card waves" data-a style="--i:4">
      <div class="grow">
        <div class="big"><span class="num" data-count="23" data-from="22" data-delay="900" data-dur="500">23</span><span class="plus float-up" style="--d:900ms">+1</span></div>
        <p class="t-foot">waves ridden out &middot; 3 today</p>
      </div>
      <div class="bd" data-fade style="--d:1300ms"><div class="face" id="bd"></div><p class="go">2 to go<span>25 waves badge</span></p></div>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:6" data-go="016-today-quit">Back to my day</button>
    <div class="why" data-a style="--i:7"><button class="link" id="why">What set it off?</button></div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#why').insertAdjacentHTML('beforeend', DX.icon('chev', { size: 16 }));
  $('#jelli').innerHTML = DX.char('jelli', { mood: 'cheer', size: 190 });
  $('#ck').innerHTML = DX.check({ size: 48, color: 'var(--tick)', fg: '#0B2A1C' });
  $('#bd').innerHTML = DX.badge({ kind: 'wave', n: '', state: 'next', p: .92, size: 84, bare: true }) + '<span class="n">25</span>';
  DX.after(2700, () => { $('#jelli').innerHTML = DX.char('jelli', { mood: 'cheer', size: 190, animate: false }); });
  const fillBadge = (sel, from, to, delay) => DX.after(0, () => { const c = document.querySelector(sel + ' circle[transform]'); if (!c) return; const C = 2 * Math.PI * 48;
    c.animate([{ strokeDashoffset: C * (1 - from) }, { strokeDashoffset: C * (1 - to) }], { duration: 1000, delay, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }); });
  fillBadge('#bd', .88, .92, 1500);
</script>
</body></html>
