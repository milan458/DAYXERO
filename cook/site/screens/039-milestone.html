<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>039 Milestone Day 7</title>
<meta name="motion" content="A sunrise of rays fans out above the badge (fade 700ms) and sways gently (3 degrees, 8s loop); Xero stands clear of them at the lower right. At 250ms the Day 7 badge stamps in (620ms spring, success haptic on landing) and a shine crosses it at 900ms. Xero settles in at 500ms and cheers (hop loop). Headline, line and source arrive with a 90ms stagger; the two stats count up from 0 at 1.1s (900ms). Keep going and Share my card arrive last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .stage { position: absolute; left: 0; right: 0; top: 52px; height: 318px; }
  .rays-wrap { position: absolute; left: 50%; top: 150px; width: 0; height: 0; --ray-a: #E9892E; --ray-b: #FFE7A3; }
  [data-theme="dark"] .rays-wrap { --ray-a: #FFD966; --ray-b: #F5B83D; }
  .rays-wrap svg { position: absolute; left: -150px; top: -150px; width: 300px; height: 300px; overflow: visible; }
  .medal { position: absolute; left: 50%; top: 70px; margin-left: -80px; }
  .medal .shine { display: block; border-radius: 999px; }
  .cheer { position: absolute; left: 280px; top: 182px; }
  .sway { transform-origin: 0 0; }
  .play .sway { animation: sway 8s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .copy { position: absolute; left: 0; right: 0; top: 380px; text-align: center; display: grid; gap: 10px; justify-items: center; padding: 0 var(--gutter); }
  .copy .t-body { max-width: 300px; }
  .stats { position: absolute; left: var(--gutter); right: var(--gutter); top: 556px; }
  .stat { text-align: center; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="stage">
    <div class="rays-wrap" data-fade style="--d:100ms">
      <svg viewBox="-100 -100 200 200" aria-hidden="true"><g class="sway" id="rays"></g></svg>
    </div>
    <div class="medal" data-stamp style="--d:250ms"><span class="shine" style="--d:900ms" id="medal"></span></div>
    <div class="cheer" data-settle style="--d:500ms" id="xero"></div>
  </div>

  <div class="copy">
    <p class="t-foot muted" data-a style="--i:4">Day 7 · Fri, Nov 13</p>
    <h1 class="t-display" data-a style="--i:5">One week <span class="mark">free</span></h1>
    <p class="t-body" data-a style="--i:6">The first week is the hardest for most people. You did it.</p>
    <span class="source" data-a style="--i:7">Source: smokefree.gov</span>
  </div>

  <div class="stats grid2" data-a style="--i:8">
    <div class="stat"><span class="num" data-count="49" data-prefix="$" data-dec="2" data-delay="1100" data-dur="900">$49.00</span><span class="t-cap">kept</span></div>
    <div class="stat"><span class="num" data-count="84" data-delay="1100" data-dur="900">84</span><span class="t-cap">cigarettes not smoked</span></div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:9">Keep going</button>
    <button class="link" data-a style="--i:10" data-go="040-milestone-share"><span id="sh" style="display:inline-flex;margin-right:8px"></span>Share my card</button>
  </div>
</div>
<script>
  const rays = [];
  for (let i = -6; i <= 6; i++) {
    const a = i * 15, long = i % 2 === 0;
    rays.push(`<path d="M-${long ? 5 : 3.5} -58 L0 -${long ? 96 : 80} L${long ? 5 : 3.5} -58Z" fill="var(${long ? '--ray-a' : '--ray-b'})" opacity="${long ? 1 : .95}" transform="rotate(${a})"/>`);
  }
  document.getElementById('rays').innerHTML = rays.join('');
  document.getElementById('medal').innerHTML = DX.badge({ kind: 'day', n: 7, size: 160, bare: true });
  document.getElementById('xero').innerHTML = DX.char('xero', { mood: 'cheer', size: 96, stage: 3 });
  document.getElementById('sh').innerHTML = DX.icon('share', { size: 20 });
</script>
</body></html>
