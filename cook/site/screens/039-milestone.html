<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>039 Milestone Day 7</title>
<meta name="motion" content="Two layers of soft paper rays fan out behind the badge (fade and scale from 90%, 700ms), then sway gently (3 degrees, 8s loop, the two layers in opposite directions). At 250ms the Day 7 badge stamps in (620ms spring, success haptic on landing) and a shine crosses it at 900ms. Xero settles in at 500ms on the same ground to the right of the badge, clear of it, and cheers (bob loop); one soft shadow under both. Date, headline, the stat line (both numbers count up from 0 at 1.1s, 900ms), the line and the source arrive with a 90ms stagger. Keep going and Share my card arrive last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .stage { position: absolute; left: 0; right: 0; top: 96px; height: 300px; }
  .rays-wrap { position: absolute; left: 149px; top: 150px; width: 0; height: 0;
    --ray-back: #FFDC94; --ray-front: #FFF0CC; --ray-shadow: rgba(160,70,20,.22); }
  [data-theme="dark"] .rays-wrap { --ray-back: #9C6A26; --ray-front: #D99A3A; --ray-shadow: rgba(0,0,0,.5); }
  .rays-wrap svg { position: absolute; left: -160px; top: -160px; width: 320px; height: 320px; overflow: visible; }
  .rays-wrap .lay { filter: drop-shadow(0 2px 2px var(--ray-shadow)); }
  .play .rays-wrap { animation: rays-in 700ms var(--settle) 100ms both; }
  @keyframes rays-in { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
  .medal { position: absolute; left: 69px; top: 70px; z-index: 1; }
  .ground { position: absolute; left: 78px; top: 214px; width: 260px; height: 22px; border-radius: 50%; background: radial-gradient(closest-side, rgba(30,26,58,.2), rgba(30,26,58,0)); }
  [data-theme="dark"] .ground { background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .medal .shine { display: block; border-radius: 999px; }
  .cheer { position: absolute; left: 226px; top: 127px; z-index: 2; }
  .sway { transform-origin: 0 0; }
  .play .sway.a { animation: sway 8s ease-in-out infinite alternate; }
  .play .sway.b { animation: sway 8s ease-in-out infinite alternate-reverse; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .copy { position: absolute; left: 0; right: 0; top: 380px; text-align: center; display: grid; gap: 10px; justify-items: center; padding: 0 var(--gutter); }
  .copy .t-body { max-width: 300px; }
  .copy .stat-line { font: 700 17px/1.3 var(--body); color: var(--fg); }
  .copy .stat-line .num { font-size: 19px; letter-spacing: -.3px; }
  .copy .src { font: 500 12px/1.3 var(--body); color: var(--muted); opacity: .8; margin-top: 2px; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="stage">
    <div class="rays-wrap">
      <svg viewBox="-160 -160 320 320" aria-hidden="true"><g class="sway a lay" id="raysB"></g><g class="sway b lay" id="raysF"></g></svg>
    </div>
    <div class="ground" data-fade style="--d:200ms"></div>
    <div class="medal" data-stamp style="--d:250ms"><span class="shine" style="--d:900ms" id="medal"></span></div>
    <div class="cheer" data-settle style="--d:500ms"><div class="bob" id="xero"></div></div>
  </div>

  <div class="copy">
    <p class="t-foot muted" data-a style="--i:4">Day 7 · Fri, Nov 13</p>
    <h1 class="t-display" data-a style="--i:5">One week <span class="mark">free</span></h1>
    <p class="stat-line" data-a style="--i:6"><span class="num" data-count="49" data-prefix="$" data-dec="2" data-delay="1100" data-dur="900">$49.00</span> kept · <span class="num" data-count="84" data-delay="1100" data-dur="900">84</span> cigarettes not smoked</p>
    <p class="t-body muted" data-a style="--i:7">The first week is the hardest for most people. You did it.</p>
    <p class="src" data-a style="--i:8">Source: smokefree.gov</p>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:9">Keep going</button>
    <button class="link" data-a style="--i:10" data-go="040-milestone-share"><span id="sh" style="display:inline-flex;margin-right:8px"></span>Share my card</button>
  </div>
</div>
<script>
  /* Soft paper rays: broad petals with rounded tips, in two layers (long pale ones behind, shorter warm ones in front, offset
     by half a step), each layer casting a soft paper shadow. Dark: warm golds, never translucent (no olive on navy). */
  const ray = (len, base, w, fill) => `<path d="M${-w} ${-base} C${-w * .8} ${-(base + len) * .6} ${-w * .55} ${-(base + len - 8)} 0 ${-(base + len)} C${w * .55} ${-(base + len - 8)} ${w * .8} ${-(base + len) * .6} ${w} ${-base}Z" fill="${fill}"/>`;
  document.getElementById('raysB').innerHTML = Array.from({ length: 16 }, (_, i) => `<g transform="rotate(${i * 22.5})">${ray(70, 70, 15, 'var(--ray-back)')}</g>`).join('');
  document.getElementById('raysF').innerHTML = Array.from({ length: 16 }, (_, i) => `<g transform="rotate(${i * 22.5 + 11.25})">${ray(44, 72, 11, 'var(--ray-front)')}</g>`).join('');
  /* the kit day badge, with its sun moved down and right so it sits on the hills clear of the 7 */
  document.getElementById('medal').innerHTML = DX.badge({ kind: 'day', n: 7, size: 160, bare: true }).replace('<circle cx="66" cy="64" r="12"', '<circle cx="74" cy="68" r="10.5"');
  document.getElementById('xero').innerHTML = DX.char('xero', { mood: 'cheer', size: 100 });
  document.getElementById('sh').innerHTML = DX.icon('share', { size: 20 });
</script>
</body></html>
