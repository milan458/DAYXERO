<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>021 After a slip, plan</title>
<meta name="motion" content="Quiet tier, no springs. Jelli (calm) settles in from below (900ms); the title, the 'nothing resets' line and the 7-days note arrive with a 90ms stagger. The trigger chips arrive, then the if-then line and its three option rows settle in one by one (120ms apart). Choosing a chip rewrites the if-line with a 250ms crossfade. On Save the button turns to its done state and a soft success haptic plays.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .head { position: absolute; left: 0; right: 0; top: 104px; padding: 0 var(--gutter); display: flex; gap: 14px; align-items: center; }
  .head .jel { width: 88px; height: 88px; border-radius: 26px; background: var(--card-2); display: grid; place-items: center; flex: none; overflow: hidden; }
  .head .t-title { font-size: 24px; }
  .note { position: absolute; left: 0; right: 0; top: 206px; padding: 0 var(--gutter); color: var(--muted); }
  .note b { color: var(--fg); font-weight: 600; }
  .plan { position: absolute; left: 0; right: 0; top: 272px; padding: 0 var(--gutter); }
  .plan .ask { color: var(--muted); }
  .plan .chips { margin-top: 10px; }
  .plan .ifthen { margin-top: 22px; }
  .plan .ifthen b { font-weight: 800; }
  .plan .opts { margin-top: 12px; display: grid; gap: 8px; }
  .plan .opt { min-height: 58px; padding: 10px 16px; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"></div>
    <span class="t-foot muted">With Jelli</span>
  </div>

  <div class="head">
    <div class="jel" id="jelli" data-settle></div>
    <h1 class="t-title" data-a style="--i:1">Thanks for telling me. Nothing resets.</h1>
  </div>
  <p class="t-body note" data-a style="--i:2">Your <b>7 days</b> and Xero's sky stay as they are. One small plan makes the next wave easier.</p>

  <div class="plan">
    <p class="t-foot ask" data-a style="--i:3">What set it off?</p>
    <div class="chips" data-a style="--i:4">
      <button class="chip on">Coffee</button><button class="chip">Stress</button><button class="chip">Other</button>
    </div>
    <p class="t-head ifthen" data-a style="--i:5">If it's after <b>coffee</b>, then I'll&hellip;</p>
    <div class="opts">
      <button class="opt" data-settle style="--i:5"><span class="grow t-body">take a short walk first</span><span class="radio"></span></button>
      <button class="opt on" data-settle style="--i:6"><span class="grow t-body">have it somewhere new</span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:7"><span class="grow t-body">open Craving SOS</span><span class="radio"></span></button>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:8">Save my plan</button>
    <button class="link" data-a style="--i:9" data-go="016-today-quit">Not now</button>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#close').innerHTML = DX.icon('close');
  $('#jelli').innerHTML = DX.char('jelli', { mood: 'calm', size: 88 });
</script>
</body></html>
