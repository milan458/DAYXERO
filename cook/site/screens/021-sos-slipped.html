<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>021 After a slip, plan</title>
<meta name="motion" content="Quiet tier, no springs. The paper-cut sea card builds back to front: the four wave layers rise 40px into place 100ms apart (900ms each) while Jelli (calm) settles down into the water between them (900ms), then keeps a slow bob, half in the sea; the small sun fades in last. The title and the progress note arrive with a 90ms stagger, then the if-then line and its three option rows settle in one by one (120ms apart). On Save the button turns to its done state and a soft success haptic plays.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .hero { position: absolute; left: var(--gutter); right: var(--gutter); top: 104px; height: 184px; border-radius: 28px; overflow: hidden;
    --sky-a: #DCEBFF; --sky-b: #F4F8FF; --sun: #FFD37A; --w1: #B9D4FF; --w2: #8DB5FA; --w3: #5F8EEA; --w4: #3D6BD2; --edge: rgba(255,255,255,.7); --lift: rgba(20,50,130,.22); }
  [data-theme="dark"] .hero { --sky-a: #0E1C4A; --sky-b: #1A2E6A; --sun: #FFE3A3; --w1: #24407F; --w2: #2C4F98; --w3: #3762B4; --w4: #4776CC; --edge: rgba(185,201,255,.35); --lift: rgba(0,0,0,.4); box-shadow: inset 0 0 0 1px var(--line); }
  .hero .sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky-a), var(--sky-b)); }
  .hero .lay { position: absolute; left: 0; right: 0; bottom: 0; }
  .hero .lay svg { display: block; width: 100%; }
  .hero .l1 { z-index: 1; filter: drop-shadow(0 -3px 5px var(--lift)); }
  .hero .l2 { z-index: 2; filter: drop-shadow(0 -4px 6px var(--lift)); }
  .hero .jel { position: absolute; z-index: 3; left: 50%; top: 4px; margin-left: -110px; width: 200px; height: 200px; }
  .hero .l3 { z-index: 4; filter: drop-shadow(0 -4px 8px var(--lift)); }
  .hero .l4 { z-index: 5; filter: drop-shadow(0 -5px 10px var(--lift)); }
  .play .hero .lay { animation: wv 900ms cubic-bezier(.2,.8,.2,1) both; }
  .play .hero .l2 { animation-delay: 100ms; } .play .hero .l3 { animation-delay: 200ms; } .play .hero .l4 { animation-delay: 300ms; }
  @keyframes wv { from { transform: translateY(40px); } to { transform: none; } }
  .nav .cap { flex: 1; text-align: center; color: var(--muted); margin-right: 44px; }
  .head { position: absolute; left: 0; right: 0; top: 308px; padding: 0 var(--gutter); }
  .head .t-title { font-size: 26px; }
  .note { margin-top: 8px; color: var(--muted); }
  .note b { color: var(--fg); font-weight: 600; }
  .plan { position: absolute; left: 0; right: 0; top: 444px; padding: 0 var(--gutter); }
  .plan .ask { color: var(--muted); }
  .plan .chips { margin-top: 8px; }
  .plan .ifthen { margin-top: 0; }
  .plan .ifthen b { font-weight: 800; }
  .plan .opts { margin-top: 12px; display: grid; gap: 8px; }
  .plan .opt { min-height: 56px; padding: 6px 16px; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="hero" aria-hidden="true">
    <div class="sky"></div>
    <svg style="position:absolute;left:262px;top:16px" width="48" height="48" viewBox="0 0 96 96" data-fade style="--d:700ms"><defs><radialGradient id="sg21" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#FFF6D6"/><stop offset="1" stop-color="var(--sun)"/></radialGradient></defs><circle cx="48" cy="48" r="46" fill="var(--sun)" opacity=".14"/><circle cx="48" cy="48" r="36" fill="var(--sun)" opacity=".22"/><circle cx="48" cy="48" r="27" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/><circle cx="48" cy="48" r="21" fill="url(#sg21)"/></svg>
    <div class="lay l1"><svg viewBox="0 0 346 120" height="120"><path d="M0 40 C40 22 76 26 112 40 C150 54 186 50 222 34 C262 18 304 22 346 38 V120 H0Z" fill="var(--w1)"/><path d="M0 40 C40 22 76 26 112 40 C150 54 186 50 222 34 C262 18 304 22 346 38" fill="none" stroke="var(--edge)" stroke-width="2"/></svg></div>
    <div class="lay l2"><svg viewBox="0 0 346 96" height="96"><path d="M0 34 C34 18 70 20 104 34 C140 48 176 46 210 30 C248 14 300 18 346 32 V96 H0Z" fill="var(--w2)"/><path d="M0 34 C34 18 70 20 104 34 C140 48 176 46 210 30 C248 14 300 18 346 32" fill="none" stroke="var(--edge)" stroke-width="2"/></svg></div>
    <div class="jel" data-settle style="--d:200ms"><div class="bob" id="jelli"></div></div>
    <div class="lay l3"><svg viewBox="0 0 346 66" height="66"><path d="M0 26 C30 12 62 12 92 24 C124 38 158 38 190 24 C224 10 262 10 294 22 C314 30 330 30 346 24 V66 H0Z" fill="var(--w3)"/><path d="M0 26 C30 12 62 12 92 24 C124 38 158 38 190 24 C224 10 262 10 294 22 C314 30 330 30 346 24" fill="none" stroke="var(--edge)" stroke-width="2"/></svg></div>
    <div class="lay l4"><svg viewBox="0 0 346 36" height="36"><path d="M0 16 C40 4 80 6 118 16 C160 28 200 26 240 14 C280 4 316 6 346 14 V36 H0Z" fill="var(--w4)"/></svg></div>
  </div>
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <p class="t-foot cap">With Jelli</p>
  </div>

  <div class="head">
    <h1 class="t-title" data-a style="--i:1">Thanks for telling me.<br>Nothing resets.</h1>
    <p class="t-body note" data-a style="--i:2">Your progress stays as it is, all <b>7 days</b> of it. One small plan makes the next wave easier.</p>
  </div>

  <div class="plan">
    <p class="t-head ifthen" data-a style="--i:5">Next time after <b>coffee</b>, I'll&hellip;</p>
    <div class="opts">
      <button class="opt" data-settle style="--i:5"><span class="grow t-body">Take a short walk first</span><span class="radio"></span></button>
      <button class="opt on" data-settle style="--i:6"><span class="grow t-body">Have it somewhere new</span><span class="radio"></span></button>
      <button class="opt" data-settle style="--i:7"><span class="grow t-body">Open Craving SOS</span><span class="radio"></span></button>
    </div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:8">Save my plan</button>
    <button class="link" data-a style="--i:9" data-go="016-today-quit">Not now</button>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  $('#close').innerHTML = DX.icon('close');
  $('#jelli').innerHTML = DX.char('jelli', { mood: 'calm', size: 200 });
</script>
</body></html>
