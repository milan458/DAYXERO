<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>034 Lesson cards</title>
<meta name="motion" content="The progress bar shows card 1 of 4 (first segment full). The stack edges arrive first, then the top card is dealt face down and turns over at 450ms (rotateY 180 to 0, 800ms settle curve, light haptic as it lands). On the paper-cut road, which runs full-bleed across the top of the card, the sun pops (600ms), the little car with Xero at the wheel drives up the road toward you (900ms settle from 700ms, then a 1px idle bounce), and the two passengers' speech bubbles pop in turn (420ms spring at 1.1s and 1.7s, then a 2.4s chatter pulse). The two-line paragraph and then the pull line arrive with a 90ms stagger, then the Your turn button. Tapping Your turn flips the card to its back (reflection prompt) the same way.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .label { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .label svg { width: 18px; height: 18px; }
  .stack-wrap { position: relative; margin-top: 0; height: 572px; perspective: 1400px; }
  .edge { position: absolute; left: 0; right: 0; top: 0; height: 548px; border-radius: 26px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--line), 0 8px 18px rgba(30,26,58,.07); transform-origin: 50% 100%; }
  [data-theme="dark"] .edge { background: #2A3450; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.2), 0 10px 20px rgba(0,0,0,.3); }
  [data-theme="dark"] .face { box-shadow: inset 0 0 0 1px rgba(255,255,255,.22), 0 14px 30px rgba(0,0,0,.3); }
  .edge.e1 { transform: translateY(12px) scale(.95) rotate(-1.2deg); }
  .edge.e2 { transform: translateY(24px) scale(.9) rotate(1.6deg); opacity: .8; }
  .flip { position: absolute; left: 0; right: 0; top: 0; height: 548px; transform-style: preserve-3d; transition: transform 800ms var(--settle); }
  .flip.back { transform: rotateY(180deg); transition: none; }
  .face { position: absolute; inset: 0; border-radius: 26px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line), 0 14px 30px rgba(30,26,58,.08);
    backface-visibility: hidden; -webkit-backface-visibility: hidden; padding: 22px 24px; display: flex; flex-direction: column; }
  .face.rear { transform: rotateY(180deg); background: var(--card-2); align-items: center; justify-content: center; text-align: center; gap: 10px; }
  /* the art runs full-bleed across the top of the card, clipped to the card radius */
  .road { display: block; margin: -22px -24px 20px; border-radius: 26px 26px 0 0; overflow: hidden; }
  .copy { display: grid; gap: 12px; margin-top: 8px; }
  .copy .t-body { color: var(--fg); }
  .copy .t-body.soft { color: var(--muted); }
  .turn { margin-top: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .turn svg { width: 18px; height: 18px; }
  .pull { margin-top: 4px; padding-left: 14px; border-left: 3px solid var(--mark); font: 700 17px/1.4 var(--display); letter-spacing: -.1px; color: var(--fg); text-wrap: pretty; }
  .road svg { display: block; width: 100%; height: auto; }
  .road .chat { transform-box: fill-box; transform-origin: 50% 100%; }
  .play .road .chat { animation: chat-in 420ms var(--spring) both, chat 2.4s ease-in-out infinite; animation-delay: var(--cd), calc(var(--cd) + 600ms); }
  @keyframes chat-in { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
  @keyframes chat { 0%, 100% { transform: none; } 12% { transform: scale(1.12) rotate(-3deg); } 24% { transform: none; } }
  .road .car { transform-box: fill-box; transform-origin: 50% 100%; }
  .play .road .car { animation: car-in 900ms var(--settle) 700ms both, idle 1.2s ease-in-out 1.6s infinite; }
  @keyframes car-in { from { opacity: 0; transform: translateY(14px) scale(1.25); } to { opacity: 1; transform: none; } }
  @keyframes idle { 50% { transform: translateY(-1px); } }
  .still .road .chat, .still .road .car { animation: none !important; opacity: 1 !important; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close"></button>
    <div class="grow" style="padding-right:8px"><div class="steps" aria-label="Card 1 of 4"><i class="on"></i><i></i><i></i><i></i></div></div>
  </div>
  <div class="scroll" style="padding-top:112px">
    <div class="pad">
      <div class="stack-wrap">
        <div class="edge e2" data-fade style="--d:0ms"></div>
        <div class="edge e1" data-fade style="--d:80ms"></div>
        <div class="flip" id="flip">
          <article class="face front">
            <div class="road" id="road"></div>
            <h1 class="t-title" data-a style="--i:3">You're the driver</h1>
            <div class="copy">
              <p class="t-body" data-a style="--i:4">You're at the wheel. Cravings are the passengers who shout and bargain.</p>
              <p class="pull" data-a style="--i:5">You don't have to argue or throw them out. You decide where the car goes.</p>
            </div>
          </article>
          <article class="face rear">
            <p class="t-foot muted">Day 7 lesson</p>
            <p class="t-title">The noisy passengers</p>
          </article>
        </div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:9">Your turn</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.insertAdjacentHTML('afterbegin', DX.icon(e.dataset.ic, { size: 20 })));
  /* Card art, cropped close: the lesson's open-top car coming down the paper-cut road toward you. Xero is at the wheel, a blue
     passenger beside him and a yellow and a grey one in the back (Xero is the only coral figure), two of them chattering. Same palette as the lesson intro;
     dark mode is the kit's pre-dawn sky. */
  const dark = DX.theme === 'dark';
  const C = dark
    ? { sky: ['#0D1630', '#24335C', '#5B5578'], hills: ['#1E2B4A', '#16233F', '#0F1A31', '#0A1326'], road: '#232E4D', dash: '#8E97B5', dashO: .55,
        body: '#E6DCCB', shade: '#C2B6A2', stripe: '#E9886C', frame: '#C2B6A2', tyre: '#070B16', lamp: '#FFD27A', glass: .12, bub: '#EDE3D2', marks: '#1E1A3A', seat: '#2B3658', shadow: .5 }
    : { sky: ['#FF7E5A', '#FFB877', '#FFE6BF'], hills: ['#FF9D6E', '#FF7A55', '#E85A3E', '#C2402A'], road: '#4A3352', dash: '#FFE6C8', dashO: .9,
        body: '#FFF4E4', shade: '#F1D7BC', stripe: '#FF7A55', frame: '#2A2440', tyre: '#2A2440', lamp: '#FFD966', glass: .3, bub: '#FFF8EE', marks: '#1E1A3A', seat: '#2E2A4F', shadow: .25 };
  const sun = dark
    ? `<circle cx="58" cy="108" r="70" fill="url(#rhalo)"/><circle cx="58" cy="108" r="20" fill="#FFD27A"/>`
    : `<circle cx="58" cy="54" r="54" fill="url(#rhalo)"/><circle cx="58" cy="54" r="24" fill="#FFD25E"/>`;
  const stars = dark ? [[30, 22], [112, 14], [150, 40], [206, 18], [272, 30], [244, 66]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 2 ? 1 : 1.4}" fill="#fff" opacity="${i % 2 ? .5 : .85}"/>`).join('') : '';
  const pal = { grey: ['#D3CCDD', '#B4ABC4'], yellow: ['#FFD25E', '#F2B640'], blue: ['#7C97F2', '#5C7AE0'] };
  const pass = (x, y, c, k, tilt, mouth) => `<g transform="translate(${x} ${y}) rotate(${tilt}) scale(${k})">
      <path d="M-15 40 V7 C-15 -3 -8 -9 0 -9 C8 -9 15 -3 15 7 V40Z" fill="${pal[c][0]}"/>
      <path d="M8 -7 C12.5 -4 15 1 15 7 V40 H9.5 V7 C9.5 2 9.5 -3 8 -7Z" fill="${pal[c][1]}"/>
      <path d="M-8 -1.5 l4 -1.4 M3.5 -2.9 l4 1.4" stroke="${C.marks}" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-4.5" cy="3.5" r="2" fill="${C.marks}"/><circle cx="4.5" cy="3.5" r="2" fill="${C.marks}"/>
      ${mouth === 'grin' ? `<path d="M-4.6 9 h9.2 c0 3.6 -2.2 5.4 -4.6 5.4 s-4.6 -1.8 -4.6 -5.4z" fill="${C.marks}"/>` : mouth === 'o' ? `<ellipse cx="0" cy="11" rx="3" ry="3.8" fill="${C.marks}"/>` : `<path d="M-4 11 q4 -3 8 0" fill="none" stroke="${C.marks}" stroke-width="1.8" stroke-linecap="round"/>`}</g>`;
  const bubble = (x, y, w, tx, tip, marks, d) => `<g class="chat" style="--cd:${d}ms" filter="url(#rlift)" fill="${C.bub}">
      <rect x="${x}" y="${y}" width="${w}" height="24" rx="12"/><path d="M${tx - 6} ${y + 20} L${tx + 6} ${y + 20} L${tip[0]} ${tip[1]}Z"/>
      <g transform="translate(${x} ${y})" fill="none" stroke="${C.marks}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".72">${marks}</g></g>`;
  const xero = DX.char('xero', { mood: 'hello', size: 78 }).replace('<svg ', '<svg x="78" y="76" ');
  document.getElementById('road').innerHTML = `<svg viewBox="0 -46 300 280" aria-hidden="true">
    <defs><linearGradient id="rsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sky[0]}"/><stop offset=".6" stop-color="${C.sky[1]}"/><stop offset="1" stop-color="${C.sky[2]}"/></linearGradient>
      <radialGradient id="rhalo"><stop offset=".25" stop-color="${dark ? '#FFB25E' : '#FFF6C8'}" stop-opacity="${dark ? .4 : .6}"/><stop offset="1" stop-color="${dark ? '#FFB25E' : '#FFF6C8'}" stop-opacity="0"/></radialGradient>
      <filter id="rlift" x="-5%" y="-20%" width="110%" height="140%"><feDropShadow dx="0" dy="-2" stdDeviation="2.5" flood-color="#1A0B2E" flood-opacity="${dark ? .45 : .2}"/></filter>
      <filter id="rdrop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A0B2E" flood-opacity="${dark ? .5 : .25}"/></filter></defs>
    <rect y="-46" width="300" height="280" fill="url(#rsky)"/>
    ${stars}${sun}
    <path filter="url(#rlift)" d="M0 112 C60 92 120 102 170 108 S260 96 300 100 V236 H0z" fill="${C.hills[0]}"/>
    <path filter="url(#rlift)" d="M0 140 C80 124 180 146 300 130 V236 H0z" fill="${C.hills[1]}"/>
    <path filter="url(#rlift)" d="M10 236 C70 200 128 170 140 136 C142 128 148 122 154 120 L160 120 C158 126 160 132 164 140 C180 172 236 204 296 236 Z" fill="${C.road}"/>
    <path d="M157 126 L157 138 M156.5 150 L156 166" stroke="${C.dash}" stroke-opacity="${C.dashO}" stroke-width="2.2" stroke-linecap="round"/>
    <path filter="url(#rlift)" d="M0 168 C24 160 44 168 54 186 C58 194 58 204 56 236 H0z" fill="${C.hills[2]}"/>
    <path filter="url(#rlift)" d="M300 160 C270 156 248 170 240 190 C236 202 238 220 240 236 H300z" fill="${C.hills[2]}"/>
    <g transform="translate(150 222)"><g class="car"><g transform="scale(1.28) translate(-150 -230)">
      <ellipse cx="150" cy="226" rx="104" ry="7" fill="#000" opacity="${C.shadow}"/>
      <path d="M70 158 V128 C70 120 76 116 84 116 H216 C224 116 230 120 230 128 V158Z" fill="${C.seat}"/>
      ${pass(150, 98, 'yellow', .92, -3, 'grin')}${pass(214, 104, 'grey', .88, 8, 'o')}
      ${pass(186, 116, 'blue', 1, 4, 'o')}
      ${xero}
      <path d="M74 158 L88 112 H212 L226 158" fill="#FFFFFF" fill-opacity="${C.glass}" stroke="${C.frame}" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M96 150 C102 140 132 140 138 150" fill="none" stroke="${C.tyre}" stroke-width="5" stroke-linecap="round"/>
      <path d="M117 145 V158" stroke="${C.tyre}" stroke-width="4" stroke-linecap="round"/>
      <rect x="64" y="196" width="26" height="30" rx="7" fill="${C.tyre}"/><rect x="210" y="196" width="26" height="30" rx="7" fill="${C.tyre}"/>
      <g filter="url(#rdrop)"><path d="M56 200 C56 208 60 212 70 212 H230 C240 212 244 208 244 200 V176 C244 164 236 156 224 156 H76 C64 156 56 164 56 176 Z" fill="${C.body}"/></g>
      <path d="M56 184 H244" stroke="${C.stripe}" stroke-width="3.2"/>
      <rect x="126" y="170" width="48" height="22" rx="6" fill="${C.shade}"/><path d="M138 175 v12 M150 175 v12 M162 175 v12" stroke="${C.body}" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="88" cy="174" r="11" fill="${C.lamp}" stroke="${C.shade}" stroke-width="3"/><circle cx="212" cy="174" r="11" fill="${C.lamp}" stroke="${C.shade}" stroke-width="3"/>
      <rect x="56" y="198" width="188" height="8" rx="4" fill="${C.shade}"/>
      ${bubble(112, 50, 50, 140, [146, 84], '<path d="M10 12 l5 -5 l5 5 l5 -5 l5 5 l5 -5"/>', 1100)}
      ${bubble(196, 58, 44, 222, [216, 92], '<path d="M13 7 v6"/><path d="M22 7 v6"/><path d="M31 7 v6"/><path d="M13 17.5 h.01"/><path d="M22 17.5 h.01"/><path d="M31 17.5 h.01"/>', 1700)}
    </g></g></g>
  </svg>`;
  const flip = document.getElementById('flip');
  if (!DX.still) flip.classList.add('back');
  DX.after(0, () => flip.classList.add('back'));
  DX.after(450, () => flip.classList.remove('back'));
</script>
</body></html>
