<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>065 What you use</title>
<meta name="motion" content="Option rows and the usual-day list arrive on the stagger, then the daily and yearly totals count up ($7, $2,555). Each stepper tap nudges its number with a small bump, a selection haptic, and the totals recount live.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* screen-local helpers: icon fill, section labels, small icon tiles, bottom toast */
.hd { display: grid; gap: 6px; padding-top: 58px; }
.sec { padding: 22px 4px 8px; color: var(--muted); }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row.tap { min-height: 56px; }
.toast.b { top: auto; opacity: 0; transform: translateY(18px); transition: opacity .4s var(--ease), transform .55s var(--settle); }
.toast.b.in { opacity: 1; transform: none; }
.toast.b .ck { flex: none; }
.opt.on { box-shadow: inset 0 0 0 2px var(--sel); }
html:not([data-theme="dark"]) .opt.on { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sel) 72%, transparent); }
.pill { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--card-2); display: inline-flex; align-items: center; font: 600 15px/1 var(--body); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }

.opts { display: grid; gap: 8px; margin-top: 16px; }
.opt .ico-tile { width: 40px; height: 40px; }
.step { display: flex; align-items: center; gap: 10px; }
.step button { width: 34px; height: 34px; border-radius: 99px; background: var(--card-2); display: grid; place-items: center; color: var(--fg); }
.step button svg { width: 16px; height: 16px; }
.step .num { font-size: 19px; min-width: 40px; text-align: center; }
.sum { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sum .card { padding: 14px 16px; display: grid; gap: 2px; }
.sum .num { font-size: 30px; line-height: 1.05; }
.kept065 { margin-top: 10px; display: flex; align-items: center; gap: 12px; padding: 4px 16px 4px 8px; }

.grp { background: var(--card); border-radius: var(--r-card); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.grp .opt { border-radius: 0; background: transparent; box-shadow: none; min-height: 68px; }
.grp .opt + .opt { border-top: 1px solid var(--line); }
html .screen .grp .opt.on { box-shadow: none; }
.sec { padding: 24px 4px 10px; font-size: 14px; }
.list > .row { min-height: 62px; }
.tot { display: grid; gap: 4px; padding: 22px 4px 0; }
.tot .t-head { font-variant-numeric: tabular-nums; }
.hd + .sec { padding-top: 18px; }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">What you use</h1><p class="t-foot muted" data-a style="--i:1">This sets money kept and your counters.</p></div>
  <p class="t-foot muted sec" data-a style="--i:2">You use</p>
  <div class="grp" data-a style="--i:2">
    <button class="opt on"><span class="ico-tile" data-ic="cig"></span><div class="grow"><div class="t-head">Cigarettes</div><div class="t-foot">12 a day</div></div><span class="radio"></span></button>
    <button class="opt on"><span class="ico-tile" data-ic="vape"></span><div class="grow"><div class="t-head">Vape</div><div class="t-foot">200 puffs a day</div></div><span class="radio"></span></button>
    <button class="opt"><span class="ico-tile" data-ic="pouch"></span><div class="grow"><div class="t-head">Nicotine pouches</div><div class="t-foot">Not used</div></div><span class="radio"></span></button>
  </div>
  <p class="t-foot muted sec" data-a style="--i:5">Your usual day</p>
  <div class="list" data-a style="--i:6">
    <div class="row " ><div class="grow"><div class="t-body rt">Cigarettes a day</div></div><div class="step"><button aria-label="Less" data-ic="minus" data-s="16" data-w="2.6"></button><span class="num">12</span><button aria-label="More" data-ic="plus" data-s="16" data-w="2.6"></button></div></div>
    <div class="row " ><div class="grow"><div class="t-body rt">Pack of 20</div></div><div class="step"><button aria-label="Less" data-ic="minus" data-s="16" data-w="2.6"></button><span class="num">$8.00</span><button aria-label="More" data-ic="plus" data-s="16" data-w="2.6"></button></div></div>
    <div class="row " ><div class="grow"><div class="t-body rt">Vape spend a day</div></div><div class="step"><button aria-label="Less" data-ic="minus" data-s="16" data-w="2.6"></button><span class="num">$2.20</span><button aria-label="More" data-ic="plus" data-s="16" data-w="2.6"></button></div></div>
  </div>
  <div class="tot" data-a style="--i:7"><span class="t-foot muted">That comes to</span><span class="t-head"><span data-count="7" data-prefix="$">$7</span> a day, <span data-count="2555" data-prefix="$">$2,555</span> a year</span></div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
</script>
</body></html>
