<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>022 Program, prep week</title>
<meta name="motion" content="The 'Prep week' header and its progress line arrive (600ms, 90ms stagger). The road, one continuous paper-cut ribbon from Prep 1 to the Day Xero coin, fades in (600ms), then its finished stretch fills prep-orange from the top to today's stamp (1100ms, ease); Prep 1 to 3 stamps and their rows arrive as the fill reaches each one (about 360ms apart). Today's Prep 4 play stamp lands as the fill arrives (600ms arrive, no spring) with the up-next card beside it, then the stamp breathes a soft pulse ring every 2.4s. Prep 5 to 7 (dashed rings on cream) fade in, the dotted guide fades in along the road to the horizon, the two hills rise 24px into place back to front (100ms apart, 900ms), and the Day Xero coin rises onto the horizon like a sunrise (1100ms settle) while the warm glow behind it brightens (1.2s) and its label fades in. Last, the locked 'Weeks 1 to 4' row arrives on the hill (600ms). Light haptic when the fill reaches today.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* light: neutral text (no green), a warm sand road with a dashed centre line, sage-cream hills filling the lower third.
     The page is cream; --g is the front hill, so the kit's tab fade melts into the hills instead of a cream void. */
  .screen[data-ground="mint"] { --page: #FBF6EC; --muted: #5E5975; --road: #EEDCBE; --road-edge: rgba(120,80,30,.16); --road-line: #C49A66; --done-road: #FFAE73; --card-2: #EEF5EC;
    --hb: #E4E6D2; --hf: #D2D9BE; --hrim: rgba(255,255,255,.7); --hsh: rgba(70,72,40,.18); --glow: 255,172,80; --glow-a: .66; --g: var(--hf); background: var(--page); }
  /* dark: the same warm sand road, dimmed for night */
  [data-theme="dark"] .screen[data-ground="mint"] { --page: #0E1322; --muted: #B3BACC; --road: #4A4134; --road-edge: rgba(0,0,0,.5); --road-line: rgba(255,232,200,.42); --done-road: #C27A4E; --card-2: #212A41;
    --hb: #1E3646; --hf: #172B3A; --hrim: rgba(200,225,235,.14); --hsh: rgba(0,0,0,.5); --glow: 255,176,104; --glow-a: .3; --g: var(--hf); }

  .hdr { position: absolute; left: 0; right: 0; top: 52px; padding: 0 var(--gutter); }
  .hdr .t-foot { color: var(--muted); margin-top: 4px; }
  .hdr .t-foot b { color: var(--fg); font-weight: 700; }

  svg.road { position: absolute; left: 0; top: 0; pointer-events: none; }
  #done { stroke-dasharray: var(--l4) 4000; stroke-dashoffset: 0; }
  .play #done { animation: fill 1100ms var(--ease) 300ms both; }
  @keyframes fill { from { stroke-dashoffset: var(--l4); } to { stroke-dashoffset: 0; } }

  .node { position: absolute; transform: translate(-50%, -50%); }
  .stamp { position: relative; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 99px; box-shadow: 0 0 0 3px var(--page); }
  .stamp svg { position: absolute; inset: 0; }
  .stamp .n { position: relative; font: 800 17px/1 var(--display); color: #1E1A3A; letter-spacing: -.3px; }
  .stamp.wait { background: var(--card); }
  [data-theme="dark"] .stamp.wait { background: var(--card-2); }
  .stamp.wait .n { color: var(--fg); }
  .lab { position: absolute; left: 106px; right: var(--gutter); transform: translateY(-50%); }
  .lab .k { font: 600 13px/1.3 var(--body); color: var(--muted); display: block; }
  .lab .t-foot { font-weight: 600; font-size: 15px; line-height: 1.3; }
  /* done rows sit one step dimmer than the rows ahead */
  .lab.done .k, .lab.done .t-foot { color: color-mix(in srgb, var(--muted) 86%, var(--page)); }
  .lab.done .t-foot { font-weight: 500; }

  /* today: a big stamp you press to play */
  .cur { position: relative; width: 68px; height: 68px; display: grid; place-items: center; color: var(--btn-fg); filter: drop-shadow(0 6px 12px rgba(30,26,58,.24)); }
  [data-theme="dark"] .cur { filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); }
  .cur svg.sc { position: absolute; inset: 0; }
  .cur .pl { position: relative; width: 26px; height: 26px; margin-left: 4px; }
  .cur::before { content: ""; position: absolute; inset: -6px; border-radius: 99px; box-shadow: 0 0 0 3px var(--fg); opacity: 0; }
  .play .cur::before { animation: pulse 2.4s var(--ease) 1.8s infinite; }
  @keyframes pulse { 0% { opacity: .4; transform: scale(1); } 100% { opacity: 0; transform: scale(1.3); } }
  .upw { position: absolute; left: 116px; right: var(--gutter); transform: translateY(-50%); }
  /* Xero, small, stands on the road at today's stamp; a thin cream paper edge keeps him clear of the orange road */
  .me { position: absolute; z-index: 1; width: 40px; height: 40px; }
  .me #xme { filter: drop-shadow(0 0 1px rgba(255,248,238,.95)) drop-shadow(0 0 1px rgba(255,248,238,.9)) drop-shadow(0 3px 4px rgba(120,40,10,.25)); }
  [data-theme="dark"] .me #xme { filter: drop-shadow(0 0 1px rgba(255,248,238,.6)) drop-shadow(0 3px 5px rgba(0,0,0,.45)); }
  .upnext { position: relative; padding: 14px 16px 15px; overflow: visible; box-shadow: 0 8px 22px rgba(36,73,58,.12); }
  [data-theme="dark"] .upnext { box-shadow: inset 0 0 0 1px var(--line); }
  .upnext::before { content: ""; position: absolute; left: -6px; top: 50%; width: 14px; height: 14px; margin-top: -7px; background: inherit; border-radius: 3px; transform: rotate(45deg); }
  [data-theme="dark"] .upnext::before { box-shadow: -1px 1px 0 0 var(--line); }
  .upnext .k { font: 600 13px/1.3 var(--body); color: var(--muted); display: block; }
  .upnext .t-head { margin-top: 3px; }

  /* the horizon: a warm glow where Day Xero rises, two paper-cut hills */
  .glow { position: absolute; left: 0; right: 0; top: 420px; height: 280px; pointer-events: none;
    background: radial-gradient(200px 150px at 222px 164px, rgba(var(--glow), var(--glow-a)), rgba(var(--glow), calc(var(--glow-a) * .35)) 55%, rgba(var(--glow), 0) 100%),
                linear-gradient(180deg, rgba(var(--glow), 0) 44%, rgba(var(--glow), calc(var(--glow-a) * .45)) 72%, rgba(var(--glow), 0) 82%); }
  .play .glow { animation: glowin 1200ms var(--ease) 1800ms both; }
  @keyframes glowin { from { opacity: 0; } }
  .hill { position: absolute; left: 0; top: 0; pointer-events: none; }
  .hill path.sh { filter: drop-shadow(0 -3px 5px var(--hsh)); }
  .play .hill { animation: hill 900ms var(--settle) both; }
  .play .hill.b { animation-delay: 1500ms; } .play .hill.f { animation-delay: 1600ms; }
  @keyframes hill { from { transform: translateY(24px); opacity: 0; } }
  .goal { position: absolute; transform: translate(-50%, -50%); width: 76px; height: 76px; }
  .goal .coin { filter: drop-shadow(0 6px 12px rgba(150,90,20,.24)); }
  .play .goal .coin { animation: rise 1100ms var(--settle) 1750ms both; }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } }
  .goal-lab { position: absolute; left: 272px; right: var(--gutter); transform: translateY(-50%); }
  .goal-lab .t-head { font-size: 20px; }
  .goal-lab .t-cap { color: var(--muted); margin-top: 3px; font-size: 14px; }

  /* after the horizon: what opens next, locked */
  /* on the hill, clear above the tab fade (which starts at 694) */
  .tease { position: absolute; left: var(--gutter); right: var(--gutter); top: 644px; height: 48px; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 12px; border-radius: 18px;
    background: color-mix(in srgb, var(--card) 72%, transparent); box-shadow: inset 0 0 0 1px var(--line); }
  [data-theme="dark"] .tease { background: color-mix(in srgb, var(--card) 80%, transparent); }
  .tease .lk { width: 34px; height: 34px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); flex: none; }
  .tease .lk svg { width: 18px; height: 18px; }
  .tease .t-foot { font-weight: 600; color: var(--fg); }
</style>
</head><body>
<div class="screen" data-ground="mint">
  <div class="hdr">
    <h1 class="t-large" data-a style="--i:0">Prep week</h1>
    <p class="t-foot" data-a style="--i:1"><b>3 of 7</b> done &middot; 4 days to Day Xero</p>
  </div>

  <div class="glow" aria-hidden="true"></div>
  <svg class="road" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true">
    <path id="edge" fill="none" stroke="var(--road-edge)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 3)" data-fade style="--d:150ms"/>
    <path id="road" fill="none" stroke="var(--road)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" data-fade style="--d:150ms"/>
    <path id="done" fill="none" stroke="var(--done-road)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="future" fill="none" stroke="var(--road-line)" stroke-width="2.5" stroke-dasharray="7 9" stroke-linecap="round" data-fade style="--d:1300ms"/>
  </svg>
  <svg class="hill b" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true"><path class="sh" d="M0 636 C60 627 140 618 222 622 C290 625 340 616 390 606 V844 H0Z" fill="var(--hb)"/><path d="M0 636 C60 627 140 618 222 622 C290 625 340 616 390 606" fill="none" stroke="var(--hrim)" stroke-width="1.5"/></svg>
  <div id="goal"></div>
  <svg class="hill f" width="390" height="844" viewBox="0 0 390 844" aria-hidden="true"><path class="sh" d="M0 714 C80 702 170 698 250 706 C310 712 350 708 390 700 V844 H0Z" fill="var(--hf)"/><path d="M0 714 C80 702 170 698 250 706 C310 712 350 708 390 700" fill="none" stroke="var(--hrim)" stroke-width="1.5"/></svg>
  <div id="nodes"></div>

  <div class="tease" data-a style="--d:2100ms" aria-label="Weeks 1 to 4, locked until Friday, November 6">
    <span class="lk" id="lock"></span>
    <p class="t-foot">Weeks 1 to 4 open on Fri, Nov 6</p>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  /* stamps about 54px apart (today's stamp 64px from its neighbours), so the ribbon reads as a road */
  const X = 66, Y = [146, 198, 250, 350, 416, 468, 520], G = [222, 584];
  /* one smooth ribbon: a Catmull-Rom spline straight down the node column, then a gentle bend over the horizon (the back hill hides its far end) */
  const pts = Y.map(y => [X, y]);
  pts.push([X + 2, 572], [X + 12, 618], [X + 34, 658]);
  const seg = (p, i) => { const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    return ` C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0]} ${p2[1]}`; };
  const span = (a, b) => `M${pts[a][0]} ${pts[a][1]}` + Array.from({ length: b - a }, (_, k) => seg(pts, a + k)).join('');
  const last = pts.length - 1, i4 = 3;
  ['#edge', '#road', '#done'].forEach(s => $(s).setAttribute('d', span(0, last)));
  /* the finished stretch is the same path, dashed so it ends at today's stamp; the dotted guide runs from today to the coin */
  const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'path'); tmp.setAttribute('d', span(0, i4));
  $('svg.road').appendChild(tmp); $('#done').style.setProperty('--l4', tmp.getTotalLength().toFixed(1)); tmp.remove();
  $('#future').setAttribute('d', span(i4, last));

  /* a soft seal edge: a disc ringed with small round scallops (a big postage-stamp seal, friendlier than a zigzag) */
  const seal = (cx, cy, R, n, r) => `<circle cx="${cx}" cy="${cy}" r="${R}"/>` + Array.from({ length: n }, (_, i) => { const a = 2 * Math.PI * i / n - Math.PI / 2; return `<circle cx="${(cx + R * Math.cos(a)).toFixed(2)}" cy="${(cy + R * Math.sin(a)).toFixed(2)}" r="${r}"/>`; }).join('');

  const titles = ["You don't have to quit today", 'The first one of the day', 'Use with your eyes open', 'The stress loop', 'Riding the wave', 'Make it easy on yourself', 'The night before'];
  const days = ['Fri', 'Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu'];
  let h = '';
  Y.forEach((y, i) => {
    const n = i + 1;
    if (n <= 3) {
      const d = 300 + i * 360;
      h += `<div class="node" style="left:${X}px;top:${y}px"><div data-a style="--d:${d}ms"><div class="stamp">${DX.badge({ kind: 'prep', n: '', size: 42, bare: true })}<span class="n">${n}</span></div></div></div>`;
      h += `<div class="lab done" style="top:${y}px"><div data-a style="--d:${d + 60}ms"><span class="k">Prep ${n} &middot; ${days[i]} &middot; done</span><p class="t-foot">${titles[i]}</p></div></div>`;
    } else if (n === 4) {
      h += `<div class="node" style="left:${X}px;top:${y}px"><div data-a style="--d:1250ms"><button class="cur" aria-label="Play Prep 4, The stress loop"><svg class="sc" viewBox="0 0 100 100" width="68" height="68"><g fill="var(--btn)">${seal(50, 50, 41, 18, 8.4)}</g><circle cx="50" cy="50" r="38" fill="none" stroke="var(--btn-fg)" stroke-opacity=".28" stroke-width="2" stroke-dasharray="3 5"/></svg><span class="pl">${DX.icon('play', { size: 26, fill: 'currentColor', w: 1.5 })}</span></button></div></div>`;
      h += `<div class="me" style="left:${X - 20}px;top:${y - 72}px"><div data-settle style="--d:1300ms"><div class="bob" id="xme"></div></div></div>`;
      h += `<div class="upw" style="top:${y}px"><div class="card upnext" data-a style="--d:1250ms"><span class="k">Today &middot; Prep 4 &middot; 5 cards &middot; 28 min</span><p class="t-head">The stress loop</p></div></div>`;
    } else {
      h += `<div class="node" style="left:${X}px;top:${y}px"><div data-fade style="--d:1400ms"><div class="stamp wait">${DX.badge({ kind: 'prep', n: '', state: 'next', size: 42, bare: true })}<span class="n">${n}</span></div></div></div>`;
      h += `<div class="lab" style="top:${y}px"><div data-fade style="--d:1450ms"><span class="k">Prep ${n} &middot; opens ${days[i]}</span><p class="t-foot">${titles[i]}</p></div></div>`;
    }
  });
  h += `<div class="goal-lab" style="top:${G[1] - 4}px"><div data-fade style="--d:1900ms"><p class="t-head">Day Xero</p><p class="t-cap">Fri, Nov 6</p></div></div>`;
  $('#nodes').innerHTML = h;
  $('#goal').innerHTML = `<div class="goal" style="left:${G[0]}px;top:${G[1]}px"><div class="coin">${DX.badge({ kind: 'xero', size: 76, bare: true, state: 'next', label: 'Day Xero, waiting' })}</div></div>`;
  $('#lock').innerHTML = DX.icon('lock', { w: 2.4 });
  $('#xme').innerHTML = DX.char('xero', { mood: 'hello', size: 40, stage: 1 });
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('program'));
</script>
</body></html>
