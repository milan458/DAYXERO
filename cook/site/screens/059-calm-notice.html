<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>059 Notice the urge</title>
<meta name="motion" content="Inside an inset card, the wave line draws left to right over 2.4s from its start dot to its end dot, the soft tint and the paper sea layers fade in under it and the three labels (It rises, It peaks, It passes) arrive beside their points on the curve; Jelli then rides the wave for 12s (slow ease), rising to the crest and gliding down, while the single 28px prompt cross-fades every 3s (600ms): notice, it rises, the peak, watch it fall. No springs, no haptic until It is passing is tapped (soft success haptic, goes to 060).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* screen-local helpers: icon fill, section labels, small icon tiles, bottom toast */
.hd { display: grid; gap: 6px; padding-top: 58px; }
.sec { padding: 22px 4px 8px; color: var(--muted); }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row.tap { min-height: 56px; }
.toast.b { top: auto; opacity: 0; transform: translateY(18px); transition: opacity .4s var(--ease), transform .55s var(--settle); }
.toast.b.in { opacity: 1; transform: none; }
.toast.b .ck { flex: none; }
.opt.on { box-shadow: inset 0 0 0 2px var(--sel); }
html:not([data-theme="dark"]) .opt.on { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--sel) 72%, transparent); }
.pill { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--card-2); display: inline-flex; align-items: center; font: 600 15px/1 var(--body); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }

.nav .title { flex: 1; text-align: center; margin-right: 56px; }
.prompt { position: absolute; left: 28px; right: 28px; top: 128px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.prompt .say { font: 800 28px/1.18 var(--display); letter-spacing: -.6px; min-height: 100px; text-wrap: balance; transition: opacity .6s var(--ease), transform .6s var(--ease); }
.prompt .say.out { opacity: 0; transform: translateY(-8px); }
.chart { position: absolute; left: var(--gutter); right: var(--gutter); top: 262px; height: 400px; padding: 0; overflow: hidden; border-radius: 28px; }
.chart svg { position: absolute; left: 0; top: 0; }
.rider { position: absolute; left: -44px; top: -44px; width: 88px; height: 88px;
  offset-path: path("M40 260 C 100 260 116 80 173 80 S 246 260 306 260"); offset-rotate: 0deg; offset-distance: 4%; offset-anchor: 50% 78%; }
.play .rider { animation: ride 12s cubic-bezier(.4,0,.6,1) forwards; }
@keyframes ride { from { offset-distance: 4%; } to { offset-distance: 83%; } }
.still .rider { animation: none !important; offset-distance: 83%; }
.lab { position: absolute; transform: translate(-50%, -50%); font: 700 14px/1 var(--body); color: var(--fg); background: var(--card); padding: 8px 12px; border-radius: 99px; box-shadow: inset 0 0 0 1.5px var(--line), 0 2px 8px rgba(0,0,0,.06); white-space: nowrap; }
.time { color: var(--muted); }

</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Close" data-ic="close"></button><div class="title t-head" data-a style="--i:0">Notice the urge</div></div>
<div class="prompt">
  <p class="t-foot time" data-a style="--i:1">About a minute. Just watch.</p>
  <p class="say" id="say" data-a style="--i:2">Notice where you feel it.</p>
</div>
<div class="card chart" data-a style="--i:3">
  <svg width="346" height="400" viewBox="0 0 346 400">
    <path d="M40 260 C 100 260 116 80 173 80 S 246 260 306 260 Z" fill="#5A9DFF" fill-opacity=".16" data-fade style="--d:900ms"/>
    <path d="M40 260 H306" stroke="var(--line)" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <path d="M40 260 C 100 260 116 80 173 80 S 246 260 306 260" fill="none" stroke="var(--fg)" stroke-width="3.5" stroke-linecap="round" class="draw" style="--len:460;--dur:2400ms;--d:300ms"/>
    <circle cx="40" cy="260" r="5" fill="var(--fg)"/><circle cx="306" cy="260" r="5" fill="var(--fg)"/>
    <g data-fade style="--d:600ms">
      <path d="M-10 318 C 50 304 110 308 170 318 C 240 330 300 310 356 306 V400 H-10Z" fill="#9CCBFF"/>
      <path d="M-10 346 C 60 334 120 336 190 348 C 260 360 310 340 356 336 V400 H-10Z" fill="#5A9DFF"/>
      <path d="M-10 374 C 70 362 140 366 210 376 C 280 386 330 370 356 366 V400 H-10Z" fill="#2F72F2"/>
      <path d="M78 342 C 90 330 108 328 118 338 C 106 336 96 340 90 348 Z" fill="#FFF8EE"/>
    </g>
  </svg>
  <span class="lab" style="left:80px;top:292px">It rises</span>
  <span class="lab" style="left:173px;top:292px">It peaks</span>
  <span class="lab" style="left:268px;top:292px">It passes</span>
  <div data-fade style="--d:1200ms;position:absolute;inset:0"><span class="rider" id="rider"></span></div>
</div>
<div class="dock"><button class="btn" data-a style="--i:4">It's passing</button><button class="link" data-a style="--i:5">I need more help</button></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });

document.getElementById('rider').innerHTML = DX.char('jelli', { mood: 'calm', size: 88 });
const say = document.getElementById('say');
const lines = [[3000, 'It rises. You do not have to act.'], [6000, 'This is the peak. Breathe out slowly.'], [9000, 'Watch it fall away.']];
lines.forEach(([t, s]) => DX.after(t, () => { say.classList.add('out'); setTimeout(() => { say.textContent = s; say.classList.remove('out'); }, 600); }));
DX.onStill(() => { say.textContent = 'Watch it fall away.'; });

</script>
</body></html>
