<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>049 NRT schedule</title>
<meta name="motion" content="Title and the country chips arrive, then the four schedule rows arrive top to bottom (600ms, 90ms stagger); each row's step-down glyph (72x40, widths by weeks, heights by mg) arrives with it; the selected one fills apricot. At 1.3s the 10 week row lands selected (520ms settle, light haptic). The list ends well above the dock.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .chips { margin-top: 18px; }
  .opts { margin-top: 18px; display: grid; gap: 8px; }
  .opts { gap: 10px !important; }
  .opt { min-height: 78px; padding: 12px 14px 12px 16px; }
  .opt.on { box-shadow: inset 0 0 0 2px var(--sel); }
  .opt .nm { font: 700 17px/1.25 var(--display); display: block; margin-bottom: 3px; }
  .opt .t-foot { font-size: 14px; }
  .stair { width: 72px; height: 40px; flex: none; color: var(--muted); }
  .stair svg { display: block; overflow: visible; }
  .stair rect { fill: color-mix(in srgb, var(--muted) 45%, transparent); }
  .opt.on .stair rect { fill: color-mix(in srgb, #FF9A5C 75%, transparent); }
  .play .opt.land { animation: land 520ms var(--settle) both; }
  @keyframes land { 0% { opacity: 1; transform: scale(.97); } 100% { opacity: 1; transform: none; } }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-ic="back"></button>
    <div class="grow"><div class="steps" aria-label="Step 2 of 4"><i class="on"></i><i class="on"></i><i></i><i></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <h1 class="t-title" data-a style="--i:0">Which schedule is on your pack?</h1>
      <p class="t-foot lead" data-a style="--i:1">Labels differ by brand and country. Pick the one that matches yours.</p>
      <div class="chips" data-a style="--i:2">
        <button class="chip on">US</button><button class="chip">UK</button><button class="chip">Australia</button><button class="chip">Germany</button><button class="chip">India</button><button class="chip">Elsewhere</button>
      </div>
      <div class="opts">
        <button class="opt on" id="pick" data-a style="--i:3"><span class="grow"><span class="nm">10 weeks from 21 mg</span><span class="t-foot">Three steps: 21, 14, 7 mg</span></span><span class="stair" data-s="6,2,2|21,14,7"></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:4"><span class="grow"><span class="nm">8 weeks from 21 mg</span><span class="t-foot">Three steps, shorter start</span></span><span class="stair" data-s="4,2,2|21,14,7"></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:5"><span class="grow"><span class="nm">8 weeks from 14 mg</span><span class="t-foot">Two steps: 14, 7 mg</span></span><span class="stair" data-s="6,2|14,7"></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:6"><span class="grow"><span class="nm">My pack says something else</span><span class="t-foot">Enter each step yourself</span></span><span class="radio"></span></button>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:7" data-go="050-nrt-plan">Use this schedule</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  /* tiny step-down shape: widths by weeks (out of 10), heights by mg (out of 21) */
  document.querySelectorAll('[data-s]').forEach(e => {
    const [w, h] = e.dataset.s.split('|').map(s => s.split(',').map(Number));
    let x = 0, r = '';
    w.forEach((wk, i) => { const bw = wk / 10 * 72, bh = h[i] / 21 * 38; r += `<rect x="${x + .5}" y="${40 - bh}" width="${bw - 3}" height="${bh}" rx="4"/>`; x += bw; });
    e.innerHTML = `<svg viewBox="0 0 72 40" width="72" height="40">${r}</svg>`;
  });
  const pick = document.getElementById('pick');
  DX.after(0, () => pick.classList.remove('on', 'land'));
  DX.after(1300, () => pick.classList.add('on', 'land'));
</script>
</body></html>
