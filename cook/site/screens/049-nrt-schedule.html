<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>049 NRT schedule</title>
<meta name="motion" content="Title and the subtitle with its 'US' country pill arrive (tapping the pill opens a country sheet), then the four schedule rows arrive top to bottom (600ms, 90ms stagger), each subtitle listing its mg steps and their weeks; each row's step-down glyph (80x44, widths by weeks, heights by mg) arrives with it in apricot outline (the custom row's glyph is an empty dashed frame). At 1.3s the 10 week row lands selected (520ms settle, light haptic) and its glyph fills apricot and takes a deeper outline over 300ms. The pack hint arrives last.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .wrap { padding: 66px var(--gutter) 0; }
  .wrap .lead { margin-top: 8px; color: var(--muted); }
  .pill { display: inline-flex; vertical-align: 1px; align-items: center; gap: 4px; height: 28px; padding: 0 8px 0 11px; margin: 0 2px; border-radius: 99px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); font: 700 14px/1 var(--body); }
  .pill svg { width: 14px; height: 14px; }
  .opts { margin-top: 24px; display: grid; gap: 12px; }
  .opt { min-height: 90px; padding: 12px 14px 12px 16px; }
  .opt .nm { font: 700 17px/1.25 var(--display); display: block; margin-bottom: 3px; }
  .opt .t-foot { font-size: 14px; }
  .stair { width: 80px; height: 44px; flex: none; margin-right: 8px; --apr: #F08A4B; --apr-fill: #FFB98A; }
  [data-theme="dark"] .stair { --apr: #FFB27A; --apr-fill: #FFB27A; }
  .stair svg { display: block; overflow: visible; }
  .stair rect { fill: color-mix(in srgb, var(--apr-fill) 14%, transparent); stroke: var(--apr); stroke-width: 1.8; transition: fill .3s var(--ease); }
  [data-theme="dark"] .stair rect { fill: transparent; }
  /* selected: the glyph fills and takes a deeper outline so it holds on the selection tint */
  .opt.on .stair rect { fill: var(--apr-fill); stroke: #B4531E; stroke-width: 2; }
  [data-theme="dark"] .opt.on .stair rect { stroke: #FFE3C8; }
  /* custom: an empty dashed glyph */
  .stair.empty rect { fill: none !important; stroke: color-mix(in srgb, var(--fg) 40%, transparent); stroke-dasharray: 4 3.5; stroke-width: 1.6; }
  .hint { margin-top: 20px; display: flex; gap: 10px; align-items: center; color: var(--muted); padding: 0 4px; }
  .hint svg { width: 20px; height: 20px; flex: none; }
  .play .opt.land { animation: land 520ms var(--settle) both; }
  @keyframes land { 0% { opacity: 1; transform: scale(.97); } 100% { opacity: 1; transform: none; } }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-ic="back"></button>
    <div class="grow"><div class="steps" aria-label="Step 2 of 4"><i class="on"></i><i class="on"></i><i></i><i></i></div></div>
    <span style="width:44px"></span>
  </div>
  <div class="scroll">
    <div class="wrap">
      <h1 class="t-title" data-a style="--i:0">Which schedule is<br>on your pack?</h1>
      <p class="t-foot lead" data-a style="--i:1">Labels differ by country. Yours: <button class="pill" aria-label="Country: US. Change">US<span data-ic="down"></span></button></p>
      <div class="opts">
        <button class="opt on" id="pick" data-a style="--i:3"><span class="grow"><span class="nm">10 weeks from 21 mg</span><span class="t-foot">21, 14 and 7 mg<br>6, 2 and 2 weeks</span></span><span class="stair" data-s="6,2,2|21,14,7"></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:4"><span class="grow"><span class="nm">8 weeks from 21 mg</span><span class="t-foot">21, 14 and 7 mg<br>4, 2 and 2 weeks</span></span><span class="stair" data-s="4,2,2|21,14,7"></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:5"><span class="grow"><span class="nm">8 weeks from 14 mg</span><span class="t-foot">14 and 7 mg<br>6 and 2 weeks</span></span><span class="stair" data-s="6,2|14,7"></span><span class="radio"></span></button>
        <button class="opt" data-a style="--i:6"><span class="grow"><span class="nm">Something else</span><span class="t-foot">Enter your own steps</span></span><span class="stair empty"><svg viewBox="0 0 80 44" width="80" height="44"><rect x="1" y="1" width="76" height="42" rx="6"/></svg></span><span class="radio"></span></button>
      </div>
      <p class="t-foot hint" data-a style="--i:7"><span data-ic="note"></span>The steps are listed on the side of the box.</p>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:8" data-go="050-nrt-plan">Use this schedule</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.innerHTML = DX.icon(e.dataset.ic));
  /* tiny step-down shape: widths by weeks (out of 10), heights by mg (out of 21) */
  document.querySelectorAll('[data-s]').forEach(e => {
    const [w, h] = e.dataset.s.split('|').map(s => s.split(',').map(Number));
    let x = 0, r = '';
    w.forEach((wk, i) => { const bw = wk / 10 * 80, bh = h[i] / 21 * 42; r += `<rect x="${x + 1}" y="${43 - bh}" width="${bw - 4}" height="${bh}" rx="4"/>`; x += bw; });
    e.innerHTML = `<svg viewBox="0 0 80 44" width="80" height="44">${r}</svg>`;
  });
  const pick = document.getElementById('pick');
  DX.after(0, () => pick.classList.remove('on', 'land'));
  DX.after(1300, () => pick.classList.add('on', 'land'));
</script>
</body></html>
