<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>062 Reminders</title>
<meta name="motion" content="Groups arrive on the stagger; at 1.0s the Craving forecast toggle slides on (300ms settle, light haptic); the toggle is its own done state (no toast). That makes three, so the Daily lesson toggle dims to its disabled state (the off track at 40%, 300ms) and its line cross-fades to the short reason. Xero settles onto the top edge of the first group at 450ms. Tapping the disabled toggle gives a gentle shake and a warning haptic. Each time pill opens a wheel picker sheet; the new time settles into the pill.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* settings family: section labels, small tinted icon tiles (one tint per meaning), values */
.hd { display: grid; gap: 6px; padding-top: 58px; padding-right: 84px; }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.ico-tile.apr { background: #FFE6D0; color: #A8481F; } .ico-tile.sky { background: #E1E7F8; color: #2C468E; } .ico-tile.mint { background: #DDF1E4; color: #22704A; }
[data-theme="dark"] .ico-tile.apr { background: rgba(255,195,138,.16); color: #FFC38A; } [data-theme="dark"] .ico-tile.sky { background: rgba(160,186,255,.15); color: #B4C6FF; } [data-theme="dark"] .ico-tile.mint { background: rgba(159,227,188,.13); color: #9FE3BC; }
.list > .row { min-height: 66px; padding-top: 12px; padding-bottom: 12px; }
.list > .row.timed { align-items: flex-start; }
.list > .row.timed .ico-tile, .list > .row.timed .toggle { margin-top: 2px; }
.sec { padding: 24px 4px 10px; font-size: 14px; color: var(--muted); }
/* time pills read as tappable: an outline and a small chevron */
.time { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; margin-top: 6px; border-radius: 11px; background: var(--card); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--fg) 26%, transparent); font: 600 15px/1 var(--body); color: var(--fg); font-variant-numeric: tabular-nums; }
.time svg { width: 14px; height: 14px; color: var(--muted); }
/* disabled toggle: the kit's off track at 40% */
.toggle.dis { opacity: .4; }
.row .ico-tile, .row .rt, .toggle { transition: opacity .3s var(--ease); }
.row.capped .ico-tile, .row.capped .rt { opacity: .55; }
.capnote { transition: opacity .3s var(--ease); }
/* Xero stands on the top edge of the first group */
.perch { position: absolute; right: 26px; top: -74px; width: 76px; height: 76px; }
.grp1 { position: relative; }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Reminders</h1><p class="t-foot muted" data-a style="--i:1">Gentle nudges, at most three a day.</p></div>
  <p class="t-foot muted sec" data-a style="--i:2">Every day</p>
  <div class="grp1" data-a style="--i:3"><div class="perch" id="xr" data-settle style="--d:450ms"></div><div class="list">
    <div class="row timed"><span class="ico-tile s apr" data-ic="sun"></span><div class="grow"><div class="t-body rt">Morning pledge</div><button class="time" aria-label="Change time, 8:00 AM">8:00 AM<span data-ic="down" data-s="14" data-w="2.6"></span></button></div><span class="toggle on"></span></div>
    <div class="row timed"><span class="ico-tile s sky" data-ic="moon"></span><div class="grow"><div class="t-body rt">Evening check-in</div><button class="time" aria-label="Change time, 9:00 PM">9:00 PM<span data-ic="down" data-s="14" data-w="2.6"></span></button></div><span class="toggle on"></span></div>
    <div class="row" id="lesson"><span class="ico-tile s mint" data-ic="note"></span><div class="grow"><div class="t-body rt">Daily lesson</div><div class="t-foot muted capnote" id="lnote">Off. You will find it on Today</div></div><span class="toggle" id="lt" aria-disabled="false"></span></div>
  </div></div>
  <p class="t-foot muted sec" data-a style="--i:4">Before a craving</p>
  <div class="list" data-a style="--i:5">
    <div class="row"><span class="ico-tile s sky" data-ic="wave"></span><div class="grow"><div class="t-body rt">Craving forecast</div><div class="t-foot muted">Before coffee and stress</div></div><span class="toggle" id="fc"></span></div>
  </div>
  <p class="t-foot muted sec" data-a style="--i:6">Quiet hours</p>
  <div class="list" data-a style="--i:7">
    <div class="row" data-go="064-settings-quietHours"><span class="ico-tile s sky" data-ic="clock"></span><div class="grow"><div class="t-body rt">10:00 PM to 8:00 AM</div><div class="t-foot muted">Anything due waits until morning</div></div><span class="chev" data-ic="chev" data-s="18"></span></div>
  </div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });

document.getElementById('xr').innerHTML = DX.char('xero', { mood: 'hello', size: 76 });
const fc = document.getElementById('fc'), lt = document.getElementById('lt'), lesson = document.getElementById('lesson'), lnote = document.getElementById('lnote');
/* Forecast goes on: that is three, so Daily lesson is capped (disabled toggle, the reason in its own row). */
DX.beat(1000, () => {
  fc.classList.add('on');
  lt.classList.add('dis'); lt.setAttribute('aria-disabled', 'true'); lesson.classList.add('capped');
  lnote.style.opacity = 0; setTimeout(() => { lnote.textContent = 'Three a day is the limit'; lnote.style.opacity = 1; }, DX.still ? 0 : 300);
});
</script>
</body></html>
