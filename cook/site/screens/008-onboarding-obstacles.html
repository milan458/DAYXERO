<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>008 Onboarding obstacles</title>
<meta name="motion" content="Progress eases from 5/11 to 6/11 (900ms settle). Question, the chips (006's pattern: natural widths, balanced rows of three, three and two) and the what-each-adds list (Irritability, 1-minute reset) arrive (600ms, 90ms stagger). At 900ms Social situations takes the kit selection with a 520ms spring bump and a light selection haptic; the count bumps from 1 picked to 2 picked and a second row (Social situations, What to say) settles in under the first (700ms settle). The horizon strip above the dock settles up in three paper layers (0, 120, 240ms; 40px, 900ms settle) and Xero (64px) settles onto its crest last (from 420ms), then waves: his right arm swings 16 degrees twice (2 x 800ms, from 1300ms).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Onboarding header: back button and progress only (no avatar); the bar ends at the gutter so the sun knob never collides. */
  .nav { padding-right: 26px; }
  /* Obstacles only (what gets in the way). Cravings and stress were asked on 006, so they are not here.
     Same chip pattern as 006: natural widths (12px side padding), hand-balanced rows (3, 3, 2). */
  .answers { gap: 12px !important; padding-top: 18px !important; }
  .flow { display: grid; gap: 8px; }
  .flow .r { display: flex; gap: 8px; }
  .flow .chip { flex: none; min-height: 48px; padding: 0 12px; white-space: nowrap; }
  /* What each pick unlocks: one row per pick, the obstacle on the left, the tool it adds on the right. */
  .gets { display: grid; gap: 10px; margin-top: 6px; }
  .gets .hd { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); }
  .gets .hd b { color: var(--fg); font-weight: 700; }
  .gets .list > .row { min-height: 64px; padding: 10px 14px; gap: 12px; }
  .gets .from { color: var(--muted); white-space: nowrap; font: 500 15px/1.25 var(--body); }
  .gets .arr { width: 16px; height: 16px; flex: none; color: var(--muted); align-self: center; display: grid; }
  .gets .arr svg { width: 16px; height: 16px; }
  .gets .to { font: 700 16px/1.25 var(--display); letter-spacing: -.2px; }
  .gets .ico-tile { width: 40px; height: 40px; border-radius: 12px; }
  .gets .ico-tile svg { width: 30px; height: 30px; overflow: visible; }
  .gets .grow { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; row-gap: 2px; }
  .gets .row.new { display: none; }
  .gets.two .row.new { display: flex; }
  .play .gets.two .row.new { animation: dx-settle 700ms var(--settle) both; }
  /* Round 10: the onboarding horizon strip (003 to 011, one element). Three flat paper hills in the launch style, soft paper
     shadows and no crest lines, sitting just above the dock and running full-bleed behind it; the screen's character stands on the
     crest. Light: cream and peach paper. Dark: the kit's night-meadow hills, kept quiet. */
  .screen { --hz-1: #FFD3A6; --hz-2: #FFE6CA; --hz-3: #F9B386; --hz-lift: rgba(120,44,20,.16); }
  [data-theme="dark"] .screen { --hz-1: #16233F; --hz-2: #0F1A31; --hz-3: #0A1326; --hz-lift: rgba(0,0,0,.55); }
  .hz { position: absolute; z-index: 1; left: 0; top: calc(var(--hz-b, 752px) - 134px); width: 390px; height: 300px; pointer-events: none; }
  .hz .l { position: absolute; left: 0; top: 0; display: block; }
  .hz .l1 { filter: drop-shadow(0 -3px 8px var(--hz-lift)); }
  .hz .l2 { filter: drop-shadow(0 -4px 10px var(--hz-lift)); }
  .hz .l3 { filter: drop-shadow(0 -5px 12px var(--hz-lift)); }
  .hz .who { position: absolute; }
  .play .hz .l { animation: hz-up 900ms var(--settle) both; }
  .play .hz .l2 { animation-delay: 120ms; }
  .play .hz .l3 { animation-delay: 240ms; }
  @keyframes hz-up { from { transform: translateY(40px); } to { transform: none; } }
  .dock { background: none; }
  .screen { --hz-b: 712px; }
  .dock { padding-bottom: 24px; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:54.5%"></i></div></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>What usually gets in the way?</h1>
    <p class="t-body muted" data-a style="--i:1">Pick any that might trip you up after Quit Day. I&rsquo;ll plan for each.</p>
  </div>
  <div class="answers">
    <div class="flow" data-a style="--i:2">
      <div class="r"><button class="chip on">Irritability</button><button class="chip" id="social">Social situations</button><button class="chip">Hunger</button></div>
      <div class="r"><button class="chip">Weight gain</button><button class="chip">Poor sleep</button><button class="chip">Restlessness</button></div>
      <div class="r"><button class="chip">Trouble focusing</button><button class="chip">Low motivation</button></div>
    </div>
    <div class="gets" id="gets" data-a style="--i:3">
      <p class="t-foot hd"><span><b id="n">2 picked.</b> Here&rsquo;s what each one adds</span></p>
      <div class="list">
        <div class="row"><span class="ico-tile" data-art="reset"></span><div class="grow"><span class="t-foot from">Irritability</span><span class="arr" data-arrow></span><span class="to">1-minute reset</span></div></div>
        <div class="row new"><span class="ico-tile" data-art="talk"></span><div class="grow"><span class="t-foot from">Social situations</span><span class="arr" data-arrow></span><span class="to">What to say</span></div></div>
      </div>
    </div>
  </div>

  <div class="hz" id="hz" aria-hidden="true"></div>

  <div class="dock">
    <button class="btn" data-a style="--i:4">Continue</button>
    <a class="link" data-a style="--i:5">Skip for now</a>
  </div>
</div>
<script>
  /* Round 10: the horizon strip. Strip y 134 is the top of the button; the character's feet sit on the middle hill's crest. */
  function horizon(o) {
    const back = 'M0 82 C50 74 100 72 150 77 C198 82 234 78 268 66 C306 53 350 47 390 53 L390 300 L0 300 Z',
      mid = 'M0 108 C46 100 96 106 140 114 C180 121 214 114 250 104 C282 95 312 91 342 94 C362 96 378 100 390 104 L390 300 L0 300 Z',
      front = 'M0 128 C58 120 118 124 178 134 C236 143 300 136 350 124 C368 120 380 119 390 120 L390 300 L0 300 Z';
    const l = (i, d, extra = '') => `<svg class="l l${i}" width="390" height="300" viewBox="0 0 390 300"><path d="${d}" fill="var(--hz-${i})"/>${extra}</svg>`;
    const s = o.size || 72, x = o.x ?? 312, y = o.y ?? 92;
    return l(1, back) + l(2, mid, o.pond || '') + `<div class="who" data-settle style="--d:420ms;left:${x - s / 2}px;top:${(o.top ?? (y - .965 * s)).toFixed(1)}px;width:${s}px;height:${s}px${o.clip ? `;overflow:hidden;height:${o.clip}px` : ''}"><div id="${o.id || 'hzc'}">${o.art}</div></div>` + (o.over || '') + l(3, front);
  }
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  /* Paper-cut tool spots (round 10: flat, no highlight strokes): flat cut pieces, a crescent side shade, a soft paper shadow.
     A sun-timer for the reset, two overlapping speech bubbles for what to say. */
  const sh = DX.theme === 'dark' ? 'rgba(0,0,0,.55)' : 'rgba(120,52,24,.24)';
  const pf = id => `<defs><filter id="${id}" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="${sh}"/></filter></defs>`;
  const ART = {
    reset: `<svg viewBox="0 0 32 32" aria-hidden="true">${pf('t1')}
      <g filter="url(#t1)"><rect x="12.5" y="2" width="7" height="4.4" rx="1.8" fill="#FF7155"/><rect x="16.4" y="2" width="3.1" height="4.4" rx="1.4" fill="#E85A3E"/></g>
      <g filter="url(#t1)"><circle cx="16" cy="18.5" r="11.8" fill="#FFF8EE"/><path d="M22.5 8.6 A11.8 11.8 0 0 1 16 30.3 A13 13 0 0 0 22.5 8.6 Z" fill="#EFE1CF"/></g>
      <path d="M16 18.5 V9.4 A9.1 9.1 0 0 1 24.9 16.6 Z" fill="#FFC93C" filter="url(#t1)"/>
      <circle cx="16" cy="18.5" r="2.1" fill="#1E1A3A"/></svg>`,
    talk: `<svg viewBox="0 0 32 32" aria-hidden="true">${pf('t2')}
      <g filter="url(#t2)"><path d="M6 5 h14 a4.5 4.5 0 0 1 4.5 4.5 v6 a4.5 4.5 0 0 1 -4.5 4.5 h-8 l-5 4 v-4 h-1 a4.5 4.5 0 0 1 -4.5 -4.5 v-6 a4.5 4.5 0 0 1 4.5 -4.5 z" fill="#FF7155"/>
        <path d="M20.5 5.2 a4.5 4.5 0 0 1 4 4.3 v6 a4.5 4.5 0 0 1 -4.5 4.5 h-2 c2.4 -.6 3.6 -2.4 3.6 -4.6 v-6 c0 -1.8 -.4 -3.2 -1.1 -4.2 z" fill="#E85A3E"/></g>
      <g filter="url(#t2)"><path d="M16.5 13 h10 a3.6 3.6 0 0 1 3.6 3.6 v5 a3.6 3.6 0 0 1 -3.6 3.6 h-.8 v3.8 l-4.6 -3.8 h-4.6 a3.6 3.6 0 0 1 -3.6 -3.6 v-5 a3.6 3.6 0 0 1 3.6 -3.6 z" fill="#FFF8EE"/>
        <path d="M13 21.6 c.4 2 1.8 3.4 3.8 3.6 h4.4 l1.2 1 h-5.9 a3.6 3.6 0 0 1 -3.5 -3.6 z" fill="#EFE1CF"/></g>
      <g fill="#FF7155"><circle cx="18.4" cy="19.2" r="1.35"/><circle cx="21.6" cy="19.2" r="1.35"/><circle cx="24.8" cy="19.2" r="1.35"/></g></svg>`
  };
  document.querySelectorAll('[data-art]').forEach(e => e.innerHTML = ART[e.dataset.art]);
  /* Xero waving on the strip (002's wave: right arm raised, swinging twice, two small motion marks). */
  const ink = DX.theme === 'dark' ? '#F3E9DE' : '#24163A';
  const swing = DX.still ? '' : '<animateTransform attributeName="transform" type="rotate" values="0 162 112;-16 162 112;0 162 112;-16 162 112;0 162 112" keyTimes="0;.25;.5;.75;1" dur="1.6s" begin="1.3s" fill="freeze"/>';
  const wave = `<path d="M162 112 C172 98 178 86 176 74" fill="none" stroke="#FF7155" stroke-width="12" stroke-linecap="round">${swing}</path>`
    + `<g fill="none" stroke="${ink}" stroke-width="3.4" stroke-linecap="round" opacity=".55"><path d="M186 62 q7 6 6 14"/><path d="M193 52 q9 9 6 22"/></g>`;
  document.getElementById('hz').innerHTML = horizon({ x: 318, size: 64, art: DX.char('xero', { mood: 'hello', size: 64 })
    .replace('style="display: block"', 'style="display: block; overflow: visible"')
    .replace(/<path d="M164 124 C174 132 178 142 176 152"[^>]*><\/path>/, wave) });
  document.querySelectorAll('[data-arrow]').forEach(e => e.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13.5 6.5L19 12l-5.5 5.5"/></svg>');
  const bar = document.getElementById('bar'), social = document.getElementById('social'), n = document.getElementById('n'), gets = document.getElementById('gets');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '45.5%'); void bar.offsetWidth; bar.style.transition = '';
    social.classList.remove('on', 'bump'); n.textContent = '1 picked.'; n.classList.remove('bump'); gets.classList.remove('two'); });
  DX.after(250, () => bar.style.setProperty('--p', '54.5%'));
  const land = () => { social.classList.add('on', 'bump'); n.textContent = '2 picked.'; n.style.display = 'inline-block'; n.classList.add('bump'); gets.classList.add('two'); };
  DX.after(900, land); DX.onStill(land);
</script>
</body></html>
