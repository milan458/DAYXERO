<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>008 Onboarding obstacles</title>
<meta name="motion" content="Progress eases from 5/11 to 6/11 (900ms settle). Question and the two-column chip grid arrive (600ms, 90ms stagger), then the count line. At 900ms Stress fills to selected with a 520ms spring bump and a light selection haptic, and the count line changes from 1 picked to 2 picked with a bump.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .answers { gap: 14px !important; padding-top: 22px !important; }
  .picked { margin-top: 6px; text-align: center; }
  .lbl { font: 700 14px/1.3 var(--body); color: var(--fg); margin: 4px 0 0; }
  .answers .chips.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answers .chip { min-height: 52px; justify-content: flex-start; padding: 0 16px; }
  .plan { display: flex; gap: 10px; align-items: center; margin-top: 6px; padding: 10px 6px 10px 16px; }
  .plan .xc { width: 88px; height: 88px; flex: none; }
  .plan .rows { display: grid; gap: 2px; margin-top: 6px; }
  .plan .r { display: flex; gap: 8px; align-items: baseline; }
  .plan .r .t-foot.k { color: var(--muted); width: 74px; flex: none; }
  .plan .r .t-foot.v { font-weight: 600; }
  .sum { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .sum .ico-tile { background: var(--sel); color: var(--sel-fg); width: 36px; height: 36px; border-radius: 11px; }
  .sum .ico-tile svg { width: 18px; height: 18px; }
  .sum .num { font-size: 16px; letter-spacing: 0; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:54.5%"></i></div></div>
    <div class="avatar" id="av"></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>What usually gets in the way?</h1>
    <p class="t-body muted" data-a style="--i:1">Pick any that might trip you up. I'll build your plan around them.</p>
  </div>
  <div class="answers">
    <div class="chips two" data-a style="--i:2">
      <button class="chip on">Cravings</button><button class="chip" id="stress">Stress</button>
      <button class="chip">Irritability</button><button class="chip">Low motivation</button>
      <button class="chip">Social situations</button><button class="chip">Weight gain</button>
      <button class="chip">Sleep</button><button class="chip">Something else</button>
    </div>
    <p class="t-foot muted picked" data-a style="--i:3"><span id="n">2 picked</span>. I'll add a tool for each to your plan.</p>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:4">Continue</button>
    <a class="link" data-a style="--i:5">Skip this one</a>
  </div>
</div>
<script>
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  document.getElementById('av').innerHTML = DX.char('xero', { mood: 'hello', size: 40 });
  const bar = document.getElementById('bar'), stress = document.getElementById('stress'), n = document.getElementById('n');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '45.5%'); void bar.offsetWidth; bar.style.transition = '';
    stress.classList.remove('on', 'bump'); n.textContent = '1 picked'; n.classList.remove('bump'); });
  DX.after(250, () => bar.style.setProperty('--p', '54.5%'));
  const land = () => { stress.classList.add('on', 'bump'); n.textContent = '2 picked'; n.style.display = 'inline-block'; n.classList.add('bump'); };
  DX.after(900, land); DX.onStill(land);
</script>
</body></html>
