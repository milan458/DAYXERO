<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>008 Onboarding obstacles</title>
<meta name="motion" content="Progress eases from 5/11 to 6/11 (900ms settle). Question, the two-column chip grid (3 rows of 2) and the tools card arrive (600ms, 90ms stagger). At 900ms Social situations fills to selected with a 520ms spring bump and a light selection haptic; the count changes from 1 picked to 2 picked with a bump and its tool line fades in (400ms).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* Obstacles only (what gets in the way). Cravings and stress were asked on 006, so they are not here. 3 rows of 2: no orphans. */
  .answers { gap: 16px !important; padding-top: 26px !important; }
  .answers .chips.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .answers .chip { min-height: 62px; justify-content: flex-start; padding: 0 16px; }
  .tools { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 12px; margin-top: 8px; padding: 16px 16px 16px 10px; }
  .tools .xc { width: 64px; height: 64px; align-self: start; }
  .tools b { font-weight: 700; }
  .tools ul { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
  .tools li { display: flex; gap: 8px; align-items: baseline; color: var(--muted); }
  .tools li::before { content: ""; width: 6px; height: 6px; border-radius: 99px; background: var(--coral); flex: none; transform: translateY(-2px); }
  .tools li b { color: var(--fg); font-weight: 600; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="nav">
    <button class="icon-btn" aria-label="Back" data-icon="back"></button>
    <div class="grow"><div class="progress sun"><i id="bar" style="--p:54.5%"></i></div></div>
    <div class="avatar" id="av"></div>
  </div>

  <div class="q">
    <h1 class="t-large" data-a>What usually gets in the way?</h1>
    <p class="t-body muted" data-a style="--i:1">Pick any that might trip you up after Quit Day. I&rsquo;ll plan for each.</p>
  </div>
  <div class="answers">
    <div class="chips two" data-a style="--i:2">
      <button class="chip">Weight gain</button><button class="chip on">Irritability</button>
      <button class="chip">Low motivation</button><button class="chip" id="social">Social situations</button>
      <button class="chip">Poor sleep</button><button class="chip">Trouble focusing</button>
    </div>
    <div class="card tools" data-a style="--i:3"><div class="xc" id="xc"></div>
      <div><p class="t-foot"><b id="n">2 picked.</b> I&rsquo;ll add a tool for each.</p>
        <ul class="t-foot" id="list"><li><span><b>Irritability:</b> a 2-minute reset</span></li><li id="li2"><span><b>Social situations:</b> what to say</span></li></ul></div></div>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:4">Continue</button>
    <a class="link" data-a style="--i:5">Skip this one</a>
  </div>
</div>
<script>
  document.querySelectorAll('[data-icon]').forEach(e => e.innerHTML = DX.icon(e.dataset.icon));
  document.getElementById('av').innerHTML = DX.char('xero', { mood: 'hello', size: 40 });
  document.getElementById('xc').innerHTML = DX.char('xero', { mood: 'hello', size: 64 });
  const bar = document.getElementById('bar'), social = document.getElementById('social'), n = document.getElementById('n'), li2 = document.getElementById('li2');
  DX.after(0, () => { bar.style.transition = 'none'; bar.style.setProperty('--p', '45.5%'); void bar.offsetWidth; bar.style.transition = '';
    social.classList.remove('on', 'bump'); n.textContent = '1 picked.'; n.classList.remove('bump'); li2.style.opacity = 0; });
  DX.after(250, () => bar.style.setProperty('--p', '54.5%'));
  const land = () => { social.classList.add('on', 'bump'); n.textContent = '2 picked.'; n.style.display = 'inline-block'; n.classList.add('bump'); li2.style.transition = 'opacity .4s'; li2.style.opacity = 1; };
  DX.after(900, land); DX.onStill(land);
</script>
</body></html>
