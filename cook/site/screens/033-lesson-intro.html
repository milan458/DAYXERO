<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>033 Lesson intro</title>
<meta name="motion" content="The paper-cut road card fades up (600ms) and the little open-top car rolls in from the left (900ms settle curve) with Xero at the wheel, then idles with a 2px bounce (1.2s loop). The two back-seat passengers chatter: their speech bubbles pop in turn (spring 420ms, 700ms apart) and keep pulsing on a 2.4s loop while Xero keeps his eyes on the road. Title, subtitle and the three 'inside' rows arrive with a 90ms stagger, then the Begin button. Light haptic on Begin.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .art { position: relative; height: 232px; border-radius: 26px; overflow: hidden; margin-top: 8px; }
  .art .scene { position: absolute; inset: 0; }
  .art .scene svg { display: block; }
  .art .tag { position: absolute; left: 14px; top: 14px; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
    border-radius: 99px; background: rgba(255,248,238,.9); color: var(--ink); font: 600 13px/1 var(--body); }
  [data-theme="dark"] .art .tag { background: rgba(14,19,34,.62); color: var(--cream); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
  .art .tag svg { width: 15px; height: 15px; }
  .head { margin-top: 22px; display: grid; gap: 8px; }
  .inside { margin-top: 20px; }
  .list.inside > .row { min-height: 54px; padding-block: 8px; }
  .inside .t-foot { color: var(--muted); }
  .dock .link { height: 30px; font: 500 14px/1 var(--body); color: var(--muted); opacity: 1; }
  .dock .link svg { width: 16px; height: 16px; }
  /* car motion: rolls in, idles; passengers chatter */
  .car { transform-box: view-box; }
  .play .car { animation: drive-in 900ms var(--settle) 200ms both; }
  @keyframes drive-in { from { transform: translateX(-90px); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
  .play .idle { animation: idle 1.2s ease-in-out 1.1s infinite; }
  @keyframes idle { 50% { transform: translateY(-2px); } }
  .chat { transform-box: fill-box; transform-origin: 30% 100%; }
  .play .chat { animation: chat-in 420ms var(--spring) both, chat 2.4s ease-in-out infinite; animation-delay: var(--cd), calc(var(--cd) + 600ms); }
  @keyframes chat-in { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
  @keyframes chat { 0%, 100% { transform: none; } 12% { transform: scale(1.1) rotate(-3deg); } 24% { transform: none; } }
  .still .car, .still .idle, .still .chat { animation: none !important; opacity: 1 !important; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close"></button>
    <div class="grow"><div class="steps"><i></i><i></i><i></i><i></i></div></div>
    <span class="t-foot muted" style="width:44px;text-align:right">Day 7</span>
  </div>
  <div class="scroll" style="padding-top:104px">
    <div class="pad">
      <div class="art" data-a style="--i:0">
        <div class="scene" id="scene"></div>
        <span class="tag"><span data-ic="clock"></span>3 min</span>
      </div>
      <div class="head">
        <p class="t-foot muted" data-a style="--i:1">Today's lesson · Fri, Nov 13</p>
        <h1 class="t-large" data-a style="--i:2">The noisy passengers</h1>
        <p class="t-body muted" data-a style="--i:3">Let them talk. Keep driving.</p>
      </div>
      <div class="list inside" data-a style="--i:4">
        <div class="row"><span class="ico-tile" data-ic="card"></span><div class="grow"><p class="t-head" style="font-size:17px">A short read</p><p class="t-foot">Four cards, about 90 seconds</p></div></div>
        <div class="row"><span class="ico-tile" data-ic="hand"></span><div class="grow"><p class="t-head" style="font-size:17px">A few activities</p><p class="t-foot">Quick taps, no wrong answers</p></div></div>
        <div class="row"><span class="ico-tile" data-ic="flag"></span><div class="grow"><p class="t-head" style="font-size:17px">Today's mission</p><p class="t-foot">One small thing to try today</p></div></div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:6" data-go="034-lesson-cards">Begin</button>
    <button class="link" data-a style="--i:7" data-go="035-lesson-audio"><span data-ic="headphones" style="display:inline-flex;margin-right:6px"></span>or listen instead</button>
  </div>
</div>
<script>
  const FLAG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 21V4.5M6 4.5h11l-2.4 4.2L17 13H6"/></svg>';
  document.querySelectorAll('[data-ic]').forEach(e => e.insertAdjacentHTML('afterbegin', e.dataset.ic === 'flag' ? FLAG : DX.icon(e.dataset.ic, { size: 20 })));

  /* Lesson art: paper-cut dawn road, Xero at the wheel of a little open-top car, two chattering passengers in the back.
     Dark mode follows the kit's pre-dawn sky (navy, low warm sun, a few stars). */
  const dark = DX.theme === 'dark';
  const C = dark
    ? { sky: ['#0D1630', '#24335C', '#5B5578'], sun: '#F7B871', sunO: .85, halo: '#F2A65A', haloO: .3, hills: ['#1E2B4A', '#16233F', '#0F1A31'], road: '#232E4D', dash: '#8E97B5', dashO: .55,
        body: '#D8CDBB', shade: '#B3A895', stripe: '#E0876A', seat: '#2B3658', frame: '#B3A895', tyre: '#070B16', hub: '#B3A895', lamp: '#F7B871', glass: .14, puff: '#8E98B6', puff2: '#6F7997', bub: '#E6DCCB', marks: '#1E1A3A', speed: '#FFF8EE', speedO: .28, shadow: .5 }
    : { sky: ['#FF7E5A', '#FFB877', '#FFE6BF'], sun: '#FFD25E', sunO: 1, halo: '#FFF6C8', haloO: .6, hills: ['#FF9D6E', '#FF7A55', '#E85A3E'], road: '#4A3352', dash: '#FFE6C8', dashO: .9,
        body: '#FFF4E4', shade: '#F1D7BC', stripe: '#FF7A55', seat: '#2E2A4F', frame: '#2A2440', tyre: '#2A2440', hub: '#F1D7BC', lamp: '#FFD966', glass: .4, puff: '#B8BDD0', puff2: '#979EB8', bub: '#FFF8EE', marks: '#1E1A3A', speed: '#FFF8EE', speedO: .8, shadow: .22 };
  const stars = dark ? [[40, 30], [118, 18], [168, 44], [232, 22], [312, 30], [210, 70]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 2 ? 1.1 : 1.6}" fill="#fff" opacity="${i % 2 ? .5 : .85}"/>`).join('') : '';
  const sunY = dark ? 128 : 66;
  const xero = DX.char('xero', { mood: 'hello', size: 94 }).replace('<svg ', '<svg x="152" y="64" ');
  /* a tiny smoke-grey passenger: cloud-puff head, raised brows, open talking mouth; leans toward the driver */
  const puff = (x, y, k, tilt, grin) => `<g transform="translate(${x} ${y}) rotate(${tilt}) scale(${k})">
      <path d="M-13 32 V4 A13 13 0 0 1 -9 -5 A7 7 0 0 1 0 -12 A8 8 0 0 1 12 -6 A13 13 0 0 1 13 4 V32 Z" fill="${C.puff}"/>
      <path d="M12 -6 A13 13 0 0 1 13 4 V32 H7 V4 C8 -1 9 -4 12 -6Z" fill="${C.puff2}"/>
      <path d="M-8 -4.5 l4 -1.4 M3 -5.9 l4 1.4" stroke="${C.marks}" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-5" cy="1" r="1.9" fill="${C.marks}"/><circle cx="5" cy="1" r="1.9" fill="${C.marks}"/>
      ${grin ? `<path d="M-5 7.5 h10 c0 4 -2.4 6 -5 6 s-5 -2 -5 -6z" fill="${C.marks}"/>` : `<ellipse cx="0" cy="9.5" rx="3.4" ry="4.2" fill="${C.marks}"/>`}</g>`;
  /* speech bubble with chatter marks; the tail points at its passenger */
  const bubble = (x, y, w, tx, tip, marks, d) => `<g class="chat" style="--cd:${d}ms" filter="url(#lift)" fill="${C.bub}">
      <rect x="${x}" y="${y}" width="${w}" height="26" rx="13"/><path d="M${tx - 7} ${y + 22} L${tx + 7} ${y + 22} L${tip[0]} ${tip[1]}Z"/>
      <g transform="translate(${x} ${y})" fill="none" stroke="${C.marks}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".72">${marks}</g></g>`;
  document.getElementById('scene').innerHTML = `<svg viewBox="0 0 346 232" width="346" height="232" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sky[0]}"/><stop offset=".6" stop-color="${C.sky[1]}"/><stop offset="1" stop-color="${C.sky[2]}"/></linearGradient>
      <filter id="lift" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="-2" stdDeviation="2.4" flood-color="#1A0B2E" flood-opacity="${dark ? .45 : .2}"/></filter>
      <filter id="drop" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A0B2E" flood-opacity="${dark ? .5 : .24}"/></filter>
      <radialGradient id="halo"><stop offset=".3" stop-color="${C.halo}" stop-opacity="${C.haloO}"/><stop offset="1" stop-color="${C.halo}" stop-opacity="0"/></radialGradient>
      <filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    </defs>
    <rect width="346" height="232" fill="url(#sky)"/>
    ${stars}
    <circle cx="292" cy="${sunY}" r="${dark ? 70 : 60}" fill="url(#halo)"/>
    <circle cx="292" cy="${sunY}" r="${dark ? 24 : 27}" fill="${C.sun}" opacity="${C.sunO}"/>
    ${dark ? '' : `<g filter="url(#soft)" fill="#FFF4E6" opacity=".85"><ellipse cx="196" cy="40" rx="34" ry="10"/><ellipse cx="214" cy="32" rx="20" ry="10"/></g>`}
    <path filter="url(#lift)" d="M0 136 C60 112 120 122 176 134 C236 146 290 118 346 116 V232 H0z" fill="${C.hills[0]}"/>
    <path filter="url(#lift)" d="M0 168 C70 150 140 156 206 166 C266 175 312 158 346 152 V232 H0z" fill="${C.hills[1]}"/>
    <path filter="url(#lift)" d="M0 190 C80 178 170 184 250 188 C300 190 330 184 346 182 V232 H0z" fill="${C.hills[2]}"/>
    <path filter="url(#lift)" d="M0 200 H346 V232 H0z" fill="${C.road}"/>
    <path d="M6 218 H346" stroke="${C.dash}" stroke-opacity="${C.dashO}" stroke-width="2.4" stroke-dasharray="14 12" stroke-linecap="round"/>
    <g stroke="${C.speed}" stroke-opacity="${C.speedO}" stroke-width="3" stroke-linecap="round"><path d="M14 158 H40"/><path d="M8 172 H30"/><path d="M18 186 H42"/></g>
    <g class="car"><g class="idle">
      <ellipse cx="178" cy="214" rx="122" ry="5" fill="#000" opacity="${C.shadow}"/>
      <path d="M86 150 C86 136 92 128 104 128 H146 C154 128 158 134 158 142 V152 H86Z" fill="${C.seat}"/>
      ${puff(104, 130, .95, 6, false)}${puff(134, 126, 1.02, 9, true)}
      <path d="M166 152 V128 C166 118 172 112 182 112 H190 C196 112 198 118 198 124 V152Z" fill="${C.seat}"/>
      ${xero}
      <g filter="url(#drop)">
        <path d="M62 196 C56 196 54 190 55 183 L59 162 C61 152 68 146 80 146 H238 C246 146 250 150 258 152 L282 158 C292 161 296 168 297 178 L298 188 C298 194 295 197 289 197 Z" fill="${C.body}"/>
      </g>
      <path d="M58 170 H296" stroke="${C.stripe}" stroke-width="3.2" stroke-linecap="round" opacity=".9"/>
      <path d="M162 148 V194" stroke="${C.shade}" stroke-width="2" stroke-linecap="round"/>
      <path d="M172 158 h12" stroke="${C.shade}" stroke-width="3" stroke-linecap="round"/>
      <path d="M244 149 L252 116" stroke="${C.frame}" stroke-width="3" stroke-linecap="round"/>
      <path d="M244 149 L252 116 L262 118 L258 151Z" fill="#FFFFFF" opacity="${C.glass}"/>
      <path d="M242 147 L238 132" stroke="${C.tyre}" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="237" cy="128" rx="3.4" ry="10" transform="rotate(-18 237 128)" fill="none" stroke="${C.tyre}" stroke-width="3.2"/>
      <rect x="287" y="164" width="9" height="10" rx="3" fill="${C.lamp}"/>
      <rect x="55" y="166" width="6" height="9" rx="2.5" fill="${C.stripe}"/>
      <circle cx="102" cy="197" r="21" fill="${C.shade}"/><circle cx="252" cy="197" r="21" fill="${C.shade}"/>
      <circle cx="102" cy="199" r="17" fill="${C.tyre}"/><circle cx="102" cy="199" r="6.5" fill="${C.hub}"/>
      <circle cx="252" cy="199" r="17" fill="${C.tyre}"/><circle cx="252" cy="199" r="6.5" fill="${C.hub}"/>
    </g></g>
    ${bubble(50, 66, 52, 88, [98, 101], '<path d="M11 13.5 l5 -5 l5 5 l5 -5 l5 5 l5 -5"/>', 900)}
    ${bubble(130, 46, 46, 142, [140, 82], '<path d="M14 8 v6"/><path d="M23 8 v6"/><path d="M32 8 v6"/><path d="M14 19.2 h.01"/><path d="M23 19.2 h.01"/><path d="M32 19.2 h.01"/>', 1600)}
  </svg>`;
</script>
</body></html>
