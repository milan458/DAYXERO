<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>033 Lesson intro</title>
<meta name="motion" content="The paper-cut road card fades up (600ms) and the little open-top car rolls in from the left (900ms settle curve) with Xero at the wheel, then idles with a 2px bounce (1.2s loop). The three back-seat passengers (grey, yellow, blue; Xero is the only coral figure) chatter: their two speech bubbles pop in turn (spring 420ms, 700ms apart) and keep pulsing on a 2.4s loop while Xero keeps his eyes on the road. The meta line, title, subtitle and the three 'inside' rows (each with its small paper-cut spot: cards on a hill, a kite, a summit flag) arrive with a 90ms stagger, then Begin and the listen link. Light haptic on Begin.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .art { position: relative; height: 250px; border-radius: 26px; overflow: hidden; margin-top: 6px; }
  .art .scene { position: absolute; inset: 0; }
  .art .scene svg { display: block; }
  .head { margin-top: 20px; display: grid; gap: 8px; }
  .inside { margin-top: 18px; }
  .list.inside > .row { min-height: 60px; padding-block: 9px; gap: 14px; }
  .inside .t-foot { color: var(--muted); }
  .spot { width: 42px; height: 42px; border-radius: 13px; overflow: hidden; flex: none; display: block; }
  .spot svg { display: block; width: 42px; height: 42px; }
  [data-theme="dark"] .spot { box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  .dock .link { height: 32px; font: 600 15px/1 var(--body); color: var(--fg); opacity: 1; }
  .dock .link svg { width: 17px; height: 17px; }
  /* car motion: rolls in, idles; passengers chatter */
  .car { transform-box: view-box; }
  .play .car { animation: drive-in 900ms var(--settle) 200ms both; }
  @keyframes drive-in { from { transform: translateX(-90px); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }
  .play .idle { animation: idle 1.2s ease-in-out 1.1s infinite; }
  @keyframes idle { 50% { transform: translateY(-2px); } }
  .chat { transform-box: fill-box; transform-origin: 30% 100%; }
  .play .chat { animation: chat-in 420ms var(--spring) both, chat 2.4s ease-in-out infinite; animation-delay: var(--cd), calc(var(--cd) + 600ms); }
  @keyframes chat-in { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
  @keyframes chat { 0%, 100% { transform: none; } 12% { transform: scale(1.1) rotate(-3deg); } 24% { transform: none; } }
  .still .car, .still .idle, .still .chat { animation: none !important; opacity: 1 !important; }
</style>
</head><body>
<div class="screen" data-ground="reading">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" data-ic="close"></button>
  </div>
  <div class="scroll" style="padding-top:104px">
    <div class="pad">
      <div class="art" data-a style="--i:0">
        <div class="scene" id="scene"></div>
      </div>
      <div class="head">
        <p class="t-foot muted" data-a style="--i:1">Day 7 lesson · 3 min</p>
        <h1 class="t-large" data-a style="--i:2">The noisy passengers</h1>
        <p class="t-body muted" data-a style="--i:3">Let them talk. Keep driving.</p>
      </div>
      <div class="list inside" data-a style="--i:4">
        <div class="row"><span class="spot" data-spot="read"></span><div class="grow"><p class="t-head" style="font-size:17px">A short read</p><p class="t-foot">Four cards, about 2 min</p></div></div>
        <div class="row"><span class="spot" data-spot="kite"></span><div class="grow"><p class="t-head" style="font-size:17px">A few activities</p><p class="t-foot">Quick taps, about 1 min</p></div></div>
        <div class="row"><span class="spot" data-spot="flag"></span><div class="grow"><p class="t-head" style="font-size:17px">Today's mission</p><p class="t-foot">One small thing to try today</p></div></div>
      </div>
    </div>
  </div>
  <div class="dock">
    <button class="btn" data-a style="--i:6" data-go="034-lesson-cards">Begin</button>
    <button class="link" data-a style="--i:7" data-go="035-lesson-audio"><span data-ic="headphones" style="display:inline-flex;margin-right:8px"></span>or listen instead</button>
  </div>
</div>
<script>
  document.querySelectorAll('[data-ic]').forEach(e => e.insertAdjacentHTML('afterbegin', DX.icon(e.dataset.ic, { size: 20 })));
  const dark = DX.theme === 'dark';

  /* Small paper-cut spots for the three rows, in the style of the health timeline (037): a little sky tile, lifted paper hills
     and one motif each (cards on a hill, a kite, a summit flag). Dark mode is a lit pre-dawn (navy to rose sky, gold sun) so the
     tiles stand off the navy card instead of sinking into it. */
  const S = dark
    ? { sky: ['#40558F', '#A27F9A'], h1: '#4E6198', h2: '#34477C', sun: '#FFD27A', glow: '#FFB25E', paper: '#EFE6D6', paper2: '#C9BFAE', ink: '#1E1A3A', pole: '#EFE6D6', coral: '#F08A6C', cloud: '#8E9AC4', lift: .5 }
    : { sky: ['#FFC9A0', '#FFEAD2'], h1: '#FFAE73', h2: '#FF8A5E', sun: '#FFD25E', glow: '#FFF6C8', paper: '#FFF8EE', paper2: '#F1DFC8', ink: '#1E1A3A', pole: '#1E1A3A', coral: '#FF7A55', cloud: '#FFFFFF', lift: .22 };
  const L = 'filter="url(#spLift)"';
  const SPOTS = {
    read: `<circle cx="33" cy="11" r="9" fill="url(#spGlow)"/><circle cx="33" cy="11" r="4.6" fill="${S.sun}"/>
      <path ${L} d="M0 31 C10 27 22 30 42 26 V42 H0z" fill="${S.h1}"/>
      <g ${L}><g transform="rotate(-13 15 22)"><rect x="7" y="11" width="15" height="20" rx="2.6" fill="${S.paper2}"/></g>
      <g transform="rotate(7 23 21)"><rect x="15" y="10" width="16" height="21" rx="2.6" fill="${S.paper}"/><rect x="15" y="10" width="16" height="4.5" rx="2" fill="${S.coral}"/><path d="M18.5 19h9M18.5 23h9M18.5 27h5.5" stroke="${S.ink}" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round"/></g></g>
      <path ${L} d="M0 37 C14 34 28 38 42 35 V42 H0z" fill="${S.h2}"/>`,
    kite: `<path d="M4 14 a3.2 3.2 0 0 1 5.6 -2.2 a3.6 3.6 0 0 1 6.6 1.4 a2.4 2.4 0 0 1 0 4.8 H5.4 a2.3 2.3 0 0 1 -1.4 -4z" fill="${S.cloud}" opacity=".85"/>
      <path ${L} d="M0 33 C12 29 26 32 42 28 V42 H0z" fill="${S.h1}"/><path ${L} d="M0 38 C14 35 28 39 42 36 V42 H0z" fill="${S.h2}"/>
      <path d="M27 22 C25 28 18 28 13 33" fill="none" stroke="${S.pole}" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M22.4 27.4l-2 -1.4 0.4 2.6zM17.6 29.8l-2 -1 0.6 2.4z" fill="${S.coral}"/>
      <g ${L}><path d="M27 4 L34.5 12.5 L27 22 L19.5 12.5Z" fill="${S.coral}"/><path d="M27 4 L34.5 12.5 L27 22Z" fill="#000" opacity=".12"/>
      <path d="M27 4.6V21.4M20.2 12.5H33.8" stroke="${S.paper}" stroke-opacity=".85" stroke-width="1.3"/></g>`,
    flag: `<circle cx="11" cy="12" r="11" fill="url(#spGlow)"/><circle cx="11" cy="12" r="5.6" fill="${S.sun}"/>
      <path ${L} d="M0 31 C8 25 14 19 21 18 C29 19 35 25 42 28 V42 H0z" fill="${S.h1}"/><path ${L} d="M0 37 C14 33 28 38 42 34 V42 H0z" fill="${S.h2}"/>
      <path d="M21 18.4V6" stroke="${S.pole}" stroke-width="1.8" stroke-linecap="round"/><path d="M21.6 6.4l8.4 2.8 -8.4 2.8z" fill="${S.coral}"/>`
  };
  document.body.insertAdjacentHTML('beforeend', `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="spSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.sky[0]}"/><stop offset="1" stop-color="${S.sky[1]}"/></linearGradient>
    <radialGradient id="spGlow"><stop offset=".3" stop-color="${S.glow}" stop-opacity="${dark ? .5 : .7}"/><stop offset="1" stop-color="${S.glow}" stop-opacity="0"/></radialGradient>
    <filter id="spLift" x="-10%" y="-25%" width="120%" height="150%"><feDropShadow dx="0" dy="-1" stdDeviation="1.1" flood-color="#1A0B2E" flood-opacity="${S.lift}"/></filter></defs></svg>`);
  document.querySelectorAll('[data-spot]').forEach(e => e.innerHTML = `<svg viewBox="0 0 42 42" aria-hidden="true"><rect width="42" height="42" fill="url(#spSky)"/>${SPOTS[e.dataset.spot]}</svg>`);

  /* Lesson art: paper-cut dawn road, Xero at the wheel of a little open-top car, three chattering passengers in the back
     (the cravings: small grey, yellow and blue blobs). Dark mode is the kit's pre-dawn: navy sky, a low warm sun, stars. */
  const C = dark
    ? { sky: ['#0D1630', '#24335C', '#5B5578'], hills: ['#1E2B4A', '#16233F', '#0F1A31'], road: '#232E4D', dash: '#8E97B5', dashO: .55,
        body: '#E6DCCB', shade: '#C2B6A2', stripe: '#E9886C', seat: '#2B3658', frame: '#2A2440', tyre: '#070B16', hub: '#C2B6A2', lamp: '#FFD27A', glass: .3, bub: '#EDE3D2', marks: '#1E1A3A', speed: '#FFF8EE', speedO: .28, shadow: .5, cloud: '#34436F', cloudSh: '#050A18', cloudShO: .4 }
    : { sky: ['#FF7E5A', '#FFB877', '#FFE6BF'], hills: ['#FF9D6E', '#FF7A55', '#E85A3E'], road: '#4A3352', dash: '#FFE6C8', dashO: .9,
        body: '#FFF4E4', shade: '#F1D7BC', stripe: '#FF7A55', seat: '#2E2A4F', frame: '#2A2440', tyre: '#2A2440', hub: '#F1D7BC', lamp: '#FFD966', glass: .4, bub: '#FFF8EE', marks: '#1E1A3A', speed: '#FFF8EE', speedO: .8, shadow: .22, cloud: '#FFF4E6', cloudSh: '#B4502E', cloudShO: .2 };
  const sun = dark
    ? `<ellipse cx="250" cy="156" rx="230" ry="84" fill="url(#hband)"/><circle cx="292" cy="150" r="104" fill="url(#dhalo)"/><circle cx="292" cy="150" r="22" fill="#FFD27A"/>`
    : `<circle cx="292" cy="70" r="58" fill="url(#halo)"/><circle cx="292" cy="70" r="28" fill="#FFD25E"/>`;
  const stars = dark ? [[40, 30], [118, 18], [168, 50], [232, 24], [318, 40], [210, 82], [70, 92]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 2 ? 1.1 : 1.6}" fill="#fff" opacity="${i % 2 ? .5 : .85}"/>`).join('') : '';
  /* flat paper-cut cloud: three bumps on a flat base */
  const cloud = (x, y, k) => `<path transform="translate(${x} ${y}) scale(${k})" d="M-31 9 C-34 1 -26 -5 -18 -2 C-16 -12 -3 -16 4 -8 C8 -15 21 -14 22 -4 C30 -6 35 4 29 9 Z"/>`;
  /* the driver: Xero sits low in the front seat, eyes on the road, the wheel in front of him */
  const xero = DX.char('xero', { mood: 'hello', size: 74 }).replace('<svg ', '<svg x="156" y="133" ');
  /* a small passenger blob in a cast colour: round head, darker side, raised brows, open talking mouth */
  const pal = { grey: ['#D3CCDD', '#B4ABC4'], yellow: ['#FFD25E', '#F2B640'], blue: ['#7C97F2', '#5C7AE0'] };
  const pass = (x, y, c, tilt, mouth) => `<g transform="translate(${x} ${y}) rotate(${tilt})">
      <path d="M-15 30 V7 C-15 -3 -8 -9 0 -9 C8 -9 15 -3 15 7 V30Z" fill="${pal[c][0]}"/>
      <path d="M8 -7 C12.5 -4 15 1 15 7 V30 H9.5 V7 C9.5 2 9.5 -3 8 -7Z" fill="${pal[c][1]}"/>
      <path d="M-8 -1.5 l4 -1.4 M3.5 -2.9 l4 1.4" stroke="${C.marks}" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="-4.5" cy="3.5" r="1.9" fill="${C.marks}"/><circle cx="4.5" cy="3.5" r="1.9" fill="${C.marks}"/>
      ${mouth === 'grin' ? `<path d="M-4.6 9 h9.2 c0 3.6 -2.2 5.4 -4.6 5.4 s-4.6 -1.8 -4.6 -5.4z" fill="${C.marks}"/>` : mouth === 'o' ? `<ellipse cx="0" cy="11" rx="3" ry="3.8" fill="${C.marks}"/>` : `<path d="M-4 11 q4 -3 8 0" fill="none" stroke="${C.marks}" stroke-width="1.8" stroke-linecap="round"/>`}</g>`;
  const bubble = (x, y, w, h, tx, tip, marks, d) => `<g class="chat" style="--cd:${d}ms" filter="url(#lift)" fill="${C.bub}">
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"/><path d="M${tx - 7} ${y + h - 4} L${tx + 7} ${y + h - 4} L${tip[0]} ${tip[1]}Z"/>
      <g transform="translate(${x} ${y})" fill="none" stroke="${C.marks}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".72">${marks}</g></g>`;
  document.getElementById('scene').innerHTML = `<svg viewBox="0 22 346 250" width="346" height="250" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${C.sky[0]}"/><stop offset=".6" stop-color="${C.sky[1]}"/><stop offset="1" stop-color="${C.sky[2]}"/></linearGradient>
      <filter id="lift" x="-10%" y="-30%" width="120%" height="160%"><feDropShadow dx="0" dy="-2" stdDeviation="2.4" flood-color="#1A0B2E" flood-opacity="${dark ? .45 : .2}"/></filter>
      <filter id="drop" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1A0B2E" flood-opacity="${dark ? .5 : .24}"/></filter>
      <radialGradient id="halo"><stop offset=".3" stop-color="#FFF6C8" stop-opacity=".6"/><stop offset="1" stop-color="#FFF6C8" stop-opacity="0"/></radialGradient>
      <radialGradient id="dhalo"><stop offset=".18" stop-color="#FFB25E" stop-opacity=".55"/><stop offset="1" stop-color="#FFB25E" stop-opacity="0"/></radialGradient>
      <radialGradient id="hband"><stop offset="0" stop-color="#FFB25E" stop-opacity=".3"/><stop offset=".55" stop-color="#E9886C" stop-opacity=".12"/><stop offset="1" stop-color="#E9886C" stop-opacity="0"/></radialGradient>
      <filter id="csh" x="-20%" y="-30%" width="150%" height="190%"><feDropShadow dx="2" dy="3" stdDeviation="1.4" flood-color="${C.cloudSh}" flood-opacity="${C.cloudShO}"/></filter>
    </defs>
    <rect width="346" height="272" fill="url(#sky)"/>
    ${stars}${sun}
    <g filter="url(#csh)" fill="${C.cloud}">${cloud(208, 54, 1)}${cloud(326, 110, .6)}</g>
    <path filter="url(#lift)" d="M0 158 C60 134 120 144 176 156 C236 168 290 140 346 138 V272 H0z" fill="${C.hills[0]}"/>
    <path filter="url(#lift)" d="M0 192 C70 174 140 180 206 190 C266 199 312 182 346 176 V272 H0z" fill="${C.hills[1]}"/>
    <path filter="url(#lift)" d="M0 214 C80 202 170 208 250 212 C300 214 330 208 346 206 V272 H0z" fill="${C.hills[2]}"/>
    <path filter="url(#lift)" d="M0 226 H346 V272 H0z" fill="${C.road}"/>
    <path d="M6 256 H346" stroke="${C.dash}" stroke-opacity="${C.dashO}" stroke-width="2.4" stroke-dasharray="14 12" stroke-linecap="round"/>
    <g stroke="${C.speed}" stroke-opacity="${C.speedO}" stroke-width="3" stroke-linecap="round"><path d="M8 134 H30"/><path d="M2 147 H20"/><path d="M10 160 H30"/></g>
    <g class="car"><g transform="translate(174 248) scale(1.25) translate(-172.5 -250)"><g class="idle">
      <ellipse cx="174" cy="250" rx="126" ry="5" fill="#000" opacity="${C.shadow}"/>
      <path d="M64 186 C64 172 70 166 82 166 H146 C154 166 158 172 158 180 V188 H64Z" fill="${C.seat}"/>
      <path d="M170 188 V166 C170 158 175 153 183 153 H192 C198 153 201 158 201 164 V188Z" fill="${C.seat}"/>
      ${pass(83, 165, 'grey', -7, 'o')}${pass(112, 161, 'yellow', 1, 'grin')}${pass(141, 165, 'blue', 8, 'o')}
      ${xero}
      <g filter="url(#drop)">
        <path d="M50 236 C44 236 42 230 43 223 L47 202 C49 192 56 186 68 186 H230 C238 186 242 188 250 191 L282 198 C294 201 300 208 301 218 L302 228 C302 234 299 237 293 237 Z" fill="${C.body}"/>
      </g>
      <path d="M46 210 H300" stroke="${C.stripe}" stroke-width="3.4" stroke-linecap="round" opacity=".9"/>
      <path d="M162 189 V234" stroke="${C.shade}" stroke-width="2" stroke-linecap="round"/>
      <path d="M172 198 h12" stroke="${C.shade}" stroke-width="3" stroke-linecap="round"/>
      <path d="M264 192 L250 158 L259 156.5 L275 195Z" fill="#FFFFFF" fill-opacity="${C.glass}" stroke="${C.frame}" stroke-width="2.6" stroke-linejoin="round"/>
      <path d="M219 190 C220 182 226 178 234 178 H252 C259 178 264 183 266 192Z" fill="${C.frame}"/>
      <path d="M233 181 L222 172" stroke="${C.frame}" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="218" cy="167" rx="3.8" ry="11" transform="rotate(-24 218 167)" fill="none" stroke="${C.frame}" stroke-width="3.4"/>
      <rect x="291" y="204" width="9" height="10" rx="3" fill="${C.lamp}"/>
      <rect x="43" y="206" width="6" height="9" rx="2.5" fill="${C.stripe}"/>
      <circle cx="94" cy="237" r="21" fill="${C.shade}"/><circle cx="250" cy="237" r="21" fill="${C.shade}"/>
      <circle cx="94" cy="239" r="17" fill="${C.tyre}"/><circle cx="94" cy="239" r="6.5" fill="${C.hub}"/>
      <circle cx="250" cy="239" r="17" fill="${C.tyre}"/><circle cx="250" cy="239" r="6.5" fill="${C.hub}"/>
    </g></g>
    ${bubble(16, 70, 58, 30, 48, [56, 122], '<path d="M14 17.5 l5 -5 l5 5 l5 -5 l5 5 l5 -5"/>', 900)}
    ${bubble(98, 58, 54, 30, 120, [128, 118], '<path d="M17 9 v7"/><path d="M27 9 v7"/><path d="M37 9 v7"/><path d="M17 21.5 h.01"/><path d="M27 21.5 h.01"/><path d="M37 21.5 h.01"/>', 1600)}
    </g>
  </svg>`;
</script>
</body></html>
