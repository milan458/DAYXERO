<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>063 Day ends</title>
<meta name="motion" content="The grouped list arrives with Midnight selected; at 1.0s the selection moves to 4 AM (the check disc pops in 250ms and the row takes the warm tint, selection haptic) and saves at once with a success haptic: the check disc is the done state, no toast. Below, Glim settles onto his little hill (400ms) and the timeline fills Thursday up to the 4 AM mark (700ms) as the 1:30 check-in dot lands on the Thursday side (1.3s).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
.hd { display: grid; gap: 6px; padding-top: 58px; }
/* One single-choice pattern for settings: a grouped list, a 3:1 ring per row, a check disc on the selected row. */
.screen { --ring: color-mix(in srgb, var(--fg) 50%, transparent); }
.list.pick { margin-top: 22px; }
.list.pick > .row { min-height: 60px; padding: 10px 16px; width: 100%; text-align: left; transition: background .25s var(--ease); }
.pick .row .t-foot { color: var(--muted); }
.pick .radio { width: 24px; height: 24px; border-radius: 99px; box-shadow: inset 0 0 0 2px var(--ring); flex: none; display: grid; place-items: center; }
.pick .row.on { background: var(--sel-tint); }
.pick .row.on .radio { background: var(--sel); box-shadow: none; }
.pick .row.on .radio::after { content: ""; width: 14px; height: 14px; background: var(--sel-fg); -webkit-mask: var(--tick-svg) center/contain no-repeat; mask: var(--tick-svg) center/contain no-repeat; }
.pick .lbl { font: 700 17px/1.25 var(--display); }
.tl { margin-top: 18px; padding: 16px 18px 18px; }
.tl .head { display: flex; align-items: flex-end; gap: 12px; }
.tl .g { position: relative; width: 76px; height: 70px; flex: none; }
.tl .g .mound { position: absolute; left: 0; bottom: 0; }
.tl .g .who { position: absolute; left: 6px; top: -6px; }
.tl .head p { flex: 1; padding-bottom: 6px; }
.bar { position: relative; height: 54px; margin-top: 14px; }
.bar .ln { position: absolute; left: 0; right: 0; top: 8px; height: 6px; border-radius: 99px; background: var(--track); }
.bar .seg { position: absolute; left: 0; top: 8px; height: 6px; border-radius: 99px; background: var(--fg); width: 66.67%; }
.bar .end { position: absolute; top: 2px; width: 3px; height: 18px; margin-left: -1.5px; border-radius: 2px; background: var(--fg); }
.bar .ci { position: absolute; top: 1px; width: 20px; height: 20px; margin-left: -10px; border-radius: 99px; background: var(--card-2); box-shadow: inset 0 0 0 4px var(--mark); }
.bar .lab { position: absolute; top: 30px; transform: translateX(-50%); font: 600 15px/1 var(--body); white-space: nowrap; }
.bar .lab.fri { color: var(--muted); }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">When your day ends</h1><p class="t-foot muted" data-a style="--i:1">Up late? A check-in before this time still counts for the day you just had.</p></div>
  <div class="list pick" role="radiogroup" aria-label="Day ends at" data-a style="--i:2">
    <button class="row on" id="o0" role="radio"><div class="grow"><div class="lbl">Midnight</div></div><span class="radio"></span></button>
    <button class="row" role="radio"><div class="grow"><div class="lbl">2 AM</div></div><span class="radio"></span></button>
    <button class="row" id="o4" role="radio"><div class="grow"><div class="lbl">4 AM</div><div class="t-foot">Default, fits most late nights</div></div><span class="radio"></span></button>
    <button class="row" role="radio"><div class="grow"><div class="lbl">6 AM</div><div class="t-foot">For night shifts and late finishes</div></div><span class="radio"></span></button>
  </div>
  <div class="card flat tl" data-a style="--i:3">
    <div class="head"><span class="g"><span class="mound" id="mound"></span><span class="who" id="glim063" data-settle style="--d:400ms"></span></span><p class="t-body">A check-in at 1:30 AM still counts for Thursday. Friday starts at 4 AM.</p></div>
    <div class="bar" aria-label="Thursday runs on to 4 AM; the 1:30 AM check-in counts for Thursday">
      <div class="ln"></div><div class="seg" data-fade style="--d:700ms"></div>
      <div class="end" style="left:66.67%"></div><div class="ci" style="left:45.83%;--d:1300ms" data-pop></div>
      <span class="lab" style="left:33.33%">Thursday</span><span class="lab fri" style="left:83.33%">Friday</span>
    </div>
  </div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });
const dark = DX.theme === 'dark';
/* Glim, small, standing on a little hill inside the card (no tile behind him). */
document.getElementById('mound').innerHTML = `<svg width="76" height="20" viewBox="0 0 76 20" aria-hidden="true"><path d="M2 20 C10 6 26 2 38 2 C50 2 66 6 74 20Z" fill="${dark ? '#2C3A5E' : '#E4D9C8'}"/></svg>`;
document.getElementById('glim063').innerHTML = DX.char('glim', { mood: 'calm', size: 64 });
const o0 = document.getElementById('o0'), o4 = document.getElementById('o4');
function pick() { o0.classList.remove('on'); o4.classList.add('on'); }
DX.after(1000, pick); DX.onStill(pick);
</script>
</body></html>
