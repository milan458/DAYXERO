<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>002 Welcome</title>
<meta name="motion" content="Continues the launch scene: the paper hills settle up in three layers (0, 120, 240ms; 900ms settle), the sun climbs 60px behind Xero (1200ms ease-out) and Xero settles up from behind the front hill (900ms, starts 300ms). At 1100ms the speech bubble arrives with a 600ms rise. Headline, body and dock arrive in reading order from 500ms (600ms, 90ms stagger). Light haptic on Get started.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  .screen { --h-back: #FFD9AE; --h-mid: #FFA56C; --h-edge: rgba(255,255,255,.55); --sun-a: #FFF4C9; --sun-b: #FFC93C;
    --ring-1: rgba(255,240,205,.55); --ring-2: rgba(255,236,200,.32); --lift: rgba(120,44,20,.2); }
  [data-theme="dark"] .screen { --h-back: #4A2C66; --h-mid: #39204F; --h-edge: rgba(255,195,138,.35); --sun-a: #FFF1C2; --sun-b: #FFB255;
    --ring-1: rgba(255,195,138,.16); --ring-2: rgba(255,195,138,.08); --lift: rgba(0,0,0,.45); }
  .art { position: absolute; z-index: 0; left: 0; right: 0; top: 0; height: 420px; overflow: hidden; }
  .text .mark { white-space: nowrap; }
  .sky { position: absolute; inset: 0; background: linear-gradient(to bottom, color-mix(in srgb, var(--sun-b) 22%, var(--g)), var(--g) 70%); }
  .layer { position: absolute; left: 0; width: 390px; pointer-events: none; }
  .layer svg { display: block; }
  .sunw { top: 100px; z-index: 1; }
  .play .sunw { animation: sunup 1200ms cubic-bezier(.25,.75,.25,1) both; }
  @keyframes sunup { from { transform: translateY(60px); } to { transform: none; } }
  .back { top: 130px; z-index: 2; filter: drop-shadow(0 -4px 10px var(--lift)); }
  .mid  { top: 130px; z-index: 3; filter: drop-shadow(0 -5px 12px var(--lift)); }
  .xw   { left: 130px; top: 242px; z-index: 4; }
  .front { top: 130px; z-index: 5; filter: drop-shadow(0 -6px 14px var(--lift)); }
  .play .back, .play .mid, .play .front { animation: hillup 900ms cubic-bezier(.2,.8,.2,1) both; }
  .play .mid { animation-delay: 120ms; } .play .front { animation-delay: 240ms; }
  @keyframes hillup { from { transform: translateY(80px); } to { transform: none; } }
  .xw[data-settle] { --d: 300ms; }
  .hi { position: absolute; z-index: 6; left: 232px; top: 240px; --d: 1100ms; }
  .hi .bubble { font: 700 16px/1.2 var(--display); padding: 12px 15px; white-space: nowrap; box-shadow: 0 6px 18px rgba(90,40,20,.12); }
  [data-theme="dark"] .hi .bubble { box-shadow: inset 0 0 0 1px var(--line); }
  .text { position: absolute; z-index: 1; left: 0; right: 0; top: 412px; padding: 0 var(--gutter); display: grid; gap: 14px; }
  .terms { text-align: center; color: var(--muted); padding: 0 8px; }
  .terms u { text-underline-offset: 2px; }
  .dock { gap: 4px; padding-top: 24px; }
  .dock .btn { margin-bottom: 6px; }
</style>
</head><body>
<div class="screen" data-ground="apricot" data-status="on-art">
  <div class="art" aria-hidden="true">
    <div class="sky"></div>
    <div class="layer sunw">
      <svg width="390" height="260" viewBox="0 0 390 260">
        <defs><radialGradient id="sg" cx=".4" cy=".34" r=".72"><stop offset="0" stop-color="var(--sun-a)"/><stop offset="1" stop-color="var(--sun-b)"/></radialGradient></defs>
        <circle cx="195" cy="150" r="118" fill="var(--ring-2)"/><circle cx="195" cy="150" r="92" fill="var(--ring-1)"/><circle cx="195" cy="150" r="64" fill="url(#sg)"/>
      </svg>
    </div>
    <div class="layer back">
      <svg width="390" height="290" viewBox="0 0 390 290">
        <path d="M0 70 C56 40 118 50 150 118 C170 166 222 172 242 132 C276 62 334 38 390 58 L390 290 L0 290 Z" fill="var(--h-back)"/>
        <path d="M0 70 C56 40 118 50 150 118 C170 166 222 172 242 132 C276 62 334 38 390 58" fill="none" stroke="var(--h-edge)" stroke-width="2"/>
      </svg>
    </div>
    <div class="layer mid">
      <svg width="390" height="290" viewBox="0 0 390 290">
        <path d="M0 168 C56 136 116 142 158 180 C182 202 214 206 238 190 C282 156 336 140 390 158 L390 290 L0 290 Z" fill="var(--h-mid)"/>
        <path d="M0 168 C56 136 116 142 158 180 C182 202 214 206 238 190 C282 156 336 140 390 158" fill="none" stroke="var(--h-edge)" stroke-width="2"/>
      </svg>
    </div>
    <div class="layer xw" id="xero" data-settle></div>
    <div class="layer front">
      <svg width="390" height="290" viewBox="0 0 390 290">
        <path d="M0 252 C70 232 124 226 196 226 C268 226 324 236 390 250 L390 290 L0 290 Z" fill="var(--g)"/>
      </svg>
    </div>
  </div>
  <div class="hi" data-a><div class="bubble">Hi, I'm Xero.</div></div>

  <div class="text">
    <h1 class="t-display" data-a style="--i:6">Don't quit today.<br>Quit on your <span class="mark">Quit Day.</span></h1>
    <p class="t-body muted" data-a style="--i:7">Prep for up to 7 days while you still smoke or vape. Then quit on the day you choose.</p>
  </div>

  <div class="dock">
    <button class="btn" data-a style="--i:8">Get started</button>
    <a class="link" data-a style="--i:9">Restore purchases</a>
    <p class="t-cap terms" data-a style="--i:10">Stays private on this phone. By continuing you confirm you're 18+ and agree to the <u>Terms</u> and <u>Privacy Policy</u>.</p>
  </div>
</div>
<script>
  document.getElementById('xero').innerHTML = DX.char('xero', { mood: 'hello', size: 130 });
</script>
</body></html>
