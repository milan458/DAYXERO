<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>057 Box breathing</title>
<meta name="motion" content="The dot travels the square at an even pace, 4s per side (16s a round), while the inner square swells over the in side, holds, shrinks over the out side and holds; on each corner the centre word and the lit side label cross-fade (220ms) via DX.after and the count ticks 4 to 1 each second. A soft haptic tick at every corner, nothing else.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* screen-local helpers: icon fill, section labels, small icon tiles, bottom toast */
.hd { display: grid; gap: 6px; padding-top: 58px; }
.sec { padding: 22px 4px 8px; color: var(--muted); }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row.tap { min-height: 56px; }
.toast.b { top: auto; bottom: 40px; opacity: 0; transform: translateY(18px); transition: opacity .4s var(--ease), transform .55s var(--settle); }
.toast.b.in { opacity: 1; transform: none; }
.toast.b .ck { flex: none; }
.pill { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--card-2); display: inline-flex; align-items: center; font: 600 15px/1 var(--body); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }

.nav .title { flex: 1; text-align: center; margin-right: 56px; }
.wrap { position: absolute; left: 0; right: 0; top: 196px; display: grid; justify-items: center; gap: 0; }
.rnd { display: flex; gap: 8px; align-items: center; }
.rnd i { width: 8px; height: 8px; border-radius: 99px; background: var(--track); }
.rnd i.on { background: var(--fg); }
.box { position: relative; width: 300px; height: 300px; margin-top: 22px; }
.box svg { position: absolute; inset: 0; }
.fillsq { position: absolute; left: 62px; top: 62px; width: 176px; height: 176px; border-radius: 16px; background: var(--card-2); transform: scale(.62); }
.play .fillsq { animation: sq 16s cubic-bezier(.45,0,.55,1) infinite; }
@keyframes sq { 0% { transform: scale(.62); } 25%, 50% { transform: scale(1); } 75%, 100% { transform: scale(.62); } }
.still .fillsq { animation: none !important; transform: scale(1); }
.dot { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 99px; background: var(--fg); box-shadow: 0 0 0 6px color-mix(in srgb, var(--fg) 14%, transparent);
  offset-path: path("M50 250 V50 H250 V250 Z"); offset-rotate: 0deg; offset-distance: 0%; }
.play .dot { animation: go 16s linear infinite; }
@keyframes go { to { offset-distance: 100%; } }
.still .dot { animation: none !important; offset-distance: 37.5%; }
.side { position: absolute; color: var(--muted); opacity: .55; transition: opacity .5s var(--ease), color .5s var(--ease); white-space: nowrap; }
.side.on { opacity: 1; color: var(--fg); }
.s0 { left: 22px; top: 150px; transform: translate(-50%, -50%) rotate(-90deg); }
.s1 { left: 150px; top: 22px; transform: translate(-50%, -50%); }
.s2 { left: 278px; top: 150px; transform: translate(-50%, -50%) rotate(90deg); }
.s3 { left: 150px; top: 278px; transform: translate(-50%, -50%); }
.mid { position: absolute; inset: 50px; display: grid; place-content: center; text-align: center; gap: 2px; }
.mid .num { font-size: 64px; line-height: 1; }
.lab { transition: opacity .35s var(--ease); }
.cue { margin-top: 26px; text-align: center; max-width: 290px; transition: opacity .4s var(--ease); }

</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Close" data-ic="close"></button><div class="title" data-a style="--i:0">Box breathing</div></div>
<div class="wrap">
  <div class="rnd" data-a style="--i:1" aria-label="Round 2 of 4"><i class="on"></i><i class="on"></i><i></i><i></i></div>
  <p class="t-foot muted" data-a style="--i:1;margin-top:8px" id="round">Round 2 of 4</p>
  <div class="box" data-fade style="--d:200ms">
    <div class="fillsq"></div>
    <svg width="300" height="300" viewBox="0 0 300 300"><rect x="50" y="50" width="200" height="200" rx="6" fill="none" stroke="var(--track)" stroke-width="5"/>
      <path id="act" d="M50 250 V50" fill="none" stroke="var(--fg)" stroke-width="5" stroke-linecap="round"/></svg>
    <span class="side s0 t-cap on">Breathe in</span><span class="side s1 t-cap">Hold</span><span class="side s2 t-cap">Breathe out</span><span class="side s3 t-cap">Hold</span>
    <div class="mid"><div class="t-title lab" id="phase">Breathe in</div><div class="num" id="count">4</div></div>
    <span class="dot" style="margin:-11px 0 0 -11px"></span>
  </div>
  <p class="t-body muted cue" id="cue" data-a style="--i:3">In through your nose. Let your belly fill.</p>
</div>
<div class="dock"><button class="link" data-a style="--i:4">End</button></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });

const P = [
  { w: 'Breathe in', c: 'In through your nose. Let your belly fill.', d: 'M50 250 V50' },
  { w: 'Hold', c: 'Hold it softly. Shoulders down.', d: 'M50 50 H250' },
  { w: 'Breathe out', c: 'Out slowly through your mouth.', d: 'M250 50 V250' },
  { w: 'Hold', c: 'Rest here. Nothing to do.', d: 'M250 250 H50' }];
const sides = document.querySelectorAll('.side'), phase = document.getElementById('phase'), count = document.getElementById('count'), cue = document.getElementById('cue'), act = document.getElementById('act'), round = document.getElementById('round'), pips = document.querySelectorAll('.rnd i');
function set(k, n) {
  const p = P[k];
  if (n === 4) { phase.style.opacity = 0; cue.style.opacity = 0; setTimeout(() => { phase.textContent = p.w; cue.textContent = p.c; phase.style.opacity = 1; cue.style.opacity = 1; }, 220);
    sides.forEach((s, i) => s.classList.toggle('on', i === k)); act.setAttribute('d', p.d); }
  count.textContent = n;
}
for (let s = 0; s < 48; s++) { const k = Math.floor(s / 4) % 4, n = 4 - (s % 4); DX.after(s * 1000, () => set(k, n)); }
DX.after(16000, () => { round.textContent = 'Round 3 of 4'; pips[2].classList.add('on'); });
DX.after(32000, () => { round.textContent = 'Round 4 of 4'; pips[3].classList.add('on'); });
DX.onStill(() => { set(1, 4); phase.textContent = P[1].w; cue.textContent = P[1].c; count.textContent = 2; });

</script>
</body></html>
