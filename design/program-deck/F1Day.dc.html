<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F1 · Today's hand</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFF8EE}a:hover{color:#D2C8FF}
@keyframes fTw{0%,100%{opacity:.3}50%{opacity:1}}
.f-tw{animation:fTw 2.4s ease-in-out infinite}
.f-card{transition:transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .3s}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #4A3596; color: #FFF8EE; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif">
  <svg width="390" height="420" viewBox="0 0 390 420" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <circle class="f-tw" cx="36" cy="270" r="2" fill="#FFF8EE"></circle>
    <circle class="f-tw" cx="354" cy="236" r="2.4" fill="#FFF8EE" style="animation-delay:.8s"></circle>
    <circle class="f-tw" cx="320" cy="330" r="1.8" fill="#FFF8EE" style="animation-delay:1.4s"></circle>
    <circle class="f-tw" cx="62" cy="372" r="1.6" fill="#FFF8EE" style="animation-delay:.4s"></circle>
  </svg>

  <div style="position: absolute; left: 0; right: 0; top: 0; padding: 54px 22px 0 14px; display: flex; align-items: center; gap: 10px">
    <a href="F1Day.dc.html" aria-label="Back to Program" style="width: 44px; height: 44px; border-radius: 99px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #D2C8FF">PREP 1 OF 7 · TODAY'S HAND</span>
    <span style="font-size: 14px; font-weight: 700; color: #FFD966">1 of 5 played</span>
  </div>

  <div style="position: absolute; left: 24px; right: 24px; top: 112px; display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.06; letter-spacing: -0.9px">You don't have to quit today</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #D2C8FF">Keep using as normal. Today, you just watch.</p>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 300px; height: 300px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <button onClick="{{c.pick}}" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" class="f-card" style="position: absolute; left: 132px; top: 40px; width: 126px; height: 184px; box-sizing: border-box; border: 0; border-radius: 18px; padding: 12px; font: inherit; text-align: left; cursor: pointer; transform-origin: 50% 160%; display: flex; flex-direction: column; gap: 6px; {{c.style}}">
        <span style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.8px">{{c.kind}}</span>
          <sc-if value="{{c.done}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
        </span>
        <span style="flex-grow: 1; display: grid; place-items: center; opacity: 0.9"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px">{{c.glyph}}</span></span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 14px; line-height: 1.15">{{c.short}}</span>
        <span style="font-size: 12px; font-weight: 700; opacity: 0.85">{{c.min}}</span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 590px; background: #2A1C6E; border-radius: 24px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #FFD966">{{sel.eyebrow}}</span>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; line-height: 1.15">{{sel.title}}</span>
    <span style="font-size: 14px; line-height: 1.45; color: #D2C8FF">{{sel.line}}</span>
  </div>

  <div style="position: absolute; left: 22px; right: 22px; bottom: 26px">
    <a href="{{sel.href}}" style="height: 58px; border-radius: 99px; background: #FFF8EE; color: #4A3596; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.25)">{{sel.cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const at = (this.state || {}).at ?? 1;
    const data = [
      { kind: 'LISTEN', glyph: '♪', short: 'Keep using. Just watch.', min: '6 min', bg: '#FFC38A', ink: '#1E1A3A', done: true, eyebrow: 'CARD 1 · LISTEN · 6 MIN · PLAYED', title: 'Keep using. Just watch.', line: 'How the next seven days work, and the one thing to notice today.', href: 'F2Listen.dc.html', cta: 'Play it again' },
      { kind: 'REVEAL', glyph: '?', short: 'Why the first one feels so good', min: '5 min', bg: '#9CCBFF', ink: '#1E1A3A', eyebrow: 'CARD 2 · REVEAL · 5 MIN · NEXT', title: 'Why the first one feels so good', line: 'Four questions. Guess first, then turn each one over.', href: 'F3Reveal.dc.html', cta: 'Play this card' },
      { kind: 'MYTH/FACT', glyph: '½', short: 'What you’ve been told', min: '5 min', bg: '#FFD966', ink: '#1E1A3A', eyebrow: 'CARD 3 · MYTH OR FACT · 5 MIN', title: 'What you’ve been told', line: 'Five things most people believe about nicotine. Which hold up?', href: 'F4Myth.dc.html', cta: 'Play this card' },
      { kind: 'TRY', glyph: '✎', short: 'Your reasons, and three check-ins', min: '6 min', bg: '#9FE3BC', ink: '#1E1A3A', eyebrow: 'CARD 4 · TRY · 6 MIN', title: 'Your reasons, and three honest check-ins', line: 'Name what matters, then notice the gap before three uses today.', href: 'F5Try.dc.html', cta: 'Play this card' },
      { kind: 'LISTEN', glyph: '☾', short: 'Tonight: what you noticed', min: '7 min · 6 pm', bg: '#140E3A', ink: '#FFF8EE', eyebrow: 'CARD 5 · LISTEN · 7 MIN · FROM 6 PM', title: 'Tonight: what you noticed', line: 'A wind-down for the end of the day. It opens at 6 pm.', href: 'F8Evening.dc.html', cta: 'Opens at 6 pm' }
    ];
    const angles = [-26, -13, 0, 13, 26];
    const cards = data.map((d, i) => {
      const sel = i === at;
      const lift = sel ? ' translateY(-46px)' : '';
      const ring = sel ? 'box-shadow: 0 0 0 4px #FFD966, 0 18px 34px rgba(0,0,0,0.35);' : 'box-shadow: 0 10px 24px rgba(0,0,0,0.28);';
      const fade = d.done && !sel ? 'opacity: 0.82;' : '';
      return {
        ...d,
        pressed: sel ? 'true' : 'false',
        label: 'Card ' + (i + 1) + ', ' + d.kind.toLowerCase() + ', ' + d.title + (d.done ? ', played' : ''),
        style: 'background: ' + d.bg + '; color: ' + d.ink + '; transform: rotate(' + angles[i] + 'deg)' + lift + '; z-index: ' + (sel ? 9 : i + 1) + '; ' + ring + fade + (i === 4 ? ' outline: 2px solid rgba(255,248,238,0.35); outline-offset: -2px;' : ''),
        pick: () => this.setState({ at: i })
      };
    });
    return { cards, sel: data[at] };
  }
}
</script>
</body>
</html>
