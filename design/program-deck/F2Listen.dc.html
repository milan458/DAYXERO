<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F2 · Listen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1E1A3A}a:hover{color:#4A2A1A}
@keyframes fSun{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-6px) scale(1.04)}}
.f-sun{animation:fSun 10s ease-in-out infinite}
@keyframes fUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.f-up{animation:fUp .5s cubic-bezier(.2,.7,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFC38A; color: #1E1A3A; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <svg class="f-sun" width="390" height="300" viewBox="0 0 390 300" aria-hidden="true" style="position: absolute; left: 0; bottom: 0">
    <circle cx="300" cy="230" r="120" fill="#FFD966" opacity="0.6"></circle>
    <circle cx="300" cy="230" r="80" fill="#FFD966"></circle>
    <path d="M0 250 Q120 200 230 240 T390 230 V300 H0z" fill="#FF7A55" opacity="0.35"></path>
  </svg>

  <div style="padding: 54px 18px 0 18px; display: flex; flex-direction: column; gap: 12px; position: relative">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px" role="img" aria-label="{{chapLabel}}">
      <sc-for list="{{segs}}" as="g" hint-placeholder-count="4"><span style="height: 4px; border-radius: 99px; overflow: hidden; background: rgba(30,26,58,0.2)"><span style="display: block; height: 100%; background: #1E1A3A; {{g}}"></span></span></sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="flex-grow: 1; display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #4A2A1A">CARD 1 OF 5 · LISTEN · {{chapCaps}}</span>
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px">{{chapTitle}}</span>
      </span>
      <a href="F1Day.dc.html" aria-label="Close. Your place is saved." style="width: 44px; height: 44px; border-radius: 99px; background: rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
  </div>

  <sc-if value="{{playingView}}" hint-placeholder-val="{{true}}">
    <div style="padding: 64px 24px 0 24px; position: relative" aria-live="polite">
      <p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; line-height: 1.1; letter-spacing: -1.1px">
        <sc-for list="{{words}}" as="w" hint-placeholder-count="20"><span style="{{w.style}}">{{w.t}} </span></sc-for>
      </p>
    </div>
  </sc-if>

  <sc-if value="{{doneView}}" hint-placeholder-val="{{false}}">
    <div class="f-up" style="padding: 56px 24px 0 24px; position: relative; display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #4A2A1A">TRACK FINISHED · 6:00</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.06; letter-spacing: -1px">Your only job today: watch for the gap.</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.5">Keep using as normal. Before three of them, pause for one breath and ask: is this a want, or the gap?</p>
    </div>
  </sc-if>

  <div style="margin-top: auto; padding: 0 22px 30px 22px; position: relative; display: flex; flex-direction: column; gap: 14px">
    <sc-if value="{{playingView}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; align-items: center; gap: 12px">
        <button aria-label="Back 15 seconds" style="width: 52px; height: 52px; border: 0; border-radius: 99px; background: rgba(255,255,255,0.5); color: #1E1A3A; cursor: pointer; display: grid; place-items: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"></path><path d="M4 4v4h4"></path></svg></button>
        <button aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 72px; height: 72px; border: 0; border-radius: 99px; background: #1E1A3A; color: #FFF8EE; cursor: pointer; display: grid; place-items: center; flex: none; box-shadow: 0 6px 0 rgba(0,0,0,0.2)">
          <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></sc-if>
        </button>
        <button onClick="{{finish}}" aria-label="Skip to the end" style="width: 52px; height: 52px; border: 0; border-radius: 99px; background: rgba(255,255,255,0.5); color: #1E1A3A; cursor: pointer; display: grid; place-items: center; flex: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5l10 7-10 7z"></path><path d="M19 5v14"></path></svg></button>
        <span style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
          <span style="font-size: 14px; font-weight: 700; color: #4A2A1A">2:14 / 6:00</span>
          <button style="border: 0; background: transparent; padding: 6px 0; font: inherit; font-size: 14px; font-weight: 700; color: #1E1A3A; text-decoration: underline; cursor: pointer; min-height: 32px">Transcript</button>
        </span>
      </div>
    </sc-if>
    <sc-if value="{{doneView}}" hint-placeholder-val="{{false}}">
      <a href="F6Done.dc.html" style="height: 58px; border-radius: 99px; background: #1E1A3A; color: #FFF8EE; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2)">I'll just watch today</a>
      <button onClick="{{replay}}" style="height: 44px; border: 0; background: transparent; font: inherit; font-weight: 700; font-size: 15px; color: #1E1A3A; cursor: pointer">Listen again</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["playing","finished"],"default":"playing"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state || {};
      if (s.paused || s.done) return;
      this.setState({ k: ((s.k || 0) + 1) % 26 });
    }, 380);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state || {};
    const done = s.done ?? ((this.props.view ?? 'playing') === 'finished');
    const paused = Boolean(s.paused);
    const text = 'Every hour or two, a small restless feeling builds. You might call it wanting one. I call it the gap.';
    const parts = text.split(' ');
    const k = Math.min(s.k || 0, parts.length);
    const words = parts.map((t, i) => ({ t, style: i < k ? 'color: #1E1A3A' : 'color: rgba(30,26,58,0.55)' }));
    const chap = done ? 4 : 2;
    const titles = ['Why you don’t quit today', 'The gap', 'Not weak, hooked', 'Your only job today'];
    const segs = [0, 1, 2, 3].map((i) => i < chap - 1 ? 'width: 100%' : (i === chap - 1 ? 'width: ' + (done ? 100 : Math.round(20 + (k / parts.length) * 70)) + '%' : 'width: 0%'));
    return {
      words, segs,
      chapTitle: titles[chap - 1], chapCaps: 'CHAPTER ' + chap + ' OF 4', chapLabel: 'Chapter ' + chap + ' of 4',
      playingView: !done, doneView: done,
      playing: !paused, paused, playLabel: paused ? 'Play' : 'Pause',
      toggle: () => this.setState({ paused: !paused }),
      finish: () => this.setState({ done: true }),
      replay: () => this.setState({ done: false, k: 0 })
    };
  }
}
</script>
</body>
</html>
