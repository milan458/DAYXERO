<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F6 · Card played</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFF8EE}a:hover{color:#D2C8FF}
@keyframes fLand{0%{transform:translateY(-60px) rotate(-14deg) scale(1.1);opacity:0}60%{transform:translateY(6px) rotate(-5deg) scale(.98);opacity:1}100%{transform:rotate(-6deg)}}
.f-land{animation:fLand .8s cubic-bezier(.3,1.4,.5,1) both}
@keyframes fTick{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.f-tick{stroke-dasharray:30;animation:fTick .5s .6s ease-out both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #4A3596; color: #FFF8EE; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 54px 16px 0 14px; display: flex; align-items: center; gap: 10px">
    <a href="F1Day.dc.html" aria-label="Back to today's hand" style="width: 44px; height: 44px; border-radius: 99px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #D2C8FF">PREP 1 · 2 OF 5 PLAYED</span>
  </div>

  <div style="height: 270px; flex: none; position: relative; display: grid; place-items: center">
    <span aria-hidden="true" style="position: absolute; width: 126px; height: 184px; border-radius: 18px; background: #FFC38A; transform: rotate(-16deg) translateX(-40px); opacity: 0.7"></span>
    <div class="f-land" style="position: relative; width: 140px; height: 204px; border-radius: 20px; background: #9CCBFF; color: #1E1A3A; box-shadow: 0 0 0 4px #FFD966, 0 18px 34px rgba(0,0,0,0.35); padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.8px">REVEAL</span>
      <span style="flex-grow: 1; display: grid; place-items: center"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1E1A3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="f-tick" d="M5 12l5 5 9-10"></path></svg></span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 14px; line-height: 1.15">Why the first one feels so good</span>
    </div>
  </div>

  <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 6px; text-align: center; align-items: center">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.8px">Card played</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #D2C8FF">You said: <b style="color: #FFF8EE">“I've felt that gap.”</b> Hold on to that one. You'll need it on Day Xero.</p>
  </div>

  <div style="margin: 22px 20px 0 20px; border-radius: 22px; background: #2A1C6E; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700; color: #D2C8FF">How was this card? <span style="font-weight: 500">Optional</span></span>
    <div role="radiogroup" aria-label="Rate this card" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{faces}}" as="f" hint-placeholder-count="4">
        <button role="radio" aria-checked="{{f.on}}" onClick="{{f.tap}}" style="min-height: 64px; border: 0; border-radius: 16px; font: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; {{f.style}}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="9" cy="10" r="0.8" fill="currentColor"></circle><circle cx="15" cy="10" r="0.8" fill="currentColor"></circle><path d="{{f.mouth}}"></path></svg>
          <span style="font-size: 12px; font-weight: 700">{{f.t}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 22px 26px 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
      <span aria-hidden="true" style="width: 40px; height: 56px; border-radius: 10px; background: #FFD966; flex: none; display: grid; place-items: center; color: #1E1A3A; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">½</span>
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #D2C8FF">NEXT · MYTH OR FACT · 5 MIN</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">What you've been told</span></span>
    </div>
    <a href="F4Myth.dc.html" style="height: 58px; border-radius: 99px; background: #FFF8EE; color: #4A3596; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.25)">Play the next card</a>
    <a href="F1Day.dc.html" style="height: 44px; border-radius: 99px; color: #FFF8EE; font-weight: 700; font-size: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center">Later. Back to my hand</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (this.state || {}).pick;
    const list = [
      { t: 'Not for me', mouth: 'M8.5 16.5c2-1.6 5-1.6 7 0' },
      { t: 'Okay', mouth: 'M9 15.5h6' },
      { t: 'Good', mouth: 'M8.5 14.5c2 1.6 5 1.6 7 0' },
      { t: 'Really helped', mouth: 'M8 14c1.6 3 6.4 3 8 0z' }
    ];
    const faces = list.map((f, i) => ({ ...f, on: pick === i ? 'true' : 'false', style: pick === i ? 'background: #FFD966; color: #1E1A3A;' : 'background: rgba(255,255,255,0.08); color: #FFF8EE;', tap: () => this.setState({ pick: i }) }));
    return { faces };
  }
}
</script>
</body>
</html>
