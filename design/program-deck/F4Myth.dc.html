<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F4 · Myth or fact</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#FFF8EE}a:hover{color:#D2C8FF}
@keyframes fWob{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
.f-wob{animation:fWob 3s ease-in-out infinite}
@keyframes fIn{from{transform:translateX(60px) rotate(6deg);opacity:0}to{transform:none;opacity:1}}
.f-in{animation:fIn .45s cubic-bezier(.2,.7,.2,1) both}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #4A3596; color: #FFF8EE; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 54px 16px 0 14px; display: flex; align-items: center; gap: 10px">
    <a href="F1Day.dc.html" aria-label="Close. Your place is saved." style="width: 44px; height: 44px; border-radius: 99px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #D2C8FF">CARD 3 OF 5 · MYTH OR FACT</span>
    <span style="display: flex; gap: 5px" role="img" aria-label="{{progressLabel}}">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="5"><span style="width: 8px; height: 8px; border-radius: 99px; {{d}}"></span></sc-for>
    </span>
  </div>

  <div style="position: relative; flex-grow: 1; min-height: 0; margin-top: 16px">
    <span aria-hidden="true" style="position: absolute; left: 40px; top: 14px; right: 40px; bottom: 112px; border-radius: 24px; background: #2A1C6E; transform: rotate(3deg)"></span>
    <div class="{{cardCls}}" style="position: absolute; left: 22px; right: 22px; top: 6px; bottom: 118px; box-sizing: border-box; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 36px rgba(0,0,0,0.3); color: #1E1A3A; transition: background .3s; {{cardBg}}">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #3F3A5C">STATEMENT {{n}} OF 5</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: {{qSize}}; line-height: 1.1; letter-spacing: -0.8px">“{{st.q}}”</h1>
      <sc-if value="{{answered}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 4px">
          <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
            <span style="border-radius: 99px; padding: 6px 12px; background: #1E1A3A; color: #FFF8EE; font-size: 14px; font-weight: 800">{{st.answer}}</span>
            <span style="font-size: 14px; font-weight: 700; color: #3F3A5C">{{youSaid}}</span>
          </span>
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.2">{{st.verdict}}</span>
          <p style="margin: 0; font-size: 15px; line-height: 1.5">{{st.why}}</p>
          <span style="font-size: 12px; font-weight: 600; color: #3F3A5C">{{st.src}}</span>
        </div>
      </sc-if>
      <sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
        <p style="margin: auto 0 0 0; font-size: 15px; line-height: 1.5; color: #3F3A5C">What do you think? Some are partly true.</p>
      </sc-if>
    </div>
  </div>

  <div style="position: absolute; left: 22px; right: 22px; bottom: 26px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <button onClick="{{myth}}" style="height: 64px; border: 0; border-radius: 99px; background: #FFC38A; color: #1E1A3A; font: inherit; font-weight: 800; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 0 rgba(0,0,0,0.25)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>Myth</button>
        <button onClick="{{fact}}" style="height: 64px; border: 0; border-radius: 99px; background: #9CCBFF; color: #1E1A3A; font: inherit; font-weight: 800; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 6px 0 rgba(0,0,0,0.25)">Fact<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      </div>
    </sc-if>
    <sc-if value="{{nextShown}}" hint-placeholder-val="{{false}}">
      <button onClick="{{next}}" style="height: 58px; border: 0; border-radius: 99px; background: #FFF8EE; color: #4A3596; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,0.25)">Next statement</button>
    </sc-if>
    <sc-if value="{{finalShown}}" hint-placeholder-val="{{false}}">
      <a href="F6Done.dc.html" style="height: 58px; border-radius: 99px; background: #FFF8EE; color: #4A3596; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.25)">That changes things</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const i = s.i || 0;
    const ans = s.ans;
    const list = [
      { q: 'I use it because I enjoy it.', truth: 'partly', answer: 'Partly true', verdict: 'The moment feels good. Look at what’s being enjoyed.',
        why: 'The relief is real. But most of it is the gap closing, plus the pause, the air, the break. A non-user gets the break without the gap. And almost nobody enjoyed their very first one: the enjoyment grew as the gap did.', src: 'Source: Benowitz, NEJM 2010' },
      { q: 'It’s just a habit.', truth: 'myth', answer: 'Myth', verdict: 'It’s a habit wrapped around a drug.',
        why: 'Habits are part of it: the coffee, the car, the phone. But underneath, nicotine changes how the brain expects to feel, and the gap is the result. That’s why swapping the habit alone rarely works, and why this week deals with both.', src: 'Source: Benowitz, NEJM 2010' },
      { q: 'I could stop any time I really wanted to.', truth: 'myth', answer: 'Myth', verdict: 'Wanting to isn’t the hard part.',
        why: 'Most people who use nicotine want to stop, and many try every year. Of attempts made with willpower alone, only about 3 to 5 in 100 last six months to a year. That isn’t weakness. It’s what happens without a plan, which is what this week is for.', src: 'Source: Hughes et al., Addiction 2004' },
      { q: 'Most people who use nicotine want to quit.', truth: 'fact', answer: 'Fact', verdict: 'You’re in the majority.',
        why: 'In a large US survey, about 68 in 100 adult smokers said they wanted to quit completely, and more than half had tried in the past year. Wanting out and still using isn’t a contradiction. It’s how the trap works.', src: 'Source: Babb et al., MMWR 2017' },
      { q: 'It hasn’t harmed me yet, so I’m fine.', truth: 'myth', answer: 'Myth', verdict: 'Harm builds quietly. Repair starts quickly.',
        why: 'Most damage from smoke builds for years before you can feel it. The encouraging part: your body starts recovering soon after you stop. Heart rate and blood pressure begin to settle within minutes, and carbon monoxide falls to normal within a few days.', src: 'Source: American Cancer Society' }
    ];
    const st = list[i];
    const answered = Boolean(ans);
    const right = answered && (st.truth === 'partly' || st.truth === ans);
    const bg = !answered ? '#FFD966' : (st.truth === 'fact' ? '#9CCBFF' : st.truth === 'myth' ? '#FFC38A' : '#FFD966');
    const tilt = !answered ? '' : (ans === 'myth' ? ' transform: rotate(-2deg) translateX(-4px);' : ' transform: rotate(2deg) translateX(4px);');
    return {
      st, n: i + 1, answered, waiting: !answered,
      cardBg: 'background: ' + bg + ';' + tilt,
      cardCls: answered ? '' : (s.anim ? 'f-in' : 'f-wob'),
      qSize: answered ? '26px' : '34px',
      youSaid: st.truth === 'partly' ? 'Either answer works here' : (right ? 'You called it' : 'Most people think so at first'),
      dots: list.map((_, j) => j < i || (j === i && answered) ? 'background: #FFD966' : (j === i ? 'background: #FFF8EE' : 'background: rgba(255,255,255,0.25)')),
      progressLabel: 'Statement ' + (i + 1) + ' of 5',
      nextShown: answered && i < list.length - 1,
      finalShown: answered && i === list.length - 1,
      myth: () => this.setState({ ans: 'myth' }),
      fact: () => this.setState({ ans: 'fact' }),
      next: () => this.setState({ i: i + 1, ans: undefined, anim: (s.anim || 0) + 1 })
    };
  }
}
</script>
</body>
</html>
