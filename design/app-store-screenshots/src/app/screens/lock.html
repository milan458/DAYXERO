<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Lock Screen</title>
<!-- Screenshots: the Lock Screen during a craving on Sun, Nov 8 (Day 3), built from the shipping widget and Live Activity code:
     - inline day counter (WidgetViews/DXWidgetViews.swift, DayCounterWidgetView.inline): "Day 3 · $15 kept" (widgets round to whole dollars)
     - accessoryCircular SOS (SOSWidgetView): the ring glyph and "SOS"
     - the SOS Live Activity (DayXeroWidgets/DayXeroWidgets.swift, CravingLiveActivity): ocean #1F3C8C, Jelli on #1D3A9E,
       "Riding it out with Jelli" / "Breathe in for 4, out for 6", the time ridden counting up, "It passed" and "Open".
     The wallpaper is DayXero's own dawn scene (any wallpaper works; this one keeps the set on brand). The clock face is
     drawn in DM Sans because Apple's SF fonts can't be bundled here. -->
<link rel="stylesheet" href="../../fonts/fonts.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  .lock { position: relative; width: 390px; height: 844px; overflow: hidden; color: #fff; font-family: "DM Sans", system-ui, sans-serif; }
  .wall { position: absolute; inset: 0; background: linear-gradient(180deg, #2A1840 0%, #5A2A55 18%, #B4504E 33%, #FF7E5A 44.3%); }
  .wall .hz { position: absolute; left: 0; right: 0; bottom: 0; height: 470px; -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 90px); mask-image: linear-gradient(180deg, transparent 0, #000 90px); }
  .wall .hz svg { display: block; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,10,30,.34) 0%, rgba(40,10,30,.08) 40%, rgba(20,8,30,.0) 60%, rgba(20,8,40,.28) 100%); }
  .sb { position: absolute; top: 0; left: 0; right: 0; height: 50px; display: flex; justify-content: flex-end; align-items: center; gap: 6px; padding: 6px 30px 0; }
  .sb svg { display: block; }
  .datel { position: absolute; top: 78px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 7px; font: 600 19px/1 "DM Sans"; color: rgba(255,255,255,.9); letter-spacing: .1px; }
  .datel svg { flex: none; }
  .clock { position: absolute; top: 96px; left: 0; right: 0; text-align: center; font: 640 104px/1 "DM Sans"; letter-spacing: -3px; color: rgba(255,255,255,.94); font-variant-numeric: lining-nums; }
  .widgets { position: absolute; top: 226px; left: 0; right: 0; display: flex; justify-content: center; gap: 12px; }
  .circ { width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,.18); backdrop-filter: blur(20px); display: grid; place-items: center; align-content: center; gap: 2px; }
  .circ span { font: 700 12px/1 "DM Sans"; letter-spacing: .6px; }
  .la { position: absolute; left: 12px; right: 12px; top: 556px; border-radius: 24px; background: #1F3C8C; color: #FFF8EE; padding: 16px; display: grid; gap: 12px; box-shadow: 0 10px 30px rgba(10,20,60,.28); }
  .la .top { display: flex; align-items: center; gap: 10px; }
  .la .av { width: 36px; height: 36px; border-radius: 99px; background: #1D3A9E; overflow: hidden; display: grid; place-items: center; flex: none; }
  .la .t1 { font: 700 16px/1.2 "DM Sans"; }
  .la .t2 { font: 500 12px/1.3 "DM Sans"; color: #E3EAFF; margin-top: 1px; }
  .la .grow { flex: 1; min-width: 0; }
  .la .timer { font: 800 28px/1 "Bricolage Grotesque"; font-variant-numeric: tabular-nums; letter-spacing: -.4px; }
  .la .acts { display: flex; gap: 8px; }
  .la .acts span { flex: 1; min-height: 40px; border-radius: 99px; display: grid; place-items: center; font: 700 16px/1 "DM Sans"; }
  .la .acts .pass { background: #FFF8EE; color: #1F3C8C; }
  .la .acts .open { background: #1D3A9E; color: #FFF8EE; font-weight: 600; }
  .qbtn { position: absolute; bottom: 44px; width: 50px; height: 50px; border-radius: 25px; background: rgba(20,10,30,.32); backdrop-filter: blur(20px); display: grid; place-items: center; }
  .qbtn.l { left: 46px; } .qbtn.r { right: 46px; }
  .home { position: absolute; bottom: 9px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: rgba(255,255,255,.9); }
  .swipe { position: absolute; bottom: 30px; left: 0; right: 0; text-align: center; font: 500 14px/1 "DM Sans"; color: rgba(255,255,255,.7); }
</style>
</head><body>
<div class="lock">
  <div class="wall" id="wall"></div>
  <div class="shade"></div>
  <div class="sb" aria-hidden="true">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.3-1.3A10.6 10.6 0 008 .3 10.6 10.6 0 00.5 3.4l1.3 1.3A8.7 8.7 0 018 2.2zm0 3.7c1.4 0 2.7.5 3.6 1.4l1.4-1.3A7 7 0 008 4a7 7 0 00-5 2l1.4 1.3c.9-.9 2.2-1.4 3.6-1.4zM8 9.6l2-2a2.8 2.8 0 00-4 0z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.5" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2.2" fill="#fff"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="#fff" opacity=".45"/></svg>
  </div>
  <!-- the date, then the inline day counter widget -->
  <div class="datel"><span>Sun 8</span>
    <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3"/></svg>
    <span>Day 3 · $15 kept</span></div>
  <div class="clock">9:39</div>
  <div class="widgets">
    <div class="circ" aria-label="Craving SOS">
      <svg width="26" height="26" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="11" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="15" cy="15" r="11" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="7"/></svg>
      <span>SOS</span>
    </div>
  </div>
  <div class="la" id="la">
    <div class="top">
      <span class="av" id="jelli"></span>
      <div class="grow"><div class="t1">Riding it out with Jelli</div><div class="t2">Breathe in for 4, out for 6</div></div>
      <span class="timer">0:52</span>
    </div>
    <div class="acts"><span class="pass">It passed</span><span class="open">Open</span></div>
  </div>
  <div class="qbtn l" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l-1 6H9z"/><path d="M9 8h6v13a1 1 0 01-1 1h-4a1 1 0 01-1-1z"/><path d="M12 12v3"/></svg></div>
  <div class="qbtn r" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></div>
  <div class="home"></div>
</div>
<script>
  /* the wallpaper: a deep pre-dawn sky above DayXero's own dawn horizon */
  document.getElementById('wall').innerHTML = '<div class="hz">' + DX.char('horizon', { scene: 'dawn', w: 390, h: 470, clarity: 100, fit: 'xMidYMax slice' }) + '</div>';
  document.getElementById('jelli').innerHTML = DX.char('jelli', { mood: 'breathe', size: 34, stage: 1 });
</script>
</body></html>
