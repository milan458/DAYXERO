<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DayXero crew character</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
@keyframes cBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes cSway{0%,100%{transform:skewX(0)}50%{transform:skewX(6deg)}}
@keyframes cGlow{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.12)}}
@keyframes cBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes cWing{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}
@keyframes cWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-24deg)}}
.cBob{animation:cBob 3s ease-in-out infinite}
.cSway{animation:cSway 2.4s ease-in-out infinite;transform-origin:center top;transform-box:fill-box}
.cGlow{animation:cGlow 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.cBlink{animation:cBlink 4.5s infinite;transform-origin:center;transform-box:fill-box}
.cWingL{animation:cWing .5s ease-in-out infinite;transform-origin:right center;transform-box:fill-box}
.cWingR{animation:cWing .5s .25s ease-in-out infinite;transform-origin:left center;transform-box:fill-box}
.cWave{animation:cWave 1s ease-in-out infinite;transform-origin:left bottom;transform-box:fill-box}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}
</style>
</helmet>
<div style="width: {{w}}; height: {{h}}; position: relative">
  <svg class="cBob" role="img" aria-label="{{label}}" width="100%" height="100%" viewBox="0 0 200 220" style="overflow: visible; animation-delay: {{delay}}">
    <ellipse cx="100" cy="210" rx="52" ry="7" fill="#201D2E" opacity=".12"></ellipse>

    <sc-if value="{{isXero}}" hint-placeholder-val="{{ true }}">
      <g>
        <ellipse cx="78" cy="198" rx="17" ry="9" fill="#E8603C"></ellipse>
        <ellipse cx="122" cy="198" rx="17" ry="9" fill="#E8603C"></ellipse>
        <path d="{{x.armL}}" fill="none" stroke="#FF7A55" stroke-width="15" stroke-linecap="round"></path>
        <path class="{{x.waveCls}}" d="{{x.armR}}" fill="none" stroke="#FF7A55" stroke-width="15" stroke-linecap="round"></path>
        <path d="M100 18 C152 18 170 70 168 120 C166 172 140 200 100 200 C60 200 34 172 32 120 C30 70 48 18 100 18Z" fill="#FF7A55"></path>
        <path d="M100 18 C152 18 170 70 168 120 C166 172 140 200 100 200 C128 186 150 160 152 116 C154 66 136 30 100 18Z" fill="#E8603C" opacity=".35"></path>
        <ellipse cx="68" cy="58" rx="12" ry="22" transform="rotate(-24 68 58)" fill="#FFFFFF" opacity=".4"></ellipse>
        <ellipse cx="100" cy="152" rx="28" ry="33" fill="#DCEBFF"></ellipse>
        <path d="M73 160 Q100 140 127 160 Q127 176 116 184 L84 184 Q73 176 73 160Z" fill="#8FD9A8"></path>
        <path d="M80 172 Q100 162 120 172 Q116 182 100 185 Q84 182 80 172Z" fill="#FFD966"></path>
        <ellipse cx="62" cy="120" rx="11" ry="6.5" fill="#FFB3A7"></ellipse>
        <ellipse cx="138" cy="120" rx="11" ry="6.5" fill="#FFB3A7"></ellipse>
        <g class="cBlink"><path d="{{eyes}}" fill="{{eyeFill}}" stroke="#201D2E" stroke-width="{{eyeStroke}}" stroke-linecap="round"></path></g>
        <path d="{{glints}}" fill="#FFFFFF"></path>
        <path d="{{mouth}}" fill="{{mouthFill}}" stroke="#201D2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
      </g>
    </sc-if>

    <sc-if value="{{isJelli}}" hint-placeholder-val="{{ false }}">
      <g>
        <circle cx="160" cy="40" r="7" fill="none" stroke="#FFFFFF" stroke-width="3" opacity=".8"></circle>
        <circle cx="176" cy="66" r="4" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity=".8"></circle>
        <g class="cSway" fill="none" stroke="#FF8FA3" stroke-width="9" stroke-linecap="round">
          <path d="M58 122 C52 146 66 160 58 184 C54 196 60 204 64 206"></path>
          <path d="M80 126 C76 152 90 168 82 196"></path>
          <path d="M100 126 C96 154 108 172 100 204"></path>
          <path d="M120 126 C116 152 130 168 122 196"></path>
          <path d="M142 122 C136 146 150 160 142 184 C138 196 144 204 148 206"></path>
        </g>
        <path d="M28 120 C28 58 62 26 100 26 C138 26 172 58 172 120 Q152 134 132 122 Q116 136 100 122 Q84 136 68 122 Q48 134 28 120Z" fill="#FF8FA3"></path>
        <path d="M100 26 C138 26 172 58 172 120 Q160 128 148 124 C152 80 134 44 100 26Z" fill="#E86A86" opacity=".3"></path>
        <circle cx="66" cy="62" r="8" fill="#FFC2CC"></circle><circle cx="128" cy="50" r="5" fill="#FFC2CC"></circle><circle cx="148" cy="80" r="6" fill="#FFC2CC"></circle><circle cx="52" cy="92" r="4" fill="#FFC2CC"></circle><circle cx="96" cy="44" r="4" fill="#FFC2CC"></circle>
        <ellipse cx="66" cy="104" rx="10" ry="6" fill="#FF6F8F" opacity=".55"></ellipse>
        <ellipse cx="134" cy="104" rx="10" ry="6" fill="#FF6F8F" opacity=".55"></ellipse>
        <g class="cBlink"><path d="{{eyes}}" fill="{{eyeFill}}" stroke="#201D2E" stroke-width="{{eyeStroke}}" stroke-linecap="round"></path></g>
        <path d="{{mouth}}" fill="{{mouthFill}}" stroke="#201D2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
      </g>
    </sc-if>

    <sc-if value="{{isGlim}}" hint-placeholder-val="{{ false }}">
      <g>
        <circle class="cGlow" cx="100" cy="158" r="62" fill="#FFD966"></circle>
        <ellipse class="cWingL" cx="48" cy="86" rx="36" ry="22" transform="rotate(-28 48 86)" fill="#DCE6FF" stroke="#B9C8F5" stroke-width="3" opacity=".95"></ellipse>
        <ellipse class="cWingR" cx="152" cy="86" rx="36" ry="22" transform="rotate(28 152 86)" fill="#DCE6FF" stroke="#B9C8F5" stroke-width="3" opacity=".95"></ellipse>
        <path d="M82 52 L68 18 M118 52 L132 18" stroke="#5B3FD0" stroke-width="5" stroke-linecap="round"></path>
        <circle class="cGlow" cx="68" cy="16" r="12" fill="#FFD966"></circle><circle cx="68" cy="16" r="8" fill="#FFD966"></circle>
        <circle class="cGlow" cx="132" cy="16" r="12" fill="#FFD966"></circle><circle cx="132" cy="16" r="8" fill="#FFD966"></circle>
        <ellipse cx="100" cy="160" rx="42" ry="40" fill="#FFD966"></ellipse>
        <path d="M62 150 Q100 162 138 150 M60 170 Q100 182 140 170 M68 188 Q100 198 132 188" fill="none" stroke="#E3AE2F" stroke-width="6" stroke-linecap="round"></path>
        <path d="M56 116 q-18 6 -20 24 M144 116 q18 6 20 24" fill="none" stroke="#7B5CE0" stroke-width="11" stroke-linecap="round"></path>
        <circle cx="100" cy="90" r="48" fill="#7B5CE0"></circle>
        <path d="M100 42 A48 48 0 0 1 100 138 A40 48 0 0 0 100 42Z" fill="#5B3FD0" opacity=".45"></path>
        <ellipse cx="74" cy="66" rx="9" ry="14" transform="rotate(-24 74 66)" fill="#FFFFFF" opacity=".3"></ellipse>
        <ellipse cx="72" cy="104" rx="9" ry="5.5" fill="#FF9EC0" opacity=".7"></ellipse>
        <ellipse cx="128" cy="104" rx="9" ry="5.5" fill="#FF9EC0" opacity=".7"></ellipse>
        <g class="cBlink"><path d="{{eyes}}" fill="{{eyeFill}}" stroke="#FFF7EE" stroke-width="{{eyeStroke}}" stroke-linecap="round"></path></g>
        <path d="{{mouth}}" fill="{{mouthFill}}" stroke="#FFF7EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
      </g>
    </sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"enum","options":["xero","jelli","glim"],"default":"xero"},"expr":{"editor":"enum","options":["happy","sleepy","cheer"],"default":"happy"},"size":{"editor":"int","default":300,"min":60,"max":900},"delay":{"editor":"text","default":"0s"},"$preview":{"width":300,"height":330}}'>
class Component extends DCLogic {
  renderVals() {
    const who = this.props.who || 'xero';
    const expr = this.props.expr || 'happy';
    const size = Number(this.props.size) || 300;
    const E = {
      xero: {
        happy: { eyes: 'M72 92 a9 12 0 1 0 18 0 a9 12 0 1 0 -18 0 M110 92 a9 12 0 1 0 18 0 a9 12 0 1 0 -18 0', fill: '#201D2E', sw: 1, glints: 'M80 86 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0 M118 86 a3 3 0 1 0 6 0 a3 3 0 1 0 -6 0', mouth: 'M88 116 Q100 128 112 116', mf: 'none' },
        sleepy: { eyes: 'M70 94 Q81 102 92 94 M108 94 Q119 102 130 94', fill: 'none', sw: 5, glints: '', mouth: 'M92 120 Q100 125 108 120', mf: 'none' },
        cheer: { eyes: 'M70 98 Q81 84 92 98 M108 98 Q119 84 130 98', fill: 'none', sw: 5, glints: '', mouth: 'M84 112 Q100 140 116 112 Z', mf: '#201D2E' }
      },
      jelli: {
        happy: { eyes: 'M74 86 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0 M114 86 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0', fill: '#201D2E', sw: 1, mouth: 'M90 100 Q100 110 110 100', mf: 'none' },
        sleepy: { eyes: 'M70 88 Q80 96 90 88 M110 88 Q120 96 130 88', fill: 'none', sw: 5, mouth: 'M94 102 Q100 106 106 102', mf: 'none' },
        cheer: { eyes: 'M70 92 Q80 80 90 92 M110 92 Q120 80 130 92', fill: 'none', sw: 5, mouth: 'M86 98 Q100 120 114 98 Z', mf: '#201D2E' }
      },
      glim: {
        happy: { eyes: 'M78 86 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0 M110 86 a6 7 0 1 0 12 0 a6 7 0 1 0 -12 0', fill: '#FFF7EE', sw: 1, mouth: 'M90 106 Q100 114 110 106', mf: 'none' },
        sleepy: { eyes: 'M74 90 Q84 96 94 90 M106 90 Q116 96 126 90', fill: 'none', sw: 5, mouth: 'M94 108 Q100 112 106 108', mf: 'none' },
        cheer: { eyes: 'M74 94 Q84 82 94 94 M106 94 Q116 82 126 94', fill: 'none', sw: 5, mouth: 'M88 104 Q100 124 112 104 Z', mf: '#FFF7EE' }
      }
    };
    const e = E[who][expr] || E[who].happy;
    const cheer = expr === 'cheer';
    return {
      w: size + 'px',
      h: Math.round(size * 1.1) + 'px',
      delay: this.props.delay || '0s',
      label: who === 'xero' ? 'Xero, the coral guide' : who === 'jelli' ? 'Jelli, the pink jellyfish' : 'Glim, the purple firefly',
      isXero: who === 'xero', isJelli: who === 'jelli', isGlim: who === 'glim',
      eyes: e.eyes, eyeFill: e.fill, eyeStroke: e.sw, glints: e.glints || '', mouth: e.mouth, mouthFill: e.mf,
      x: {
        armL: cheer ? 'M42 112 Q16 96 18 66' : 'M40 118 Q18 130 20 156',
        armR: cheer ? 'M158 112 Q184 96 182 66' : 'M160 118 Q182 130 180 156',
        waveCls: cheer ? 'cWave' : ''
      }
    };
  }
}
</script>
</body>
</html>
