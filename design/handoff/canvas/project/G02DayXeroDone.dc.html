<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>You are on Day Xero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 350px; flex: none">
    <div style="position: absolute; left: 0; top: 0; {{a0}}"><dc-import name="Hero2" scene="dawn" clarity="23" h="350" edge="{{t.bg}}" animate="{{motionStr}}" hint-size="390px,350px"></dc-import></div>
    <div style="position: absolute; left: 95px; top: 128px; transform-origin: 50% 100%; {{pop}}"><dc-import name="Xero" mood="cheer" stage="1" animate="{{motionStr}}" size="200" hint-size="200px,200px"></dc-import></div>
  </div>

  <div style="padding: 8px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.muted}}; {{a1}}">DAY 1 · FRI 6 NOV</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.02; letter-spacing: -1.2px; {{a2}}">You’re on Day Xero.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: {{t.muted}}; {{a3}}">Your counter has started.</p>
  </div>

  <div style="margin: 16px 18px 0 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; {{a4}}">
    <div style="background: {{t.card}}; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">1</span><span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">day clear</span></div>
    <div style="background: {{t.card}}; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">1</span><span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">cigarette not smoked</span></div>
    <div style="background: {{t.card}}; border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">$1.04</span><span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">kept</span></div>
  </div>

  <div style="margin: 10px 18px 0 18px; background: {{t.card}}; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; {{a5}}">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.muted}}">TODAY’S MISSION</div>
    <div style="font-size: 16px; line-height: 1.45; font-weight: 600">Every craving you ride out today, tap “It passed”. Every single one counts.</div>
  </div>

  <div style="margin-top: auto; padding: 0 22px 22px 22px; {{a6}}">
    <a href="G03Offer.dc.html" style="height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2)">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  play() {
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
    this.setState({ on: false });
    this.timers.push(setTimeout(() => this.setState({ on: true }), 300));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 10000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const on = !motion || Boolean(this.state && this.state.on);
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 18}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 600ms ${ease} ${i * 90}ms`;
    const t = dark
      ? { bg: '#241433', ink: '#FFF8EE', muted: '#E0C8E8', card: 'rgba(255,255,255,0.08)', btn: '#FFD966', btnInk: '#241433' }
      : { bg: '#FFD966', ink: '#1E1A3A', muted: '#5A4A10', card: 'rgba(255,248,238,0.7)', btn: '#1E1A3A', btnInk: '#FFF8EE' };
    return {
      t, motionStr: String(motion),
      a0: `opacity: ${on ? 1 : 0}; transition: opacity 600ms ${ease}`,
      pop: `opacity: ${on ? 1 : 0}; transform: scale(${on ? 1 : 0.6}); transition: opacity 400ms ${ease}, transform 700ms cubic-bezier(.3,1.4,.5,1)`,
      a1: a(5), a2: a(6), a3: a(7), a4: a(8), a5: a(9), a6: a(10)
    };
  }
}
</script>
</body>
</html>
