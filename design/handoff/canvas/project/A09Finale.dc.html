<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Week 4 finale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 400px; flex: none">
    <div style="position: absolute; left: 0; top: 0; {{a0}}"><dc-import name="Hero2" scene="dawn" clarity="100" h="400" edge="{{t.bg}}" animate="{{motionStr}}" hint-size="390px,400px"></dc-import></div>
    <svg width="390" height="400" viewBox="0 0 390 400" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <rect x="40" y="-20" width="8" height="14" rx="2" fill="#FF7A55"><animate attributeName="y" values="{{c1}}" dur="3.2s" repeatCount="indefinite"></animate></rect>
      <rect x="110" y="-20" width="7" height="12" rx="2" fill="#3D6BFF"><animate attributeName="y" values="{{c2}}" dur="4s" begin="0.6s" repeatCount="indefinite"></animate></rect>
      <rect x="175" y="-20" width="8" height="8" rx="4" fill="#4A3596"><animate attributeName="y" values="{{c1}}" dur="3.6s" begin="1.1s" repeatCount="indefinite"></animate></rect>
      <rect x="240" y="-20" width="7" height="13" rx="2" fill="#1FA971"><animate attributeName="y" values="{{c2}}" dur="3.4s" begin="0.3s" repeatCount="indefinite"></animate></rect>
      <rect x="300" y="-20" width="8" height="8" rx="4" fill="#FF8FB8"><animate attributeName="y" values="{{c1}}" dur="4.2s" begin="1.6s" repeatCount="indefinite"></animate></rect>
      <rect x="350" y="-20" width="7" height="12" rx="2" fill="#FFF8EE"><animate attributeName="y" values="{{c2}}" dur="3.8s" begin="0.9s" repeatCount="indefinite"></animate></rect>
    </svg>
    <div style="position: absolute; left: 105px; top: 70px; {{x}}"><dc-import name="Xero" mood="cheer" stage="4" animate="{{motionStr}}" size="180" hint-size="180px,180px"></dc-import></div>
    <div style="position: absolute; left: 10px; top: 220px; {{j}}"><dc-import name="Jelli" mood="cheer" stage="4" animate="{{motionStr}}" size="130" hint-size="130px,130px"></dc-import></div>
    <div style="position: absolute; right: 10px; top: 214px; {{g}}"><dc-import name="Glim2" mood="cheer" stage="4" animate="{{motionStr}}" size="130" hint-size="130px,130px"></dc-import></div>
  </div>

  <div style="padding: 6px 26px 0 26px; text-align: center; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 13px; font-weight: 800; letter-spacing: 1.2px; {{a1}}">WEEK 4 · THE WHOLE CREW</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.04; letter-spacing: -1.1px; {{a2}}">28 days, {{name}}.<br>The sky is yours.</h1>
  </div>

  <div style="margin: 18px 20px 0 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; {{a3}}">
    <div style="background: {{t.card}}; border-radius: 20px; padding: 12px 10px; text-align: center"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">{{n1}}</div><div style="font-size: 12px; color: {{t.muted}}">with Xero</div><div style="font-size: 11px; color: {{t.muted}}">days clear</div></div>
    <div style="background: {{t.card}}; border-radius: 20px; padding: 12px 10px; text-align: center"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">{{n2}}</div><div style="font-size: 12px; color: {{t.muted}}">with Jelli</div><div style="font-size: 11px; color: {{t.muted}}">waves ridden</div></div>
    <div style="background: {{t.card}}; border-radius: 20px; padding: 12px 10px; text-align: center"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">{{n3}}</div><div style="font-size: 12px; color: {{t.muted}}">with Glim</div><div style="font-size: 11px; color: {{t.muted}}">nights checked in</div></div>
  </div>
  <div style="margin: 8px 20px 0 20px; background: {{t.card}}; border-radius: 18px; padding: 12px 14px; font-size: 14px; line-height: 1.4; text-align: center; {{a4}}"><b>{{n4}}</b> cigarettes not smoked · <b>£{{n5}}</b> kept for “{{reason}}”</div>

  <div style="margin-top: auto; padding: 0 22px 28px 22px; display: flex; gap: 10px; {{a5}}">
    <a href="#" style="flex: 1; height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2)">Keep going</a>
    <a href="#" style="height: 58px; padding: 0 20px; border-radius: 99px; background: {{t.card}}; color: {{t.ink}}; font-weight: 700; font-size: 15px; text-decoration: none; display: flex; align-items: center">Share</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"name":{"editor":"text","default":"Sam"},"reason":{"editor":"text","default":"Mia"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); clearInterval(this.iv); }
  play() {
    (this.timers || []).forEach(clearTimeout); clearInterval(this.iv);
    this.timers = [];
    this.setState({ on: false, crew: 0, k: 0 });
    this.timers.push(setTimeout(() => this.setState({ on: true, crew: 1 }), 300));
    this.timers.push(setTimeout(() => this.setState({ crew: 2 }), 1000));
    this.timers.push(setTimeout(() => this.setState({ crew: 3 }), 1500));
    this.timers.push(setTimeout(() => {
      const t0 = Date.now();
      this.iv = setInterval(() => {
        const p = Math.min(1, (Date.now() - t0) / 900);
        this.setState({ k: 1 - Math.pow(1 - p, 3) });
        if (p >= 1) clearInterval(this.iv);
      }, 30);
    }, 1900));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 11000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const crew = motion ? (s.crew || 0) : 3;
    const k = motion ? (s.k || 0) : 1;
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i, dy) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : (dy ?? 18)}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 700ms ${ease} ${i * 90}ms`;
    const enter = (show, dx, dy) => `opacity: ${show ? 1 : 0}; transform: translate(${show ? 0 : dx}px, ${show ? 0 : dy}px) scale(${show ? 1 : 0.7}); transition: opacity 500ms ${ease}, transform 900ms cubic-bezier(.3,1.5,.5,1)`;
    const t = dark
      ? { bg: '#2E2508', ink: '#FFF8EE', muted: '#EBD89A', card: 'rgba(255,255,255,0.08)', btn: '#FFF8EE', btnInk: '#2E2508' }
      : { bg: '#FFD966', ink: '#1E1A3A', muted: '#5A4A10', card: 'rgba(255,248,238,0.7)', btn: '#1E1A3A', btnInk: '#FFF8EE' };
    const n = (v) => Math.round(v * k).toLocaleString('en-GB');
    const m = (x, y) => motion ? x : y;
    return {
      t, motionStr: String(motion), name: this.props.name ?? 'Sam', reason: this.props.reason ?? 'Mia',
      x: enter(crew >= 1, 0, 120), j: enter(crew >= 2, -100, 40), g: enter(crew >= 3, 100, 40),
      n1: n(28), n2: n(41), n3: n(24), n4: n(336), n5: n(252),
      c1: m('-20;420', '-40;-40'), c2: m('-20;420', '-40;-40'),
      a0: `opacity: ${on ? 1 : 0}; transition: opacity 700ms ${ease}`,
      a1: a(8), a2: a(9), a3: a(10), a4: a(11), a5: a(12)
    };
  }
}
</script>
</body>
</html>
