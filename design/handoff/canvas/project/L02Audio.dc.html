<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson audio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 50px 16px 0 10px; display: flex; align-items: center; gap: 10px">
    <a href="F10Program.dc.html" aria-label="Close. Your place is saved." style="width: 44px; height: 44px; border-radius: 99px; background: {{t.surf}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div role="progressbar" aria-label="Session progress" aria-valuemin="1" aria-valuemax="7" aria-valuenow="2" style="flex-grow: 1; height: 8px; border-radius: 99px; background: {{t.surf}}; overflow: hidden"><div style="width: 28.6%; height: 100%; background: {{t.green}}; border-radius: 99px"></div></div>
    <span style="width: 40px; height: 40px; border-radius: 99px; background: #FFC38A; overflow: hidden; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Xero" mood="calm" stage="1" animate="false" size="40" hint-size="40px,40px"></dc-import></span>
  </div>

  <div style="padding: 18px 24px 0 24px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; {{a0}}">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.green}}">AUDIO SESSION · DAY 2</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.6px">The noisy passengers</h1>
  </div>

  <div style="position: relative; height: 210px; flex: none; display: grid; place-items: center; {{a1}}">
    <svg width="210" height="210" viewBox="0 0 210 210" aria-hidden="true" style="position: absolute; left: 90px; top: 0">
      <circle cx="105" cy="105" r="80" fill="{{t.ring}}"><animate attributeName="r" values="{{ringV}}" keyTimes="0;0.4;1" dur="10s" repeatCount="indefinite"></animate></circle>
      <circle cx="105" cy="105" r="62" fill="{{t.ring}}"></circle>
    </svg>
    <div style="position: relative"><dc-import name="Xero" mood="{{xMood}}" stage="1" animate="{{motionStr}}" size="140" hint-size="140px,140px"></dc-import></div>
  </div>

  <sc-if value="{{soon}}" hint-placeholder-val="{{false}}">
    <div style="padding: 10px 28px 0 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
      <span style="display: inline-flex; align-items: center; gap: 8px; background: {{t.surf}}; border-radius: 99px; padding: 8px 14px; font-size: 14px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="5" height="7" rx="2"></rect><rect x="16" y="14" width="5" height="7" rx="2"></rect></svg>Audio coming soon</span>
      <p style="margin: 0; font-size: 16px; line-height: 1.5; color: {{t.muted}}">The guided audio for this session is on its way. Everything after it works now, so carry on.</p>
    </div>
  </sc-if>

  <sc-if value="{{player}}" hint-placeholder-val="{{true}}">
    <div style="padding: 6px 24px 0 24px; display: flex; flex-direction: column; gap: 6px">
      <div role="slider" aria-label="Position" aria-valuemin="0" aria-valuemax="180" aria-valuenow="{{pos}}" aria-valuetext="{{elapsed}}" tabindex="0" style="height: 8px; border-radius: 99px; background: {{t.surf}}; position: relative"><div style="height: 100%; border-radius: 99px; background: {{t.ink}}; {{posStyle}}"></div></div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: {{t.muted}}"><span>{{elapsed}}</span><span>3:00</span></div>
    </div>
    <div style="padding: 4px 24px 0 24px; display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Speed, 1 times" style="width: 48px; height: 48px; border: 0; border-radius: 99px; background: transparent; color: {{t.ink}}; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer">1×</button>
      <button aria-label="Back 15 seconds" style="width: 48px; height: 48px; border: 0; border-radius: 99px; background: transparent; color: {{t.ink}}; cursor: pointer; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"></path><path d="M4 4v4h4"></path><path d="M10 10v5M13 10h2.5v2h-2v3h2.5" stroke-width="1.6"></path></svg></button>
      <button aria-label="{{playLabel}}" onClick="{{toggle}}" style="width: 64px; height: 64px; border: 0; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; cursor: pointer; display: grid; place-items: center">
        <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></sc-if>
        <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"></path></svg></sc-if>
      </button>
      <button aria-label="Forward 15 seconds" style="width: 48px; height: 48px; border: 0; border-radius: 99px; background: transparent; color: {{t.ink}}; cursor: pointer; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v4h-4"></path><path d="M9 10v5M12 10h2.5v2h-2v3h2.5" stroke-width="1.6"></path></svg></button>
      <span style="width: 48px"></span>
    </div>
    <div style="margin: 10px 18px 0 18px; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{captions}}" as="c" hint-placeholder-count="3">
        <button aria-description="Plays from here" style="text-align: left; border: 0; font: inherit; cursor: pointer; border-radius: 14px; padding: 8px 12px; min-height: 44px; font-size: 16px; line-height: 1.4; {{c.style}}">{{c.text}}</button>
      </sc-for>
    </div>
  </sc-if>

  <div style="margin-top: auto; padding: 0 22px 22px 22px; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <sc-if value="{{finished}}" hint-placeholder-val="{{false}}"><span style="display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 700; color: {{t.green}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Nice. On to the exercise.</span></sc-if>
    <sc-if value="{{canGo}}" hint-placeholder-val="{{false}}"><a href="L03Reflect.dc.html" style="align-self: stretch; height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Continue</a></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"audio":{"editor":"enum","options":["playing","finished","coming soon"],"default":"playing"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  play() {
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
    this.setState({ on: false });
    this.timers.push(setTimeout(() => this.setState({ on: true }), 300));
    if (String(this.props.replay ?? false) !== 'false') this.timers.push(setTimeout(() => this.play(), 10000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const mode = this.props.audio ?? 'playing';
    const paused = Boolean(s.paused);
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 18}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 600ms ${ease} ${i * 90}ms`;
    const t = dark
      ? { bg: '#0E0B2B', ink: '#FFF8EE', muted: '#B8B3D9', surf: '#1B1747', green: '#2FD08A', ring: 'rgba(255,195,138,0.12)', btn: '#FFF8EE', btnInk: '#0E0B2B', capOn: '#2A255F' }
      : { bg: '#FBF7F1', ink: '#1E1A3A', muted: '#5E5975', surf: '#F1EBE2', green: '#0F6E43', ring: 'rgba(255,195,138,0.35)', btn: '#1E1A3A', btnInk: '#FFF8EE', capOn: '#FFFFFF' };
    const finished = mode === 'finished';
    const pos = finished ? 180 : 72;
    const lines = ['[Caption line 2 from tx_W1D2_default.json]', '[Caption line 3, now playing]', '[Caption line 4]'];
    const captions = lines.map((text, i) => ({ text, style: i === 1 ? `background: ${t.capOn}; color: ${t.ink}; font-weight: 600` : `background: transparent; color: ${t.muted}` }));
    return {
      t, captions, motionStr: String(motion), pos: String(pos),
      soon: mode === 'coming soon', player: mode !== 'coming soon', finished,
      canGo: finished || mode === 'coming soon',
      playing: !finished && !paused, paused: finished || paused,
      playLabel: !finished && !paused ? 'Pause' : 'Play',
      toggle: () => this.setState({ paused: !paused }),
      xMood: finished ? 'hello' : 'calm',
      elapsed: finished ? '3:00' : '1:12',
      posStyle: `width: ${Math.round(pos / 180 * 100)}%`,
      ringV: motion && !paused && !finished ? '62;80;62' : '72;72;72',
      a0: a(0), a1: a(1)
    };
  }
}
</script>
</body>
</html>
