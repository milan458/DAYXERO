<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quit Day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 300px; flex: none">
    <dc-import name="Hero" scene="dawn" clarity="25" h="300" theme="{{theme}}" hint-size="390px,300px"></dc-import>
    <div style="position: absolute; left: 0; right: 0; top: 50px; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 20px">
      <div style="flex: 1; height: 8px; border-radius: 99px; background: rgba(255,248,238,0.55)" role="progressbar" aria-label="Setup progress" aria-valuenow="3" aria-valuemin="1" aria-valuemax="6"><div style="width: 50%; height: 8px; border-radius: 99px; background: #1E1A3A"></div></div>
      <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 99px; border: 0; background: rgba(255,248,238,0.6); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
    </div>
    <div style="position: absolute; left: 125px; top: 100px"><dc-import name="Xero" mood="hello" stage="1" size="140" hint-size="140px,140px"></dc-import></div>
  </div>

  <div style="padding: 4px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -1px; line-height: 1.06">Pick your Quit Day</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}">I recommend <b style="color: {{t.ink}}">Fri 6 Nov</b>. It gives you the full 7-day prep window. Keep using as normal until then.</p>
  </div>

  <div style="margin: 18px 20px 0 20px; background: {{t.raised}}; box-shadow: {{t.shadow}}; border-radius: 26px; padding: 16px 14px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}; padding: 0 4px 10px"><span>Prep week</span><span style="color: #E2452B">Day Xero</span></div>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; text-align: center">
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><span style="font-size: 11px; color: {{t.muted}}">F</span><span style="width: 34px; height: 34px; border-radius: 99px; background: #A8E6C1; color: #1E1A3A; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">30</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><span style="font-size: 11px; color: {{t.muted}}">S</span><span style="width: 34px; height: 34px; border-radius: 99px; background: #A8E6C1; color: #1E1A3A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">31</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><span style="font-size: 11px; color: {{t.muted}}">S</span><span style="width: 34px; height: 34px; border-radius: 99px; background: #A8E6C1; color: #1E1A3A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">1</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><span style="font-size: 11px; color: {{t.muted}}">M</span><span style="width: 34px; height: 34px; border-radius: 99px; background: #A8E6C1; color: #1E1A3A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">2</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><span style="font-size: 11px; color: {{t.muted}}">T</span><span style="width: 34px; height: 34px; border-radius: 99px; background: #A8E6C1; color: #1E1A3A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">3</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><span style="font-size: 11px; color: {{t.muted}}">W</span><span style="width: 34px; height: 34px; border-radius: 99px; background: #A8E6C1; color: #1E1A3A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">4</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><span style="font-size: 11px; color: {{t.muted}}">T</span><span style="width: 34px; height: 34px; border-radius: 99px; background: #A8E6C1; color: #1E1A3A; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center">5</span></div>
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: center"><span style="font-size: 11px; color: {{t.muted}}">F</span><span style="width: 34px; height: 34px; border-radius: 99px; background: #FF6B4A; color: #1A0E08; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px {{t.raised}}, 0 0 0 5px #FF6B4A">6</span></div>
    </div>
  </div>
  <a href="#" style="align-self: center; margin-top: 10px; color: {{t.ink}}; font-weight: 600; font-size: 14px; padding: 8px">Pick another date</a>

  <div style="margin-top: auto; padding: 0 22px 26px 22px; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <a href="C05Crew.dc.html" style="position: relative; overflow: hidden; width: 100%; height: 60px; border-radius: 99px; background: #1E1A3A; color: #FFF8EE; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center">
      <svg width="346" height="60" viewBox="0 0 346 60" aria-hidden="true" style="position: absolute; left: 0; top: 0"><rect x="0" y="0" width="0" height="60" fill="#FF6B4A"><animate attributeName="width" values="0;346;346;0" keyTimes="0;0.5;0.8;1" dur="3s" repeatCount="indefinite"></animate></rect></svg>
      <span style="position: relative">Hold to set Fri 6 Nov</span>
    </a>
    <div style="font-size: 13px; color: {{t.muted}}">Hold for 1.5 seconds. You can change the date later.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    return { theme, t: dark
      ? { bg: '#0E0B2B', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', shadow: 'none' }
      : { bg: '#FBF7F1', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
</body>
</html>
