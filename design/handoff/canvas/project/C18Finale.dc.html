<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Week 4 finale</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 430px; flex: none">
    <dc-import name="Hero" scene="dawn" clarity="100" h="430" theme="{{theme}}" hint-size="390px,430px"></dc-import>
    <div style="position: absolute; left: 105px; top: 80px"><dc-import name="Xero" mood="cheer" stage="4" size="180" hint-size="180px,180px"></dc-import></div>
    <div style="position: absolute; left: 14px; top: 228px"><dc-import name="Jelli" mood="cheer" stage="4" size="130" hint-size="130px,130px"></dc-import></div>
    <div style="position: absolute; right: 12px; top: 222px"><dc-import name="Glim2" mood="cheer" stage="4" size="130" hint-size="130px,130px"></dc-import></div>
    <div style="position: absolute; left: 0; right: 0; top: 56px; display: flex; justify-content: center"><span style="background: #1E1A3A; color: #FFD66B; border-radius: 99px; padding: 7px 14px; font-size: 12px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase">Week 4 · program complete</span></div>
  </div>

  <div style="padding: 0 26px; text-align: center; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -1.4px; line-height: 1">Four weeks.<br>Clear skies.</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}">You did the prep, rode out 61 waves with Jelli and checked in with Glim most nights. The haze you started with is gone.</p>
  </div>

  <div style="margin: 14px 20px 0 20px; position: relative; height: 98px; border-radius: 24px; background: {{t.raised}}; box-shadow: {{t.shadow}}; overflow: hidden">
    <div style="position: absolute; right: 0; top: 0"><dc-import name="Horizon" scene="path" w="96" h="98" hint-size="96px,98px"></dc-import></div>
    <div style="position: absolute; left: 16px; top: 14px; right: 106px; display: flex; flex-direction: column; gap: 3px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: {{t.green}}">2 weeks to 3 months</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2">Circulation and lung function improve</span>
      <span style="font-size: 12px; color: {{t.muted}}">Source: American Cancer Society</span>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 20px 22px 20px; display: flex; flex-direction: column; gap: 4px; align-items: stretch">
    <a href="#" style="height: 58px; border-radius: 99px; background: #FF6B4A; color: #1A0E08; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #C9452B">Share my card</a>
    <a href="#" style="align-self: center; color: {{t.ink}}; font-weight: 600; font-size: 15px; padding: 12px 8px">What happens next</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    return { theme, t: dark
      ? { bg: '#0E0B2B', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', green: '#2FD08A', shadow: 'none' }
      : { bg: '#FBF7F1', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', green: '#14804F', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
</body>
</html>
