<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 450px; flex: none; {{a0}}">
    <dc-import name="Hero2" scene="dawn" clarity="20" h="450" edge="{{t.bg}}" animate="{{motionStr}}" hint-size="390px,450px"></dc-import>
    <div style="position: absolute; left: 85px; top: 128px; {{rise}}"><dc-import name="Xero" mood="{{mood}}" stage="1" animate="{{motionStr}}" size="220" hint-size="220px,220px"></dc-import></div>
    <div style="position: absolute; right: 18px; top: 92px; background: #FFF8EE; color: #1E1A3A; border-radius: 18px 18px 18px 4px; padding: 8px 12px; font-size: 14px; font-weight: 700; {{a3}}">Hi! I'm Xero.</div>
  </div>

  <div style="padding: 6px 28px 0 28px; text-align: center; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 33px; line-height: 1.06; letter-spacing: -1px; {{a1}}">Don't quit today.<br>Quit on your Quit Day.</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}; {{a2}}">Prep for 7 days while you still use as normal, then quit on the day you choose. Every day clear, I rise a little and your sky clears.</p>
  </div>

  <div style="margin-top: auto; padding: 0 22px 22px 22px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; {{a4}}">
    <a href="A03Chat.dc.html" style="height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.25)">Get started</a>
    <a href="#" style="align-self: center; color: {{t.ink}}; font-weight: 600; font-size: 15px; padding: 12px 8px">I already have an account</a>
    <div style="font-size: 12px; line-height: 1.45; color: {{t.muted}}; text-align: center">Takes 2 minutes, private on this phone. You confirm you're 18+.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); clearTimeout(this.t3); }
  play() {
    clearTimeout(this.t1); clearTimeout(this.t2); clearTimeout(this.t3);
    this.setState({ on: false, wave: false });
    this.t1 = setTimeout(() => this.setState({ on: true }), 300);
    this.t3 = setTimeout(() => this.setState({ wave: true }), 1700);
    if (String(this.props.replay ?? true) !== 'false') this.t2 = setTimeout(() => this.play(), 10000);
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i, dy) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : (dy ?? 18)}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 700ms ${ease} ${i * 90}ms`;
    const t = dark ? { bg: '#2B1A10', ink: '#FFF8EE', muted: '#F0C9A8', btn: '#FFF8EE', btnInk: '#2B1A10' } : { bg: '#FFC38A', ink: '#1E1A3A', muted: '#4A2A1A', btn: '#1E1A3A', btnInk: '#FFF8EE' };
    return {
      t, motionStr: String(motion),
      mood: motion && s.wave ? 'cheer' : 'hello',
      a0: `opacity: ${on ? 1 : 0}; transition: opacity 700ms ${ease}`,
      rise: `transform: translateY(${on ? 0 : 140}px); transition: transform 1400ms ${ease} 150ms`,
      a1: a(5), a2: a(6), a3: a(12, 8), a4: a(8)
    };
  }
}
</script>
</body>
</html>
