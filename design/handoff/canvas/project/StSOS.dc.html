<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Craving SOS with Jelli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 430px; flex: none">
    <dc-import name="Horizon" scene="sea" clarity="100" w="390" h="430" hint-size="390px,430px"></dc-import>
    <svg width="390" height="430" viewBox="0 0 390 430" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <defs><filter id="stLiftS" x="-5%" y="-50%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#1A0B2E" flood-opacity="0.25"></feDropShadow></filter></defs>
      <circle cx="195" cy="240" r="128" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="5"></circle>
      <circle cx="195" cy="240" r="128" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="320 484" transform="rotate(-90 195 240)"><animate attributeName="stroke-dasharray" values="0 804;804 0" dur="180s" repeatCount="indefinite"></animate></circle>
      <path filter="url(#stLiftS)" d="M0 398 C110 374 280 374 390 398 L390 430 L0 430 Z" fill="{{t.bg}}"></path>
    </svg>
    <div style="position: absolute; left: 100px; top: 145px"><dc-import name="Jelli" mood="breathe" stage="3" size="190" hint-size="190px,190px"></dc-import></div>
    <a href="#" aria-label="Close" style="position: absolute; left: 16px; top: 54px; width: 44px; height: 44px; border-radius: 99px; background: rgba(14,11,43,0.3); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF8EE" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="position: absolute; right: 12px; top: 44px; display: flex; align-items: center; gap: 4px">
      <span style="background: #FFF8EE; color: #1E1A3A; border-radius: 16px 16px 4px 16px; padding: 7px 11px; font-size: 13px; font-weight: 700">I called Jelli for you</span>
      <dc-import name="GlimX" mood="calm" stage="3" size="64" hint-size="64px,64px"></dc-import>
    </div>
  </div>

  <div style="padding: 6px 28px 0 28px; text-align: center; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 14px; font-weight: 700; color: {{t.accent}}">1:48 left in this wave</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; letter-spacing: -1px">Breathe in · 4</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}">Open as Jelli opens. Drift as it drifts. The craving will pass.</p>
  </div>

  <div style="margin: 16px 20px 0 20px; border-radius: 22px; background: {{t.surf}}; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 38px; height: 38px; flex: none; border-radius: 13px; background: #FF8FB8; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1E1A3A" aria-hidden="true"><path d="M12 21c-6-3.6-9-7-9-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4-3 7.4-9 11Z"></path></svg></span>
    <span style="display: flex; flex-direction: column"><span style="font-size: 12px; font-weight: 700; color: {{t.muted}}; text-transform: uppercase; letter-spacing: 0.6px">Your reason</span><span style="font-weight: 700; font-size: 15px">To keep up with Maya at the park.</span></span>
  </div>

  <div style="margin-top: auto; padding: 0 20px 26px 20px; display: flex; flex-direction: column; gap: 8px">
    <button style="height: 58px; border-radius: 99px; border: 0; background: #FF6B4A; color: #1A0E08; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer; box-shadow: 0 6px 0 #C9452B">It passed (+1)</button>
    <div style="display: flex; justify-content: center; gap: 26px">
      <a href="#" style="color: {{t.ink}}; font-weight: 600; font-size: 15px; padding: 10px 4px">Another three minutes</a>
      <a href="#" style="color: {{t.ink}}; font-weight: 600; font-size: 15px; padding: 10px 4px">I slipped</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    return { t: dark ? { bg: '#0E0B2B', surf: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', accent: '#7FB0FF' } : { bg: '#FBF7F1', surf: '#F1EBE2', ink: '#1E1A3A', muted: '#5E5975', accent: '#1F57D6' } };
  }
}
</script>
</body>
</html>
