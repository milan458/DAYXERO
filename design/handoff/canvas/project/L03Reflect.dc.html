<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson reflect</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 50px 16px 0 10px; display: flex; align-items: center; gap: 10px">
    <a href="F10Program.dc.html" aria-label="Close. Your place is saved." style="width: 44px; height: 44px; border-radius: 99px; background: {{t.surf}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div role="progressbar" aria-label="Session progress" aria-valuemin="1" aria-valuemax="7" aria-valuenow="3" style="flex-grow: 1; height: 8px; border-radius: 99px; background: {{t.surf}}; overflow: hidden"><div style="width: 42.9%; height: 100%; background: {{t.green}}; border-radius: 99px"></div></div>
    <span style="width: 40px; height: 40px; border-radius: 99px; background: #FFC38A; overflow: hidden; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Xero" mood="calm" stage="1" animate="false" size="40" hint-size="40px,40px"></dc-import></span>
  </div>

  <div style="padding: 22px 24px 0 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.green}}; {{a0}}">WEEK 1 · DAY 2 · 3 MIN</div>
    <label for="passenger" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.6px; line-height: 1.2; {{a1}}">What do your loudest passengers say?</label>
    <div style="font-size: 14px; font-weight: 700; color: {{t.muted}}; {{a2}}">{{count}} of 3</div>
  </div>

  <div style="padding: 10px 18px 0 18px; display: flex; flex-direction: column; gap: 8px; {{a3}}">
    <sc-for list="{{entries}}" as="e" hint-placeholder-count="0">
      <div style="display: flex; align-items: center; min-height: 54px; padding-left: 16px; background: {{t.raised}}; border-radius: 18px; box-shadow: inset 0 0 0 1px {{t.hair}}; font-size: 16px">
        <span style="flex-grow: 1">{{e.text}}</span>
        <button aria-label="{{e.label}}" onClick="{{e.remove}}" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.muted}}; cursor: pointer; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </div>
    </sc-for>
    <sc-if value="{{room}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; gap: 8px">
        <input id="passenger" value="{{draft}}" onChange="{{onDraft}}" placeholder="“Just one won't hurt.”" maxlength="80" style="flex-grow: 1; min-width: 0; box-sizing: border-box; height: 54px; border-radius: 18px; border: 0; box-shadow: inset 0 0 0 1.5px {{t.field}}; background: transparent; color: {{t.ink}}; font: inherit; font-size: 16px; padding: 0 16px">
        <button onClick="{{add}}" aria-label="Add" style="width: 54px; height: 54px; flex: none; border: 0; border-radius: 18px; background: {{t.surf}}; color: {{t.ink}}; cursor: pointer; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      </div>
    </sc-if>
  </div>

  <div style="margin-top: auto; padding: 0 22px 16px 22px; display: flex; flex-direction: column; gap: 2px; {{a4}}">
    <a href="L04Quiz.dc.html" aria-disabled="{{disabled}}" style="height: 58px; border-radius: 99px; text-decoration: none; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; {{btnStyle}}">Continue</a>
    <a href="L04Quiz.dc.html" style="align-self: center; height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.ink}}; font-weight: 600; font-size: 14px">Skip</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setTimeout(() => this.setState({ on: true }), 300); }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const list = s.list || [];
    const draft = s.draft || '';
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 18}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 600ms ${ease} ${i * 90}ms`;
    const t = dark
      ? { bg: '#0E0B2B', ink: '#FFF8EE', muted: '#B8B3D9', surf: '#1B1747', raised: '#1B1747', hair: 'rgba(255,255,255,0.12)', field: '#B8B3D9', green: '#2FD08A', btn: '#FFF8EE', btnInk: '#0E0B2B', off: '#1B1747', offInk: '#B8B3D9' }
      : { bg: '#FBF7F1', ink: '#1E1A3A', muted: '#5E5975', surf: '#F1EBE2', raised: '#FFFFFF', hair: 'rgba(30,26,58,0.1)', field: '#5E5975', green: '#0F6E43', btn: '#1E1A3A', btnInk: '#FFF8EE', off: '#F1EBE2', offInk: '#5E5975' };
    const ready = list.length > 0;
    return {
      t, draft,
      count: String(list.length), room: list.length < 3,
      entries: list.map((text, i) => ({ text, label: `Remove ${text}`, remove: () => this.setState({ list: list.filter((_, j) => j !== i) }) })),
      onDraft: (e) => this.setState({ draft: e.target.value }),
      add: () => { const v = draft.trim(); if (v && list.length < 3) this.setState({ list: [...list, v], draft: '' }); },
      disabled: String(!ready),
      btnStyle: ready ? `background: ${t.btn}; color: ${t.btnInk}` : `background: ${t.off}; color: ${t.offInk}`,
      a0: a(0), a1: a(1), a2: a(2), a3: a(3), a4: a(5)
    };
  }
}
</script>
</body>
</html>
