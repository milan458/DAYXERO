<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The wave passed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 340px; flex: none">
    <dc-import name="Hero" scene="sea" clarity="100" h="340" theme="{{theme}}" hint-size="390px,340px"></dc-import>
    <div style="position: absolute; left: 105px; top: 70px"><dc-import name="Jelli" mood="cheer" stage="3" size="180" hint-size="180px,180px"></dc-import></div>
    <div style="position: absolute; left: 0; right: 0; top: 56px; display: flex; justify-content: center"><span style="background: #1E1A3A; color: #FFF8EE; border-radius: 99px; padding: 7px 14px; font-size: 13px; font-weight: 800">+1 ridden out · 15 this week</span></div>
  </div>

  <div style="padding: 0 26px; display: flex; flex-direction: column; gap: 8px; text-align: center">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -1px; line-height: 1.05">The wave passed.</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}">The craving peaked and passed, and you're still here. Each wave you ride out makes the next one a little quieter.</p>
  </div>

  <div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">What set it off? <span style="font-weight: 600; text-transform: none; letter-spacing: 0">· optional</span></div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button aria-pressed="true" style="height: 40px; padding: 0 15px; border-radius: 99px; border: 0; background: {{t.sel}}; color: {{t.selInk}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Coffee</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 15px; border-radius: 99px; border: 0; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Stress</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 15px; border-radius: 99px; border: 0; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">After meals</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 15px; border-radius: 99px; border: 0; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">Boredom</button>
      <button aria-pressed="false" style="height: 40px; padding: 0 15px; border-radius: 99px; border: 0; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">On my phone</button>
    </div>
  </div>

  <div style="margin: 16px 20px 0 20px; background: {{t.raised}}; box-shadow: {{t.shadow}}; border-radius: 22px; padding: 10px 14px; display: flex; align-items: center; gap: 10px">
    <dc-import name="Xero" mood="cheer" stage="3" size="54" hint-size="54px,54px"></dc-import>
    <span style="font-size: 14px; line-height: 1.4"><b>Xero rose a little.</b> The sky is now 56% clear.</span>
  </div>

  <div style="margin-top: auto; padding: 0 20px 28px 20px">
    <a href="C08Today.dc.html" style="height: 58px; border-radius: 99px; background: #FF6B4A; color: #1A0E08; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #C9452B">Back to my day</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    return { theme, t: dark
      ? { bg: '#0E0B2B', surf: '#1B1747', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', sel: '#FFF8EE', selInk: '#0E0B2B', shadow: 'none' }
      : { bg: '#FBF7F1', surf: '#F1EBE2', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', sel: '#1E1A3A', selInk: '#FFF8EE', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
</body>
</html>
