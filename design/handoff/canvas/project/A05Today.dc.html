<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; transition: background 600ms">
  <div style="position: absolute; left: 0; top: 0; {{a0}}"><dc-import name="Hero2" scene="{{scene}}" clarity="{{clarity}}" h="270" edge="{{t.bg}}" animate="{{motionStr}}" hint-size="390px,270px"></dc-import></div>
  <div style="position: absolute; left: 120px; top: 62px; {{showX}}"><dc-import name="Xero" mood="{{charMood}}" stage="{{stage}}" animate="{{motionStr}}" size="150" hint-size="150px,150px"></dc-import></div>
  <div style="position: absolute; left: 120px; top: 62px; {{showG}}"><dc-import name="Glim2" mood="{{charMood}}" stage="{{stage}}" animate="{{motionStr}}" size="150" hint-size="150px,150px"></dc-import></div>
  <div style="position: absolute; left: 22px; top: 54px; background: rgba(255,248,238,0.9); color: #1E1A3A; border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 800; {{a1}}">Day {{dayCount}}</div>

  <div style="position: absolute; left: 0; right: 0; top: 262px; padding: 0 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="{{a2}}">
      <div style="font-size: 14px; font-weight: 700; color: {{t.muted}}">{{owner}} · {{when}}</div>
      <h1 style="margin: 2px 0 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.06; letter-spacing: -0.9px">{{greeting}}</h1>
    </div>

    <a href="{{top.href}}" style="text-decoration: none; color: {{top.ink}}; background: {{top.bg}}; border-radius: 24px; padding: 16px; display: flex; gap: 12px; align-items: center; box-shadow: 0 5px 0 rgba(0,0,0,0.14); {{a3}}">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 12px; font-weight: 800; letter-spacing: 1px; opacity: 0.8">{{top.kicker}}</div>
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.15">{{top.title}}</div>
        <div style="font-size: 13.5px; line-height: 1.4; opacity: 0.85">{{top.body}}</div>
      </div>
      <div style="width: 44px; height: 44px; border-radius: 99px; background: rgba(255,248,238,0.22); display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    </a>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; {{a4}}">
      <div style="background: {{t.card}}; border-radius: 18px; padding: 12px 10px"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">{{nDays}}</div><div style="font-size: 12px; color: {{t.muted}}">days clear</div></div>
      <div style="background: {{t.card}}; border-radius: 18px; padding: 12px 10px"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">{{nUnits}}</div><div style="font-size: 12px; color: {{t.muted}}">{{unitLabel}}</div></div>
      <div style="background: {{t.card}}; border-radius: 18px; padding: 12px 10px"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">£{{nMoney}}</div><div style="font-size: 12px; color: {{t.muted}}">kept</div></div>
    </div>

    <div style="background: {{t.card}}; border-radius: 18px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; line-height: 1.4; {{a5}}">
      <span style="width: 10px; height: 10px; border-radius: 99px; background: #2FD08A; flex: none"></span>
      <span>{{second}}</span>
    </div>
  </div>

  <div style="position: absolute; left: 0; bottom: 0; {{a6}}"><dc-import name="Nav" active="today" theme="{{navTheme}}" hint-size="390px,100px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"time":{"editor":"enum","options":["morning","afternoon","evening","night"],"default":"morning"},"product":{"editor":"enum","options":["cigarettes","vape","pouches"],"default":"cigarettes"},"trigger":{"editor":"enum","options":["coffee","stress","after meals","drinking"],"default":"coffee"},"day":{"editor":"int","min":1,"max":60,"default":12},"name":{"editor":"text","default":"Sam"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); clearInterval(this.iv); }
  play() {
    (this.timers || []).forEach(clearTimeout); clearInterval(this.iv);
    this.timers = [];
    this.setState({ on: false, k: 0 });
    this.timers.push(setTimeout(() => this.setState({ on: true }), 300));
    this.timers.push(setTimeout(() => {
      const t0 = Date.now();
      this.iv = setInterval(() => {
        const p = Math.min(1, (Date.now() - t0) / 800);
        this.setState({ k: 1 - Math.pow(1 - p, 3) });
        if (p >= 1) clearInterval(this.iv);
      }, 30);
    }, 800));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 10000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const k = motion ? (s.k || 0) : 1;
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i, dy) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : (dy ?? 18)}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 700ms ${ease} ${i * 90}ms`;

    const time = this.props.time ?? 'morning';
    const product = this.props.product ?? 'cigarettes';
    const trigger = this.props.trigger ?? 'coffee';
    const day = Math.max(1, Number(this.props.day ?? 12));
    const name = this.props.name ?? 'Sam';

    const pal = {
      morning:   { light: { bg: '#FFC38A', ink: '#1E1A3A', muted: '#5A3420', card: 'rgba(255,248,238,0.6)' }, dark: { bg: '#2B1A10', ink: '#FFF8EE', muted: '#F0C9A8', card: 'rgba(255,255,255,0.07)' }, scene: 'dawn', who: 'Xero', mood: 'hello', when: 'your morning' },
      afternoon: { light: { bg: '#FFD966', ink: '#1E1A3A', muted: '#5A4A10', card: 'rgba(255,248,238,0.6)' }, dark: { bg: '#2E2508', ink: '#FFF8EE', muted: '#EBD89A', card: 'rgba(255,255,255,0.07)' }, scene: 'path', who: 'Xero', mood: 'cheer', when: 'your afternoon' },
      evening:   { light: { bg: '#D9CCFF', ink: '#1E1A3A', muted: '#4A3E7A', card: 'rgba(255,248,238,0.6)' }, dark: { bg: '#1C1640', ink: '#FFF8EE', muted: '#C9BFF2', card: 'rgba(255,255,255,0.07)' }, scene: 'dusk', who: 'Glim', mood: 'hello', when: 'your evening' },
      night:     { light: { bg: '#4A3596', ink: '#FFF8EE', muted: '#D2C8FF', card: 'rgba(255,255,255,0.12)' }, dark: { bg: '#140E3A', ink: '#FFF8EE', muted: '#B8B3D9', card: 'rgba(255,255,255,0.07)' }, scene: 'night', who: 'Glim', mood: 'sleepy', when: 'your night' }
    }[time];
    const t = dark ? pal.dark : pal.light;

    const per = { cigarettes: { n: 12, label: 'cigarettes not smoked', cost: 0.75 }, vape: { n: 180, label: 'puffs not taken', cost: 0.04 }, pouches: { n: 10, label: 'pouches not used', cost: 0.6 } }[product];
    const wave = { coffee: { at: '9:40', what: 'coffee', tip: 'Swap the first sip for 3 slow breaths, then drink.' }, stress: { at: '15:20', what: 'stress', tip: 'When the inbox spikes, step outside for 90 seconds.' }, 'after meals': { at: '13:10', what: 'after-lunch', tip: 'Brush your teeth or chew gum straight after eating.' }, drinking: { at: '21:00', what: 'evening-drink', tip: 'Hold your drink in the other hand tonight.' } }[trigger];

    const greet = { morning: `Morning, ${name}.`, afternoon: `Halfway there, ${name}.`, evening: `Evening, ${name}.`, night: `Still up, ${name}?` }[time];
    const sos = { href: 'A06SOS.dc.html', kicker: `YOUR ${wave.what.toUpperCase()} WAVE`, title: `Usually comes around ${wave.at}`, body: `Jelli's ready. ${wave.tip}`, bg: dark ? '#0B1A4A' : '#3D6BFF', ink: '#FFF8EE' };
    const lesson = { href: '#', kicker: `WEEK ${Math.min(4, Math.ceil(day / 7))} · 3 MIN`, title: day < 7 ? 'Why the first week is the loudest' : 'Cravings are waves, not walls', body: 'Xero saved your place. Pick up where you left off.', bg: dark ? '#0F2A22' : '#1FA971', ink: '#FFF8EE' };
    const check = { href: 'A08CheckIn.dc.html', kicker: 'WITH GLIM · 1 MIN', title: 'How was today, really?', body: 'One question, then rest. Glim keeps the light on.', bg: dark ? '#2A1C6E' : '#2A1C6E', ink: '#FFF8EE' };
    const wind = { href: '#', kicker: 'WIND DOWN · 6 MIN', title: 'Can’t sleep? Float with Glim', body: 'Night cravings pass faster lying still. Try this.', bg: '#0E0B2B', ink: '#FFF8EE' };
    const waveHour = parseInt(wave.at, 10);
    const pick = time === 'morning' ? (waveHour < 12 ? sos : lesson)
      : time === 'afternoon' ? (waveHour >= 12 && waveHour < 18 ? sos : lesson)
      : time === 'evening' ? (waveHour >= 18 ? sos : check) : wind;
    const second = pick === sos ? `Next: ${lesson.title.toLowerCase().replace(/^./, c => c.toUpperCase())}.` : `Heads up: your ${wave.what} wave is usually around ${wave.at}.`;

    const glim = pal.who === 'Glim';
    const fade = (show) => `opacity: ${on && show ? 1 : 0}; transform: translateY(${on && show ? 0 : 40}px) scale(${show ? 1 : 0.9}); transition: opacity 700ms ${ease} 200ms, transform 1100ms ${ease} 200ms`;
    return {
      t, top: pick, second, scene: pal.scene, owner: glim ? 'Glim' : 'Xero', when: pal.when, greeting: greet,
      clarity: String(Math.min(100, Math.round(20 + day * 2.8))),
      stage: String(day < 7 ? 1 : day < 14 ? 2 : day < 28 ? 3 : 4),
      charMood: pal.mood, motionStr: String(motion), dayCount: String(day),
      showX: fade(!glim), showG: fade(glim),
      navTheme: dark || time === 'night' ? 'dark' : 'light',
      nDays: String(Math.round(day * k)), nUnits: Math.round(day * per.n * k).toLocaleString('en-GB'), unitLabel: per.label,
      nMoney: String(Math.round(day * per.n * per.cost * k)),
      a0: `opacity: ${on ? 1 : 0}; transition: opacity 700ms ${ease}`,
      a1: a(3, 8), a2: a(4), a3: a(5), a4: a(6), a5: a(7), a6: a(8, 30)
    };
  }
}
</script>
</body>
</html>
