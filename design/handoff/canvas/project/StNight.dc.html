<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evening check-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 330px; flex: none">
    <dc-import name="Horizon" scene="night" clarity="80" w="390" h="330" hint-size="390px,330px"></dc-import>
    <div style="position: absolute; left: 115px; top: 70px"><dc-import name="GlimX" mood="sleepy" stage="3" size="170" hint-size="170px,170px"></dc-import></div>
    <svg width="390" height="330" viewBox="0 0 390 330" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <defs><filter id="stLiftN" x="-5%" y="-50%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"></feDropShadow></filter></defs>
      <path filter="url(#stLiftN)" d="M0 300 C110 276 280 276 390 300 L390 330 L0 330 Z" fill="{{t.bg}}"></path>
    </svg>
    <div style="position: absolute; left: 22px; top: 58px; color: #FFF8EE; font-size: 14px; font-weight: 700">Friday check-in</div>
  </div>

  <div style="padding: 4px 24px 0 24px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -1px">How did today go?</h1>
  </div>

  <div role="radiogroup" aria-label="Mood" style="padding: 16px 20px 0 20px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
    <button role="radio" aria-checked="false" aria-label="Rough" style="height: 58px; border-radius: 20px; border: 0; background: {{t.surf}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#9FB4FF"></circle><circle cx="10.5" cy="13" r="1.8" fill="#1E1A3A"></circle><circle cx="19.5" cy="13" r="1.8" fill="#1E1A3A"></circle><path d="M9.5 21 q5.5 -5 11 0" fill="none" stroke="#1E1A3A" stroke-width="2" stroke-linecap="round"></path></svg></button>
    <button role="radio" aria-checked="false" aria-label="Low" style="height: 58px; border-radius: 20px; border: 0; background: {{t.surf}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#C9B8FF"></circle><circle cx="10.5" cy="13" r="1.8" fill="#1E1A3A"></circle><circle cx="19.5" cy="13" r="1.8" fill="#1E1A3A"></circle><path d="M10 20.5 q5 -2.5 10 0" fill="none" stroke="#1E1A3A" stroke-width="2" stroke-linecap="round"></path></svg></button>
    <button role="radio" aria-checked="false" aria-label="Okay" style="height: 58px; border-radius: 20px; border: 0; background: {{t.surf}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#8EDFD9"></circle><circle cx="10.5" cy="13" r="1.8" fill="#1E1A3A"></circle><circle cx="19.5" cy="13" r="1.8" fill="#1E1A3A"></circle><path d="M10 20 L20 20" stroke="#1E1A3A" stroke-width="2" stroke-linecap="round"></path></svg></button>
    <button role="radio" aria-checked="true" aria-label="Good" style="height: 58px; border-radius: 20px; border: 0; background: {{t.sel}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#FFD66B"></circle><path d="M8.5 13 q2 -2 4 0 M17.5 13 q2 -2 4 0" fill="none" stroke="#1E1A3A" stroke-width="1.8" stroke-linecap="round"></path><path d="M10 18 q5 5 10 0" fill="none" stroke="#1E1A3A" stroke-width="2" stroke-linecap="round"></path></svg></button>
    <button role="radio" aria-checked="false" aria-label="Great" style="height: 58px; border-radius: 20px; border: 0; background: {{t.surf}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#FF8FB8"></circle><path d="M8.5 13 q2 -2 4 0 M17.5 13 q2 -2 4 0" fill="none" stroke="#1E1A3A" stroke-width="1.8" stroke-linecap="round"></path><path d="M9 17 L21 17 Q15 25 9 17 Z" fill="#1E1A3A"></path></svg></button>
  </div>

  <div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Cravings today</div>
    <div style="background: {{t.surf}}; border-radius: 99px; padding: 6px; display: flex; align-items: center; justify-content: space-between">
      <button aria-label="Fewer" style="width: 46px; height: 46px; border-radius: 99px; border: 0; background: {{t.raised}}; color: {{t.ink}}; font-size: 22px; font-weight: 700; cursor: pointer">−</button>
      <div style="font-size: 16px"><b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px">4</b> logged, <b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px">3</b> ridden out</div>
      <button aria-label="More" style="width: 46px; height: 46px; border-radius: 99px; border: 0; background: {{t.raised}}; color: {{t.ink}}; font-size: 22px; font-weight: 700; cursor: pointer">+</button>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 20px 26px 20px; display: flex; flex-direction: column; gap: 6px; align-items: stretch">
    <button style="height: 58px; border-radius: 99px; border: 0; background: #FF6B4A; color: #1A0E08; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer; box-shadow: 0 6px 0 #C9452B">Save check-in</button>
    <a href="#" style="align-self: center; color: {{t.muted}}; font-weight: 600; font-size: 13px; padding: 10px 4px">Your day ends at 3:00 am · change</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    return { t: dark ? { bg: '#0E0B2B', surf: '#1B1747', raised: '#2A255F', ink: '#FFF8EE', muted: '#B8B3D9', sel: '#FFF8EE' } : { bg: '#FBF7F1', surf: '#F1EBE2', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', sel: '#1E1A3A' } };
  }
}
</script>
</body>
</html>
