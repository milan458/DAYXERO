<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson intro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 330px; flex: none">
    <div style="position: absolute; left: 0; top: 0; {{a0}}"><dc-import name="Hero2" scene="path" clarity="28" h="330" edge="{{t.bg}}" animate="{{motionStr}}" hint-size="390px,330px"></dc-import></div>
    <div style="position: absolute; left: 125px; top: 130px; {{rise}}"><dc-import name="Xero" mood="hello" stage="1" animate="{{motionStr}}" size="140" hint-size="140px,140px"></dc-import></div>
    <a href="F10Program.dc.html" aria-label="Close" style="position: absolute; left: 10px; top: 46px; width: 44px; height: 44px; border-radius: 99px; background: {{t.closeBg}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  </div>

  <div style="padding: 10px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.green}}; {{a1}}">SUN 8 NOV · WEEK 1 · DAY 2</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.08; letter-spacing: -1px; {{a2}}">The noisy passengers</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: {{t.muted}}; {{a3}}">Let them talk. Keep driving.</p>
  </div>

  <div style="margin: 18px 18px 0 18px; background: {{t.raised}}; box-shadow: {{t.shadow}}; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; {{a4}}">
    <div style="display: flex; align-items: center; gap: 12px; font-size: 14px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.green}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"></path><rect x="3" y="14" width="5" height="7" rx="2"></rect><rect x="16" y="14" width="5" height="7" rx="2"></rect></svg><span><b>3 min</b> · Audio, activities and today’s mission</span></div>
  </div>

  <div style="margin-top: auto; padding: 0 22px 22px 22px; {{a5}}">
    <a href="L02Audio.dc.html" style="height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Begin</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  play() {
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
    this.setState({ on: false });
    this.timers.push(setTimeout(() => this.setState({ on: true }), 300));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 10000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const on = !motion || Boolean(this.state && this.state.on);
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 18}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 600ms ${ease} ${i * 90}ms`;
    const t = dark
      ? { bg: '#0E0B2B', ink: '#FFF8EE', muted: '#B8B3D9', raised: '#1B1747', shadow: 'none', green: '#2FD08A', closeBg: 'rgba(255,248,238,0.14)', btn: '#FFF8EE', btnInk: '#0E0B2B' }
      : { bg: '#FBF7F1', ink: '#1E1A3A', muted: '#5E5975', raised: '#FFFFFF', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)', green: '#0F6E43', closeBg: 'rgba(255,248,238,0.85)', btn: '#1E1A3A', btnInk: '#FFF8EE' };
    return {
      t, motionStr: String(motion),
      a0: `opacity: ${on ? 1 : 0}; transition: opacity 600ms ${ease}`,
      rise: `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 48}px); transition: opacity 900ms ${ease}, transform 900ms cubic-bezier(.2,.8,.2,1)`,
      a1: a(4), a2: a(5), a3: a(6), a4: a(7), a5: a(8)
    };
  }
}
</script>
</body>
</html>
