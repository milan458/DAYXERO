<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson mission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 50px 16px 0 10px; display: flex; align-items: center; gap: 10px">
    <a href="F10Program.dc.html" aria-label="Close. Your place is saved." style="width: 44px; height: 44px; border-radius: 99px; background: {{t.surf}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div role="progressbar" aria-label="Session progress" aria-valuemin="1" aria-valuemax="7" aria-valuenow="6" style="flex-grow: 1; height: 8px; border-radius: 99px; background: {{t.surf}}; overflow: hidden"><div style="width: 85.7%; height: 100%; background: {{t.green}}; border-radius: 99px"></div></div>
    <span style="width: 40px; height: 40px; border-radius: 99px; background: #FFC38A; overflow: hidden; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Xero" mood="calm" stage="1" animate="false" size="40" hint-size="40px,40px"></dc-import></span>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 18px">
    <div style="background: {{t.card}}; color: {{t.cardInk}}; border-radius: 24px; padding: 24px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 6px 0 rgba(0,0,0,0.12); {{a0}}">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.cardMuted}}">TODAY’S MISSION</div>
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="20" cy="20" r="16"></circle><circle cx="20" cy="20" r="9"></circle><circle cx="20" cy="20" r="2.5" fill="currentColor"></circle></svg>
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.6px; line-height: 1.2">Name one passenger today when it shows up.</div>
      <div style="font-size: 14px; line-height: 1.45; color: {{t.cardMuted}}">It stays on your Today card until the next session.</div>
    </div>
  </div>

  <div style="padding: 0 22px 22px 22px; {{a1}}">
    <a href="L06Done.dc.html" style="height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Got it</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  play() {
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
    this.setState({ on: false });
    this.timers.push(setTimeout(() => this.setState({ on: true }), 300));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 10000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const on = !motion || Boolean(this.state && this.state.on);
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const t = dark
      ? { bg: '#0E0B2B', ink: '#FFF8EE', surf: '#1B1747', green: '#2FD08A', card: '#FFC38A', cardInk: '#241433', cardMuted: '#4A2A1A', btn: '#FFF8EE', btnInk: '#0E0B2B' }
      : { bg: '#FBF7F1', ink: '#1E1A3A', surf: '#F1EBE2', green: '#0F6E43', card: '#FFC38A', cardInk: '#1E1A3A', cardMuted: '#4A2A1A', btn: '#1E1A3A', btnInk: '#FFF8EE' };
    return {
      t,
      a0: `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 40}px); transition: opacity 900ms ${ease}, transform 900ms cubic-bezier(.2,.8,.2,1)`,
      a1: `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 18}px); transition: opacity 600ms ${ease} 360ms, transform 600ms ${ease} 360ms`
    };
  }
}
</script>
</body>
</html>
