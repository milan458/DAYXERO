<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Building your plan</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #1E1A3A">
  <dc-import name="Horizon" scene="{{scene}}" clarity="30" w="390" h="844" hint-size="390px,844px"></dc-import>
  <div style="position: absolute; left: 0; right: 0; top: 190px; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; color: {{t.onArt}}">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-opacity="0.25" stroke-width="4"></circle><path d="M20 4 A16 16 0 0 1 36 20" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 20 20;360 20 20" dur="1s" repeatCount="indefinite"></animateTransform></path></svg>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.6px; line-height: 1.15; padding: 0 40px">Building your plan<br>around coffee and stress…</div>
  </div>
  <div style="position: absolute; left: 140px; top: 590px"><dc-import name="Xero" mood="hello" stage="1" size="110" hint-size="110px,110px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    return {
      scene: dark ? 'night' : 'path',
      t: dark ? { bg: '#0E0B2B', onArt: '#FFF8EE' } : { bg: '#FBF7F1', onArt: '#1E1A3A' }
    };
  }
}
</script>
</body>
</html>
