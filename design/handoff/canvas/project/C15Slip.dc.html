<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>After a slip</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 270px; flex: none">
    <dc-import name="Hero" scene="sea" clarity="80" h="270" theme="{{theme}}" hint-size="390px,270px"></dc-import>
    <div style="position: absolute; left: 125px; top: 72px"><dc-import name="Jelli" mood="calm" stage="3" size="140" hint-size="140px,140px"></dc-import></div>
    <a href="C08Today.dc.html" aria-label="Close. The slip is saved." style="position: absolute; left: 16px; top: 52px; width: 44px; height: 44px; border-radius: 99px; background: rgba(14,11,43,0.28); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF8EE" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div style="position: absolute; right: 18px; top: 62px; background: rgba(14,11,43,0.28); color: #FFF8EE; border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700">2 of 3</div>
  </div>

  <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -1px; line-height: 1.05">Thanks for telling us</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}">Waves come and go. Nothing resets: your days clear and Xero's sky stay just as they are. Let's make a plan for next time.</p>
  </div>

  <div style="margin: 14px 20px 0 20px; background: {{t.raised}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">What set it off?</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <button aria-pressed="false" style="height: 36px; padding: 0 13px; border-radius: 99px; border: 0; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13.5px; cursor: pointer">Waking up</button>
      <button aria-pressed="true" style="height: 36px; padding: 0 13px; border-radius: 99px; border: 0; background: {{t.sel}}; color: {{t.selInk}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13.5px; cursor: pointer">Coffee</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 13px; border-radius: 99px; border: 0; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13.5px; cursor: pointer">Stress</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 13px; border-radius: 99px; border: 0; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13.5px; cursor: pointer">Drinking</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 13px; border-radius: 99px; border: 0; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13.5px; cursor: pointer">With friends</button>
    </div>
    <div role="radiogroup" aria-label="If it's coffee, then I'll" style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px">
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">If it's <span style="background: #FFD66B; color: #1E1A3A; border-radius: 8px; padding: 0 6px">coffee</span>, then I'll…</div>
      <button role="radio" aria-checked="true" style="height: 42px; border-radius: 14px; border: 0; background: #A8E6C1; color: #1E1A3A; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; text-align: left"><span style="width: 18px; height: 18px; border-radius: 99px; border: 5px solid #1E1A3A; box-sizing: border-box; flex: none"></span>take a short walk</button>
      <button role="radio" aria-checked="false" style="height: 42px; border-radius: 14px; border: 0; background: transparent; color: {{t.ink}}; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer; text-align: left"><span style="width: 18px; height: 18px; border-radius: 99px; border: 2px solid currentColor; box-sizing: border-box; flex: none"></span>switch to tea for a week</button>
      <button role="radio" aria-checked="false" style="height: 42px; border-radius: 14px; border: 0; background: transparent; color: {{t.ink}}; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 14px; cursor: pointer; text-align: left"><span style="width: 18px; height: 18px; border-radius: 99px; border: 2px solid currentColor; box-sizing: border-box; flex: none"></span>open Craving SOS with Jelli</button>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 20px 26px 20px">
    <a href="C08Today.dc.html" style="height: 58px; border-radius: 99px; background: #FF6B4A; color: #1A0E08; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #C9452B">Save my plan</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    return { theme, t: dark
      ? { bg: '#0E0B2B', surf: '#2A255F', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', sel: '#FFF8EE', selInk: '#0E0B2B', shadow: 'none' }
      : { bg: '#FBF7F1', surf: '#F1EBE2', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', sel: '#1E1A3A', selInk: '#FFF8EE', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
</body>
</html>
