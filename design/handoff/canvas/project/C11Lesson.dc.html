<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
textarea::placeholder{color:#8A8399}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 290px; flex: none">
    <dc-import name="Hero" scene="path" clarity="50" h="290" theme="{{theme}}" hint-size="390px,290px"></dc-import>
    <div style="position: absolute; left: 0; right: 0; top: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px">
      <a href="C10Program.dc.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 99px; background: rgba(255,248,238,0.65); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px" aria-label="Part 1 of 4"><span style="height: 6px; border-radius: 99px; background: #1E1A3A"></span><span style="height: 6px; border-radius: 99px; background: rgba(255,248,238,0.6)"></span><span style="height: 6px; border-radius: 99px; background: rgba(255,248,238,0.6)"></span><span style="height: 6px; border-radius: 99px; background: rgba(255,248,238,0.6)"></span></div>
    </div>
    <div style="position: absolute; left: 140px; top: 116px"><dc-import name="Xero" mood="calm" stage="3" size="110" hint-size="110px,110px"></dc-import></div>
  </div>

  <div style="padding: 0 24px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.coral}}">Week 1 · Day 2 · 3 min</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -1px; line-height: 1.05">The noisy passengers</h1>
    <p style="margin: 2px 0 0 0; font-size: 16px; color: {{t.muted}}">Let them talk. Keep driving.</p>
  </div>

  <div style="margin: 14px 20px 0 20px; background: {{t.sel}}; color: {{t.selInk}}; border-radius: 99px; padding: 8px 18px 8px 8px; display: flex; align-items: center; gap: 12px">
    <button aria-label="Pause" style="width: 46px; height: 46px; flex: none; border-radius: 99px; border: 0; background: #FF6B4A; color: #1A0E08; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5"></rect><rect x="14" y="5" width="4" height="14" rx="1.5"></rect></svg></button>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 5px">
      <svg width="250" height="6" viewBox="0 0 250 6" aria-hidden="true" style="display: block"><rect width="250" height="6" rx="3" fill="currentColor" opacity="0.25"></rect><rect width="100" height="6" rx="3" fill="#FF6B4A"><animate attributeName="width" values="100;250" dur="108s" repeatCount="indefinite"></animate></rect></svg>
      <div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 600"><span>1:12</span><span>3:00</span></div>
    </div>
  </div>

  <div style="margin: 12px 20px 0 20px; background: {{t.raised}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
    <label for="passengers" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px; line-height: 1.25">What do your loudest passengers say?</label>
    <textarea id="passengers" rows="2" placeholder="“Just one won't hurt.”" style="resize: none; border: 0; border-radius: 14px; background: {{t.surf}}; padding: 12px 14px; font-family: 'DM Sans', sans-serif; font-size: 15px; color: {{t.ink}}"></textarea>
    <div style="font-size: 13px; color: {{t.muted}}">Next: what you say back, calmly, while you keep driving.</div>
  </div>

  <div style="margin-top: auto; padding: 0 20px 28px 20px">
    <a href="#" style="height: 58px; border-radius: 99px; background: #FF6B4A; color: #1A0E08; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #C9452B">Next</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    return { theme, t: dark
      ? { bg: '#0E0B2B', surf: '#2A255F', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', sel: '#FFF8EE', selInk: '#0E0B2B', coral: '#FF9A7F', shadow: 'none' }
      : { bg: '#FBF7F1', surf: '#F1EBE2', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', sel: '#1E1A3A', selInk: '#FFF8EE', coral: '#B2361C', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
</body>
</html>
