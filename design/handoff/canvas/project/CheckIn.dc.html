      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #D9D2F2">Mood</div>
      <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px" role="radiogroup" aria-label="Mood">
        <button role="radio" aria-checked="false" aria-label="Rough" style="height: 56px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#9FB4FF"></circle><circle cx="10.5" cy="13" r="1.8" fill="#24163A"></circle><circle cx="19.5" cy="13" r="1.8" fill="#24163A"></circle><path d="M9.5 21 q5.5 -5 11 0" fill="none" stroke="#24163A" stroke-width="2" stroke-linecap="round"></path></svg></button>
        <button role="radio" aria-checked="false" aria-label="Low" style="height: 56px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#D9CCFF"></circle><circle cx="10.5" cy="13" r="1.8" fill="#24163A"></circle><circle cx="19.5" cy="13" r="1.8" fill="#24163A"></circle><path d="M10 20.5 q5 -2.5 10 0" fill="none" stroke="#24163A" stroke-width="2" stroke-linecap="round"></path></svg></button>
        <button role="radio" aria-checked="false" aria-label="Okay" style="height: 56px; border-radius: 20px; border: 0; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#8EDFD9"></circle><circle cx="10.5" cy="13" r="1.8" fill="#24163A"></circle><circle cx="19.5" cy="13" r="1.8" fill="#24163A"></circle><path d="M10 20 L20 20" stroke="#24163A" stroke-width="2" stroke-linecap="round"></path></svg></button>
        <button role="radio" aria-checked="true" aria-label="Good" style="height: 56px; border-radius: 20px; border: 0; background: #FFD23F; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 3px #FFF8EE"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#FFF8EE"></circle><path d="M8.5 13 q2 -2 4 0 M17.5 13 q2 -2 4 0" fill="none" stroke="#24163A" stroke-width="1.8" stroke-linecap="round"></path><path d="M10 18 q5 5 10 0" fill="none" stroke="#24163A" stroke-width="2" stroke-linecap="round"></path></svg></button>

      </div>
    </div>

    <div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: #D9D2F2">Cravings today</div>
      <div style="background: rgba(255,255,255,0.12); border-radius: 99px; padding: 6px; display: flex; align-items: center; justify-content: space-between">
        <button aria-label="Fewer" style="width: 46px; height: 46px; border-radius: 99px; border: 0; background: #FFF8EE; color: #24163A; font-size: 22px; font-weight: 700; cursor: pointer">−</button>
        <div style="font-size: 16px"><b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px">4</b> logged, <b style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px">3</b> ridden out</div>
        <button aria-label="More" style="width: 46px; height: 46px; border-radius: 99px; border: 0; background: #FFF8EE; color: #24163A; font-size: 22px; font-weight: 700; cursor: pointer">+</button>
      </div>
    </div>

    <div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">

    <div style="margin-top: auto; padding: 0 20px 30px 20px; display: flex; flex-direction: column; gap: 6px; align-items: center">
