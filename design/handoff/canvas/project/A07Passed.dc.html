<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wave passed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <circle cx="{{b0.x}}" cy="{{b0.y}}" r="{{b0.r}}" fill="none" stroke="{{t.bub}}" stroke-width="2.5"><animate attributeName="cy" values="{{b0.cy}}" dur="{{b0.dur}}" begin="{{b0.begin}}" repeatCount="indefinite"></animate><animate attributeName="opacity" values="{{b0.op}}" dur="{{b0.dur}}" begin="{{b0.begin}}" repeatCount="indefinite"></animate></circle>
    <circle cx="{{b1.x}}" cy="{{b1.y}}" r="{{b1.r}}" fill="none" stroke="{{t.bub}}" stroke-width="2.5"><animate attributeName="cy" values="{{b1.cy}}" dur="{{b1.dur}}" begin="{{b1.begin}}" repeatCount="indefinite"></animate><animate attributeName="opacity" values="{{b1.op}}" dur="{{b1.dur}}" begin="{{b1.begin}}" repeatCount="indefinite"></animate></circle>
    <circle cx="{{b2.x}}" cy="{{b2.y}}" r="{{b2.r}}" fill="none" stroke="{{t.bub}}" stroke-width="2.5"><animate attributeName="cy" values="{{b2.cy}}" dur="{{b2.dur}}" begin="{{b2.begin}}" repeatCount="indefinite"></animate><animate attributeName="opacity" values="{{b2.op}}" dur="{{b2.dur}}" begin="{{b2.begin}}" repeatCount="indefinite"></animate></circle>
    <circle cx="{{b3.x}}" cy="{{b3.y}}" r="{{b3.r}}" fill="none" stroke="{{t.bub}}" stroke-width="2.5"><animate attributeName="cy" values="{{b3.cy}}" dur="{{b3.dur}}" begin="{{b3.begin}}" repeatCount="indefinite"></animate><animate attributeName="opacity" values="{{b3.op}}" dur="{{b3.dur}}" begin="{{b3.begin}}" repeatCount="indefinite"></animate></circle>
    <circle cx="{{b4.x}}" cy="{{b4.y}}" r="{{b4.r}}" fill="none" stroke="{{t.bub}}" stroke-width="2.5"><animate attributeName="cy" values="{{b4.cy}}" dur="{{b4.dur}}" begin="{{b4.begin}}" repeatCount="indefinite"></animate><animate attributeName="opacity" values="{{b4.op}}" dur="{{b4.dur}}" begin="{{b4.begin}}" repeatCount="indefinite"></animate></circle>
    <circle cx="{{b5.x}}" cy="{{b5.y}}" r="{{b5.r}}" fill="none" stroke="{{t.bub}}" stroke-width="2.5"><animate attributeName="cy" values="{{b5.cy}}" dur="{{b5.dur}}" begin="{{b5.begin}}" repeatCount="indefinite"></animate><animate attributeName="opacity" values="{{b5.op}}" dur="{{b5.dur}}" begin="{{b5.begin}}" repeatCount="indefinite"></animate></circle>
    <circle cx="{{b6.x}}" cy="{{b6.y}}" r="{{b6.r}}" fill="none" stroke="{{t.bub}}" stroke-width="2.5"><animate attributeName="cy" values="{{b6.cy}}" dur="{{b6.dur}}" begin="{{b6.begin}}" repeatCount="indefinite"></animate><animate attributeName="opacity" values="{{b6.op}}" dur="{{b6.dur}}" begin="{{b6.begin}}" repeatCount="indefinite"></animate></circle>
    <circle cx="{{b7.x}}" cy="{{b7.y}}" r="{{b7.r}}" fill="none" stroke="{{t.bub}}" stroke-width="2.5"><animate attributeName="cy" values="{{b7.cy}}" dur="{{b7.dur}}" begin="{{b7.begin}}" repeatCount="indefinite"></animate><animate attributeName="opacity" values="{{b7.op}}" dur="{{b7.dur}}" begin="{{b7.begin}}" repeatCount="indefinite"></animate></circle>
  </svg>

  <div style="position: relative; height: 380px; flex: none; display: flex; align-items: flex-end; justify-content: center">
    <div style="{{jIn}}"><dc-import name="Jelli" mood="cheer" stage="3" animate="{{motionStr}}" size="230" hint-size="230px,230px"></dc-import></div>
  </div>

  <div style="position: relative; padding: 10px 28px 0 28px; text-align: center; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 36px; line-height: 1.04; letter-spacing: -1.1px; {{a1}}">You rode it out.</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}; {{a2}}">That {{trig}} wave lasted {{mins}} minutes. Each one you ride makes the next one smaller.</p>
  </div>

  <div style="position: relative; margin: 20px 20px 0 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; {{a3}}">
    <div style="background: {{t.card}}; border-radius: 22px; padding: 14px 16px">
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; display: flex; align-items: baseline; gap: 6px">{{waves}} <span style="font-size: 14px; color: #1FA971; font-family: 'DM Sans', sans-serif; font-weight: 800; {{plus}}">+1</span></div>
      <div style="font-size: 13px; color: {{t.muted}}">waves ridden</div>
    </div>
    <div style="background: {{t.card}}; border-radius: 22px; padding: 14px 16px">
      <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px">{{sky}}%</div>
      <div style="font-size: 13px; color: {{t.muted}}">sky clear</div>
      <div style="height: 6px; margin-top: 8px; border-radius: 99px; background: {{t.track}}"><div style="height: 6px; border-radius: 99px; background: #1FA971; width: {{sky}}%; transition: width 300ms"></div></div>
    </div>
  </div>

  <div style="position: relative; margin: 10px 20px 0 20px; background: {{t.card}}; border-radius: 18px; padding: 12px 14px; font-size: 14px; line-height: 1.4; display: flex; gap: 10px; align-items: center; {{a4}}">
    <span style="width: 34px; height: 34px; border-radius: 99px; background: #FFC38A; overflow: hidden; flex: none; display: flex; align-items: center; justify-content: center"><dc-import name="Xero" mood="cheer" stage="2" animate="false" size="34" hint-size="34px,34px"></dc-import></span>
    <span>Back to Xero. I rose a little while you were out.</span>
  </div>

  <div style="margin-top: auto; padding: 0 22px 28px 22px; position: relative; {{a5}}">
    <a href="A05Today.dc.html" style="height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2)">Back to my day</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"trigger":{"editor":"enum","options":["coffee","stress","after meals","drinking"],"default":"coffee"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  play() {
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
    this.setState({ on: false, bump: false });
    this.timers.push(setTimeout(() => this.setState({ on: true }), 300));
    this.timers.push(setTimeout(() => this.setState({ bump: true }), 1600));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 10000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const bump = !motion || Boolean(s.bump);
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i, dy) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : (dy ?? 18)}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 700ms ${ease} ${i * 90}ms`;
    const t = dark
      ? { bg: '#0F2550', ink: '#FFF8EE', muted: '#B9D6FF', card: 'rgba(255,255,255,0.08)', track: 'rgba(255,255,255,0.12)', bub: 'rgba(156,203,255,0.45)', btn: '#FFF8EE', btnInk: '#0F2550' }
      : { bg: '#9CCBFF', ink: '#1E1A3A', muted: '#24406E', card: 'rgba(255,248,238,0.7)', track: 'rgba(30,26,58,0.12)', bub: 'rgba(255,248,238,0.8)', btn: '#1E1A3A', btnInk: '#FFF8EE' };
    const trig = this.props.trigger ?? 'coffee';
    const xs = [40, 92, 150, 210, 262, 318, 350, 120];
    const bubbles = xs.map((x, i) => ({
      x: String(x), y: '900', r: String(4 + (i % 3) * 3),
      cy: motion ? '900;-20' : String(200 + i * 70) + ';' + String(200 + i * 70),
      op: motion ? '0;0.9;0' : '0.6;0.6',
      dur: (5 + (i % 4)) + 's', begin: (i * 0.6).toFixed(1) + 's'
    }));
    return {
      t, ...Object.fromEntries(bubbles.map((b, i) => ['b' + i, b])), motionStr: String(motion),
      trig: trig === 'after meals' ? 'after-lunch' : trig,
      mins: '3',
      waves: bump ? '15' : '14', sky: bump ? '56' : '55',
      plus: `display: inline-block; opacity: ${bump ? 1 : 0}; transform: translateY(${bump ? 0 : 8}px) scale(${bump ? 1 : 0.5}); transition: opacity 300ms, transform 500ms cubic-bezier(.3,1.6,.5,1)`,
      jIn: `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 80}px) scale(${on ? 1 : 0.8}); transition: opacity 700ms ${ease}, transform 1000ms cubic-bezier(.3,1.4,.5,1)`,
      a1: a(4), a2: a(5), a3: a(6), a4: a(10), a5: a(11)
    };
  }
}
</script>
</body>
</html>
