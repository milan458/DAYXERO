    <p style="margin: 0; font-size: 16px; line-height: 1.5; max-width: 300px">Hi, I'm Xero. Let's build your quit plan together. What do you use?</p>

      <span style="height: 44px; padding: 0 8px 0 18px; border-radius: 99px; background: {{t.sel}}; color: {{t.selInk}}; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px">Cigarettes <span style="width: 26px; height: 26px; border-radius: 99px; background: #2FD08A; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0E0B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></span>

    </div>
    <p style="margin: 4px 0 0 0; font-size: 16px; line-height: 1.5; max-width: 310px">Using both is common. We'll plan for each, so neither sneaks back in.</p>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; max-width: 310px; font-weight: 700">When do cravings usually hit? Pick up to three.</p>
  </div>

  <div style="margin-top: auto; padding: 0 22px 14px 22px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px" role="group" aria-label="Craving triggers">
    <button aria-pressed="true" style="height: 46px; padding: 0 8px 0 18px; border: 0; border-radius: 99px; background: {{t.sel}}; color: {{t.selInk}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; cursor: pointer">With coffee <span style="width: 26px; height: 26px; border-radius: 99px; background: #2FD08A; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0E0B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button>
    <button aria-pressed="true" style="height: 46px; padding: 0 8px 0 18px; border: 0; border-radius: 99px; background: {{t.sel}}; color: {{t.selInk}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; cursor: pointer">When I'm stressed <span style="width: 26px; height: 26px; border-radius: 99px; background: #2FD08A; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0E0B2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></button>
    <button aria-pressed="false" style="height: 46px; padding: 0 12px 0 18px; border: 0; border-radius: 99px; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; cursor: pointer">After meals <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#FFC93C"></circle><circle cx="12" cy="12" r="4.5" fill="#FF8A4F"></circle></svg></button>
    <button aria-pressed="false" style="height: 46px; padding: 0 12px 0 18px; border: 0; border-radius: 99px; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; cursor: pointer">Drinking <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l-2 9a4 4 0 0 1-8 0Z" fill="#FF8FB8"></path><rect x="11" y="15" width="2" height="5" fill="#8F6BFF"></rect><rect x="8" y="19" width="8" height="2.5" rx="1.2" fill="#8F6BFF"></rect></svg></button>
    <button aria-pressed="false" style="height: 46px; padding: 0 12px 0 18px; border: 0; border-radius: 99px; background: {{t.surf}}; color: {{t.ink}}; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; cursor: pointer">Something else <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 Q13 11 22 12 Q13 13 12 22 Q11 13 2 12 Q11 11 12 2 Z" fill="#3D8BFF"></path></svg></button>

<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>

  renderVals() {

      ? { bg: '#0E0B2B', surf: '#1B1747', raised: '#2A255F', ink: '#FFF8EE', muted: '#B8B3D9', sel: '#FFF8EE', selInk: '#0E0B2B', link: '#FF9A7F' }

}
