<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morning pledge</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 380px; flex: none">
    <dc-import name="Hero" scene="dawn" clarity="55" h="380" theme="{{theme}}" hint-size="390px,380px"></dc-import>
    <div style="position: absolute; left: 95px; top: 110px"><dc-import name="Xero" mood="hello" stage="3" size="200" hint-size="200px,200px"></dc-import></div>
    <div style="position: absolute; left: 22px; top: 62px; color: #1E1A3A; font-size: 14px; font-weight: 700">Day 3 · Friday</div>
    <a href="C08Today.dc.html" aria-label="Close" style="position: absolute; right: 16px; top: 52px; width: 44px; height: 44px; border-radius: 99px; background: rgba(255,248,238,0.6); display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1E1A3A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  </div>

  <div style="padding: 0 26px; text-align: center">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -1px; line-height: 1.08">Today, I won't use nicotine.</h1>
  </div>

  <div style="margin: 18px 20px 0 20px; background: {{t.raised}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 14px 16px; display: flex; gap: 12px; align-items: center">
    <span style="width: 42px; height: 42px; flex: none; border-radius: 14px; background: #FF8FB8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#1E1A3A" aria-hidden="true"><path d="M12 21c-6-3.6-9-7-9-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 4-3 7.4-9 11Z"></path></svg></span>
    <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.muted}}">Because</span><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 18px">To keep up with Maya at the park.</span></span>
  </div>

  <div style="margin-top: auto; padding: 0 20px 34px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px">
    <button aria-label="Pledge" style="position: relative; width: 108px; height: 108px; border-radius: 99px; border: 0; background: transparent; padding: 0; cursor: pointer">
      <svg width="108" height="108" viewBox="0 0 108 108" aria-hidden="true">
        <circle cx="54" cy="54" r="50" fill="none" stroke="{{t.surf}}" stroke-width="6"></circle>
        <circle cx="54" cy="54" r="50" fill="none" stroke="#FF6B4A" stroke-width="6" stroke-linecap="round" stroke-dasharray="0 315" transform="rotate(-90 54 54)"><animate attributeName="stroke-dasharray" values="0 315;315 0;315 0;0 315" keyTimes="0;0.5;0.8;1" dur="3s" repeatCount="indefinite"></animate></circle>
        <circle cx="54" cy="54" r="40" fill="#1E1A3A"></circle>
        <path d="M54 72c-10-6-16-11.5-16-18.5a8.5 8.5 0 0 1 16-4 8.5 8.5 0 0 1 16 4C70 60.5 64 66 54 72Z" fill="#FF6B4A"></path>
      </svg>
    </button>
    <div style="font-size: 14px; font-weight: 600">Press and hold to pledge</div>
    <div style="font-size: 13px; color: {{t.muted}}">Glim will check in with you tonight. No pressure.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    return { theme, t: dark
      ? { bg: '#0E0B2B', surf: '#2A255F', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', shadow: 'none' }
      : { bg: '#FBF7F1', surf: '#E9E1D6', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
</body>
</html>
