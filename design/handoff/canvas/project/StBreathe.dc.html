<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathe with Glim</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif">
  <a href="StWelcome.dc.html" style="position: absolute; right: 22px; top: 58px; color: {{t.muted}}; font-weight: 600; font-size: 15px; text-decoration: none; padding: 10px 4px">Skip</a>
  <div style="position: absolute; left: 0; right: 0; top: 140px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -1.2px">Breathe in</div>
    <div style="font-size: 16px; color: {{t.muted}}; padding: 0 40px; line-height: 1.5">Watch Glim's light swell. Let it fade as you breathe out.</div>
  </div>
  <div style="position: absolute; left: -35px; top: 330px"><dc-import name="GlimX" mood="breathe" stage="2" size="460" hint-size="460px,460px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    return { t: dark ? { bg: '#0E0B2B', ink: '#FFF8EE', muted: '#B8B3D9' } : { bg: '#FBF7F1', ink: '#1E1A3A', muted: '#5E5975' } };
  }
}
</script>
</body>
</html>
