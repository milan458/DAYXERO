<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your Quit Day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#24163A}a:hover{color:#000}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{bg}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; color: #24163A">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <circle cx="410" cy="260" r="130" fill="#FFFFFF" opacity="0.16"></circle>
    <path d="M-40 730 C70 690 170 760 270 730 C340 710 390 696 440 700 L440 900 L-40 900 Z" fill="#FFFFFF" opacity="0.14"></path>
  </svg>
  <div style="position: relative; height: 100%; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 14px; padding: 54px 20px 0 16px">
      <button aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 99px; border: 0; background: rgba(36,22,58,0.1); display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#24163A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <div style="flex: 1; height: 8px; border-radius: 99px; background: rgba(36,22,58,0.14)" aria-label="Setup progress, step 8 of 10"><div style="width: 80%; height: 8px; border-radius: 99px; background: #24163A"></div></div>
      <div style="font-size: 13px; font-weight: 700">8/10</div>
    </div>

    <svg width="390" height="204" viewBox="0 -22 390 218" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="display: block; margin-top: 2px">
      <circle cx="96" cy="64" r="30" fill="#FFC93C"></circle>
      <circle cx="89" cy="57" r="10" fill="#FFDB73"></circle>
      <circle cx="96" cy="64" r="44" fill="none" stroke="#FFC93C" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"></circle>
      <path d="M270 40 C270 30 282 26 288 32 C292 22 308 22 310 34 C318 34 320 44 312 46 L272 46 C266 46 266 40 270 40 Z" fill="#FFFFFF"></path>
      <path d="M-10 196 L-10 170 C60 150 120 100 196 100 C270 100 330 150 400 166 L400 196 Z" fill="#2E8B6A"></path>
      <path d="M-10 196 L-10 184 C80 170 150 176 220 182 C300 188 350 178 400 176 L400 196 Z" fill="#23735A"></path>
      <path d="M150 112 C154 102 160 102 162 112 M250 116 C254 106 260 106 262 116" fill="none" stroke="#59C98F" stroke-width="3" stroke-linecap="round"></path>
      <path d="M226 100 L226 18" stroke="#24163A" stroke-width="4" stroke-linecap="round"></path>
      <path d="M226 20 C246 14 256 30 280 22 L280 54 C256 62 246 46 226 52 Z" fill="#FF7155"></path>
      <text x="252" y="43" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-size="15" font-weight="800" fill="#FFF8EE">DX</text>
      <path d="M192 64 C190 80 188 92 186 100" fill="none" stroke="#2B2D6E" stroke-width="13" stroke-linecap="round"></path>
      <path d="M206 64 C208 80 210 92 212 100" fill="none" stroke="#2B2D6E" stroke-width="13" stroke-linecap="round"></path>
      <path d="M176 102 C178 96 188 96 192 102 Z" fill="#24163A"></path>
      <path d="M206 102 C208 96 218 96 222 102 Z" fill="#24163A"></path>
      <path d="M186 22 C194 16 210 16 216 22 L214 68 C204 72 194 72 186 68 Z" fill="#FFC93C"></path>
      <path d="M204 18 C212 20 216 36 214 68 C210 70 206 70 202 70 C204 50 204 32 204 18 Z" fill="#F2B21E"></path>
      <path d="M212 30 C220 34 224 38 226 44" fill="none" stroke="#FFC93C" stroke-width="10" stroke-linecap="round"></path>
      <path d="M190 30 C176 26 170 16 168 6" fill="none" stroke="#FFC93C" stroke-width="10" stroke-linecap="round"></path>
      <circle cx="226" cy="46" r="6" fill="#5C3A2A"></circle>
      <circle cx="168" cy="2" r="6" fill="#5C3A2A"></circle>
      <circle cx="200" cy="0" r="14" fill="#5C3A2A"></circle>
      <path d="M150 170 l7 0 M153.5 166.5 l0 7" stroke="#FFF8EE" stroke-width="2.5" stroke-linecap="round"></path>
      <path d="M40 120 C36 104 40 94 48 86" fill="none" stroke="#23735A" stroke-width="3" stroke-linecap="round"></path>
      <path d="M48 86 C60 80 68 88 64 98 C54 100 48 94 48 86 Z" fill="#3FB37F"></path>
      <path d="M340 140 C340 124 344 114 350 106" fill="none" stroke="#23735A" stroke-width="3" stroke-linecap="round"></path>
      <circle cx="350" cy="102" r="8" fill="#FFF8EE"></circle><circle cx="350" cy="102" r="3.5" fill="#FF7155"></circle>
    </svg>

    <div style="padding: 10px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; line-height: 1.05; letter-spacing: -1px">Choose your <span style="position: relative; display: inline-block">Quit Day<svg viewBox="0 0 200 16" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: -2px; bottom: -8px; width: calc(100% + 4px); height: 12px"><path d="M3 10 C40 4 90 5 122 7 C152 9 178 11 197 4" fill="none" stroke="#FF7155" stroke-width="5" stroke-linecap="round"></path></svg></span></h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.45; color: #22423A">Recommended: <b>Fri 6 Nov</b>. It gives you the full 7-day prep window.</p>
    </div>

    <div style="margin: 14px 20px 0 20px; background: #FFF8EE; border-radius: 28px; padding: 16px 14px 14px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 6px 10px">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 18px">Oct – Nov 2026</div>
        <div style="display: flex; gap: 12px; font-size: 12px; font-weight: 600; color: #3A2547">
          <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 99px; background: #A8E6C1"></span>Prep</span>
          <span style="display: flex; align-items: center; gap: 5px"><span style="width: 10px; height: 10px; border-radius: 99px; background: #FF7155"></span>Quit Day</span>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 6px; text-align: center; font-size: 15px; font-weight: 600">
        <div style="font-size: 11px; font-weight: 700; color: #6A5A73; padding-bottom: 4px">S</div><div style="font-size: 11px; font-weight: 700; color: #6A5A73; padding-bottom: 4px">M</div><div style="font-size: 11px; font-weight: 700; color: #6A5A73; padding-bottom: 4px">T</div><div style="font-size: 11px; font-weight: 700; color: #6A5A73; padding-bottom: 4px">W</div><div style="font-size: 11px; font-weight: 700; color: #6A5A73; padding-bottom: 4px">T</div><div style="font-size: 11px; font-weight: 700; color: #6A5A73; padding-bottom: 4px">F</div><div style="font-size: 11px; font-weight: 700; color: #6A5A73; padding-bottom: 4px">S</div>
        <div style="height: 40px; line-height: 40px; color: #8A7C90">25</div><div style="height: 40px; line-height: 40px; color: #8A7C90">26</div><div style="height: 40px; line-height: 40px; color: #8A7C90">27</div><div style="height: 40px; line-height: 40px; color: #8A7C90">28</div><div style="height: 40px; line-height: 40px; color: #8A7C90">29</div>
        <div style="height: 40px; line-height: 40px; background: #A8E6C1; border-radius: 99px 0 0 99px; font-weight: 800">30</div><div style="height: 40px; line-height: 40px; background: #A8E6C1; border-radius: 0 99px 99px 0">31</div>
        <div style="height: 40px; line-height: 40px; background: #A8E6C1; border-radius: 99px 0 0 99px">1</div><div style="height: 40px; line-height: 40px; background: #A8E6C1">2</div><div style="height: 40px; line-height: 40px; background: #A8E6C1">3</div><div style="height: 40px; line-height: 40px; background: #A8E6C1">4</div><div style="height: 40px; line-height: 40px; background: #A8E6C1; border-radius: 0 99px 99px 0">5</div>
        <div style="display: flex; justify-content: center"><button aria-label="Friday 6 November, Quit Day" style="width: 40px; height: 40px; border-radius: 99px; border: 0; background: #FF7155; color: #24163A; font-family: 'DM Sans', sans-serif; font-weight: 800; font-size: 15px; box-shadow: 0 0 0 3px #FFF8EE, 0 0 0 5px #24163A; cursor: pointer">6</button></div>
        <div style="height: 40px; line-height: 40px">7</div>
        <div style="height: 40px; line-height: 40px">8</div><div style="height: 40px; line-height: 40px">9</div><div style="height: 40px; line-height: 40px">10</div><div style="height: 40px; line-height: 40px">11</div><div style="height: 40px; line-height: 40px">12</div><div style="height: 40px; line-height: 40px">13</div><div style="height: 40px; line-height: 40px">14</div>
      </div>
    </div>

    <div style="margin-top: auto; padding: 0 20px 34px 20px; display: flex; flex-direction: column; gap: 10px; align-items: center">
      <button style="position: relative; overflow: hidden; width: 100%; height: 62px; border-radius: 99px; border: 0; background: #24163A; color: #FFF8EE; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">
        <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 38%; background: #FF7155; opacity: 0.9"></span>
        <span style="position: relative">Hold to set Fri 6 Nov</span>
      </button>
      <div style="font-size: 13px; color: #22423A">Hold for 1.5 seconds. You can change the date later.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","default":"#7FD6B2","options":["#7FD6B2","#BFD7FF","#FFD23F","#D9CCFF"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { bg: this.props.bg ?? '#7FD6B2' };
  }
}
</script>
</body>
</html>
