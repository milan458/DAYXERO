<!doctype html>
<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="margin: 76px auto 0 auto; display: flex; gap: 12px">
    <div style="position: relative; width: 132px; height: 132px; border-radius: 34px; overflow: hidden; box-shadow: 0 14px 30px rgba(30,26,58,0.2); transform: rotate(-5deg)"><dc-import name="Horizon" scene="dawn" w="132" h="132" hint-size="132px,132px"></dc-import><div style="position: absolute; left: 21px; top: 14px"><dc-import name="Xero" mood="hello" stage="2" size="90" hint-size="90px,90px"></dc-import></div></div>
    <div style="position: relative; width: 132px; height: 132px; border-radius: 34px; overflow: hidden; box-shadow: 0 14px 30px rgba(30,26,58,0.2); transform: rotate(5deg); margin-top: 18px"><dc-import name="Horizon" scene="night" w="132" h="132" hint-size="132px,132px"></dc-import><div style="position: absolute; left: 21px; top: 16px"><dc-import name="Glim2" mood="hello" stage="2" size="90" hint-size="90px,90px"></dc-import></div></div>
  </div>

  <div style="padding: 30px 26px 0 26px; display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -1px; line-height: 1.06">Let's make it stick</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}">Xero says good morning, Glim checks in at night. That's it. No guilt, ever, and quiet hours by default.</p>
  </div>

  <div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="background: {{t.raised}}; box-shadow: {{t.shadow}}; border-radius: 22px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #FFE3C4; overflow: hidden; display: flex; align-items: center; justify-content: center"><dc-import name="Xero" mood="hello" stage="2" animate="false" size="40" hint-size="40px,40px"></dc-import></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="display: flex; justify-content: space-between; font-size: 14px"><b>Good morning</b><span style="font-size: 12px; color: {{t.muted}}">8:00</span></span><span style="font-size: 14px; color: {{t.muted}}">Ten seconds for today's pledge?</span></span>
    </div>
    <div style="background: {{t.raised}}; box-shadow: {{t.shadow}}; border-radius: 22px; padding: 12px 14px; display: flex; gap: 12px; align-items: center">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: #2A1C6E; overflow: hidden; display: flex; align-items: center; justify-content: center"><dc-import name="Glim2" mood="hello" stage="2" animate="false" size="40" hint-size="40px,40px"></dc-import></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="display: flex; justify-content: space-between; font-size: 14px"><b>How did today go?</b><span style="font-size: 12px; color: {{t.muted}}">21:30</span></span><span style="font-size: 14px; color: {{t.muted}}">A one-minute check-in, if you have it.</span></span>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 20px 28px 20px; display: flex; flex-direction: column; gap: 12px">
    <a href="C08Today.dc.html" style="height: 58px; border-radius: 99px; background: #FF6B4A; color: #1A0E08; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #C9452B">Yes, remind me</a>
    <a href="C08Today.dc.html" style="height: 54px; border-radius: 99px; border: 2px solid {{t.line}}; color: {{t.ink}}; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Not right now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    return { t: dark
      ? { bg: '#0E0B2B', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', line: 'rgba(255,248,238,0.28)', shadow: 'none' }
      : { bg: '#FBF7F1', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', line: 'rgba(30,26,58,0.22)', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
</body>
