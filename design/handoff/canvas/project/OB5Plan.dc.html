<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan and trial</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 360px; flex: none">
    <dc-import name="Horizon" scene="dawn" clarity="70" w="390" h="360" hint-size="390px,360px"></dc-import>
    <div style="position: absolute; left: 100px; top: 98px"><dc-import name="Xero" mood="cheer" stage="3" size="190" hint-size="190px,190px"></dc-import></div>
    <svg width="390" height="360" viewBox="0 0 390 360" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <defs><filter id="obLift5" x="-5%" y="-50%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#1A0B2E" flood-opacity="0.25"></feDropShadow></filter></defs>
      <path filter="url(#obLift5)" d="M0 330 C110 306 280 306 390 330 L390 360 L0 360 Z" fill="{{t.bg}}"></path>
    </svg>
    <button aria-label="Close and continue with the free version" style="position: absolute; right: 16px; top: 54px; width: 44px; height: 44px; border-radius: 99px; border: 0; background: rgba(30,26,58,0.18); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF8EE" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </button>
  </div>

  <div style="padding: 6px 26px 0 26px; display: flex; flex-direction: column; gap: 8px; text-align: center">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -1px; line-height: 1.08">Sam, your plan is ready</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}">Prep week, Day Xero and four weeks after, built around coffee and stress.</p>
  </div>

  <div role="radiogroup" aria-label="Plan" style="margin: 22px 20px 0 20px; position: relative">
    <button role="radio" aria-checked="true" style="width: 100%; border: 2px solid {{t.ink}}; border-radius: 24px; background: {{t.raised}}; color: {{t.ink}}; padding: 18px 18px; display: flex; align-items: center; gap: 14px; text-align: left; font-family: 'DM Sans', sans-serif; cursor: pointer">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-weight: 700; font-size: 16px">3 days free, then $39.99 a year</span><span style="font-size: 14px; color: {{t.muted}}">That's $3.33 a month</span></span>
      <span style="width: 26px; height: 26px; border-radius: 99px; border: 8px solid #FF6B4A; box-sizing: border-box; flex: none"></span>
    </button>
    <span style="position: absolute; left: 18px; top: -11px; background: #FFC93C; color: #1E1A3A; border-radius: 99px; padding: 3px 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.4px">BEST VALUE</span>
  </div>
  <a href="#" style="align-self: center; margin-top: 8px; color: {{t.ink}}; font-weight: 600; font-size: 14px; padding: 8px">See all plans</a>

  <div style="margin-top: auto; padding: 0 20px 22px 20px; display: flex; flex-direction: column; gap: 8px; align-items: stretch">
    <a href="OB6Notify.dc.html" style="height: 58px; border-radius: 99px; background: #FF6B4A; color: #1A0E08; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #C9452B">Start my free trial</a>
    <div style="font-size: 13px; line-height: 1.4; text-align: center; color: {{t.muted}}">Free until Mon 2 Nov. We'll remind you 2 days before. Cancel anytime in Settings.</div>
    <a href="#" style="align-self: center; color: {{t.muted}}; font-weight: 600; font-size: 13px; padding: 8px">Restore purchases</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { bg: '#0E0B2B', surf: '#1B1747', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9' }
      : { bg: '#FBF7F1', surf: '#F1EBE2', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975' };
    return { t };
  }
}
</script>
</body>
</html>
