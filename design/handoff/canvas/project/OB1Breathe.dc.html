<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Breathe intro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <circle cx="195" cy="720" r="330" fill="#FF6B4A" opacity="0.08"><animate attributeName="r" values="300;350;300" keyTimes="0;0.4;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="10s" repeatCount="indefinite"></animate></circle>
    <circle cx="195" cy="720" r="260" fill="#FF6B4A" opacity="0.1"><animate attributeName="r" values="240;280;240" keyTimes="0;0.4;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="10s" repeatCount="indefinite"></animate></circle>
  </svg>
  <a href="OB2Welcome.dc.html" style="position: absolute; right: 22px; top: 58px; color: {{t.muted}}; font-weight: 600; font-size: 15px; text-decoration: none; padding: 10px 4px">Skip</a>
  <div style="position: absolute; left: 0; right: 0; top: 150px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center">
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -1.2px">Breathe in</div>
    <div style="font-size: 16px; color: {{t.muted}}">One slow breath before we start.</div>
  </div>
  <div style="position: absolute; left: -85px; top: 400px"><dc-import name="Xero" mood="breathe" stage="2" size="560" hint-size="560px,560px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { bg: '#0E0B2B', surf: '#1B1747', raised: '#2A255F', ink: '#FFF8EE', muted: '#B8B3D9', line: 'rgba(255,255,255,0.12)', sel: '#FFF8EE', selInk: '#0E0B2B' }
      : { bg: '#FBF7F1', surf: '#F1EBE2', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', line: 'rgba(30,26,58,0.10)', sel: '#1E1A3A', selInk: '#FFF8EE' };
    return { t };
  }
}
</script>
</body>
</html>
