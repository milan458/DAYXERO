<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lesson quick check</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 50px 16px 0 10px; display: flex; align-items: center; gap: 10px">
    <a href="F10Program.dc.html" aria-label="Close. Your place is saved." style="width: 44px; height: 44px; border-radius: 99px; background: {{t.surf}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div role="progressbar" aria-label="Session progress" aria-valuemin="1" aria-valuemax="7" aria-valuenow="5" style="flex-grow: 1; height: 8px; border-radius: 99px; background: {{t.surf}}; overflow: hidden"><div style="width: 71.4%; height: 100%; background: {{t.green}}; border-radius: 99px"></div></div>
    <span style="width: 40px; height: 40px; border-radius: 99px; background: #FFC38A; overflow: hidden; display: flex; align-items: center; justify-content: center; flex: none"><dc-import name="Xero" mood="calm" stage="1" animate="false" size="40" hint-size="40px,40px"></dc-import></span>
  </div>

  <div style="padding: 22px 24px 0 24px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.green}}; {{a0}}">QUICK CHECK</div>
    <h1 id="q" style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.6px; line-height: 1.2; {{a1}}">A loud craving thought shows up. The bus approach is to…</h1>
  </div>

  <div role="radiogroup" aria-labelledby="q" style="padding: 16px 18px 0 18px; display: flex; flex-direction: column; gap: 8px; {{a2}}">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
      <button role="radio" aria-checked="{{o.checked}}" aria-disabled="{{o.locked}}" onClick="{{o.pick}}" style="text-align: left; font: inherit; border: 0; cursor: pointer; border-radius: 18px; padding: 14px 16px; min-height: 58px; display: flex; flex-direction: column; gap: 4px; {{o.style}}">
        <span style="font-size: 16px; line-height: 1.4; font-weight: 600">{{o.text}}</span>
        <sc-if value="{{o.hasTag}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; {{o.tagStyle}}">{{o.tag}}</span></sc-if>
      </button>
    </sc-for>
  </div>

  <sc-if value="{{answered}}" hint-placeholder-val="{{true}}">
    <div aria-live="polite" style="margin: 14px 18px 0 18px; background: {{t.feedBg}}; color: {{t.feedInk}}; border-radius: 18px; padding: 14px 16px; font-size: 16px; line-height: 1.45; font-weight: 600">Right. It can shout. It can't steer.</div>
  </sc-if>

  <div style="margin-top: auto; padding: 0 22px 16px 22px; display: flex; flex-direction: column; gap: 2px; {{a4}}">
    <a href="L05Mission.dc.html" aria-disabled="{{disabled}}" style="height: 58px; border-radius: 99px; text-decoration: none; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; {{btnStyle}}">Continue</a>
    <a href="L05Mission.dc.html" style="align-self: center; height: 44px; display: flex; align-items: center; padding: 0 12px; color: {{t.ink}}; font-weight: 600; font-size: 14px">Skip</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"answered":{"editor":"enum","options":["not yet","right","wrong"],"default":"right"},"motion":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.timer = setTimeout(() => this.setState({ on: true }), 300); }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const start = { 'not yet': null, right: 'b', wrong: 'a' }[this.props.answered ?? 'right'];
    const picked = s.picked !== undefined ? s.picked : start;
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 18}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 600ms ${ease} ${i * 90}ms`;
    const t = dark
      ? { bg: '#0E0B2B', ink: '#FFF8EE', muted: '#B8B3D9', surf: '#1B1747', raised: '#1B1747', hair: 'rgba(255,255,255,0.12)', green: '#2FD08A', rightBg: '#0F2A22', feedBg: '#2A255F', feedInk: '#FFF8EE', btn: '#FFF8EE', btnInk: '#0E0B2B', off: '#1B1747', offInk: '#B8B3D9' }
      : { bg: '#FBF7F1', ink: '#1E1A3A', muted: '#5E5975', surf: '#F1EBE2', raised: '#FFFFFF', hair: 'rgba(30,26,58,0.1)', green: '#0F6E43', rightBg: '#E3F4EA', feedBg: '#1E1A3A', feedInk: '#FFF8EE', btn: '#1E1A3A', btnInk: '#FFF8EE', off: '#F1EBE2', offInk: '#5E5975' };
    const raw = [['a', 'Argue with it until it stops'], ['b', 'Let it talk, and keep driving'], ['c', 'Pull over and give it what it wants']];
    const correct = 'b';
    const options = raw.map(([id, text]) => {
      const isRight = id === correct, isPick = id === picked;
      let style = `background: ${t.raised}; color: ${t.ink}; box-shadow: inset 0 0 0 1px ${t.hair}`;
      let tag = '';
      if (picked) {
        if (isRight) { style = `background: ${t.rightBg}; color: ${t.ink}; box-shadow: inset 0 0 0 2px ${t.green}`; tag = isPick ? 'YOUR PICK · CORRECT ANSWER' : 'CORRECT ANSWER'; }
        else if (isPick) { style = `background: ${t.raised}; color: ${t.ink}; box-shadow: inset 0 0 0 2px ${t.muted}`; tag = 'YOUR PICK'; }
        else { style = `background: transparent; color: ${t.muted}; box-shadow: inset 0 0 0 1px ${t.hair}`; }
      }
      return { text, tag, hasTag: Boolean(tag), checked: String(isPick), locked: String(Boolean(picked)), style,
        tagStyle: `color: ${isRight ? t.green : t.muted}`,
        pick: () => { if (!picked) this.setState({ picked: id }); } };
    });
    return {
      t, options, answered: Boolean(picked),
      disabled: String(!picked),
      btnStyle: picked ? `background: ${t.btn}; color: ${t.btnInk}` : `background: ${t.off}; color: ${t.offInk}`,
      a0: a(0), a1: a(1), a2: a(2), a4: a(4)
    };
  }
}
</script>
</body>
</html>
