<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reminders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 58px 24px 0 24px">
    <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="notifMark"><ellipse cx="24" cy="27" rx="7" ry="9"></ellipse></clipPath></defs><path fill-rule="evenodd" d="M24 4C35 4 43 13 43 25S35 46 24 46 5 37 5 25 13 4 24 4Z M24 18C28 18 31 22 31 27S28 36 24 36 17 32 17 27 20 18 24 18Z" fill="#FF6B4A"></path><g clip-path="url(#notifMark)"><rect x="15" y="17" width="18" height="20" fill="#BFD7FF"></rect><circle cx="24" cy="32" r="4" fill="#FFC23A"></circle></g></svg>
  </div>

  <div style="margin: 42px auto 0 auto; width: 128px; height: 128px; border-radius: 36px; overflow: hidden; position: relative; box-shadow: 0 14px 30px rgba(30,26,58,0.22)">
    <dc-import name="Horizon" scene="dawn" clarity="100" w="128" h="128" hint-size="128px,128px"></dc-import>
    <div style="position: absolute; left: 24px; top: 22px"><dc-import name="Xero" mood="hello" stage="2" size="80" hint-size="80px,80px"></dc-import></div>
  </div>

  <div style="padding: 34px 26px 0 26px; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; letter-spacing: -1px; line-height: 1.08">Let's make it stick</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: {{t.muted}}">Gentle nudges for your morning pledge, today's lesson and evening check-in. Never guilt, never spam. Change them anytime in Settings.</p>
  </div>

  <div style="margin: 22px 20px 0 20px; background: {{t.raised}}; border-radius: 22px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; box-shadow: {{t.shadow}}">
    <span style="width: 38px; height: 38px; flex: none; border-radius: 11px; background: #FF6B4A; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 48 48" aria-hidden="true"><path fill-rule="evenodd" d="M24 4C35 4 43 13 43 25S35 46 24 46 5 37 5 25 13 4 24 4Z M24 18C28 18 31 22 31 27S28 36 24 36 17 32 17 27 20 18 24 18Z" fill="#FFF8EE"></path></svg></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="display: flex; justify-content: space-between; font-size: 14px"><b>Good morning</b><span style="font-size: 12px; color: {{t.muted}}">8:00</span></span><span style="font-size: 14px; color: {{t.muted}}">Ten seconds for today's pledge?</span></span>
  </div>

  <div style="margin-top: auto; padding: 0 20px 30px 20px; display: flex; flex-direction: column; gap: 12px">
    <a href="V3Today.dc.html" style="height: 58px; border-radius: 99px; background: #FF6B4A; color: #1A0E08; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 #C9452B">Yes, remind me</a>
    <a href="V3Today.dc.html" style="height: 54px; border-radius: 99px; border: 2px solid {{t.line}}; color: {{t.ink}}; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center">Not right now</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { bg: '#0E0B2B', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', line: 'rgba(255,248,238,0.28)', shadow: 'none' }
      : { bg: '#FBF7F1', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', line: 'rgba(30,26,58,0.22)', shadow: '0 1px 0 rgba(30,26,58,0.06), 0 8px 24px rgba(30,26,58,0.08)' };
    return { t };
  }
}
</script>
</body>
</html>
