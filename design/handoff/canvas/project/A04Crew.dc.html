<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meet your crew</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0">
    <circle cx="340" cy="120" r="90" fill="{{t.blob}}"><animate attributeName="r" values="{{blobR}}" dur="10s" repeatCount="indefinite"></animate></circle>
    <circle cx="40" cy="520" r="60" fill="{{t.blob}}"><animate attributeName="cy" values="{{blobY}}" dur="12s" repeatCount="indefinite"></animate></circle>
  </svg>
  <div style="position: relative; padding: 64px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; font-weight: 800; letter-spacing: 1.2px; {{a0}}">STEP 3 OF 6</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 32px; line-height: 1.06; letter-spacing: -1px; {{a1}}">{{name}}, meet your crew.</h1>
    <p style="margin: 0; font-size: 15.5px; line-height: 1.5; color: {{t.muted}}; {{a2}}">Three friends, three jobs. Built around your coffee and stress waves.</p>
  </div>

  <div style="position: relative; padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 10px">
    <div style="height: 104px; border-radius: 26px; background: {{c0.bg}}; color: {{c0.ink}}; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 6px; box-shadow: 0 5px 0 rgba(0,0,0,0.12); {{c0.style}}">
      <div style="width: 96px; height: 96px; flex: none; display: flex; align-items: center; justify-content: center"><dc-import name="Xero" mood="{{c0.mood}}" stage="2" animate="{{motionStr}}" size="92" hint-size="92px,92px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{c0.title}}</div>
        <div style="font-size: 14px; line-height: 1.4; opacity: 0.85">{{c0.body}}</div>
      </div>
    </div>
    <div style="height: 104px; border-radius: 26px; background: {{c1.bg}}; color: {{c1.ink}}; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 6px; box-shadow: 0 5px 0 rgba(0,0,0,0.12); {{c1.style}}">
      <div style="width: 96px; height: 96px; flex: none; display: flex; align-items: center; justify-content: center"><dc-import name="Jelli" mood="{{c1.mood}}" stage="2" animate="{{motionStr}}" size="92" hint-size="92px,92px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{c1.title}}</div>
        <div style="font-size: 14px; line-height: 1.4; opacity: 0.85">{{c1.body}}</div>
      </div>
    </div>
    <div style="height: 104px; border-radius: 26px; background: {{c2.bg}}; color: {{c2.ink}}; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 6px; box-shadow: 0 5px 0 rgba(0,0,0,0.12); {{c2.style}}">
      <div style="width: 96px; height: 96px; flex: none; display: flex; align-items: center; justify-content: center"><dc-import name="Glim2" mood="{{c2.mood}}" stage="2" animate="{{motionStr}}" size="92" hint-size="92px,92px"></dc-import></div>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px">{{c2.title}}</div>
        <div style="font-size: 14px; line-height: 1.4; opacity: 0.85">{{c2.body}}</div>
      </div>
    </div>
  </div>

  <div style="position: relative; margin: 16px 20px 0 20px; background: {{t.card}}; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; {{a6}}">
    <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 700"><span>Building your plan</span><span>{{pct}}%</span></div>
    <div style="height: 10px; border-radius: 99px; background: {{t.track}}"><div style="height: 10px; border-radius: 99px; background: #1FA971; {{bar}}"></div></div>
    <div style="font-size: 13.5px; line-height: 1.45; color: {{t.muted}}">Quit Day: <b style="color: {{t.ink}}">Sat 14 Nov</b> · 12 cigarettes and the vape · coffee wave ~9:40</div>
  </div>

  <div style="margin-top: auto; padding: 0 22px 28px 22px; position: relative; {{a7}}">
    <a href="A05Today.dc.html" style="height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 17px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.2)">That's my crew</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"name":{"editor":"text","default":"Sam"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); clearInterval(this.iv); }
  play() {
    (this.timers || []).forEach(clearTimeout); clearInterval(this.iv);
    this.timers = [];
    this.setState({ on: false, pct: 0 });
    this.timers.push(setTimeout(() => this.setState({ on: true }), 300));
    this.timers.push(setTimeout(() => {
      this.iv = setInterval(() => {
        const p = Math.min(100, ((this.state && this.state.pct) || 0) + 4);
        this.setState({ pct: p });
        if (p >= 100) clearInterval(this.iv);
      }, 40);
    }, 1500));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 10000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const pct = motion ? (s.pct || 0) : 100;
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i, dy) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : (dy ?? 18)}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 700ms ${ease} ${i * 90}ms`;
    const t = dark
      ? { bg: '#0F2A22', ink: '#FFF8EE', muted: '#A9D9C0', blob: 'rgba(159,227,188,0.08)', card: 'rgba(255,255,255,0.07)', track: 'rgba(255,255,255,0.12)', btn: '#FFF8EE', btnInk: '#0F2A22' }
      : { bg: '#9FE3BC', ink: '#1E1A3A', muted: '#24493A', blob: 'rgba(255,248,238,0.35)', card: 'rgba(255,248,238,0.7)', track: 'rgba(30,26,58,0.12)', btn: '#1E1A3A', btnInk: '#FFF8EE' };
    const crew = [
      { who: 'Xero', mood: 'hello', title: 'Xero · your days', body: 'Rises a little every day clear. Shows you the next step.', bg: dark ? '#2B1A10' : '#FFC38A', ink: dark ? '#FFF8EE' : '#1E1A3A' },
      { who: 'Jelli', mood: 'calm', title: 'Jelli · your waves', body: 'Waits just before 9:40. Tap SOS and breathe with me.', bg: dark ? '#0B1A4A' : '#3D6BFF', ink: '#FFF8EE' },
      { who: 'Glim2', mood: 'sleepy', title: 'Glim · your evenings', body: 'Lights up after dark. One question, then rest.', bg: dark ? '#140E3A' : '#4A3596', ink: '#FFF8EE' }
    ].map((c, i) => Object.assign(c, {
      style: `opacity: ${on ? 1 : 0}; transform: translateX(${on ? 0 : (i % 2 ? 60 : -60)}px) rotate(${on ? 0 : (i % 2 ? 3 : -3)}deg); transition: opacity 600ms ${ease} ${300 + i * 220}ms, transform 800ms cubic-bezier(.3,1.4,.5,1) ${300 + i * 220}ms`
    }));
    const m = (x, y) => motion ? x : y;
    return {
      t, c0: crew[0], c1: crew[1], c2: crew[2], pct, motionStr: String(motion), name: this.props.name ?? 'Sam',
      a0: a(0), a1: a(1), a2: a(2), a6: a(10), a7: a(12),
      bar: `width: ${pct}%`,
      blobR: m('90;104;90', '90;90;90'), blobY: m('520;490;520', '520;520;520')
    };
  }
}
</script>
</body>
</html>
