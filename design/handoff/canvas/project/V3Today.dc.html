<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const t = dark
      ? { bg: '#0E0B2B', surf: '#1B1747', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', dots: '#3A3478', shadow: 'none', nav: 'rgba(27,23,71,0.94)', navShadow: '0 0 0 1px rgba(255,255,255,0.08), 0 12px 30px rgba(0,0,0,0.5)', navActive: '#2A255F', sos: '#7FB0FF' }

}
