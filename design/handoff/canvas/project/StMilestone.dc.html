<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Milestone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 430px; flex: none">
    <dc-import name="Horizon" scene="dawn" clarity="70" w="390" h="430" hint-size="390px,430px"></dc-import>
    <div style="position: absolute; left: 85px; top: 110px"><dc-import name="GlimX" mood="cheer" stage="4" size="220" hint-size="220px,220px"></dc-import></div>
    <svg width="390" height="430" viewBox="0 0 390 430" aria-hidden="true" style="position: absolute; left: 0; top: 0">
      <defs><filter id="stLiftM" x="-5%" y="-50%" width="110%" height="200%"><feDropShadow dx="0" dy="-4" stdDeviation="6" flood-color="#1A0B2E" flood-opacity="0.25"></feDropShadow></filter></defs>
      <path filter="url(#stLiftM)" d="M0 398 C110 374 280 374 390 398 L390 430 L0 430 Z" fill="{{t.bg}}"></path>
    </svg>
    <div style="position: absolute; left: 20px; top: 58px; background: #1E1A3A; color: #FFD66B; border-radius: 99px; padding: 7px 13px; font-size: 12px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase">Glim's light just grew</div>
  </div>

  <div style="padding: 6px 28px 0 28px; text-align: center; display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 46px; letter-spacing: -1.8px; line-height: 1">One week clear</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: {{t.muted}}">Seven days, and the sun inside Glim is almost all the way up.</p>
  </div>

  <div style="margin: 18px 20px 0 20px; position: relative; height: 104px; border-radius: 26px; background: {{t.raised}}; box-shadow: {{t.shadow}}; overflow: hidden">
    <div style="position: absolute; right: 0; top: 0"><dc-import name="Horizon" scene="path" w="104" h="104" hint-size="104px,104px"></dc-import></div>
    <div style="position: absolute; left: 18px; top: 16px; right: 114px; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.6px; text-transform: uppercase; color: {{t.green}}">A few days</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2">Carbon monoxide in your blood drops to normal</span>
      <span style="font-size: 12px; color: {{t.muted}}">Source: American Cancer Society</span>
    </div>
  </div>

  <div style="margin-top: auto; padding: 0 20px 24px 20px; display: flex; flex-direction: column; gap: 4px; align-items: stretch">
    <button style="height: 58px; border-radius: 99px; border: 0; background: #FF6B4A; color: #1A0E08; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer; box-shadow: 0 6px 0 #C9452B">Share my card</button>
    <a href="#" style="align-self: center; color: {{t.ink}}; font-weight: 600; font-size: 15px; padding: 12px 8px">Keep going</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    return { t: dark
      ? { bg: '#0E0B2B', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', green: '#2FD08A', shadow: 'none' }
      : { bg: '#FBF7F1', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', green: '#14804F', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
</body>
</html>
