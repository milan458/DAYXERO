<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const dark = theme === 'dark';
    return { theme, t: dark
      ? { bg: '#0E0B2B', surf: '#1B1747', raised: '#1B1747', ink: '#FFF8EE', muted: '#B8B3D9', dots: '#3A3478', green: '#2FD08A', shadow: 'none' }
      : { bg: '#FBF7F1', surf: '#F1EBE2', raised: '#FFFFFF', ink: '#1E1A3A', muted: '#5E5975', dots: '#D6CDBF', green: '#14804F', shadow: '0 1px 0 rgba(30,26,58,0.05), 0 8px 22px rgba(30,26,58,0.07)' } };
  }
}
</script>
