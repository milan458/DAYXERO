<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start Day Xero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; color: {{t.ink}}; position: relative; overflow: hidden; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="position: relative; height: 380px; flex: none">
    <div style="position: absolute; left: 0; top: 0; {{a0}}"><dc-import name="Hero2" scene="dawn" clarity="23" h="380" edge="{{t.bg}}" animate="{{motionStr}}" hint-size="390px,380px"></dc-import></div>
    <div style="position: absolute; left: 95px; top: 150px; {{rise}}"><dc-import name="Xero" mood="{{mood}}" stage="1" animate="{{motionStr}}" size="200" hint-size="200px,200px"></dc-import></div>
    <a href="F08Today.dc.html" aria-label="Close" style="position: absolute; left: 10px; top: 46px; width: 44px; height: 44px; border-radius: 99px; background: {{t.closeBg}}; color: {{t.closeInk}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  </div>

  <div style="padding: 6px 24px 0 24px; display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.muted}}; {{a1}}">FRI 6 NOV · QUIT DAY · 5 MIN</div>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.02; letter-spacing: -1.2px; {{a2}}">Day Xero</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.5; color: {{t.muted}}; {{a3}}">Your first day. Best heard in the morning.</p>
  </div>

  <div style="margin: 16px 18px 0 18px; background: {{t.card}}; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; {{a4}}">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: {{t.muted}}">BECAUSE</div>
    <div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.25">To keep up with Maya at the park.</div>
  </div>

  <div style="margin-top: auto; padding: 0 22px 22px 22px; display: flex; flex-direction: column; gap: 8px; {{a5}}">
    <a href="G02DayXeroDone.dc.html" aria-label="Start Day Xero. Hold for three seconds, or double-tap with VoiceOver." style="position: relative; overflow: hidden; height: 58px; border-radius: 99px; background: {{t.btn}}; color: {{t.btnInk}}; font-weight: 700; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.22)">
      <span style="position: absolute; left: 0; top: 0; bottom: 0; background: {{t.fill}}; {{fill}}"></span>
      <span style="position: relative">{{btnLabel}}</span>
    </a>
    <p style="margin: 0; text-align: center; font-size: 14px; color: {{t.muted}}">Hold for 3 seconds.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"boolean","default":true},"replay":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.play(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  play() {
    (this.timers || []).forEach(clearTimeout);
    this.timers = [];
    this.setState({ on: false, hold: 0 });
    this.timers.push(setTimeout(() => this.setState({ on: true }), 300));
    this.timers.push(setTimeout(() => this.setState({ hold: 1 }), 2600));
    this.timers.push(setTimeout(() => this.setState({ hold: 2 }), 5600));
    if (String(this.props.replay ?? true) !== 'false') this.timers.push(setTimeout(() => this.play(), 12000));
  }
  renderVals() {
    const dark = (this.props.theme ?? 'light') === 'dark';
    const motion = String(this.props.motion ?? true) !== 'false';
    const s = this.state || {};
    const on = !motion || Boolean(s.on);
    const hold = motion ? (s.hold || 0) : 0;
    const ease = 'cubic-bezier(.2,.7,.2,1)';
    const a = (i) => `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 18}px); transition: opacity 600ms ${ease} ${i * 90}ms, transform 600ms ${ease} ${i * 90}ms`;
    const t = dark
      ? { bg: '#241433', ink: '#FFF8EE', muted: '#E0C8E8', card: 'rgba(255,255,255,0.08)', btn: '#FFC38A', btnInk: '#241433', fill: '#FFD9B0', closeBg: 'rgba(255,248,238,0.14)', closeInk: '#FFF8EE' }
      : { bg: '#FFC38A', ink: '#1E1A3A', muted: '#4A2A1A', card: 'rgba(255,248,238,0.7)', btn: '#1E1A3A', btnInk: '#FFF8EE', fill: '#3A3460', closeBg: 'rgba(255,248,238,0.85)', closeInk: '#1E1A3A' };
    return {
      t, motionStr: String(motion),
      mood: 'hello',
      a0: `opacity: ${on ? 1 : 0}; transition: opacity 600ms ${ease}`,
      rise: `opacity: ${on ? 1 : 0}; transform: translateY(${on ? 0 : 48}px); transition: opacity 900ms ${ease}, transform 900ms cubic-bezier(.2,.8,.2,1)`,
      a1: a(4), a2: a(5), a3: a(6), a4: a(7), a5: a(8),
      fill: `width: ${hold >= 1 ? 100 : 0}%; transition: width ${hold >= 1 ? 3000 : 200}ms linear`,
      btnLabel: hold >= 2 ? 'Day Xero started ✓' : 'Hold to start Day Xero'
    };
  }
}
</script>
</body>
</html>
