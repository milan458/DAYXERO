      P: ['POLISH', 'background: #E7E5E4; color: #44403C'],
      K: ['KEEP', 'background: #DCFCE7; color: #166534']

    const mk = (list) => list.map(([k, text]) => ({ label: T[k][0], tag: T[k][1], text }));
    return {
      n0: mk([
        ['F', 'Contrast fails across the whole screen: headline and button text 4.20:1, body 3.68:1, “Still strong” 3.29:1, reason card 3.39:1. See the contrast board.'],

        ['K', 'Two actions instead of four, the Xero chip fading as Jelli slides in, and the reason card. This is the right SOS.']
      ]),
      n1: mk([
        ['K', 'The +1 pop, the count-ups and “Back to Xero. I rose a little” close the hand-over loop. The best motion on the page.'],
        ['F', 'The optional “What set it off?” tagging is gone. That’s the data behind Insights and the 9:40 prediction on Today.'],
        ['S', 'The “+1” green #1FA971 on the card is 2.48:1. Use #0F6E43 (5.18:1).'],
        ['P', '“That coffee wave lasted 3 minutes” is a fixed number. Use the real time from the SOS session.']
      ]),
      n2: mk([
        ['K', 'The headline changes with the real day: a quiet day, all waves ridden, or a hard day that offers a plan for tomorrow. This is what personal should mean.'],
        ['F', 'Emoji mood buttons. Go back to Crew N1’s drawn faces, which are calmer, on-brand and read correctly in VoiceOver.'],
        ['S', 'There’s nowhere to correct the craving count. Show “From today’s SOS: 3 ridden out” with an Edit link, so the headline isn’t built on wrong data.'],
        ['P', 'Crew N1’s “Your day ends at 3:00 am · change” is missing. It matters for night owls and shift workers.']
      ]),
      n3: mk([
        ['K', 'Xero, then Jelli, then Glim arrive one by one, so the story pays off on screen.'],
        ['F', 'No health fact. Crew T1’s cited one (circulation and lung function, American Cancer Society) belongs here.'],
        ['S', '“£252 kept for ‘Mia’”: wrong currency, wrong name, and awkward wording. Try “$252 kept. For Maya and the park.”'],
        ['S', '41 waves with Jelli here; Crew T1 says 61. Pick one persona and use the same numbers.']
