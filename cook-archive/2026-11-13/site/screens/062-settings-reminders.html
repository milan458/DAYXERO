<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>062 Reminders</title>
<meta name="motion" content="Groups arrive on the stagger; at 1.0s the Craving forecast toggle slides on (300ms settle, light haptic); the toggle is its own done state (no toast). That makes three: the small used count beside Every day ticks from 2 of 3 to 3 of 3 used (plain text, no dots), and the Daily lesson toggle (only the toggle) dims to 40% (300ms) as a small lock fades in beside it as its line cross-fades to the reason, which stays at full muted colour. Every toggle sits level with its row's first line. Tapping the disabled toggle gives a gentle shake and a warning haptic. Each time pill (outlined, with a small chevron) opens a wheel picker sheet; the new time settles into the pill.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* screen-local helpers: icon fill, section labels, small icon tiles, bottom toast */
.hd { display: grid; gap: 6px; padding-top: 58px; }
.sec { padding: 22px 4px 8px; color: var(--muted); }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row.tap { min-height: 56px; }
.toast.b { top: auto; opacity: 0; transform: translateY(18px); transition: opacity .4s var(--ease), transform .55s var(--settle); }
.toast.b.in { opacity: 1; transform: none; }
.toast.b .ck { flex: none; }
.pill { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--card-2); display: inline-flex; align-items: center; font: 600 15px/1 var(--body); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }

.list > .row { min-height: 66px; padding-top: 12px; padding-bottom: 12px; }
/* Every toggle row aligns to its first line: the icon tile and the toggle centre on the title's line box (24px). */
.list > .row.tg { align-items: flex-start; }
.list > .row.tg .ico-tile { margin-top: -5px; }
.list > .row.tg .toggle { margin-top: -4px; }
.sec { padding: 24px 4px 10px; font-size: 14px; }
.sec.hasuse { display: flex; align-items: center; justify-content: space-between; }
.used { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--body); color: var(--muted); }
/* The capped toggle carries a small lock beside it, so it reads as limited, not broken. */
.lk { display: none; width: 16px; height: 16px; color: var(--muted); margin-top: 4px; margin-right: -6px; flex: none; opacity: 0; transition: opacity .3s var(--ease); }
.lk svg { width: 16px; height: 16px; }
.capped .lk { display: block; opacity: 1; }
/* Time pills read as tappable: an outline and a small chevron. */
.time { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px 0 11px; margin-top: 6px; border-radius: 10px; background: var(--card-2); box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--fg) 18%, transparent); font: 600 15px/1 var(--body); color: var(--fg); font-variant-numeric: tabular-nums; }
.time svg { width: 14px; height: 14px; color: var(--muted); }
.toggle.dis { opacity: .4; }
.row .ico-tile, .row .rt, .toggle { transition: opacity .3s var(--ease); }
.capnote { transition: opacity .3s var(--ease); }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">Reminders</h1><p class="t-foot muted" data-a style="--i:1">Gentle nudges, at most three a day.</p></div>
  <p class="t-foot muted sec hasuse" data-a style="--i:2"><span>Every day</span><span class="used" id="used" aria-label="3 of 3 reminders used"><span id="usedt">2 of 3 used</span></span></p>
  <div class="list" data-a style="--i:3">
    <div class="row tg"><span class="ico-tile s" data-ic="sun"></span><div class="grow"><div class="t-body rt">Morning pledge</div><button class="time" aria-label="Change time, 8:00 AM">8:00 AM<span data-ic="down" data-s="14" data-w="2.6"></span></button></div><span class="toggle on"></span></div>
    <div class="row tg"><span class="ico-tile s" data-ic="moon"></span><div class="grow"><div class="t-body rt">Evening check-in</div><button class="time" aria-label="Change time, 9:00 PM">9:00 PM<span data-ic="down" data-s="14" data-w="2.6"></span></button></div><span class="toggle on"></span></div>
    <div class="row tg" id="lesson"><span class="ico-tile s" data-ic="note"></span><div class="grow"><div class="t-body rt">Daily lesson</div><div class="t-foot muted capnote" id="lnote">Off. You will find it on Today</div></div><span class="lk" data-ic="lock" data-s="16" data-w="2.4" aria-label="Limit reached"></span><span class="toggle" id="lt" aria-disabled="false"></span></div>
  </div>
  <p class="t-foot muted sec" data-a style="--i:4">Before a craving</p>
  <div class="list" data-a style="--i:5">
    <div class="row tg"><span class="ico-tile s" data-ic="wave"></span><div class="grow"><div class="t-body rt">Craving forecast</div><div class="t-foot muted">Before coffee and stress</div></div><span class="toggle" id="fc"></span></div>
  </div>
  <p class="t-foot muted sec" data-a style="--i:6">Do not disturb</p>
  <div class="list" data-a style="--i:7">
    <div class="row"><span class="ico-tile s" data-ic="clock"></span><div class="grow"><div class="t-body rt">Quiet hours</div><div class="t-foot muted">10:00 PM to 7:00 AM</div></div><span class="chev" data-ic="chev" data-s="18"></span></div>
  </div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });

const fc = document.getElementById('fc'), lt = document.getElementById('lt'), lesson = document.getElementById('lesson'), lnote = document.getElementById('lnote');
/* Forecast goes on: that is three, so Daily lesson is capped (disabled toggle, the reason in its own row). */
DX.beat(1000, () => {
  fc.classList.add('on'); document.getElementById('usedt').textContent = '3 of 3 used';
  lt.classList.add('dis'); lt.setAttribute('aria-disabled', 'true'); lesson.classList.add('capped');
  lnote.style.opacity = 0; setTimeout(() => { lnote.textContent = 'Three is the daily limit. Turn one off to use this.'; lnote.style.opacity = 1; }, DX.still ? 0 : 300);
});
</script>
</body></html>
