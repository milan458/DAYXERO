<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>024 Session listen card</title>
<meta name="motion" content="The apricot player (deep dusk with a warm sun glow in dark mode) rises into place (settle 900ms) while the five-card bar arrives; Xero, in his headphones, settles in front of the sun and then sways gently to the audio (5s bob loop). The waveform bars grow from the centre line left to right (48 bars, 16ms apart, 420ms each); at 1.2s play starts: the icon swaps to pause, the played ink and the playhead knob sweep across the bars (linear, follows playback), the elapsed time under the left end counts, and the first card&#39;s segment fills as a sliver in step with playback. While it plays, the dock holds only a quiet Skip to next card link; at 80% played (4:48) the link cross-fades into the solid Next card button (300ms, light haptic). Read, top right of the player, expands the transcript under the controls (320ms ease).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* the current segment fills with this card's progress (here: playback) as a sliver, never a dot */
.steps > i.now::after{width:max(12px,var(--sub,45%));border-radius:99px 2px 2px 99px}
/* Listen = apricot. Dark mode: the same player at deep dusk, cream ink and a warm sun glow, never a muddy caramel. */
.face{--ink:#1E1A3A;--soft:#3A2410;--face:#FFC38A;--face-2:#FFD6AC;--sunc:#FFE6BC;--pb:#1E1A3A;--pb-fg:#FFF8EE;
  background:var(--face);color:var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 16px 30px rgba(60,40,20,.14)}
[data-theme="dark"] .face{--ink:#FFF8EE;--soft:#E9DCCB;--pb:#FFC38A;--pb-fg:#1E1A3A;
  background:radial-gradient(80% 36% at 50% 32%,rgba(247,170,108,.30),rgba(247,170,108,0) 100%),linear-gradient(180deg,#27325C 0%,#1C2547 58%,#19223F 100%);
  box-shadow:0 18px 34px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,248,238,.08)}
.art{position:relative;height:334px;background:linear-gradient(to bottom,var(--face-2),var(--face))}
[data-theme="dark"] .art{background:none}
/* light: a warm, saturated sun with a soft glow so it reads on the apricot */
.art .sun{position:absolute;left:50%;top:38px;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:radial-gradient(circle,#FFE48A 0,#FFD35E 66%,#FFC94F 100%);box-shadow:0 0 60px 14px rgba(255,214,94,.55)}
[data-theme="dark"] .art .sun{background:radial-gradient(circle,#F9C083 0,#F2A766 70%,#EC9A5E 100%);box-shadow:0 0 90px 24px rgba(247,168,106,.30)}
.art .xw{position:absolute;left:50%;bottom:-9px;width:226px;margin-left:-113px}
.in{padding:18px 20px 24px}
.kind{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--body);color:var(--soft)}
.kind svg{width:18px;height:18px}
.kind .rd{margin-left:auto;display:flex;align-items:center;gap:6px;height:32px;margin-block:-9px;padding:0 2px;font:600 14px/1 var(--body);color:var(--ink)}
.kind .rd svg{width:17px;height:17px}
.wave{position:relative;height:52px;margin-top:16px}
.wave .layer{position:absolute;inset:0;overflow:hidden}
.wave .layer.on{width:var(--pp,14%)}
.wave svg{display:block;height:52px}
.wave rect{transform-box:fill-box;transform-origin:50% 50%}
.play .wave .base rect{animation:bar 420ms var(--settle) both;animation-delay:calc(200ms + var(--b) * 16ms)}
@keyframes bar{from{transform:scaleY(.08)}to{transform:none}}
.play .wave .layer.on{animation:sweep 6000ms linear both 1200ms}
@keyframes sweep{from{width:0}to{width:var(--pp,14%)}}
/* the playhead: a thin line through the bars with a knob, riding the end of the played ink */
.head{position:absolute;top:-4px;bottom:-4px;left:var(--pp,14%);width:2px;margin-left:-1px;border-radius:2px;background:var(--ink)}
.head::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:99px;background:var(--ink);box-shadow:0 0 0 3px var(--face),0 2px 6px rgba(30,26,58,.25)}
[data-theme="dark"] .head::after{box-shadow:0 0 0 3px #222D54,0 2px 6px rgba(0,0,0,.4)}
.play .head{animation:ride 6000ms linear both 1200ms}
@keyframes ride{from{left:0}to{left:var(--pp,14%)}}
.times{display:flex;justify-content:space-between;margin-top:8px}
.times .t-cap{color:var(--soft)}
.ctl{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:12px}
.skip{position:relative;width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.skip svg{width:34px;height:34px}
/* the 15 sits inside the ring at 11px (the ring is 28px across), never a tiny squeezed numeral */
.skip b{position:absolute;inset:0;display:grid;place-items:center;font:700 11px/1 var(--body);letter-spacing:-.3px;padding-top:1px}
.pbtn{width:64px;height:64px;border-radius:99px;background:var(--pb);color:var(--pb-fg);display:grid;place-items:center;box-shadow:0 6px 16px rgba(30,26,58,.22)}
[data-theme="dark"] .pbtn{box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pbtn svg{width:26px;height:26px}
/* the gate: a quiet skip link while the card plays; the solid Next card button takes its place at 80% */
.gate{position:relative;height:58px}
.gate > *{position:absolute;inset:0;transition:opacity .3s var(--ease)}
.gate .skip-l{height:58px;color:var(--muted);opacity:1}
.gate .btn{opacity:0;pointer-events:none}
.gate.open .skip-l{opacity:0;pointer-events:none}
.gate.open .btn{opacity:1;pointer-events:auto}
</style>
</head><body>
<div class="screen" data-ground="table">
  <div class="nav">
    <button class="icon-btn" aria-label="Close" id="close"></button>
    <div class="grow"><div class="steps" aria-label="Card 1 of 5" data-a style="--sub:14%;--i:0"><i class="now"></i><i></i><i></i><i></i><i></i></div></div>
  </div>
  <div class="scroll" style="padding-top:110px">
    <div class="pad">
      <div class="face" data-settle style="--i:0">
        <div class="art">
          <div class="sun"></div>
          <div class="xw" data-settle style="--i:2"><div class="bob" id="xero"></div></div>
        </div>
        <div class="in">
          <div class="kind"><span id="k-ic"></span>Listen · 6 min<button class="rd" aria-expanded="false"><span id="r-ic"></span>Read</button></div>
          <h1 class="t-title" style="margin-top:10px">Why it feels like it calms you</h1>
          <div class="wave" id="wave" style="--pp:14%"></div>
          <div class="times"><span class="t-cap" data-count="50" data-delay="1200" data-dur="6000" id="el">0:50</span><span class="t-cap">6:00</span></div>
          <div class="ctl">
            <button class="skip" aria-label="Back 15 seconds" id="sb"></button>
            <button class="pbtn" id="pbtn" aria-label="Pause"></button>
            <button class="skip" aria-label="Forward 15 seconds" id="sf"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="dock">
    <div class="gate" id="gate" data-a style="--i:6"><button class="link skip-l">Skip to next card</button><button class="btn">Next card</button></div>
  </div>
</div>
<script>
const dark = DX.theme === 'dark';
document.getElementById('close').innerHTML = DX.icon('close');
document.getElementById('k-ic').innerHTML = DX.icon('headphones', {size:18});
document.getElementById('r-ic').innerHTML = DX.icon('text', {size:17});
/* 15-second skips: a circular arrow with the number inside */
const skip = fwd => `<svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="${fwd ? 'transform:scaleX(-1)' : ''}"><path d="M7.8 8.3A13 13 0 1 1 4.2 19.8"/><path d="M7.8 2.5v5.8h5.8"/></svg><b>15</b>`;
document.getElementById('sb').innerHTML = skip(false);
document.getElementById('sf').innerHTML = skip(true);
/* Xero in headphones: the band and cups are drawn into his own body group so they sway with him */
const PHONES = `<g aria-hidden="true">
  <path d="M38 108 C30 -4 170 -4 162 108" fill="none" stroke="#1E1A3A" stroke-width="10" stroke-linecap="round"/>
  <path d="M52 62 C66 30 100 22 122 26" fill="none" stroke="#FFF8EE" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <rect x="18" y="88" width="30" height="48" rx="14" fill="#1E1A3A"/><rect x="24" y="96" width="9" height="32" rx="4.5" fill="#FF9A6B"/>
  <rect x="152" y="88" width="30" height="48" rx="14" fill="#1E1A3A"/><rect x="167" y="96" width="9" height="32" rx="4.5" fill="#FF9A6B"/></g>`;
let xs = DX.char('xero', {mood:'calm', size:226});
const mi = xs.indexOf('stroke-width="3.5"'); const end = xs.indexOf('</path>', mi) + 7;
xs = xs.slice(0, end) + PHONES + xs.slice(end);
document.getElementById('xero').innerHTML = xs;
const pb = document.getElementById('pbtn');
pb.innerHTML = DX.icon('pause', {size:26, w:3});
/* 48 bars, deterministic heights, full card width, drawn in the card's ink */
const W = 306, n = 48, bw = 3.4, gap = (W - n * bw) / (n - 1);
const hs = Array.from({length:n}, (_, i) => 8 + Math.round(38 * Math.abs(Math.sin(i * 1.7) * .6 + Math.sin(i * .45) * .4)));
const bars = (op, cls) => `<svg width="${W}" viewBox="0 0 ${W} 52" class="${cls}">${hs.map((h, i) => `<rect x="${(i * (bw + gap)).toFixed(1)}" y="${26 - h / 2}" width="${bw}" height="${h}" rx="1.7" fill="var(--ink)" fill-opacity="${op}" style="--b:${i}"/>`).join('')}</svg>`;
document.getElementById('wave').innerHTML = `<div class="layer">${bars(dark ? .42 : .3, 'base')}</div><div class="layer on">${bars(1, '')}</div><i class="head" aria-hidden="true"></i>`;
/* elapsed time as m:ss */
const el = document.getElementById('el');
new MutationObserver(() => { const v = parseInt(el.textContent); if (!isNaN(v) && !el.textContent.includes(':')) el.textContent = '0:' + String(v).padStart(2, '0'); }).observe(el, {childList:true});
if (!DX.still) { pb.innerHTML = DX.icon('play', {size:26, w:2.4, fill:'currentColor'}); DX.after(1200, () => { pb.innerHTML = DX.icon('pause', {size:26, w:3}); }); }
</script>
</body></html>
