<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>063 Day ends</title>
<meta name="motion" content="Options arrive on the stagger with Midnight selected; at 1.0s the selection moves to 4 AM (ring and tick 250ms, selection haptic), the timeline below fills Thursday from 8 PM to the 4 AM tick (fade, 700ms), past the midnight tick, and the 1:30 check-in dot pops onto it (1.3s), its label in the accent colour right above it (day names muted, all labels 15px) so it plainly lands on Thursday, while the Friday label fades in starting at the 4 AM tick; the choice saves at once with a success haptic (the filled radio is the done state, no toast).">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
/* screen-local helpers: icon fill, section labels, small icon tiles, bottom toast */
.hd { display: grid; gap: 6px; padding-top: 58px; }
.sec { padding: 22px 4px 8px; color: var(--muted); }
.rt { font-weight: 600; }
.ico-tile.s { width: 34px; height: 34px; border-radius: 11px; }
.ico-tile.s svg { width: 19px; height: 19px; }
.val { color: var(--muted); font: 500 15px/1.2 var(--body); white-space: nowrap; }
.list > .row.tap { min-height: 56px; }
.toast.b { top: auto; opacity: 0; transform: translateY(18px); transition: opacity .4s var(--ease), transform .55s var(--settle); }
.toast.b.in { opacity: 1; transform: none; }
.toast.b .ck { flex: none; }
.pill { height: 34px; padding: 0 12px; border-radius: 11px; background: var(--card-2); display: inline-flex; align-items: center; font: 600 15px/1 var(--body); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }

.opts { display: grid; gap: 10px; margin-top: 22px; }
/* Rows only as tall as their content: one-line times are short, the two-line ones grow. */
.opts .opt { min-height: 0; padding: 14px 16px; }
.tl { margin-top: 22px; padding: 16px 18px 14px; }
.tl .head { display: flex; align-items: center; gap: 14px; }
.tl .av { width: 56px; height: 56px; border-radius: 18px; flex: none; position: relative; overflow: hidden; background: linear-gradient(180deg, #0B1430, #2C3D6A); }
.tl .av > svg { position: absolute; inset: 0; }
.tl .av .g { position: absolute; left: 0; top: 2px; }
.bar { position: relative; height: 74px; margin-top: 14px; }
.bar .ln { position: absolute; left: 0; right: 0; top: 36px; height: 4px; border-radius: 99px; background: var(--track); }
.bar .seg { position: absolute; left: 0; top: 35px; height: 6px; border-radius: 99px; background: var(--fg); width: 66.67%; }
.bar .mid { position: absolute; top: 30px; width: 2px; height: 16px; margin-left: -1px; border-radius: 2px; background: var(--fg); opacity: .55; }
.bar .end { position: absolute; top: 26px; width: 3px; height: 24px; margin-left: -1.5px; border-radius: 2px; background: var(--fg); }
.bar .ci { position: absolute; top: 29px; width: 20px; height: 20px; margin-left: -10px; border-radius: 99px; background: var(--card-2); box-shadow: inset 0 0 0 4px var(--mark); }
.bar .lab { position: absolute; white-space: nowrap; transform: translateX(-50%); }
.bar .lab { font-size: 15px; }
/* Day names are muted; the 1:30 check-in label sits right above its dot in the accent colour. */
.bar .up { top: 0; font: 600 15px/1.3 var(--body); color: var(--muted); }
.bar .up.ci-l { font-weight: 700; color: var(--acc); }
.screen { --acc: #D4512C; }
[data-theme="dark"] .screen { --acc: var(--mark); }
.bar .dn { top: 54px; color: var(--muted); font: 600 15px/1.3 var(--body); }
.bar .l { transform: none; }
.bar .r { transform: translateX(-100%); }
</style>
</head><body>
<div class="screen" data-ground="reading">
<div class="nav"><button class="icon-btn" aria-label="Back" data-ic="back"></button></div>
<div class="scroll"><div class="pad">
  <div class="hd"><h1 class="t-large" data-a style="--i:0">When your day ends</h1><p class="t-foot muted" data-a style="--i:1">Up late? A check-in before this time still counts for the day you just had.</p></div>
  <div class="opts">
    <div data-a style="--i:2"><button class="opt on" id="o0"><div class="grow"><div class="t-head">Midnight</div></div><span class="radio"></span></button></div>
    <div data-a style="--i:3"><button class="opt" ><div class="grow"><div class="t-head">2 AM</div></div><span class="radio"></span></button></div>
    <div data-a style="--i:4"><button class="opt" id="o4"><div class="grow"><div class="t-head">4 AM</div><div class="t-foot">Default, fits most late nights</div></div><span class="radio"></span></button></div>
    <div data-a style="--i:5"><button class="opt" ><div class="grow"><div class="t-head">6 AM</div><div class="t-foot">For night shifts and late finishes</div></div><span class="radio"></span></button></div>
  </div>
  <div class="card flat tl" data-a style="--i:6">
    <div class="head"><span class="av" id="glim063"></span><p class="t-body" style="flex:1">A check-in at 1:30 AM still counts for Thursday. Friday starts at 4 AM.</p></div>
    <div class="bar" aria-label="Thursday runs on past midnight to 4 AM; the 1:30 AM check-in counts for Thursday">
      <div class="ln"></div><div class="seg" data-fade style="--d:700ms"></div>
      <div class="mid" style="left:33.33%"></div><div class="end" style="left:66.67%"></div><div class="ci" style="left:45.83%;--d:1300ms" data-pop></div>
      <span class="lab up l t-cap" style="left:0">Thursday</span><span class="lab up ci-l t-cap" style="left:45.83%">1:30 check-in</span><span class="lab up l t-cap" style="left:66.67%;margin-left:-1.5px">Friday</span>
      <span class="lab dn l t-cap" style="left:0">8 PM</span><span class="lab dn t-cap" style="left:33.33%">Midnight</span><span class="lab dn t-cap" style="left:66.67%">4 AM</span><span class="lab dn r t-cap" style="left:100%">8 AM</span>
    </div>
  </div>
</div></div>
</div>
<script>
document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = DX.icon(e.dataset.ic, { size: +(e.dataset.s || 24), w: +(e.dataset.w || 2.2) }); });

const o0 = document.getElementById('o0'), o4 = document.getElementById('o4');
document.getElementById('glim063').innerHTML = `<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="10" cy="10" r="1" fill="#fff" opacity=".8"/><circle cx="46" cy="14" r="1.2" fill="#fff" opacity=".6"/><circle cx="40" cy="6" r=".9" fill="#fff" opacity=".7"/><path d="M0 48 C18 42 36 44 56 50 V56 H0Z" fill="#1C2C4E"/></svg><span class="g">${DX.char('glim', { mood: 'calm', size: 56 })}</span>`;
function pick() { o0.classList.remove('on'); o4.classList.add('on'); }
DX.after(1000, pick); DX.onStill(pick);
</script>
</body></html>
