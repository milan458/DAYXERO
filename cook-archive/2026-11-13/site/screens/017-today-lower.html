<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>017 Today, through the day</title>
<meta name="motion" content="Today, scrolled. The compact header (Xero full figure at 32px, 7 days free, $49 kept) is already pinned. 'Now' and its one illustrated cream card arrive (600ms): inside it the paper-cut hills rise 16px back to front (100ms apart, 900ms settle), Xero settles onto the front knoll (900ms) and breathes, his breeze marks drifting; the title and the two actions under the card's hairline fade up after (90ms stagger). At 1.2s '+1 glass' presses: a '+1' floats up from the count, the count bumps from 3 to 4 (spring bump, 520ms) and the water in the drawn glass rises from 3/8 to 4/8 (600ms settle). 'Later' and its one quiet list arrive last (90ms stagger, no lift). Light haptic on the tap, soft success tick on the bump.">
<link rel="stylesheet" href="../kit/kit.css">
<script src="../kit/chars.js"></script><script src="../kit/kit.js"></script>
<style>
  /* the page warms toward cream as it scrolls: apricot only at the very top */
  .screen[data-ground="apricot"] { --g: #FBF4EA; --cream-card: #FFFCF7; --well: #F6EDE1; --lift: 0 1px 0 rgba(74,40,16,.04), 0 10px 26px rgba(74,40,16,.10);
    background: linear-gradient(180deg, #FFC38A 0px, #FFD7B0 96px, #FBE9D6 220px, #FBF4EA 380px); }
  [data-theme="dark"] .screen[data-ground="apricot"] { --g: #0E1322; --cream-card: var(--card); --well: var(--card-2); --lift: 0 10px 24px rgba(0,0,0,.3);
    background: radial-gradient(120% 30% at 50% -6%, rgba(255,195,138,.12), transparent 70%), #0E1322; }

  /* compact pinned header */
  .top { position: absolute; z-index: 5; left: 0; right: 0; top: 52px; height: 52px; padding: 0 var(--gutter) 0 16px; display: flex; align-items: center; gap: 10px; }
  .top .fig { width: 32px; height: 32px; flex: none; display: grid; place-items: center; }
  .top .grow { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .top .t-head { font-size: 18px; }
  .top .t-cap { color: var(--muted); }
  .top .money { display: flex; align-items: baseline; gap: 5px; }
  .top .money .num { font-size: 20px; line-height: 1; }
  .top .money .t-cap { color: var(--muted); }

  .body { position: absolute; left: 0; right: 0; top: 118px; padding: 0 var(--gutter); }
  .grp { font: 700 19px/1.2 var(--display); letter-spacing: -.2px; margin: 0 0 10px 2px; }
  .grp.later { margin-top: 26px; }

  /* the one Now card: illustrated, cream, the day's two small actions grouped inside */
  .now { position: relative; background: var(--cream-card); border-radius: 26px; box-shadow: inset 0 0 0 1px var(--line), var(--lift); overflow: hidden; }
  .art { position: relative; height: 184px; }
  .art svg.scene { position: absolute; inset: 0; display: block; }
  .art .h { transform-box: fill-box; }
  .play .art .h { animation: hrise 900ms var(--settle) both; }
  .play .art .h2 { animation-delay: 100ms; } .play .art .h3 { animation-delay: 200ms; }
  @keyframes hrise { from { transform: translateY(16px); opacity: 0; } }
  .art .fig { position: absolute; left: 228px; top: 64px; }
  .art .txt { position: absolute; left: 18px; top: 18px; width: 208px; }
  .art .txt .t-foot { color: var(--muted); font-size: 14px; }
  .art .txt .t-title { margin-top: 4px; font-size: 23px; }
  /* the actions sit in the Now card itself, under a hairline (no card inside the card) */
  .acts { border-top: 1px solid var(--line); padding: 2px 16px 4px; }
  .act { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 7px 0; }
  .act + .act { border-top: 1px solid var(--line); }
  .act .grow { flex: 1; min-width: 0; }
  .act .t-head { font-size: 17px; line-height: 1.2; }
  .act .t-cap { color: var(--muted); margin-top: 2px; }
  /* one icon-tile style for both actions */
  .glyph { width: 42px; height: 42px; flex: none; border-radius: 13px; display: grid; place-items: center; background: var(--well); color: var(--fg); }
  .glyph svg { width: 22px; height: 22px; }
  .glyph.sea { color: #2A50AA; }
  [data-theme="dark"] .glyph.sea { color: #9DB4F2; }
  .act .btn.small { width: auto; flex: none; height: 44px; padding: 0 16px; font-size: 15px; background: var(--cream-card); }
  .act .btn.small svg { width: 16px; height: 16px; }
  .glass .wtr { transition: transform 600ms var(--settle); }
  .val { position: relative; display: inline-block; }
  #gl { display: inline-block; }
  .plus { position: absolute; right: -24px; top: -6px; font: 800 16px/1 var(--display); color: var(--tick); opacity: 0; }

  /* later: one quiet list, same order as the top of Today */
  .later-list { border-radius: 22px; background: color-mix(in srgb, var(--cream-card) 60%, transparent); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
  .lrow { display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 10px 14px 10px 16px; }
  .lrow + .lrow { border-top: 1px solid var(--line); }
  .lrow .grow { flex: 1; min-width: 0; }
  .lrow .t-head { font-size: 16px; font-weight: 700; }
  .lrow .t-cap { color: var(--muted); margin-top: 3px; font-size: 13px; font-weight: 500; }
  .lrow .ic { width: 22px; height: 22px; flex: none; color: var(--muted); }
  .lrow .chev { width: 18px; height: 18px; }
</style>
</head><body>
<div class="screen" data-ground="apricot">
  <div class="top">
    <span class="fig" id="xmini"></span>
    <div class="grow"><span class="t-head">7 days free</span><span class="t-cap">Fri, Nov 13</span></div>
    <div class="money"><span class="num">$49</span><span class="t-cap">kept</span></div>
  </div>

  <div class="body">
    <h2 class="grp" data-a style="--i:0">Now</h2>
    <div class="now" data-a style="--i:1">
      <div class="art" aria-hidden="true">
        <svg class="scene" id="scene" width="346" height="184" viewBox="0 0 346 184"></svg>
        <div class="fig" data-settle style="--d:300ms"><div id="xero"></div></div>
        <div class="txt" data-a style="--i:2;--d:200ms">
          <p class="t-foot">Happening now &middot; Day 7</p>
          <p class="t-title">Most nicotine has left your body</p>
        </div>
      </div>
      <div class="acts" data-a style="--i:3;--d:200ms">
        <div class="act">
          <span class="glyph sea" id="ic-wave"></span>
          <div class="grow"><p class="t-head"><span data-count="3">3</span> waves today</p><p class="t-cap">Ridden out with SOS</p></div>
          <button class="btn small ghost">Log a wave</button>
        </div>
        <div class="act">
          <span class="glyph glass" id="glass"></span>
          <div class="grow"><p class="t-head"><span class="val"><span id="gl">3</span><span class="plus" id="plus">+1</span></span> of 8</p><p class="t-cap">Glasses of water</p></div>
          <button class="btn small ghost" id="addw"></button>
        </div>
      </div>
    </div>

    <h2 class="grp later" data-a style="--i:4">Later</h2>
    <div class="later-list" data-a style="--i:5">
      <div class="lrow"><span class="ic" data-ic="note"></span><div class="grow"><p class="t-head">The noisy passengers</p><p class="t-cap">Today's read &middot; 3 min</p></div><span class="chev" data-ic="chev"></span></div>
      <div class="lrow"><span class="ic" data-ic="moon"></span><div class="grow"><p class="t-head">Check-in with Glim</p><p class="t-cap">Opens 6 PM &middot; nudge at 9 PM</p></div><span class="chev" data-ic="chev"></span></div>
      <div class="lrow"><span class="ic" data-ic="leaf"></span><div class="grow"><p class="t-head">Wind-down breath</p><p class="t-cap">10 PM &middot; 3 min</p></div><span class="chev" data-ic="chev"></span></div>
    </div>
  </div>
</div>
<script>
  const $ = s => document.querySelector(s);
  const dark = DX.theme === 'dark';
  /* paper-cut morning: warm sky, a low sun, three taller layered hills; Xero stands on the front knoll */
  const c = dark
    ? { s0: '#1A2442', s1: '#2B3052', s2: '#5A4558', sun: '#FFB877', glow: '#FFB877', h1: '#2C3A60', h2: '#22304F', h3: '#182034', rim: 'rgba(246,231,193,.18)', sh: '#000000' }
    : { s0: '#FFF6EA', s1: '#FFE9D2', s2: '#FFD3A8', sun: '#FFC93C', glow: '#FFD27A', h1: '#FFC796', h2: '#FFAE73', h3: '#FFFCF7', rim: 'rgba(255,255,255,.55)', sh: '#8A3A12' };
  $('#scene').innerHTML = `<defs>
      <linearGradient id="nk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.s0}"/><stop offset=".6" stop-color="${c.s1}"/><stop offset="1" stop-color="${c.s2}"/></linearGradient>
      <radialGradient id="ng"><stop offset="0" stop-color="${c.glow}" stop-opacity=".55"/><stop offset="1" stop-color="${c.glow}" stop-opacity="0"/></radialGradient>
      <filter id="nl" x="-5%" y="-30%" width="110%" height="160%"><feDropShadow dx="0" dy="-2" stdDeviation="3" flood-color="${c.sh}" flood-opacity="${dark ? .45 : .16}"/></filter></defs>
    <rect width="346" height="184" fill="url(#nk)"/>
    <circle cx="186" cy="114" r="54" fill="url(#ng)"/><circle cx="186" cy="114" r="20" fill="${c.sun}"/>
    <g class="h h1" filter="url(#nl)"><path d="M0 124 C40 104 90 98 140 108 C180 116 214 120 250 104 C282 90 318 88 346 96 V184 H0Z" fill="${c.h1}"/><path d="M0 124 C40 104 90 98 140 108 C180 116 214 120 250 104 C282 90 318 88 346 96" fill="none" stroke="${c.rim}" stroke-width="1.5"/></g>
    <g class="h h2" filter="url(#nl)"><path d="M0 146 C36 130 86 126 132 134 C172 141 204 144 236 134 C268 124 304 116 346 120 V184 H0Z" fill="${c.h2}"/><path d="M0 146 C36 130 86 126 132 134 C172 141 204 144 236 134 C268 124 304 116 346 120" fill="none" stroke="${c.rim}" stroke-width="1.5"/></g>
    <g class="h h3" filter="url(#nl)"><path d="M0 168 C56 160 116 162 168 162 C206 162 226 152 252 146 C282 139 316 142 346 150 V184 H0Z" fill="${c.h3}"/></g>`;
  $('#xero').innerHTML = DX.char('xero', { mood: 'breathe', size: 88, stage: 2 });
  $('#xmini').innerHTML = DX.char('xero', { mood: 'hello', size: 32, stage: 2, animate: false });
  $('#ic-wave').innerHTML = DX.icon('wave', { w: 2.4 });
  /* a drawn glass: water level is a translate on the fill */
  $('#glass').innerHTML = `<svg width="26" height="32" viewBox="0 0 26 32" aria-hidden="true"><defs><clipPath id="gcl"><path d="M3.5 3 H22.5 L20.4 28.2 Q20.2 30 18.4 30 H7.6 Q5.8 30 5.6 28.2 Z"/></clipPath></defs>
    <g clip-path="url(#gcl)"><g class="wtr" id="wtr" style="transform:translateY(0)"><path d="M0 18.6 C4 17.4 8 19.8 13 18.6 S22 17.4 26 18.6 V40 H0Z" fill="#8EC1F5"/><path d="M0 18.6 C4 17.4 8 19.8 13 18.6 S22 17.4 26 18.6" fill="none" stroke="#5A9DEB" stroke-width="1.2"/></g></g>
    <path d="M3.5 3 H22.5 L20.4 28.2 Q20.2 30 18.4 30 H7.6 Q5.8 30 5.6 28.2 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M7.4 7.5 L8.4 22" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="1.8" stroke-linecap="round"/></svg>`;
  document.querySelectorAll('[data-ic]').forEach(el => { el.innerHTML = DX.icon(el.dataset.ic, { size: el.classList.contains('chev') ? 18 : 22 }); });
  $('#addw').innerHTML = DX.icon('plus', { w: 2.8 }) + '1 glass';
  $('.screen').insertAdjacentHTML('beforeend', DX.tabbar('today'));

  /* 3/8 to 4/8: the glass interior is 27px tall, so one glass is about 3.4px of water */
  function addGlass(anim) {
    $('#gl').textContent = '4';
    $('#wtr').style.transform = 'translateY(-3.4px)';
    if (!anim) return;
    const gl = $('#gl'); gl.classList.remove('bump'); void gl.offsetWidth; gl.classList.add('bump');
    const pl = $('#plus'); pl.classList.remove('float-up'); void pl.offsetWidth; pl.classList.add('float-up');
  }
  function reset() { $('#gl').textContent = '3'; $('#wtr').style.transform = 'translateY(0)'; $('#plus').classList.remove('float-up'); $('#gl').classList.remove('bump'); }
  DX.after(0, reset);
  DX.after(1200, () => { const b = $('#addw'); b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 160); addGlass(true); });
  DX.onStill(() => addGlass(false));
</script>
</body></html>
