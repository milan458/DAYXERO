name: Store setup

# Creates the plans in App Store Connect and wires them up in RevenueCat (S3.11).
# Run it from the Actions tab; it's safe to run again. See scripts/ci/store_setup.py.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "What to set up"
        type: choice
        options: [all, appstore, revenuecat]
        default: all

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Write key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          python3 - <<'PY'
          import os, re, textwrap
          body = re.sub(r"-----(BEGIN|END) PRIVATE KEY-----", "", os.environ["ASC_KEY_P8"])
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          kid = os.environ["ASC_KEY_ID"].strip()
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.path.join(os.environ["RUNNER_TEMP"], f"AuthKey_{kid}.p8"), "w").write(pem)
          PY
          pip install --quiet pyjwt cryptography

      # App Review wants a screenshot of each purchase; the paywall from the latest CI screenshots.
      - name: Review screenshot
        run: |
          git fetch -q --depth 1 origin ci-screens && git show origin/ci-screens:pw-annual-light.png > "$RUNNER_TEMP/paywall.png" || true
          ls -la "$RUNNER_TEMP/paywall.png" || true

      - name: Set up
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RC_SECRET_KEY: ${{ secrets.RC_SECRET_KEY }}
          RC_PROJECT_ID: ${{ secrets.RC_PROJECT_ID }}
          REVIEW_SCREENSHOT: ${{ runner.temp }}/paywall.png
        run: python3 scripts/ci/store_setup.py ${{ inputs.step }}

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
