name: iOS build and test

on:
  push:
    branches: [main]
    paths-ignore: ["planning/**", "docs/**", "**.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          rt = sorted([k for k in d if "iOS" in k], key=lambda k: [int(x) for x in k.split("iOS-")[1].split("-")])
          for k in reversed(rt):
              for dev in d[k]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DayXero.xcodeproj \
            -scheme DayXero \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath DerivedData \
            -quiet 2>&1 | tee build.log

      # Screenshots of the running app (dark, light, largest text), pushed to the
      # ci-screens branch so they can be reviewed without downloading artifacts.
      - name: Screenshots
        if: github.event_name != 'pull_request'
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find DerivedData/Build/Products -name "DayXero.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shoot() {
            xcrun simctl ui "$UDID" appearance "$1"
            xcrun simctl ui "$UDID" content_size "$2"
            xcrun simctl terminate "$UDID" in.dayxero.app 2>/dev/null || true
            xcrun simctl launch "$UDID" in.dayxero.app
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$3.png"
          }
          shoot dark large gallery-dark
          shoot light large gallery-light
          shoot dark accessibility-extra-extra-extra-large gallery-dark-ax5
          cd shots
          git init -q -b ci-screens
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screens

      # Logs live in blob storage that some readers can't reach, so surface the
      # errors as annotations (readable through the checks API) as well.
      - name: Annotate errors
        if: failure()
        run: |
          python3 - <<'PY'
          import os, re
          seen, out = set(), []
          for line in open("build.log", errors="replace"):
              m = re.match(r"^(/[^:]+):(\d+):(\d+): (error|warning): (.*)$", line.strip())
              if m and m.group(4) == "error":
                  path = os.path.relpath(m.group(1), os.getcwd())
                  key = (path, m.group(2), m.group(5))
                  if key not in seen:
                      seen.add(key)
                      out.append(f"::error file={path},line={m.group(2)},col={m.group(3)}::{m.group(5)}")
              elif re.search(r"(Test .* failed|✘|error: -|xcodebuild: error|Fatal error|failed with exit code)", line):
                  out.append("::error::" + line.strip()[:900])
          tail = open("build.log", errors="replace").read()[-6000:].replace("\n", "%0A")
          out.append("::error title=Build log tail::" + tail)
          print("\n".join(out[-45:]))
          PY
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact > summary.json 2>&1 || true
            xcrun xcresulttool get test-results tests --path TestResults.xcresult --compact > tests.json 2>&1 || true
            python3 - <<'PY'
          for f in ("summary.json", "tests.json"):
              try:
                  txt = open(f).read()
              except OSError:
                  continue
              print("::error title=" + f + "::" + txt[:8000].replace("\n", "%0A"))
          PY
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
