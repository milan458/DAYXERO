name: Website

# Deploys website/ to the "dayxero" Cloudflare Worker, which serves dayxero.in.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["website/**", "scripts/website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rebuild generated files so a stale commit can't ship old pages or missing CSS classes.
      - name: Build guides and CSS
        run: |
          npm run website:guides
          npm run website:css
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.153.0"
          workingDirectory: website
          command: deploy
