name: Website

# Deploys website/ to the "dayxero" Cloudflare Worker, which serves dayxero.in, using the wrangler.jsonc at the repo root.
# Needs repo secrets CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers) and CLOUDFLARE_ACCOUNT_ID.
# Cloudflare Workers Builds can deploy the same config directly from the repo; see website/worker/README.md.
on:
  push:
    branches: [main]
    paths: ["website/**", "scripts/website/**", "wrangler.jsonc", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rebuild the generated pages so a stale commit can't ship old ones.
      - name: Build guides
        run: npm run website:guides
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.153.0"
          command: deploy
