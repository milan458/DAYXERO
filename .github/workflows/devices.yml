name: Device matrix

# The full-journey UI test (S16.1) on small and large iPhones, iOS 18 and 27, light and dark,
# and the largest text size (S16.2). Screenshots go to a ci-devices-<name> branch per device.
on:
  push:
    branches: [main]
    paths-ignore: ["planning/**", "docs/**", "website/**", "scripts/website/**", "**.md"]
  workflow_dispatch:
    inputs:
      store:
        description: "Instead of the journey: real screens on a 13-inch iPad and iPhone Duo for the App Store set"
        type: boolean
        default: false
      store_legs:
        description: "With store: only these legs, comma-separated (e.g. duo-inner-dark). Empty runs all six."
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  journey:
    if: github.event_name != 'workflow_dispatch' || !inputs.store
    # Xcode 27.1 on the Xcode 27 image; iOS 18 only exists on the older image, so that leg builds with Xcode 26.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: small-dark
            devices: "iPhone 17e,iPhone 17"
            runtime: newest
            runner: xcode-27
            xcode: "27.1"
            appearance: dark
            size: large
          - name: large-light
            devices: "iPhone 18 Pro Max,iPhone 17 Pro Max"
            runtime: newest
            runner: xcode-27
            xcode: "27.1"
            appearance: light
            size: large
          - name: ios18-dark
            devices: "iPhone 16,iPhone 16 Pro,iPhone 15"
            runtime: "18"
            runner: macos-15
            xcode: "26"
            appearance: dark
            size: large
          - name: large-ax5
            devices: "iPhone 18 Pro Max,iPhone 17 Pro Max,iPhone 17"
            runtime: newest
            runner: xcode-27
            xcode: "27.1"
            appearance: dark
            size: accessibility-extra-extra-extra-large
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ matrix.xcode }}
        env:
          WANT: ${{ matrix.xcode }}
        run: |
          XCODE=/Applications/Xcode_$WANT.app
          # "26" means the newest Xcode 26 on the older image.
          [ -d "$XCODE" ] || XCODE=$(ls -d /Applications/Xcode_$WANT*.app 2>/dev/null | grep -v -i "beta\|candidate" | sort -V | tail -1)
          if [ -z "$XCODE" ] || [ ! -d "$XCODE" ]; then
            echo "::error title=Xcode $WANT missing::$(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Pick a simulator
        id: sim
        env:
          DEVICES: ${{ matrix.devices }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)["devices"]
          want = os.environ["DEVICES"].split(",")
          major = os.environ["RUNTIME"]
          # Newer images add suffixes to runtime keys (iOS-27-1-iPhone19); read only the version numbers.
          key = lambda k: [int(x) for x in re.match(r"[0-9]+(?:-[0-9]+)*", k.split("iOS-")[1]).group().split("-")]
          rts = sorted([k for k in d if re.search(r"iOS-[0-9]", k)], key=key, reverse=True)
          if major != "newest":
              rts = [k for k in rts if key(k)[0] == int(major)]
          for name in want:
              for rt in rts:
                  for dev in d[rt]:
                      if dev["name"] == name:
                          print(dev["udid"], rt, sep="|"); sys.exit()
          for rt in rts:
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone") and "Duo" not in dev["name"]:
                      print(dev["udid"], rt, sep="|"); sys.exit()
          ')
          if [ -z "$UDID" ]; then
            echo "::warning::No simulator for ${{ matrix.name }} (runtime ${{ matrix.runtime }}) on this runner"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using $UDID"
          echo "udid=${UDID%%|*}" >> "$GITHUB_OUTPUT"

      - name: Set appearance and text size
        if: steps.sim.outputs.skip != 'true'
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance ${{ matrix.appearance }}
          xcrun simctl ui "$UDID" content_size ${{ matrix.size }}

      - name: Run the journey
        if: steps.sim.outputs.skip != 'true'
        # The largest text size reports problems without failing the run.
        continue-on-error: ${{ matrix.name == 'large-ax5' }}
        env:
          TEST_RUNNER_DX_SHOTS: ${{ github.workspace }}/shots
        run: |
          set -o pipefail
          mkdir -p shots
          xcodebuild test \
            -project DayXero.xcodeproj \
            -scheme DayXeroUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath Journey.xcresult \
            -derivedDataPath DerivedData \
            -quiet 2>&1 | tee journey.log

      - name: Report failures
        if: always() && steps.sim.outputs.skip != 'true'
        run: |
          [ -d Journey.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path Journey.xcresult --compact > tests.json 2>&1 || true
          python3 - <<'PY'
          import json
          try:
              data = json.load(open("tests.json"))
          except Exception:
              raise SystemExit
          def walk(node, path=""):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message":
                  print(f"::error title={path}::{name[:900]}")
              for child in node.get("children", []):
                  walk(child, name if node.get("nodeType") == "Test Case" else path)
          for n in data.get("testNodes", []):
              walk(n)
          PY
          grep -E "error:|Test Case .* failed" journey.log | head -20 | sed 's/^/::error::/' || true

      - name: Push screenshots
        if: always() && steps.sim.outputs.skip != 'true'
        run: |
          [ -n "$(ls shots 2>/dev/null)" ] || exit 0
          cd shots
          git init -q -b ci-devices-${{ matrix.name }}
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Journey on ${{ matrix.name }} for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-devices-${{ matrix.name }}

  store-capture:
    # Real app screens on a 13-inch iPad and on iPhone Duo (cover and inner display) for the App Store set
    # (direction E): the journey tests those screenshots use, light, and the Calm tools test dark (frame 7).
    # Screens go to a ci-store-<name> branch per leg. Only when dispatched with store on.
    if: github.event_name == 'workflow_dispatch' && inputs.store
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      HINGE_VERSION: v0.3.0
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: ipad-light
            device: ipad
            posture: none
            appearance: light
            tests: all
          - name: ipad-dark
            device: ipad
            posture: none
            appearance: dark
            tests: calm
          - name: duo-cover-light
            device: duo
            posture: cover
            appearance: light
            tests: all
          - name: duo-cover-dark
            device: duo
            posture: cover
            appearance: dark
            tests: calm
          - name: duo-inner-light
            device: duo
            posture: inner
            appearance: light
            tests: all
          - name: duo-inner-dark
            device: duo
            posture: inner
            appearance: dark
            tests: calm
    steps:
      - name: Is this leg asked for
        id: leg
        env:
          LEGS: ${{ inputs.store_legs }}
        run: |
          if [ -z "$LEGS" ] || [[ ",${LEGS// /}," == *",${{ matrix.name }},"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=${{ matrix.name }}::Not asked for this run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.leg.outputs.run == 'true'

      - name: Select Xcode 27.1
        if: steps.leg.outputs.run == 'true'
        run: |
          XCODE=/Applications/Xcode_27.1.app
          if [ ! -d "$XCODE" ]; then
            echo "::error title=Xcode 27.1 missing::This runner has no $XCODE"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install tools
        if: steps.leg.outputs.run == 'true'
        run: |
          brew install xcodegen
          if [ "${{ matrix.device }}" = "duo" ]; then
            git clone -q --depth 1 --branch "$HINGE_VERSION" https://github.com/artemnovichkov/hinge.git "$RUNNER_TEMP/hinge"
            echo "$RUNNER_TEMP/hinge/bin" >> "$GITHUB_PATH"
          fi

      - name: Generate project
        if: steps.leg.outputs.run == 'true'
        run: xcodegen generate

      - name: Pick a simulator
        if: steps.leg.outputs.run == 'true'
        id: sim
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)["devices"]
          key = lambda k: [int(x) for x in re.match(r"[0-9]+(?:-[0-9]+)*", k.split("iOS-")[1]).group().split("-")]
          rts = sorted([k for k in d if re.search(r"iOS-[0-9]", k)], key=key, reverse=True)
          if os.environ["DEVICE"] == "duo":
              want = [lambda n: n == "iPhone Duo"]
          else:
              # The 13-inch class (2064 x 2752): newest iPad Pro first, then iPad Air 13-inch.
              want = [lambda n: n.startswith("iPad Pro 13-inch (M5)"), lambda n: n.startswith("iPad Pro 13-inch"),
                      lambda n: n.startswith("iPad Air 13-inch")]
          for ok in want:
              for rt in rts:
                  for dev in d[rt]:
                      if ok(dev["name"]):
                          print(dev["udid"], dev["name"], rt, sep="|"); sys.exit()
          ')
          if [ -z "$UDID" ]; then
            echo "::error title=No simulator::No ${{ matrix.device }} simulator on this runner"
            xcrun simctl list devices available | grep -iE "ipad|duo" | head -20
            exit 1
          fi
          echo "Using $UDID"
          echo "udid=${UDID%%|*}" >> "$GITHUB_OUTPUT"

      - name: Boot, appearance and posture
        if: steps.leg.outputs.run == 'true'
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance ${{ matrix.appearance }}
          xcrun simctl ui "$UDID" content_size large
          if [ "${{ matrix.posture }}" = "cover" ]; then
            export HINGE_DEVICE="$UDID"
            hinge close; hinge orient portrait; sleep 3; hinge posture
          elif [ "${{ matrix.posture }}" = "inner" ]; then
            # As store-screens.yml: the inner display is tall (2007 x 2853) with the phone turned on its side.
            export HINGE_DEVICE="$UDID"
            hinge open; hinge orient landscape-left; sleep 3; hinge posture
          fi

      - name: Run the journey tests the screenshots use
        if: steps.leg.outputs.run == 'true'
        # The journey was written for iPhone; a failure here still keeps the screens taken before it.
        continue-on-error: true
        env:
          TEST_RUNNER_DX_SHOTS: ${{ github.workspace }}/shots
          TEST_RUNNER_DX_HOST_SHOTS: ${{ matrix.posture == 'inner' && '1' || '0' }}
        run: |
          set -o pipefail
          mkdir -p shots
          if [ "${{ matrix.posture }}" = "inner" ]; then
            # The tests leave <name>.req where they want a shot; hinge takes it from the inner display.
            export HINGE_DEVICE="${{ steps.sim.outputs.udid }}"
            (
              while true; do
                for r in shots/*.req; do
                  [ -e "$r" ] || continue
                  hinge screenshot "${r%.req}.png" > /dev/null 2>&1 || echo "::warning::No inner-display shot for $(basename "$r")"
                  rm -f "$r"
                done
                sleep 0.3
              done
            ) &
            WATCH=$!
            trap 'kill $WATCH 2>/dev/null || true' EXIT
          fi
          T=DayXeroUITests/JourneyUITests
          if [ "${{ matrix.tests }}" = "calm" ]; then
            ONLY="-only-testing:$T/testEveryCalmToolOpens -only-testing:$T/testStoreWindDown"
          else
            ONLY="-only-testing:$T/testQuitDay -only-testing:$T/testFirstWeekSlip -only-testing:$T/testMaintenance -only-testing:$T/testWaterRowLogsEveryTap -only-testing:$T/testEveryCalmToolOpens -only-testing:$T/testStoreWindDown"
          fi
          xcodebuild test \
            -project DayXero.xcodeproj \
            -scheme DayXeroUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            $ONLY \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath Journey.xcresult \
            -derivedDataPath DerivedData \
            -quiet 2>&1 | tee journey.log

      - name: Report failures and sizes
        if: always() && steps.leg.outputs.run == 'true'
        run: |
          grep -E "error:|Test Case .* failed" journey.log | head -20 | sed 's/^/::warning::/' || true
          if [ -d Journey.xcresult ]; then
            xcrun xcresulttool get test-results tests --path Journey.xcresult --compact > tests.json 2>&1 || true
            python3 - <<'PY2'
          import json
          try:
              data = json.load(open("tests.json"))
          except Exception:
              raise SystemExit
          def walk(node, path=""):
              if node.get("nodeType") == "Failure Message":
                  print(f"::warning title={path}::{node.get('name', '')[:900]}")
              for child in node.get("children", []):
                  walk(child, node.get("name", "") if node.get("nodeType") == "Test Case" else path)
          for n in data.get("testNodes", []):
              walk(n)
          PY2
          fi
          for f in shots/*.png; do
            [ -f "$f" ] || continue
            echo "$(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf "%s ", $2}') $(basename "$f")"
          done | sort | uniq -c -w 10 | head -5
          echo "::notice title=${{ matrix.name }}::$(ls shots 2>/dev/null | wc -l | tr -d ' ') screenshots"

      - name: Push screenshots
        if: always() && steps.leg.outputs.run == 'true'
        run: |
          [ -n "$(ls shots 2>/dev/null)" ] || exit 0
          cd shots
          git init -q -b ci-store-${{ matrix.name }}
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Store captures on ${{ matrix.name }} for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-store-${{ matrix.name }}
