name: Device matrix

# The full-journey UI test (S16.1) on small and large iPhones, iOS 18 and 26, light and dark,
# and the largest text size (S16.2). Screenshots go to a ci-devices-<name> branch per device.
on:
  push:
    branches: [main]
    paths-ignore: ["planning/**", "docs/**", "website/**", "scripts/website/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devices-${{ github.ref }}
  cancel-in-progress: false

jobs:
  journey:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: small-dark
            devices: "iPhone SE (3rd generation),iPhone 16e,iPhone 17"
            runtime: newest
            appearance: dark
            size: large
          - name: large-light
            devices: "iPhone 17 Pro Max,iPhone 16 Pro Max,iPhone 16 Plus"
            runtime: newest
            appearance: light
            size: large
          - name: ios18-dark
            devices: "iPhone 16,iPhone 16 Pro,iPhone 15"
            runtime: "18"
            appearance: dark
            size: large
          - name: large-ax5
            devices: "iPhone 17 Pro Max,iPhone 16 Pro Max,iPhone 17"
            runtime: newest
            appearance: dark
            size: accessibility-extra-extra-extra-large
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Pick a simulator
        id: sim
        env:
          DEVICES: ${{ matrix.devices }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          d = json.load(sys.stdin)["devices"]
          want = os.environ["DEVICES"].split(",")
          major = os.environ["RUNTIME"]
          key = lambda k: [int(x) for x in k.split("iOS-")[1].split("-")]
          rts = sorted([k for k in d if "iOS-" in k], key=key, reverse=True)
          if major != "newest":
              rts = [k for k in rts if key(k)[0] == int(major)]
          for name in want:
              for rt in rts:
                  for dev in d[rt]:
                      if dev["name"] == name:
                          print(dev["udid"], rt, sep="|"); sys.exit()
          for rt in rts:
              for dev in d[rt]:
                  if dev["name"].startswith("iPhone"):
                      print(dev["udid"], rt, sep="|"); sys.exit()
          ')
          if [ -z "$UDID" ]; then
            echo "::warning::No simulator for ${{ matrix.name }} (runtime ${{ matrix.runtime }}) on this runner"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Using $UDID"
          echo "udid=${UDID%%|*}" >> "$GITHUB_OUTPUT"

      - name: Set appearance and text size
        if: steps.sim.outputs.skip != 'true'
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance ${{ matrix.appearance }}
          xcrun simctl ui "$UDID" content_size ${{ matrix.size }}

      - name: Run the journey
        if: steps.sim.outputs.skip != 'true'
        # The largest text size reports problems without failing the run.
        continue-on-error: ${{ matrix.name == 'large-ax5' }}
        env:
          TEST_RUNNER_DX_SHOTS: ${{ github.workspace }}/shots
        run: |
          set -o pipefail
          mkdir -p shots
          xcodebuild test \
            -project DayXero.xcodeproj \
            -scheme DayXeroUITests \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath Journey.xcresult \
            -derivedDataPath DerivedData \
            -quiet 2>&1 | tee journey.log

      - name: Report failures
        if: always() && steps.sim.outputs.skip != 'true'
        run: |
          [ -d Journey.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path Journey.xcresult --compact > tests.json 2>&1 || true
          python3 - <<'PY'
          import json
          try:
              data = json.load(open("tests.json"))
          except Exception:
              raise SystemExit
          def walk(node, path=""):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message":
                  print(f"::error title={path}::{name[:900]}")
              for child in node.get("children", []):
                  walk(child, name if node.get("nodeType") == "Test Case" else path)
          for n in data.get("testNodes", []):
              walk(n)
          PY
          grep -E "error:|Test Case .* failed" journey.log | head -20 | sed 's/^/::error::/' || true

      - name: Push screenshots
        if: always() && steps.sim.outputs.skip != 'true'
        run: |
          [ -n "$(ls shots 2>/dev/null)" ] || exit 0
          cd shots
          git init -q -b ci-devices-${{ matrix.name }}
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "Journey on ${{ matrix.name }} for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-devices-${{ matrix.name }}
