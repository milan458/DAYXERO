name: TestFlight

# Archives a Release build and uploads it to TestFlight after main builds and tests green (S16.4).
# Signing goes through the App Store Connect API (scripts/ci/asc_signing.py), with an Admin key stored as repo secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's contents),
#   POSTHOG_API_KEY. (RevenueCat's public key is in Config/Base.xcconfig.)
# Without the secrets it still builds Release, unsigned, so Release-only errors show up.
on:
  workflow_run:
    workflows: ["iOS build and test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only list the builds App Store Connect has"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check secrets
        id: keys
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::App Store Connect key not set; building Release unsigned without uploading."
          fi

      # Built with the iOS 27.1 SDK so the app fills both iPhone Duo displays (S18.12).
      - name: Select Xcode 27.1
        run: |
          XCODE=/Applications/Xcode_27.1.app
          if [ ! -d "$XCODE" ]; then
            echo "::error title=Xcode 27.1 missing::This runner has no $XCODE"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate project
        run: brew install xcodegen && xcodegen generate

      - name: Write keys
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          {
            echo "DX_POSTHOG_API_KEY_RELEASE = $POSTHOG_API_KEY"
            echo 'DX_POSTHOG_HOST = https:/$()/us.i.posthog.com'
          } > Config/Secrets.xcconfig
          if [ -n "$ASC_KEY_P8" ]; then
            # Rebuild the .p8 from its base64 body, so pasted backticks, spaces or lost line breaks don't matter.
            python3 - <<'PY2'
          import os, re, textwrap
          raw = os.environ["ASC_KEY_P8"]
          body = re.sub(r"-----(BEGIN|END) PRIVATE KEY-----", "", raw)
          body = re.sub(r"[^A-Za-z0-9+/=]", "", body)
          kid = os.environ["ASC_KEY_ID"].strip()
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          open(os.path.join(os.environ["RUNNER_TEMP"], f"AuthKey_{kid}.p8"), "w").write(pem)
          print(f"Key body: {len(body)} base64 characters (an App Store Connect key is 200)")
          PY2
          fi

      # Signs a token with the key and asks App Store Connect for the app, so a bad key fails here with a clear reason.
      - name: Check App Store Connect login
        if: steps.keys.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY2'
          import json, os, time, urllib.error, urllib.request, jwt
          kid = os.environ["ASC_KEY_ID"].strip()
          iss = os.environ["ASC_ISSUER_ID"].strip()
          print(f"Key ID: {len(kid)} characters, Issuer ID: {len(iss)} characters")
          key = open(os.path.join(os.environ["RUNNER_TEMP"], f"AuthKey_{kid}.p8")).read()
          now = int(time.time())
          token = jwt.encode({"iss": iss, "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"}, key,
                             algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          url = "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=in.dayxero.app&fields[apps]=name,bundleId"
          try:
              data = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})))
              print("Login OK. Apps:", [a["attributes"] for a in data["data"]])
          except urllib.error.HTTPError as e:
              print(f"::error title=App Store Connect login failed ({e.code})::{e.read().decode().replace(chr(10), ' ')[:600]}")
              raise SystemExit(1)
          # Signing needs the key to manage certificates, identifiers and profiles (Admin role).
          failed = []
          for path in ["bundleIds?limit=1", "certificates?limit=1", "profiles?limit=1"]:
              req = urllib.request.Request(f"https://api.appstoreconnect.apple.com/v1/{path}", headers={"Authorization": f"Bearer {token}"})
              try:
                  urllib.request.urlopen(req)
                  print(f"{path.split('?')[0]}: OK")
              except urllib.error.HTTPError as e:
                  detail = json.loads(e.read() or b"{}").get("errors", [{}])[0].get("detail", "")
                  print(f"{path.split('?')[0]}: {e.code} {detail}")
                  failed.append(f"{path.split('?')[0]} ({e.code})")
          if failed:
              print("::error title=Key can't manage signing::No access to " + ", ".join(failed) + ". Give the key the Admin role in App Store Connect.")
              raise SystemExit(1)
          PY2

      - name: Builds so far
        if: steps.keys.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 scripts/ci/asc_signing.py builds

      - name: Stop after the check
        if: inputs.check_only
        run: exit 0

      - name: Build Release (unsigned)
        if: steps.keys.outputs.ready != 'true'
        run: |
          set -o pipefail
          xcodebuild build -project DayXero.xcodeproj -scheme DayXero -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet 2>&1 | tee release.log

      # xcodebuild's automatic signing rejects the API key, so the certificate and profiles are made through the API.
      # The distribution certificate's .p12 lives in the Actions cache, encrypted with a password derived from the
      # App Store Connect key (fork pull requests can read caches but never get that secret).
      - name: Restore signing certificate
        if: steps.keys.outputs.ready == 'true' && !inputs.check_only
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dist-cache
          key: dist-cert-v1-${{ github.run_id }}
          restore-keys: dist-cert-v1-

      - name: Signing
        if: steps.keys.outputs.ready == 'true' && !inputs.check_only
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -eo pipefail
          P12_PASSWORD=$(cat "$RUNNER_TEMP"/AuthKey_*.p8 | shasum -a 256 | cut -c1-64); echo "::add-mask::$P12_PASSWORD"
          if [ -f "$RUNNER_TEMP/dist-cache/dist.p12" ]; then
            cp "$RUNNER_TEMP/dist-cache/dist.p12" "$RUNNER_TEMP/dist-cache/dist-cert.json" "$RUNNER_TEMP/"
          fi
          P12_PASSWORD=$P12_PASSWORD python3 scripts/ci/asc_signing.py setup
          mkdir -p "$RUNNER_TEMP/dist-cache"
          cp "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/dist-cert.json" "$RUNNER_TEMP/dist-cache/"
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$P12_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$P12_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$P12_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          # The profile says which team the key belongs to and which App Groups the App ID has.
          security cms -D -i "$RUNNER_TEMP/in.dayxero.app.mobileprovision" > "$RUNNER_TEMP/app.plist"
          TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$RUNNER_TEMP/app.plist")
          echo "Team $TEAM"; echo "DX_TEAM=$TEAM" >> "$GITHUB_ENV"
          APP_GROUPS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" "$RUNNER_TEMP/app.plist" 2>/dev/null || true)
          echo "App Groups in profile: $APP_GROUPS"
          if ! echo "$APP_GROUPS" | grep -q "group.in.dayxero.app"; then
            KEYS=$(/usr/libexec/PlistBuddy -c "Print :Entitlements" "$RUNNER_TEMP/app.plist" | tr '\n' ' ' | tr -s ' ')
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/app.plist")
            echo "::error title=Profile entitlements::$NAME → $KEYS"
            echo "::error title=App Group not assigned::Register group.in.dayxero.app at developer.apple.com → Identifiers → App Groups, then add it to the App IDs in.dayxero.app and in.dayxero.app.widgets (App Groups → Configure)."
            exit 1
          fi

      - name: Keep the new signing certificate
        if: env.DX_NEW_CERT != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dist-cache
          key: dist-cert-v1-${{ env.DX_NEW_CERT }}

      - name: Archive
        if: steps.keys.outputs.ready == 'true' && !inputs.check_only
        run: |
          set -o pipefail
          # Build numbers only go up: the UTC time, like the builds already in App Store Connect (202610191728).
          BUILD=$(date -u +%Y%m%d%H%M)
          echo "DX_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "Build $BUILD"
          xcodebuild archive -project DayXero.xcodeproj -scheme DayXero -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/DayXero.xcarchive" \
            -derivedDataPath DerivedData \
            DX_SIGN_STYLE=Manual DX_SIGN_IDENTITY="Apple Distribution" DEVELOPMENT_TEAM="$DX_TEAM" \
            DX_PROFILE_APP="$DX_PROFILE_APP" DX_PROFILE_WIDGETS="$DX_PROFILE_WIDGETS" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/signing.keychain-db" \
            CURRENT_PROJECT_VERSION=$BUILD -quiet 2>&1 | tee release.log

      - name: Upload to TestFlight
        if: steps.keys.outputs.ready == 'true' && !inputs.check_only
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          ASC_KEY_ID=$(echo "$ASC_KEY_ID" | tr -d '[:space:]'); ASC_ISSUER_ID=$(echo "$ASC_ISSUER_ID" | tr -d '[:space:]')
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>$DX_TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>in.dayxero.app</key><string>$DX_PROFILE_APP</string>
              <key>in.dayxero.app.widgets</key><string>$DX_PROFILE_WIDGETS</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/DayXero.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" 2>&1 | tee -a release.log
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa)
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8" ~/.appstoreconnect/private_keys/
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee altool.log
          cat altool.log >> release.log
          grep -iE "error|fail|invalid" altool.log | grep -viE "no errors|UPLOAD SUCCEEDED" | head -20 | sed 's/^/::error title=altool::/' || true
          grep -iE "UPLOAD SUCCEEDED|No errors uploading|Delivery UUID" altool.log | head -5 | sed 's/^/::notice title=altool::/' || true
          # altool can exit 0 without uploading, so wait for App Store Connect to list the build.
          python3 scripts/ci/asc_signing.py wait $DX_BUILD

      - name: Annotate errors
        if: failure()
        run: |
          grep -E "error:|ERROR|failed" release.log | sort -u | head -40 | sed 's/^/::error::/' || true

      # Deletes this run's profiles. The certificate is kept for the next run.
      - name: Clean up signing
        if: always() && steps.keys.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 scripts/ci/asc_signing.py cleanup || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/dist.p12 "$RUNNER_TEMP"/dist-cache ~/.appstoreconnect Config/Secrets.xcconfig
