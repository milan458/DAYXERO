# XcodeGen spec. Generate the project with: xcodegen generate
name: DayXero
options:
  bundleIdPrefix: in.dayxero
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 6DJM927Z95
    # Automatic locally; CI's TestFlight job signs manually (see Config/Base.xcconfig).
    CODE_SIGN_STYLE: $(DX_SIGN_STYLE)
    CODE_SIGN_IDENTITY: $(DX_SIGN_IDENTITY)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only in v1
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: "5.0.0"
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.0.0"

targets:
  DayXeroCore:
    type: framework
    platform: iOS
    sources:
      - path: DayXeroCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.dayxero.app.core
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  DayXero:
    type: application
    platform: iOS
    sources:
      - path: DayXero
      - path: Intents
    dependencies:
      - target: DayXeroCore
      - target: DayXeroWidgets
      - package: RevenueCat
      - package: PostHog
    entitlements:
      path: DayXero/DayXero.entitlements
      properties:
        com.apple.security.application-groups: [group.in.dayxero.app]
    info:
      path: DayXero/Info.plist
      properties:
        CFBundleDisplayName: DayXero
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: in.dayxero.app
            CFBundleURLSchemes: [dayxero]
        ITSAppUsesNonExemptEncryption: false
        DXRevenueCatAPIKey: $(DX_REVENUECAT_API_KEY)
        DXPostHogAPIKey: $(DX_POSTHOG_API_KEY)
        DXPostHogHost: $(DX_POSTHOG_HOST)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.dayxero.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PROVISIONING_PROFILE_SPECIFIER: $(DX_PROFILE_APP)
        CODE_SIGN_IDENTITY: $(DX_SIGN_IDENTITY)
        CODE_SIGN_STYLE: $(DX_SIGN_STYLE)
      configs:
        # Keys come from Config/Secrets.xcconfig; analytics only in Release.
        Debug:
          DX_POSTHOG_API_KEY: ""
        Release:
          DX_POSTHOG_API_KEY: $(DX_POSTHOG_API_KEY_RELEASE)

  DayXeroWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: DayXeroWidgets
      - path: Intents
    dependencies:
      - target: DayXeroCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: DayXeroWidgets/DayXeroWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.in.dayxero.app]
    info:
      path: DayXeroWidgets/Info.plist
      properties:
        CFBundleDisplayName: DayXero
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.dayxero.app.widgets
        PROVISIONING_PROFILE_SPECIFIER: $(DX_PROFILE_WIDGETS)
        CODE_SIGN_IDENTITY: $(DX_SIGN_IDENTITY)
        CODE_SIGN_STYLE: $(DX_SIGN_STYLE)

  DayXeroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DayXeroTests
    dependencies:
      - target: DayXeroCore
      - target: DayXero
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: in.dayxero.app.tests

  DayXeroUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DayXeroUITests
    dependencies:
      - target: DayXero
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: in.dayxero.app.uitests
        TEST_TARGET_NAME: DayXero

schemes:
  DayXero:
    build:
      targets:
        DayXero: all
        DayXeroTests: [test]
    test:
      targets:
        - DayXeroTests
      gatherCoverageData: true
  # The full journey (S16.1), run on several devices by the device-matrix job (S16.2).
  DayXeroUITests:
    build:
      targets:
        DayXero: all
        DayXeroUITests: [test]
    test:
      targets:
        - DayXeroUITests
