<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Lock Screen widgets privacy mode</title>
</head>
<body>
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0E09; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs><filter id="wl-blur"><feGaussianBlur stdDeviation="80"/></filter></defs>
    <circle cx="300" cy="200" r="190" fill="#43511C" fill-opacity="0.8" filter="url(#wl-blur)"/>
    <circle cx="60" cy="640" r="170" fill="#22301E" fill-opacity="0.9" filter="url(#wl-blur)"/>
  </svg>

  <div style="position: relative; margin-top: 74px; display: flex; align-items: center; gap: 6px; font-size: 19px; font-weight: 600; color: rgba(255,255,255,0.85);">
    <span>Mon 26</span>
    <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="3"/></svg>
    <span>Day 12</span>
  </div>
  <span style="position: relative; font-size: 92px; font-weight: 700; line-height: 1; letter-spacing: -2px; color: rgba(255,255,255,0.92);">12:03</span>

  <div style="position: relative; margin-top: 14px; display: flex; gap: 10px; align-items: center;">
    <div style="width: 158px; height: 72px; box-sizing: border-box; border-radius: 16px; background: rgba(255,255,255,0.14); backdrop-filter: blur(20px); padding: 9px 11px; display: flex; flex-direction: column; justify-content: center; gap: 1px; color: rgba(255,255,255,0.92);">
      <div style="display: flex; align-items: center; gap: 5px;">
        <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.3-7.5 9.8C7.7 19.8 4.5 16.1 4.5 11.5v-6z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/></svg>
        <span style="font-size: 12px; font-weight: 600; opacity: 0.8;">Heads-up</span>
      </div>
      <span style="font-size: 22px; font-weight: 700; line-height: 1.1;">3:00 pm</span>
      <span style="font-size: 12px; font-weight: 500; opacity: 0.75;">in 2h 57m</span>
    </div>

    <a href="#water" aria-label="Water, 6 of 11 glasses. Tap to log one." style="width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,0.14); backdrop-filter: blur(20px); display: flex; align-items: center; justify-content: center; position: relative; text-decoration: none;">
      <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
        <circle cx="36" cy="36" r="25" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round" stroke-dasharray="117.8 157.08" transform="rotate(135 36 36)"/>
        <circle cx="36" cy="36" r="25" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-dasharray="64.2 157.08" transform="rotate(135 36 36)"/>
      </svg>
      <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px;">
        <svg width="10" height="17" viewBox="0 0 10 17" aria-hidden="true"><rect x="0.75" y="0.75" width="8.5" height="15.5" rx="4.25" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><rect x="2.5" y="8" width="5" height="6.5" rx="2.5" fill="#FFFFFF"/></svg>
        <span style="font-size: 13px; font-weight: 700;">6/11</span>
      </div>
    </a>

    <a href="#sos" aria-label="Open DayXero help" style="width: 72px; height: 72px; border-radius: 36px; background: rgba(255,255,255,0.14); backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none;">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="11" fill="none" stroke="#FFFFFF" stroke-width="3.5"/><circle cx="15" cy="15" r="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="7"/></svg>
          </a>
  </div>
</div>
</body>
</html>
