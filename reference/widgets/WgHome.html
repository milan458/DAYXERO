<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Home Screen widgets</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#BCC388}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #10130C; font-family: Inter, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; padding: 72px 13px 0;">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs><filter id="wh-blur"><feGaussianBlur stdDeviation="80"/></filter></defs>
    <circle cx="330" cy="140" r="180" fill="#43511C" fill-opacity="0.8" filter="url(#wh-blur)"/>
    <circle cx="40" cy="620" r="170" fill="#2A3312" fill-opacity="0.9" filter="url(#wh-blur)"/>
    <circle cx="300" cy="780" r="140" fill="#1C2433" fill-opacity="0.9" filter="url(#wh-blur)"/>
  </svg>
  <div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; row-gap: 10px;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 170px; height: 170px; box-sizing: border-box; border-radius: 24px; background: #070806; padding: 16px 18px; display: flex; flex-direction: column; justify-content: center;">
        <span style="font-size: 76px; font-weight: 800; letter-spacing: -3px; line-height: 0.9;">12</span>
        <span style="margin-top: 8px; font-size: 17px; font-weight: 600; color: #BCC388;">Days free</span>
      </div>
      <span style="font-family: -apple-system, system-ui, sans-serif; font-size: 12px; color: rgba(255,255,255,0.85);">DayXero</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 170px; height: 170px; box-sizing: border-box; border-radius: 24px; background: #070806; padding: 14px; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden;">
        <svg width="170" height="120" viewBox="0 0 170 120" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
          <defs>
            <radialGradient id="wh-halo" cx="50%" cy="50%" r="50%"><stop offset="0.3" stop-color="#43511C" stop-opacity="0.5"/><stop offset="1" stop-color="#BCC388" stop-opacity="0"/></radialGradient>
            <filter id="wh-g2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
          </defs>
          <circle cx="85" cy="60" r="58" fill="url(#wh-halo)"/>
          <circle cx="85" cy="60" r="34" fill="none" stroke="#BCC388" stroke-width="12" stroke-opacity="0.5" filter="url(#wh-g2)"/>
          <circle cx="85" cy="60" r="34" fill="none" stroke="#43511C" stroke-width="11"/>
          <circle cx="85" cy="60" r="34" fill="none" stroke="#BCC388" stroke-width="4.5"/>
          <circle cx="85" cy="60" r="33.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.92" stroke-width="1.4"/>
          <circle cx="85" cy="60" r="25" fill="#070A04"/>
          <text x="85" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">SOS</text>
        </svg>
        <div style="flex-grow: 1;"></div>
        <span style="position: relative; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.7);">Craving?</span>
        <a href="#sos" style="position: relative; margin-top: 6px; align-self: stretch; text-decoration: none; height: 34px; border-radius: 17px; background: #BCC388; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">Ride it out</a>
      </div>
      <span style="font-family: -apple-system, system-ui, sans-serif; font-size: 12px; color: rgba(255,255,255,0.85);">DayXero</span>
    </div>

    <div style="grid-column: span 2; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 364px; height: 170px; box-sizing: border-box; border-radius: 24px; background: #070806; padding: 14px 14px 12px 16px; display: flex; flex-direction: column;">
        <div style="display: flex; gap: 14px; flex-grow: 1;">
          <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 92px;">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: #BCC388;">DAY 12</span>
            <span style="margin-top: 6px; font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1;">$84</span>
            <span style="margin-top: 3px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.55);">kept</span>
          </div>
          <div style="width: 1px; background: rgba(255,255,255,0.1);"></div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 2px 0;">
            <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="color: rgba(255,255,255,0.6);">Cravings ridden out</span><span style="font-weight: 600;">31</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="color: rgba(255,255,255,0.6);">Water</span><span style="font-weight: 600;">6 / 11</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="color: rgba(255,255,255,0.6);">Next window</span><span style="font-weight: 600;">3:00 pm</span></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 8px; justify-content: center;">
            <a href="#sos" aria-label="Craving SOS" style="width: 48px; height: 48px; border-radius: 24px; background: #BCC388; display: flex; align-items: center; justify-content: center; text-decoration: none;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 12c2.5-4 5-4 7.5 0s5 4 7.5 0 3.5-3 5-1"/></svg>
            </a>
            <a href="#water" aria-label="Log a glass of water" style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center; text-decoration: none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.5 6-11z"/></svg>
            </a>
          </div>
        </div>
        <div style="margin-top: 10px; padding-top: 10px; border-top: 0.5px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 8px; font-size: 13px;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.6px; color: rgba(255,255,255,0.45);">NEXT</span>
          <span style="font-weight: 600;">Hands and habits</span>
          <span style="color: rgba(255,255,255,0.5);">· 2 min</span>
        </div>
      </div>
      <span style="font-family: -apple-system, system-ui, sans-serif; font-size: 12px; color: rgba(255,255,255,0.85);">DayXero</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 170px; height: 170px; box-sizing: border-box; border-radius: 24px; background: #070806; padding: 14px 14px 14px 12px; display: flex; gap: 20px;">
        <svg width="56" height="142" viewBox="0 0 56 142" role="img" aria-label="Water 6 of 11 glasses">
          <defs>
            <clipPath id="wh-pill"><rect x="2" y="23" width="52" height="96" rx="26"/></clipPath>
            <linearGradient id="wh-liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9EECF"/><stop offset="1" stop-color="#9DA66A"/></linearGradient>
          </defs>
          <g clip-path="url(#wh-pill)">
            <rect x="0" y="0" width="56" height="142" fill="#0C0F08"/>
            <path d="M0 66 Q 7 62 14 66 T 28 66 T 42 66 T 56 66 L 56 142 L 0 142 Z" fill="url(#wh-liq)"/>
            <rect x="9" y="34" width="4" height="64" rx="2" fill="#FFFFFF" fill-opacity="0.18"/>
          </g>
          <rect x="2" y="23" width="52" height="96" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="1.5"/>
        </svg>
        <div style="flex-grow: 1; display: flex; flex-direction: column;">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: rgba(255,255,255,0.5);">WATER</span>
          <div style="flex-grow: 1;"></div>
          <span style="font-size: 34px; font-weight: 800; line-height: 1;">6<span style="margin-left: 4px; font-size: 17px; font-weight: 700; color: rgba(255,255,255,0.5);">/ 11</span></span>
          <span style="font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.55);">glasses</span>
          <a href="#water" aria-label="Log a glass of water" style="margin-top: 10px; text-decoration: none; height: 34px; border-radius: 17px; background: #BCC388; color: #000000; display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 14px; font-weight: 600;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>1</a>
        </div>
      </div>
      <span style="font-family: -apple-system, system-ui, sans-serif; font-size: 12px; color: rgba(255,255,255,0.85);">DayXero</span>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 170px; height: 170px; box-sizing: border-box; border-radius: 24px; background: #070806; padding: 14px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.3-7.5 9.8C7.7 19.8 4.5 16.1 4.5 11.5v-6z" fill="#43511C" fill-opacity="0.5" stroke="#BCC388" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="11.5" r="3.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.3"/></svg>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: rgba(255,255,255,0.5);">NEXT WINDOW</span>
        </div>
        <div style="flex-grow: 1;"></div>
        <span style="font-size: 34px; font-weight: 800; letter-spacing: -1px; line-height: 1;">3:00<span style="font-size: 16px; color: rgba(255,255,255,0.5);"> pm</span></span>
        <span style="margin-top: 2px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.55);">After lunch · in 2h 40m</span>
        <a href="#guard" style="margin-top: 10px; text-decoration: none; height: 34px; border-radius: 17px; background: rgba(188,195,136,0.16); border: 1px solid rgba(188,195,136,0.5); color: #BCC388; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600;">Guard it</a>
      </div>
      <span style="font-family: -apple-system, system-ui, sans-serif; font-size: 12px; color: rgba(255,255,255,0.85);">DayXero</span>
    </div>

  </div>
</div>
</body>
</html>
