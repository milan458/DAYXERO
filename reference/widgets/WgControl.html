<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Control Center controls</title>
</head>
<body>
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0A0C08; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 80px 24px 0;">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs><filter id="wc-blur"><feGaussianBlur stdDeviation="90"/></filter></defs>
    <circle cx="280" cy="220" r="200" fill="#43511C" fill-opacity="0.55" filter="url(#wc-blur)"/>
    <circle cx="60" cy="560" r="180" fill="#26303A" fill-opacity="0.8" filter="url(#wc-blur)"/>
  </svg>

  <span style="position: relative; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; color: rgba(255,255,255,0.55);">CONTROL CENTER · DAYXERO CONTROLS</span>
  <div style="position: relative; margin-top: 16px; display: grid; grid-template-columns: repeat(4, 72px); grid-auto-rows: 72px; gap: 14px; justify-content: space-between;">

    <a href="#sos" style="grid-column: span 2; text-decoration: none; border-radius: 36px; background: #BCC388; color: #000000; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 12px;">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(0,0,0,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 12c2.5-4 5-4 7.5 0s5 4 7.5 0 3.5-3 5-1"/></svg>
      </span>
      <span style="display: flex; flex-direction: column;">
        <span style="font-size: 15px; font-weight: 600;">Craving SOS</span>
        <span style="font-size: 12px; opacity: 0.65;">DayXero</span>
      </span>
    </a>

    <a href="#water" aria-label="Log a glass of water" style="text-decoration: none; border-radius: 36px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="28" viewBox="0 0 16 28" aria-hidden="true"><rect x="1" y="1" width="14" height="26" rx="7" fill="none" stroke="#FFFFFF" stroke-width="2"/><rect x="4" y="13" width="8" height="11" rx="4" fill="#FFFFFF"/></svg>
    </a>

    <a href="#breathe" aria-label="Start breathing" style="text-decoration: none; border-radius: 36px; background: rgba(255,255,255,0.14); display: flex; align-items: center; justify-content: center;">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="11" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="7"/><circle cx="15" cy="15" r="11" fill="none" stroke="#FFFFFF" stroke-width="2.5"/></svg>
    </a>

    <a href="#guard" style="grid-column: span 2; text-decoration: none; border-radius: 36px; background: rgba(255,255,255,0.14); display: flex; align-items: center; gap: 10px; padding: 0 16px 0 12px;">
      <span style="width: 48px; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.3-7.5 9.8C7.7 19.8 4.5 16.1 4.5 11.5v-6z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </span>
      <span style="display: flex; flex-direction: column;">
        <span style="font-size: 15px; font-weight: 600;">Guard 30 min</span>
        <span style="font-size: 12px; opacity: 0.6;">DayXero</span>
      </span>
    </a>
  </div>
  <div style="position: relative; margin-top: 8px; display: grid; grid-template-columns: repeat(4, 72px); justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.6); text-align: center;">
    <span></span><span></span><span>Log water</span><span>Breathe</span>
  </div>

  <span style="position: relative; margin-top: 56px; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; color: rgba(255,255,255,0.55);">LOCK SCREEN BUTTON · SWAPS IN FOR THE TORCH</span>
  <div style="position: relative; margin-top: 16px; height: 300px; border-radius: 40px; background: #12160E; overflow: hidden;">
    <svg width="342" height="300" viewBox="0 0 342 300" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
      <defs><filter id="wc-b2"><feGaussianBlur stdDeviation="50"/></filter></defs>
      <circle cx="260" cy="60" r="140" fill="#43511C" fill-opacity="0.7" filter="url(#wc-b2)"/>
    </svg>
    <a href="#sos" aria-label="Craving SOS" style="position: absolute; left: 34px; bottom: 34px; width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.18); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 12c2.5-4 5-4 7.5 0s5 4 7.5 0 3.5-3 5-1"/></svg>
    </a>
    <span style="position: absolute; right: 34px; bottom: 34px; width: 52px; height: 52px; border-radius: 26px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    </span>
    <span style="position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center;"><span style="width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.8);"></span></span>  </div>
</div>
</body>
</html>
