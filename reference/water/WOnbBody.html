<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Onboarding your body</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#000000}
button{font:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; font-family: Inter, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 60px 24px 34px;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <button aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden;"><div style="width: 58%; height: 4px; background: #BCC388;"></div></div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5);">7/12</span>
  </div>
  <span style="margin-top: 34px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #BCC388;">YOUR WATER GOAL</span>
  <span style="margin-top: 8px; font-size: 30px; font-weight: 800; line-height: 1.12; letter-spacing: -0.6px;">A few basics so we can size your goal.</span>
  <div role="radiogroup" aria-label="Units" style="margin-top: 22px; align-self: flex-start; display: flex; padding: 3px; border-radius: 999px; background: rgba(255,255,255,0.08);">
    <button role="radio" aria-checked="true" style="height: 34px; padding: 0 16px; border-radius: 999px; border: none; background: #FFFFFF; color: #000000; font-size: 13px; font-weight: 600;">cm · kg</button>
    <button role="radio" aria-checked="false" style="height: 34px; padding: 0 16px; border-radius: 999px; border: none; background: transparent; color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 600;">ft · lb</button>
  </div>

  <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.62);">Height</span>
    <div style="display: flex; align-items: baseline; gap: 6px;"><span style="font-size: 48px; font-weight: 800; letter-spacing: -1.4px; line-height: 1;">175</span><span style="font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.5);">cm</span></div>
    <svg width="342" height="54" viewBox="0 0 342 54" role="slider" aria-label="Height" aria-valuenow="175" aria-valuemin="120" aria-valuemax="220" aria-valuetext="175 centimetres" style="margin-top: 8px;">
      <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round">
        <line x1="11" y1="20" x2="11" y2="34"/><line x1="25" y1="24" x2="25" y2="34"/><line x1="39" y1="24" x2="39" y2="34"/><line x1="53" y1="24" x2="53" y2="34"/><line x1="67" y1="24" x2="67" y2="34"/>
        <line x1="81" y1="16" x2="81" y2="34"/><line x1="95" y1="24" x2="95" y2="34"/><line x1="109" y1="24" x2="109" y2="34"/><line x1="123" y1="24" x2="123" y2="34"/><line x1="137" y1="24" x2="137" y2="34"/>
        <line x1="151" y1="16" x2="151" y2="34"/><line x1="165" y1="24" x2="165" y2="34"/><line x1="179" y1="24" x2="179" y2="34"/><line x1="193" y1="24" x2="193" y2="34"/><line x1="207" y1="24" x2="207" y2="34"/>
        <line x1="221" y1="16" x2="221" y2="34"/><line x1="235" y1="24" x2="235" y2="34"/><line x1="249" y1="24" x2="249" y2="34"/><line x1="263" y1="24" x2="263" y2="34"/><line x1="277" y1="24" x2="277" y2="34"/>
        <line x1="291" y1="16" x2="291" y2="34"/><line x1="305" y1="24" x2="305" y2="34"/><line x1="319" y1="24" x2="319" y2="34"/><line x1="333" y1="24" x2="333" y2="34"/>
      </g>
      <line x1="186" y1="8" x2="186" y2="40" stroke="#BCC388" stroke-width="3" stroke-linecap="round"/>
      <text x="81" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" fill-opacity="0.4">160</text>
      <text x="221" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" fill-opacity="0.4">180</text>
      <text x="291" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" fill-opacity="0.4">190</text>
    </svg>
  </div>

  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 4px;">
    <span style="font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.62);">Weight</span>
    <div style="display: flex; align-items: baseline; gap: 6px;"><span style="font-size: 48px; font-weight: 800; letter-spacing: -1.4px; line-height: 1;">72</span><span style="font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.5);">kg</span></div>
    <svg width="342" height="54" viewBox="0 0 342 54" role="slider" aria-label="Weight" aria-valuenow="72" aria-valuemin="35" aria-valuemax="200" aria-valuetext="72 kilograms" style="margin-top: 8px;">
      <g stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.5" stroke-linecap="round">
        <line x1="31" y1="16" x2="31" y2="34"/><line x1="45" y1="24" x2="45" y2="34"/><line x1="59" y1="24" x2="59" y2="34"/><line x1="73" y1="24" x2="73" y2="34"/><line x1="87" y1="24" x2="87" y2="34"/>
        <line x1="101" y1="20" x2="101" y2="34"/><line x1="115" y1="24" x2="115" y2="34"/><line x1="129" y1="24" x2="129" y2="34"/><line x1="143" y1="24" x2="143" y2="34"/><line x1="157" y1="24" x2="157" y2="34"/>
        <line x1="171" y1="16" x2="171" y2="34"/><line x1="185" y1="24" x2="185" y2="34"/><line x1="199" y1="24" x2="199" y2="34"/><line x1="213" y1="24" x2="213" y2="34"/><line x1="227" y1="24" x2="227" y2="34"/>
        <line x1="241" y1="20" x2="241" y2="34"/><line x1="255" y1="24" x2="255" y2="34"/><line x1="269" y1="24" x2="269" y2="34"/><line x1="283" y1="24" x2="283" y2="34"/><line x1="297" y1="24" x2="297" y2="34"/>
        <line x1="311" y1="16" x2="311" y2="34"/><line x1="325" y1="24" x2="325" y2="34"/>
      </g>
      <line x1="199" y1="8" x2="199" y2="40" stroke="#BCC388" stroke-width="3" stroke-linecap="round"/>
      <text x="31" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" fill-opacity="0.4">60</text>
      <text x="171" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" fill-opacity="0.4">70</text>
      <text x="311" y="52" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#FFFFFF" fill-opacity="0.4">80</text>
    </svg>
  </div>

  <div style="margin-top: 22px; display: flex; gap: 10px; align-items: flex-start;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.55); line-height: 1.45;">Only used to estimate your water goal. Stays on your phone. We never show you a BMI score.</span>
  </div>
  <div style="flex-grow: 1;"></div>
  <a href="WOnbDay.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: #BCC388; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Continue</a>
  <a href="#skip" style="margin-top: 10px; text-decoration: none; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.6);">Skip, use 8 glasses</a>
</div>
</body>
</html>
