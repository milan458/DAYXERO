<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Onboarding your day</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#000000}
button{font:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; font-family: Inter, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 60px 24px 34px;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="WOnbBody.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden;"><div style="width: 66%; height: 4px; background: #BCC388;"></div></div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5);">8/12</span>
  </div>
  <span style="margin-top: 34px; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #BCC388;">YOUR WATER GOAL</span>
  <span style="margin-top: 8px; font-size: 30px; font-weight: 800; line-height: 1.12; letter-spacing: -0.6px;">How active is a normal day for you?</span>

  <div role="radiogroup" aria-label="Activity level" style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
    <button role="radio" aria-checked="false" style="text-align: left; padding: 16px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #FFFFFF; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 17px; font-weight: 600;">Mostly sitting</span>
      <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.55);">Desk, studies, driving</span>
    </button>
    <button role="radio" aria-checked="false" style="text-align: left; padding: 16px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #FFFFFF; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 17px; font-weight: 600;">On my feet a lot</span>
      <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.55);">Walking, standing at work</span>
    </button>
    <button role="radio" aria-checked="true" style="text-align: left; padding: 16px 18px; border-radius: 20px; border: 2px solid #BCC388; background: rgba(188,195,136,0.12); color: #FFFFFF; display: flex; align-items: center; gap: 12px;">
      <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1;">
        <span style="font-size: 17px; font-weight: 600;">I work out most days</span>
        <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.62);">Gym, runs, sport, 30+ min</span>
      </span>
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#BCC388"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button role="radio" aria-checked="false" style="text-align: left; padding: 16px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #FFFFFF; display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 17px; font-weight: 600;">Very active</span>
      <span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.55);">Physical job or training hard daily</span>
    </button>
  </div>

  <span style="margin-top: 26px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,0.62);">Where you live, most days are</span>
  <div role="radiogroup" aria-label="Climate" style="margin-top: 10px; display: flex; gap: 10px;">
    <button role="radio" aria-checked="true" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: 2px solid #BCC388; background: rgba(188,195,136,0.12); color: #FFFFFF; font-size: 16px; font-weight: 600;">Mild or cool</button>
    <button role="radio" aria-checked="false" style="flex: 1 1 0; height: 52px; border-radius: 26px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #FFFFFF; font-size: 16px; font-weight: 600;">Hot or humid</button>
  </div>

  <div style="flex-grow: 1;"></div>
  <a href="WOnbGoal.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: #BCC388; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">See my goal</a>
</div>
</body>
</html>
