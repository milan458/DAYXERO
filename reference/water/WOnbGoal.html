<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Onboarding water goal</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#000000}a:hover{color:#000000}
button{font:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #000000; font-family: Inter, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 60px 24px 34px;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="WOnbDay.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden;"><div style="width: 75%; height: 4px; background: #BCC388;"></div></div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.5);">9/12</span>
  </div>

  <div style="margin-top: 26px; display: flex; gap: 20px; align-items: center;">
    <svg width="132" height="232" viewBox="0 0 132 232" role="img" aria-label="Your vessel, full at 2.75 litres">
      <defs>
        <clipPath id="wg-clip"><rect x="6" y="6" width="120" height="220" rx="60"/></clipPath>
        <linearGradient id="wg-liquid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9EECF"/><stop offset="1" stop-color="#9DA66A"/></linearGradient>
        <radialGradient id="wg-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#BCC388" stop-opacity="0.35"/><stop offset="1" stop-color="#BCC388" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse cx="66" cy="120" rx="66" ry="116" fill="url(#wg-glow)"/>
      <g clip-path="url(#wg-clip)">
        <rect x="0" y="0" width="132" height="232" fill="#0C0F08"/>
        <path d="M0 30 C 22 22 44 38 66 30 S 110 22 132 30 L 132 232 L 0 232 Z" fill="url(#wg-liquid)"/>
        <path d="M0 34 C 22 26 44 42 66 34 S 110 26 132 34" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5"/>
        <circle cx="40" cy="170" r="3" fill="#FFFFFF" fill-opacity="0.5"/>
        <circle cx="86" cy="120" r="2.2" fill="#FFFFFF" fill-opacity="0.45"/>
        <circle cx="60" cy="90" r="1.6" fill="#FFFFFF" fill-opacity="0.45"/>
        <rect x="22" y="40" width="9" height="150" rx="4.5" fill="#FFFFFF" fill-opacity="0.22"/>
      </g>
      <rect x="6" y="6" width="120" height="220" rx="60" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2"/>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; color: #BCC388;">YOUR DAILY GOAL</span>
      <span style="font-size: 56px; font-weight: 800; letter-spacing: -2px; line-height: 1;">2.75<span style="font-size: 24px; letter-spacing: 0; color: rgba(255,255,255,0.6);"> L</span></span>
      <span style="font-size: 16px; font-weight: 600; color: rgba(255,255,255,0.7);">about 11 glasses</span>
    </div>
  </div>

  <span style="margin-top: 26px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: rgba(255,255,255,0.5);">HOW WE GOT THERE</span>
  <div style="margin-top: 10px; border-radius: 20px; background: rgba(255,255,255,0.05); padding: 4px 16px; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.1); font-size: 15px;"><span style="color: rgba(255,255,255,0.7);">Base for 72 kg</span><span style="font-weight: 600;">2.38 L</span></div>
    <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 0.5px solid rgba(255,255,255,0.1); font-size: 15px;"><span style="color: rgba(255,255,255,0.7);">Workouts most days</span><span style="font-weight: 600;">+0.35 L</span></div>
    <div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 15px;"><span style="color: rgba(255,255,255,0.7);">Rounded to full glasses</span><span style="font-weight: 600;">2.75 L</span></div>
  </div>

  <div style="margin-top: 16px; display: flex; align-items: center; justify-content: space-between;">
    <span style="font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.7);">Adjust</span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <button aria-label="One glass less" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 22px; font-weight: 600;">−</button>
      <span style="min-width: 64px; text-align: center; font-size: 15px; font-weight: 600;">11 glasses</span>
      <button aria-label="One glass more" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.08); color: #FFFFFF; font-size: 22px; font-weight: 600;">+</button>
    </div>
  </div>

  <span style="margin-top: 16px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.45); line-height: 1.45;">An estimate, not medical advice. If a doctor has told you to limit fluids, use their number instead.</span>
  <div style="flex-grow: 1;"></div>
  <a href="water-pill-preview.html" style="text-decoration: none; height: 56px; border-radius: 28px; background: #BCC388; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600;">Set my goal</a>
</div>
</body>
</html>
