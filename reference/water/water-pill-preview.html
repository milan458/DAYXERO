<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>DayXero water pill — signed-off reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #111; display: flex; justify-content: center; }
  button { font: inherit; cursor: pointer; }
  @keyframes wt-wave  { from { transform: translateX(0); } to { transform: translateX(-260px); } }
  @keyframes wt-wave2 { from { transform: translateX(-260px); } to { transform: translateX(0); } }
  @keyframes wt-bubble { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 100% { transform: translateY(-300px); opacity: 0; } }
  @keyframes wt-float { 0% { transform: translateY(10px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .wt-anim { animation: none !important; } }
  .screen { width: 390px; height: 844px; box-sizing: border-box; background: #000; font-family: Inter, sans-serif; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 60px 24px 30px; position: relative; overflow: hidden; }
  .chip { height: 62px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #fff; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); }
  .chip[aria-checked="true"] { border: 2px solid #BCC388; background: rgba(188,195,136,.12); }
  #fill { position: absolute; left: 0; right: 0; bottom: 0; transition: height 900ms cubic-bezier(0.22, 1, 0.36, 1); }
  #float { position: absolute; top: -10px; right: -64px; font-size: 18px; font-weight: 800; color: #BCC388; opacity: 0; }
  #float.go { animation: wt-float 1.1s ease-out forwards; }
</style>
</head>
<body>
<div class="screen">
  <div style="align-self: stretch; display: flex; justify-content: space-between; align-items: center;">
    <span style="font-size: 28px; font-weight: 800; letter-spacing: -0.5px;">Water</span>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: .6px; color: #BCC388; background: rgba(188,195,136,.12); padding: 6px 10px; border-radius: 999px;">5-DAY STREAK</span>
  </div>

  <div style="margin-top: 18px; display: flex; flex-direction: column; align-items: center; position: relative;">
    <div style="display: flex; align-items: baseline; gap: 6px;">
      <span id="amount" style="font-size: 54px; font-weight: 800; letter-spacing: -2px; line-height: 1;">1.25</span>
      <span id="goal" style="font-size: 20px; font-weight: 600; color: rgba(255,255,255,.55);">/ 2.75 L</span>
    </div>
    <span id="status" style="margin-top: 6px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.6);">5 of 11 glasses</span>
    <span id="float" class="wt-anim"></span>
  </div>

  <div style="margin-top: 18px; position: relative; width: 200px; height: 340px;">
    <div id="glow" style="position: absolute; left: -40px; top: -20px; width: 280px; height: 380px; border-radius: 140px; background: radial-gradient(closest-side, rgba(188,195,136,.22), rgba(188,195,136,0)); opacity: .35; transition: opacity 600ms;"></div>
    <div id="vessel" role="img" aria-label="Water today" style="position: absolute; inset: 0; border-radius: 100px; overflow: hidden; background: #0C0F08;">
      <div id="fill">
        <svg class="wt-anim" width="780" height="28" viewBox="0 0 780 28" aria-hidden="true" style="position: absolute; left: 0; top: -22px; animation: wt-wave2 4.5s linear infinite; opacity: .45;">
          <path class="wave" d="M0 14 Q 32.5 2 65 14 T 130 14 T 195 14 T 260 14 T 325 14 T 390 14 T 455 14 T 520 14 T 585 14 T 650 14 T 715 14 T 780 14 L 780 28 L 0 28 Z"/>
        </svg>
        <svg class="wt-anim" width="780" height="28" viewBox="0 0 780 28" aria-hidden="true" style="position: absolute; left: 0; top: -14px; animation: wt-wave 3s linear infinite;">
          <path class="wave" d="M0 14 Q 32.5 0 65 14 T 130 14 T 195 14 T 260 14 T 325 14 T 390 14 T 455 14 T 520 14 T 585 14 T 650 14 T 715 14 T 780 14 L 780 28 L 0 28 Z"/>
        </svg>
        <span class="wt-anim" style="position: absolute; left: 48px; bottom: 10px; width: 7px; height: 7px; border-radius: 4px; background: rgba(255,255,255,.7); animation: wt-bubble 3.2s ease-in infinite;"></span>
        <span class="wt-anim" style="position: absolute; left: 120px; bottom: 30px; width: 5px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.6); animation: wt-bubble 4.1s ease-in 1.2s infinite;"></span>
        <span class="wt-anim" style="position: absolute; left: 150px; bottom: 6px; width: 4px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.6); animation: wt-bubble 3.6s ease-in 2.1s infinite;"></span>
      </div>
      <div style="position: absolute; left: 26px; top: 40px; width: 12px; height: 230px; border-radius: 6px; background: rgba(255,255,255,.14);"></div>
    </div>
    <div style="position: absolute; inset: 0; border-radius: 100px; border: 2px solid rgba(255,255,255,.75); pointer-events: none;"></div>
    <span style="position: absolute; right: -14px; top: 255px; width: 8px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.35);"></span>
    <span style="position: absolute; right: -14px; top: 170px; width: 8px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.35);"></span>
    <span style="position: absolute; right: -14px; top: 85px;  width: 8px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.35);"></span>
  </div>

  <div id="drinks" role="radiogroup" aria-label="Drink" style="margin-top: 22px; align-self: stretch; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px;"></div>

  <button id="log" style="margin-top: 16px; align-self: stretch; height: 58px; border-radius: 29px; border: none; background: #BCC388; color: #000; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span id="logLabel">Log 250 ml</span>
  </button>
  <button id="undo" style="margin-top: 6px; height: 40px; padding: 0 16px; border: none; background: transparent; color: rgba(255,255,255,.6); font-size: 15px; font-weight: 600;">&nbsp;</button>
</div>

<script>
  const GOAL = 2750;
  const DRINKS = [
    { id: 'glass',     name: 'Glass',     ml: 250, top: '#E9EECF', bottom: '#9DA66A' },
    { id: 'bottle',    name: 'Bottle',    ml: 500, top: '#E9EECF', bottom: '#9DA66A' },
    { id: 'tea',       name: 'Tea',       ml: 300, top: '#EBCB92', bottom: '#A8763A' },
    { id: 'sparkling', name: 'Sparkling', ml: 330, top: '#F3F5E6', bottom: '#BFC79A' }
  ];
  let state = { ml: 1250, drink: 'glass', last: 'glass', history: [] };
  const $ = (id) => document.getElementById(id);
  const fmt = (ml) => (ml / 1000).toFixed(2).replace(/0$/, '');

  function renderDrinks() {
    $('drinks').innerHTML = '';
    DRINKS.forEach((d) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(d.id === state.drink));
      b.innerHTML = '<span style="font-size:14px;font-weight:600">' + d.name + '</span><span style="font-size:12px;font-weight:500;opacity:.65">' + d.ml + ' ml</span>';
      b.onclick = () => { state.drink = d.id; render(); };
      $('drinks').appendChild(b);
    });
  }

  function render() {
    const sel = DRINKS.find((d) => d.id === state.drink);
    const last = DRINKS.find((d) => d.id === state.last);
    const reached = state.ml >= GOAL;
    $('amount').textContent = fmt(state.ml);
    $('goal').textContent = '/ ' + fmt(GOAL) + ' L';
    $('status').textContent = reached ? 'Goal reached. Nice.' : Math.round(state.ml / 250) + ' of ' + Math.round(GOAL / 250) + ' glasses';
    $('status').style.color = reached ? '#BCC388' : 'rgba(255,255,255,.6)';
    $('glow').style.opacity = reached ? 1 : .35;
    $('fill').style.height = Math.min(state.ml / GOAL, 1) * 100 + '%';
    $('fill').style.background = 'linear-gradient(180deg, ' + last.top + ', ' + last.bottom + ')';
    document.querySelectorAll('.wave').forEach((p) => p.setAttribute('fill', last.top));
    $('vessel').setAttribute('aria-label', 'Water today: ' + state.ml + ' of ' + GOAL + ' millilitres');
    $('logLabel').textContent = 'Log ' + sel.ml + ' ml';
    $('undo').innerHTML = state.history.length ? 'Undo last' : '&nbsp;';
    renderDrinks();
  }

  $('log').onclick = () => {
    const sel = DRINKS.find((d) => d.id === state.drink);
    state.history.push({ ml: sel.ml, last: state.last });
    state.ml += sel.ml; state.last = sel.id;
    const f = $('float'); f.textContent = '+' + sel.ml + ' ml';
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
    render();
  };
  $('undo').onclick = () => {
    const prev = state.history.pop(); if (!prev) return;
    state.ml = Math.max(0, state.ml - prev.ml); state.last = prev.last; render();
  };
  render();
</script>
</body>
</html>
