<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Craving heads-up expanded</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#BCC388}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #020302; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 118px;">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs><filter id="nc-bg"><feGaussianBlur stdDeviation="80"/></filter></defs>
    <circle cx="320" cy="180" r="170" fill="#43511C" fill-opacity="0.35" filter="url(#nc-bg)"/>
    <circle cx="60" cy="600" r="150" fill="#2A3312" fill-opacity="0.45" filter="url(#nc-bg)"/>
  </svg>
  <div style="position: relative; width: 358px; box-sizing: border-box; border-radius: 26px; background: rgba(14,16,11,0.92); border: 0.5px solid rgba(255,255,255,0.10); padding: 14px 16px 20px; display: flex; flex-direction: column; align-items: center;">
    <div style="align-self: stretch; display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="9" fill="#000000"/><circle cx="19" cy="19" r="11" fill="none" stroke="#43511C" stroke-width="5"/><circle cx="19" cy="19" r="11" fill="none" stroke="#BCC388" stroke-width="2.4"/><circle cx="19" cy="19" r="7.6" fill="#070A04"/></svg>
      <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.2px; flex-grow: 1;">DAYXERO</span>
      <span style="font-size: 13px; color: rgba(255,255,255,0.45);">now</span>
    </div>
    <span style="align-self: stretch; margin-top: 12px; font-family: Inter, sans-serif; font-size: 20px; font-weight: 800; line-height: 1.2; letter-spacing: -0.3px;">Your 10:30 craving usually shows up soon.</span>
    <span style="align-self: stretch; margin-top: 4px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.62);">Two slow breaths now make the next hour easier.</span>
    <svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Breathing guide, inhale, 4 seconds left, cycle 1 of 2" style="margin-top: 8px;">
      <defs>
        <radialGradient id="nc-halo" cx="50%" cy="50%" r="50%"><stop offset="0.32" stop-color="#43511C" stop-opacity="0.42"/><stop offset="0.76" stop-color="#BCC388" stop-opacity="0.18"/><stop offset="1" stop-color="#BCC388" stop-opacity="0"/></radialGradient>
        <radialGradient id="nc-lens" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#10160A"/><stop offset="0.55" stop-color="#070A04"/><stop offset="0.9" stop-color="#040602"/><stop offset="1" stop-color="#040602" stop-opacity="0"/></radialGradient>
        <filter id="nc-glow1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
        <filter id="nc-glow2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.5"/></filter>
      </defs>
      <circle cx="110" cy="110" r="94" fill="url(#nc-halo)"/>
      <g style="mix-blend-mode: screen;">
        <ellipse cx="110" cy="110" rx="78" ry="75" fill="none" stroke="#BCC388" stroke-width="16" stroke-opacity="0.5" filter="url(#nc-glow1)" transform="rotate(18 110 110)"/>
        <ellipse cx="110" cy="110" rx="78" ry="75" fill="none" stroke="#43511C" stroke-width="14" stroke-opacity="0.75" transform="rotate(18 110 110)"/>
        <ellipse cx="110" cy="110" rx="75" ry="77" fill="none" stroke="#BCC388" stroke-width="7" stroke-opacity="0.65" filter="url(#nc-glow2)" transform="rotate(-24 110 110)"/>
        <ellipse cx="110" cy="110" rx="75" ry="77" fill="none" stroke="#BCC388" stroke-width="6" stroke-opacity="0.6" transform="rotate(-24 110 110)"/>
        <ellipse cx="110" cy="110" rx="74" ry="73" fill="none" stroke="#BCC388" stroke-width="3.5" stroke-opacity="0.9" transform="rotate(40 110 110)"/>
        <ellipse cx="110" cy="110" rx="73" ry="74.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.92" transform="rotate(-62 110 110)"/>
      </g>
      <circle cx="110" cy="110" r="63" fill="url(#nc-lens)"/>
      <text x="110" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="500" fill="#BCC388" fill-opacity="0.85">5 seconds · inhale</text>
      <text x="110" y="124" text-anchor="middle" font-family="Inter, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF">4</text>
      <text x="103" y="146" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="7.5" font-weight="600" letter-spacing="0.4" fill="#FFFFFF" fill-opacity="0.45">CYCLE 1 OF 2</text>
      <rect x="133" y="139" width="2" height="7" rx="1" fill="#BCC388"/>
      <rect x="137" y="141" width="2" height="5" rx="1" fill="#FFFFFF"/>
      <rect x="141" y="138" width="2" height="8" rx="1" fill="#BCC388"/>
      <rect x="145" y="142" width="2" height="4" rx="1" fill="#FFFFFF"/>
    </svg>
    <div style="align-self: stretch; margin-top: 10px; background: #FFFFFF; border-radius: 28px; padding: 11px 12px 11px 16px; display: flex; align-items: center; gap: 10px;">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #000000; flex-shrink: 0;"></span>
      <span style="flex-grow: 1; font-family: Inter, sans-serif; font-size: 12px; font-weight: 600; color: #000000; line-height: 1.35;">Breathe in slowly... let your shoulders drop.</span>
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; color: #000000; background: #BCC388; border-radius: 999px; padding: 4px 8px; flex-shrink: 0;">PACING BREATH</span>
    </div>
  </div>
  <div style="position: relative; width: 358px; margin-top: 10px; border-radius: 16px; background: rgba(30,32,26,0.88); border: 0.5px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; overflow: hidden;">
    <a href="#breathe" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px; border-bottom: 0.5px solid rgba(255,255,255,0.12);">Breathe now <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg></a>
    <a href="#water" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px; border-bottom: 0.5px solid rgba(255,255,255,0.12);">+1 water <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.5 6-11z"/></svg></a>
    <a href="#good" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px;">I'm good <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
  </div>
</div>
</body>
</html>
