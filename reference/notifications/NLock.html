<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Lock screen notification stack</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#BCC388}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #040503; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs><filter id="nl-blur"><feGaussianBlur stdDeviation="70"/></filter></defs>
    <circle cx="320" cy="180" r="170" fill="#43511C" fill-opacity="0.75" filter="url(#nl-blur)"/>
    <circle cx="60" cy="560" r="150" fill="#2A3312" fill-opacity="0.9" filter="url(#nl-blur)"/>
    <circle cx="250" cy="760" r="120" fill="#BCC388" fill-opacity="0.12" filter="url(#nl-blur)"/>
  </svg>
  <span style="position: relative; margin-top: 76px; font-size: 19px; font-weight: 600; color: rgba(255,255,255,0.82);">Monday 26 October</span>
  <span style="position: relative; font-size: 92px; font-weight: 700; line-height: 1; letter-spacing: -2px; color: rgba(255,255,255,0.92);">10:15</span>
  <div style="flex-grow: 1;"></div>

      <svg width="38" height="38" viewBox="0 0 38 38" aria-label="DayXero" role="img" style="flex-shrink: 0;">

        <circle cx="19" cy="19" r="11" fill="none" stroke="#43511C" stroke-width="5"/>

        <circle cx="19" cy="19" r="10.6" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.9"/>
        <circle cx="19" cy="19" r="7.6" fill="#070A04"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
          <span style="font-size: 15px; font-weight: 600;">Craving time soon</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.55);">now</span>
        </div>
        <span style="font-size: 15px; line-height: 1.3; color: rgba(255,255,255,0.88);">Your 10:30 one usually shows up soon. Grab a glass of water and get ahead of it.</span>
      </div>
    </div>
    <div style="display: flex; gap: 11px; padding: 12px 14px; border-radius: 22px; background: rgba(28,30,24,0.62); border: 0.5px solid rgba(255,255,255,0.10); backdrop-filter: blur(30px) saturate(150%);">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-label="DayXero" role="img" style="flex-shrink: 0;">
        <rect width="38" height="38" rx="9" fill="#000000"/>
        <circle cx="19" cy="19" r="11" fill="none" stroke="#43511C" stroke-width="5"/>
        <circle cx="19" cy="19" r="11" fill="none" stroke="#BCC388" stroke-width="2.4"/>
        <circle cx="19" cy="19" r="10.6" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.9"/>
        <circle cx="19" cy="19" r="7.6" fill="#070A04"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
          <span style="font-size: 15px; font-weight: 600;">Day 12</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.55);">8:30</span>
        </div>
        <span style="font-size: 15px; line-height: 1.3; color: rgba(255,255,255,0.88);">Today I stay free because I want to run 5k without stopping.</span>
        <span style="margin-top: 4px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.6px; color: #BCC388;">PLEDGED ✓</span>
      </div>
    </div>
    <div style="display: flex; gap: 11px; padding: 12px 14px; border-radius: 22px; background: rgba(28,30,24,0.62); border: 0.5px solid rgba(255,255,255,0.10); backdrop-filter: blur(30px) saturate(150%);">
      <svg width="38" height="38" viewBox="0 0 38 38" aria-label="DayXero" role="img" style="flex-shrink: 0;">

        <circle cx="19" cy="19" r="10.6" fill="none" stroke="#FFFFFF" stroke-width="0.9" stroke-opacity="0.9"/>
        <circle cx="19" cy="19" r="7.6" fill="#070A04"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
        <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;">
          <span style="font-size: 15px; font-weight: 600;">Day 12 is ready</span>
          <span style="font-size: 13px; color: rgba(255,255,255,0.55);">7:00</span>
        </div>
        <span style="font-size: 15px; line-height: 1.3; color: rgba(255,255,255,0.88);">Hands and habits. 2 min.</span>
      </div>
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex-shrink: 0; align-self: center;">
        <rect width="44" height="44" rx="8" fill="#000000"/>
        <line x1="22" y1="13" x2="22" y2="25" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="22" y1="25" x2="16" y2="34" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="22" y1="25" x2="28" y2="34" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="22" y1="16" x2="15" y2="21" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        <line x1="22" y1="16" x2="30" y2="13" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="22" cy="9" r="4.2" fill="#BCC388" stroke="#FFFFFF" stroke-width="0.8"/>
        <circle cx="32" cy="12" r="2.6" fill="none" stroke="#BCC388" stroke-width="1.2"/>
      </svg>
    </div>
  </div>
</div>

</html>
