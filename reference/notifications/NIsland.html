<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Dynamic Island states</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#BCC388}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1B1E18; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; padding: 28px 10px 0; gap: 22px;">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: rgba(255,255,255,0.5);">BREATHING · COMPACT</span>
    <div style="width: 236px; height: 37px; border-radius: 19px; background: #000000; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 8px; box-sizing: border-box;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-label="Breathing, inhale" role="img"><circle cx="12" cy="12" r="9" fill="none" stroke="#43511C" stroke-width="4.5"/><circle cx="12" cy="12" r="9" fill="none" stroke="#BCC388" stroke-width="2"/><circle cx="12" cy="12" r="8.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.8"/><circle cx="12" cy="12" r="6" fill="#070A04"/></svg>
      <span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif; font-size: 15px; font-weight: 600; color: #BCC388;">in · 0:04</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: rgba(255,255,255,0.5);">CRAVING WINDOW GUARD · COMPACT</span>
    <div style="width: 236px; height: 37px; border-radius: 19px; background: #000000; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 8px; box-sizing: border-box;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-label="Craving window guard" role="img"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.3-7.5 9.8C7.7 19.8 4.5 16.1 4.5 11.5v-6z" fill="none" stroke="#BCC388" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="11.5" r="3.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.4"/></svg>
      <span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif; font-size: 15px; font-weight: 600; color: #BCC388;">until 3:40</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: rgba(255,255,255,0.5);">MINIMAL · NEXT TO ANOTHER APP</span>
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 126px; height: 37px; border-radius: 19px; background: #000000; display: flex; align-items: center; padding-left: 8px; box-sizing: border-box;">
        <span style="width: 22px; height: 22px; border-radius: 11px; background: #3A3D36;" aria-hidden="true"></span>
      </div>
      <div style="width: 37px; height: 37px; border-radius: 19px; background: #000000; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-label="DayXero Day Xero" role="img"><circle cx="12" cy="12" r="8" fill="none" stroke="#BCC388" stroke-width="3"/><circle cx="12" cy="12" r="7.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="0.8"/></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: rgba(255,255,255,0.5);">CRAVING WINDOW GUARD · EXPANDED</span>
    <div style="width: 370px; box-sizing: border-box; border-radius: 44px; background: #000000; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.3-7.5 9.8C7.7 19.8 4.5 16.1 4.5 11.5v-6z" fill="#43511C" fill-opacity="0.5" stroke="#BCC388" stroke-width="1.4" stroke-linejoin="round"/><circle cx="12" cy="11.5" r="3.6" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.2"/></svg>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
          <span style="font-family: Inter, sans-serif; font-size: 16px; font-weight: 800;">Your 3:00 window</span>
          <span style="font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.6);">You've ridden out 6 of these.</span>
        </div>
        <span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif; font-size: 26px; font-weight: 600; color: #BCC388;">18:24</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <a href="#breathe" style="flex: 1 1 0; text-decoration: none; height: 44px; border-radius: 22px; background: #BCC388; color: #000000; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">Breathe</a>
        <a href="#water" style="flex: 1 1 0; text-decoration: none; height: 44px; border-radius: 22px; background: #26291F; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">+1 water</a>
        <a href="#good" style="flex: 1 1 0; text-decoration: none; height: 44px; border-radius: 22px; background: #26291F; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">I'm good</a>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.8px; color: rgba(255,255,255,0.5);">BREATHING · EXPANDED</span>
    <div style="width: 370px; box-sizing: border-box; border-radius: 44px; background: #000000; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 14px;">
        <svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
          <defs><filter id="ni-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs>
          <circle cx="28" cy="28" r="21" fill="none" stroke="#BCC388" stroke-width="8" stroke-opacity="0.45" filter="url(#ni-glow)"/>
          <circle cx="28" cy="28" r="21" fill="none" stroke="#43511C" stroke-width="8"/>
          <circle cx="28" cy="28" r="21" fill="none" stroke="#BCC388" stroke-width="3.5"/>
          <circle cx="28" cy="28" r="20.4" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.2"/>
          <circle cx="28" cy="28" r="15" fill="#070A04"/>
        </svg>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1;">
          <span style="font-family: Inter, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -0.3px;">Breathe in</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.6px; color: rgba(255,255,255,0.5);">DEEP CALM · CYCLE 2 OF 4</span>
        </div>
        <span style="font-family: ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif; font-size: 34px; font-weight: 600; color: #BCC388;">3</span>
      </div>
      <div style="height: 5px; border-radius: 3px; background: rgba(255,255,255,0.12); overflow: hidden;"><div style="width: 38%; height: 5px; border-radius: 3px; background: #BCC388;"></div></div>
      <div style="display: flex; gap: 8px;">
        <a href="#pause" style="flex: 1 1 0; text-decoration: none; height: 44px; border-radius: 22px; background: #26291F; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">Pause</a>
        <a href="#stop" style="flex: 1 1 0; text-decoration: none; height: 44px; border-radius: 22px; background: #26291F; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600;">Stop</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
