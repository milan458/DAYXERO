<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Water reminder expanded</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#BCC388}
button{font:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #020302; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 190px;">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs><filter id="nw-bg"><feGaussianBlur stdDeviation="80"/></filter></defs>
    <circle cx="320" cy="180" r="170" fill="#43511C" fill-opacity="0.35" filter="url(#nw-bg)"/>
    <circle cx="60" cy="600" r="150" fill="#2A3312" fill-opacity="0.45" filter="url(#nw-bg)"/>
  </svg>
  <div style="position: relative; width: 358px; box-sizing: border-box; border-radius: 26px; background: rgba(14,16,11,0.92); border: 0.5px solid rgba(255,255,255,0.10); padding: 14px 16px 20px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="9" fill="#000000"/><circle cx="19" cy="19" r="11" fill="none" stroke="#43511C" stroke-width="5"/><circle cx="19" cy="19" r="11" fill="none" stroke="#BCC388" stroke-width="2.4"/><circle cx="19" cy="19" r="7.6" fill="#070A04"/></svg>
      <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.2px; flex-grow: 1;">DAYXERO</span>
      <span style="font-size: 13px; color: rgba(255,255,255,0.45);">now</span>
    </div>
    <div style="margin-top: 16px; display: flex; align-items: baseline; gap: 8px;">
      <span style="font-family: Inter, sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -1px; line-height: 1;">6</span>
      <span style="font-family: Inter, sans-serif; font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.62);">of 8 glasses</span>
    </div>
    <span style="margin-top: 6px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.62); line-height: 1.4;">Two to go. A glass now also covers your 3:00 craving window.</span>
    <div role="group" aria-label="Today's glasses, 6 of 8 logged. Tap a glass to log it." style="margin-top: 18px; display: flex; justify-content: space-between;">
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M4 4h26l-3 36H7z" fill="#BCC388" fill-opacity="0.9" stroke="#BCC388" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M4 4h26l-3 36H7z" fill="#BCC388" fill-opacity="0.9" stroke="#BCC388" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M4 4h26l-3 36H7z" fill="#BCC388" fill-opacity="0.9" stroke="#BCC388" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M4 4h26l-3 36H7z" fill="#BCC388" fill-opacity="0.9" stroke="#BCC388" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M4 4h26l-3 36H7z" fill="#BCC388" fill-opacity="0.9" stroke="#BCC388" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M4 4h26l-3 36H7z" fill="#BCC388" fill-opacity="0.9" stroke="#BCC388" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M4 4h26l-3 36H7z" fill="#43511C" fill-opacity="0.35" stroke="#BCC388" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="3 3"/><path d="M17 16v12M11 22h12" stroke="#BCC388" stroke-width="1.8" stroke-linecap="round"/></svg>
      <svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M4 4h26l-3 36H7z" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
    <div style="margin-top: 16px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.10); overflow: hidden;"><div style="width: 75%; height: 6px; border-radius: 3px; background: #BCC388;"></div></div>
    <div style="margin-top: 12px; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.6px; color: rgba(255,255,255,0.5);">
      <span>WATER STREAK · 5 DAYS</span>
      <span>LAST · 11:40</span>
    </div>
  </div>
  <div style="position: relative; width: 358px; margin-top: 10px; border-radius: 16px; background: rgba(30,32,26,0.88); border: 0.5px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; overflow: hidden;">
    <a href="#one" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px; border-bottom: 0.5px solid rgba(255,255,255,0.12);">+1 glass <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c3.5 4.5 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 2.5-6.5 6-11z"/></svg></a>
    <a href="#two" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px; border-bottom: 0.5px solid rgba(255,255,255,0.12);">+2 glasses <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4c2.6 3.4 4.5 5.7 4.5 8.3a4.5 4.5 0 0 1-9 0C4.5 9.7 6.4 7.4 9 4z"/><path d="M16 9c2 2.6 3.5 4.4 3.5 6.4a3.5 3.5 0 0 1-7 0"/></svg></a>
    <a href="#later" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px; color: rgba(255,255,255,0.8);">Later <span style="font-size: 15px; color: rgba(255,255,255,0.45);">in 1 hour</span></a>
  </div>
</div>
</body>
</html>
