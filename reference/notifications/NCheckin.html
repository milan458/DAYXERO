<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Evening check-in expanded</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#BCC388}
button{font:inherit}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #020302; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 150px;">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs><filter id="nk-bg"><feGaussianBlur stdDeviation="80"/></filter></defs>
    <circle cx="300" cy="200" r="170" fill="#1E2A3A" fill-opacity="0.6" filter="url(#nk-bg)"/>
    <circle cx="60" cy="600" r="150" fill="#2A3312" fill-opacity="0.45" filter="url(#nk-bg)"/>
  </svg>
  <div style="position: relative; width: 358px; box-sizing: border-box; border-radius: 26px; background: rgba(14,16,11,0.92); border: 0.5px solid rgba(255,255,255,0.10); padding: 14px 16px 18px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="9" fill="#000000"/><circle cx="19" cy="19" r="11" fill="none" stroke="#43511C" stroke-width="5"/><circle cx="19" cy="19" r="11" fill="none" stroke="#BCC388" stroke-width="2.4"/><circle cx="19" cy="19" r="7.6" fill="#070A04"/></svg>
      <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.2px; flex-grow: 1;">DAYXERO</span>
      <span style="font-size: 13px; color: rgba(255,255,255,0.45);">now</span>
    </div>
    <span style="margin-top: 14px; font-family: Inter, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.3px;">How was Day 12?</span>
    <div role="radiogroup" aria-label="How was today" style="margin-top: 14px; display: flex; gap: 8px;">
      <button role="radio" aria-checked="true" style="flex: 1 1 0; height: 48px; border-radius: 24px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; background: #BCC388; color: #000000; border: none;">Good</button><button role="radio" aria-checked="false" style="flex: 1 1 0; height: 48px; border-radius: 24px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; background: rgba(255,255,255,0.06); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.14);">OK</button><button role="radio" aria-checked="false" style="flex: 1 1 0; height: 48px; border-radius: 24px; font-family: Inter, sans-serif; font-size: 15px; font-weight: 600; background: rgba(255,255,255,0.06); color: #FFFFFF; border: 1px solid rgba(255,255,255,0.14);">Rough</button>
    </div>
    <span style="margin-top: 20px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.6px; color: rgba(255,255,255,0.5);">TODAY</span>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="background: rgba(255,255,255,0.05); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: Inter, sans-serif; font-size: 24px; font-weight: 800;">4</span>
        <span style="font-family: Inter, sans-serif; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.62); line-height: 1.3;">cravings ridden out</span>
      </div>
      <div style="background: rgba(255,255,255,0.05); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: Inter, sans-serif; font-size: 24px; font-weight: 800;">7<span style="font-size: 14px; color: rgba(255,255,255,0.45);">/8</span></span>
        <span style="font-family: Inter, sans-serif; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.62); line-height: 1.3;">glasses of water</span>
      </div>
      <div style="background: rgba(188,195,136,0.14); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-family: Inter, sans-serif; font-size: 24px; font-weight: 800; color: #BCC388;">$9.40</span>
        <span style="font-family: Inter, sans-serif; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.62); line-height: 1.3;">kept today</span>
      </div>
    </div>
    <span style="margin-top: 18px; font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.6px; color: rgba(255,255,255,0.5);">CRAVINGS · 6AM TO 9PM</span>
    <svg width="326" height="40" viewBox="0 0 326 40" role="img" aria-label="Four cravings today, at about 8:40, 10:30, 3:10 and 6:50. All ridden out." style="margin-top: 8px;">
      <line x1="2" y1="22" x2="324" y2="22" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round"/>
      <circle cx="58" cy="22" r="6" fill="#BCC388"/>
      <circle cx="102" cy="22" r="7.5" fill="#BCC388"/>
      <circle cx="198" cy="22" r="9" fill="#BCC388"/>
      <circle cx="279" cy="22" r="5.5" fill="#BCC388"/>
      <text x="2" y="38" font-family="JetBrains Mono, monospace" font-size="8" fill="#FFFFFF" fill-opacity="0.4">6AM</text>
      <text x="152" y="38" font-family="JetBrains Mono, monospace" font-size="8" fill="#FFFFFF" fill-opacity="0.4">NOON</text>
      <text x="306" y="38" font-family="JetBrains Mono, monospace" font-size="8" fill="#FFFFFF" fill-opacity="0.4">9PM</text>
    </svg>
    <span style="margin-top: 8px; font-family: Inter, sans-serif; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.62); line-height: 1.4;">Your 3pm one was the strongest. You rode it out in 2 minutes 40.</span>
  </div>
  <div style="position: relative; width: 358px; margin-top: 10px; border-radius: 16px; background: rgba(30,32,26,0.88); border: 0.5px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; overflow: hidden;">
    <a href="#reply" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px;">Add a note… <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></a>
  </div>
</div>
</body>
</html>
