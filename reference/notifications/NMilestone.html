<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Milestone expanded</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#BCC388}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #020302; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #FFFFFF; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; padding-top: 110px;">
  <svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
    <defs><filter id="nm-bg"><feGaussianBlur stdDeviation="80"/></filter></defs>
    <circle cx="300" cy="200" r="170" fill="#43511C" fill-opacity="0.4" filter="url(#nm-bg)"/>
    <circle cx="60" cy="640" r="150" fill="#2A3312" fill-opacity="0.45" filter="url(#nm-bg)"/>
  </svg>
  <div style="position: relative; width: 358px; box-sizing: border-box; border-radius: 26px; background: rgba(14,16,11,0.92); border: 0.5px solid rgba(255,255,255,0.10); padding: 14px 16px 18px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="9" fill="#000000"/><circle cx="19" cy="19" r="11" fill="none" stroke="#43511C" stroke-width="5"/><circle cx="19" cy="19" r="11" fill="none" stroke="#BCC388" stroke-width="2.4"/><circle cx="19" cy="19" r="7.6" fill="#070A04"/></svg>
      <span style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); letter-spacing: 0.2px; flex-grow: 1;">DAYXERO</span>
      <span style="font-size: 13px; color: rgba(255,255,255,0.45);">now</span>
    </div>
    <div style="margin-top: 12px; border-radius: 18px; background: #000000; height: 340px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center;">
      <svg width="326" height="340" viewBox="0 0 326 340" role="img" aria-label="Share card: 30 days nicotine-free" style="position: absolute; left: 0; top: 0;">
        <defs>
          <radialGradient id="nm-halo" cx="50%" cy="50%" r="50%"><stop offset="0.32" stop-color="#43511C" stop-opacity="0.5"/><stop offset="0.76" stop-color="#BCC388" stop-opacity="0.2"/><stop offset="1" stop-color="#BCC388" stop-opacity="0"/></radialGradient>
          <radialGradient id="nm-lens" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#10160A"/><stop offset="0.55" stop-color="#070A04"/><stop offset="0.9" stop-color="#040602"/><stop offset="1" stop-color="#040602" stop-opacity="0"/></radialGradient>
          <filter id="nm-glow1" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
          <filter id="nm-glow2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>
        <circle cx="163" cy="150" r="140" fill="url(#nm-halo)"/>
        <g style="mix-blend-mode: screen;">
          <ellipse cx="163" cy="150" rx="104" ry="100" fill="none" stroke="#BCC388" stroke-width="22" stroke-opacity="0.5" filter="url(#nm-glow1)" transform="rotate(18 163 150)"/>
          <ellipse cx="163" cy="150" rx="104" ry="100" fill="none" stroke="#43511C" stroke-width="20" stroke-opacity="0.8" transform="rotate(18 163 150)"/>
          <ellipse cx="163" cy="150" rx="100" ry="103" fill="none" stroke="#BCC388" stroke-width="10" stroke-opacity="0.65" filter="url(#nm-glow2)" transform="rotate(-24 163 150)"/>
          <ellipse cx="163" cy="150" rx="99" ry="97" fill="none" stroke="#BCC388" stroke-width="5" stroke-opacity="0.9" transform="rotate(40 163 150)"/>
          <ellipse cx="163" cy="150" rx="97" ry="99" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-opacity="0.92" transform="rotate(-62 163 150)"/>
        </g>
        <circle cx="163" cy="150" r="84" fill="url(#nm-lens)"/>
        <text x="163" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#FFFFFF">30</text>
        <text x="163" y="192" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#BCC388">days nicotine-free</text>
        <text x="20" y="318" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" letter-spacing="0.8" fill="#FFFFFF" fill-opacity="0.55">$212 KEPT · 61 CRAVINGS RIDDEN</text>
        <text x="306" y="318" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">dayxero</text>
      </svg>
    </div>
    <span style="margin-top: 14px; font-family: Inter, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.3px;">30 days free!</span>
    <span style="margin-top: 4px; font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.62); line-height: 1.4;">A month ago this felt impossible. Your card is ready if you want to share it.</span>
  </div>
  <div style="position: relative; width: 358px; margin-top: 10px; border-radius: 16px; background: rgba(30,32,26,0.88); border: 0.5px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; overflow: hidden;">
    <a href="#share" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px; border-bottom: 0.5px solid rgba(255,255,255,0.12);">Share <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6h14v-6"/></svg></a>
    <a href="#progress" style="text-decoration: none; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 17px;">See your progress <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BCC388" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg></a>
  </div>
</div>
</body>
</html>
